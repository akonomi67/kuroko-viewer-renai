<script>
const D={"name": "研究所の関係の家は_けんかの技術ではなく相手を知る階から始まっていた", "file": "105_研究所の関係の家は_けんかの技術ではなく相手を知る階から始まっていた", "dur": 810.11665625, "segs": [], "subs": [{"t": 0.0, "x": "仲を直したい時、まずなにを調べるでしょうか。"}, {"t": 3.4166666666666665, "x": "けんかの止め方や上手な謝り方かもしれません。"}, {"t": 6.766666666666667, "x": "本屋に並ぶ夫婦の本も、けんかの\n話から始まるものが多い気がします。"}, {"t": 11.883333333333333, "x": "ところが、ある研究所の見取り図は\n違う所から始まります。"}, {"t": 16.1, "x": "アメリカのゴットマン研究所です。"}, {"t": 18.333333333333332, "x": "夫婦の研究で知られる研究所です。"}, {"t": 20.933333333333334, "x": "研究所は、いい関係を一軒の家にたとえています。"}, {"t": 24.866666666666667, "x": "7つの階と2本の柱でできた家です。"}, {"t": 27.65, "x": "けんかの扱い方は、その家の5階に置かれています。"}, {"t": 31.483333333333334, "x": "いちばん低い1階ではありません。"}, {"t": 33.75, "x": "1階にあるのは、相手を知ることです。"}, {"t": 36.53333333333333, "x": "今日は、その家を1階から屋根まで歩いてみます。"}, {"t": 39.95, "x": "それぞれの階になにが置かれているのか。"}, {"t": 42.53333333333333, "x": "記事に出てくる例と一緒に見ていきます。"}, {"t": 45.06666666666667, "x": "ただし、この家どおりに住めば\n必ず続くという話ではありません。"}, {"t": 49.583333333333336, "x": "自分たちの家に足りない階を\n探すつもりで聞いてみてください。"}, {"t": 53.483333333333334, "x": "まずはよくある考え方から始めます。"}, {"t": 56.13333333333333, "x": "仲がこじれるのは、けんかが下手だからだ。"}, {"t": 59.016666666666666, "x": "そう考える人は多いのではないでしょうか。"}, {"t": 61.88333333333333, "x": "だから、言い方や謝り方を直そうとします。"}, {"t": 65.2, "x": "これはこれで大切なことです。"}, {"t": 67.21666666666667, "x": "けんかの最中の一言で、空気が\n大きく変わることもあります。"}, {"t": 71.6, "x": "ただ、けんかは夫婦の暮らしのほんの一部です。"}, {"t": 74.86666666666666, "x": "朝のあいさつや夕食の会話。"}, {"t": 77.08333333333333, "x": "休日の過ごし方や疲れた日の声のかけ方。"}, {"t": 80.28333333333333, "x": "けんかをしていない時間のほうが、\nずっと長いはずです。"}, {"t": 83.96666666666667, "x": "研究所の家は、その長い時間のほうから\n組み立てられています。"}, {"t": 88.4, "x": "けんかの扱い方は、7つの階のうち5つ目です。"}, {"t": 92.08333333333333, "x": "その手前に4つの階が積まれています。"}, {"t": 94.71666666666667, "x": "けんかの技術を磨く前に、見ておく\n階があるということです。"}, {"t": 98.95, "x": "もちろん5階が大事でないという意味ではありません。"}, {"t": 102.15, "x": "5階も家の大切な一部です。"}, {"t": 104.43333333333334, "x": "ただ、家の中での置き場所が思ったより高いのです。"}, {"t": 108.18333333333334, "x": "その配置を知るだけでも、見える景色が\n少し変わります。"}, {"t": 112.05, "x": "この家のたとえはどこから来たのでしょうか。"}, {"t": 114.68333333333334, "x": "研究所の記事によると、出どころは1冊の本です。"}, {"t": 118.56666666666666, "x": "ゴットマン博士が書いた結婚生活を\n成功させる7つの原則です。"}, {"t": 123.3, "x": "博士はこの本で、安定した関係を家にたとえました。"}, {"t": 127.4, "x": "名前は英語でサウンド・リレーションシップ・\nハウスです。"}, {"t": 130.53333333333333, "x": "ここでは関係の家と呼ぶことにします。"}, {"t": 133.18333333333334, "x": "家には重さを支える柱といくつもの階があります。"}, {"t": 136.76666666666668, "x": "記事は、それぞれが階を積み上げていくものだと\n書いています。"}, {"t": 140.75, "x": "一度建てたら終わりという書き方ではありません。"}, {"t": 143.71666666666667, "x": "2人で少しずつ積んでいく家なのです。"}, {"t": 146.3, "x": "記事によると、このたとえは\n20年以上も夫婦を助けてきました。"}, {"t": 150.9, "x": "気をつけたいのは、これが見取り図だということです。"}, {"t": 154.15, "x": "調べた夫婦の数や、続いた割合の話ではありません。"}, {"t": 158.38333333333333, "x": "少なくとも、この記事にそうした数字は出てきません。"}, {"t": 161.85, "x": "関係を整理するための研究所の考え方の地図です。"}, {"t": 165.73333333333332, "x": "地図だと思って見ると、使い方もはっきりします。"}, {"t": 169.25, "x": "自分たちの家のどこがしっかりしているか。"}, {"t": 171.86666666666667, "x": "どこが薄くなっているか。"}, {"t": 173.5, "x": "それを見比べるための図だと言えそうです。"}, {"t": 176.11666666666667, "x": "この家は友情から始まると紹介されることがあります。"}, {"t": 179.91666666666666, "x": "実は、そこには少し注意が要ります。"}, {"t": 182.66666666666666, "x": "家そのものを説明した研究所の記事を読んでみます。"}, {"t": 186.23333333333332, "x": "すると、友情という言葉は一度も出てきません。"}, {"t": 189.81666666666666, "x": "1階はしっかりした土台だと書かれています。"}, {"t": 192.66666666666666, "x": "相手を知るという土台です。"}, {"t": 194.46666666666667, "x": "では、友情という言葉はどこから来たのでしょう。"}, {"t": 197.8, "x": "研究所のブログにはラブマップに\nついての別の記事があります。"}, {"t": 201.8, "x": "筆者は、研究所が認めたセラピストです。"}, {"t": 204.91666666666666, "x": "結婚の友情は関係の家の土台。"}, {"t": 207.63333333333333, "x": "その記事にはそう書かれています。"}, {"t": 209.73333333333332, "x": "友情は関係を支えるものだとも書いています。"}, {"t": 212.93333333333334, "x": "つまり、友情を土台と呼んだのはこの筆者の\n言葉です。"}, {"t": 216.95, "x": "家の記事は、土台を相手を知ることとして\n説明しています。"}, {"t": 220.96666666666667, "x": "2つの記事は、ぶつかっているわけではありません。"}, {"t": 224.28333333333333, "x": "相手をよく知っていることは、\n友達らしさの中身でもあるからです。"}, {"t": 228.58333333333334, "x": "ただ、どちらの記事の言葉なのかは分けておきます。"}, {"t": 232.05, "x": "この回では、家の記事に書かれた言葉を軸にします。"}, {"t": 235.8, "x": "そのうえで、友情という言い方は\n筆者の見方として扱います。"}, {"t": 240.43333333333334, "x": "ここを押さえてから、1階に入りましょう。"}, {"t": 243.41666666666666, "x": "1階の名前はラブマップを作る、です。"}, {"t": 246.46666666666667, "x": "ラブマップは以前の回で詳しく取り上げました。"}, {"t": 249.46666666666667, "x": "相手の内面の世界を知っていることです。"}, {"t": 252.15, "x": "家の記事は、1階を内面の世界への\n大事な案内図と呼んでいます。"}, {"t": 257.03333333333336, "x": "作り方はよい質問をすることだそうです。"}, {"t": 259.78333333333336, "x": "相手の好きなものと苦手なもの。"}, {"t": 261.98333333333335, "x": "いちばんの親友は誰か。"}, {"t": 263.8, "x": "子どものころは幸せだったか。"}, {"t": 265.8666666666667, "x": "張りつめた日のあと、どう休みたいか。"}, {"t": 268.56666666666666, "x": "記事が目指す姿は誰よりも互いをよく知っている\n2人です。"}, {"t": 272.45, "x": "この回で見たいのは、1階が\n家の中で果たす役目です。"}, {"t": 276.43333333333334, "x": "1階がしっかりしていると、\n2階から先が積みやすくなります。"}, {"t": 280.76666666666665, "x": "たとえば、次の階は相手の好きな所を\n伝えることです。"}, {"t": 284.85, "x": "相手を知らなければ、どこが\n好きかも言葉になりません。"}, {"t": 288.43333333333334, "x": "呼びかけに応えるにも、相手の\n癖を知っているほうが楽です。"}, {"t": 292.5, "x": "相手を知ることはほかの階の\n材料にもなっているのです。"}, {"t": 296.06666666666666, "x": "1階が5階より先に置かれている\n理由も、ここから想像できます。"}, {"t": 300.78333333333336, "x": "相手を知らないままでは、けんかの\n中身を取り違えやすいでしょう。"}, {"t": 305.01666666666665, "x": "2階の名前は好意と敬意を分かち合う、です。"}, {"t": 308.4166666666667, "x": "誰でも自分のよいところを聞きたいもの。"}, {"t": 311.0, "x": "記事はそう書いています。"}, {"t": 312.6, "x": "とくにパートナーからは聞きたい、というのです。"}, {"t": 315.6666666666667, "x": "そこで2階では、相手のいいところを言葉にします。"}, {"t": 319.1666666666667, "x": "記事が挙げる例はユーモアのある所です。"}, {"t": 321.8666666666667, "x": "人を助けようとする所も挙がっています。"}, {"t": 324.5833333333333, "x": "健全な2人は、相手を好きな\n理由を言えると記事は書きます。"}, {"t": 328.9, "x": "大きな理由も小さな理由もです。"}, {"t": 331.31666666666666, "x": "ここで大事なのは、言葉にするという点でしょう。"}, {"t": 334.56666666666666, "x": "心の中で思っているだけでは、相手には届きません。"}, {"t": 338.31666666666666, "x": "長く一緒にいるほど、言わなくても\n分かると思いがちです。"}, {"t": 342.23333333333335, "x": "けれど相手は、言われなければ\n分からないこともあります。"}, {"t": 345.81666666666666, "x": "朝早くからごみを出してくれた。"}, {"t": 347.96666666666664, "x": "親戚の集まりで場をなごませてくれた。"}, {"t": 350.6166666666667, "x": "そうした小さなことを、その日のうちに伝える。"}, {"t": 353.8333333333333, "x": "2階は大げさな贈り物の階ではありません。"}, {"t": 356.8833333333333, "x": "相手のいいところに気づいて、口に出す階です。"}, {"t": 360.1666666666667, "x": "気づくためには、1階で相手を\n知っていることが役に立ちます。"}, {"t": 364.3666666666667, "x": "3階の名前は向き合う、です。"}, {"t": 366.8, "x": "ここで出てくるのが呼びかけという言葉です。"}, {"t": 369.4166666666667, "x": "記事は、注意や支えや慰めを\n求める働きかけだと説明しています。"}, {"t": 374.5, "x": "なにか言うことも、しぐさをすることも呼びかけです。"}, {"t": 377.85, "x": "たとえば、窓の外を見てつぶやく。"}, {"t": 380.46666666666664, "x": "今日は空がきれいだね。"}, {"t": 382.05, "x": "これもちょっとこっちを見て、という\n合図かもしれません。"}, {"t": 385.5, "x": "向き合うとは、その合図に応えることです。"}, {"t": 388.48333333333335, "x": "本当だね、と一緒に外を見る。"}, {"t": 390.9, "x": "それだけでも呼びかけに向き直ったことになります。"}, {"t": 393.9166666666667, "x": "記事は、反対の場合についても書いています。"}, {"t": 397.15, "x": "いつも背を向けていると、関係にとって\n大きな痛手になる。"}, {"t": 401.23333333333335, "x": "さらに悪いのは、呼びかけに\n敵対することだというのです。"}, {"t": 405.05, "x": "今それどころじゃない、とはね返すような返事です。"}, {"t": 408.43333333333334, "x": "1回で関係が壊れるという書き方ではありません。"}, {"t": 411.9, "x": "いつもそうしていると、という点がポイントです。"}, {"t": 415.1166666666667, "x": "小さな呼びかけは1日のうちに繰り返し来ます。"}, {"t": 418.45, "x": "一つひとつへの向きが3階を\n少しずつ厚くしていくのでしょう。"}, {"t": 422.48333333333335, "x": "4階の名前は前向きな見方です。"}, {"t": 424.96666666666664, "x": "記事は、相手のいいところを見る2人を描いています。"}, {"t": 428.56666666666666, "x": "すぐに腹を立てたり、批判したりしない2人です。"}, {"t": 431.93333333333334, "x": "例として朝の玄関の場面が出てきます。"}, {"t": 434.71666666666664, "x": "相手が行ってきますのキスを\nせずに、急いで出ていった。"}, {"t": 438.3333333333333, "x": "ここでどう受け取るかが問われます。"}, {"t": 440.4, "x": "自分のことなんてどうでもいいのだ、と\n思うこともできます。"}, {"t": 444.1333333333333, "x": "記事は、そう決めつけないようにと書いています。"}, {"t": 447.21666666666664, "x": "相手は気を取られていただけかもしれない。"}, {"t": 449.75, "x": "考えごとで頭がいっぱいだったのかもしれない。"}, {"t": 452.81666666666666, "x": "そう受け取ると、同じチームの感覚が強まるそうです。"}, {"t": 456.68333333333334, "x": "4階は、1階から3階の積み重ねと相性がよさそうです。"}, {"t": 461.18333333333334, "x": "相手をよく知っていて、いいところを言葉にしてきた。"}, {"t": 464.6666666666667, "x": "呼びかけにも応えてきた。"}, {"t": 466.3833333333333, "x": "そういう2人なら、すれ違いもいいほうに\n受け取りやすいでしょう。"}, {"t": 470.46666666666664, "x": "逆に、いつも疑ってしまうなら、\n低い階が薄い const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
