<script>
const D={"name": "親密さの中心は_上手な話し方ではなく_分かってもらえたと感じられることだった", "file": "113_親密さの中心は_上手な話し方ではなく_分かってもらえたと感じられることだった", "dur": 802.4, "segs": [], "subs": [{"t": 0.0, "x": "2人の仲を深めるには、話し方を磨くことが大事。"}, {"t": 3.9833333333333334, "x": "そう思っていませんか。"}, {"t": 5.55, "x": "うまい言葉を返す。"}, {"t": 6.983333333333333, "x": "気のきいた話題をふる。"}, {"t": 8.566666666666666, "x": "その場を明るく盛り上げる。"}, {"t": 10.333333333333334, "x": "どれも役に立つことはありそうです。"}, {"t": 12.516666666666667, "x": "でも親密さの研究には、少し違う見取り図が\nあります。"}, {"t": 16.633333333333333, "x": "大事なのは、分かってもらえたと感じられるかどうか。"}, {"t": 20.216666666666665, "x": "そう整理した論文があります。"}, {"t": 22.3, "x": "アメリカのロチェスター大学の\n心理学者ハリー・レイスたちの論文です。"}, {"t": 26.716666666666665, "x": "共著者はマーガレット・クラークとジョン・ホームズ。"}, {"t": 29.566666666666666, "x": "2004年に、親密さの研究を\nまとめた専門書に載りました。"}, {"t": 34.166666666666664, "x": "これは新しい実験の報告ではありません。"}, {"t": 37.166666666666664, "x": "ばらばらに見える研究をまとめ直した論文です。"}, {"t": 40.35, "x": "話し上手になれば必ずうまくいく。"}, {"t": 42.86666666666667, "x": "そういう話ではありません。"}, {"t": 44.75, "x": "分かってあげれば必ず続く、という話でもありません。"}, {"t": 48.6, "x": "親密さがどこから生まれるのかを見直す話です。"}, {"t": 51.88333333333333, "x": "まずは、この論文が書かれたわけです。"}, {"t": 54.55, "x": "恋人や夫婦の研究は、ここ20年ほどで\n大きく広がりました。"}, {"t": 59.3, "x": "そのたびに新しい言葉が生まれてきました。"}, {"t": 62.166666666666664, "x": "新しい測り方も次々に作られました。"}, {"t": 65.16666666666667, "x": "専門誌が出るたびに言葉の数は増えていく。"}, {"t": 68.18333333333334, "x": "論文はそう書いています。"}, {"t": 69.9, "x": "はじめは大きな言葉で調べていました。"}, {"t": 72.55, "x": "満足や愛や親密さといった言葉です。"}, {"t": 75.33333333333333, "x": "やがて、それでは大まかすぎると\n考えられるようになります。"}, {"t": 79.31666666666666, "x": "たとえば愛には数十もの種類が\nあるという研究もあります。"}, {"t": 83.33333333333333, "x": "満足という言葉は大ざっぱすぎると言った\n研究者もいました。"}, {"t": 87.35, "x": "こうして研究はどんどん細かくなっていきました。"}, {"t": 90.46666666666667, "x": "細かく分けること自体は悪いことではありません。"}, {"t": 93.58333333333333, "x": "学問はそうやって進んでいくものです。"}, {"t": 96.16666666666667, "x": "ただ、理論どうしをくらべても、\n見ているところが違うとされがちでした。"}, {"t": 101.05, "x": "でも論文は、大事なものが見えにくくなっていないかと\n問いかけます。"}, {"t": 105.45, "x": "森の木を1本ずつ見分けるのに夢中になる。"}, {"t": 108.38333333333334, "x": "そのうちに、どれも木だということを忘れてしまう。"}, {"t": 111.65, "x": "そんなたとえが使われています。"}, {"t": 113.7, "x": "そこで論文は、多くの研究に共通する芯を探しました。"}, {"t": 118.1, "x": "共通の芯が分かれば、ある研究で\n分かったことを、別の研究にも生かせます。"}, {"t": 123.9, "x": "実際の2人の悩みにも、当てはめやすくなります。"}, {"t": 127.45, "x": "論文が芯として出したのが一つの考え方です。"}, {"t": 130.8, "x": "相手が自分に応えてくれている、という感じ。"}, {"t": 134.13333333333333, "x": "中身はこうです。"}, {"t": 135.38333333333333, "x": "自分にとって大事なところに\n相手が目を向けてくれている。"}, {"t": 138.86666666666667, "x": "そしてそれを支える向きで返してくれている。"}, {"t": 141.66666666666666, "x": "そう信じられるようになっていく流れのことです。"}, {"t": 144.63333333333333, "x": "大事なところとは、たとえば気持ちや願いです。"}, {"t": 147.86666666666667, "x": "困りごとや考え方も入ります。"}, {"t": 150.26666666666668, "x": "論文はこれを3つの言葉で言いあらわしています。"}, {"t": 153.41666666666666, "x": "分かってくれている。"}, {"t": 154.65, "x": "認めてくれている。"}, {"t": 155.91666666666666, "x": "大切にしてくれている。"}, {"t": 157.53333333333333, "x": "ここで一つ注意があります。"}, {"t": 159.41666666666666, "x": "論文は、この感じを親密さそのものとは\n言っていません。"}, {"t": 163.41666666666666, "x": "親密さに近づく道の一つです。"}, {"t": 165.85, "x": "それも大事な道だという位置づけです。"}, {"t": 168.33333333333334, "x": "片ほうだけが相手を思うのとも違います。"}, {"t": 171.08333333333334, "x": "お互いに応えてもらえていると感じる。"}, {"t": 173.6, "x": "そのやりとりの中で親密さが育つと考えるのです。"}, {"t": 177.2, "x": "この感じは、恋人や夫婦だけのものではありません。"}, {"t": 180.88333333333333, "x": "親と子どもでも、応えてもらえることが\n大事だと考えられてきました。"}, {"t": 185.46666666666667, "x": "では、上手に返事をすれば十分なのでしょうか。"}, {"t": 188.88333333333333, "x": "論文は、そうとは限らないと書いています。"}, {"t": 191.86666666666667, "x": "会話の研究で、応えるとは話の\n流れに合った返事をすることでした。"}, {"t": 196.88333333333333, "x": "ところが、きつい批判の言葉も\nこの条件を満たしてしまいます。"}, {"t": 201.03333333333333, "x": "話題に合っていて、タイミングもいい。"}, {"t": 203.61666666666667, "x": "それでも相手を傷つける返事はあります。"}, {"t": 206.38333333333333, "x": "だから話の流れが合うだけでは足りません。"}, {"t": 209.18333333333334, "x": "支えようとする気持ちが要ります。"}, {"t": 211.35, "x": "思いやりも要る。"}, {"t": 212.48333333333332, "x": "論文はそう考えます。"}, {"t": 214.23333333333332, "x": "相手の考えをよく分かっていても同じです。"}, {"t": 217.13333333333333, "x": "その理解を相手を責める材料に使ったらどうでしょう。"}, {"t": 220.58333333333334, "x": "応えてもらえたという感じは生まれにくい。"}, {"t": 223.33333333333334, "x": "論文はそう書いています。"}, {"t": 225.06666666666666, "x": "相手の気持ちが読めること。"}, {"t": 226.95, "x": "それを相手のために使うこと。"}, {"t": 229.05, "x": "この2つは別のものです。"}, {"t": 230.86666666666667, "x": "上手な話し方と応えてもらえる\n感じも同じではないのです。"}, {"t": 234.88333333333333, "x": "夫婦の会話を観察した研究も\n同じ向きを指しています。"}, {"t": 238.81666666666666, "x": "1979年に、心理学者のゴットマンが\n夫婦の話し合いを調べました。"}, {"t": 244.83333333333334, "x": "悩みの少ない夫婦は、困りごとを\n話すときにお互いを認め合っていた。"}, {"t": 249.83333333333334, "x": "悩みの多い夫婦よりも、その傾向が強かったのです。"}, {"t": 253.81666666666666, "x": "そのあとも似た結果がいくつも報告されてきました。"}, {"t": 257.15, "x": "うまくいっている夫婦は、相手の\n不満を身構えずに聞きやすい。"}, {"t": 261.4, "x": "相手の見方への理解を伝えやすい。"}, {"t": 263.8833333333333, "x": "共感も伝えやすい。"}, {"t": 265.43333333333334, "x": "いっぽう悩みの多い夫婦は、\n相手の見方をはねつけやすい。"}, {"t": 269.65, "x": "責めたり取り合わなかったりもしやすいのです。"}, {"t": 272.3833333333333, "x": "そのため夫婦の会話を数える方法の多くに、\n応えるふるまいの項目があります。"}, {"t": 278.1166666666667, "x": "賛成する、受け入れる、といったふるまいです。"}, {"t": 281.6333333333333, "x": "もう一つ論文がそえている点があります。"}, {"t": 284.3333333333333, "x": "認めてもらえないつらさは、認めてもらえる\nうれしさより強く効くらしい。"}, {"t": 289.05, "x": "ただし調べ方に限りがあります。"}, {"t": 291.3333333333333, "x": "まだはっきりとは言えない、とも書いています。"}, {"t": 294.28333333333336, "x": "夫婦の相談の場でも、この考えが生かされています。"}, {"t": 298.01666666666665, "x": "多くの相談の方法は、上手に\n返す力を伸ばすだけではありません。"}, {"t": 302.85, "x": "相手が応えようとしていることに、\n気づけるようにもするのです。"}, {"t": 306.9166666666667, "x": "では、自分のことを打ち明けるのはどうでしょう。"}, {"t": 310.03333333333336, "x": "レイスは1988年に、共同研究者と\n親密さの見取り図を出していました。"}, {"t": 316.28333333333336, "x": "自分のことを話したとき、相手の返事をどう感じるか。"}, {"t": 320.2, "x": "分かってくれた。"}, {"t": 321.25, "x": "認めてくれた。"}, {"t": 322.3333333333333, "x": "大切にしてくれた。"}, {"t": 323.76666666666665, "x": "そう感じたときに親密さが生まれる、という考えです。"}, {"t": 327.71666666666664, "x": "そのあとの研究で、応えてもらえた感じが\n親密さの中心にあると示されました。"}, {"t": 333.51666666666665, "x": "打ち明けることそのものよりも、\n少し大きく関わっていたのです。"}, {"t": 337.81666666666666, "x": "ほめ言葉についてもおもしろい実験があります。"}, {"t": 340.81666666666666, "x": "ほめる人が、相手の本当の姿を\n思い違いしていた場合です。"}, {"t": 345.1666666666667, "x": "いくら高くほめられても、その人を\n好きになる気持ちは弱まりました。"}, {"t": 349.6666666666667, "x": "また一緒に話したいという気持ちも弱まったのです。"}, {"t": 352.9166666666667, "x": "別の実験もあります。"}, {"t": 354.5833333333333, "x": "成果をほめられること。"}, {"t": 356.21666666666664, "x": "その人らしさを好かれること。"}, {"t": 358.1, "x": "身構える気持ちが和らいだのは、\nその人らしさを好かれたほうでした。"}, {"t": 362.48333333333335, "x": "ほめ方が上手でも、届くとは限らないのです。"}, {"t": 365.8, "x": "次は支えの研究です。"}, {"t": 367.65, "x": "これまでの研究で、くり返し出てきた結果があります。"}, {"t": 371.53333333333336, "x": "困ったときに周りが支えてくれると思えること。"}, {"t": 374.73333333333335, "x": "それが心と体の健やかさと、\nいちばん安定して結びついていました。"}, {"t": 379.7, "x": "実際に支えを受けた量よりも、です。"}, {"t": 382.55, "x": "また支えは、そのとき困っていることに\n合っているほど、役に立ちやすいという"}, {"t": 387.81666666666666, "x": "考えもあります。"}, {"t": 388.95, "x": "さらに、変わった結果もあります。"}, {"t": 391.4, "x": "弁護士になるための試験を控えた人たちを\n調べた研究です。"}, {"t": 395.45, "x": "本人が気づかない支えは不安を和らげていました。"}, {"t": 398.8833333333333, "x": "いっぽう本人が気づいた支えは、かえって不安の\n高さと結びついていたのです。"}, {"t": 404.18333333333334, "x": "助けられたと気づくと、自分の\n力を疑ってしまうのかもしれない。"}, {"t": 408.73333333333335, "x": "そう考えた研究者もいます。"}, {"t": 410.9166666666667, "x": "別の研究では、気づかれた支えは\n気分そのものは上げませんでした。"}, {"t": 415.5833333333333, "x": "それでも、支えてくれた相手への良い気持ちは\n高めていました。"}, {"t": 419.76666666666665, "x": "支えは\nただ多ければいいというものではないようです。"}, {"t": 423.0, "x": "どう受け取られるかで、働き方が変わるのです。"}, {"t": 426.23333333333335, "x": "ここで大きな疑問が出てきます。"}, {"t": 428.3666666666667, "x": "応えてもらえている感じは本当のことなのか。"}, {"t": 431.46666666666664, "x": "それとも、感じる人の思い込みなのか。"}, {"t": 434.35, "x": "思い込みに近いことを示す研究もあります。"}, {"t": 437.4, "x": "支えた人と支えられた人の報告は、\nほどほどにしか一致しない。"}, {"t": 441.8666666666667, "x": "そういう研究がいくつもありました。"}, {"t": 444.21666666666664, "x": "支えを感じるかどうかは、経験より性格と\n強く結びつく、とまとめた総説もあります。"}, {"t": 450.6666666666667, "x": "自分に自信の持てない人の研究もあります。"}, {"t": 453.73333333333335, "x": "この人たちは、相手からの好意を\n大きく低く見積もっていました。"}, {"t": 458.1, "x": "付き合いの長い恋人や夫婦でもそうだったのです。"}, {"t": 461.3666666666667, "x": "そして身を守ろうとして、相手から\n距離をとっていました。"}, {"t": 465.01666666666665, "x": "断られることに敏感な人の研究もあります。"}, {"t": 468.26666666666665, "x": "相手が冷たくするのではと先回りして感じる。"}, {"t": 471.4166666666667, "x": "そして強く反応しやすい。"}, {"t": 473.3666666666667, "x": "その反応が相手のきつい態度を引き出してしまう。"}, {"t": 476.55, "x": "思っていたとおりの冷たさが本当に返ってくるのです。"}, {"t": 480.03333333333336, "x": "では、全部が思い込みなのでしょうか。"}, {"t": 482.8, "x": "論文は、そうではないと書いています。"}, {"t": 485.43333333333334, "x": "恋人どうしが悩みを話し合う様子を\nビデオに撮った研究があります。"}, {"t": 490.05, "x": "その様子を見た第三者がふるまいを採点しました。"}, {"t": 493.46666666666664, "x": "すると、支えてもらえた感じは\n実際のふるまいにさかのぼれたのです。"}, {"t": 498.25, "x": "話をよく聞く。"}, {"t": 499.53333333333336, "x": "分かったと伝える。"}, {"t": 500.8333333333333, "x": "そうしたふるまいが多いほど、\n支えられたと感じていました。"}, {"t": 504.8833333333333, "x": "責める、取り合わない、といった\nふるまいが少ないときもそうでした。"}, {"t": 509.35, "x": "悩みをつらいと感じていた人ほど、\n多くの支えを受けていました。"}, {"t": 513.7833333333333, "x": "ただ同じ研究には思い込みの面も出ています。"}, {"t": 517.0166666666667, "x": "関係に満足している人ほど、\n相手の支えを高く採点しました。"}, {"t": 521.7833333333333, "x": "相手を信じている人もそうでした。"}, {"t": 524.0833333333334, "x": "見ていた第三者や支えた本人よりも高くです。"}, {"t": 527.3, "x": "論文のまとめはこうです。"}, {"t": 529.05, "x": "感じ方には本当の芯がある。"}, {"t": 531.3833333333333, "x": "そのまわりを思い込みの殻が包んでいる。"}, {"t": 534.1333333333333, "x": "どちらも大事だ、ということです。"}, {"t": 536.4833333333333, "x": "論文は、応えるとはなにかが\n相手との関係で変わるとも書いています。"}, {"t": 541.25, "x": "愛してる、という一言。"}, {"t": 543.2666666666667, "x": "夫や妻から言われれば、応えてもらえたと\n感じやすいでしょう。"}, {"t": 547.4666666666667, "x": "でもただの知り合いや職場の\n人なら、そうはならないでしょう。"}, {"t": 551.2833333333333, "x": "大事なのは、相手にどれだけ期待しているかです。"}, {"t": 554.5833333333334, "x": "論文は、75歳の誕生日を迎えた\n女性のたとえを出しています。"}, {"t": 559.5666666666667, "x": "小さな花束が3つ届きました。"}, {"t": 561.9166666666666, "x": "一つはたった一人の子どもから。"}, {"t": 564.0, "x": "一つは軽い付き合いの友だちから。"}, {"t": 566.35, "x": "もう一つは越してきたばかりの隣の人からです。"}, {"t": 569.4666666666667, "x": "子どもは物足りないと受け取られやすい。"}, {"t": 571.9, "x": "友だちはちょうどいい心づかい。"}, {"t": 574.0333333333333, "x": "隣の人はとても思いやりがあると受け取られやすい。"}, {"t": 577.3666666666667, "x": "同じ花束でも届き方が違うのです。"}, {"t": 580.1, "x": "論文には、お金の例もあります。"}, {"t": 582.6166666666667, "x": "空港まで送ってもらって、お金を払う。"}, {"t": 585.6, "x": "タクシーの運転手なら、それで当たり前です。"}, {"t": 588.7166666666667, "x": "でも親友にそうしたら、\n応えたことにはならないでしょう。"}, {"t": 592.4166666666666, "x": "いっぽう、離れたいと思っている\n相手から大きな花束が届いたら。"}, {"t": 597.0333333333333, "x": "それは応えたことにはならない、と\n論文は書いています。"}, {"t": 600.8, "x": "その人は、こちらの願いを見ていないからです。"}, {"t": 603.9333333333333, "x": "もう一つ論文が大事にしている点があります。"}, {"t": 606.95, "x": "応えてもらえていないと感じるのは、どんなときか。"}, {"t": 610.3333333333334, "x": "うまくいっているとき、人は\nあまり困りごとを感じません。"}, {"t": 614.1666666666666, "x": "だから相手が冷たいとも思いにくい。"}, {"t": 616.5833333333334, "x": "論文は大学生のたとえを出しています。"}, {"t": 619.3, "x": "毎日が楽しいときは、月に1回電話を\nくれる親を冷たいとは感じにくい。"}, {"t": 624.7833333333333, "x": "でも勉強や人付き合いでつまずいているときは\n違います。"}, {"t": 628.4833333333333, "x": "毎週の電話でも足りないと感じやすいのです。"}, {"t": 631.5, "x": "ただし、困りごとがなくても応えることはできます。"}, {"t": 634.9833333333333, "x": "思いがけない親切。"}, {"t": 636.5333333333333, "x": "気持ちのこもったカードやメール。"}, {"t": 638.5666666666667, "x": "サプライズの贈り物。"}, {"t": 640.1833333333333, "x": "こうしたものは気にかけているという合図になります。"}, {"t": 643.2666666666667, "x": "選んでくれたことも伝わりやすいものです。"}, {"t": 645.8666666666667, "x": "楽しみにしていた劇の券をあきらめる。"}, {"t": 648.4, "x": "そして友だちのピアノの発表会に出かける。"}, {"t": 651.3, "x": "そういうふるまいは、とくに応えていると\n受け取られやすいのです。"}, {"t": 655.3333333333334, "x": "反対に、許されやすい場合もあります。"}, {"t": 658.4833333333333, "x": "おばが、めいの結婚式を欠席したとします。"}, {"t": 661.6666666666666, "x": "ふつうなら、冷たいと受け取られやすいでしょう。"}, {"t": 664.7166666666667, "x": "でも、自分の子どもが重い病気で\n病院にいるなら、許されやすい。"}, {"t": 669.6333333333333, "x": "ほかの大事な関係とくらべて、\n受け取り方が決まるのです。"}, {"t": 673.7, "x": "最後にこの論文の限りです。"}, {"t": 675.8166666666667, "x": "これは新しい実験の報告ではありません。"}, {"t": 678.8166666666667, "x": "たくさんの研究を、一つの考え方で\nまとめ直したものです。"}, {"t": 683.2166666666667, "x": "論文自身も、まだ多くの研究が要ると書いています。"}, {"t": 687.0666666666667, "x": "ある研究の結果については、ほかの\n理由が隠れている可能性にもふれています。"}, {"t": 692.4166666666666, "x": "応えてもらえる感じは、親密さに\n近づく大事な道の一つです。"}, {"t": 697.0833333333334, "x": "でもただ一つの道だとは書いていません。"}, {"t": 699.6333333333333, "x": "文化によって相手への期待の\n度合いが違うかもしれない。"}, {"t": 703.1833333333333, "x": "その点はまだほとんど調べられていない、とも\n書いています。"}, {"t": 707.0666666666667, "x": "そして話し方の工夫に意味がないとも\n言っていません。"}, {"t": 710.4166666666666, "x": "分かってあげれば必ず続く、とも言えません。"}, {"t": 713.5833333333334, "x": "論文が強調するのは、親密さは\n2人で見るものだということです。"}, {"t": 718.1666666666666, "x": "相手をどう思うかだけではありません。"}, {"t": 720.5166666666667, "x": "相手が自分をどう思っていると感じるか。"}, {"t": 723.2, "x": "その両方を見る必要がある、ということです。"}, {"t": 726.5166666666667, "x": "みなさんは、分かってもらえたと感じたとき。"}, {"t": 729.5833333333334, "x": "相手のどんなふるまいが、そう思わせてくれましたか。"}, {"t": 733.05, "x": "よかったらコメントで教えてください。"}, {"t": 735.3833333333333, "x": "今日は、応えてもらえている\n感じという考え方を見てきました。"}, {"t": 739.6833333333333, "x": "親密さの近くにあったのは、\n上手な話し方だけではありませんでした。"}, {"t": 744.5166666666667, "x": "分かってくれた。"}, {"t": 745.5833333333334, "x": "認めてくれた。"}, {"t": 746.65, "x": "大切にしてくれた。"}, {"t": 748.0833333333334, "x": "そう感じられるかどうかが、大事な道の一つでした。"}, {"t": 751.7, "x": "ここからは架空の2人の一場面です。"}, {"t": 754.3166666666667, "x": "付き合って1年になる、そうたとみおの話です。"}, {"t": 757.7166666666667, "x": "みおは仕事で小さな失敗をしました。"}, {"t": 760.3666666666667, "x": "元気のない声で帰ってきます。"}, {"t": 762.4333333333333, "x": "そうたは、うまい励ましの言葉を思いつきません。"}, {"t": 765.8166666666667, "x": "代わりに、今日は\n朝から緊張してたもんね、と言いました。"}, {"t": 770.1, "x": "みおは少しだけ笑ってうなずきました。"}, {"t": 772.5666666666667, "x": "励ましの言葉は、なくてもよかったのかもしれません。"}, {"t": 776.1166666666667, "x": "朝の自分を、そうたが覚えていてくれた。"}, {"t": 779.0833333333334, "x": "それだけで、分かってもらえたと感じられたからです。"}, {"t": 782.4666666666667, "x": "もちろん、いつもこううまくいくとは限りません。"}, {"t": 785.8166666666667, "x": "それでも話し方を磨く前に、\n相手の今日を見ているか。"}, {"t": 789.8, "x": "親密さの研究は、そんな問いを投げかけています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
