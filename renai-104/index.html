<style>

<script>
const D={"name": "つらい話の聞き方だけではなかった_うれしい報告の受け止め方", "file": "104_つらい話の聞き方だけではなかった_うれしい報告の受け止め方", "dur": 813.5333125, "segs": [], "subs": [{"t": 0.0, "x": "大切なのは、つらい話をどう聞くかだ。"}, {"t": 2.9833333333333334, "x": "恋愛や夫婦の話ではよくそう言われます。"}, {"t": 5.966666666666667, "x": "落ちこんだ相手に、どう寄りそうか。"}, {"t": 8.466666666666667, "x": "悩みを打ち明けられたら、どう返すか。"}, {"t": 11.133333333333333, "x": "たしかにどれも大事なことです。"}, {"t": 13.1, "x": "では、うれしい話を聞く場面はどうでしょう。"}, {"t": 16.216666666666665, "x": "相手が、いいことがあったと話してくれた時です。"}, {"t": 19.516666666666666, "x": "2004年に、アメリカで1本の論文が出ました。"}, {"t": 23.1, "x": "題は、うまくいった時あなたは\nどうする、という意味です。"}, {"t": 27.083333333333332, "x": "書いたのは心理学者のシェリー・ゲーブルたちです。"}, {"t": 30.116666666666667, "x": "論文は、良い出来事を人に話す場面を調べました。"}, {"t": 33.983333333333334, "x": "そしてその受け止め具合が、\n関係の指標と結びつくと報告しています。"}, {"t": 38.95, "x": "今日はこの論文を、書いてある範囲で\n読んでいきます。"}, {"t": 42.61666666666667, "x": "こう返せば必ず仲良くなる、という話にはしません。"}, {"t": 46.56666666666667, "x": "数字も論文で確かめられたものだけを使います。"}, {"t": 49.86666666666667, "x": "最近うれしい話をだれかにしたのは、\nいつでしょうか。"}, {"t": 53.61666666666667, "x": "その時の相手の顔を、思い出しながら\n聞いてみてください。"}, {"t": 57.516666666666666, "x": "論文の書き出しはこれまでの研究の振り返りです。"}, {"t": 60.916666666666664, "x": "多くの研究はこう問いかけてきたといいます。"}, {"t": 63.833333333333336, "x": "物事がうまくいかない時、人はどうすればいいのか。"}, {"t": 67.55, "x": "ストレスとの付き合いかた。"}, {"t": 69.18333333333334, "x": "落ちこんだ時の考えかた。"}, {"t": 71.1, "x": "つらい時に人に支えてもらうこと。"}, {"t": 73.43333333333334, "x": "こうした研究は、多くのことを明らかにしてきました。"}, {"t": 77.16666666666667, "x": "人は困った時に身近な人を頼ります。"}, {"t": 79.96666666666667, "x": "支えがあることは、心と体のためになります。"}, {"t": 83.33333333333333, "x": "論文もこの流れの大切さは認めています。"}, {"t": 86.41666666666667, "x": "ただ論文は続けます。"}, {"t": 88.08333333333333, "x": "パズルのもう一つのピースが\n見落とされてきたというのです。"}, {"t": 91.55, "x": "それが、良いことがあった時に人を求めることです。"}, {"t": 95.03333333333333, "x": "うれしい知らせを、だれかに伝えたくなる。"}, {"t": 97.86666666666666, "x": "だれにでも覚えのある動きです。"}, {"t": 99.91666666666667, "x": "でもこの場面は、\nあまり調べられてこなかったといいます。"}, {"t": 103.58333333333333, "x": "論文の題がうまくいった時を問うのはそのためです。"}, {"t": 106.86666666666666, "x": "つらい時の聞き手と並ぶ、もう一つの\n場面を見ようとしたのです。"}, {"t": 111.06666666666666, "x": "良いことを人に話す。"}, {"t": 112.61666666666666, "x": "これには研究の世界で名前がついています。"}, {"t": 115.63333333333334, "x": "キャピタライゼーションという言葉です。"}, {"t": 117.9, "x": "英語でものごとを生かすという意味を持つ言葉です。"}, {"t": 121.0, "x": "もとはラングストンという研究者が使った言葉です。"}, {"t": 124.35, "x": "ラングストンは、日記の調査である傾向を\n見つけていました。"}, {"t": 128.4, "x": "良い出来事を人に話したり、祝ったりした日です。"}, {"t": 131.85, "x": "出来事そのものの良さを超えて、\n前向きな気分が増えていたのです。"}, {"t": 136.36666666666667, "x": "ゲーブルたちはこの言葉をそのまま使いました。"}, {"t": 139.4, "x": "自分に起きた良いことを、だれかに伝えること。"}, {"t": 142.71666666666667, "x": "そしてそこから、さらに良いものを受け取ること。"}, {"t": 145.88333333333333, "x": "論文はそう定義しています。"}, {"t": 147.81666666666666, "x": "では、なぜ話すと良いことが増えるのか。"}, {"t": 150.7, "x": "論文は考えられる理由をいくつか挙げています。"}, {"t": 153.91666666666666, "x": "一つは、話すことで\n出来事をもう一度味わえることです。"}, {"t": 157.85, "x": "もう一つは、相手が喜んでくれていると\n感じられることです。"}, {"t": 161.95, "x": "ただ2つめは、相手の返しが\n良いと感じられた時だけです。"}, {"t": 166.01666666666668, "x": "水を差されれば、うれしさはしぼむかもしれません。"}, {"t": 169.36666666666667, "x": "ここがこの回の中心になります。"}, {"t": 171.66666666666666, "x": "論文には4つの研究が入っています。"}, {"t": 174.45, "x": "最初の研究は、大学生154人の日記の調査です。"}, {"t": 178.98333333333332, "x": "1週間、毎晩記録をつけてもらいました。"}, {"t": 182.21666666666667, "x": "その日いちばん良かった出来事を書きます。"}, {"t": 184.85, "x": "いちばんいやだった出来事も書きます。"}, {"t": 187.18333333333334, "x": "そして、良い出来事をどれくらい\n人に知らせたかを答えます。"}, {"t": 191.16666666666666, "x": "記録を見ると、話した日はおよそ7割ありました。"}, {"t": 194.86666666666667, "x": "良いことがあると、多くの人は\nだれかに話していたのです。"}, {"t": 198.7, "x": "大事な出来事ほどよく話されてもいました。"}, {"t": 201.55, "x": "では、話した日はどんな1日だったのでしょう。"}, {"t": 204.76666666666668, "x": "話した日は、前向きな気分が高くなっていました。"}, {"t": 208.21666666666667, "x": "その日の暮らしへの満足も高くなっていました。"}, {"t": 211.25, "x": "ここで論文は出来事の大きさを差し引いています。"}, {"t": 214.51666666666668, "x": "大きな良いことがあれば、話さなくても\n気分は上がるからです。"}, {"t": 218.56666666666666, "x": "いやな出来事の重さも差し引きました。"}, {"t": 221.06666666666666, "x": "人づきあいの好みのような、\n性格の違いも差し引きました。"}, {"t": 225.33333333333334, "x": "それでも、話した日の高さは残っていたのです。"}, {"t": 228.65, "x": "一方で、いやな気分が\n減ったわけではありませんでした。"}, {"t": 232.55, "x": "話すことは前向きな気分のほうに\n関わっていたようです。"}, {"t": 236.11666666666667, "x": "4つめの研究も大学生の日記の調査です。"}, {"t": 239.28333333333333, "x": "94人が、10日間の記録をつけました。"}, {"t": 242.6, "x": "この研究ではだれに話したかも聞いています。"}, {"t": 245.53333333333333, "x": "選ぶのは友人や親、恋人などです。"}, {"t": 248.58333333333334, "x": "きょうだいや同じ部屋の人も入っています。"}, {"t": 251.31666666666666, "x": "話した日は、およそ8割にのぼりました。"}, {"t": 254.33333333333334, "x": "いちばん多かった相手は友人です。"}, {"t": 256.75, "x": "友人に話した日は6割ほどでした。"}, {"t": 259.31666666666666, "x": "恋人がいる人では、恋人に話した日が\n半分近くありました。"}, {"t": 263.78333333333336, "x": "親に話した日も3割近くありました。"}, {"t": 266.51666666666665, "x": "そして、話した相手の種類が\n多いほど結果が変わっていました。"}, {"t": 270.76666666666665, "x": "前向きな気分も、暮らしへの満足も高かったのです。"}, {"t": 274.53333333333336, "x": "この研究にはもう一つ大事な点があります。"}, {"t": 277.6166666666667, "x": "最初に話した相手が、どう返したかも\n聞いていたのです。"}, {"t": 281.45, "x": "相手が熱心に喜んでくれたと感じた日がありました。"}, {"t": 285.0, "x": "その日は、話しただけの日よりも\n気分がさらに高めでした。"}, {"t": 288.93333333333334, "x": "逆に、相手に関心がなさそうだと\n感じた日もありました。"}, {"t": 292.96666666666664, "x": "その日は気分が低めで、いやな気分も高めでした。"}, {"t": 296.71666666666664, "x": "話すだけでなく、相手の返しも\n1日の気分と結びついていたのです。"}, {"t": 301.53333333333336, "x": "では、相手の返しはどう分けられたのでしょう。"}, {"t": 304.6333333333333, "x": "論文は返しを2つの軸で分けています。"}, {"t": 307.46666666666664, "x": "一つは前に出て反応するか、控えめか。"}, {"t": 310.65, "x": "もう一つは相手のうれしさを支えるか、崩すかです。"}, {"t": 314.4, "x": "組み合わせると4つの型になります。"}, {"t": 316.8, "x": "一つめは熱心に一緒に喜ぶ型です。"}, {"t": 319.55, "x": "質問をたくさんして、出来事に\n本気で関心を向けます。"}, {"t": 323.5833333333333, "x": "本人より喜んでいるように感じることさえあります。"}, {"t": 327.01666666666665, "x": "2つめは静かに喜ぶ型です。"}, {"t": 329.3, "x": "大げさにはしないけれど、喜んでいるのは分かる。"}, {"t": 332.85, "x": "口数は少ないけれど、応援しているのは伝わる。"}, {"t": 336.46666666666664, "x": "3つめは水を差す型です。"}, {"t": 338.4, "x": "問題を見つけて、悪い面もあると指摘します。"}, {"t": 341.76666666666665, "x": "4つめは関心を向けない型です。"}, {"t": 344.06666666666666, "x": "あまり気にかけていないように見えます。"}, {"t": 346.4, "x": "話を聞いても興味がなさそうです。"}, {"t": 348.85, "x": "この分けかたは、けんかの研究から借りたものです。"}, {"t": 352.25, "x": "次の研究で、この4つの型が\n仲の指標と比べられました。"}, {"t": 356.68333333333334, "x": "2つめの研究は付き合っている2人の調査です。"}, {"t": 359.96666666666664, "x": "3か月以上付き合っている、59組が参加しました。"}, {"t": 364.15, "x": "2人は別々に質問に答えました。"}, {"t": 366.8, "x": "相手に良いことを話した時、相手はどう返すか。"}, {"t": 370.35, "x": "その答えを4つの型ごとに点数にしました。"}, {"t": 373.4166666666667, "x": "同時に関係の指標もいくつか測っています。"}, {"t": 376.48333333333335, "x": "関係を続けたい気持ち。"}, {"t": 378.45, "x": "関係への満足。"}, {"t": 379.93333333333334, "x": "親密さ。"}, {"t": 380.8666666666667, "x": "そして相手への信頼です。"}, {"t": 382.71666666666664, "x": "比べると、熱心に一緒に喜ぶ型だけが\n違う動きをしました。"}, {"t": 387.45, "x": "この型が多いと感じる人ほど、\n指標が高めだったのです。"}, {"t": 391.6333333333333, "x": "水を差す型と関心を向けない型は反対でした。"}, {"t": 395.05, "x": "多いと感じる人ほど、指標が低めでした。"}, {"t": 398.26666666666665, "x": "ここまではなんとなく予想どおりかもしれません。"}, {"t": 401.2, "x": "意外だったのは残りの一つです。"}, {"t": 403.3666666666667, "x": "論文自身も、この点を注目に値すると書いています。"}, {"t": 407.4166666666667, "x": "それが静かに喜ぶ型です。"}, {"t": 409.48333333333335, "x": "口数は少ないけれど、喜んでいるのは分かる。"}, {"t": 413.05, "x": "一見すると悪くない返しに思えます。"}, {"t": 415.81666666666666, "x": "ところが研究では、この型も指標と逆向きでした。"}, {"t": 419.53333333333336, "x": "多いと感じる人ほど、満足や親密さが\n低めだったのです。"}, {"t": 423.93333333333334, "x": "この形は、のちに紹介する夫婦の\n研究でもくり返されました。"}, {"t": 428.6333333333333, "x": "論文はこの結果について、理由をいくつか\n考えています。"}, {"t": 432.78333333333336, "x": "控えめな返しは、出来事をあまり大事に\n思っていないと映るのかもしれない。"}, {"t": 437.9166666666667, "x": "関係への関心が薄いように映るのかもしれない。"}, {"t": 441.31666666666666, "x": "ねたみや自分のことで頭がいっぱいだと\n映ることもある、と書きます。"}, {"t": 445.85, "x": "もう一つは期待とのずれです。"}, {"t": 447.8333333333333, "x": "うれしい話をする人は、もっと熱い返しを\n期待しがちです。"}, {"t": 452.0833333333333, "x": "その期待が満たされない。"}, {"t": 453.73333333333335, "x": "ごほうびが来ないのも痛み、という\nヒギンズの考えです。"}, {"t": 457.48333333333335, "x": "論文はそんな見かたも示しています。"}, {"t": 459.9, "x": "相手を喜ばせたくて話したのに、反応が薄い。"}, {"t": 463.45, "x": "責められてはいないけれど、どこか物足りない。"}, {"t": 466.53333333333336, "x": "そんな感じに近いのかもしれません。"}, {"t": 468.9166666666667, "x": "ここで題名の話に戻ります。"}, {"t": 471.1333333333333, "x": "受け止め具合が大事なのは、つらい場面だけなのか。"}, {"t": 4 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
