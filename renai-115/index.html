<script>
const D={"name": "相手のなりたい自分を引き出す人_研究はそれを彫刻にたとえた", "file": "115_相手のなりたい自分を引き出す人_研究はそれを彫刻にたとえた", "dur": 796.2, "segs": [], "subs": [{"t": 0.0, "x": "石のかたまりの中に、はじめから像が眠っている。"}, {"t": 3.533333333333333, "x": "そんな彫刻のたとえを、恋人どうしに\n当てはめた研究があります。"}, {"t": 8.083333333333334, "x": "1999年にアメリカ心理学会の\n専門誌に載った論文です。"}, {"t": 13.25, "x": "書いたのは心理学者のスティーブン・ドリゴタス。"}, {"t": 16.116666666666667, "x": "そしてキャリル・ラスバルトたちです。"}, {"t": 18.116666666666667, "x": "論文が名づけたのは、ミケランジェロ現象です。"}, {"t": 21.3, "x": "近い相手が、本人のなりたい自分を引き出していく。"}, {"t": 24.866666666666667, "x": "本人はその姿に\n少しずつ近づいていく、というものです。"}, {"t": 28.966666666666665, "x": "研究は全部で4つあります。"}, {"t": 31.133333333333333, "x": "大学生の恋人どうしと、結婚した夫婦を調べました。"}, {"t": 35.35, "x": "結果には少し意外なところがありました。"}, {"t": 38.1, "x": "大事なのは、\n相手の見る目だけではありませんでした。"}, {"t": 41.63333333333333, "x": "それがふるまいになって届いているかどうかでした。"}, {"t": 44.6, "x": "ただし、相手を作り変えろという話ではありません。"}, {"t": 48.18333333333333, "x": "支えることと押し付けることは違います。"}, {"t": 50.78333333333333, "x": "まずは名前のもとになった彫刻のたとえです。"}, {"t": 53.75, "x": "ミケランジェロはイタリアの有名な彫刻家です。"}, {"t": 56.766666666666666, "x": "彫刻は、石の中に眠る像を外に出す仕事。"}, {"t": 60.36666666666667, "x": "彼はそう考えていた、と論文は紹介しています。"}, {"t": 64.08333333333333, "x": "彫刻家の仕事は、像をおおう\n余計な石を取りのぞくことです。"}, {"t": 68.4, "x": "けずっていくと、もともと中にあった\n形があらわれてきます。"}, {"t": 72.36666666666666, "x": "論文は、人にもこの眠っている形があると考えました。"}, {"t": 76.48333333333333, "x": "それがなりたい自分、心理学でいう理想の自分です。"}, {"t": 80.4, "x": "いまの自分と理想がはなれていると、\n人は落ちこみます。"}, {"t": 84.21666666666667, "x": "もどかしさも感じます。"}, {"t": 85.81666666666666, "x": "だから人は、いまの自分を理想に近づけようとする。"}, {"t": 89.45, "x": "これまでの研究はそう示してきました。"}, {"t": 92.1, "x": "論文のはじめには、ある小説の\n一節が引かれています。"}, {"t": 96.05, "x": "ある女性が、恋の始まりのころを思い出す場面です。"}, {"t": 99.71666666666667, "x": "フィレンツェで見た、ミケランジェロの像のことです。"}, {"t": 102.71666666666667, "x": "石のかたまりにかくれていた\n形が、けずられて姿をあらわす。"}, {"t": 106.88333333333334, "x": "2人はたがいにとって、金づちであり\n石をけずるのみだった。"}, {"t": 110.93333333333334, "x": "小説はそう書いています。"}, {"t": 112.78333333333333, "x": "論文はこのつながりを3つの段階に分けました。"}, {"t": 116.01666666666667, "x": "1つめは相手のまなざしです。"}, {"t": 118.05, "x": "相手が自分を、なりたい自分に\n近い人として見てくれているか。"}, {"t": 122.45, "x": "2つめは相手のふるまいです。"}, {"t": 124.48333333333333, "x": "なりたい自分を引き出すような接し方をしてくれるか。"}, {"t": 127.76666666666667, "x": "3つめは本人の変化です。"}, {"t": 129.78333333333333, "x": "本人がなりたい自分に少しずつ\n近づいていくことです。"}, {"t": 133.31666666666666, "x": "まなざしがふるまいを生む。"}, {"t": 135.0, "x": "ふるまいが本人を近づける。"}, {"t": 136.98333333333332, "x": "この流れ全体をミケランジェロ現象と呼びます。"}, {"t": 140.15, "x": "論文には、メアリーとジョンのたとえがあります。"}, {"t": 143.26666666666668, "x": "メアリーには、なりたい姿があります。"}, {"t": 145.96666666666667, "x": "思いやりのある、あたたかい人です。"}, {"t": 148.45, "x": "ある食事会で、ジョンは話の流れをそっと変えます。"}, {"t": 152.28333333333333, "x": "メアリーのあたたかさが自然に\n出てくる話題にするのです。"}, {"t": 155.73333333333332, "x": "こうしたやりとりがくり返されます。"}, {"t": 158.0, "x": "するとメアリーは、理想に近づいていく。"}, {"t": 160.93333333333334, "x": "論文はそう考えました。"}, {"t": 162.78333333333333, "x": "ではジョンはわざとそうしているのでしょうか。"}, {"t": 165.36666666666667, "x": "考えてそうする人も、気づかずに\nそうなる人もいるかもしれない。"}, {"t": 169.6, "x": "論文はそう書いています。"}, {"t": 171.33333333333334, "x": "もちろんいつもうまくいくとは限りません。"}, {"t": 173.91666666666666, "x": "論文は支えにならない形を2つ挙げています。"}, {"t": 177.23333333333332, "x": "1つめは、まなざしが理想と逆を向いている場合です。"}, {"t": 180.96666666666667, "x": "ジョンがメアリーを、つめたい\n人だと思っているとします。"}, {"t": 184.53333333333333, "x": "人づきあいが苦手な人だ、とも思っています。"}, {"t": 187.75, "x": "するとジョンは、気づかずに場面を作ってしまいます。"}, {"t": 191.2, "x": "メアリーがよそよそしく見える場面です。"}, {"t": 193.76666666666668, "x": "メアリーはジョンの前だと、\nあたたかくふるまいにくくなる。"}, {"t": 197.38333333333333, "x": "そして本当によそよそしい人になっていくかも\nしれません。"}, {"t": 201.03333333333333, "x": "2つめは、まなざしがずれている場合です。"}, {"t": 203.95, "x": "理想とは関係のない向きを見ているのです。"}, {"t": 206.81666666666666, "x": "メアリーは見た目の美しさには\nあまり関心がありません。"}, {"t": 210.48333333333332, "x": "でもジョンは、そこを伸ばそうとします。"}, {"t": 213.03333333333333, "x": "運動するとほめます。"}, {"t": 214.53333333333333, "x": "服を勧めて、髪型が似合うと言うのです。"}, {"t": 217.68333333333334, "x": "ほめられること自体は、うれしいかもしれません。"}, {"t": 220.81666666666666, "x": "でもそれは、メアリーのなりたい自分とは関係がない。"}, {"t": 224.55, "x": "ジョンは自分の目指すところを分かっていない。" const a=document.getElementById('a');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
