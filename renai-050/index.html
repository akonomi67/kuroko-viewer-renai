<script>
const D={"name": "結論から言います_男女のすれ違いを止める3手順", "file": "050_結論から言います_男女のすれ違いを止める3手順", "dur": 837.2333125, "segs": [], "subs": [{"t": 0.0, "x": "先に答えを言います。"}, {"t": 1.5833333333333333, "x": "男女のすれ違いを止める手順は、三つです。"}, {"t": 4.8, "x": "一つ目は確認。"}, {"t": 6.116666666666666, "x": "何の話をしているのかを、先に決めます。"}, {"t": 9.25, "x": "二つ目は言い換え。"}, {"t": 10.616666666666667, "x": "相手の言葉で、もう一度言い直します。"}, {"t": 13.566666666666666, "x": "三つ目は持ち越し。"}, {"t": 15.0, "x": "その場で結論を出さずに、日を分けます。"}, {"t": 17.933333333333334, "x": "順番は、確認から言い換え、そして持ち越しです。"}, {"t": 21.733333333333334, "x": "この三つを順番どおりにやると、\n話し合いが喧嘩になりにくくなります。"}, {"t": 26.583333333333332, "x": "逆に、どれか一つを飛ばすと、\nだいたい同じ場所で止まります。"}, {"t": 31.016666666666666, "x": "ここから先は、\nなぜそうなるのかという理由の話だけです。"}, {"t": 35.05, "x": "急いでいる人は、今の\n三つだけ持ち帰ってもらえれば足ります。"}, {"t": 39.15, "x": "時間のある人は、失敗例の方を見ていってください。"}, {"t": 42.81666666666667, "x": "手順そのものより、外し方の方が役に\n立つことが多いです。"}, {"t": 47.11666666666667, "x": "それと、三つとも男女どちらにも効きます。"}, {"t": 50.18333333333333, "x": "効きやすい場所だけが、少し違うようです。"}, {"t": 53.2, "x": "その違いは、後半でまとめて出します。"}, {"t": 56.03333333333333, "x": "最後にもう一度、三つを並べ直して終わります。"}, {"t": 59.63333333333333, "x": "途中で忘れても、そこで\n拾い直せるようにしてあります。"}, {"t": 63.416666666666664, "x": "三つとも、道具は言葉だけです。"}, {"t": 65.85, "x": "新しく買うものも、覚えるコツもありません。"}, {"t": 68.9, "x": "理由の話は、ここだけにします。"}, {"t": 71.36666666666666, "x": "話し合いが喧嘩になる時、\n内容が難しいとは限りません。"}, {"t": 75.93333333333334, "x": "むしろ、簡単な話ほど大きくなることがあります。"}, {"t": 79.56666666666666, "x": "原因の多くは、二人が別の種目をやっていることです。"}, {"t": 83.58333333333333, "x": "片方は、問題を片づけようとしています。"}, {"t": 86.73333333333333, "x": "もう片方は、気持ちを置きにきています。"}, {"t": 89.61666666666666, "x": "片づけたい側から見ると、話が前に進みません。"}, {"t": 93.4, "x": "置きたい側から見ると、気持ちが飛ばされています。"}, {"t": 96.85, "x": "どちらも正しいことをしているので、\n譲る理由がありません。"}, {"t": 100.95, "x": "譲らないまま続けると、態度の話に移ってしまいます。"}, {"t": 105.01666666666667, "x": "その言い方は何だ。"}, {"t": 106.48333333333333, "x": "そっちこそ聞いていない。"}, {"t": 108.06666666666666, "x": "ここまで来ると、最初の話題はもう関係ありません。"}, {"t": 111.91666666666667, "x": "だから最初にやるのは、種目を合わせることです。"}, {"t": 115.25, "x": "合わせる作業が、一つ目の手順の確認になります。"}, {"t": 118.88333333333334, "x": "確認さえ通れば、残りの二つは\n補助のようなものです。"}, {"t": 122.76666666666667, "x": "原因の話は以上で、ここから先はやり方だけです。"}, {"t": 126.71666666666667, "x": "原因を長く語っても、次の一回は変わらないからです。"}, {"t": 130.81666666666666, "x": "変わるのは、始め方と終わり方の形だけです。"}, {"t": 134.26666666666668, "x": "その形を、三つに分けて置いていきます。"}, {"t": 137.3, "x": "一つ目の手順は、確認です。"}, {"t": 139.65, "x": "話し始める前に、今日は何の話かを一行で決めます。"}, {"t": 143.91666666666666, "x": "聞くだけでいいのか、意見がいるのか。"}, {"t": 146.45, "x": "決めるのか、決めないのか。"}, {"t": 148.48333333333332, "x": "この二つを最初に置くだけで、種目が合います。"}, {"t": 151.96666666666667, "x": "言い方は、短くて構いません。"}, {"t": 154.35, "x": "聞いてほしいだけの話なんだけど、いい。"}, {"t": 157.51666666666668, "x": "これで、相手は聞く側に回れます。"}, {"t": 160.16666666666666, "x": "逆に、決めたいことがある時もはっきり出します。"}, {"t": 163.55, "x": "今日はこれを決めたいから、意見が欲しい。"}, {"t": 166.41666666666666, "x": "この一言があると、聞く側は遠慮せずに出せます。"}, {"t": 170.1, "x": "確認を入れるのは、最初の十秒だけです。"}, {"t": 173.28333333333333, "x": "十秒で、その後の三十分の向きが決まります。"}, {"t": 176.75, "x": "聞かれた側は、当てる作業から解放されます。"}, {"t": 180.08333333333334, "x": "当てなくてよくなると、身構えずに済みます。"}, {"t": 183.25, "x": "身構えない相手は、たいてい最後まで\n聞いてくれます。"}, {"t": 186.81666666666666, "x": "ここが通れば、半分は終わったようなものです。"}, {"t": 190.06666666666666, "x": "確認を入れる相手は、恋人に限りません。"}, {"t": 193.28333333333333, "x": "家族でも同僚でも、同じように働きます。"}, {"t": 196.53333333333333, "x": "言いにくければ、今日はちょっと\n聞いてほしくて、で足ります。"}, {"t": 200.41666666666666, "x": "確認を飛ばすと、どうなるかを見ます。"}, {"t": 203.1, "x": "よくあるのは、いきなり本題から入る形です。"}, {"t": 206.43333333333334, "x": "今日、こんなことがあってさ、と話し始めます。"}, {"t": 210.11666666666667, "x": "聞いた側は、まず種目を推測することになります。"}, {"t": 213.68333333333334, "x": "推測が外れると、そこで最初のずれが出てしまいます。"}, {"t": 217.61666666666667, "x": "解決を出してほしかったのに、相づちだけで終わる。"}, {"t": 221.13333333333333, "x": "聞いてほしかっただけなのに、直し方を並べられる。"}, {"t": 224.61666666666667, "x": "どちらも、外した側に悪気はありません。"}, {"t": 227.61666666666667, "x": "材料が無いまま、当てにいっただけです。"}, {"t": 230.31666666666666, "x": "外された側は、分かってもらえないと\n感じやすいです。"}, {"t": 234.05, "x": "感じた側が不機嫌になると、\n当てた側は理由が分かりません。"}, {"t": 238 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
