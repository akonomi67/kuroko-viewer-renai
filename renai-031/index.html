762.3333333333334, "i": 245}, {"t": 766.2666666666667, "i": 246}, {"t": 769.8666666666667, "i": 247}, {"t": 772.9833333333333, "i": 248}, {"t": 776.5, "i": 249}, {"t": 779.4833333333333, "i": 250}, {"t": 782.4666666666667, "i": 251}, {"t": 785.8166666666667, "i": 252}, {"t": 788.7833333333333, "i": 253}, {"t": 791.6833333333333, "i": 254}, {"t": 793.9166666666666, "i": 255}, {"t": 796.5833333333334, "i": 256}, {"t": 799.9, "i": 257}, {"t": 802.85, "i": 258}, {"t": 805.4, "i": 259}, {"t": 807.6166666666667, "i": 260}, {"t": 810.8333333333334, "i": 261}, {"t": 813.8333333333334, "i": 262}, {"t": 816.9666666666667, "i": 263}, {"t": 820.15, "i": 264}, {"t": 823.0166666666667, "i": 265}, {"t": 831.0, "i": 265}], "subs": [{"t": 0.0, "x": "贈り物で外した経験は、たいていの人にあります。"}, {"t": 3.683333333333333, "x": "外した時、まず疑うのは金額です。"}, {"t": 6.75, "x": "安すぎたのか、選ぶ物が地味だったのか。"}, {"t": 9.85, "x": "けれども、値段を上げても外れる時は外れます。"}, {"t": 13.333333333333334, "x": "上げたのに反応が薄いと、余計に落ち込みます。"}, {"t": 16.966666666666665, "x": "落ち込んだ結果、次から選ぶこと自体をやめます。"}, {"t": 20.683333333333334, "x": "やめた人は、無関心な人として扱われます。"}, {"t": 24.1, "x": "本当は、無関心だったわけではありません。"}, {"t": 27.216666666666665, "x": "届く仕組みを、知らなかっただけです。"}, {"t": 29.733333333333334, "x": "贈り物で効いているのは、\n物そのものではありません。"}, {"t": 33.333333333333336, "x": "効いているのは、覚えていた時間の長さです。"}, {"t": 36.46666666666667, "x": "男は贈り物を、正解を\n当てる問題として考えやすいです。"}, {"t": 41.166666666666664, "x": "女は贈り物を、\n見ていてくれた証拠として受け取りやすいです。"}, {"t": 45.45, "x": "同じ箱を渡していても、見ている場所が違います。"}, {"t": 48.96666666666667, "x": "見ている場所が違うので、点数の付け方も違います。"}, {"t": 52.733333333333334, "x": "点数の付け方が違うと、金額は効きにくくなります。"}, {"t": 56.68333333333333, "x": "だから高い物で、驚かれないことが起きます。"}, {"t": 59.93333333333333, "x": "逆に、小さい物で喜ばれることも起きます。"}, {"t": 63.36666666666667, "x": "今日は、その差がどこから来るのかを見ていきます。"}, {"t": 66.6, "x": "先に言うと、差は選ぶ前の段階にあります。"}, {"t": 70.18333333333334, "x": "選ぶ日ではなく、覚えていた日数の方です。"}, {"t": 73.4, "x": "日数は、お金では買えません。"}, {"t": 75.75, "x": "買えないものだけが、贈り物では強く効きます。"}, {"t": 79.11666666666666, "x": "まず、贈り物が届く順番を整理します。"}, {"t": 82.31666666666666, "x": "人が最初に受け取るのは、物ではありません。"}, {"t": 85.46666666666667, "x": "自分の話を覚えていた、という事実です。"}, {"t": 88.61666666666666, "x": "前に言ったことが、形になって戻ってくる。"}, {"t": 91.65, "x": "戻ってきた時点で、うれしさの大半は決まります。"}, {"t": 95.35, "x": "中身を見るのは、その後です。"}, {"t": 97.53333333333333, "x": "だから、雑談で出た小さな話が効きます。"}, {"t": 100.86666666666666, "x": "あの店の紅茶がおいしかった、という話。"}, {"t": 103.98333333333333, "x": "靴が傷んできた、という愚痴。"}, {"t": 106.25, "x": "どれも、その場では流れていきます。"}, {"t": 108.76666666666667, "x": "流れた話が戻ってくると、驚きが生まれます。"}, {"t": 112.25, "x": "男はこの部分を、軽く見積もりやすいです。"}, {"t": 115.55, "x": "覚えているだけでは、何も渡していないと考えます。"}, {"t": 119.23333333333333, "x": "女はこの部分を、いちばん大きく見やすいです。"}, {"t": 122.71666666666667, "x": "渡された物より、覚えていた事実を先に見ます。"}, {"t": 126.28333333333333, "x": "この差が、反応のずれとして出ます。"}, {"t": 128.81666666666666, "x": "高い物なのに薄い反応が返るのは、ここです。"}, {"t": 132.36666666666667, "x": "覚えた形跡が、どこにも入っていません。"}, {"t": 135.31666666666666, "x": "形跡は、値札には出ません。"}, {"t": 137.7, "x": "出ないので、金額では埋められません。"}, {"t": 140.43333333333334, "x": "埋めるには、話を拾っておくしかありません。"}, {"t": 143.61666666666667, "x": "拾うのは、贈る日ではなく普段の日です。"}, {"t": 146.5, "x": "次に、金額の話を片づけます。"}, {"t": 149.36666666666667, "x": "高い物が悪い、という話ではありません。"}, {"t": 152.66666666666666, "x": "高い物は、単純にうれしいことが多いです。"}, {"t": 155.9, "x": "けれども、金額は伸びに限りがあります。"}, {"t": 158.88333333333333, "x": "一度上げると、次はそこが基準になります。"}, {"t": 162.25, "x": "基準が上がると、同じ額でも驚きません。"}, {"t": 165.41666666666666, "x": "驚かなくなった時、上げ続けるしかなくなります。"}, {"t": 168.88333333333333, "x": "上げ続けられる人は、多くありません。"}, {"t": 171.61666666666667, "x": "男は金額で誠意を示そうとしやすいです。"}, {"t": 174.76666666666668, "x": "女は金額よりも、選び方の方を見やすいです。"}, {"t": 178.45, "x": "だから、無理をした額が伝わらないことがあります。"}, {"t": 181.85, "x": "伝わらないと、無理をした側は不満を持ちます。"}, {"t": 185.33333333333334, "x": "不満は、次の贈り物の空気を悪くします。"}, {"t": 188.73333333333332, "x": "悪い空気で渡された物は、素直に喜べません。"}, {"t": 192.33333333333334, "x": "喜べないと、また外したように見えます。"}, {"t": 195.38333333333333, "x": "そうやって、悪い方に回っていきます。"}, {"t": 198.33333333333334, "x": "止めるには、金額の枠を先に決めます。"}, {"t": 201.33333333333334, "x": "毎年これくらい、と決めておく。"}, {"t": 203.68333333333334, "x": "決めておくと、選ぶ方に力を使えます。"}, {"t": 206.85, "x": "力を使う場所が、選ぶ方に移ります。"}, {"t": 209.81666666666666, "x": "移った時から、当たる確率が上がります。"}, {"t": 212.75, "x": "上がった理由は、額ではありません。"}, {"t": 215.31666666666666, "x": "ここで、見ている場所の違いを詳しく見ます。"}, {"t": 218.43333333333334, "x": "男は贈り物を、正解探しとして進めやすいです。"}, {"t": 222.46666666666667, "x": "外さない物はどれか、失敗しない物はどれか。"}, {"t": 226.0, "x": "探し方としては、まっとうです。"}, {"t": 228.31666666666666, "x": "まっとうなので、無難な物に落ち着きます。"}, {"t": 231.38333333333333, "x": "無難な物は、外しませんが残りません。"}, {"t": 234.33333333333334, "x": "女は選ばれるまでの過程を、見やすいです。"}, {"t": 237.55, "x": "迷った跡や、聞いてくれた事実の方に反応します。"}, {"t": 241.38333333333333, "x": "反応の対象が、そもそも違います。"}, {"t": 244.15, "x": "だから、正解を出しても静かなことがあります。"}, {"t": 247.55, "x": "静かな反応を、失敗と読むと苦しくなります。"}, {"t": 251.05, "x": "実際には、失敗ではありません。"}, {"t": 253.65, "x": "点数を付ける場所が、別だっただけです。"}, {"t": 256.55, "x": "そこで、過程を少しだけ見せます。"}, {"t": 259.1333333333333, "x": "どこで迷ったかを、一言添える。"}, {"t": 261.56666666666666, "x": "これで、同じ物の意味が変わります。"}, {"t": 264.2, "x": "男の側も、過程を語る練習になります。"}, {"t": 267.5, "x": "語れるようになると、選ぶのが楽になります。"}, {"t": 270.8, "x": "楽になるのは、正解を探さなくてよくなるからです。"}, {"t": 274.5, "x": "正解は、もともと存在しません。"}, {"t": 277.15, "x": "存在しないものを探すと、毎回きつくなります。"}, {"t": 280.6, "x": "きつさが消えると、贈ること自体が続きます。"}, {"t": 283.8333333333333, "x": "欲しい物を聞く方法も、見ておきます。"}, {"t": 286.68333333333334, "x": "聞いて買うのは、悪い手ではありません。"}, {"t": 289.3833333333333, "x": "外れにくく、確実に使ってもらえます。"}, {"t": 292.4, "x": "けれども、聞いた通りに買うと\n薄くなることがあります。"}, {"t": 295.96666666666664, "x": "薄くなるのは、選ぶ余地が消えるからです。"}, {"t": 298.9166666666667, "x": "余地が消えると、覚えていた形跡も消えます。"}, {"t": 302.28333333333336, "x": "男は聞くことを、確実な方法として選びやすいです。"}, {"t": 306.3, "x": "女は聞かれることを、\n丸投げとして受け取る場合があります。"}, {"t": 310.3833333333333, "x": "どちらが正しい、という話ではありません。"}, {"t": 313.48333333333335, "x": "使い分ければ、両方の良さが残ります。"}, {"t": 316.48333333333335, "x": "高い物や好みの強い物は、聞いて買う。"}, {"t": 319.6, "x": "小さい物は、聞かずに選ぶ。"}, {"t": 321.9, "x": "この分け方なら、失敗も薄さも減ります。"}, {"t": 324.96666666666664, "x": "聞く時も、全部を聞かない方が良いです。"}, {"t": 328.0, "x": "色や形の一つだけは、こちらで決める。"}, {"t": 330.8833333333333, "x": "決めた部分に、選んだ跡が残ります。"}, {"t": 333.8333333333333, "x": "残った跡が、そのまま気持ちとして届きます。"}, {"t": 337.0, "x": "届く量は、大きさとは関係ありません。"}, {"t": 340.01666666666665, "x": "関係ないので、小さくても構いません。"}, {"t": 343.03333333333336, "x": "構わないと分かると、選ぶ負担が減ります。"}, {"t": 346.26666666666665, "x": "負担が減った人は、回数を増やせます。"}, {"t": 349.18333333333334, "x": "回数は、金額よりも効きます。"}, {"t": 351.71666666666664, "x": "驚かせる贈り方についても、触れておきます。"}, {"t": 355.0833333333333, "x": "サプライズは、当たると強く残ります。"}, {"t": 357.78333333333336, "x": "残るので、狙いたくなる気持ちは自然です。"}, {"t": 360.9166666666667, "x": "けれども、外れた時の傷も大きくなります。"}, {"t": 364.03333333333336, "x": "外れる原因は、たいてい同じです。"}, {"t": 366.71666666666664, "x": "相手の生活を、計算から外していることです。"}, {"t": 370.3333333333333, "x": "仕事の締め切りの前日に予定を入れる。"}, {"t": 373.06666666666666, "x": "苦手な場所に、内緒で連れて行く。"}, {"t": 375.6666666666667, "x": "どちらも、驚きだけを見て組んでいます。"}, {"t": 378.4, "x": "男は驚きの大きさを、成功の目安にしやすいです。"}, {"t": 382.48333333333335, "x": "女は自分の予定が守られたかを、先に見やすいです。"}, {"t": 386.45, "x": "そこで、評価が割れます。"}, {"t": 388.48333333333335, "x": "割れないようにするには、日だけ先に伝えます。"}, {"t": 391.6166666666667, "x": "この日は空けておいて、とだけ言う。"}, {"t": 394.05, "x": "中身を伏せれば、驚きは十分残ります。"}, {"t": 397.26666666666665, "x": "残したまま、生活は壊れません。"}, {"t": 399.93333333333334, "x": "壊れない驚きだけが、良い思い出になります。"}, {"t": 403.21666666666664, "x": "壊れた驚きは、後で笑い話にもなりません。"}, {"t": 406.6666666666667, "x": "だから、驚きの中身より枠を守ります。"}, {"t": 409.71666666666664, "x": "枠さえ守れば、失敗はほとんど起きません。"}, {"t": 412.9, "x": "起きなくなると、こちらも気楽に企画できます。"}, {"t": 416.1166666666667, "x": "気楽さは、そのまま回数につながります。"}, {"t": 419.1333333333333, "x": "渡す場面についても、決めておきます。"}, {"t": 421.9, "x": "同じ物でも、渡し方で印象が変わります。"}, {"t": 425.2, "x": "袋のまま置いて、後で気づかせる形。"}, {"t": 428.15, "x": "向き合って、手で渡す形。"}, {"t": 430.45, "x": "どちらも同じ物ですが、残り方が違います。"}, {"t": 433.71666666666664, "x": "男は渡す行為を、照れくさく感じやすいです。"}, {"t": 437.2, "x": "照れくささを避けて、置いて済ませたくなります。"}, {"t": 440.2, "x": "女は渡される瞬間を、記憶として残しやすいです。"}, {"t": 444.1166666666667, "x": "瞬間が抜けると、物だけが残ります。"}, {"t": 447.0833333333333, "x": "物だけが残ると、後から思い出 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
