<script>
const D={"name": "見た目は男性_稼ぎは女性の差は_本当に会った相手では見つからなかった", "file": "117_見た目は男性_稼ぎは女性の差は_本当に会った相手では見つからなかった", "dur": 717.7833125, "segs": [], "subs": [{"t": 0.0, "x": "恋人を選ぶとき、見た目を重く見るのは男性。"}, {"t": 3.6333333333333333, "x": "稼ぎの見込みを重く見るのは女性。"}, {"t": 6.15, "x": "アンケートでは、昔からそんな答えが出てきました。"}, {"t": 9.716666666666667, "x": "では本当に人と会った場面でもそうなのでしょうか。"}, {"t": 13.05, "x": "それを確かめた研究があります。"}, {"t": 15.35, "x": "2008年に心理学の専門誌に載った論文です。"}, {"t": 18.883333333333333, "x": "書いたのはポール・イーストウィックと\nイーライ・フィンケル。"}, {"t": 21.916666666666668, "x": "アメリカのノースウェスタン大学の心理学者です。"}, {"t": 25.116666666666667, "x": "集まったのは大学生163人でした。"}, {"t": 28.383333333333333, "x": "まず会う前に、アンケートで好みを答えてもらいます。"}, {"t": 32.06666666666667, "x": "そのあと1回4分の短いデートを何回もします。"}, {"t": 35.61666666666667, "x": "さらに1か月、気になる相手への\n気持ちを追いかけました。"}, {"t": 39.516666666666666, "x": "アンケートでは、おなじみの男女差が出ました。"}, {"t": 42.63333333333333, "x": "ところが会った相手への気持ちでは違ったのです。"}, {"t": 45.61666666666667, "x": "見た目も稼ぎの見込みも、男女\nどちらにも効いていました。"}, {"t": 49.43333333333333, "x": "でも効き方の男女差は見つかりませんでした。"}, {"t": 52.31666666666667, "x": "しかも自分で言った好みは、\n実際のときめきと合わなかった。"}, {"t": 56.4, "x": "今日はこの研究を、順番に見ていきます。"}, {"t": 59.666666666666664, "x": "論文はまず、これまでの研究をふり返ります。"}, {"t": 63.11666666666667, "x": "相手に求めるものの男女差は、\n長く調べられてきました。"}, {"t": 67.06666666666666, "x": "古いものでは1945年の調査があります。"}, {"t": 70.73333333333333, "x": "男性は見た目のよさを重く見ていました。"}, {"t": 73.5, "x": "女性はお金の見込みを重く見ていました。"}, {"t": 76.28333333333333, "x": "いちばん知られているのは1989年の大きな調査です。"}, {"t": 80.78333333333333, "x": "37の文化で、およそ1万人に答えてもらいました。"}, {"t": 85.05, "x": "そこでも同じ2つの差が出ています。"}, {"t": 87.45, "x": "写真や紹介文を見て選ぶ実験でも同じでした。"}, {"t": 91.03333333333333, "x": "新聞の恋人募集の広告にも、同じ差が出ていました。"}, {"t": 95.18333333333334, "x": "ネットの出会いの記録にも、似た結果があります。"}, {"t": 98.45, "x": "男性は収入が高いほどメールを\n多く受け取っていました。"}, {"t": 102.3, "x": "女性では収入とメールの数は結びついていません。"}, {"t": 105.76666666666667, "x": "こうして2つの差は、確かなものとされてきました。"}, {"t": 109.16666666666667, "x": "その理由は進化の歴史で説明されることが\n多かったそうです。"}, {"t": 113.3, "x": "ところが、話が変わる場面がありました。"}, {"t": 116.16666666666667, "x": "写真や理想ではなく、生身の相手と会う場面です。"}, {"t": 119.93333333333334, "x": "本当に会った研究では、男女差が\nつかみにくかったのです。"}, {"t": 124.01666666666667, "x": "論文はその例をいくつも挙げています。"}, {"t": 126.55, "x": "7つの研究をまとめた分析がありました。"}, {"t": 129.55, "x": "実際にデートをした相手への好意を見たものです。"}, {"t": 132.73333333333332, "x": "見た目のよさは、男女どちらの\n好意とも結びついていました。"}, {"t": 136.78333333333333, "x": "でもその強さの男女差は、小さくてはっきりしません。"}, {"t": 140.46666666666667, "x": "スピードデートの研究にも気になる結果がありました。"}, {"t": 143.85, "x": "スピードデートは出会いの会の1つです。"}, {"t": 146.38333333333333, "x": "短い時間で、次々に相手をかえて話します。"}, {"t": 150.2, "x": "会の前に言った好みと、実際の\n返事がほとんど合わない。"}, {"t": 154.41666666666666, "x": "その結びつきは、とても弱いものでした。"}, {"t": 157.35, "x": "アンケートではいつも出る差が、\n会う場面ではゆれる。"}, {"t": 160.7, "x": "この研究はそこから始まりました。"}, {"t": 163.13333333333333, "x": "なぜこんなずれが起きるのか。"}, {"t": 165.01666666666668, "x": "論文は1977年の有名な研究を手がかりにします。"}, {"t": 169.73333333333332, "x": "ニスベットとウィルソンという心理学者の研究です。"}, {"t": 173.05, "x": "人は自分の判断に効いたものを\n正しく言えないことがある。"}, {"t": 176.83333333333334, "x": "そのときは、ありそうな理屈で答えてしまう。"}, {"t": 179.86666666666667, "x": "例として映画の実験が紹介されています。"}, {"t": 182.91666666666666, "x": "ある人たちは、うるさい音の中で映画を見ました。"}, {"t": 186.46666666666667, "x": "電動のこぎりの音です。"}, {"t": 188.2, "x": "その人たちは音のせいでつまらなかったと答えました。"}, {"t": 191.63333333333333, "x": "でも静かな部屋で見た人たちの\n評価も、変わりませんでした。"}, {"t": 195.71666666666667, "x": "もっともらしい理由でも、実は\n効いていなかったのです。"}, {"t": 199.4, "x": "恋の好みにも同じことが起きるのではないか。"}, {"t": 202.35, "x": "相手を選ぶことは、人生の大きな出来事です。"}, {"t": 205.81666666666666, "x": "それでも自分の心の動きが、\n見えていないのかもしれない。"}, {"t": 209.8, "x": "もう1つの考えもあります。"}, {"t": 211.75, "x": "アンケートには落ち着いた気持ちで答えます。"}, {"t": 214.51666666666668, "x": "でも恋の場面では、気持ちが高ぶっています。"}, {"t": 217.76666666666668, "x": "落ち着いたときの答えが、高ぶったときと\n合うとはかぎりません。"}, {"t": 221.8, "x": "そこに、ずれが生まれるのかもしれません。"}, {"t": 224.7, "x": "研究者たちは大学で参加者をつのりました。"}, {"t": 227.81666666666666, "x": "学内のちらしと学年ごとのメールで呼びかけています。"}, {"t": 231.31666666666666, "x": "集まったのは163人です。"}, {"t": 233.81666666666666, "x": "女性が81人、男性が82人でした。"}, {"t": 237.88333333333333, "x": "平均 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
