<style>

<script>
const D={"name": "幸せの中身が逆_男女で一緒にいて幸せの作られ方が違う", "file": "045_幸せの中身が逆_男女で一緒にいて幸せの作られ方が違う", "dur": 797.95, "segs": [], "subs": [{"t": 0.0, "x": "同じ休日を一緒に過ごして、片方だけが\n満たされていないことがあります。"}, {"t": 4.95, "x": "時間の長さも、行った場所も、まったく同じです。"}, {"t": 8.616666666666667, "x": "それでも満ち方が違うのは、\n幸せの作られ方が別だからです。"}, {"t": 13.133333333333333, "x": "男は、やり切ったという区切りで\n満ちやすいところがあります。"}, {"t": 17.133333333333333, "x": "女は、分け合えたという実感で満\nちやすいところがあります。"}, {"t": 21.25, "x": "男は一日の終わりに、何ができたかを思い返します。"}, {"t": 25.383333333333333, "x": "女は一日の終わりに、どんな\n時間だったかを思い返します。"}, {"t": 29.75, "x": "だから同じ日でも、点数のつけ方がまったく違います。"}, {"t": 33.6, "x": "片方は予定を全部こなせたことに満足しています。"}, {"t": 37.11666666666667, "x": "もう片方は、その間に話がで\nきなかったことを覚えています。"}, {"t": 41.38333333333333, "x": "この差を知らないと、努力す\nるほど相手が不満になります。"}, {"t": 45.28333333333333, "x": "連れて行ったのに、という言葉が出\nるのはこの時です。"}, {"t": 48.766666666666666, "x": "今日は、一緒にいて幸せとい\nう状態の中身を並べて見ていきます。"}, {"t": 53.43333333333333, "x": "逆の満ち方をする人もいるので、\nあくまで傾向として聞いてください。"}, {"t": 58.05, "x": "自分の満ち方が分かると、休日の使\nい方も変わってきます。"}, {"t": 62.516666666666666, "x": "まず、幸せを数える単位が違うことがあります。"}, {"t": 66.2, "x": "男は、出来事を単位にしやすいところがあります。"}, {"t": 69.68333333333334, "x": "行った。"}, {"t": 70.76666666666667, "x": "やった。"}, {"t": 71.88333333333334, "x": "終わった。"}, {"t": 72.98333333333333, "x": "という形で残ります。"}, {"t": 74.6, "x": "女は、時間を単位にしやすいところがあります。"}, {"t": 77.96666666666667, "x": "一緒にいた。"}, {"t": 78.91666666666667, "x": "話せた。"}, {"t": 80.01666666666667, "x": "同じものを見た。"}, {"t": 81.21666666666667, "x": "という形で残ります。"}, {"t": 82.83333333333333, "x": "だから男の記憶には、点のようなものが並びます。"}, {"t": 86.53333333333333, "x": "女の記憶には、線のようなものがつながっています。"}, {"t": 90.23333333333333, "x": "点で数える人は、大きな出来事があるほど満ちます。"}, {"t": 93.98333333333333, "x": "線で数える人は、切れていな\nい時間が長いほど満ちます。"}, {"t": 97.91666666666667, "x": "ここが分かると、なぜ食い違うのかが見えてきます。"}, {"t": 101.48333333333333, "x": "点を増やそうとすると、移動と予定が増えます。"}, {"t": 104.96666666666667, "x": "移動と予定が増えると、線の方は細切れになります。"}, {"t": 108.91666666666667, "x": "つまり片方を良くする動きが、も\nう片方を削ってしまいます。"}, {"t": 113.11666666666666, "x": "善意でやっているので、余計に\nたちが悪いところがあります。"}, {"t": 117.18333333333334, "x": "どちらが正しいという話ではなく、単位の違いです。"}, {"t": 121.01666666666667, "x": "男の側には、区切りで満ちる傾向があります。"}, {"t": 124.46666666666667, "x": "予定していたことを全部こなせた日に、\nいい一日だったと感じます。"}, {"t": 129.06666666666666, "x": "だから休日でも、やることを\n決めたがることがあります。"}, {"t": 132.8, "x": "朝に行き先を決めて、順番に回っていく形です。"}, {"t": 136.63333333333333, "x": "そして帰ってきた時に、ようやく満ちた感覚が来ます。"}, {"t": 140.46666666666667, "x": "途中では、まだ終わっていないので落ち着きません。"}, {"t": 143.68333333333334, "x": "ここが、一緒にいる相手には伝わりにくい部分です。"}, {"t": 147.28333333333333, "x": "移動中や待ち時間に、そっけ\nなく見えることがあります。"}, {"t": 151.18333333333334, "x": "本人としては、終わらせることに\n集中しているだけです。"}, {"t": 154.93333333333334, "x": "興味が無いわけでも、退屈し\nているわけでもありません。"}, {"t": 158.6, "x": "けれども受け取る側には、上の空として残ります。"}, {"t": 162.16666666666666, "x": "だから区切り型の人は、途中で一度止\nまる方が得をします。"}, {"t": 166.36666666666667, "x": "公園のベンチで紙コップの飲\nみ物を分けるだけでも変わります。"}, {"t": 170.31666666666666, "x": "その十分間が、相手の側の単位では大きく効きます。"}, {"t": 174.18333333333334, "x": "終わってからでは、その日の線はもう切れています。"}, {"t": 177.55, "x": "女の側には、分け合いで満ちる傾向があります。"}, {"t": 181.15, "x": "同じものを見て、同じ感想が返\nってきた時に満ちます。"}, {"t": 185.1, "x": "だから大きな予定よりも、途中の会話の方が効きます。"}, {"t": 189.03333333333333, "x": "きれいだね、と言って返事が来るかどうかで\n決まります。"}, {"t": 192.48333333333332, "x": "返事が無いと、一人で見てい\nたことになってしまいます。"}, {"t": 196.06666666666666, "x": "ここで多いのが、聞こえてい\nなかっただけという行き違いです。"}, {"t": 199.91666666666666, "x": "本人に悪気はなく、次のことを考えていただけです。"}, {"t": 203.86666666666667, "x": "けれども返事の無かった回数だけが、\n静かに残ります。"}, {"t": 207.71666666666667, "x": "分け合いは、量よりも往復の回数で決まります。"}, {"t": 211.23333333333332, "x": "長い会話が一回あるより、短\nい往復が十回ある方が満ちます。"}, {"t": 216.16666666666666, "x": "だから移動中や台所での一言が、\n思っている以上に効きます。"}, {"t": 220.6, "x": "鍋の前で今日のことを一つ話\nすだけでも、線はつながります。"}, {"t": 224.9, "x": "豪華な食事より、そちらの方が残ることがあります。"}, {"t": 228.7, "x": "ここを知らないと、お金をかけた側が損をします。"}, {"t": 232.15, "x": "かけた額と、満ちた量は一致しません。"}, {"t": 234.96666666666667, "x": "いちばん差が出るのが、旅行です。"}, {"t": 237.3, "x": "区切り型の人は、行きたい場所を回りきると\n満足します。"}, {"t": 241.2, "x": "予定を詰めるほど、密度が上が\nっていく感覚があります。"}, {"t": 245.1, "x": "分け合い型の人は、回りきる\nことで満ちるとは限りません。"}, {"t": 249.11666666666667, "x": "移動が増えると、話す時間が減ってしまうからです。"}, {"t": 252.7, "x": "だから同じ旅行でも、帰りの感想がずれます。"}, {"t": 256.1333333333333, "x": "片方は充実したと言い、もう片方は疲れたと\n言います。"}, {"t": 260.23333333333335, "x": "そして疲れたという感想が、\n否定として受け取られます。"}, {"t": 263.98333333333335, "x": "実際には、否定ではなく単位の違いです。"}, {"t": 267.2, "x": "ここを直すのは、そこまで難しくありません。"}, {"t": 270.3833333333333, "x": "一日の予定を一つ減らすだけで、たいてい足ります。"}, {"t": 274.05, "x": "減らした分を、何もしない時間として残す形です。"}, {"t": 277.8666666666667, "x": "宿の窓から外を見る時間が、あとから強く残ります。"}, {"t": 281.6666666666667, "x": "写真に残らない時間ほど、線としては効いています。"}, {"t": 285.51666666666665, "x": "予定を減らすことは、手を抜くことではありません。"}, {"t": 288.7, "x": "何もしない日に対する感じ方も、逆になります。"}, {"t": 292.28333333333336, "x": "区切り型の人にとって、予定が無\nい日は空白に近いです。"}, {"t": 296.53333333333336, "x": "何も終わっていないので、満ちた感覚が来ません。"}, {"t": 299.9, "x": "だから休みの日に、つい用事を作ってしまいます。"}, {"t": 303.46666666666664, "x": "分け合い型の人にとって、予定が無\nい日は中身のある日です。"}, {"t": 307.68333333333334, "x": "話す時間も、同じ場所にいる\n時間も長く取れるからです。"}, {"t": 311.6666666666667, "x": "つまり同じ一日を、空白と中身で正反対に見\nています。"}, {"t": 316.03333333333336, "x": "ここで揉めると、相手の性格の話になりがちです。"}, {"t": 319.78333333333336, "x": "落ち着きがないとか、やる気が\nないという話になります。"}, {"t": 323.53333333333336, "x": "けれども本当は、単位が違うだけのことがあります。"}, {"t": 327.1666666666667, "x": "だから何もしない日を、二人で\nどう扱うか決めてください。"}, {"t": 331.1333333333333, "x": "午前は自由にして、午後だけ\n一緒に過ごす形でも構いません。"}, {"t": 335.43333333333334, "x": "全部を合わせる必要は、まったくありません。"}, {"t": 338.5833333333333, "x": "合わせる時間を決めておくと、\n外れた時間が気になりません。"}, {"t": 342.6, "x": "決めていないと、どちらも相手の様子を\nうかがい続けます。"}, {"t": 346.55, "x": "予定の入れ方でも、必ず一度はぶつかります。"}, {"t": 349.93333333333334, "x": "区切り型の人は、先に埋めて\nおきたいところがあります。"}, {"t": 353.65, "x": "決まっていると安心するので、早めに押さえます。"}, {"t": 357.06666666666666, "x": "分け合い型の人は、相手と決\nめたいところがあります。"}, {"t": 360.6333333333333, "x": "決める過程そのものが、分け合いになるからです。"}, {"t": 363.78333333333336, "x": "だから勝手に決められると、\n内容が良くても引っかかります。"}, {"t": 367.85, "x": "その日の中身ではなく、決め方の方が残ります。"}, {"t": 371.3833333333333, "x": "逆に、何も決めずにいると別の問題が起きます。"}, {"t": 375.1166666666667, "x": "当日になって話し合うと、時間が減っていきます。"}, {"t": 378.81666666666666, "x": "だから折り合いのつけ方は、一つだけあります。"}, {"t": 381.9166666666667, "x": "候補を二つ出して、選んでもらう形です。"}, {"t": 385.01666666666665, "x": "決める手間は減り、決める場面も残ります。"}, {"t": 388.1, "x": "玄関の壁に予定表を貼って、\n二人で書き込む形でも足ります。"}, {"t": 392.76666666666665, "x": "書き込むという作業自体が、分け合いとして効きます。"}, {"t": 396.28333333333336, "x": "先に埋める人と、一緒に決めたい人は共存できます。"}, {"t": 400.26666666666665, "x": "相手が満ちているかどうかは、外から見えにくいです。"}, {"t": 403.73333333333335, "x": "けれども合図のようなものは、いくつかあります。"}, {"t": 406.8833333333333, "x": "区切り型の人が満ちている時は、次の話を始めます。"}, {"t": 410.95, "x": "来月はどこに行こうか、という形で先の話が出ます。"}, {"t": 415.0, "x": "満ちていない時は、その日の話で終\nわってしまいます。"}, {"t": 418.6166666666667, "x": "分け合い型の人が満ちている時は、感想が増えます。"}, {"t": 422.4, "x": "あの時どう思ったか、という振り返りが出てきます。"}, {"t": 425.8666666666667, "x": "満ちていない時は、良かったねと\nいう一言で終わります。"}, {"t": 429.5833333333333, "x": "つまり片方は前の話、もう片方は後ろの\n話で分かります。"}, {"t": 434.1666666666667, "x": "この合図は、疲れている日には出ません。"}, {"t": 437.01666666666665, "x": "だから一度で判断せず、何回かで見てください。"}, {"t": 440.6166666666667, "x": "そして分からない時は、聞いてしまう方が早いです。"}, {"t": 444.15, "x": "今日いちばん良かったのはどこかと聞く形です。"}, {"t": 447.1, "x": "答えが場所なら区切り型、場面なら分け合い型です。"}, {"t": 450.9, "x": "一度聞いておくと、次から外しにくくなります。"}, {"t": 454.35, "x": "やっかいなのは、満ちていない側が黙ることです。"}, {"t": 457.65, "x": "せっかく連れてきてもらったのに、とは\n言いにくいからです。"}, {"t": 461.25, "x": "だからその場では、楽しかったと言います。"}, {"t": 464.05, "x": "言った本人も、嘘をついているつもりはありません。"}, {"t": 467.53333333333336, "x": "楽しかった部分は、たしかにあったからです。"}, {"t": 470.51666666666665, "x": "けれども満ちてはいないので、\n次に少し気が重くなります。"}, {"t": 474.53333333333336, "x": "気が重いことも、はっきりとは伝えません。"}, {"t": 477.48333333333335, "x": "そうして、誘いを断る回数が少しずつ増えていきます。"}, {"t": 481.6166666666667, "x": "断られた側は、興味が無くなったと受け取ります。"}, {"t": 485.1166666666667, "x": "実際には、合わない形が続いただけの\n場合があります。"}, {"t": 489.0833333333333, "x": "ここで内容を豪華にすると、さらにずれていきます。"}, {"t": 492.8, "x": "必要なのは、規模ではなく形の見直しです。"}, {"t": 496.1, "x": "だから断られた時は、理由より形を聞いてください。"}, {"t": 500.0, "x": "どういう過ごし方がいいかを聞く方が、話が進みます。"}, {"t": 503.8, "x": "場所の名前を挙げ合うと、また 3333, "x": "待てるかどうかで、我慢の重さはかなり変わります。"}, {"t": 643.4166666666666, "x": "そして、順番を決める時は先に相手の番に\nしてください。"}, {"t": 647.6166666666667, "x": "先に自分の番にすると、次が来る保証が見えません。"}, {"t": 651.65, "x": "また、相手の番の日に文句を言わないでください。"}, {"t": 654.9666666666667, "x": "一度でも言うと、次から遠慮して番を譲られます。"}, {"t": 658.6833333333333, "x": "譲られた時点で、交互の形は終わります。"}, {"t": 661.9, "x": "交互がうまくいかない時は、\n単位を小さくしてください。"}, {"t": 665.7666666666667, "x": "一日ごとではなく、午前と午後で分ける形です。"}, {"t": 669.3666666666667, "x": "それも難しければ、一時間でも構いません。"}, {"t": 672.7333333333333, "x": "大事なのは長さではなく、順番があることです。"}, {"t": 676.3, "x": "順番が見えていれば、待つ時間も満\nちる時間になります。"}, {"t": 680.25, "x": "最後に、今日からできることを一つだけ挙げます。"}, {"t": 683.5166666666667, "x": "それは、一日の終わりに一つだけ話すことです。"}, {"t": 686.9166666666666, "x": "今日いちばん良かったことを、\nお互いに一つ言う形です。"}, {"t": 690.7666666666667, "x": "区切り型の人は、終わったことを言葉にできます。"}, {"t": 694.1333333333333, "x": "分け合い型の人は、分け合う回数が一つ増えます。"}, {"t": 697.85, "x": "つまり同じ一分で、両方の単位が同時に満ちます。"}, {"t": 701.8333333333334, "x": "そして、この時間は短いほど続きます。"}, {"t": 704.85, "x": "長く話そうとすると、疲れている日にできません。"}, {"t": 708.3833333333333, "x": "できない日が増えると、そのまま消えていきます。"}, {"t": 711.6833333333333, "x": "だから流し台の前でも、寝る前でも構いません。"}, {"t": 715.1833333333333, "x": "場所を決めずに、言えた日だけ言う形で十分です。"}, {"t": 718.8666666666667, "x": "また、相手の答えに評価をつけないでください。"}, {"t": 722.1166666666667, "x": "そんなことでいいの、と言った時点で終わります。"}, {"t": 725.2333333333333, "x": "中身が小さいほど、その日の線はつながっています。"}, {"t": 728.9333333333333, "x": "小さいことを言い合える日が、いちばん長く続きます。"}, {"t": 732.5666666666667, "x": "このように、一緒にいて幸せと\nいう状態は作られ方が違うことがあります。"}, {"t": 737.9333333333333, "x": "男はやり切った区切りで満ちて、次の話を始めます。"}, {"t": 741.8833333333333, "x": "女は分け合えた実感で満ちて、\nその日を振り返ります。"}, {"t": 745.9, "x": "どちらも同じ時間を過ごして\nいるのに、残るものが違います。"}, {"t": 750.0333333333333, "x": "この違いを知らないと、良か\nれと思った動きが外れます。"}, {"t": 753.9833333333333, "x": "外れた側は、満ちていないことを言い出せません。"}, {"t": 757.2833333333333, "x": "言い出せないまま、誘いを断\nる回数だけが増えていきます。"}, {"t": 761.4166666666666, "x": "断られた側は、気持ちが冷めたのだと考えます。"}, {"t": 765.05, "x": "考えた側は、次から誘わなくなります。"}, {"t": 768.2666666666667, "x": "そこまで来ると、もう幸せの話ではなくなっています。"}, {"t": 772.1, "x": "一緒に過ごす時間そのものが、減ってしまうからです。"}, {"t": 775.5666666666667, "x": "もし今、何をしても相手が楽しそうに\n見えないなら、規模を上げないでください。"}, {"t": 781.0, "x": "先にやるのは、今日いちばん\n良かったことを一つ聞くことです。"}, {"t": 784.9833333333333, "x": "返ってきた答えの中に、その人の単位が入っています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
