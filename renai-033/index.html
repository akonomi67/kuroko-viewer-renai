.55, "i": 368}, {"t": 1036.2, "i": 369}, {"t": 1039.1833333333334, "i": 370}, {"t": 1041.95, "i": 371}, {"t": 1044.25, "i": 372}, {"t": 1046.7333333333333, "i": 373}, {"t": 1050.4166666666667, "i": 374}, {"t": 1053.5166666666667, "i": 375}, {"t": 1056.0, "i": 376}, {"t": 1058.75, "i": 377}, {"t": 1061.1333333333334, "i": 378}, {"t": 1063.9, "i": 379}, {"t": 1066.9666666666667, "i": 380}, {"t": 1069.65, "i": 381}, {"t": 1072.9, "i": 382}, {"t": 1075.9833333333333, "i": 383}, {"t": 1079.25, "i": 384}, {"t": 1082.4666666666667, "i": 385}, {"t": 1084.8333333333333, "i": 386}, {"t": 1087.2333333333333, "i": 387}, {"t": 1089.6666666666667, "i": 388}, {"t": 1093.3833333333334, "i": 389}, {"t": 1096.1166666666666, "i": 390}, {"t": 1099.6666666666667, "i": 391}, {"t": 1102.7166666666667, "i": 392}, {"t": 1106.2333333333333, "i": 393}, {"t": 1109.3666666666666, "i": 394}, {"t": 1112.7833333333333, "i": 395}, {"t": 1116.0333333333333, "i": 396}, {"t": 1118.75, "i": 397}, {"t": 1121.3666666666666, "i": 398}, {"t": 1124.3833333333334, "i": 399}, {"t": 1127.6333333333334, "i": 400}, {"t": 1130.6166666666666, "i": 401}, {"t": 1133.2666666666667, "i": 402}, {"t": 1135.75, "i": 403}, {"t": 1137.7, "i": 404}, {"t": 1141.1, "i": 405}, {"t": 1143.6166666666666, "i": 406}, {"t": 1147.0333333333333, "i": 407}, {"t": 1150.2666666666667, "i": 408}, {"t": 1152.9333333333334, "i": 409}, {"t": 1160.9166666666667, "i": 409}], "subs": [{"t": 0.0, "x": "好かれる人と好かれない人の差は、\n性格だと思われがちです。"}, {"t": 4.216666666666667, "x": "明るいか、優しいか、面白いか。"}, {"t": 7.266666666666667, "x": "けれども、実際に見られているのは\n性格ではありません。"}, {"t": 11.133333333333333, "x": "見られているのは、反応の方です。"}, {"t": 13.633333333333333, "x": "話しかけた時に、どう返ってくるか。"}, {"t": 16.316666666666666, "x": "喜んだ時に、一緒に喜んでもらえるか。"}, {"t": 19.616666666666667, "x": "困った時に、どんな顔をされるか。"}, {"t": 22.216666666666665, "x": "人はこの三つで、相手を測っています。"}, {"t": 25.166666666666668, "x": "性格は、外からは見えません。"}, {"t": 27.616666666666667, "x": "見えないものは、判断の材料になりません。"}, {"t": 30.733333333333334, "x": "だから、優しい人が冷たいと言われることが\n起きます。"}, {"t": 34.45, "x": "逆に、そこまで優しくない人が\n好かれることもあります。"}, {"t": 38.28333333333333, "x": "差がついているのは、中身ではありません。"}, {"t": 41.13333333333333, "x": "返し方だけです。"}, {"t": 42.45, "x": "男は反応を、内容の正しさで作りやすいです。"}, {"t": 46.21666666666667, "x": "女は反応を、気持ちの一致で作りやすいです。"}, {"t": 49.733333333333334, "x": "だから同じ話を聞いても、返る形が変わります。"}, {"t": 53.43333333333333, "x": "形が違うだけで、冷たいと\n受け取られることがあります。"}, {"t": 57.36666666666667, "x": "今日は、その反応を細かく分けていきます。"}, {"t": 60.46666666666667, "x": "先に言うと、反応は生まれつきではありません。"}, {"t": 63.86666666666667, "x": "決めておけば、その場で変えられます。"}, {"t": 66.4, "x": "変えられるものだけが、今日から効きます。"}, {"t": 69.11666666666666, "x": "まず、反応という言葉を細かくします。"}, {"t": 72.06666666666666, "x": "反応には、二つの要素があります。"}, {"t": 74.8, "x": "一つは、返ってくるまでの速さです。"}, {"t": 77.51666666666667, "x": "もう一つは、返ってきた形です。"}, {"t": 80.08333333333333, "x": "速さは、迷わなかったことを伝えます。"}, {"t": 82.98333333333333, "x": "形は、どこを受け取ったかを伝えます。"}, {"t": 85.83333333333333, "x": "たとえば、うれしい報告をした時です。"}, {"t": 88.75, "x": "すぐに、良かったね、と返る。"}, {"t": 91.31666666666666, "x": "これで、話し手は受け取られたと感じます。"}, {"t": 94.23333333333333, "x": "遅れて長い感想が来るより、効きます。"}, {"t": 97.18333333333334, "x": "男は形の正しさを、先に整えようとしやすいです。"}, {"t": 101.21666666666667, "x": "女は速さの方を、気持ちとして受け取りやすいです。"}, {"t": 104.88333333333334, "x": "だから、考えてから返す人は損をします。"}, {"t": 108.1, "x": "損をしているのに、本人は丁寧にしています。"}, {"t": 111.45, "x": "丁寧さが、遅さとして伝わっています。"}, {"t": 114.35, "x": "伝わり方が逆になるのは、もったいないです。"}, {"t": 117.48333333333333, "x": "もったいないので、順番を変えます。"}, {"t": 120.18333333333334, "x": "先に短く返して、後から詳しく話す。"}, {"t": 123.4, "x": "これだけで、印象が変わります。"}, {"t": 125.83333333333333, "x": "変わるのは、中身ではありません。"}, {"t": 128.21666666666667, "x": "順番だけです。"}, {"t": 129.38333333333333, "x": "いちばん多い失点から、見ていきます。"}, {"t": 132.1, "x": "話の最初に、否定を置く癖です。"}, {"t": 134.83333333333334, "x": "いや、それは違うと思う。"}, {"t": 137.11666666666667, "x": "でも、それだと難しいよ。"}, {"t": 139.25, "x": "本人に、悪気はありません。"}, {"t": 141.6, "x": "正確に話したいだけです。"}, {"t": 143.5, "x": "けれども、聞いた側は止められた気分になります。"}, {"t": 146.8, "x": "止められると、次の一文が出ません。"}, {"t": 149.65, "x": "出ないので、会話が短くなります。"}, {"t": 152.33333333333334, "x": "短い会話が続くと、話しかけにくくなります。"}, {"t": 155.85, "x": "男は正確さを、誠実さとして考えやすいです。"}, {"t": 159.75, "x": "女は最初の一言を、受け入れの\n合図として見やすいです。"}, {"t": 163.86666666666667, "x": "そこで、評価が割れます。"}, {"t": 165.9, "x": "割れないようにするには、順番を入れ替えます。"}, {"t": 169.06666666666666, "x": "最初に受けて、後から違いを言う。"}, {"t": 171.65, "x": "なるほど、と言ってから続けます。"}, {"t": 174.0, "x": "こういう見方もある、と足すだけです。"}, {"t": 176.53333333333333, "x": "言っている中身は、まったく同じです。"}, {"t": 179.2, "x": "同じなのに、印象は逆になります。"}, {"t": 182.0, "x": "逆になるなら、変える価値があります。"}, {"t": 184.65, "x": "価値があるのに、多くの人が変えません。"}, {"t": 187.41666666666666, "x": "変えない理由は、癖だと気づいていないからです。"}, {"t": 190.68333333333334, "x": "次に、続ける形を見ます。"}, {"t": 193.06666666666666, "x": "会話が続く人は、必ず聞き返しています。"}, {"t": 196.4, "x": "それでどうなったの。"}, {"t": 197.66666666666666, "x": "その時、どう思った。"}, {"t": 199.5, "x": "たった一つ足すだけです。"}, {"t": 201.1, "x": "足された側は、もう少し話せます。"}, {"t": 203.73333333333332, "x": "話せると、聞いてもらえた感覚が残ります。"}, {"t": 206.98333333333332, "x": "残った感覚が、また会いたい気持ちになります。"}, {"t": 210.25, "x": "続かない人は、感想で終わらせます。"}, {"t": 213.03333333333333, "x": "大変だったね、で止まります。"}, {"t": 215.3, "x": "止まった話は、そこで完結します。"}, {"t": 218.03333333333333, "x": "完結すると、次の話題を探すことになります。"}, {"t": 221.7, "x": "探す作業は、疲れます。"}, {"t": 223.81666666666666, "x": "疲れた会話は、記憶に残りません。"}, {"t": 226.51666666666668, "x": "男は結論が出た話を、閉じたくなりやすいです。"}, {"t": 230.11666666666667, "x": "女は話が続くこと自体を、楽しみやすいです。"}, {"t": 233.86666666666667, "x": "だから、閉じる癖のある人は損をします。"}, {"t": 236.75, "x": "損を止めるのは、質問一つです。"}, {"t": 239.36666666666667, "x": "一つでいいので、感想の後に足します。"}, {"t": 242.35, "x": "足す位置は、いつも同じで構いません。"}, {"t": 245.06666666666666, "x": "形にしておけば、迷いません。"}, {"t": 247.45, "x": "言葉以外の反応も、見ておきます。"}, {"t": 250.18333333333334, "x": "表情の変化が小さい人がいます。"}, {"t": 252.66666666666666, "x": "本人は、ちゃんと聞いています。"}, {"t": 254.93333333333334, "x": "面白いとも思っています。"}, {"t": 256.71666666666664, "x": "けれども、外からは分かりません。"}, {"t": 259.1333333333333, "x": "分からないので、興味がないと読まれます。"}, {"t": 262.0, "x": "読み違いですが、読み違いを責められません。"}, {"t": 265.0833333333333, "x": "見えるものしか、材料がないからです。"}, {"t": 267.9, "x": "男は表情を、大きく動かさない人が多いです。"}, {"t": 271.51666666666665, "x": "女は相手の表情を、細かく見ていることが多いです。"}, {"t": 275.4166666666667, "x": "だから、この差はそのまま誤解になります。"}, {"t": 278.31666666666666, "x": "誤解を消すのは、簡単です。"}, {"t": 280.56666666666666, "x": "声の高さを、少しだけ上げます。"}, {"t": 283.1333333333333, "x": "うなずきを、一回多くします。"}, {"t": 285.5833333333333, "x": "それだけで、聞いている形になります。"}, {"t": 288.31666666666666, "x": "形になれば、中身は伝わります。"}, {"t": 291.01666666666665, "x": "伝わると、話し手は安心します。"}, {"t": 293.7, "x": "安心した相手は、また話しかけます。"}, {"t": 296.43333333333334, "x": "話しかけられる回数が、そのまま好かれる量です。"}, {"t": 299.93333333333334, "x": "量が増えれば、性格の話は関係なくなります。"}, {"t": 303.75, "x": "関係なくなるまで、動かすのは表情だけです。"}, {"t": 307.28333333333336, "x": "返し方の型も、分けておきます。"}, {"t": 309.8833333333333, "x": "人の話には、二つの受け方があります。"}, {"t": 312.98333333333335, "x": "一つは、正しさで返す形です。"}, {"t": 315.5833333333333, "x": "それは、こうした方がいい。"}, {"t": 317.6, "x": "もう一つは、気持ちで受ける形です。"}, {"t": 320.28333333333336, "x": "それは、きつかったね。"}, {"t": 321.96666666666664, "x": "どちらも、相手のための返しです。"}, {"t": 324.43333333333334, "x": "けれども、届き方が違います。"}, {"t": 326.8, "x": "正しさは、解決した後に効きます。"}, {"t": 329.51666666666665, "x": "気持ちは、解決の前に効きます。"}, {"t": 332.0833333333333, "x": "男は正しさを、早めに出しやすいです。"}, {"t": 335.05, "x": "女は気持ちを、先に置いてほしいと思いやすいです。"}, {"t": 338.8666666666667, "x": "そこで、順番のずれが起きます。"}, {"t": 341.43333333333334, "x": "起きたずれが、冷たさとして残ります。"}, {"t": 344.2, "x": "残さないためには、順番を守ります。"}, {"t": 347.1, "x": "必ず、気持ちを先に置きます。"}, {"t": 349.65, "x": "置いてから、正しさを出します。"}, {"t": 351.8333333333333, "x": "出す時も、相手が求めてからにします。"}, {"t": 354.65, "x": "求められていない正しさは、押しつけになります。"}, {"t": 357.8833333333333, "x": "押しつけは、内容が合っていても嫌われます。"}, {"t": 361.01666666666665, "x": "嫌われる理由は、正しさではありません。"}, {"t": 363.93333333333334, "x": "順番だけです。"}, {"t": 365.1, "x": "助言について、もう少し続けます。"}, {"t": 367.71666666666664, "x": "話を聞いていると、直したい点が見えます。"}, {"t": 370.98333333333335, "x": "見えると、言いたくなります。"}, {"t": 373.1, "x": "言いたくなるのは、親切心からです。"}, {"t": 375.81666666666666, "x": "けれども、相手は解決を\n求めていない場合があ const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
