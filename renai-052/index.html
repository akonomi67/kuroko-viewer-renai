<script>
const D={"name": "子どもが生まれた日から夫婦の何が変わるのか", "file": "052_子どもが生まれた日から夫婦の何が変わるのか", "dur": 1162.75, "segs": [], "subs": [{"t": 0.0, "x": "子どもが生まれた日から、家の中の空気は静かに\n変わっていきます。"}, {"t": 4.6, "x": "変わるのは眠る時間や、食事の順番\nだけではないようです。"}, {"t": 8.85, "x": "同じ一日を、二人が別々の計算式で数\nえ始めることがあります。"}, {"t": 14.05, "x": "男は家族が一人増えたと、足\nし算で数えやすいと言われます。"}, {"t": 18.5, "x": "一方で女は自分の時間が削られたと、\n引き算で数えやすいようです。"}, {"t": 23.583333333333332, "x": "足し算をしている人は、うれ\nしさを口に出したくなります。"}, {"t": 27.3, "x": "引き算をしている人は、減っ\nた分をどこかで取り返したくなります。"}, {"t": 31.566666666666666, "x": "この二つは、仲の良し悪しとは\n別のところで起きることがあります。"}, {"t": 35.93333333333333, "x": "産後にすれ違う家の多くは、気持ちが\n減ったわけではないのかもしれません。"}, {"t": 40.9, "x": "数え方が逆のまま、同じ食卓に座\nっているだけの場合があります。"}, {"t": 45.61666666666667, "x": "やっかいなのは、数え方の違\nいが表に出てこないことです。"}, {"t": 49.68333333333333, "x": "表に出てくるのは、返事の短\nさと、ため息の回数だけです。"}, {"t": 54.46666666666667, "x": "相手が冷たくなったように見えて、\nこちらも口数が減っていきます。"}, {"t": 58.9, "x": "半年ほど経つと、会話が連絡事項\nだけになってしまう家もあります。"}, {"t": 63.63333333333333, "x": "一年を過ぎると、その状態のほうが\n普通になっている場合があります。"}, {"t": 68.46666666666667, "x": "産後の一年を、後から思い出\nして悔やむ人も少なくないようです。"}, {"t": 73.05, "x": "ここから先は、産後の一年で何が入\nれ替わるのかを順番に見ていきます。"}, {"t": 78.16666666666667, "x": "男に起きやすいことと、女に起\nきやすいことを同じ分だけ扱います。"}, {"t": 83.68333333333334, "x": "どちらかが悪いという単純な話ではないようです。"}, {"t": 86.98333333333333, "x": "最後に、この時期を越えられた家がや\nっていたことを三つ置いて終わります。"}, {"t": 91.73333333333333, "x": "生まれた日を境に、家の中の仕事は急に形を変\nえます。"}, {"t": 96.25, "x": "ぶつかる回数が増えても、気持\nちが減ったとは限りません。"}, {"t": 100.2, "x": "それでも二人は、すれ違いの\n理由をこのあたりに探しがちです。"}, {"t": 104.53333333333333, "x": "気持ちが冷めた、相性が悪か\nった、我慢が足りなかった。"}, {"t": 108.73333333333333, "x": "どれも心の話なので、探しても答えが出てきません。"}, {"t": 112.65, "x": "一方で、実際に増えているのは\n心ではなく手数のようです。"}, {"t": 117.11666666666666, "x": "おむつの残りの確認、予防接種の日程、\n名前のついていない片づけ。"}, {"t": 122.66666666666667, "x": "どれも一つずつは小さく、口に出\nすほどの用事にも見えません。"}, {"t": 126.98333333333333, "x": "小さいので、やっている側も数\nえていないことがあります。"}, {"t": 131.03333333333333, "x": "数えていないものは、相手にも伝わりません。"}, {"t": 134.2, "x": "だから増えた分の疲れが、その\nまま態度の悪さに見えてしまいます。"}, {"t": 138.66666666666666, "x": "言い方がきつくなった、笑わ\nなくなった、優しくなくなった。"}, {"t": 143.03333333333333, "x": "性格が変わったように見えて、\n変わったのは仕事の量かもしれません。"}, {"t": 147.71666666666667, "x": "これは愛情の量の問題ではありません。"}, {"t": 150.48333333333332, "x": "一日に処理する量が、急に倍に\nなっただけの場合があります。"}, {"t": 154.8, "x": "量の話を気持ちの話として扱うと、\n直し方が見つからなくなります。"}, {"t": 159.93333333333334, "x": "責め合っている間も、おむつの\n残りは一つも増えてくれません。"}, {"t": 164.05, "x": "原因が量にあるなら、直すのは\n量の置き場所かもしれません。"}, {"t": 168.31666666666666, "x": "そして、その増えた量を、二人は\nまったく別の数え方で見ています。"}, {"t": 173.18333333333334, "x": "ここから、その数え方の違いを見ていきます。"}, {"t": 176.43333333333334, "x": "男は生まれた後、家族が一人増\nえたと数えやすいようです。"}, {"t": 180.78333333333333, "x": "増えたという実感は、目に見\nえるところから入ってきます。"}, {"t": 184.63333333333333, "x": "写真の枚数が増える、帰る理由が増える、\n守るものが増える。"}, {"t": 189.56666666666666, "x": "呼ばれ方が変わって、少し誇\nらしくなることもあります。"}, {"t": 193.45, "x": "増えた側は、この変化を良い知\nらせとして受け取りやすいです。"}, {"t": 197.46666666666667, "x": "だから職場でも、子どもの話を先に出\nしたくなることがあります。"}, {"t": 201.78333333333333, "x": "一方で女も、同じ日から増えたものを数えています。"}, {"t": 205.68333333333334, "x": "ただし数えているのは、洗い物の量と、\n夜に起きる回数です。"}, {"t": 210.41666666666666, "x": "出かけるときの荷物も、以前の何倍かに\n増えています。"}, {"t": 214.25, "x": "増えたものが喜びの形をしていても、\n体にかかる重さは変わりません。"}, {"t": 219.2, "x": "増えたと言う人と、重いと言う人が、\n同じ食卓に座ることになります。"}, {"t": 224.21666666666667, "x": "ここで喜びをそのまま口に出すと、\n温度差として受け取られやすいです。"}, {"t": 228.88333333333333, "x": "喜んでいる側に悪気はなく、\n疲れている側にも余裕がないだけです。"}, {"t": 233.81666666666666, "x": "喜びを外で話す回数と、家の中で動\nく回数は別のものです。"}, {"t": 238.9, "x": "片方は数を数えていて、もう片方は重さを\n数えているのかもしれません。"}, {"t": 244.1, "x": "数字が同じでも、単位が違えば合計は合いません。"}, {"t": 247.95, "x": "合わない合計を前にして、二人とも\n自分の計算を疑いません。"}, {"t": 252.68333333333334, "x": "疑わないまま、相手の計算のほうが甘く見えてきます。"}, {"t": 256.6333333333333, "x": "この単位の違いは、次の引き算の話でも\nっとはっきり出てきます。"}, {"t": 261.2, "x": "女は生まれた日から、自分の時間が削\nられたと数えやすいようです。"}, {"t": 265.9, "x": "削られるのは、大きな時間ではないことが多いです。"}, {"t": 269.48333333333335, "x": "湯船に浸かる時間、温かいま\nま食べ終わる時間、何も考えない時間。"}, {"t": 274.9, "x": "どれも数分なので、削られたと\n言い出しにくいところがあります。"}, {"t": 279.1166666666667, "x": "言い出しにくいものは、その\nまま黙って減っていきます。"}, {"t": 282.6166666666667, "x": "減り続けると、体より先に気持\nちのほうが薄くなることがあります。"}, {"t": 287.35, "x": "薄くなっていることを、本人が一番分か\nっていない場合もあります。"}, {"t": 291.8, "x": "一方で男の時間も、同じ時期に確かに\n削られています。"}, {"t": 296.1166666666667, "x": "残業の断り方を考える時間、\n休みの日に眠る時間、道具をしまう時間。"}, {"t": 302.21666666666664, "x": "趣味の箱を押し入れの奥に上\nげた人もいるかもしれません。"}, {"t": 305.78333333333336, "x": "ただし男の削られ方は、多くが\n家の外で起きています。"}, {"t": 309.85, "x": "家の中から見えないものは、\n削られていないことになってしまいます。"}, {"t": 314.21666666666664, "x": "どちらも減らしているのに、\nどちらも相手だけが自由に見えます。"}, {"t": 318.3666666666667, "x": "自由に見える相手を見ると、\n自分の我慢だけが目立ってきます。"}, {"t": 322.73333333333335, "x": "本当は、減った時間の場所が違\nうだけかもしれません。"}, {"t": 326.51666666666665, "x": "減った場所が違うと、埋め方も違ってきます。"}, {"t": 329.85, "x": "外で減った人は、外で埋め直\nそうとすることがあります。"}, {"t": 333.71666666666664, "x": "家で減った人は、家の中でしか\n埋められないことがあります。"}, {"t": 337.76666666666665, "x": "埋める場所がずれたまま、二人の眠\nる時間も細切れになっていきます。"}, {"t": 342.35, "x": "産後の一年で、二人の眠り方は形が変\nわることがあります。"}, {"t": 347.01666666666665, "x": "女は夜の途中で、何度も区切\nられる形になりやすいです。"}, {"t": 351.3833333333333, "x": "三時間で起きる、一時間で起\nきる、眠りかけてまた起きる。"}, {"t": 356.03333333333336, "x": "合計の時間が同じでも、切れた眠りは\n回復の効きが弱くなりやすいです。"}, {"t": 361.3333333333333, "x": "一方で男は、まとめて短くな\nる形になりやすいと言われます。"}, {"t": 366.0, "x": "帰りが遅くなる、寝る時刻が後\nろにずれる、休日も早く起こされる。"}, {"t": 371.4, "x": "合計は減っていても、続けて\n眠れている分だけ頭は動きます。"}, {"t": 376.03333333333336, "x": "頭が動く側は、話し合いをその\n場で終わらせたくなります。"}, {"t": 380.1333333333333, "x": "細切れの側は、そもそも話の入口に立\nつ体力が残っていません。"}, {"t": 384.96666666666664, "x": "眠れていない側は、悪気がなくても\n返事が短くなりやすいです。"}, {"t": 389.55, "x": "ここで起きるのが、話が通じないという感覚です。"}, {"t": 393.1, "x": "片方は説明を求め、もう片方は結論だけを\n求めています。"}, {"t": 397.68333333333334, "x": "求めるものが違うので、どちらも\n相手が不誠実に見えてきます。"}, {"t": 402.1666666666667, "x": "これは性格の不一致ではありません。"}, {"t": 404.6, "x": "眠りの切れ方が違うと、使え\nる言葉の数まで変わるのかもしれません。"}, {"t": 409.6, "x": "眠れていない人に長い相談を\nすると、断られたように感じます。"}, {"t": 414.25, "x": "断られた側は、次から相談そのものを\n持ちかけなくなります。"}, {"t": 418.6166666666667, "x": "持ちかけない日が続くと、家の中の会話が用件\nだけになります。"}, {"t": 423.25, "x": "そして用件だけの会話は、あ\nる言葉に敏感になっていきます。"}, {"t": 427.55, "x": "産後の家で、一番静かに刺さる言葉があるようです。"}, {"t": 431.6166666666667, "x": "手伝おうか、という一言がそ\nれにあたることがあります。"}, {"t": 435.3333333333333, "x": "言った側は、善意しか持っていません。"}, {"t": 438.1333333333333, "x": "役に立ちたい、負担を減らしたい、機嫌を直したい。"}, {"t": 441.96666666666664, "x": "どれも相手のための言葉なので、\n断られると意味が分かりません。"}, {"t": 446.25, "x": "一方で受け取る側には、別の意味で届\nくことがあります。"}, {"t": 450.18333333333334, "x": "手伝うという言葉は、本来の担当が相手に\nあるときに使われます。"}, {"t": 454.9, "x": "買い物を手伝う、引っ越しを手伝う、店番を手伝う。"}, {"t": 458.96666666666664, "x": "つまりその一言で、家の仕事が片方の持\nち物になってしまいます。"}, {"t": 463.75, "x": "持ち物にされた側は、感謝よ\nり先に線を引かれた感じを受けます。"}, {"t": 468.48333333333335, "x": "言った側は線を引いたつもりが\nないので、話がかみ合いません。"}, {"t": 472.76666666666665, "x": "断られた側は、親切を突き返\nされたように感じることもあります。"}, {"t": 477.51666666666665, "x": "どちらも相手を大事にしたいのに、\n言葉の設計だけがずれています。"}, {"t": 482.03333333333336, "x": "言い換えは、そんなに難しくないかもしれません。"}, {"t": 485.3, "x": "今日はこっちがやる、と担当の形で言\nうだけで印象は変わります。"}, {"t": 489.8, "x": "やろうかと聞く形ではなく、や\nっておくと言い切る形にします。"}, {"t": 494.1166666666667, "x": "ただし言葉を変えても、中身が変\nわらなければ元に戻ります。"}, {"t": 498.2, "x": "中身というのは、誰が先に気\nづいたか、という部分です。"}, {"t": 502.3333333333333, "x": "次は、その気づくという作業の重さを見ていきます。"}, {"t": 505.93333333333334, "x": "家の仕事には、体を動かす前の作業があります。"}, {"t": 509.7, "x": "残りを確認する、いつ切れるかを考える、\n買う日を決める。"}, {"t": 514.2166666666667, "x": "この三つは、動いていないので\n働いているように見えません。"}, {"t": 518.2, "x": "見えないので、やっている側も疲\nれの理由が説明できません。"}, {"t": 522.5666666666667, "x": "男は言われたことを、しっか\nりやり切る形が得意な場合があります。"}, {"t": 527.2666666666667, "x": "言われれば買いに行く、頼まれれば\n洗う、決まれば予約を取る。"}, {"t": 531.6833333333333, "x": "実行の質が高い分だけ、本人は十分や\nっている感覚になります。"}, {"t": 536.5833333333334, "x": "一方で女は、言う前の部分をずっと\n抱えていることがあります。"}, {"t": 541.0833333333334, "x": "何が足りないかを覚えておく\n作業には、終わりがありません。"}, {"t": 545.0666666666667, "x": "終わりがないので、休んでい\nる間も頭が働き続けます。"}, {"t": 549.4666666666667, "x": "ここで起きるのが、頼めばや\nってくれるのに、という言葉です。"}, {"t": 553.6, "x": "頼むこと自体が仕事になって\nいる、という意味かもしれません。"}, {"t": 557.6833333333333, "x": "言われた側からすれば、言っ\nてくれれば動くのに、と感じます。"}, {"t": 562.05, "x": "どちらの言い分にも、はっきりした理屈があります。"}, {"t": 565.4166666666666, "x": "解き方は、気づく力を上げることではないようです。"}, {"t": 568.8333333333334, "x": "確認の担当ごと、丸ごと片方に渡\nしてしまう形が軽いと言われます。"}, {"t": 574.1, "x": "おむつの在庫はこちら、保育園の書類は\nそちら、という分け方です。"}, {"t": 578.8833333333333, "x": "分け方が決まると、片方が家の中心に\nなる形もほどけていきます。"}, {"t": 583.8, "x": "その中心の外側で、もう片方が静かに\n困り始めることがあります。"}, {"t": 588.85, "x": "産後の家で、男が急に居場所を失うことがあります。"}, {"t": 592.8666666666667, "x": "きっかけは、たいてい小さな出来事です。"}, {"t": 595.7, "x": "抱き方を直される、泣き止まないと\n交代になる、寝かしつけを外される。"}, {"t": 600.95, "x": "どれも赤ちゃんのための正しい判断かもしれません。"}, {"t": 604.1833333333333, "x": "ただし外された側は、必要と\nされていないと感じることがあります。"}, {"t": 608.7666666666667, "x": "一方で外した側にも、外した\n自覚はないことが多いです。"}, {"t": 612.9833333333333, "x": "急いでいた、泣き声が止まら\nなかった、自分のほうが早かった。"}, {"t": 617.5833333333334, "x": "理由はすべて現実的で、悪意はどこにもありません。"}, {"t": 621.3, "x": "それでも回数が重なると、呼ば\nれない人ができあがります。"}, {"t": 625.5, "x": "呼ばれない人は、だんだん自分から\n動かなくなります。"}, {"t": 629.0166666666667, "x": "動かない姿を見た側は、やる気がないと\n受け取ります。"}, {"t": 632.7666666666667, "x": "やる気がないと思われた側は、\nさらに近づけなくなります。"}, {"t": 636.7166666666667, "x": "この往復は、どちらかが冷たいから\n起きるのではないようです。"}, {"t": 640.7833333333333, "x": "下手なままやらせる時間を、\n二人とも持てなかっただけかもしれません。"}, {"t": 645.3, "x": "できる人がやったほうが早い、と\nいう理屈は正しいです。"}, {"t": 649.25, "x": "正しい理屈を積み重ねるほど、\n片方だけが上手になっていきます。"}, {"t": 653.9, "x": "最初から上手な人は、たぶんどちらにもいません。"}, {"t": 657.2333333333333, "x": "うまくならないまま一年が過ぎると、\n担当は固まってしまいます。"}, {"t": 661.6666666666666, "x": "固まった担当は、あとから動かすのが難しくなります。"}, {"t": 665.5666666666667, "x": "そして担当が固まった家では、も\nう片方も別の形で孤独になります。"}, {"t": 670.6166666666667, "x": "産後の女が孤独を感じるのは、\n一人になった時ではないようです。"}, {"t": 675.2, "x": "むしろ、そばに誰かがいる時間のほうが\n長いくらいです。"}, {"t": 678.9833333333333, "x": "言葉の通じない相手と、朝から\n夕方まで二人きりで過ごします。"}, {"t": 683.5833333333334, "x": "今日は大人と一度も話してい\nない、という日ができます。"}, {"t": 687.3833333333333, "x": "外に出ても、名前ではなく誰かの\n母として呼ばれることが増えます。"}, {"t": 691.9666666666667, "x": "自分の名前を呼ばれない日が続くと、\n輪郭が薄くなる感じがします。"}, {"t": 696.8666666666667, "x": "一方で男は、外で名前を呼ばれ続けています。"}, {"t": 700.5666666666667, "x": "会議で呼ばれる、取引先で呼ばれる、\n飲みに誘われる。"}, {"t": 704.7166666666667, "x": "名前がある側は、名前のない\n苦しさに気づきにくいです。"}, {"t": 708.65, "x": "帰ってから今日は何してた、と聞くと、\n答えに困ることがあります。"}, {"t": 713.3833333333333, "x": "何もしていないわけがないのに、\n話す言葉が出てきません。"}, {"t": 717.2166666666667, "x": "出てこないことが、また自分を追\nい詰めることもあります。"}, {"t": 720.7666666666667, "x": "ここで必要なのは、状況の報告を求\nめることではないかもしれません。"}, {"t": 725.6666666666666, "x": "名前で呼んで、今日の感想を聞\nくだけで変わることがあります。"}, {"t": 729.7833333333333, "x": "大人の話を五分するだけで、\n戻ってくるものもあるようです。"}, {"t": 733.9666666666667, "x": "外の話をひとつ持ち帰るだけでも、\n空気は変わるようです。"}, {"t": 738.1666666666666, "x": "疲れているかどうかを聞く前に、\n面白いことがあったかを聞く。"}, {"t": 742.2333333333333, "x": "これは順番を変えるだけなので、\n道具もお金もいりません。"}, {"t": 746.2166666666667, "x": "順番と同じくらい、この時期\nだけ強く効くものがもう一つあります。"}, {"t": 750.7666666666667, "x": "ありがとうという言葉は、いつでも\n同じ効き方をするとは限りません。"}, {"t": 755.2666666666667, "x": "産後の一年は、その言葉の効きが\n特別に強くなると言われます。"}, {"t": 759.9666666666667, "x": "理由は、この時期の仕事に評価が一つも\n付かないからです。"}, {"t": 763.9666666666667, "x": "給料も出ない、上司も褒めな\nい、終わった記録も残らない。"}, {"t": 768.2, "x": "記録の残らない仕事は、やっ\nていないのと同じ形で消えていきます。"}, {"t": 772.9, "x": "一方で男の側にも、同じ消え方を\nしている仕事があります。"}, {"t": 777.3333333333334, "x": "残業を代わった、飲みを断っ\nた、休日出勤を引き受けた。"}, {"t": 782.1333333333333, "x": "家では見えないので、こちらも記録に残りません。"}, {"t": 785.5833333333334, "x": "どちらも見えないところで減\nらしているのに、お互いに届いていません。"}, {"t": 789.8666666666667, "x": "だから感謝は、気持ちの表現と\nいうより記録に近いのかもしれません。"}, {"t": 794.6, "x": "記録として言うなら、量よりも回数のほうが効きます。"}, {"t": 798.3666666666667, "x": "一日一回でいいので、具体的なものに\n向けて言うと届きやすいです。"}, {"t": 803.2, "x": "回数が増えると、相手もまた\n数え直してくれることがあります。"}, {"t": 807.5833333333334, "x": "助かったより、朝のごみを出\nしてくれて助かった、のほうが残ります。"}, {"t": 812.35, "x": "大きな感謝を月に一度言っても、\nこの時期には間に合いません。"}, {"t": 816.6, "x": "間に合わないうちに、相手は数\nえるのをやめてしまうことがあります。"}, {"t": 820.9666666666667, "x": "数えるのをやめた人は、もう不満も言わなくなります。"}, {"t": 824.6166666666667, "x": "不満が消えたことを、仲直りだと\n思ってしまう家もあります。"}, {"t": 828.8166666666667, "x": "静かになった家が次にもめるのは、\nたいてい外出の話です。"}, {"t": 833.1666666666666, "x": "産後の一年で、一番あとに残\nるのが外出のやりとりです。"}, {"t": 837.6166666666667, "x": "男は予定を、先に決めてから\n伝えることが多いようです。"}, {"t": 841.7333333333333, "x": "日曜に集まる、その日は出る、夕方には帰る。"}, {"t": 845.9, "x": "決めてから伝えるほうが、相手の予定を乱\nさないという考え方です。"}, {"t": 850.6166666666667, "x": "一方で女は、伝えられた時点で終\nわっていると感じることがあります。"}, {"t": 855.4333333333333, "x": "こちらが断れない形で来た、と\n受け取られる場合があります。"}, {"t": 859.5333333333333, "x": "受け取り方の差は、行く行かないの\n話ではありません。"}, {"t": 863.0666666666667, "x": "先に相談されたかどうか、と\nいう順番の話かもしれません。"}, {"t": 867.3333333333334, "x": "女の側も、自分の外出を後回しにしがちです。"}, {"t": 871.1833333333333, "x": "申し訳なさが先に立って、そもそも希望を言いません。"}, {"t": 875.0833333333334, "x": "言わないので、相手には不満がないように見えます。"}, {"t": 878.5, "x": "見えないまま何年か経つと、\n片方だけが出かけ続ける形になります。"}, {"t": 883.2833333333333, "x": "この形は、恨みとして何年も残ることがあります。"}, {"t": 886.9666666666667, "x": "防ぎ方は、行き先を制限し合うことではないようです。"}, {"t": 890.8, "x": "月の初めに、二人ぶんの外出の枠を先に置\nいてしまう形です。"}, {"t": 895.6666666666666, "x": "こちらは第二土曜、そちらは\n第四日曜という形で決めておきます。"}, {"t": 900.6, "x": "枠の数をそろえておくと、あとから比べずに済みます。"}, {"t": 904.2, "x": "先に置いてあれば、当日の相談が交渉に\nならずに済みます。"}, {"t": 908.5333333333333, "x": "交渉が減れば、出かけた側が後\nろめたくならずに済みます。"}, {"t": 912.6, "x": "実際に一年を越えられた家は、\nこういう小さな形を持っていました。"}, {"t": 917.45, "x": "この時期を越えられた家には、\n似た形がいくつか見られます。"}, {"t": 921.4333333333333, "x": "一つ目は、担当を細かく分けて、\n確認ごと渡してしまうことです。"}, {"t": 926.35, "x": "沐浴の担当、書類の担当、在庫の担当に分\nけるやり方です。"}, {"t": 931.4666666666667, "x": "分ける単位が細かいほど、片方に集\nまりにくくなります。"}, {"t": 935.5333333333333, "x": "二つ目は、一日の終わりに五分だけ、\n用件以外の話をすることです。"}, {"t": 940.9166666666666, "x": "今日あった小さなことを、報告では\nなく雑談として出します。"}, {"t": 945.05, "x": "話す時間が短いほど、続きやすいと言われます。"}, {"t": 948.7666666666667, "x": "三つ目は、二人ともが一人に\nなれる時間を先に置くことです。"}, {"t": 953.0166666666667, "x": "順番に取るので、どちらかだけが\n自由にはなりません。"}, {"t": 956.7, "x": "一方で、うまくいかなかった\n家にも共通した形があります。"}, {"t": 961.1333333333333, "x": "話し合いを、疲れ切った深夜に\nだけやっていた場合が多いようです。"}, {"t": 965.6833333333333, "x": "深夜の話し合いは、内容では\nなく体力の勝負になってしまいます。"}, {"t": 970.3833333333333, "x": "勝負になると、勝った側も後味が悪くなります。"}, {"t": 974.1, "x": "だから決め事は、機嫌の良い昼間に決\nめておくほうが安全です。"}, {"t": 978.45, "x": "余白のある時間に決めた約束は、\n翌週まで残りやすいです。"}, {"t": 982.9, "x": "三つとも、特別な性格や余裕が\nいる方法ではありません。"}, {"t": 987.2, "x": "置く場所と順番を、先に決めておくだけの作業です。"}, {"t": 990.9833333333333, "x": "それでも、置き忘れたまま一年を過\nぎてしまう家もあります。"}, {"t": 995.05, "x": "過ぎてしまった後に、何が戻\nって何が戻らないのかを見ていきます。"}, {"t": 999.6666666666666, "x": "一年が過ぎた後でも、戻せるものは\nいくつかあります。"}, {"t": 1003.4166666666666, "x": "戻せるものから先に手を付け\nるほうが、気持ちも続きやすいです。"}, {"t": 1007.75, "x": "担当の分け方は、いつからでも組み直せます。"}, {"t": 1011.0166666666667, "x": "感謝の回数も、今日から増やすことができます。"}, {"t": 1014.3666666666667, "x": "外出の枠も、来月の初めに置き直せば間に合います。"}, {"t": 1018.4666666666667, "x": "一方で、戻しにくいものもあるようです。"}, {"t": 1021.4666666666667, "x": "あの時期に一人で泣いた夜は、\nあとから消すことができません。"}, {"t": 1025.3, "x": "外された時間の記憶も、同じように残り続けます。"}, {"t": 1029.1333333333334, "x": "だから謝る時は、忘れようと\n言わないほうがいいかもしれません。"}, {"t": 1033.45, "x": "覚えていていいので、これからの\n形を変える、と言うほうが届きます。"}, {"t": 1038.3166666666666, "x": "ここで大事なのは、どちらが\n多く我慢したかを決めないことです。"}, {"t": 1042.4666666666667, "x": "比べ始めると、勝ち負けの話になってしまいます。"}, {"t": 1046.15, "x": "家の形はさまざまなので、同\nじやり方が合うとも限りません。"}, {"t": 1050.55, "x": "二人で回す家もあれば、親や外の手を借\nりる家もあります。"}, {"t": 1054.7666666666667, "x": "借りることは、手を抜いたことにはならないようです。"}, {"t": 1057.95, "x": "あなたの家でも、あの一年の話を最後に\nしたのはいつでしょうか。"}, {"t": 1062.5166666666667, "x": "思い出せないなら、それは忘\nれたのではないのかもしれません。"}, {"t": 1066.45, "x": "話せる時間が、まだ一度も来\nていないだけの場合があります。"}, {"t": 1070.5166666666667, "x": "そして、その時間は待ってい\nても向こうからは来ません。"}, {"t": 1074.05, "x": "このように、産後に起きるすれ違いは\n気持ちの問題だけではないようです。"}, {"t": 1078.9333333333334, "x": "同じ一日を、片方は足し算で、も\nう片方は引き算で数えています。"}, {"t": 1084.3333333333333, "x": "数え方が逆のままでは、どれ\nだけ話しても合計が合いません。"}, {"t": 1088.65, "x": "合わない合計を放っておくと、\nまず会話から余白が消えます。"}, {"t": 1092.9666666666667, "x": "次に、相談ごとが用件だけになります。"}, {"t": 1096.0166666666667, "x": "やがて、不満を言うことさえ面倒になっていきます。"}, {"t": 1099.5833333333333, "x": "不満が消えた家は、静かで穏やかに\n見えることがあります。"}, {"t": 1103.5833333333333, "x": "見えるだけで、中では数えるのをや\nめた人がいるかもしれません。"}, {"t": 1107.8166666666666, "x": "そこまで来ると、きっかけがないと戻りにくくなります。"}, {"t": 1111.4166666666667, "x": "それでも、始め方はたいてい小さなところにあります。"}, {"t": 1115.1, "x": "担当を一つだけ丸ごと引き受ける。"}, {"t": 1117.4833333333333, "x": "今日あったことを、五分だけ聞く。"}, {"t": 1119.8166666666666, "x": "来月の外出の枠を、二人ぶん先に置く。"}, {"t": 1123.3166666666666, "x": "どれも一日でできて、道具もいりません。"}, {"t": 1126.1666666666667, "x": "うまくいかない日があっても、失敗にはなりません。"}, {"t": 1129.5333333333333, "x": "始まりは、たいてい一行の言葉と、一つの担当です。"}, {"t": 1133.7833333333333, "x": "この時期は、誰がやっても手際が悪\nいものだと言われます。"}, {"t": 1137.7333333333333, "x": "手際の悪さを責めない相手だと\n分かると、人は戻ってきます。"}, {"t": 1142.0833333333333, "x": "戻ってきた相手とは、次の困\nりごとも早いうちに話せます。"}, {"t": 1146.4, "x": "早いうちに話せる家は、そもそも\n大きく崩れにくいようです。"}, {"t": 1150.65, "x": "今日の夜、どれか一つだけ置いてみてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
