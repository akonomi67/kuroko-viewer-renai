<script>
const D={"name": "年の差カップルに向けられる視線と二人が実際に見ているもの", "file": "067_年の差カップルに向けられる視線と二人が実際に見ているもの", "dur": 842.75, "segs": [], "subs": [{"t": 0.0, "x": "年の差がある二人は、中身よ\nり先に数字で見られやすいです。"}, {"t": 4.3, "x": "年はいくつ違うのか。"}, {"t": 5.916666666666667, "x": "どちらが上なのか。"}, {"t": 7.283333333333333, "x": "周りはどう思うのか。"}, {"t": 8.866666666666667, "x": "付き合っている本人たちより\n先に、周りがそこを数えます。"}, {"t": 13.05, "x": "ところが、二人が毎日見ているものは\n数字ではないことが多いです。"}, {"t": 17.55, "x": "朝に起きる時間。"}, {"t": 18.866666666666667, "x": "夕飯の量。"}, {"t": 19.933333333333334, "x": "休みの日の過ごし方。"}, {"t": 21.55, "x": "見ているのは、そういう手元の小さな拍子の方です。"}, {"t": 25.216666666666665, "x": "外から見える差と、中で感じ\nている差は、場所がずれています。"}, {"t": 29.733333333333334, "x": "年上が男の場合は、選んだ理由を勘\nぐられやすいです。"}, {"t": 33.9, "x": "年上が女の場合は、続くのか\nどうかを心配されやすいです。"}, {"t": 38.38333333333333, "x": "どちらの視線も、二人の暮らしの\n中身までは届いていません。"}, {"t": 42.483333333333334, "x": "届いていないのに、繰り返し言われると\n気持ちは少しずつ削られます。"}, {"t": 47.21666666666667, "x": "そして気づかないうちに、二人の間にも\n数字が入り込みます。"}, {"t": 51.6, "x": "今日は、この視線の中で居心地の悪さを\n抱えている人へ向けた話です。"}, {"t": 56.61666666666667, "x": "男女の違いより、年の差の方が気に\nなっている人もいるはずです。"}, {"t": 60.96666666666667, "x": "周りの目と、二人が実際に見\nているものを分けて並べます。"}, {"t": 65.18333333333334, "x": "先に言っておくと、どちらかを\n上に置く話は一つも出てきません。"}, {"t": 69.61666666666666, "x": "差があるのは年齢であって、立場ではないからです。"}, {"t": 73.2, "x": "年の差の話になると、周りは\nまず引き算をしやすいです。"}, {"t": 77.46666666666667, "x": "生まれた年。"}, {"t": 78.45, "x": "干支の巡り。"}, {"t": 79.43333333333334, "x": "同じ歌を知っているかどうか。"}, {"t": 81.4, "x": "そこから、合うか合わないかを\n先に決めてしまうことがあります。"}, {"t": 85.41666666666667, "x": "けれども、引き算で出てくるのは数字だけです。"}, {"t": 88.53333333333333, "x": "数字は、二人がどう過ごして\nいるかを何も教えてくれません。"}, {"t": 92.61666666666666, "x": "同い年でも、話が合わない二人はたくさんいます。"}, {"t": 96.2, "x": "十歳の差があっても、同じと\nころで笑える二人もいます。"}, {"t": 100.08333333333333, "x": "周りが数字を見るのは、それが\nいちばん見えやすいからです。"}, {"t": 104.06666666666666, "x": "暮らしの中身は外から見えま\nせんが、年齢は一言で分かります。"}, {"t": 108.55, "x": "分かりやすい材料があると、\n人はそこで判断を止めやすいようです。"}, {"t": 113.18333333333334, "x": "困るのは、二人の側までその\n数字を使い始めた時です。"}, {"t": 117.41666666666667, "x": "話が噛み合わない日に、年のせいかなと\n思ってしまう。"}, {"t": 121.21666666666667, "x": "疲れて早く寝た夜に、差を感じてしまう。"}, {"t": 124.4, "x": "同い年の二人なら、ただの相性や体調で済\nむ場面です。"}, {"t": 128.53333333333333, "x": "数字を理由にし始めると、直\nせる話まで直せない話に変わります。"}, {"t": 133.68333333333334, "x": "まずは、外から来る視線の中身を分けて見ていきます。"}, {"t": 137.38333333333333, "x": "年上が男の場合、周りは選ん\nだ理由の方を気にしやすいです。"}, {"t": 142.15, "x": "若さに引かれたのではないか。"}, {"t": 144.08333333333334, "x": "見た目だけではないか。"}, {"t": 145.5, "x": "相手の側にも、何か計算があるのではないか。"}, {"t": 149.0, "x": "そういう勘ぐりが、本人たちの\n前で出てくることもあります。"}, {"t": 152.93333333333334, "x": "男の側は、こうした視線を冗談で受\nけ流しやすいです。"}, {"t": 157.0, "x": "笑って流す。"}, {"t": 158.06666666666666, "x": "話題を変える。"}, {"t": 159.13333333333333, "x": "言われる場所に行かなくなる。"}, {"t": 160.85, "x": "説明しても分かってもらえないと、\n感じていることが多いようです。"}, {"t": 165.3, "x": "一方で女の側は、自分の選び方まで\n疑われた気持ちになりやすいです。"}, {"t": 170.65, "x": "好きになった理由を、条件の話に置\nき換えられてしまうからです。"}, {"t": 175.08333333333334, "x": "中身で選んだのに、外からは\n損得で選んだように見られる。"}, {"t": 179.21666666666667, "x": "これが続くと、人前で相手を話題に\nしなくなることがあります。"}, {"t": 183.55, "x": "男が流し、女が黙ると、二人とも\n外では何も言わなくなります。"}, {"t": 188.8, "x": "言わなくなると、周りの勘ぐりだけが残り続けます。"}, {"t": 192.58333333333334, "x": "視線の形は違っても、二人が困\nっている中身は同じです。"}, {"t": 196.93333333333334, "x": "自分たちが選んだ理由を、その\nまま受け取ってもらえないことです。"}, {"t": 201.21666666666667, "x": "その困りごとは、年上が女の場合にも\n逆の形で出てきます。"}, {"t": 205.76666666666668, "x": "年上が女の場合、周りは先行\nきの方を気にしやすいです。"}, {"t": 210.25, "x": "いつまで続くのか。"}, {"t": 211.6, "x": "親にはどう話すのか。"}, {"t": 213.26666666666668, "x": "いずれ離れていかないか。"}, {"t": 214.93333333333334, "x": "心配の形をとって、何度も同\nじことを聞かれることがあります。"}, {"t": 219.5, "x": "女の側は、この心配を自分への\n評価として受け取りやすいです。"}, {"t": 224.13333333333333, "x": "いつか選ばれなくなる、と言\nわれている気がするからです。"}, {"t": 227.7, "x": "一方で男の側は、自分の本気を疑われたと\n感じやすいです。"}, {"t": 232.5, "x": "一時の気の迷いだと思われる。"}, {"t": 234.6, "x": "遊びだと決めつけられる。"}, {"t": 236.2, "x": "好きで一緒にいるのに、続か\nない前提で話をされてしまいます。"}, {"t": 240.58333333333334, "x": "視線の向きは、年上が男の時と\nちょうど逆になっています。"}, {"t": 244.85, "x": "あちらは選んだ理由を疑われ、\nこちらは続く力を疑われます。"}, {"t": 249.533333333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
