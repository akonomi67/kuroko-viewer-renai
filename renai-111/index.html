<script>
const D={"name": "関係が続くかは_いまの満足だけでは決まらなかった", "file": "111_関係が続くかは_いまの満足だけでは決まらなかった", "dur": 779.3833125, "segs": [], "subs": [{"t": 0.0, "x": "いま一緒にいて楽しい。"}, {"t": 1.55, "x": "だからこの恋は続くはず。"}, {"t": 3.466666666666667, "x": "そう思っていませんか。"}, {"t": 5.033333333333333, "x": "もちろん満足はとても大事です。"}, {"t": 7.283333333333333, "x": "でも続くかどうかは、それだけで決まるのでしょうか。"}, {"t": 10.533333333333333, "x": "それを調べた研究があります。"}, {"t": 12.683333333333334, "x": "アメリカのノースカロライナ大学チャペルヒル校で\n書かれた論文です。"}, {"t": 16.833333333333332, "x": "著者は、心理学者のキャリル・ラスバルト。"}, {"t": 19.6, "x": "1980年に専門の学術誌に載りました。"}, {"t": 23.333333333333332, "x": "博士の学位をとるための研究がもとになっています。"}, {"t": 26.8, "x": "今日はこの論文を一緒に読んでいきます。"}, {"t": 29.466666666666665, "x": "論文が示したのは、続く気持ちの見取り図です。"}, {"t": 32.833333333333336, "x": "部品は3つあります。"}, {"t": 34.38333333333333, "x": "いまの満足と、これまで注いできたもの。"}, {"t": 37.31666666666667, "x": "そしてほかの選択肢です。"}, {"t": 39.11666666666667, "x": "さらに論文は、満足と続く気持ちは\n同じではないと書きました。"}, {"t": 43.55, "x": "今日の話は、注いだのだから\n別れるなという話ではありません。"}, {"t": 47.983333333333334, "x": "続く気持ちが、なにでできているか。"}, {"t": 50.5, "x": "その見取り図の話です。"}, {"t": 52.2, "x": "それまでの心理学は、好きになる\nきっかけをよく調べていました。"}, {"t": 56.43333333333333, "x": "考え方が似ているか。"}, {"t": 58.11666666666667, "x": "見た目はどうか。"}, {"t": 59.266666666666666, "x": "相手からほめられたか。"}, {"t": 60.81666666666667, "x": "こうした研究は、初めて会った人を\n好きになる理由には役立ちます。"}, {"t": 65.53333333333333, "x": "でも論文は、足りないところがあると書きました。"}, {"t": 68.75, "x": "関係が時間とともに変わっていくことを、\nうまく説明できない。"}, {"t": 73.13333333333334, "x": "付き合いが続くか、離れていくかも扱っていない。"}, {"t": 76.68333333333334, "x": "そこでこの論文は、新しい見取り図を出しました。"}, {"t": 80.16666666666667, "x": "名前は投資モデルです。"}, {"t": 81.86666666666666, "x": "ねらいは、続いている関係を予想することでした。"}, {"t": 85.35, "x": "どれくらい満足しているか。"}, {"t": 87.18333333333334, "x": "そしてどれくらいとどまりたいか。"}, {"t": 89.16666666666667, "x": "その2つです。"}, {"t": 90.26666666666667, "x": "対象は恋人だけではありません。"}, {"t": 92.61666666666666, "x": "友だちや仕事の付き合いも含めて、と書いています。"}, {"t": 96.16666666666667, "x": "長さも深さもさまざまな関係です。"}, {"t": 98.75, "x": "まずは1つ目の部品、満足です。"}, {"t": 101.5, "x": "もとになったのは、相互依存理論という考え方です。"}, {"t": 105.26666666666667, "x": "人はふつう、うれしいことを多くしたい。"}, {"t": 108.11666666666666, "x": "つらいことは少なくしたい。"}, {"t": 109.83333333333333, "x": "そういう前提に立っています。"}, {"t": 111.81666666666666, "x": "関係のよさは、うれしいことと\nつらいことの両方で決まります。"}, {"t": 116.06666666666666, "x": "論文が例にあげたのは、相手の頭のよさや見た目。"}, {"t": 119.86666666666666, "x": "笑いのセンスや、考え方が似ていることなどです。"}, {"t": 123.45, "x": "ただし関係のよさだけでは満足は決まりません。"}, {"t": 126.65, "x": "くらべる物差しがあるからです。"}, {"t": 128.61666666666667, "x": "論文はこれを比較水準と呼びます。"}, {"t": 131.16666666666666, "x": "ふつうの関係はこれくらい、という期待のことです。"}, {"t": 134.65, "x": "その期待はこれまでの恋の経験から作られます。"}, {"t": 137.93333333333334, "x": "周りの似た人たちの関係とくらべることでも\n作られます。"}, {"t": 141.63333333333333, "x": "関係のよさが期待をこえるほど、満足は高くなる。"}, {"t": 145.53333333333333, "x": "うれしいことが増えても満足は高まる。"}, {"t": 148.16666666666666, "x": "つらいことが減っても高まる。"}, {"t": 149.96666666666667, "x": "期待が低くなっても高まる、と論文は書いています。"}, {"t": 153.61666666666667, "x": "つまり満足は、関係のよさだけでなく、\n期待でも動くのです。"}, {"t": 158.25, "x": "次は続く気持ちです。"}, {"t": 159.88333333333333, "x": "論文の言葉では、コミットメントと呼びます。"}, {"t": 162.98333333333332, "x": "ここではとどまる気持ちと言い換えます。"}, {"t": 165.35, "x": "満足は、関係にいだく好ましい気持ちのことでした。"}, {"t": 169.11666666666667, "x": "いっぽう、とどまる気持ちは少し違います。"}, {"t": 172.18333333333334, "x": "関係から離れる見込みと結びついている。"}, {"t": 175.06666666666666, "x": "そして心が結びついている感じも含みます。"}, {"t": 178.11666666666667, "x": "論文は、とどまる気持ちは3つで決まると考えました。"}, {"t": 181.91666666666666, "x": "1つ目は関係のよさです。"}, {"t": 183.88333333333333, "x": "2つ目はほかの選択肢のよさ。"}, {"t": 186.11666666666667, "x": "3つ目は、これまで注いできた投資の大きさです。"}, {"t": 189.61666666666667, "x": "ここでほかの選択肢を見ておきます。"}, {"t": 192.03333333333333, "x": "論文の言う選択肢は、ほかの\n恋人だけではありません。"}, {"t": 195.91666666666666, "x": "ひとりで過ごすことも選択肢に入ります。"}, {"t": 198.53333333333333, "x": "今の相手と別れたら、いちばんよい道はなにか。"}, {"t": 202.0, "x": "そのよさも、うれしいことと\nつらいことの両方で見ます。"}, {"t": 205.68333333333334, "x": "今の関係と選択肢をくらべるとき、\n期待の高さは関係なくなる。"}, {"t": 210.53333333333333, "x": "残るのは2つのよさの違いだけだ、と\n論文は書いています。"}, {"t": 214.65, "x": "3つ目の部品が投資です。"}, {"t": 216.55, "x": "論文は投資を2つに分けています。"}, {"t": 219.06666666666666, "x": "一つは関係の中に注いだものです。"}, {"t": 221.7, "x": "時間や心を注ぐこと。"}, {"t": 223.53333333333333, "x": "自分のことを打ち明けることや、お金も含まれます。"}, {"t": 227.03333333333333, "x": "もう一つは、もともと無関係だったものが\n関係とつながる場合です。"}, {"t": 231.7, "x": "論文の例は家でした。"}, {"t": 233.38333333333333, "x": "別れたら家を失うと思えば、離れにくくなる。"}, {"t": 236.78333333333333, "x": "どちらの投資にも共通する点があります。"}, {"t": 239.65, "x": "ほかの関係には持ち出せない。"}, {"t": 241.71666666666667, "x": "別れると失われてしまう。"}, {"t": 243.56666666666666, "x": "だから離れるときの痛みが大きくなる。"}, {"t": 246.13333333333333, "x": "付き合いが長いほど、とどまる\n気持ちが強まる理由の一つ。"}, {"t": 250.23333333333332, "x": "論文はそう説明しています。"}, {"t": 252.31666666666666, "x": "まとめるとこうなります。"}, {"t": 253.86666666666667, "x": "関係がよいほど、とどまる気持ちは強くなる。"}, {"t": 257.2, "x": "ほかの選択肢がよくないほど強くなる。"}, {"t": 259.78333333333336, "x": "投資が大きいほど強くなる。"}, {"t": 261.76666666666665, "x": "これが投資モデルの見取り図です。"}, {"t": 263.9, "x": "似た考えは、それまでの社会学などにもありました。"}, {"t": 267.55, "x": "論文は社会学者ブラウの言葉も引いています。"}, {"t": 270.68333333333334, "x": "見送ったほかの機会は、つながりを強める。"}, {"t": 273.8666666666667, "x": "投資と合わさって、固い結びつきを生むこともある。"}, {"t": 277.4166666666667, "x": "そういう言葉です。"}, {"t": 278.71666666666664, "x": "ここがこの論文の大事な点です。"}, {"t": 281.03333333333336, "x": "満足ととどまる気持ちは、ぴったりとは重なりません。"}, {"t": 284.6666666666667, "x": "論文はこう書いています。"}, {"t": 286.3833333333333, "x": "投資が大きく、ほかの選択肢がよくないとき。"}, {"t": 289.65, "x": "満足していない関係に閉じ込められることがある。"}, {"t": 292.8833333333333, "x": "とどまる気持ちは高いのに、満足は低い。"}, {"t": 296.03333333333336, "x": "そういう場合もありうるのです。"}, {"t": 298.01666666666665, "x": "満足は好ましい気持ち、とどまる気持ちは\n離れる見込み。"}, {"t": 302.1, "x": "測っているものが、そもそも違うのです。"}, {"t": 304.9, "x": "ただしこれは、注いだのだから\n離れるなという意味ではありません。"}, {"t": 309.05, "x": "とどまる気持ちが、なにで動くかを説明したものです。"}, {"t": 312.7, "x": "とどまるのが正しいかどうかを、\n論文は言っていません。"}, {"t": 316.35, "x": "論文はこの見取り図を、2つの研究で確かめました。"}, {"t": 320.35, "x": "1つ目は物語を読む実験です。"}, {"t": 322.8666666666667, "x": "本物の恋で、投資や選択肢を\n人の手で変えることはできません。"}, {"t": 327.4, "x": "倫理の面でも実際にも、ほぼ不可能だと\n論文は書いています。"}, {"t": 331.733 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
