3333333, "i": 246}, {"t": 759.5833333333334, "i": 247}, {"t": 763.4833333333333, "i": 248}, {"t": 766.9833333333333, "i": 249}, {"t": 769.6, "i": 250}, {"t": 772.9666666666667, "i": 251}, {"t": 776.2, "i": 252}, {"t": 779.1166666666667, "i": 253}, {"t": 781.8, "i": 254}, {"t": 784.8333333333334, "i": 255}, {"t": 787.8666666666667, "i": 256}, {"t": 790.9333333333333, "i": 257}, {"t": 793.85, "i": 258}, {"t": 796.35, "i": 259}, {"t": 799.1666666666666, "i": 260}, {"t": 801.75, "i": 261}, {"t": 804.8, "i": 262}, {"t": 808.05, "i": 263}, {"t": 811.25, "i": 264}, {"t": 814.5333333333333, "i": 265}, {"t": 822.5166666666667, "i": 265}], "subs": [{"t": 0.0, "x": "相手を見極める時、喧嘩の内容を\n気にする人は多いです。"}, {"t": 4.433333333333334, "x": "何で揉めたのか、どちらが悪かったのか。"}, {"t": 7.4, "x": "けれども、内容はあまり参考になりません。"}, {"t": 10.55, "x": "内容は、その日の事情で毎回変わります。"}, {"t": 13.716666666666667, "x": "変わるものを見ても、先のことは分かりません。"}, {"t": 16.866666666666667, "x": "先が分かるのは、終わらせ方の方です。"}, {"t": 19.783333333333335, "x": "終わらせ方は、めったに変わりません。"}, {"t": 22.366666666666667, "x": "その人が今まで使ってきた形が、そのまま出ます。"}, {"t": 25.983333333333334, "x": "出た形は、十年後もだいたい同じです。"}, {"t": 29.083333333333332, "x": "だから、見るなら終わり方です。"}, {"t": 31.3, "x": "男は喧嘩を、\n早く終わらせたい出来事として扱いやすいです。"}, {"t": 35.733333333333334, "x": "女は喧嘩を、\n関係を作り直す機会として見やすいです。"}, {"t": 40.016666666666666, "x": "この違いだけでも、終わり方は割れます。"}, {"t": 42.85, "x": "割れた形を、どちらかが我慢して合わせます。"}, {"t": 46.0, "x": "合わせた側は、少しずつ削られます。"}, {"t": 48.8, "x": "削られた分は、後から一度に出ます。"}, {"t": 51.56666666666667, "x": "出た時には、原因が分からなくなっています。"}, {"t": 54.85, "x": "分からないまま、別れに近づくことがあります。"}, {"t": 58.0, "x": "今日は、終わらせ方のどこを見るかを\n分けていきます。"}, {"t": 61.43333333333333, "x": "先に言うと、見るのは言葉ではありません。"}, {"t": 64.6, "x": "終わった後の、時間と態度の方です。"}, {"t": 67.48333333333333, "x": "どちらも、その場では取り繕えません。"}, {"t": 70.2, "x": "まず、なぜ終わり方に注目するのかを説明します。"}, {"t": 74.06666666666666, "x": "喧嘩の最中は、誰でも普段と違います。"}, {"t": 77.28333333333333, "x": "声も言い方も、いつもの形ではありません。"}, {"t": 80.43333333333334, "x": "だから、最中の言葉はあてになりません。"}, {"t": 83.43333333333334, "x": "言い過ぎることも、黙り込むこともあります。"}, {"t": 86.35, "x": "けれども、終わらせる時には落ち着いています。"}, {"t": 89.38333333333334, "x": "落ち着いた場面での動きは、その人の癖です。"}, {"t": 92.65, "x": "癖は、意識して直さない限り変わりません。"}, {"t": 95.75, "x": "男は終わらせる時に、話題を切り替えやすいです。"}, {"t": 99.41666666666667, "x": "女は終わらせる時に、\n気持ちの確認を挟みやすいです。"}, {"t": 103.51666666666667, "x": "どちらも自然な形です。"}, {"t": 105.3, "x": "自然な形なので、直す必要もありません。"}, {"t": 108.63333333333334, "x": "問題になるのは、片方の形だけで進む時です。"}, {"t": 112.35, "x": "毎回どちらかに寄ると、片方だけが飲み込みます。"}, {"t": 115.98333333333333, "x": "飲み込んだ側は、終わったと思っていません。"}, {"t": 118.95, "x": "思っていないのに、話は終わります。"}, {"t": 121.63333333333334, "x": "終わった扱いの回が積み重なります。"}, {"t": 124.25, "x": "積み重なった数は、本人にも数えられません。"}, {"t": 127.61666666666666, "x": "数えられないものが、ある日まとめて出ます。"}, {"t": 130.53333333333333, "x": "出た時に、初めて相手が驚きます。"}, {"t": 133.41666666666666, "x": "驚かせないためには、終わり方を見ておきます。"}, {"t": 136.75, "x": "見ておけば、早い段階で調整できます。"}, {"t": 139.76666666666668, "x": "終わり方には、大きく二つの型があります。"}, {"t": 142.93333333333334, "x": "一つは、黙って時間を置く型です。"}, {"t": 145.58333333333334, "x": "もう一つは、その場で話し切る型です。"}, {"t": 148.41666666666666, "x": "黙る型は、頭を冷やしてから戻ってきます。"}, {"t": 151.6, "x": "戻ってきた時には、落ち着いています。"}, {"t": 154.28333333333333, "x": "話し切る型は、その日のうちに片づけます。"}, {"t": 157.35, "x": "片づかないと、眠れないことがあります。"}, {"t": 160.31666666666666, "x": "男は黙って時間を置く形を、選びやすいです。"}, {"t": 163.96666666666667, "x": "女はその場で話し切る形を、望みやすいです。"}, {"t": 167.56666666666666, "x": "どちらが正しい、という話ではありません。"}, {"t": 170.66666666666666, "x": "問題は、二つが同時に起きた時です。"}, {"t": 173.63333333333333, "x": "黙られた側は、拒否されたと感じます。"}, {"t": 176.51666666666668, "x": "追いかけられた側は、追い詰められたと感じます。"}, {"t": 179.78333333333333, "x": "感じ方が逆なので、両方が傷つきます。"}, {"t": 183.15, "x": "避けるには、時間の長さを先に決めます。"}, {"t": 186.21666666666667, "x": "少し考えたい、三十分で戻る、と言う。"}, {"t": 189.75, "x": "これだけで、黙る形が拒否に見えなくなります。"}, {"t": 193.16666666666666, "x": "戻ると言った人が戻れば、信用が積まれます。"}, {"t": 196.43333333333334, "x": "戻らない人は、時間を逃げ道に使っています。"}, {"t": 199.85, "x": "逃げ道として使う人は、次も戻りません。"}, {"t": 203.03333333333333, "x": "ここは、見ておく価値があります。"}, {"t": 205.33333333333334, "x": "戻ってくるかどうかが、\nいちばん分かりやすい線です。"}, {"t": 208.75, "x": "次に、謝り方を見ます。"}, {"t": 210.95, "x": "謝る言葉そのものは、あまり材料になりません。"}, {"t": 214.4, "x": "言うだけなら、誰にでもできます。"}, {"t": 216.73333333333332, "x": "見るのは、謝った直後の一文です。"}, {"t": 219.55, "x": "ごめん、の後に何が続くか。"}, {"t": 221.88333333333333, "x": "そこに、その人の考え方が出ます。"}, {"t": 224.68333333333334, "x": "でも、が続く人は、話を戻したい人です。"}, {"t": 228.2, "x": "戻したい人は、まだ納得していません。"}, {"t": 231.0, "x": "納得していないのに、形だけ閉じています。"}, {"t": 234.21666666666667, "x": "閉じた形は、次に同じ喧嘩を呼びます。"}, {"t": 237.4, "x": "一方で、次はこうする、が続く人がいます。"}, {"t": 241.23333333333332, "x": "この形は、先に進む形です。"}, {"t": 243.91666666666666, "x": "男は謝罪を、その場を\n収める手段として使いやすいです。"}, {"t": 248.03333333333333, "x": "女は謝罪を、理解の合図として受け取りやすいです。"}, {"t": 251.78333333333333, "x": "だから、収めるための謝罪は届きません。"}, {"t": 254.7, "x": "届かないと、また同じ話が始まります。"}, {"t": 257.9166666666667, "x": "始まった時、謝った側は理不尽に感じます。"}, {"t": 261.55, "x": "感じた側は、次から謝るのを渋ります。"}, {"t": 264.81666666666666, "x": "渋られると、終わらせるのが難しくなります。"}, {"t": 268.03333333333336, "x": "難しくなる前に、謝罪の後ろを見ます。"}, {"t": 271.25, "x": "後ろに具体的な行動があるかどうかだけです。"}, {"t": 274.28333333333336, "x": "あるなら、次は少し良くなります。"}, {"t": 276.8833333333333, "x": "終わり方が悪い型も、見ておきます。"}, {"t": 279.6166666666667, "x": "喧嘩を勝ち負けにする人がいます。"}, {"t": 281.9166666666667, "x": "言い負かした側が、終わりを決めます。"}, {"t": 284.51666666666665, "x": "決められた側は、納得していません。"}, {"t": 287.1666666666667, "x": "納得のない終わりは、貯まっていきます。"}, {"t": 289.98333333333335, "x": "貯まったものは、別の場面で出ます。"}, {"t": 292.6, "x": "関係のない話に、急に怒りが乗ります。"}, {"t": 295.93333333333334, "x": "乗った時、本人にも理由が説明できません。"}, {"t": 299.26666666666665, "x": "男は議論の形で、押し切ろうとしやすいです。"}, {"t": 302.6333333333333, "x": "女は感情の強さで、押し返そうとしやすいです。"}, {"t": 306.3666666666667, "x": "どちらも、勝ち負けの土俵に乗っています。"}, {"t": 309.18333333333334, "x": "乗った時点で、内容は関係なくなります。"}, {"t": 312.51666666666665, "x": "関係なくなるので、毎回同じ形になります。"}, {"t": 316.1166666666667, "x": "同じ形の喧嘩は、何年でも続きます。"}, {"t": 319.31666666666666, "x": "続くと、内容だけが入れ替わります。"}, {"t": 322.03333333333336, "x": "入れ替わっても、疲れ方は同じです。"}, {"t": 324.75, "x": "だから、勝ち負けにする相手は重いです。"}, {"t": 327.56666666666666, "x": "重い相手と暮らすと、日常が試合になります。"}, {"t": 331.01666666666665, "x": "試合の毎日は、長くは持ちません。"}, {"t": 333.8833333333333, "x": "見分けるのは簡単です。"}, {"t": 335.56666666666666, "x": "最後に、勝った側の言い方が出るかどうかです。"}, {"t": 338.98333333333335, "x": "出る人は、次も同じことをします。"}, {"t": 341.6166666666667, "x": "範囲の広さも、見ておきます。"}, {"t": 343.95, "x": "喧嘩の途中で、昔の話が出ることがあります。"}, {"t": 347.6333333333333, "x": "去年のあの時も、という形です。"}, {"t": 350.2, "x": "出た時点で、その日の話は終わりません。"}, {"t": 353.3333333333333, "x": "終わらないので、着地する場所が消えます。"}, {"t": 356.25, "x": "消えた場所を探して、何時間も続きます。"}, {"t": 359.46666666666664, "x": "続いた喧嘩は、翌日にも残ります。"}, {"t": 362.3333333333333, "x": "男は話が広がると、黙りやすくなります。"}, {"t": 365.75, "x": "女は納得できないと、範囲を広げやすくなります。"}, {"t": 369.48333333333335, "x": "どちらも、終わらせたい気持ちからの動きです。"}, {"t": 372.53333333333336, "x": "気持ちは同じでも、方向が逆になります。"}, {"t": 375.68333333333334, "x": "逆になると、出口が見つかりません。"}, {"t": 378.48333333333335, "x": "だから、範囲は先に決めます。"}, {"t": 380.8, "x": "今日の話だけにする、と口に出す。"}, {"t": 383.5, "x": "口に出しておくと、広がりにくくなります。"}, {"t": 386.4, "x": "広がらない喧嘩は、短く終わります。"}, {"t": 389.2, "x": "短く終われば、翌日に残りません。"}, {"t": 392.06666666666666, "x": "残らないので、生活が壊れません。"}, {"t": 394.93333333333334, "x": "そして、過去を持ち出さない人は貴重です。"}, {"t": 397.8666666666667, "x": "持ち出さない人とは、\n同じ問題を二度で済ませられます。"}, {"t": 401.6666666666667, "x": "二度で済むなら、暮らしていけます。"}, {"t": 404.01666666666665, "x": "何度も戻る相手とは、消耗が止まりません。"}, {"t": 407.18333333333334, "x": "外に持ち出す形も、見ておきます。"}, {"t": 409.85, "x": "喧嘩の途中で、友達や親に相談する人がいます。"}, {"t": 413.8333333333333, "x": "相談すること自体は、悪くありません。"}, {"t": 416.73333333333335, "x": "苦しい時に、話す相手は必要です。"}, {"t": 419.73333333333335, "x": "問題になるのは、味方を集めてから戻る形です。"}, {"t": 423.4, "x": "みんなも言ってる、という言い方になります。"}, {"t": 426.28333333333336, "x": "言われた側は、二人の話でなくなったと感じます。"}, {"t": 429.95, "x": "感じた時点で、話し合いは成立しません。"}, {"t": 433.23333333333335, "x": "男は外に出すこと自体を、嫌がりやすいです。"}, {"t": 436.71666666666664, "x": "女は共感を得てから、整理したくなりやすいです。"}, {"t": 440.4166666666667, "x": "だから、相談そのものは責められません。"}, {"t": 443.18333333333334, "x": "責めるべきは、持ち帰り方の方です。"}, {"t": 445.95, "x": const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
