<script>
const D={"name": "脈なしから戻る人_一度断られた後もう一度意識される人がやっていること", "file": "089_脈なしから戻る人_一度断られた後もう一度意識される人がやっていること", "dur": 891.2833125, "segs": [], "subs": [{"t": 0.0, "x": "告白や誘いを一度断られた後の話をします。"}, {"t": 3.55, "x": "断られたのに、しばらくしてもう一度意識される\n人がいます。"}, {"t": 7.75, "x": "一方でそのまま遠い人になってしまう人もいます。"}, {"t": 11.1, "x": "この差は断られた後のふるまいで\n生まれることが多いです。"}, {"t": 14.766666666666667, "x": "先に答えを言っておきます。"}, {"t": 16.683333333333334, "x": "戻ってくる人がしているのは、\n引くことではありません。"}, {"t": 20.116666666666667, "x": "追うのをやめて、いつもの自分に戻ることです。"}, {"t": 23.283333333333335, "x": "男は断られると、取り返そうと動きやすいです。"}, {"t": 27.033333333333335, "x": "女は断られると、\n無かったことにしようとしやすいです。"}, {"t": 31.066666666666666, "x": "断った側にも男女で違う気持ちが残ります。"}, {"t": 34.3, "x": "断った女は相手を傷つけたかと気にしやすいです。"}, {"t": 37.85, "x": "断った男は期待させてはいけないと\n身構えやすいです。"}, {"t": 41.65, "x": "この違いを知らないと、よかれと\n思った動きが裏目に出ます。"}, {"t": 45.81666666666667, "x": "距離を取ったつもりが、怒っているように見える。"}, {"t": 48.86666666666667, "x": "明るくしたつもりが、まだ追っているように見える。"}, {"t": 52.016666666666666, "x": "そうして一度の断りが本当の終わりになっていきます。"}, {"t": 55.6, "x": "今日は断られた直後から数か月のうちにできることを\n並べます。"}, {"t": 59.833333333333336, "x": "相手の答えを大事にしながら、です。"}, {"t": 62.56666666666667, "x": "断られた後のことは、断られた\n瞬間より長く覚えられやすいです。"}, {"t": 67.41666666666667, "x": "告白の言葉は時間がたつとぼんやりしていきます。"}, {"t": 70.68333333333334, "x": "けれども次の日にどんな顔で会ったかは、\n意外と残ります。"}, {"t": 74.6, "x": "目をそらされた。"}, {"t": 75.68333333333334, "x": "返事が急に短くなった。"}, {"t": 77.63333333333334, "x": "仲間の前で口数が減った。"}, {"t": 79.75, "x": "断った側はこういう変化をよく見ています。"}, {"t": 82.76666666666667, "x": "断った側も次に会うのが少し怖いからです。"}, {"t": 86.0, "x": "男の場合は、次の日に無理に明るく\nふるまう人がいます。"}, {"t": 90.11666666666666, "x": "平気だと見せたい気持ちからです。"}, {"t": 92.28333333333333, "x": "女の場合は、会わないように\n予定をずらす人がいます。"}, {"t": 96.15, "x": "顔を合わせるのがつらいからです。"}, {"t": 98.26666666666667, "x": "どちらも自然な反応で、\n責められるものではありません。"}, {"t": 102.11666666666666, "x": "ただ相手から見ると、どちらも\n普段と違う人に見えます。"}, {"t": 106.05, "x": "無理な明るさも急な不在も、\n気を使わせる元になりやすいです。"}, {"t": 110.48333333333333, "x": "戻ってくる人は次の日をいつも\n通りの温度で過ごします。"}, {"t": 114.16666666666667, "x": "明るすぎず、暗すぎず。"}, {"t": 116.23333333333333, "x": "昨日までと同じあいさつをします。"}, {"t": 118.5, "x": "それだけで断った側の肩の力が少し抜けることが\nあります。"}, {"t": 122.58333333333333, "x": "断られた側だけが傷ついているとは限りません。"}, {"t": 125.86666666666666, "x": "断った側にも、断った側の重さがあります。"}, {"t": 129.4, "x": "断った女は悪いことをしたような\n気持ちになりやすいです。"}, {"t": 133.26666666666668, "x": "傷つけたかもしれない。"}, {"t": 134.78333333333333, "x": "怒らせたかもしれない。"}, {"t": 136.26666666666668, "x": "もう話せないかもしれない。"}, {"t": 138.0, "x": "一方で断った男は、はっきりさせなければと\n考えやすいようです。"}, {"t": 142.83333333333334, "x": "優しくしすぎると、また期待させてしまうかも\nしれない。"}, {"t": 146.6, "x": "だからわざと少しそっけなくする人もいます。"}, {"t": 149.4, "x": "これは相手が嫌いだからではありません。"}, {"t": 151.9, "x": "誠実でいようとした結果のことが多いです。"}, {"t": 154.83333333333334, "x": "断られた側がこれを知らないと、\n冷たさを断りの続きだと受け取ります。"}, {"t": 159.98333333333332, "x": "本当は相手も距離の取り方に迷っているだけかも\nしれません。"}, {"t": 163.86666666666667, "x": "断った側の気まずさを軽くできるのは、\n実は断られた側です。"}, {"t": 168.53333333333333, "x": "普段通りに話しかけられると、\n断った側はほっとしやすいです。"}, {"t": 173.01666666666668, "x": "ほっとした相手はこちらを前より\n落ち着いて見られます。"}, {"t": 176.36666666666667, "x": "意識され直すのはその落ち着いた\n目で見られた時です。"}, {"t": 179.73333333333332, "x": "断られた直後の動き方には男女で傾きがあります。"}, {"t": 183.51666666666668, "x": "男は失ったものを取り返そうとしやすいです。"}, {"t": 186.71666666666667, "x": "もう一度だけ話したい。"}, {"t": 188.33333333333334, "x": "誤解を解きたい。"}, {"t": 189.55, "x": "本気だと分かってほしい。"}, {"t": 191.23333333333332, "x": "長い文章を送ってしまう人もいます。"}, {"t": 193.83333333333334, "x": "けれども相手には、断りが届いていないように\n感じられます。"}, {"t": 197.96666666666667, "x": "一方で女は、告白そのものを\n無かったことにしようとしやすいです。"}, {"t": 202.65, "x": "冗談だったことにする。"}, {"t": 204.25, "x": "何も言わなかったように笑う。"}, {"t": 206.3, "x": "急に話題を変える。"}, {"t": 207.8, "x": "ただ無かったことにされると、断った側は戸惑います。"}, {"t": 211.6, "x": "真剣に考えて答えたのに、その答えまで\n消えたように感じるからです。"}, {"t": 216.56666666666666, "x": "取り返す動きも消す動きも、\n急いでいる点は同じです。"}, {"t": 220.58333333333334, "x": "戻ってくる人は断られた事実をそのまま受け取ります。"}, {"t": 224.16666666666666, "x": "説明は足しません。"}, {"t": 225.61666666666667, "x": "消そうともしません。"}, {"t": 226.93333333333334, "x": "一言のお礼で区切ります。"}, {"t": 228.75, "x" let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
