<script>
const D={"name": "男は頼られると女は頼れると好きになる", "file": "078_男は頼られると女は頼れると好きになる", "dur": 763.01665625, "segs": [], "subs": [{"t": 0.0, "x": "好きになるきっかけは、頼る場面と頼\nられる場面に多く隠れています。"}, {"t": 4.7, "x": "男は、頼られた時に好きが動きやすいと言われます。"}, {"t": 8.483333333333333, "x": "女は、頼れた時に好きが動きやすいと言われます。"}, {"t": 12.166666666666666, "x": "同じ一つの頼みごとでも、好\nきになる場所が反対なのです。"}, {"t": 16.316666666666666, "x": "重い荷物を運んでもらう。"}, {"t": 18.15, "x": "迷った道を案内してもらう。"}, {"t": 20.233333333333334, "x": "仕事の悩みを最後まで聞いてもらう。"}, {"t": 22.733333333333334, "x": "こうした場面で、二人は別々の理由で心が動\nいています。"}, {"t": 27.25, "x": "男は、役に立てた手ごたえで\n相手を好きになりやすいです。"}, {"t": 31.2, "x": "女は、任せても大丈夫だった\n安心で相手を好きになりやすいです。"}, {"t": 35.88333333333333, "x": "この違いを知らないと、好か\nれようとして逆の動きをしがちです。"}, {"t": 40.3, "x": "しっかり見せようとして、頼る隙を一つも作らない。"}, {"t": 44.016666666666666, "x": "いい人に見せようとして、頼\nまれる前に全部済ませてしまう。"}, {"t": 48.13333333333333, "x": "どちらも、好かれるきっかけを\n自分で閉じている形です。"}, {"t": 51.86666666666667, "x": "もったいないすれ違いです。"}, {"t": 53.56666666666667, "x": "少しの知識で防げます。"}, {"t": 55.36666666666667, "x": "今日は、頼りと好きのつなが\nりを男女に分けて並べます。"}, {"t": 59.11666666666667, "x": "付き合う前から付き合い始めまでの話です。"}, {"t": 62.083333333333336, "x": "二十代と三十代の恋に、特に当\nてはまりやすい内容です。"}, {"t": 66.45, "x": "好かれる頼り方も最後に三つ出します。"}, {"t": 69.16666666666667, "x": "帰り道で、急な雨に降られた場面を考えてみます。"}, {"t": 73.28333333333333, "x": "片方は傘を持っていて、もう\n片方は持っていませんでした。"}, {"t": 77.3, "x": "傘に入れてもらった人は、助かったと感じます。"}, {"t": 80.58333333333333, "x": "実は傘に入れた人も少し嬉しくなっています。"}, {"t": 83.75, "x": "肩が少し濡れても気になりません。"}, {"t": 86.03333333333333, "x": "帰り道が、いつもより短く感じられます。"}, {"t": 89.28333333333333, "x": "頼った人だけが得をしたように\n見えて、そうではないのです。"}, {"t": 93.26666666666667, "x": "男は、傘に入れるほうに立っ\nた時に気持ちが動きやすいです。"}, {"t": 97.5, "x": "役に立てたことが、そのまま好きの種になります。"}, {"t": 100.71666666666667, "x": "一方で女は、入れてもらうほうに\n立った時に気持ちが動きやすいです。"}, {"t": 105.51666666666667, "x": "この人なら任せられる、と感じた瞬間が種になります。"}, {"t": 109.48333333333333, "x": "同じ傘の下で、二人は反対の向きから\n近づいています。"}, {"t": 113.71666666666667, "x": "頼みごとは片方だけが借りを\n作る場面ではありません。"}, {"t": 117.36666666666666, "x": "両方に、好きになる理由を一つずつ配る場面です。"}, {"t": 121.18333333333334, "x": "これを知っていると、頼み方も受\nけ方も変わっていきます。"}, {"t": 125.11666666666666, "x": "まずは男の心の動き方から見ていきます。"}, {"t": 128.15, "x": "男は、誰かの役に立てた時に自分の価値を感\nじやすいと言われます。"}, {"t": 132.98333333333332, "x": "重い箱を運ぶ。"}, {"t": 134.31666666666666, "x": "壊れた家電を直す。"}, {"t": 135.9, "x": "行きたい店の場所を調べる。"}, {"t": 137.75, "x": "終わった時の相手のほっとした顔が、\n一番のごほうびになります。"}, {"t": 142.1, "x": "大事なのは、頼まれた中身の大きさではありません。"}, {"t": 145.7, "x": "自分を選んで頼んでくれた、という点のほうです。"}, {"t": 149.1, "x": "ほかにも人がいる中で、自分に声がかかった。"}, {"t": 152.48333333333332, "x": "その小さな特別扱いが、相手を気にか\nけるきっかけになります。"}, {"t": 156.93333333333334, "x": "人は手間をかけた相手を大事に思いやすいと\n言われます。"}, {"t": 160.56666666666666, "x": "かけた手間のぶんだけ、相手が身近に感\nじられるからです。"}, {"t": 164.45, "x": "ただし、うまくできなかった時は別です。"}, {"t": 167.41666666666666, "x": "恥ずかしさが先に立つことがあります。"}, {"t": 169.78333333333333, "x": "気持ちを引っ込めてしまう人もいます。"}, {"t": 172.15, "x": "次からは、自分から近づかなくなることもあります。"}, {"t": 175.76666666666668, "x": "男にはできそうなことを頼むほうが届きやすいです。"}, {"t": 179.23333333333332, "x": "できたという手ごたえまでが、\n一つの頼みごとなのです。"}, {"t": 182.85, "x": "一方で女は、安心して任せら\nれた時に好きになりやすいと言われます。"}, {"t": 187.88333333333333, "x": "道を任せたら、迷わずに着いた。"}, {"t": 190.5, "x": "店選びを任せたら、外れが無かった。"}, {"t": 193.33333333333334, "x": "困りごとを話したら、慌てずに聞いてくれた。"}, {"t": 196.46666666666667, "x": "こうした場面が重なると、この\n人のそばは楽だと感じ始めます。"}, {"t": 200.98333333333332, "x": "女にとって頼ることは、弱さを\n見せることとは限りません。"}, {"t": 205.1, "x": "肩の力を抜いても大丈夫な相手かを、\n確かめている形です。"}, {"t": 209.61666666666667, "x": "いつも気を張っている人ほど、\nこの確かめは大事になります。"}, {"t": 213.61666666666667, "x": "気を抜ける場所が無くなりやすいからです。"}, {"t": 216.15, "x": "頼ってみて、相手がそれを重そうにしなかった。"}, {"t": 219.4, "x": "その安心が少しずつ好きの形に育っていきます。"}, {"t": 222.81666666666666, "x": "反対に、ため息をつかれると\n気持ちは閉じやすいです。"}, {"t": 226.65, "x": "頼んだ中身より、受け止め方が心に残ります。"}, {"t": 230.2, "x": "女が見ているのは、手際より\n受け止め方のほうかもしれません。"}, {"t": 234.43333333333334, "x": "ここが男の見ている場所とずれやすいところです。"}, {"t": 237.48333333333332, "x": "手ごたえを見る男と、安心を見る女です。"}, {"t": 240.75, "x": "見ている場所が違うので、同\nじ場面でも満足の理由が違います。"}, {"t": 245.28333333333333, "x": "頼みごとは相手に迷惑を  "戸口が一つあるだけで、相手は声をか\nけやすくなります。"}, {"t": 364.48333333333335, "x": "ここまでだと、男は頼られるだけの\n役に見えるかもしれません。"}, {"t": 368.71666666666664, "x": "けれども男にも誰かを頼りたい時があります。"}, {"t": 371.85, "x": "ただ、頼っている形を取るのが\n苦手な人が多いようです。"}, {"t": 375.9, "x": "頼みごとをすると、負けたように感じやすいからです。"}, {"t": 379.6, "x": "そのため男の頼り方は遠回しになりやすいです。"}, {"t": 383.1, "x": "これどう思うかと、意見を聞く。"}, {"t": 385.46666666666664, "x": "料理の味見を頼む。"}, {"t": 387.03333333333336, "x": "服選びに付き合ってもらう。"}, {"t": 388.8666666666667, "x": "どれも小さな頼みです。"}, {"t": 390.5833333333333, "x": "本人は軽く聞いているつもりで、実は頼っています。"}, {"t": 394.4166666666667, "x": "一方で女は、この遠回しの頼りを\n見逃しやすいと言われます。"}, {"t": 399.0, "x": "助けてとは言われないからです。"}, {"t": 400.96666666666664, "x": "ただの雑談に見えてしまいます。"}, {"t": 403.1166666666667, "x": "意見を聞かれた時に真剣に答えると、\n男は嬉しくなりやすいです。"}, {"t": 407.96666666666664, "x": "迷いを受け止めてもらえた、と感じるからです。"}, {"t": 411.06666666666666, "x": "女が頼れて好きになるのと、よく似た動きです。"}, {"t": 414.5833333333333, "x": "男も、受け止めてくれる相手には\n気を許しやすいです。"}, {"t": 418.31666666666666, "x": "頼りたい気持ちそのものは男女で同\nじなのかもしれません。"}, {"t": 422.03333333333336, "x": "付き合う前の頼みごとには、\nちょうどいい重さがあります。"}, {"t": 425.75, "x": "最初から重い頼みをすると、\n相手は身構えてしまいます。"}, {"t": 429.8666666666667, "x": "引っ越しの手伝い。"}, {"t": 431.15, "x": "お金の相談。"}, {"t": 432.3333333333333, "x": "家族の悩み。"}, {"t": 433.5, "x": "こうした頼みは関係ができてか\nらのほうが受け取りやすいです。"}, {"t": 437.35, "x": "最初は断られても気まずくならない重さから始めます。"}, {"t": 441.06666666666666, "x": "おすすめの店を聞く。"}, {"t": 442.6, "x": "パソコンの設定を教えてもらう。"}, {"t": 444.85, "x": "書類に目を通してもらう。"}, {"t": 446.5833333333333, "x": "この程度で十分です。"}, {"t": 448.21666666666664, "x": "男は、軽い頼みに応えるたびに\n相手を気にかけ始めやすいです。"}, {"t": 452.8666666666667, "x": "女は軽い頼みへの応え方を見て、\n次も頼れるかを確かめやすいです。"}, {"t": 458.0, "x": "二度目は一度目より少しだけ重い頼みにしてみます。"}, {"t": 461.45, "x": "嫌がらずに応えてくれたら、\n距離は確かに縮まっています。"}, {"t": 465.48333333333335, "x": "階段を一段ずつ上がるような進め方です。"}, {"t": 468.51666666666665, "x": "急に上がると頼りすぎに見えることがあります。"}, {"t": 471.48333333333335, "x": "相手の顔を見ながら、一段ずつで十分です。"}, {"t": 474.81666666666666, "x": "頼みの重さは二人の近さを測\nる物差しのようなものです。"}, {"t": 478.76666666666665, "x const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
