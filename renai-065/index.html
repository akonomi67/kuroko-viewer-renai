<script>
const D={"name": "結婚式の準備で二人の素が出る理由", "file": "065_結婚式の準備で二人の素が出る理由", "dur": 835.1333125, "segs": [], "subs": [{"t": 0.0, "x": "結婚式の準備を始めると、相手の知\nらない面が出てくると言われます。"}, {"t": 4.983333333333333, "x": "付き合っていた頃には、一度も見なかった顔です。"}, {"t": 8.316666666666666, "x": "急に黙る。"}, {"t": 9.283333333333333, "x": "細かい所にこだわる。"}, {"t": 10.95, "x": "親の話になると声が変わる。"}, {"t": 13.1, "x": "けれども、出てきたのは悪い面とは限りません。"}, {"t": 16.416666666666668, "x": "もともと持っていた決め方の癖が、\n表に出てきただけの場合が多いです。"}, {"t": 21.166666666666668, "x": "準備の期間は、決めることの\n数が普段と桁違いに増えます。"}, {"t": 25.5, "x": "しかも、お金と人付き合いと\n疲れが、同じ時期に重なります。"}, {"t": 29.9, "x": "隠す余裕がなくなるので、素が出や\nすくなるわけです。"}, {"t": 33.65, "x": "男は全体を早く片づけたい方向に、\n素が出やすいです。"}, {"t": 38.016666666666666, "x": "一方で女は、一つ一つの場面を大事に\nしたい方向に出やすいです。"}, {"t": 43.016666666666666, "x": "どちらも、良い式にしたいという気持ちは同じです。"}, {"t": 46.45, "x": "ただ、その気持ちの出口が違\nうので、ぶつかって見えます。"}, {"t": 50.75, "x": "ぶつかった場面だけを覚えていると、\n相手を減点で見てしまいます。"}, {"t": 55.25, "x": "今日は、素が出る場面を順番に並べていきます。"}, {"t": 58.766666666666666, "x": "最後まで見ると、準備の期間だから\n分かる相手の良さも見えてきます。"}, {"t": 63.666666666666664, "x": "まず、なぜ準備の期間に素が出やすいのかを\n見ておきます。"}, {"t": 67.83333333333333, "x": "理由の一つは、決めることの数がとても多いことです。"}, {"t": 71.51666666666667, "x": "日取り。"}, {"t": 72.6, "x": "会場。"}, {"t": 73.7, "x": "招待する人。"}, {"t": 74.95, "x": "料理。"}, {"t": 76.05, "x": "衣装。"}, {"t": 77.15, "x": "引き出物。"}, {"t": 78.01666666666667, "x": "その下に、小さな決めごとが何百と続くと言われます。"}, {"t": 81.98333333333333, "x": "普段の暮らしで、二人がこれ\nほど続けて何かを決めることはありません。"}, {"t": 86.75, "x": "ところが準備では、任せる前提\nそのものがそろっていないことがあります。"}, {"t": 91.51666666666667, "x": "男は、決める数が多いほど仕分\nけて減らしたくなりやすいです。"}, {"t": 95.71666666666667, "x": "一方で女は、数が多くても一\nつずつ納得して進めたい場合があります。"}, {"t": 101.05, "x": "減らしたい側と、納得したい側が、\n同じ机に向かうことになります。"}, {"t": 106.15, "x": "この違いは、付き合っている\n頃にはほとんど見えません。"}, {"t": 109.83333333333333, "x": "決める場面そのものが少なかったからです。"}, {"t": 112.5, "x": "つまり、素が急に変わったのではありません。"}, {"t": 115.58333333333333, "x": "見える場面が、初めてまとめ\nてやって来ただけなのです。"}, {"t": 119.25, "x": "次は、考え始める場所の違いです。"}, {"t": 122.2, "x": "男は、全体の枠から考え始めやすいと言われます。"}, {"t": 126.3, "x": "予算の上限。"}, {"t": 127.46666666666667, "x": "呼ぶ人数。"}, {"t": 128.45, "x": "日取りの候補。"}, {"t": 129.58333333333334, "x": "枠が決まれば、中身はその範囲で選\nべばいいという考え方です。"}, {"t": 134.2, "x": "一方で女は、場面から考え始めることが多いようです。"}, {"t": 138.5, "x": "入場の瞬間。"}, {"t": 139.81666666666666, "x": "親に手紙を読む時間。"}, {"t": 141.51666666666668, "x": "友達と写真を撮る場面。"}, {"t": 143.4, "x": "思い描いた場面を積み上げて、\n全体を組み立てていきます。"}, {"t": 147.66666666666666, "x": "枠から考える側には、場面の話が先走\nりに聞こえることがあります。"}, {"t": 152.73333333333332, "x": "まだ予算も決まっていないのに、と\nいう受け取り方です。"}, {"t": 156.28333333333333, "x": "場面から考える側には、枠の話が夢を削\nる作業に聞こえることがあります。"}, {"t": 161.86666666666667, "x": "まだ何も思い描いていないのに、と\nいう受け取り方です。"}, {"t": 165.63333333333333, "x": "どちらの順番も、式を形にす\nるためには必要なものです。"}, {"t": 169.98333333333332, "x": "あなたも、話し合いの順番だけで気まず\nくなったことがあるのではないでしょうか。"}, {"t": 174.98333333333332, "x": "これは気持ちが合わないのではありません。"}, {"t": 177.5, "x": "同じ家を、骨組みから建てるか、\n窓から建てるかの違いなのです。"}, {"t": 182.21666666666667, "x": "お金の話になると、素がいちば\nん分かりやすく出ると言われます。"}, {"t": 186.63333333333333, "x": "ただ、出てくるのは金額の大小だけではありません。"}, {"t": 190.3, "x": "何に多く使って、何を削るかという順番の方です。"}, {"t": 194.33333333333334, "x": "男は、形に残らないものを削りたくなりやすいです。"}, {"t": 198.18333333333334, "x": "花の量。"}, {"t": 199.01666666666668, "x": "演出の数。"}, {"t": 200.1, "x": "当日だけ使う小物。"}, {"t": 201.81666666666666, "x": "一日で終わるものに大きく払うのは、も\nったいなく感じる場合があります。"}, {"t": 206.76666666666668, "x": "その代わり、料理や引き出物のように\n相手に渡るものは守りたいようです。"}, {"t": 211.8, "x": "来てくれた人に失礼がないか\nどうかを、先に考えやすいです。"}, {"t": 216.16666666666666, "x": "削る場所の選び方には、人に恥をかか\nせたくない気持ちが出ています。"}, {"t": 220.96666666666667, "x": "ケチだから削るのではなく、\n守る場所を先に決めているのです。"}, {"t": 225.21666666666667, "x": "何を削るかより、何を守りたいのかを\n先に聞くと話が進みやすいです。"}, {"t": 230.41666666666666, "x": "順番の中に、その人が大事に\nしているものが並んでいます。"}, {"t": 234.6, "x": "お金の話は、実は相手の大事なものの\n一覧表になっているのです。"}, {"t": 239.51666666666668, "x": "一方で女の側の順番にも、同じように\n理由があります。"}, {"t": 243.88333333333333, "x": "女は、あとから見返す場面に\nお金を残したくなりやすいです。"}, {"t": 248.18333333333334, "x": "写真。"}, {"t": 249.26666666666668, "x": "衣装。"}, {"t": 250.36666666666667, "x": "会場の雰囲気。"}, {"t": 251.76666666666668, "x": "一日で終わるどころか、何年も見返\nすものとして考えています。"}, {"t": 256.4166666666667, "x": "だから、そこを削る提案には\n強く引っかかることがあります。"}, {"t": 260.5, "x": "一方で男は、写真の枚数や衣装の差が\nそれほど気にならない場合があります。"}, {"t": 266.05, "x": "気にならない所に大きく払う理由が、\n見えにくいようです。"}, {"t": 270.1, "x": "けれども、女の側が守りたいのは\n物そのものではありません。"}, {"t": 274.4, "x": "その日の自分たちを、ちゃんと\n残しておきたいという気持ちです。"}, {"t": 278.51666666666665, "x": "親や友達と写る場面を、きれいに\n残したいという人もいます。"}, {"t": 282.9, "x": "見返すたびに、準備の日々ごと思い出せるからです。"}, {"t": 286.56666666666666, "x": "わがままで残すのではなく、\n思い出の置き場所を作っているのです。"}, {"t": 290.85, "x": "何を残すかより、誰と一緒の場面を残\nしたいのかを聞くと進みやすいです。"}, {"t": 296.1, "x": "順番の中に、その人が大事に\nしている人が並んでいます。"}, {"t": 300.25, "x": "削る側と残す側は、同じ一日を別の時間の長\nさで見ているだけです。"}, {"t": 305.53333333333336, "x": "準備が進むと、二人の外からも希望が届き始めます。"}, {"t": 309.73333333333335, "x": "いちばん多いのは、それぞれの\n親からの希望だと言われます。"}, {"t": 313.65, "x": "親戚は全員呼んでほしい。"}, {"t": 315.76666666666665, "x": "この日取りは避けてほしい。"}, {"t": 317.51666666666665, "x": "お金を少し出したい。"}, {"t": 318.98333333333335, "x": "どれも、親なりに子どもの門出を大事に\nしている形です。"}, {"t": 322.9166666666667, "x": "ここで出る素は、親への向き方です。"}, {"t": 325.6166666666667, "x": "男は、自分の親の希望を軽く流\nしやすいことがあります。"}, {"t": 329.85, "x": "言わせておけばいい、という\n感覚に近い場合が多いようです。"}, {"t": 333.98333333333335, "x": "一方で女は、相手の親の希望を重\nく受け止めやすいと言われます。"}, {"t": 338.75, "x": "流して大丈夫なのか分からず、\n一人で抱えてしまうことがあります。"}, {"t": 343.28333333333336, "x": "助かるのは、それぞれの親の窓口を、\nそれぞれが引き受ける形です。"}, {"t": 348.21666666666664, "x": "自分の親の希望は、自分が聞いて自分が返す。"}, {"t": 351.8333333333333, "x": "この形にするだけで、板ばさ\nみになる人が減りやすいです。"}, {"t": 355.8666666666667, "x": "窓口を引き受ける姿には、相手を矢面に立\nたせない気づかいが出ます。"}, {"t": 360.81666666666666, "x": "親の話で見えるのは、実は相手をかば\nう力の方なのです。"}, {"t": 365.23333333333335, "x": "招待する人を決める作業でも、素がはっきり出ます。"}, {"t": 368.98333333333335, "x": "名前を紙に書き出していくと、\n二人の人付き合いの形が並ぶからです。"}, {"t": 373.96666666666664, "x": "学生時代の友達。"}, {"t": 375.68333333333334, "x": "職場の人。"}, {"t": 376.73333333333335, "x": "昔お世話になった人。"}, {"t": 378.43333333333334, "x": "男は、呼ぶ人を立場や義理で決めやすいです。"}, {"t": 381.78333333333336, "x": "上司は呼ぶべきか。"}, {"t": 383.21666666666664, "x": "同期は全員そろえるか。"}, {"t": 385.05, "x": "呼ばないと角が立つか。"}, {"t": 386.6, "x": "一方で女は、呼ぶ人を近さや\n思い出で決めやすいと言われます。"}, {"t": 391.21666666666664, "x": "いま連絡を取っているか。"}, {"t": 392.9, "x": "一緒に泣いたことがあるか。"}, {"t": 394.65, "x": "祝ってほしいか。"}, {"t": 395.9166666666667, "x": "義理で決める側からは、近さの\n基準がゆるく見えることがあります。"}, {"t": 400.31666666666666, "x": "近さで決める側からは、義理の基準が冷\nたく見えることがあります。"}, {"t": 404.8333333333333, "x": "けれども、どちらも来てくれる人に気\nまずい思いをさせたくない気持ちです。"}, {"t": 409.46666666666664, "x": "人数の差が大きい時は、数をそろ\nえるより理由をそろえる方が落ち着きます。"}, {"t": 414.7, "x": "なぜこの人を呼びたいのかを、\n一人ずつ話してみる形です。"}, {"t": 418.76666666666665, "x": "話していくと、相手が大事に\nしてきた人たちの顔が見えてきます。"}, {"t": 423.1666666666667, "x": "これまで知らなかった相手の過去を、\n名前ごと知る機会になります。"}, {"t": 427.55, "x": "線引きの作業は、相手の人生を紹介\nしてもらう時間でもあるのです。"}, {"t": 432.51666666666665, "x": "準備が進むと、任せる言葉が冷\nたく届く場面が出てきます。"}, {"t": 437.0, "x": "どっちでもいいよ。"}, {"t": 438.23333333333335, "x": "好きな方でいいよ。"}, {"t": 439.56666666666666, "x": "任せるよ。"}, {"t": 440.51666666666665, "x": "この言葉が、準備の間はとても多く出ると言われます。"}, {"t": 444.3833333333333, "x": "男は、自分にこだわりの無い所を相手に任\nせやすいです。"}, {"t": 448.55, "x": "こだわりのある人に決めてもらう方が、\n良い式になると考えるようです。"}, {"t": 453.23333333333335, "x": "一方で女は、任せると言われると\n一人で決めている感覚になりやすいです。"}, {"t": 458.3833333333333, "x": "決めた責任まで、自分だけにの\nせられたように感じる場合があります。"}, {"t": 463.18333333333334, "x": "任せる側は、信頼して預けたつもりのことが\n多いです。"}, {"t": 467.1666666666667, "x": "預けられた側は、関心がないと\n受け取ってしまうことがあります。"}, {"t": 471.45, "x": "同じ一言が、信頼にも無関心にも\n聞こえてしまうわけです。"}, {"t": 475.71666666666664, "x": "任せる時は、どっちでもいいより、こっちが\n好きだけど任せると言う方が伝わります。"}, {"t": 481.5, "x": "一言だけでも好みを添えると、\n一緒に決めている感覚が残ります。"}, {"t": 486.28333333333336, "x": "任せられた側も、決める前に一度\nだけ相談すると気持ちが軽くなります。"}, {"t": 491.31666666666666, "x": "こだわりの差は、得意な所を分\nけ合える差でもあります。"}, {"t": 494.95, "x": "全部にこだわる二人より、分\nけ合える二人の方が準備は楽に進みます。"}, {"t": 500.01666666666665, "x": "準備の後半になると、二人とも疲れが溜まってきます。"}, {"t": 504.05, "x": "仕事のあとの打ち合わせ。"}, {"t": 505.8333333333333, "x": "週末ごとの見学。"}, {"t": 507.48333333333335, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
