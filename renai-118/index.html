const D={"name": "一緒に笑った秒数が_二人の近さを映していた_情熱とつながったのは男性だけだった", "file": "118_一緒に笑った秒数が_二人の近さを映していた_情熱とつながったのは男性だけだった", "dur": 758.86665625, "segs": [], "subs": [{"t": 0.0, "x": "恋人と話していて、\n同時にふき出したことはありますか。"}, {"t": 3.9, "x": "どちらかが笑って、つられてもう一人も笑う。"}, {"t": 7.133333333333334, "x": "そんな一瞬は、2人の関係に\nついてなにかを語っているのでしょうか。"}, {"t": 11.9, "x": "それを確かめた研究があります。"}, {"t": 14.183333333333334, "x": "2015年に人と人の関係を\n調べる専門誌に載った論文です。"}, {"t": 18.816666666666666, "x": "書いたのはローラ・カーツとサラ・アルゴ。"}, {"t": 21.066666666666666, "x": "アメリカのノースカロライナ大学の心理学者です。"}, {"t": 24.316666666666666, "x": "集まったのは、付き合っている男女の71組でした。"}, {"t": 28.266666666666666, "x": "2人には、出会った日のことを話してもらいます。"}, {"t": 31.533333333333335, "x": "その会話を録画しました。"}, {"t": 33.333333333333336, "x": "笑いは1秒きざみで書き出しています。"}, {"t": 35.9, "x": "数えたのは、2人が同時に笑っていた時間です。"}, {"t": 39.483333333333334, "x": "同時に笑った時間が長い組ほど、\n2人は近さを感じていました。"}, {"t": 44.36666666666667, "x": "相手が支えてくれるという気持ちも強かったのです。"}, {"t": 47.68333333333333, "x": "ところが満足や情熱になると、話が変わります。"}, {"t": 51.38333333333333, "x": "はっきりつながっていたのは、\n男性のほうだけでした。"}, {"t": 54.833333333333336, "x": "今日はこの研究を、順番に見ていきます。"}, {"t": 58.11666666666667, "x": "論文はまず、笑いについて分かっていたことを\nふり返ります。"}, {"t": 62.28333333333333, "x": "笑いは一人のときより人といるときに起きやすい。"}, {"t": 65.4, "x": "これはよく知られた結果です。"}, {"t": 67.23333333333333, "x": "人の笑いはまわりにうつります。"}, {"t": 69.35, "x": "だれかが笑うと、聞いていた人もつられて笑う。"}, {"t": 72.66666666666667, "x": "しかも知らない人より、友だちのほうがうつりやすい。"}, {"t": 76.2, "x": "そんな研究も紹介されています。"}, {"t": 78.63333333333334, "x": "飲み会でだれかがふき出す。"}, {"t": 80.43333333333334, "x": "すると次々に笑いが広がることがありますね。"}, {"t": 83.51666666666667, "x": "笑いは、人と人のあいだで起きるものなのです。"}, {"t": 86.75, "x": "芸術家も科学者も、笑いは人づきあいに\n大切だと考えてきました。"}, {"t": 91.8, "x": "論文のはじめには、ある詩人の言葉があります。"}, {"t": 95.18333333333334, "x": "友情の甘さの中に笑いがありますように、という\n一節です。"}, {"t": 99.51666666666667, "x": "ところが意外な穴がありました。"}, {"t": 101.6, "x": "笑いの研究は、思ったより進んでいなかったのです。"}, {"t": 105.3, "x": "笑うという行動が、心や関係とどうつながるか。"}, {"t": 108.85, "x": "それを調べたデータがとても少ないのです。"}, {"t": 111.51666666666667, "x": "これまでの研究は、冗談を言うことのほうに\n目を向けてきました。"}, {"t": 115.83333333333333, "x": "冗談で場をなごませる人は好かれるのか。"}, {"t": 118.6, "x": "けんかの最中に冗談を言える夫婦はうまくいくのか。"}, {"t": 122.26666666666667, "x": "そこでは相手が笑ったかどうかが、\n見落とされがちでした。"}, {"t": 125.96666666666667, "x": "笑いの研究も、たいていは笑った本人だけを\n見ていました。"}, {"t": 130.13333333333333, "x": "2人の会話の中で2人がどう笑ったか。"}, {"t": 132.96666666666667, "x": "そこに目を向けた研究は、ほとんどなかったのです。"}, {"t": 136.4, "x": "関係を研究する人こそここを調べるべきではないか。"}, {"t": 140.08333333333334, "x": "論文はそう考えました。"}, {"t": 141.95, "x": "そしてこの研究を始めたのです。"}, {"t": 144.25, "x": "研究者たちが選んだのは、2人が\n同時に笑う瞬間でした。"}, {"t": 148.66666666666666, "x": "理由はいくつかあります。"}, {"t": 150.3, "x": "1つめは、笑いがうつるものだということです。"}, {"t": 153.48333333333332, "x": "親しい相手ほど笑いはうつりやすい。"}, {"t": 155.96666666666667, "x": "それなら同時の笑いの多さは、\n2人の親しさを映すかもしれません。"}, {"t": 160.55, "x": "2つめは、一人だけの笑いのわかりにくさです。"}, {"t": 163.83333333333334, "x": "相手が笑わないときの笑いには、\nいろいろな意味がありえます。"}, {"t": 167.86666666666667, "x": "ちょっとした誤解かもしれません。"}, {"t": 169.85, "x": "からかいかもしれません。"}, {"t": 171.36666666666667, "x": "同時の笑いなら、だれが笑わせたかを\n考えずにすみます。"}, {"t": 175.43333333333334, "x": "3つめは、笑いの起こりについての考えです。"}, {"t": 178.8, "x": "人の笑いはチンパンジーの遊びの\n顔から来たという説があります。"}, {"t": 183.05, "x": "口を開けた遊びの顔は、これは\n安全だよという合図です。"}, {"t": 187.06666666666666, "x": "人でも同じかもしれません。"}, {"t": 188.9, "x": "同時の笑いは、安心につながるのではないか。"}, {"t": 192.23333333333332, "x": "この人といれば大丈夫、という気持ちです。"}, {"t": 195.23333333333332, "x": "そこで研究者たちは、3つの\n気持ちにねらいを定めました。"}, {"t": 199.35, "x": "2人の近さと、相手が支えてくれるという気持ち。"}, {"t": 203.01666666666668, "x": "そして満足や情熱のような、\n関係へのあたたかい気持ちです。"}, {"t": 207.41666666666666, "x": "参加者は大学の職員へのメールで集めました。"}, {"t": 210.81666666666666, "x": "ノースカロライナ大学チャペルヒル校です。"}, {"t": 213.4, "x": "メールが届いたのは、1万1000人\nあまりの職員でした。"}, {"t": 217.3, "x": "申しこんだのは、付き合っている男女の77組です。"}, {"t": 221.2, "x": "年れいは平均28歳です。"}, {"t": 223.55, "x": "20代と30代が中心でした。"}, {"t": 226.06666666666666, "x": "付き合っている長さは、平均で4年あまりです。"}, {"t": 229.45, "x": "2人は一緒に研究室に来ます。"}, {"t": 231.83333333333334, "x": "そこで1時間半をすごしました。"}, {"t": 234.15, "x": "まずは一人ずつ、2人の関係に\nつ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
