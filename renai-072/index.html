<script>
const D={"name": "付き合う前は男が追い付き合った後は女が追う理由", "file": "072_付き合う前は男が追い付き合った後は女が追う理由", "dur": 776.4333125, "segs": [], "subs": [{"t": 0.0, "x": "付き合う前と付き合った後で、\n追う側が入れ替わることがあります。"}, {"t": 4.316666666666666, "x": "付き合う前は男が追うことが多いです。"}, {"t": 6.95, "x": "付き合った後は、女が追う側に回りやすいです。"}, {"t": 10.466666666666667, "x": "男は付き合うまでを一つの山として登りやすいです。"}, {"t": 14.0, "x": "女は付き合ってから山を登り始めやすいです。"}, {"t": 17.2, "x": "登り始める場所が違うのです。"}, {"t": 19.4, "x": "男は連絡の数で好きを伝えようとします。"}, {"t": 22.45, "x": "女は連絡の数で好きを確かめようとします。"}, {"t": 25.616666666666667, "x": "同じ連絡でも、使い道が逆に\nなっていることがあります。"}, {"t": 29.666666666666668, "x": "この入れ替わりを知らないと、\n片方だけが寂しくなります。"}, {"t": 33.583333333333336, "x": "男は落ち着いただけなのに、冷めたと思われます。"}, {"t": 37.1, "x": "女は好きが育っただけなのに、重いと思われます。"}, {"t": 40.68333333333333, "x": "そうやって、好き同士のまま気持ちがずれていきます。"}, {"t": 44.31666666666667, "x": "けれども入れ替わりは、悪い知らせではありません。"}, {"t": 47.61666666666667, "x": "多くの場合は、二人の関係が一段進んだ印です。"}, {"t": 51.71666666666667, "x": "今日は、追う側が入れ替わる\n理由を男女に分けて見ていきます。"}, {"t": 55.88333333333333, "x": "入れ替わる時期と、そのまま\n近くにいる工夫も並べます。"}, {"t": 59.71666666666667, "x": "付き合う前の男は、目の前に一\nつの目標を置きやすいです。"}, {"t": 64.06666666666666, "x": "この人と付き合うという、はっきりした目標です。"}, {"t": 67.38333333333334, "x": "目標が見えていると人は動きやすくなります。"}, {"t": 70.45, "x": "連絡をこまめに送る。"}, {"t": 72.08333333333333, "x": "次の約束を先に決める。"}, {"t": 74.03333333333333, "x": "店を調べて予約する。"}, {"t": 75.75, "x": "どれも目標に近づく一歩として選ばれやすいです。"}, {"t": 79.11666666666666, "x": "断られてももう一度誘ってみることがあります。"}, {"t": 82.23333333333333, "x": "男にとって追うことは、それ\nほど苦ではないことが多いです。"}, {"t": 86.05, "x": "一方で女は付き合う前に目標を一\nつに絞らないことが多いです。"}, {"t": 90.68333333333334, "x": "一緒にいて楽か。"}, {"t": 91.96666666666667, "x": "話は続くか。"}, {"t": 93.25, "x": "大事にされそうか。"}, {"t": 94.63333333333334, "x": "いくつもの問いを、同時に確かめながら\n進めやすいです。"}, {"t": 98.38333333333334, "x": "だから男ほど急いで動かないように見えます。"}, {"t": 101.38333333333334, "x": "けれども気持ちがないわけではありません。"}, {"t": 103.88333333333334, "x": "確かめる作業に時間を使っているだけです。"}, {"t": 106.83333333333333, "x": "男の追い方は一本道を走るような形です。"}, {"t": 110.18333333333334, "x": "女の進み方は地図を広げて道を選ぶような形です。"}, {"t": 114.11666666666666, "x": "走る人と地図を見る人では、速さが違って見えます。"}, {"t": 117.88333333333334, "x": "付き合う前の追う側と待つ側は、\nここから生まれやすいです。"}, {"t": 121.88333333333334, "x": "付き合う前の女は、受け身だと思われがちです。"}, {"t": 125.25, "x": "けれども実際には、相手をよ\nく見ていることが多いです。"}, {"t": 129.01666666666668, "x": "約束の時間を守るか。"}, {"t": 130.83333333333334, "x": "店員への話し方はどうか。"}, {"t": 132.93333333333334, "x": "話をさえぎらないか。"}, {"t": 134.53333333333333, "x": "こうした小さな場面を、静かに\n積み重ねて見ています。"}, {"t": 138.46666666666667, "x": "返信を少し待たせるのも、駆け引きとは限りません。"}, {"t": 142.1, "x": "返す言葉を選ぶうちに、時間が過ぎることもあります。"}, {"t": 145.95, "x": "一方で男は返信の遅さを脈のなさと読みやすいです。"}, {"t": 149.96666666666667, "x": "読み違えると追う手を急に強めることがあります。"}, {"t": 153.2, "x": "連絡を増やす。"}, {"t": 154.4, "x": "会う日を何度も聞く。"}, {"t": 155.85, "x": "会う場所を先に決めてしまう。"}, {"t": 157.8, "x": "女からすると、確かめる時間を削\nられたように感じます。"}, {"t": 161.98333333333332, "x": "この時期の女は、追われる量で好\nきになるわけではありません。"}, {"t": 166.06666666666666, "x": "安心できると分かった時に、\n気持ちが動き出しやすいです。"}, {"t": 170.13333333333333, "x": "男が追うほど、見極める時間が欲\nしくなることもあります。"}, {"t": 174.23333333333332, "x": "どちらが正しいという話ではありません。"}, {"t": 176.88333333333333, "x": "付き合う前の二人は、同じ道を違\nう速さで歩いているだけです。"}, {"t": 181.45, "x": "この速さの差が、付き合った\n後に逆向きで現れてきます。"}, {"t": 185.46666666666667, "x": "追う側の入れ替わりは、ある\n日突然起きるわけではありません。"}, {"t": 189.51666666666668, "x": "多くは、付き合ってから最初の数か月で少\nしずつ進みます。"}, {"t": 193.8, "x": "男は、付き合えた時点で目標を一つ達成しています。"}, {"t": 197.88333333333333, "x": "達成すると走る速さを落としやすいです。"}, {"t": 200.73333333333332, "x": "連絡の間が空く。"}, {"t": 202.01666666666668, "x": "誘う回数が減る。"}, {"t": 203.48333333333332, "x": "デートの下調べが短くなる。"}, {"t": 205.61666666666667, "x": "本人にとっては、ほっと一息\nついただけのことが多いです。"}, {"t": 209.55, "x": "一方で女は付き合えた時点から\n気持ちが動き出しやすいです。"}, {"t": 213.73333333333332, "x": "見極めが終わり、ようやく好\nきを出せると思えるからです。"}, {"t": 217.61666666666667, "x": "連絡を待つ時間が長く感じる。"}, {"t": 219.93333333333334, "x": "次の約束が気になる。"}, {"t": 221.65, "x": "相手の予定を知りたくなる。"}, {"t": 223.48333333333332, "x": "男がゆるめた頃に、女が速くなるという形です。"}, {"t": 227.33333333333334, "x": "二本の線が、途中で交差するように入れ替わります。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
