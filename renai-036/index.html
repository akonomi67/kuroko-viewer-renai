ら見ます。"}, {"t": 71.46666666666667, "x": "男は会って早い段階で、判断が動きやすいです。"}, {"t": 75.36666666666666, "x": "見た目や雰囲気で、対象かどうかを決めます。"}, {"t": 78.65, "x": "決まった後は、そこから熱が上がります。"}, {"t": 81.45, "x": "女は会ってから、時間をかけて動きます。"}, {"t": 84.46666666666667, "x": "話し方や態度を見て、少しずつ変わります。"}, {"t": 87.76666666666667, "x": "だから、最初の温度差は大きいです。"}, {"t": 90.53333333333333, "x": "男の側は、早く進めたくなります。"}, {"t": 93.4, "x": "女の側は、まだ材料が足りません。"}, {"t": 96.23333333333333, "x": "足りない段階で押されると、引きます。"}, {"t": 98.96666666666667, "x": "引かれた側は、脈がないと考えます。"}, {"t": 101.9, "x": "考えて、そこでやめてしまうことがあります。"}, {"t": 105.01666666666667, "x": "やめた三か月後に、相手の気持ちが\n動くこともあります。"}, {"t": 108.93333333333334, "x": "動いた時には、連絡が途切れています。"}, {"t": 111.83333333333333, "x": "だから、最初の反応で決めないでください。"}, {"t": 114.88333333333334, "x": "決めずに、間隔を空けて接点を残します。"}, {"t": 118.15, "x": "残しておけば、時期が合った時に進みます。"}, {"t": 121.28333333333333, "x": "進める形を、消さないことが大事です。"}, {"t": 124.26666666666667, "x": "次に、これはいけると思う場面を見ます。"}, {"t": 127.21666666666667, "x": "男は分かりやすい合図で、確信しやすいです。"}, {"t": 130.78333333333333, "x": "二人で会えた。"}, {"t": 131.83333333333334, "x": "連絡が続いた。"}, {"t": 133.15, "x": "予定が空けられた。"}, {"t": 134.45, "x": "どれも、行動として見える形です。"}, {"t": 137.06666666666666, "x": "女は会話の質で、確信しやすいです。"}, {"t": 140.23333333333332, "x": "話が通じた。"}, {"t": 141.46666666666667, "x": "無理に否定されなかった。"}, {"t": 143.1, "x": "覚えていてくれた。"}, {"t": 144.36666666666667, "x": "どれも、外からは見えにくい材料です。"}, {"t": 147.16666666666666, "x": "だから、同じ日を過ごしても評価が違います。"}, {"t": 150.43333333333334, "x": "男は会えた事実で、進んだと考えます。"}, {"t": 153.8, "x": "女は中身が薄ければ、進んでいないと考えます。"}, {"t": 157.6, "x": "ここで、次の誘い方が変わります。"}, {"t": 160.36666666666667, "x": "会う回数だけを増やしても、\n進まないことがあります。"}, {"t": 164.03333333333333, "x": "進めたいなら、会う中身を一つ足します。"}, {"t": 166.96666666666667, "x": "前に聞いた話を、覚えて出すだけで足ります。"}, {"t": 170.23333333333332, "x": "足すだけで、材料の種類が変わります。"}, {"t": 173.2, "x": "種類が合えば、時期は近づきます。"}, {"t": 175.78333333333333, "x": "進める場面も、ずれます。"}, {"t": 177.96666666666667, "x": "男は早い時期に、はっきりさせたくなりやすいです。"}, {"t": 181.55, "x": "気持ちが山にある間に、決めたいからです。"}, {"t": 184.7, "x": "女はもう少し、見てから決めたくなりやすいです。"}, {"t": 188.16666666666666, "x": "見る対象は、態度が変わらないかどうかです。"}, {"t": 191.23333333333332, "x": "だから、早すぎる申し出は保留されます。"}, {"t": 194.18333333333334, "x": "保留は、断りではありません。"}, {"t": 196.55, "x": "けれども、断られたように見えます。"}, {"t": 199.15, "x": "見えた側は、そこで引きます。"}, {"t": 201.4, "x": "引くと、材料の提供も止まります。"}, {"t": 204.28333333333333, "x": "止まると、相手はもう判断できません。"}, {"t": 207.1, "x": "判断できないまま、関係は薄れます。"}, {"t": 209.98333333333332, "x": "だから、保留された時は待ちます。"}, {"t": 212.45, "x": "待つ間も、態度を変えないことが大事です。"}, {"t": 215.56666666666666, "x": "変えない人は、そこで信用されます。"}, {"t": 218.33333333333334, "x": "信用されると、時期が来た時に選ばれます。"}, {"t": 221.73333333333332, "x": "選ばれる人は、押した人ではありません。"}, {"t": 224.53333333333333, "x": "変わらなかった人です。"}, {"t": 226.03333333333333, "x": "付き合った後も、ずれは続きます。"}, {"t": 228.63333333333333, "x": "男は関係が決まると、安心しやすいです。"}, {"t": 232.05, "x": "決まったので、確認の必要が減ります。"}, {"t": 235.03333333333333, "x": "連絡の回数も、自然に落ち着きます。"}, {"t": 238.01666666666668, "x": "女は決まってから、確認したくなりやすいです。"}, {"t": 241.33333333333334, "x": "本当にこれで良かったのか、を確かめます。"}, {"t": 244.4, "x": "確かめたい時期に、相手が落ち着きます。"}, {"t": 247.28333333333333, "x": "落ち着きは、冷めたように見えます。"}, {"t": 249.75, "x": "見えた側は、不安になります。"}, {"t": 252.16666666666666, "x": "不安から、連絡や質問が増えます。"}, {"t": 255.05, "x": "増えた側は、重く感じます。"}, {"t": 257.35, "x": "そこで、最初の噛み合わなさが生まれます。"}, {"t": 260.3833333333333, "x": "どちらも、悪いことはしていません。"}, {"t": 262.8333333333333, "x": "安心の作り方が、逆なだけです。"}, {"t": 265.53333333333336, "x": "逆だと分かっていれば、対処できます。"}, {"t": 268.25, "x": "落ち着いた側が、一言添えます。"}, {"t": 270.7, "x": "気持ちは変わっていない、と伝えるだけです。"}, {"t": 273.71666666666664, "x": "それだけで、確認は減ります。"}, {"t": 276.05, "x": "数か月後の景色も、見ておきます。"}, {"t": 278.76666666666665, "x": "どんな関係でも、熱は一度下がります。"}, {"t": 281.76666666666665, "x": "下がるのは、生活が戻るからです。"}, {"t": 284.43333333333334, "x": "男は落ち着きを、良い状態と受け取りやすいです。"}, {"t": 287.98333333333335, "x": "気を張らずにいられる関係が、理想だからです。"}, {"t": 291.28333333333336, "x": "女は落ち着きを、変化として受け取りやすいです。"}, {"t": 294.7, "x": "前はしてくれたのに、が出てきます。"}, {"t": 297.21666666666664, "x": "どちらも自然な受け取り方です。"}, {"t": 299.28333333333336, "x": "自然なのに、片方だけが不安になります。"}, {"t": 302.4, "x": "不安を放っておくと、責める形になります。"}, {"t": 305.6666666666667, "x": "責められた側は、理不尽に感じます。"}, {"t": 308.48333333333335, "x": "感じた側は、さらに落ち着こうとします。"}, {"t": 311.4, "x": "そこで、距離が開きます。"}, {"t": 313.3833333333333, "x": "開かないようにするには、形を残します。"}, {"t": 316.45, "x": "週に一回だけ、二人の時間を作る。"}, {"t": 319.55, "x": "量ではなく、残っている事実が効きます。"}, {"t": 322.53333333333336, "x": "効くので、短くて構いません。"}, {"t": 324.9, "x": "終わりの方も、順番があります。"}, {"t": 327.3666666666667, "x": "冷める時期は、たいてい同時に来ません。"}, {"t": 330.06666666666666, "x": "片方が先に、離れ始めます。"}, {"t": 332.6666666666667, "x": "先に離れる側は、少し前から準備しています。"}, {"t": 336.3, "x": "準備といっても、意識的ではありません。"}, {"t": 339.1666666666667, "x": "期待するのを、やめていくだけです。"}, {"t": 341.75, "x": "やめた分だけ、要求も減ります。"}, {"t": 344.35, "x": "要求が減ると、相手は楽になります。"}, {"t": 347.28333333333336, "x": "楽になった側は、うまくいっていると感じます。"}, {"t": 350.5, "x": "だから、気づきません。"}, {"t": 352.1333333333333, "x": "女は不満が消えた時に、離れ始めやすいです。"}, {"t": 355.81666666666666, "x": "男は不満がないことを、順調だと考えやすいです。"}, {"t": 359.78333333333336, "x": "ここが、いちばん危ない場所です。"}, {"t": 362.1166666666667, "x": "静かな時期が、いちばん危ないです。"}, {"t": 364.73333333333335, "x": "危なさは、外からは見えません。"}, {"t": 367.15, "x": "見えないので、確かめるしかありません。"}, {"t": 369.9, "x": "最近どう、と聞くだけで足ります。"}, {"t": 372.35, "x": "聞ける関係を、残しておきます。"}, {"t": 374.85, "x": "決断の時期も、ずれます。"}, {"t": 377.03333333333336, "x": "女は別れを言う前に、長く考える傾向があります。"}, {"t": 381.31666666666666, "x": "考える間に、気持ちの整理が進みます。"}, {"t": 384.6333333333333, "x": "整理が終わってから、言葉にします。"}, {"t": 387.18333333333334, "x": "だから、言われた時にはもう決まっています。"}, {"t": 390.1666666666667, "x": "男は言われてから、考え始めることが多いです。"}, {"t": 393.78333333333336, "x": "その時点で、相手は数か月先にいます。"}, {"t": 396.96666666666664, "x": "数か月分の差は、話し合いでは埋まりません。"}, {"t": 400.3, "x": "埋まらないので、引き止めが効きません。"}, {"t": 402.8833333333333, "x": "効かないのに、理由が分かりません。"}, {"t": 405.48333333333335, "x": "分からないまま、急だと感じます。"}, {"t": 407.98333333333335, "x": "急に見えるのは、気づかなかった側の景色です。"}, {"t": 411.3833333333333, "x": "相手にとっては、長い時間の結論です。"}, {"t": 414.4166666666667, "x": "だ const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
