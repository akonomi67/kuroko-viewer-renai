<script>
const D={"name": "子どもが独立した日から夫婦の呼び方が変わる", "file": "068_子どもが独立した日から夫婦の呼び方が変わる", "dur": 802.0833125, "segs": [], "subs": [{"t": 0.0, "x": "子どもが家を出た日から、夫婦の間で静かに\n変わるものがあります。"}, {"t": 4.583333333333333, "x": "それは会話の量よりも先に、\nお互いの呼び方に出やすいです。"}, {"t": 8.933333333333334, "x": "何十年も、相手をお父さんやお母さんと\n呼んできた家は多いと思います。"}, {"t": 14.15, "x": "その呼び方は、子どもの目線から見た名前でした。"}, {"t": 17.6, "x": "子どもが家にいなくなると、\nその名前だけが部屋に残ります。"}, {"t": 21.733333333333334, "x": "男は呼び方が残っていても、\n特に困らないことが多いです。"}, {"t": 25.966666666666665, "x": "女は同じ呼び方の中に、役目が終\nわった響きを聞きやすいです。"}, {"t": 30.75, "x": "男は空いた時間を、やっと来\nた休みとして受け取りやすいです。"}, {"t": 35.06666666666667, "x": "女は空いた時間を、急に来た空白と\nして受け取りやすいです。"}, {"t": 39.416666666666664, "x": "同じ静かな夕方を、違う重さで\n過ごしているわけです。"}, {"t": 43.483333333333334, "x": "この違いを知らないと、相手の元気のなさを\n気のせいで片づけてしまいます。"}, {"t": 48.4, "x": "気のせいで片づけられた側は、\n話すのを少しずつやめていきます。"}, {"t": 52.78333333333333, "x": "今日は、子どもが巣立った後の数年に起\nきることを並べていきます。"}, {"t": 57.166666666666664, "x": "先に言っておくと、これは寂\nしさに負けた話ではありません。"}, {"t": 61.28333333333333, "x": "二人の間の宛先が、一度引っ越\nしをするだけの話です。"}, {"t": 65.53333333333333, "x": "多くの夫婦は、子どもが生ま\nれた頃に呼び方が変わります。"}, {"t": 69.55, "x": "名前で呼んでいた相手を、あ\nる日からお父さんと呼ぶ。"}, {"t": 73.11666666666666, "x": "子どもに向かって話すうちに、\nそのまま定着していきます。"}, {"t": 77.1, "x": "これは手抜きではなく、家の中を回\nすための工夫だったようです。"}, {"t": 81.51666666666667, "x": "子どもに伝わる言葉で話せば、\n一度で用事が済むからです。"}, {"t": 85.68333333333334, "x": "男は、この呼び方を家族の看板のように\n受け取りやすいです。"}, {"t": 90.01666666666667, "x": "一家の主。"}, {"t": 91.15, "x": "子どもの父。"}, {"t": 92.21666666666667, "x": "家を支える側。"}, {"t": 93.58333333333333, "x": "呼ばれるたびに、自分の立ち位置が確か\nめられる感覚に近いです。"}, {"t": 98.11666666666666, "x": "一方で女は、この呼び方を役目の名前と\nして受け取りやすいです。"}, {"t": 102.78333333333333, "x": "弁当を作る人。"}, {"t": 104.21666666666667, "x": "連絡帳を見る人。"}, {"t": 105.7, "x": "帰りを待つ人。"}, {"t": 107.01666666666667, "x": "呼ばれるたびに、やることが\n一つ増える場合もあります。"}, {"t": 110.78333333333333, "x": "同じお父さんとお母さんでも、\n中に入っているものが違います。"}, {"t": 115.21666666666667, "x": "中身が違うので、子どもが出\nて行った後の響きも違ってきます。"}, {"t": 119.55, "x": "呼び方そのものが悪いのではありません。"}, {"t": 122.15, "x": "子どもと一緒に、その言葉の半分が家を出\nて行っただけなのです。"}, {"t": 126.55, "x": "子どもが出て行った後も、男の側は呼\nび方を変えないことが多いです。"}, {"t": 131.26666666666668, "x": "朝起きて、お母さんと呼ぶ。"}, {"t": 133.43333333333334, "x": "お茶を頼む時も、同じ呼び方をする。"}, {"t": 136.33333333333334, "x": "本人にとっては、何年も使っ\nてきた相手の名前だからです。"}, {"t": 140.48333333333332, "x": "男は、呼び方を関係のラベルと\nして扱いやすいと言われます。"}, {"t": 144.96666666666667, "x": "ラベルが変わらない限り、中身も変\nわっていないと感じやすいです。"}, {"t": 149.4, "x": "仕事がある。"}, {"t": 150.38333333333333, "x": "家がある。"}, {"t": 151.21666666666667, "x": "帰る場所も同じ。"}, {"t": 152.6, "x": "外側が続いているので、内側の変化に気\nづくのが遅れがちです。"}, {"t": 157.4, "x": "一方で女は、その呼び方を聞くたびに\n少し止まることがあります。"}, {"t": 162.0, "x": "もう送り出す弁当も、待つ帰りもありません。"}, {"t": 165.21666666666667, "x": "それでも呼ばれる名前だけは、\n前と同じまま続いていきます。"}, {"t": 169.38333333333333, "x": "男の側から見ると、何も変え\nていないのだから問題はないはずです。"}, {"t": 174.25, "x": "けれども、何も変えていないことが\n引っかかる場合があります。"}, {"t": 178.18333333333334, "x": "これは冷たいのではありません。"}, {"t": 180.2, "x": "変わったことに気づく場所が、\nたまたま違っているだけなのです。"}, {"t": 184.13333333333333, "x": "女の側が引っかかるのは、呼\nび方の中の役目の方です。"}, {"t": 188.33333333333334, "x": "お母さんと呼ばれて、振り向\nいた先に子どもはいません。"}, {"t": 192.13333333333333, "x": "振り向く理由だけが、体に残っていることがあります。"}, {"t": 195.71666666666667, "x": "女は、役目と自分の時間を重ね\nて過ごしてきた場合が多いです。"}, {"t": 200.43333333333334, "x": "朝の支度。"}, {"t": 201.43333333333334, "x": "学校の行事。"}, {"t": 202.68333333333334, "x": "受験の前の夜食。"}, {"t": 204.21666666666667, "x": "それが一度に無くなると、手の置\nき場所に困るようです。"}, {"t": 208.05, "x": "一方で男も、実は同じような\n空白を抱えていることがあります。"}, {"t": 212.88333333333333, "x": "送り迎えの車。"}, {"t": 214.35, "x": "休日の部活の応援。"}, {"t": 216.16666666666666, "x": "進路の相談。"}, {"t": 217.35, "x": "ただ、男はそれを仕事の忙しさで\n上書きしやすいです。"}, {"t": 221.4, "x": "上書きできるので、空白があ\nること自体を口に出しません。"}, {"t": 225.46666666666667, "x": "女は、空白を言葉にして確か\nめたい方に傾きやすいです。"}, {"t": 229.93333333333334, "x": "男は、空白を言葉にしないま\nま埋めたい方に傾きやすいです。"}, {"t": 234.51666666666668, "x": "どちらも寂しいのに、片方は話し、片方は黙ります。"}, {"t": 238.98333333333332, "x": "黙った側は平気そうに見え、\n話した側は大げさに見えます。"}, {"t": 243.38333333333333, "x": "その見え方の差が、次の食卓の話に\nつながっていきます。"}, {"t": 247.6, "x": "子どもが家を出ると、まず食卓の景色が変わります。"}, {"t": 251.36666666666667, "x": "四人掛けのテーブルに、二人分の皿だけが並ぶ。"}, {"t": 254.96666666666667, "x": "空いた椅子に、つい目が行ってしまうこともあります。"}, {"t": 258.28333333333336, "x": "それまでの夕食では、会話の宛先は\nたいてい子どもでした。"}, {"t": 262.4, "x": "今日の学校はどうだった。"}, {"t": 264.1166666666667, "x": "明日は何時に出る。"}, {"t": 265.53333333333336, "x": "部活はどう。"}, {"t": 266.56666666666666, "x": "夫婦は、子どもへの質問を通\nしてお互いの様子を知っていたのです。"}, {"t": 271.23333333333335, "x": "男は、宛先が無くなると黙っ\nて食べる方に落ち着きやすいです。"}, {"t": 275.7, "x": "話すことが無いのは、平和な証拠\nだと受け取る場合もあります。"}, {"t": 279.9, "x": "一方で女は、黙って食べる時間を気\nまずく感じやすいです。"}, {"t": 284.28333333333336, "x": "何か話さなければと思って、\n天気や近所の話を出してみます。"}, {"t": 288.8666666666667, "x": "それに短い返事しか返ってこないと、\n一人で話している気分になります。"}, {"t": 293.81666666666666, "x": "男の側に悪気はなく、ただ食\nべることに集中しているだけです。"}, {"t": 298.3333333333333, "x": "女の側も、盛り上げたいのでは\nなく宛先を探しているだけです。"}, {"t": 302.78333333333336, "x": "宛先の無い会話は、どちらにとっても\n慣れない作業なのでしょう。"}, {"t": 307.0, "x": "二人きりの食卓は、始めて数年は誰でも\nぎこちないものです。"}, {"t": 311.51666666666665, "x": "子育ての期間が長いほど、話題の多\nくが子どもに寄っていきます。"}, {"t": 316.01666666666665, "x": "成績の話。"}, {"t": 317.3666666666667, "x": "友だちの話。"}, {"t": 318.6166666666667, "x": "将来の話。"}, {"t": 319.85, "x": "十数年もそれが続くと、二人だけの\n話題が細くなっていることがあります。"}, {"t": 324.95, "x": "男は、共通の話題が減っても\n関係は同じだと考えやすいです。"}, {"t": 329.81666666666666, "x": "話さなくても分かり合えてい\nる、という感覚に近いようです。"}, {"t": 333.95, "x": "一方で女は、話題が減ると関係まで\n細くなったように感じやすいです。"}, {"t": 339.15, "x": "話さないことを、分かり合っ\nている印とは受け取りにくいのです。"}, {"t": 343.26666666666665, "x": "ここで起きやすいのが、子どもの\n話にばかり戻ることです。"}, {"t": 347.1, "x": "今ごろ何を食べているか。"}, {"t": 348.85, "x": "連絡が無いけど元気か。"}, {"t": 350.6166666666667, "x": "子どもの話なら、二人とも自然に話せるからです。"}, {"t": 354.26666666666665, "x": "けれども、それを続けると二人の話題は\nいつまでも育ちません。"}, {"t": 358.5, "x": "あなたも最近、子どもの話以外で相手と笑\nったのはいつだったでしょうか。"}, {"t": 363.56666666666666, "x": "思い出せなくても、それは仲が悪\nい証拠ではありません。"}, {"t": 367.43333333333334, "x": "二人の話題を育てる時間が、\nずっと子どもに回っていただけなのです。"}, {"t": 372.2, "x": "子どもが出て行った部屋をどうするかで、\n意見が割れることがあります。"}, {"t": 376.51666666666665, "x": "机も本棚も、壁に貼ったものの跡も、\nそのまま残っている部屋です。"}, {"t": 381.5833333333333, "x": "男は、その部屋を早めに片づ\nけて使いたくなりやすいです。"}, {"t": 385.8, "x": "書斎にする。"}, {"t": 386.8, "x": "物置にする。"}, {"t": 387.9, "x": "趣味の道具を置く。"}, {"t": 389.23333333333335, "x": "使わない空間をそのままにす\nるのは、もったいないと感じるようです。"}, {"t": 393.71666666666664, "x": "一方で女は、しばらくそのま\nまにしておきたくなりやすいです。"}, {"t": 397.93333333333334, "x": "帰ってきた時の場所。"}, {"t": 399.6, "x": "ふと入って座れる場所。"}, {"t": 401.26666666666665, "x": "季節の服を出す場所。"}, {"t": 402.9166666666667, "x": "部屋がそのままだと、関係も\nまだ続いている気がするのでしょう。"}, {"t": 407.1333333333333, "x": "男は、片づけることで次に進もうとしています。"}, {"t": 410.5833333333333, "x": "女は、残しておくことで気持ちの\n速度を合わせようとしています。"}, {"t": 414.85, "x": "どちらも、子どもがいなくな\nった変化に向き合う方法です。"}, {"t": 418.65, "x": "片づけを急がれた側は、自分の時間まで\n捨てられた気分になります。"}, {"t": 423.3333333333333, "x": "残すと言われた側は、前に進むのを\n止められた気分になります。"}, {"t": 427.71666666666664, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 430.93333333333334, "x": "向き合う速さが、男女で少し\nずれているだけなのです。"}, {"t": 434.56666666666666, "x": "子どもがいなくなったのだから、\n名前で呼べばいいと言われます。"}, {"t": 438.5, "x": "理屈としてはその通りですが、\n実際にはなかなか難しいものです。"}, {"t": 443.03333333333336, "x": "何十年も使っていない名前を、\n急に口に出すのは照れくさいからです。"}, {"t": 447.93333333333334, "x": "男は、名前で呼ぶことを特別\nな場面の行動だと考えやすいです。"}, {"t": 452.85, "x": "若い頃の呼び方。"}, {"t": 454.35, "x": "二人きりの時だけの呼び方。"}, {"t": 456.43333333333334, "x": "人前では言わない呼び方。"}, {"t": 458.4166666666667, "x": "今さら戻すと、相手に何か企んでいると\n思われそうで避けるようです。"}, {"t": 463.1666666666667, "x": "一方で女は、名前で呼ばれる\nことに意味を感じやすいです。"}, {"t": 467.4166666666667, "x": "母親ではなく、一人の人とし\nて見てもらえた気がするからです。"}, {"t": 471.56666666666666, "x": "ただ、女の側から言い出すのもやは\nり照れくさいものです。"}, {"t": 475.45, "x": "呼んでほしいと頼むのは、欲\nしがっているようで言いにくいからです。"}, {"t": 479.56666666666666, "x": "そうして、どちらも言い出さ\nないまま同じ呼び方が続きます。"}, {"t": 483.6, "x": "言い出さない者どうしが、相手の方から\n変えてくれるのを待っている形です。"}, {"t": 488.3666666666667, "x": "これは愛情が冷めたのではありません。"}, {"t": 490.8833333333333, "x": "照れくささの方が、少しだけ\n勝っているだけのことなのです。"}, {"t": 494.65, "x": "呼び方を変えられないまま過ごすと、\n次に起きやすいのは呼ばなくなることです。"}, {"t": 499.766 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
