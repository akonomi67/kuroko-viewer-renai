<script>
const D={"name": "36の質問_恋が生まれるは実験の結論ではなかった", "file": "098_36の質問_恋が生まれるは実験の結論ではなかった", "dur": 852.66665625, "segs": [], "subs": [{"t": 0.0, "x": "初対面の2人が36の質問に\n答え合うと、恋が生まれる。"}, {"t": 4.633333333333334, "x": "そんなふうに紹介されることがあります。"}, {"t": 7.216666666666667, "x": "ところが元の論文が測っていたのは、\n恋ではありませんでした。"}, {"t": 11.45, "x": "測っていたのは実験室の中で感じた親近感です。"}, {"t": 15.183333333333334, "x": "今日はこの36の質問の実験を、\n元の論文に沿って見ていきます。"}, {"t": 20.316666666666666, "x": "実験をしたのはアメリカの心理学者です。"}, {"t": 23.233333333333334, "x": "名前はアーサー・アーロンといいます。"}, {"t": 25.466666666666665, "x": "共同で研究した人たちもいます。"}, {"t": 27.866666666666667, "x": "論文が出たのは1997年です。"}, {"t": 31.033333333333335, "x": "もう30年近く前の研究です。"}, {"t": 33.6, "x": "見知らぬ2人が、だんだん深くなる質問に\n交代で答えます。"}, {"t": 37.833333333333336, "x": "すると、ただ雑談をした2人より近く感じやすかった。"}, {"t": 41.86666666666667, "x": "論文の中心にあるのはこの結果です。"}, {"t": 44.53333333333333, "x": "恋が生まれたという結果ではありません。"}, {"t": 47.016666666666666, "x": "この質問をすれば付き合えるとは書かれていません。"}, {"t": 50.15, "x": "結婚できるとも書かれていません。"}, {"t": 52.333333333333336, "x": "恋人になった人の割合も、結果として\n出していません。"}, {"t": 56.21666666666667, "x": "では、なぜ恋の質問として広まったのでしょうか。"}, {"t": 59.7, "x": "実験の中では本当は何が起きていたのでしょうか。"}, {"t": 63.2, "x": "質問の中身と比べた相手と出た数字を、順に見ます。"}, {"t": 67.3, "x": "最後にこの実験から言えないことも確かめます。"}, {"t": 70.48333333333333, "x": "質問を全部読み上げることはしません。"}, {"t": 73.06666666666666, "x": "仕組みと限界のほうを先に置きます。"}, {"t": 75.56666666666666, "x": "36の質問は恋に落ちる質問として紹介されがちです。"}, {"t": 79.93333333333334, "x": "雑誌や記事では、恋に落ちた\n2人の話と一緒に出てきます。"}, {"t": 84.13333333333334, "x": "読んだ人は特別な力がある質問だと感じやすいです。"}, {"t": 88.01666666666667, "x": "順に聞くだけで、好きになってもらえる気がします。"}, {"t": 91.33333333333333, "x": "そう思うのは自然なことです。"}, {"t": 93.31666666666666, "x": "けれども、元の論文の題名に\n恋という言葉はありません。"}, {"t": 97.41666666666667, "x": "題名にあるのは人と人の近さという言葉です。"}, {"t": 100.65, "x": "しかも、研究の道具として作った手順だと\n書かれています。"}, {"t": 104.7, "x": "近さを実験の中で作れれば、\n研究がしやすくなります。"}, {"t": 108.85, "x": "どんな2人が近くなりやすいかを比べられるからです。"}, {"t": 112.2, "x": "作った人たちの目的はそこにありました。"}, {"t": 114.96666666666667, "x": "恋人を作る方法を広めるためではなかったのです。"}, {"t": 118.46666666666667, "x": "紹介の言葉と論文の言葉には、こんな差があります。"}, {"t": 122.33333333333333, "x": "紹介した人が悪いという話ではありません。"}, {"t": 125.41666666666667, "x": "恋の話のほうが、\n人の目を引きやすいというだけです。"}, {"t": 129.13333333333333, "x": "ただ、元の結論を知ってから\n読むと、見え方が変わります。"}, {"t": 133.43333333333334, "x": "同じ36の質問でも、受け取り方が\n少し落ち着くかもしれません。"}, {"t": 138.33333333333334, "x": "最初の研究の場所は、大学の\n大きな心理学の授業でした。"}, {"t": 142.88333333333333, "x": "参加したのはその授業に出ていた学生です。"}, {"t": 145.86666666666667, "x": "学期が始まって5週目の、普段の\n授業で行われました。"}, {"t": 150.2, "x": "2週間前に予告があり、ほとんどの\n学生が参加しました。"}, {"t": 154.5, "x": "参加は自由でした。"}, {"t": 156.0, "x": "記録も先生には渡りませんでした。"}, {"t": 158.56666666666666, "x": "出なくても成績には関わりませんでした。"}, {"t": 161.31666666666666, "x": "学生たちは先に、自分のことを\n答える用紙に記入しました。"}, {"t": 165.91666666666666, "x": "その答えをもとに、研究者が\n2人ずつの組を決めました。"}, {"t": 170.18333333333334, "x": "組む相手は同じ授業にいる知らない人です。"}, {"t": 173.08333333333334, "x": "名前を知っている相手とは組ませませんでした。"}, {"t": 175.95, "x": "大事な意見が食い違う相手とも組ませませんでした。"}, {"t": 179.33333333333334, "x": "組み合わせは2つです。"}, {"t": 180.96666666666667, "x": "男女の組と、女性同士の組です。"}, {"t": 183.8, "x": "その授業は学生のおよそ7割が女性でした。"}, {"t": 187.13333333333333, "x": "そのため、男性同士の組は作らなかったそうです。"}, {"t": 190.83333333333334, "x": "最初の研究では男女の組が33組でした。"}, {"t": 194.41666666666666, "x": "女性同士の組は17組でした。"}, {"t": 196.96666666666667, "x": "当日、学生たちは決められた相手と\n並んで座りました。"}, {"t": 201.13333333333333, "x": "ほかの組とは少し離れて座っています。"}, {"t": 203.9, "x": "ここまではどこにでもある授業の風景に近いです。"}, {"t": 207.3, "x": "座った2人には封筒が一つ渡されました。"}, {"t": 210.43333333333334, "x": "中には説明の紙と、小さな紙の束が3つ入っています。"}, {"t": 214.91666666666666, "x": "小さな紙には1枚ずつ、質問か課題が書いてあります。"}, {"t": 219.15, "x": "説明の紙には、こんな意味のことが\n書かれていました。"}, {"t": 222.85, "x": "この研究は人と人の近さの研究です。"}, {"t": 225.83333333333334, "x": "2人のすることは、相手と近くなることだけです。"}, {"t": 229.15, "x": "進め方は決まっていました。"}, {"t": 231.06666666666666, "x": "片方が1枚を声に出して読みます。"}, {"t": 233.7, "x": "読んだ人から先に答えます。"}, {"t": 235.73333333333332, "x": "次に、相手も同じ質問に答えます。"}, {"t": 238.75, "x": "終わったら次の1枚に進みます。"}, {"t": 241.11666666666667, " const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}

  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
