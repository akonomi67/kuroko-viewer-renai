<script>
const D={"name": "信じ方が逆_男は積み上げ女は減点", "file": "043_信じ方が逆_男は積み上げ女は減点", "dur": 838.6333125, "segs": [], "subs": [{"t": 0.0, "x": "信じていると言われた時、\n男と女では確かめていることが違う場合があります。"}, {"t": 5.516666666666667, "x": "男は、これまでに積み上げた回数を\n見ていることが多いです。"}, {"t": 9.616666666666667, "x": "女は、これまでに減ってしまった回数を\n見ていることがあります。"}, {"t": 13.783333333333333, "x": "男は守れた約束の数を数え、\n女は守れなかった一回を覚えています。"}, {"t": 19.316666666666666, "x": "だから同じ関係を見ていても、\n点数がまったく違ってきます。"}, {"t": 23.616666666666667, "x": "男の側は、こんなにやってきたのにと感じます。"}, {"t": 27.033333333333335, "x": "女の側は、\nあの一回がまだ説明されていないと感じます。"}, {"t": 31.35, "x": "どちらも嘘をついていないのに、\n話は平行線になります。"}, {"t": 35.56666666666667, "x": "この食い違いは、信じているかどうかの\n問題ではありません。"}, {"t": 39.55, "x": "どこを見て信じるかという、測り方の問題です。"}, {"t": 43.016666666666666, "x": "測り方が違うまま話し合うと、\n必ず同じ場所で止まります。"}, {"t": 47.53333333333333, "x": "そして止まるたびに、\n言われた側は疑われていると感じます。"}, {"t": 51.733333333333334, "x": "今日は、信頼がどう作られて、\nどう壊れるのかを男女で並べて見ていきます。"}, {"t": 57.05, "x": "逆の測り方をする人もいるので、\nあくまで傾向として聞いてください。"}, {"t": 61.75, "x": "自分の測り方が分かると、\n相手に渡すべきものも決まってきます。"}, {"t": 66.3, "x": "まず、信じるという言葉には二つの測り方があります。"}, {"t": 70.3, "x": "一つは、良かった回数を足していく測り方です。"}, {"t": 73.81666666666666, "x": "もう一つは、悪かった回数を引いていく測り方です。"}, {"t": 77.66666666666667, "x": "男は足し算で見やすく、\n女は引き算で見やすい傾向があります。"}, {"t": 82.4, "x": "足し算の人は、続けていればいつか届くと考えます。"}, {"t": 86.2, "x": "引き算の人は、\n減らさないことがそのまま信頼だと考えます。"}, {"t": 90.48333333333333, "x": "だから男は、新しく何かを足そうとします。"}, {"t": 93.7, "x": "旅行に連れて行く。"}, {"t": 95.05, "x": "プレゼントを買う。"}, {"t": 96.26666666666667, "x": "家事を一つ多くやる。"}, {"t": 97.81666666666666, "x": "一方で女は、減った分が埋まっていないと\n感じています。"}, {"t": 101.85, "x": "先月の連絡が無かった日は、足し算では消えません。"}, {"t": 105.56666666666666, "x": "つまり男の努力は、別の口座に\n入金されている形になります。"}, {"t": 110.33333333333333, "x": "入っている場所が違うので、\n残高が増えたように見えません。"}, {"t": 114.61666666666666, "x": "ここを知らないと、努力するほど不満が\n増えていきます。"}, {"t": 118.33333333333333, "x": "やっているのに伝わらないと感じる人は、\nここで止まっています。"}, {"t": 122.4, "x": "足す前に、どこが減ったのかを聞く方が\n早いことがあります。"}, {"t": 126.45, "x": "男の側の信頼は、実績で\n作られやすいところがあります。"}, {"t": 130.78333333333333, "x": "これまで裏切っていない。"}, {"t": 132.43333333333334, "x": "予定を守ってきた。"}, {"t": 133.85, "x": "仕事を続けている。"}, {"t": 135.3, "x": "そういう事実が積み上がると、\n信じるに値すると考えます。"}, {"t": 139.73333333333332, "x": "そして同じ物差しを、相手にも使います。"}, {"t": 142.86666666666667, "x": "だから相手を信じる時も、\nこれまでの事実を根拠にします。"}, {"t": 147.0, "x": "結果として、疑うのは新しい情報が\n入った時だけになります。"}, {"t": 151.66666666666666, "x": "情報が無い間は、信じた状態のまま止まっています。"}, {"t": 155.61666666666667, "x": "これは楽なようで、危ない面もあります。"}, {"t": 158.58333333333334, "x": "相手の中で点数が減っていても、\n気づけないからです。"}, {"t": 162.28333333333333, "x": "自分の側の残高が増えているので、\n安心してしまいます。"}, {"t": 166.43333333333334, "x": "そして急に別の話を持ち出されて、\n驚くことになります。"}, {"t": 170.55, "x": "言ってくれれば直したのに、\nという言葉が出るのはこの時です。"}, {"t": 174.6, "x": "けれども相手からすると、\n何度も言っていた場合があります。"}, {"t": 178.61666666666667, "x": "言われた時、\n事実として反論してしまったのかもしれません。"}, {"t": 182.71666666666667, "x": "反論された側は、次から言わなくなっていきます。"}, {"t": 186.25, "x": "女の側の信頼は、減点で動きやすいところがあります。"}, {"t": 190.5, "x": "最初はある程度の点数を渡して、\nそこから引いていく形です。"}, {"t": 194.93333333333334, "x": "約束の時間に遅れた。"}, {"t": 196.71666666666667, "x": "言ったことを忘れていた。"}, {"t": 198.38333333333333, "x": "話を流された。"}, {"t": 199.71666666666667, "x": "そういう小さな引き算が、\n静かに積み重なっていきます。"}, {"t": 203.68333333333334, "x": "一つ一つは、怒るほどのことではありません。"}, {"t": 206.78333333333333, "x": "だから多くは、その場では何も言われません。"}, {"t": 209.86666666666667, "x": "言われないまま、数だけが増えていきます。"}, {"t": 212.68333333333334, "x": "そしてある日、まったく別の\n場面でまとめて出てきます。"}, {"t": 216.36666666666667, "x": "この時に、そんな昔のことをと\n言ってしまう人が多いです。"}, {"t": 220.41666666666666, "x": "けれども相手にとっては、一つの続いた話です。"}, {"t": 223.91666666666666, "x": "昔のことではなく、\nまだ処理されていない件として残っています。"}, {"t": 228.25, "x": "引き算の人にとって、\n時間は自動では消してくれません。"}, {"t": 232.13333333333333, "x": "消えるのは、同じ場面で違う結果が出た時だけです。"}, {"t": 235.88333333333333, "x": "だから謝罪より、次の同じ場面の方が効きます。"}, {"t": 239.63333333333333, "x": "同じ場面が来ないうちは、点数は戻りません。"}, {"t": 243.03333333333333, "x": "嘘に対する重さも、まったく違ってきます。"}, {"t": 246.13333333333333, "x": "足し算で見る人は、一度の嘘を全体の中の\n一つと考えます。"}, {"t": 250.71666666666667, "x": "これまでの積み上げがあるので、\nそこまで大きく響きません。"}, {"t": 254.7, "x": "引き算で見る人は、一度の嘘を\n測り方そのものの問題と考えます。"}, {"t": 259.6333333333333, "x": "一つ隠せる人は、他も隠せると考えるからです。"}, {"t": 263.15, "x": "だから内容の大きさと、\n受けた傷の大きさが一致しません。"}, {"t": 267.3, "x": "小さな嘘だから軽い、\nとはなりにくいところがあります。"}, {"t": 271.1333333333333, "x": "むしろ小さいほど、\n隠す必要がなかったのにと感じます。"}, {"t": 275.23333333333335, "x": "ここで、たいした話ではないと説明するのが\n最悪の手です。"}, {"t": 279.46666666666664, "x": "説明された側は、価値を決められたと受け取ります。"}, {"t": 283.1, "x": "内容の話にすり替えられた、と感じることもあります。"}, {"t": 286.93333333333334, "x": "嘘の話が、扱いの話に変わってしまう瞬間です。"}, {"t": 290.9166666666667, "x": "そうなると、元の件はもう解決できません。"}, {"t": 294.1666666666667, "x": "だから最初の三十秒で、\n内容の大小に触れないでください。"}, {"t": 298.6333333333333, "x": "隠したという形の方に、先に触れる必要があります。"}, {"t": 302.68333333333334, "x": "信頼を戻す方法も、男女で向きが逆になります。"}, {"t": 306.46666666666664, "x": "足し算で見る人には、新しい良いことが効きます。"}, {"t": 309.95, "x": "何かを足せば、その分だけ点数が戻ると\n感じるからです。"}, {"t": 314.0, "x": "引き算で見る人には、\n新しい良いことはあまり効きません。"}, {"t": 317.9, "x": "減った場所が埋まっていないと、\n足しても意味が薄いからです。"}, {"t": 321.78333333333336, "x": "だから女の側に効くのは、\n同じ場面をやり直すことです。"}, {"t": 325.85, "x": "連絡が無くて不安だったなら、\n次の同じ場面で連絡を入れる形です。"}, {"t": 330.8833333333333, "x": "派手なことをする必要は、まったくありません。"}, {"t": 333.98333333333335, "x": "むしろ派手なことをすると、\nごまかされたように見えます。"}, {"t": 337.6, "x": "一度の大きな埋め合わせでは、\n回数が増えないからです。"}, {"t": 341.48333333333335, "x": "必要なのは、同じ場面が来た時の同じ対応です。"}, {"t": 345.31666666666666, "x": "それが三回続くと、ようやく点数が戻り始めます。"}, {"t": 349.3333333333333, "x": "逆に男の側には、事実を積み上げる形が効きます。"}, {"t": 353.46666666666664, "x": "やった回数が見える形になっていると、\n安心しやすいです。"}, {"t": 357.71666666666664, "x": "渡し方が違うだけで、量は同じで構いません。"}, {"t": 361.26666666666665, "x": "言わなくても分かるはずだ、という考え方があります。"}, {"t": 364.95, "x": "これは足し算の人に、出やすい考え方です。"}, {"t": 368.35, "x": "これだけやってきたのだから、\n伝わっているはずだと考えます。"}, {"t": 372.3666666666667, "x": "けれども引き算の人には、\nやった回数が見えていません。"}, {"t": 376.25, "x": "見えているのは、やらなかった場面の方だからです。"}, {"t": 379.68333333333334, "x": "だから伝わっているはずという前提が、\n最初から成り立ちません。"}, {"t": 383.96666666666664, "x": "ここで多いのが、言葉にするのが\n苦手だという説明です。"}, {"t": 387.8333333333333, "x": "苦手なこと自体は、問題ではありません。"}, {"t": 390.8333333333333, "x": "問題になるのは、苦手を理由にして形を\n作らないことです。"}, {"t": 395.1, "x": "言葉が苦手なら、行動の方を\n見える形にすれば足ります。"}, {"t": 399.23333333333335, "x": "帰る時間を送る。"}, {"t": 400.6666666666667, "x": "買い物のメモを共有する。"}, {"t": 402.56666666666666, "x": "予定を紙に書いて貼る。"}, {"t": 404.21666666666664, "x": "台所のホワイトボードに一行書くだけでも、\n回数として残ります。"}, {"t": 408.95, "x": "残った回数は、そのまま足し算にも\n引き算にも効きます。"}, {"t": 413.03333333333336, "x": "苦手なまま伝わる形を作った人が、\nいちばん強いです。"}, {"t": 417.0833333333333, "x": "うまく話せることと、信じてもらえることは別です。"}, {"t": 420.6666666666667, "x": "信頼の話でよく出るのが、報告の量です。"}, {"t": 423.9166666666667, "x": "どこまで報告すれば安心してもらえるのか、\nという話になります。"}, {"t": 428.4166666666667, "x": "けれども実際に効いているのは、量ではなく形です。"}, {"t": 432.1333333333333, "x": "形というのは、いつ出すか、\nどちらから出すかという話です。"}, {"t": 436.46666666666664, "x": "聞かれてから答える形だと、\n量を増やしても効きません。"}, {"t": 440.45, "x": "毎回こちらが聞いている、という事実が残るからです。"}, {"t": 444.23333333333335, "x": "逆に、短くても先に出す形だと\n回数として積み上がります。"}, {"t": 448.76666666666665, "x": "今日は遅くなる、とだけ先に送る方がずっと効きます。"}, {"t": 452.53333333333336, "x": "つまり文章の長さは、ほとんど関係ありません。"}, {"t": 456.01666666666665, "x": "先か後かの一点で、受け取られ方が変わります。"}, {"t": 459.6, "x": "そして形は、疲れている日でも\n守れる軽さにしてください。"}, {"t": 463.65, "x": "重い形にすると、必ず途切れます。"}, {"t": 466.56666666666666, "x": "途切れた日が、そのまま引き算の材料になります。"}, {"t": 469.93333333333334, "x": "だから続けられる最小の形を、\n二人で決める方が確実です。"}, {"t": 474.55, "x": "決める時は、片方が勝手に\n決めない方がうまくいきます。"}, {"t": 478.5833333333333, "x": "誠実さと、情報の量を混ぜてしまう人がいます。"}, {"t": 482.3, "x": "全部話すことが、いちばん誠実だという考え方です。"}, {"t": 486.25, "x": "けれども全部話すと、\n相手の負担が増える場合があります。"}, {"t": 490.3333333333333, "x": "知らなくてよかった過去まで、\n抱えることになるからです。"}, {"t": 494.0, "x": "特に、前の相手の話や職場の\n細かい人間関係がそうです。"}, {"t": 498.8833333333333, "x": "話した側はすっきりしますが、聞いた側には残ります。"}, {"t": 502.6166666666667, "x": "これは誠実というより、\n預けているだけかもしれません。"}, {"t": 506.35, "x": "逆に、隠すことと言わないことも別の話です。"}, {"t": 509.8666666666667, "x": "聞かれて答えないのは、隠したことになります。"}, {"t": 512.95, "x": "聞かれていないから言っていないのは、\n隠したことになりません。"}, {"t": 516.7166666666667, "x": "この線引きを二人で決めておくと、\n後 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
