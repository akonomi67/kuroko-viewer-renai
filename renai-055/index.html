<script>
const D={"name": "恋愛がめんどくさくなった人に何が起きているのか", "file": "055_恋愛がめんどくさくなった人に何が起きているのか", "dur": 841.5333125, "segs": [], "subs": [{"t": 0.0, "x": "もう恋愛はいい、と感じている人がいます。"}, {"t": 3.1, "x": "その感じは、冷めたのとは少し違うようです。"}, {"t": 6.416666666666667, "x": "起きているのは、たいてい疲れの方です。"}, {"t": 9.183333333333334, "x": "人を好きになる力が消えたのではありません。"}, {"t": 12.1, "x": "使う手前で、気力が先に尽き\nているだけかもしれません。"}, {"t": 16.0, "x": "疲れ方の出方には、男女で傾きがあると言われます。"}, {"t": 19.9, "x": "男は、動いても届かなかった\n記憶として残りやすいです。"}, {"t": 23.966666666666665, "x": "女は、我慢していた時間の合計として出やすいです。"}, {"t": 27.8, "x": "どちらが重いかを比べる話ではありません。"}, {"t": 30.716666666666665, "x": "同じ疲れが、別の形で表に出ているだけのようです。"}, {"t": 34.65, "x": "一人でいる時間が楽になるのは、自然なことです。"}, {"t": 38.083333333333336, "x": "楽になった状態を、悪いものと\nして扱う必要はありません。"}, {"t": 42.43333333333333, "x": "ただ、楽と幸せは同じではない場合があります。"}, {"t": 46.1, "x": "ここから先は、その違いも含めて順番に見ていきます。"}, {"t": 50.05, "x": "休んでいる間に戻るものと、戻らないものも分けます。"}, {"t": 53.88333333333333, "x": "周りの言葉がしんどくなる理由にも触れます。"}, {"t": 56.86666666666667, "x": "そして最後に、戻らないという選び方の話をします。"}, {"t": 60.7, "x": "降りている人を、引っぱり上\nげるための回ではありません。"}, {"t": 64.33333333333333, "x": "いま自分がどの辺にいるのかが\n分かれば、それで足ります。"}, {"t": 68.16666666666667, "x": "恋愛から降りた人は、外からは\n冷めたように見えます。"}, {"t": 71.93333333333334, "x": "実際には、感情そのものは残\nっていることが多いようです。"}, {"t": 76.06666666666666, "x": "映画を見て、泣いてしまう日はあります。"}, {"t": 78.86666666666666, "x": "友人の結婚の報告に、素直に喜べることもあります。"}, {"t": 83.18333333333334, "x": "子どもや動物を見て、かわい\nいと思う気持ちも動きます。"}, {"t": 87.16666666666667, "x": "そういう反応が残っているな\nら、感情はまだ働いています。"}, {"t": 91.43333333333334, "x": "止まっているのは、感情では\nなく行動の方かもしれません。"}, {"t": 95.4, "x": "誘う、連絡する、予定を合わせる。"}, {"t": 98.53333333333333, "x": "その手前で、腰が上がらなくなっている状態です。"}, {"t": 102.05, "x": "男の場合は、面倒という言葉で出\nてくることが多いようです。"}, {"t": 106.25, "x": "女の場合は、今はいい、という言葉で出やすいです。"}, {"t": 110.23333333333333, "x": "どちらも、中身は同じところを\n指している場合があります。"}, {"t": 114.06666666666666, "x": "周りからは、興味を失ったように見えてしまいます。"}, {"t": 117.7, "x": "見えた側は、もったいないと\nいう言葉を返しがちです。"}, {"t": 121.35, "x": "返された側には、事情を説明\nする気力までは残っていません。"}, {"t": 125.93333333333334, "x": "そこで会話が終わり、誤解だけが残ってしまいます。"}, {"t": 129.5, "x": "だから最初に、冷めたのと疲れたのを\n分けておきます。"}, {"t": 133.25, "x": "恋愛に疲れる理由を、失敗の数だと考えがちです。"}, {"t": 137.5, "x": "振られた回数や、別れた回数で数える見方です。"}, {"t": 141.36666666666667, "x": "実際には、回数と疲れはあまり一致しないようです。"}, {"t": 145.16666666666666, "x": "一度も別れていないのに、疲\nれきっている人がいます。"}, {"t": 148.95, "x": "何度も別れているのに、平気\nな顔をしている人もいます。"}, {"t": 152.91666666666666, "x": "差が出ているのは、気を使っ\nた量の方かもしれません。"}, {"t": 156.51666666666668, "x": "返信の文面を、何度も書き直した時間。"}, {"t": 159.81666666666666, "x": "言うか言わないかを、一人で決めていた時間。"}, {"t": 162.76666666666668, "x": "相手の機嫌を、先回りして読んでいた時間。"}, {"t": 166.15, "x": "その合計が、そのまま疲れの量になっていきます。"}, {"t": 169.68333333333334, "x": "気を使う作業は、外からはまったく見えません。"}, {"t": 173.01666666666668, "x": "見えないので、頑張ったことと\nして数えてもらえません。"}, {"t": 176.66666666666666, "x": "数えてもらえないまま続くと、残るのは疲れだけです。"}, {"t": 180.5, "x": "男の側は、この作業を段取りと\nして抱えやすいようです。"}, {"t": 184.58333333333334, "x": "女の側は、場の空気を整える\n役として抱えやすいです。"}, {"t": 188.9, "x": "抱え方は違っても、減る体力は同じように減ります。"}, {"t": 192.88333333333333, "x": "だから、うまくいっていた人\nほど疲れることがあります。"}, {"t": 196.41666666666666, "x": "男の側に出やすい疲れ方から見ていきます。"}, {"t": 199.43333333333334, "x": "多くの場合、残っているのは動いた時の記憶です。"}, {"t": 203.11666666666667, "x": "店を調べて、席を取って、その日を待った。"}, {"t": 206.6, "x": "言葉を選んで、送って、返事を待った。"}, {"t": 209.88333333333333, "x": "勇気を出して、伝えて、答えをもらった。"}, {"t": 213.08333333333334, "x": "届かなかった時、その記憶は結果とセットで残ります。"}, {"t": 217.0, "x": "次に動こうとすると結果の方が先に出\nてきて、動く前に疲れてしまいます。"}, {"t": 222.28333333333333, "x": "動いていないのに疲れるので、\n自分でも説明できません。"}, {"t": 226.26666666666668, "x": "説明できないものは、面倒と\nいう一言に丸められます。"}, {"t": 230.31666666666666, "x": "動く側に回り続けた人ほど、たまりやすいようです。"}, {"t": 234.11666666666667, "x": "断られる可能性を、毎回引き受けていたからです。"}, {"t": 237.81666666666666, "x": "引き受けた回数は、どこにも記録されていません。"}, {"t": 241.18333333333334, "x": "女の側から見ると、急に動か\nなくなったように映ります。"}, {"t": 245.43333333333334, "x": "映った側は、興味が無くなっ\nたのだと受け取りがちです。"}, {"t": 249.18333333333334, "x": "実際には、前の分の疲れがま\nだ抜けていない場合があります。"}, {"t": 253.48333333333332, "x": "この時期に理由を問い詰めても、\n動きは戻りにくいようです。"}, {"t": 257.53333333333336, "x": "時間だけが、いちばんよく効\nく手当てになることがあります。"}, {"t": 261.28333333333336, "x": "女の側に出やすい疲れ方は、少し形が違います。"}, {"t": 265.31666666666666, "x": "一回の出来事ではなく、積み上が\nった時間で出やすいです。"}, {"t": 269.43333333333334, "x": "言いたいことを、飲み込んだ夜。"}, {"t": 271.6166666666667, "x": "予定を、相手に合わせて動かした週末。"}, {"t": 274.76666666666665, "x": "機嫌を、先に整えておいた朝。"}, {"t": 277.56666666666666, "x": "一つずつは小さいので耐えら\nれますし、我慢だとも気づきません。"}, {"t": 281.96666666666664, "x": "気づかないまま、合計だけが静かに増えていきます。"}, {"t": 285.51666666666665, "x": "ある日、限界が来た理由を説明できなくなります。"}, {"t": 289.23333333333335, "x": "最後のきっかけは、たいてい小さな出来事です。"}, {"t": 292.51666666666665, "x": "小さいので、相手には理由として通じません。"}, {"t": 295.8, "x": "そんなことで、と言われると説明する気も消えます。"}, {"t": 299.28333333333336, "x": "男の側の疲れが結果に紐づくとすれば、\nこちらは時間に紐づきます。"}, {"t": 304.28333333333336, "x": "だから、終わった後も抜けるのが遅いことがあります。"}, {"t": 307.76666666666665, "x": "休んでいるつもりでも、体の方が先に構\nえたままです。"}, {"t": 311.8, "x": "誰かに気を使う場面で、すぐに\n元の動きが出てしまいます。"}, {"t": 316.15, "x": "出てしまう間は、まだ回復の途中かもしれません。"}, {"t": 319.73333333333335, "x": "急いで次に進まなくても、困ることは何もありません。"}, {"t": 323.51666666666665, "x": "恋愛から降りると、多くの人がはっきり楽になります。"}, {"t": 327.26666666666665, "x": "その楽さは、やせ我慢ではないようです。"}, {"t": 330.3, "x": "食べたい時に、食べたい物を食べられます。"}, {"t": 333.3333333333333, "x": "休みの日の予定を、誰にも相談せずに決められます。"}, {"t": 337.1666666666667, "x": "返信の速さを、気にしなくてよくなります。"}, {"t": 340.2, "x": "決める回数が減るので、頭の中が静かになります。"}, {"t": 344.0, "x": "静かになった状態は、たしかに快適です。"}, {"t": 347.15, "x": "快適なので、わざわざ戻る理由が見\nつからなくなります。"}, {"t": 351.1, "x": "心が狭くなったから戻らない、と\nいうわけでもないようです。"}, {"t": 355.1, "x": "消耗が減った分を、体が正直に受\nけ取っているだけです。"}, {"t": 359.3333333333333, "x": "男の側は、この状態を身軽さと\nして感じやすいようです。"}, {"t": 363.55, "x": "女の側は、安全さとして受け取ることが多いようです。"}, {"t": 367.45, "x": "どちらも、いま必要だから出ている感覚です。"}, {"t": 370.6333333333333, "x": "周りは、それを強がりだと解釈することがあります。"}, {"t": 374.3, "x": "解釈された側は、否定するのも面倒になってきます。"}, {"t": 378.1666666666667, "x": "面倒なので、笑って流す形に落ち着きます。"}, {"t": 381.5833333333333, "x": "流している姿が、また強がりに見えてしまいます。"}, {"t": 385.0, "x": "ここで一つだけ、分けておきたいことがあります。"}, {"t": 388.21666666666664, "x": "楽であることと、幸せである\nことは別の物差しのようです。"}, {"t": 392.3833333333333, "x": "楽は、減らすことで手に入ります。"}, {"t": 394.85, "x": "予定を減らす、人を減らす、考える回数を減らす。"}, {"t": 398.95, "x": "減らせば減らすほど、たしかに楽になります。"}, {"t": 401.9, "x": "幸せの方は、減らしても増えないことがあります。"}, {"t": 405.35, "x": "増えるのは、うまくいった関わりがあった時です。"}, {"t": 408.56666666666666, "x": "だから、楽の途中で少し物足りなくなる人がいます。"}, {"t": 412.31666666666666, "x": "物足りなさが出たとしても、後戻りではありません。"}, {"t": 415.71666666666664, "x": "楽が効いてきた合図として見ておけば足ります。"}, {"t": 418.65, "x": "逆に、物足りなさがまったく出ない人もいます。"}, {"t": 421.9166666666667, "x": "その人には、いまの形が合っているのだと\n思われます。"}, {"t": 425.6, "x": "男の側は、忙しさで埋める形を取りやすいようです。"}, {"t": 429.56666666666666, "x": "女の側は、友人や家族との時間で埋\nめやすいようです。"}, {"t": 433.76666666666665, "x": "どちらも、幸せの側を捨てたわけではありません。"}, {"t": 437.21666666666664, "x": "恋愛以外の場所で、同じものを受け取っています。"}, {"t": 440.73333333333335, "x": "つまり、降りている間も中身は止まっていません。"}, {"t": 444.1166666666667, "x": "止まって見えるのは、数え方が恋愛に寄\nっているからです。"}, {"t": 447.98333333333335, "x": "休むと何が戻るのかを、いったん分けてみます。"}, {"t": 451.3333333333333, "x": "戻りやすいのは、体力と気力の方です。"}, {"t": 454.3666666666667, "x": "人に会った後の疲れ方が、少しずつ軽くなります。"}, {"t": 458.0833333333333, "x": "連絡の返信にかかる時間が、短くなっていきます。"}, {"t": 461.8833333333333, "x": "誘いを聞いた時の、最初の反応が変わります。"}, {"t": 465.4166666666667, "x": "この三つが動き出したら、回復は進んでいます。"}, {"t": 468.8833333333333, "x": "一方で、戻りにくいものもあります。"}, {"t": 471.6166666666667, "x": "一つは、前の相手に使った時間そのものです。"}, {"t": 475.06666666666666, "x": "もう一つは、痛かった場面の記憶です。"}, {"t": 477.93333333333334, "x": "記憶は消えませんが、扱いは変えられるようです。"}, {"t": 481.43333333333334, "x": "思い出す回数が減り、思い出\nしても短く済むようになります。"}, {"t": 485.75, "x": "男の側は、体力の回復が先に来ることが\n多いようです。"}, {"t": 489.96666666666664, "x": "女の側は、警戒が緩むまでに\n時間がかかる場合があります。"}, {"t": 494.48333333333335, "x": "どちらも、順番が違うだけで向きは同じです。"}, {"t": 497.8833333333333, "x": "焦って回復の度合いを確かめ\nると、かえって長引きます。"}, {"t": 502.06666666666666, "x": "確かめるのは、向こうから機会が来た時で足ります。"}, {"t": 505.56666666666666, "x": "待っている間は、特に何もしなくて構いません。"}, {"t": 508.93333333333334, "x": "降りている人に、いちばん刺さる言葉があります。"}, {"t": 512.2, "x": "いい人いないの、という一言です。"}, {"t": 514. ": 775.0666666666667, "x": "どちらが重いかを、比べる必要はありません。"}, {"t": 778.3666666666667, "x": "形が違うだけで、減っている体力の量は同じです。"}, {"t": 782.2666666666667, "x": "一人でいる時間が楽なのは、\n回復が効いている印です。"}, {"t": 786.2166666666667, "x": "楽と幸せは別の物差しなので、\n慌てて結論を出さずに済みます。"}, {"t": 791.0166666666667, "x": "休んでいる間に、体力と気力は少\nしずつ戻ってきます。"}, {"t": 795.2333333333333, "x": "記憶は消えませんが、思い出\nす回数は減っていきます。"}, {"t": 799.0666666666667, "x": "また動きたくなる日が来たら、\n前と同じやり方は使わないでください。"}, {"t": 803.75, "x": "変えるのは一つで足りますし、\n早く分かるほど楽になります。"}, {"t": 807.8, "x": "そして、その日が来なくても構いません。"}, {"t": 810.5333333333333, "x": "戻らないという選び方も、同\nじだけまっとうなものです。"}, {"t": 814.2166666666667, "x": "あなたも、いい人いないのと聞かれ\nて困ったことがあるのではないでしょうか。"}, {"t": 818.85, "x": "その時に、無理に答えを作らなくて大丈夫です。"}, {"t": 822.45, "x": "いまは休んでいる、で足ります。"}, {"t": 824.75, "x": "足りない言葉は、体力が戻っ\nてから探せば間に合います。"}, {"t": 828.6, "x": "今日のところは、休んでいる\n自分を責めないでおいてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
