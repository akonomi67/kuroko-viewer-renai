<script>
const D={"name": "同棲を始めた日から二人の当たり前がずれていく", "file": "064_同棲を始めた日から二人の当たり前がずれていく", "dur": 799.55, "segs": [], "subs": [{"t": 0.0, "x": "同棲を始めてすぐに、小さな\n違和感が出ることがあります。"}, {"t": 4.3, "x": "テレビの音。"}, {"t": 5.316666666666666, "x": "タオルの替え時。"}, {"t": 6.616666666666666, "x": "湯船にお湯をためるかどうか。"}, {"t": 8.6, "x": "どれも、けんかの種になるほ\nど大きな話には見えません。"}, {"t": 12.483333333333333, "x": "けれども実際には、こういう\n小さなことほど長く効きやすいです。"}, {"t": 16.883333333333333, "x": "理由は、二人とも自分のやり\n方を普通だと思っているからです。"}, {"t": 21.266666666666666, "x": "男は、音がある部屋の方が落\nち着きやすいと言われます。"}, {"t": 25.183333333333334, "x": "女は、静かな部屋でようやく休めることがあります。"}, {"t": 28.883333333333333, "x": "男は、汚れが目に見えてから\n片づけることが多いようです。"}, {"t": 32.93333333333333, "x": "女は、汚れる前に整えておきたい場合があります。"}, {"t": 36.78333333333333, "x": "どちらも、育った家ではそれが正しいやり方でした。"}, {"t": 40.4, "x": "正しいやり方どうしなので、\n話し合っても譲りにくいです。"}, {"t": 44.45, "x": "譲れないまま暮らすと、毎日少\nしずつ気持ちが削られます。"}, {"t": 48.6, "x": "今日は、同棲で出やすい当た\nり前のずれを並べていきます。"}, {"t": 52.56666666666667, "x": "先に言っておくと、どちらかが\n悪いという話は出てきません。"}, {"t": 56.63333333333333, "x": "出てくるのは、ずれの見つけ方と、\n新しい当たり前の作り方です。"}, {"t": 61.483333333333334, "x": "引っ越しの日、運び込まれるのは\n荷物だけではありません。"}, {"t": 65.25, "x": "それぞれの家で二十年近く続いた、\n暮らしの決まりも一緒に届きます。"}, {"t": 70.18333333333334, "x": "夕飯は何時か。"}, {"t": 71.56666666666666, "x": "靴はそろえるか。"}, {"t": 72.8, "x": "洗濯は毎日か。"}, {"t": 74.31666666666666, "x": "どれも、誰かに教わったとい\nう記憶がほとんどありません。"}, {"t": 78.18333333333334, "x": "だから、相手のやり方を見ると\n不思議に感じやすいです。"}, {"t": 81.96666666666667, "x": "男は、違うやり方を見ても効率の差と\nして受け取りやすいです。"}, {"t": 86.4, "x": "早いか遅いか。"}, {"t": 87.66666666666667, "x": "手間が多いか少ないか。"}, {"t": 89.31666666666666, "x": "その物差しで、どちらでもい\nいと流すことがあるようです。"}, {"t": 93.16666666666667, "x": "一方で女は、違うやり方を気づかいの\n差として受け取る場合があります。"}, {"t": 98.16666666666667, "x": "自分なら先にやっておく。"}, {"t": 99.98333333333333, "x": "ひと声かけてからにする。"}, {"t": 101.6, "x": "同じ一つの出来事を、片方は手順で、\n片方は気持ちで見ています。"}, {"t": 106.83333333333333, "x": "見ている場所が違うので、話がか\nみ合いにくくなります。"}, {"t": 110.56666666666666, "x": "これは相手を分かっていないのではありません。"}, {"t": 113.3, "x": "持ってきた当たり前が、それ\nぞれ違う形をしているだけです。"}, {"t": 117.28333333333333, "x": "最初にずれが出やすいのは、部屋の音です。"}, {"t": 120.33333333333333, "x": "帰ってすぐにテレビをつける。"}, {"t": 122.26666666666667, "x": "見ていなくても流しておく。"}, {"t": 124.06666666666666, "x": "寝る前まで、何かしらの音が鳴っている。"}, {"t": 127.05, "x": "こういう家で育つと、音が無\nい部屋はかえって落ち着きません。"}, {"t": 131.11666666666667, "x": "男は、音を安心の合図として\n使っていることがあります。"}, {"t": 135.15, "x": "一方で女は、音が止まった時によ\nうやく休めることがあります。"}, {"t": 139.66666666666666, "x": "静かな家で育つと、小さな音でも\n気になりやすいようです。"}, {"t": 143.85, "x": "片方にとってのくつろぎが、\n片方にとっての雑音になります。"}, {"t": 148.11666666666667, "x": "つけっぱなしの側は、消されると\n追い出されたように感じます。"}, {"t": 152.08333333333334, "x": "消したい側は、つけられるたびに\n休む場所を取られたと感じます。"}, {"t": 156.4, "x": "どちらも自分の家を守ろうとしているだけです。"}, {"t": 159.36666666666667, "x": "ここで音量の話をしても、なかなか決着はつきません。"}, {"t": 163.36666666666667, "x": "決着がつかないのは、欲しいものが\n音ではなく安心だからです。"}, {"t": 167.73333333333332, "x": "安心の作り方が違うと知って\nおくと、話の入り方が変わります。"}, {"t": 172.51666666666668, "x": "音の次にずれやすいのは、きれいの基準です。"}, {"t": 175.71666666666667, "x": "きれいの基準は、家によって驚くほど違います。"}, {"t": 179.28333333333333, "x": "バスタオルを毎日替える家。"}, {"t": 181.33333333333334, "x": "三日使う家。"}, {"t": 182.56666666666666, "x": "一週間使う家。"}, {"t": 184.08333333333334, "x": "どれも、その家の中では普通の\nこととして回っています。"}, {"t": 187.98333333333332, "x": "男は、使えるうちは使うとい\nう基準を持っていることがあります。"}, {"t": 192.33333333333334, "x": "乾いていればまだ大丈夫。"}, {"t": 194.18333333333334, "x": "においがしなければ問題ない。"}, {"t": 196.11666666666667, "x": "一方で女は、見た目より感触で判断\nしやすいと言われます。"}, {"t": 200.58333333333334, "x": "ごわついてきた。"}, {"t": 201.71666666666667, "x": "なんとなく湿っぽい。"}, {"t": 203.1, "x": "前に替えた日を覚えている。"}, {"t": 205.0, "x": "その感覚で、早めに替えてお\nきたいと思うことがあります。"}, {"t": 209.05, "x": "流しに残った水滴も、同じような分かれ方をします。"}, {"t": 212.9, "x": "拭く家で育った人には、残っ\nた水滴が気になって仕方ありません。"}, {"t": 217.38333333333333, "x": "拭かない家で育った人には、\nそもそも目に入っていません。"}, {"t": 221.3, "x": "目に入っていない人に言うと、\n急に責められたように聞こえます。"}, {"t": 225.68333333333334, "x": "目に入っている人は、何度言\nっても直らないと感じます。"}, {"t": 229.48333333333332, "x": "これはだらしなさと細かさの勝負ではありません。"}, {"t": 232.46666666666667, "x": "見えている範囲が、最初から\n違っているだけなのです。"}, {"t": 236.06666666666666, "x": "台所では、冷蔵庫の使い方にずれが出やすいです。"}, {"t": 239.95, "x": "買い置きをたっぷりする家。"}, {"t": 241.78333333333333, "x": "使い切ってから買う家。"}, {"t": 243.43333333333334, "x": "男は、切れたら買えばいいと\nいう考え方をしやすいようです。"}, {"t": 247.6, "x": "牛乳が無ければコンビニへ行く。"}, {"t": 249.85, "x": "卵が切れたら帰りに買う。"}, {"t": 251.78333333333333, "x": "その方が無駄が出ないと考えていることがあります。"}, {"t": 255.0, "x": "一方で女は、切れる前に補充\nしておきたい場合があります。"}, {"t": 259.28333333333336, "x": "朝に牛乳が無い。"}, {"t": 260.78333333333336, "x": "料理の途中で調味料が足りない。"}, {"t": 263.1166666666667, "x": "そういう場面を先回りで避けたいという感覚です。"}, {"t": 266.55, "x": "片方には、買い置きが多すぎ\nて場所を取るように見えます。"}, {"t": 270.53333333333336, "x": "片方には、いつも何かが足りない冷蔵庫に見えます。"}, {"t": 274.31666666666666, "x": "トイレットペーパーの予備が何個あれば安心か。"}, {"t": 277.4, "x": "この数字が二人で違うだけで、\n買い物のたびに小さく揉めます。"}, {"t": 281.8666666666667, "x": "揉めているのは、お金の使い方でも\n性格でもありません。"}, {"t": 285.75, "x": "足りなくなることへの怖さが、\n少しずれているだけです。"}, {"t": 289.35, "x": "この怖さの差は、お風呂の使\nい方にもそのまま出てきます。"}, {"t": 293.31666666666666, "x": "お風呂は、一日の疲れの取り方が\nいちばん出る場所です。"}, {"t": 297.21666666666664, "x": "毎晩お湯をためる家。"}, {"t": 298.9, "x": "夏はシャワーだけの家。"}, {"t": 300.5833333333333, "x": "一番風呂にこだわる家と、順番を気にしない家。"}, {"t": 304.48333333333335, "x": "男は、手早く済ませて早く寝\nたいと考えやすいと言われます。"}, {"t": 308.8833333333333, "x": "シャワーで十分。"}, {"t": 310.1, "x": "お湯をためる時間がもったいない。"}, {"t": 312.21666666666664, "x": "そう感じるのは、お風呂を体を洗\nう場所と見ているからのようです。"}, {"t": 316.56666666666666, "x": "一方で女は、湯船を気持ちの\n切り替えに使っていることがあります。"}, {"t": 321.3333333333333, "x": "肩までつかる。"}, {"t": 322.45, "x": "何も考えない時間を作る。"}, {"t": 324.6, "x": "お風呂は洗う場所というより、\n休む場所に近い感覚です。"}, {"t": 328.7, "x": "ここで追いだきの回数や水道代の話を\nすると、話がずれていきます。"}, {"t": 333.8, "x": "ためる側は、休む時間を削られたように感じます。"}, {"t": 337.56666666666666, "x": "ためない側は、使わないお湯に付\nき合わされているように感じます。"}, {"t": 342.01666666666665, "x": "一日の終わらせ方の違いは、洗濯物にも表れます。"}, {"t": 346.2, "x": "洗濯物のたたみ方ほど、家ごとに\n違うものはないかもしれません。"}, {"t": 350.93333333333334, "x": "シャツを三つ折りにする家。"}, {"t": 352.85, "x": "四つ折りにする家。"}, {"t": 354.3333333333333, "x": "丸めてしまう家。"}, {"t": 355.65, "x": "靴下を裏返したまま洗うか、表に戻してから洗うか。"}, {"t": 359.76666666666665, "x": "男は、着られれば形はどうでも\nいいと考えることがあります。"}, {"t": 364.0, "x": "しわが目立たなければ十分。"}, {"t": 365.95, "x": "引き出しに入れば問題ない。"}, {"t": 367.8833333333333, "x": "その感覚で、たたみ方の違いに\nあまり気づかない場合があります。"}, {"t": 372.46666666666664, "x": "一方で女は、たたみ方を片づ\nけやすさと結びつけやすいです。"}, {"t": 377.01666666666665, "x": "同じ形でそろえれば、引き出しの中が崩れない。"}, {"t": 380.48333333333335, "x": "次に取り出す時に、探さなくて済む。"}, {"t": 383.35, "x": "その工夫があるので、違う形で戻\nされると崩された気がします。"}, {"t": 387.85, "x": "手伝ったつもりの側は、やり\n直されると否定されたと感じます。"}, {"t": 392.26666666666665, "x": "やり直す側は、気づいてもら\nえないことに疲れていきます。"}, {"t": 396.1166666666667, "x": "どれも正解が一つに決まっているものではありません。"}, {"t": 399.45, "x": "それでも、自分の家の形が唯一の正解に見\nえやすいのです。"}, {"t": 404.06666666666666, "x": "正解の見え方がずれると、朝の時間にも\nずれが出てきます。"}, {"t": 408.3, "x": "同棲で意外と揉めやすいのが、朝の洗面所です。"}, {"t": 411.93333333333334, "x": "目覚ましを何回鳴らすか。"}, {"t": 413.75, "x": "起きてから家を出るまで何分か。"}, {"t": 415.9166666666667, "x": "身支度にかける時間が、二人で倍以上違\nうこともあります。"}, {"t": 420.15, "x": "男は、起きる時間をぎりぎりまで\n遅らせたいと考えやすいようです。"}, {"t": 424.78333333333336, "x": "十分で顔を洗って着替える。"}, {"t": 426.78333333333336, "x": "朝ごはんは歩きながらでもいい。"}, {"t": 428.95, "x": "その流れで、朝の時間を一つの\n作業としてまとめています。"}, {"t": 433.21666666666664, "x": "一方で女は、朝に余白を置い\nておきたい場合があります。"}, {"t": 437.4, "x": "鏡の前で落ち着いて支度をする。"}, {"t": 439.76666666666665, "x": "コーヒーを座って飲む。"}, {"t": 441.35, "x": "朝のゆとりのある時間が、一日の気分を決\nめることがあるからです。"}, {"t": 445.95, "x": "洗面所が一つしかないと、この\n二つの時計がぶつかります。"}, {"t": 450.0833333333333, "x": "ぎりぎりの側は、ふさがっていると焦ります。"}, {"t": 453.15, "x": "余白の側は、急かされると一日のはじまりが\n崩れます。"}, {"t": 457.1, "x": "朝のずれが続くと、夜の一人の時間の話にも\nつながります。"}, {"t": 461.6166666666667, "x": "一緒に住んでいても、一人に\nなりたい時間は誰にでもあります。"}, {"t": 465.75, "x": "問題は、その時間の合図が二人で違うことです。"}, {"t": 469.4, "x": "男は、黙ってゲームをする。"}, {"t": 471.6333333333333, "x": "部屋のドアを閉める。"}, {"t": 472.96666666666664, "x": "一人で散歩に出る。"}, {"t": 474.35, "x": "こういう形で、何も言わずに\n一人になろうとしやすいと言われます。"}, {"t": 478.93333333333334, "x": "本人にとっては、ただ少し休\nんでいるだけのことが多いようです。"}, {"t": 483.23333333333335, "x" 67, "x": "シャワーで手早く済ませる家。"}, {"t": 732.6666666666666, "x": "男はどちらかといえば前者に、\n女は後者に寄りやすいと言われます。"}, {"t": 737.5, "x": "もちろん逆の二人も大勢いますし、\n正解はどこにもありません。"}, {"t": 742.15, "x": "同棲一年目のずれは、箱を開\nけていく作業に近いものです。"}, {"t": 746.55, "x": "開けずに押し入れへしまうと、\n半年ほどで中身があふれてきます。"}, {"t": 750.9166666666666, "x": "最初はため息、次に無言、その\n次は相手の癖そのものへの苛立ちです。"}, {"t": 756.5666666666667, "x": "苛立ちの正体は、たいてい相手の人柄では\nありません。"}, {"t": 760.4333333333333, "x": "まだ開けていない箱が、部屋の隅に残\nっているだけです。"}, {"t": 764.0833333333334, "x": "一つずつ開けて、中身を二人で眺めてみる。"}, {"t": 767.3166666666667, "x": "いらない決まりは手放し、残\nしたい決まりは新しい棚に並べる。"}, {"t": 771.8166666666667, "x": "そうやって並んだ棚が、どちらの\n実家でもない二人の家になります。"}, {"t": 776.25, "x": "次の休みには、夕飯の後に一\nつだけ実家の話を聞いてみませんか。"}, {"t": 781.3833333333333, "x": "タオルは何日で替えていたのか。"}, {"t": 783.6, "x": "お風呂は誰から入っていたのか。"}, {"t": 785.7, "x": "答えを聞くたびに、相手の育\nった台所が少しずつ見えてくるはずです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
