<script>
const D={"name": "ありがとうを1か月言い合う実験_効き目は相手がどう見えるかで変わった", "file": "112_ありがとうを1か月言い合う実験_効き目は相手がどう見えるかで変わった", "dur": 830.0833125, "segs": [], "subs": [{"t": 0.0, "x": "ありがとうは、言えば言うほど2人は仲よくなる。"}, {"t": 3.3333333333333335, "x": "そう思っていませんか。"}, {"t": 4.9, "x": "感謝が大事なのはたぶん本当です。"}, {"t": 7.416666666666667, "x": "では、ありがとうの回数をわざと増やしたら\nどうなるのでしょう。"}, {"t": 11.416666666666666, "x": "それを確かめた実験があります。"}, {"t": 13.666666666666666, "x": "アメリカのノースカロライナ大学チャペルヒル校の\n研究です。"}, {"t": 17.433333333333334, "x": "著者は、心理学者のサラ・アルゴたち。"}, {"t": 20.116666666666667, "x": "2016年にポジティブ心理学の専門誌に載りました。"}, {"t": 23.95, "x": "一緒に暮らすカップルに、1か月\nありがとうを伝え合ってもらう実験です。"}, {"t": 29.35, "x": "結果は思ったほど単純ではありませんでした。"}, {"t": 32.4, "x": "平均で見ると、はっきりした差は一部だけ。"}, {"t": 35.65, "x": "ところがある人たちでは、結果が良かったのです。"}, {"t": 38.95, "x": "分かれ目は、ありがとうを言う相手が\nどう見えていたか。"}, {"t": 42.8, "x": "ありがとうを言えば必ずうまくいく、という\n話ではありません。"}, {"t": 47.4, "x": "ありがとうが届くときの、しくみの話です。"}, {"t": 50.516666666666666, "x": "まずは感謝がどう考えられてきたかです。"}, {"t": 53.233333333333334, "x": "長いあいだ、感謝のおもな働きはお返しを\nうながすことだと考えられてきました。"}, {"t": 58.833333333333336, "x": "してもらったら返したくなる。"}, {"t": 60.65, "x": "それを支えるのが感謝だ、という見方です。"}, {"t": 63.75, "x": "ところがここ数年で、それだけではない\n証拠が集まってきた。"}, {"t": 67.95, "x": "論文はそう書いています。"}, {"t": 69.68333333333334, "x": "2人の両方に答えてもらう研究がいくつもあります。"}, {"t": 73.23333333333333, "x": "そこでは、どちらか一人が感じた感謝が\n関係のよさと結びついていました。"}, {"t": 78.36666666666666, "x": "ここから新しい考え方が生まれました。"}, {"t": 81.2, "x": "アルゴが2012年にまとめた考え方です。"}, {"t": 84.38333333333334, "x": "名前は、見つける・思い出す・結びつける。"}, {"t": 87.21666666666667, "x": "感謝を感じた瞬間、人はいい\n相手になりそうな人に目を向けます。"}, {"t": 91.91666666666667, "x": "知り合ったばかりの人なら見つける。"}, {"t": 94.08333333333333, "x": "もう身近な人なら、その良さを思い出す。"}, {"t": 97.05, "x": "そして同時に、心と体とふるまいがそろいます。"}, {"t": 100.51666666666667, "x": "その人との結びつきを強める向きにです。"}, {"t": 103.3, "x": "論文は感謝をこう説明しています。"}, {"t": 105.85, "x": "お返しの帳尻あわせだけではない。"}, {"t": 108.3, "x": "関係を育てる感情だ、ということです。"}, {"t": 111.33333333333333, "x": "では、ありがとうを口に出すと。"}, {"t": 113.91666666666667, "x": "言われた人には、なにが起きるのでしょう。"}, {"t": 116.65, "x": "お礼を言われた人は、言った\n人にまた親切にしやすい。"}, {"t": 120.5, "x": "これは昔の実験でも確かめられてきました。"}, {"t": 123.56666666666666, "x": "この考え方はさらに一歩進みます。"}, {"t": 126.16666666666667, "x": "言われた人の心にも、その場で\n変化が起きると考えるのです。"}, {"t": 130.5, "x": "その変化が、関係のよさの感じ方にもつながる。"}, {"t": 134.08333333333334, "x": "そういう見立てです。"}, {"t": 135.38333333333333, "x": "カギになるのが、相手が分かってくれる人に\n見えるかどうか。"}, {"t": 139.23333333333332, "x": "論文では、言われた人が言った\n人をどう感じたかを測ります。"}, {"t": 143.35, "x": "中身は3つです。"}, {"t": 144.68333333333334, "x": "こちらを理解してくれる。"}, {"t": 146.28333333333333, "x": "こちらを認めてくれる。"}, {"t": 147.78333333333333, "x": "こちらを気にかけてくれる。"}, {"t": 149.4, "x": "同じ研究チームは、この前にも別の研究をしています。"}, {"t": 153.55, "x": "研究室で、恋人の一人がもう一人に\nありがとうを伝えます。"}, {"t": 158.38333333333333, "x": "そういう会話をしてもらいました。"}, {"t": 160.48333333333332, "x": "言われた人は会話のあと、相手が\nどれだけ分かってくれたかを答えます。"}, {"t": 165.2, "x": "そして6か月たってから、関係への\n満足をもう一度聞きました。"}, {"t": 169.71666666666667, "x": "すると、分かってくれたと感じた人ほど、\n満足が高まっていたのです。"}, {"t": 174.73333333333332, "x": "はじめの満足を考えに入れてもそうでした。"}, {"t": 177.7, "x": "ただしこの研究は、ふだんの\n2人をそのまま追ったものです。"}, {"t": 181.73333333333332, "x": "ありがとうを増やせば良くなる、とまでは\n言えませんでした。"}, {"t": 185.88333333333333, "x": "そこで今回の論文は、もう一歩進んだ問いを\n立てました。"}, {"t": 190.0, "x": "ありがとうをわざと関係に足したら、どうなるか。"}, {"t": 193.63333333333333, "x": "もし効くならこんなに手軽な手だてはありません。"}, {"t": 196.5, "x": "カップルの相談の場でも使えるかもしれない。"}, {"t": 199.38333333333333, "x": "でも論文は、飛びつくのはまだ早い、と\n書いています。"}, {"t": 203.3, "x": "前の研究に気になる点があったからです。"}, {"t": 206.03333333333333, "x": "全員がありがとうを伝えたつもりでした。"}, {"t": 209.11666666666667, "x": "それでも、のちの変化につながったのは\n一部だけでした。"}, {"t": 212.8, "x": "言われた人が、分かってくれる人だと感じたときです。"}, {"t": 216.28333333333333, "x": "もしそうなら、足す効き目も\n受け取る人しだいかもしれない。"}, {"t": 219.91666666666666, "x": "これを確かめるには実験が必要です。"}, {"t": 222.65, "x": "2人の両方に参加してもらい、\n時間を追って調べる実験です。"}, {"t": 227.1, "x": "もう一つ、論文が確かめたかったことがあります。"}, {"t": 230.55, "x": "感謝が、一人ひとりの毎日にも効くかどうか。"}, {"t": 233.86666666666667, "x": "たとえば、変化にうまく対応できる力。"}, {"t": 236.91666666666666, "x": "そしてくらしへの満足です。"}, {"t": 238.816 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
