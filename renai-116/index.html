<script>
const D={"name": "夫婦仲が下がり続けるのを止めたのは_けんかを第三者の目で書く年に21分だった", "file": "116_夫婦仲が下がり続けるのを止めたのは_けんかを第三者の目で書く年に21分だった", "dur": 726.7833125, "segs": [], "subs": [{"t": 0.0, "x": "けんかのあとに、7分だけ書きものをする。"}, {"t": 3.0166666666666666, "x": "それを1年に3回、合わせて21分です。"}, {"t": 6.45, "x": "それだけで、夫婦仲の下がり方が止まった。"}, {"t": 9.7, "x": "そう報告した研究があります。"}, {"t": 11.95, "x": "2013年に、心理学の専門誌に載った論文です。"}, {"t": 16.166666666666668, "x": "書いたのは心理学者のイーライ・フィンケルたちです。"}, {"t": 19.25, "x": "調べたのは、シカゴに住む120組の夫婦でした。"}, {"t": 22.95, "x": "2年かけて、4か月ごとに夫婦仲を聞いています。"}, {"t": 26.7, "x": "書きもののお題は、けんかを\n第三者の目で見直すことでした。"}, {"t": 30.783333333333335, "x": "どちらの味方でもない人の目です。"}, {"t": 33.016666666666666, "x": "2人ともに幸せでいてほしいと願う人の目です。"}, {"t": 36.333333333333336, "x": "ただし、先に言っておきます。"}, {"t": 38.583333333333336, "x": "夫婦仲が上がったわけではありません。"}, {"t": 41.016666666666666, "x": "下がり続けるはずのものが、止まったのです。"}, {"t": 43.93333333333333, "x": "けんかがなくなったわけでもありません。"}, {"t": 46.266666666666666, "x": "変わったのは、けんかのあとに残る怒りでした。"}, {"t": 49.38333333333333, "x": "論文はまず、夫婦仲の大切さから始めます。"}, {"t": 53.1, "x": "結婚生活がとても幸せだと答えた人たちがいます。"}, {"t": 56.916666666666664, "x": "その57%は、人生全体もとても幸せだと\n答えていました。"}, {"t": 62.2, "x": "まあまあ幸せと答えた人では、それが10%でした。"}, {"t": 66.33333333333333, "x": "心臓の手術を受けた人たちの記録もあります。"}, {"t": 69.56666666666666, "x": "手術の1年後に、夫婦仲に満足していた人たちです。"}, {"t": 73.78333333333333, "x": "その人たちは、15年後に生きている割合が\n3.2倍でした。"}, {"t": 78.33333333333333, "x": "年れいや生活のくせでは説明し\nきれなかったそうです。"}, {"t": 81.93333333333334, "x": "ところが夫婦仲は、時間とともに下がりやすいのです。"}, {"t": 85.65, "x": "ある時点で、いろいろな夫婦を\nくらべた研究があります。"}, {"t": 89.7, "x": "そこでは下がってからまた上向くようにも見えました。"}, {"t": 92.93333333333334, "x": "でも、同じ夫婦を長く追った研究は違いました。"}, {"t": 96.61666666666666, "x": "下がる流れは、どの時期にも上向かなかったのです。"}, {"t": 100.1, "x": "論文はこれを、ふつうに起きる下がり方と呼びます。"}, {"t": 103.68333333333334, "x": "なにもしなければ、少しずつ下がっていく。"}, {"t": 106.6, "x": "それがこの研究の出発点でした。"}, {"t": 109.08333333333333, "x": "夫婦仲を下げるものとして、よく知られたものが\nあります。"}, {"t": 112.86666666666666, "x": "けんかの最中に起きる、いやな\n気持ちのやり返しです。"}, {"t": 116.75, "x": "片ほうがきつく言うと、もう片ほうもきつく返す。"}, {"t": 120.23333333333333, "x": "その返しに、また強い言葉が返ってくる。"}, {"t": 123.41666666666667, "x": "論文が引いているゴットマンの\n研究で知られた考えです。"}, {"t": 127.15, "x": "例として出てくるのは子育てをめぐるけんかです。"}, {"t": 130.18333333333334, "x": "妻が、夫の子どもへの接し方を責めます。"}, {"t": 133.33333333333334, "x": "夫はむっとして、そんなことはないと言い返す。"}, {"t": 136.71666666666667, "x": "あるいは妻の人がらまで悪く言ってしまう。"}, {"t": 139.48333333333332, "x": "こうして鎖がつながっていきます。"}, {"t": 141.7, "x": "この鎖を途中で切る手当ては、すでにありました。"}, {"t": 145.08333333333334, "x": "ただ、時間もお金もかなりかかります。"}, {"t": 147.85, "x": "しかもたくさんの部品でできています。"}, {"t": 150.18333333333334, "x": "そのため、どの部品が効いたのかが分かりにくい。"}, {"t": 153.46666666666667, "x": "論文は、そこを問題にしました。"}, {"t": 155.98333333333332, "x": "そこで研究者たちは、別の道を考えました。"}, {"t": 159.56666666666666, "x": "手がかりは、教育などの分野で\n試されてきた短い工夫です。"}, {"t": 163.98333333333332, "x": "理屈にもとづいた小さな手当てが長く効くことがある。"}, {"t": 167.36666666666667, "x": "考えや行動が、そのあと自分で回り続けるからです。"}, {"t": 171.25, "x": "そんな研究がすでに集まっていました。"}, {"t": 173.85, "x": "夫婦仲も自分で回り続ける性質を持っています。"}, {"t": 177.4, "x": "やり返しの鎖がまさにそうです。"}, {"t": 179.68333333333334, "x": "いやな気持ちが返ってきて、\nさらにいやな気持ちを生む。"}, {"t": 183.41666666666666, "x": "それなら、どこか1か所を変えればいい。"}, {"t": 186.08333333333334, "x": "それだけでも、流れが変わるかもしれない。"}, {"t": 188.88333333333333, "x": "研究者たちはその1か所にねらいをしぼりました。"}, {"t": 192.13333333333333, "x": "けんかで生まれる怒りやつらさです。"}, {"t": 194.33333333333334, "x": "ねらいが1つなので、手間もほとんどかかりません。"}, {"t": 197.63333333333333, "x": "長い話し合いの場に、くり返し出かける\n必要もないのです。"}, {"t": 201.78333333333333, "x": "もう1つ、覚えておいてほしい点があります。"}, {"t": 204.9, "x": "対象にしたのは、ふつうの夫婦です。"}, {"t": 207.63333333333333, "x": "治療を受けるほど困っている夫婦ではありません。"}, {"t": 210.65, "x": "使ったのは、とらえ直しという気持ちの整え方です。"}, {"t": 214.26666666666668, "x": "気持ちを動かした出来事の意味を見直すことです。"}, {"t": 217.45, "x": "感情の研究で知られるジェームズ・グロスが\n説明してきました。"}, {"t": 221.46666666666667, "x": "もとになったのは研究室での実験です。"}, {"t": 224.26666666666668, "x": "人とのもめごとを思い出してもらいます。"}, {"t": 226.78333333333333, "x": "そして第三者の目でとらえ直すように頼みました。"}, {"t": 230.06666666666666, "x": "すると、怒りやつらさが小さくなりました。"}, {"t": 233.06666666666666, "x": "もめごとを考えこんだ人たちより小さかったのです。"}, {"t": 236.46666666666667, "x": "とくに指示のなかった人たちと\nくらべても小さくなりました。"}, {"t": 240.15, "x": "人はふだん、もめごとを自分の目から見がちです。"}, {"t": 243.55, "x": "言われたことやされたことが、まず目に入ります。"}, {"t": 246.66666666666666, "x": "この実験では、人とのもめごとを\n1つ思い出すだけでした。"}, {"t": 250.68333333333334, "x": "長い期間、夫婦仲を守れるのか。"}, {"t": 253.58333333333334, "x": "それを確かめるのが、この研究のねらいでした。"}, {"t": 256.81666666666666, "x": "そこで研究者たちは考えました。"}, {"t": 259.25, "x": "第三者の目を身につけた人は\n怒りが早く引くのではないか。"}, {"t": 263.2, "x": "それが夫婦仲を守ることにつながるのではないか。"}, {"t": 266.45, "x": "この論文の著者には、そのグロスも入っています。"}, {"t": 269.81666666666666, "x": "参加したのは、シカゴとその周りに住む120組です。"}, {"t": 273.78333333333336, "x": "どれも男女の夫婦でした。"}, {"t": 275.55, "x": "年れいの平均は40歳です。"}, {"t": 277.8833333333333, "x": "いちばん若い人は20歳で、\nいちばん年上は79歳でした。"}, {"t": 282.85, "x": "結婚して平均11年たっていました。"}, {"t": 285.76666666666665, "x": "結婚したばかりの夫婦もいれば、\n52年の夫婦もいました。"}, {"t": 290.1, "x": "集め方も書かれています。"}, {"t": 291.93333333333334, "x": "新聞の広告とインターネットの広告です。"}, {"t": 294.85, "x": "地元の学校でもチラシを配りました。"}, {"t": 297.43333333333334, "x": "子どもがそのチラシを家に持ち帰ったのです。"}, {"t": 300.28333333333336, "x": "夫婦仲は、6つのものさしで測りました。"}, {"t": 303.3666666666667, "x": "満足と愛と親しさ、そして信頼と情熱です。"}, {"t": 307.01666666666665, "x": "6つめはこの関係を続けていく気持ちです。"}, {"t": 310.01666666666665, "x": "たとえば相手をどのくらい信頼しているか。"}, {"t": 312.76666666666665, "x": "いまの関係に満足していると感じるか。"}, {"t": 315.5833333333333, "x": "相手をどのくらい愛しているか。"}, {"t": 317.6, "x": "どれも1から7の目盛りで答えます。"}, {"t": 320.05, "x": "6つはそれぞれ別のものです。"}, {"t": 322.1, "x": "でもまとめると夫婦仲の良さになります。"}, {"t": 324.76666666666665, "x": "論文は、6つを合わせた点数も作りました。"}, {"t": 328.15, "x": "研究は2年続き、4か月ごとに\n7回の調べがありました。"}, {"t": 332.9, "x": "1回めはインターネットで質問に答えます。"}, {"t": 335.95, "x": "そのあと研究室に来て、いくつかの課題をしました。"}, {"t": 339.6166666666667, "x": "2回めから7回めはすべてインターネットです。"}, {"t": 342.6166666666667, "x": "毎回まず、夫婦仲の質問に答えます。"}, {"t": 345.98333333333335, "x": "そして、この4か月でいちばん大きかった\n意見の違いを書きます。"}, {"t": 350.35, "x": "書き方には決まりがありました。"}, {"t": 352.4166666666667, "x": "考えや気持ちではなく行動に目を向けること。"}, {"t": 355.5166666666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}

  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
