<script>
const D={"name": "けんかで黙り込む人は_男のほうが多かった_研究所は85%と記す", "file": "106_けんかで黙り込む人は_男のほうが多かった_研究所は85%と記す", "dur": 850.31665625, "segs": [], "subs": [{"t": 0.0, "x": "けんかになると男は黙る。"}, {"t": 1.9166666666666667, "x": "そんな言い方を聞いたことはありませんか。"}, {"t": 4.533333333333333, "x": "妻が話しかけます。"}, {"t": 6.0, "x": "でも夫はテレビから目を離さない。"}, {"t": 8.316666666666666, "x": "返事がないまま部屋を出ていってしまう。"}, {"t": 10.766666666666667, "x": "ドラマや身の上相談でよく見かける場面です。"}, {"t": 13.783333333333333, "x": "実はこの話に近い数字が、ある研究所の\n記事に出てきます。"}, {"t": 18.233333333333334, "x": "ゴットマン研究所です。"}, {"t": 19.9, "x": "夫婦の会話を長く調べてきたところです。"}, {"t": 22.65, "x": "その公式ブログの記事は、こう書いています。"}, {"t": 25.766666666666666, "x": "研究室で調べた黙り込む人のうち、\n85%が男性だった。"}, {"t": 31.066666666666666, "x": "やはり男は黙るのか。"}, {"t": 32.81666666666667, "x": "そう思うかもしれません。"}, {"t": 34.416666666666664, "x": "でもこの1文は、読み方に気をつける必要があります。"}, {"t": 38.4, "x": "男性の85%が黙り込む、とは書いていないからです。"}, {"t": 42.96666666666667, "x": "黙り込んだ人を集めたら、その85%が男性だった。"}, {"t": 47.583333333333336, "x": "記事が言っているのはこちらです。"}, {"t": 49.55, "x": "今日の話は、この数字の読み方の1点です。"}, {"t": 52.96666666666667, "x": "黙り込むとはどういうことなのか。"}, {"t": 55.15, "x": "記事はどこまで言っているのか。"}, {"t": 57.083333333333336, "x": "どこから先は言っていないのか。"}, {"t": 59.15, "x": "女性が黙り込む場合についても、\n記事に沿って見ていきます。"}, {"t": 63.21666666666667, "x": "男はみんな黙る、という話ではありません。"}, {"t": 66.46666666666667, "x": "そこを先にお伝えしておきます。"}, {"t": 68.68333333333334, "x": "研究所はこの振る舞いを、英語で\n石の壁と呼んでいます。"}, {"t": 72.9, "x": "けんかを壊す4つの話し方の最後の一つです。"}, {"t": 76.25, "x": "記事の説明はこうです。"}, {"t": 78.0, "x": "話し合いの最中に、聞き手がやりとりから\n引いてしまう。"}, {"t": 81.85, "x": "心を閉じて話し手を締め出してしまう。"}, {"t": 84.43333333333334, "x": "気持ちに押しつぶされそうになっているからです。"}, {"t": 87.18333333333334, "x": "あるいは体があふれた状態になっているから、と\n記事は書きます。"}, {"t": 91.4, "x": "たとえて言えば、自分と相手のあいだに\n壁を積むのです。"}, {"t": 95.26666666666667, "x": "ここで大事なのは聞き手という言葉です。"}, {"t": 97.81666666666666, "x": "話している人ではありません。"}, {"t": 99.71666666666667, "x": "聞いている人が閉じていくのです。"}, {"t": 101.76666666666667, "x": "相手がなにかを伝えようとしています。"}, {"t": 104.21666666666667, "x": "それなのに受け取る窓が閉まる。"}, {"t": 106.18333333333334, "x": "怒鳴るのとは向きが逆の振る舞いです。"}, {"t": 108.6, "x": "記事の言う反応しない状態は、\n外から見ると静かです。"}, {"t": 112.58333333333333, "x": "でも静かだから穏やか、とは限りません。"}, {"t": 115.55, "x": "でも向き合っている相手から見るとどうでしょう。"}, {"t": 118.23333333333333, "x": "そこには壁しかありません。"}, {"t": 120.08333333333333, "x": "この壁の話は以前の回でも少し触れました。"}, {"t": 123.26666666666667, "x": "今日はその中の数字の部分を見ていきます。"}, {"t": 126.13333333333334, "x": "では黙り込む人は、\n実際にどんな様子なのでしょうか。"}, {"t": 129.95, "x": "記事はいくつかの姿を挙げています。"}, {"t": 132.35, "x": "話を聞き流す。"}, {"t": 133.73333333333332, "x": "顔や体をそむける。"}, {"t": 135.3, "x": "急に忙しいふりをする。"}, {"t": 137.16666666666666, "x": "なにかに没頭して、そこから離れない。"}, {"t": 139.93333333333334, "x": "どれも問題と向き合う代わりの動きです。"}, {"t": 142.6, "x": "記事は、まったく反応しなくなるとも書いています。"}, {"t": 146.0, "x": "たとえば台所です。"}, {"t": 147.51666666666668, "x": "妻が今月の出費の話を始めたとします。"}, {"t": 150.65, "x": "夫はうなずきもせず、スマホの画面を見続けます。"}, {"t": 154.55, "x": "そのうち立ち上がって洗濯物を取りこみに行く。"}, {"t": 157.58333333333334, "x": "本人は逃げたつもりはないかもしれません。"}, {"t": 160.25, "x": "でも妻には、壁の向こうに消えたように見えます。"}, {"t": 163.65, "x": "記事はもう一つ大事なことを書いています。"}, {"t": 166.38333333333333, "x": "黙り込みは、\nいきなり始まるわけではないというのです。"}, {"t": 170.03333333333333, "x": "責める言葉や見下す態度、言い訳が積み重なる。"}, {"t": 173.7, "x": "すると黙ることが、もっともな逃げ道に見えてくる。"}, {"t": 177.05, "x": "そして一度始まると、くせになりやすいと\n記事は書いています。"}, {"t": 181.2, "x": "いよいよ今日の数字です。"}, {"t": 182.86666666666667, "x": "研究所のブログには、黙り込みを\n扱った記事が2つあります。"}, {"t": 187.3, "x": "一つは2025年に出た黙り込みの解説です。"}, {"t": 190.8, "x": "もう一つは2014年に出た記事です。"}, {"t": 193.5, "x": "研究の中身を紹介するものです。"}, {"t": 196.03333333333333, "x": "どちらにもほぼ同じ文が載っています。"}, {"t": 199.0, "x": "男性は女性より、一貫して黙り込みやすい。"}, {"t": 202.55, "x": "男性は話し合いから気持ちを引っこめる。"}, {"t": 205.31666666666666, "x": "いっぽう女性は、気持ちを話し合いに\n向けたままでいる。"}, {"t": 209.15, "x": "そしてこう続きます。"}, {"t": 210.61666666666667, "x": "ラブラボで調べた黙り込む人のうち、\n85%が男性だった。"}, {"t": 215.61666666666667, "x": "記事はラブラボという研究室の呼び名を使っています。"}, {"t": 219.2, "x": "2014年の記事では言い方が少し違います。"}, {"t": 222.48333333333332, "x": "ゴットマン博士が調べた黙り込む人の\n85%が男性、となっています。"}, {"t": 228.15, "x": "数字はどちらも85%です。"}, {"t": 230.91666666666666, "x": "記事はさらに、男性について別のことも書いています。"}, {"t": 234.75, "x": "これについてはあとで見ていきます。"}, {"t": 236.88333333333333, "x": "まずは85%という数字そのものを、\nゆっくり読んでみましょう。"}, {"t": 241.86666666666667, "x": "85%という数字には、2つの\n読み方がありそうに見えます。"}, {"t": 246.88333333333333, "x": "一つは、男性の85%が黙り込むという読み方です。"}, {"t": 251.56666666666666, "x": "もう一つは、黙り込んだ人のうち85%が\n男性という読み方です。"}, {"t": 257.01666666666665, "x": "記事が書いているのは2つ目のほうです。"}, {"t": 259.55, "x": "この違いは思ったより大きいものです。"}, {"t": 262.1333333333333, "x": "たとえば黙り込んだ人を100人集めたとします。"}, {"t": 265.3333333333333, "x": "そのうち男性が85人で女性が15人。"}, {"t": 268.75, "x": "これが記事の言う85%の形です。"}, {"t": 271.93333333333334, "x": "100人の外にも人はいます。"}, {"t": 274.0, "x": "黙り込まなかった人たちです。"}, {"t": 275.95, "x": "その人たちがどれくらいいたのか。"}, {"t": 278.1, "x": "それはこの数字だけでは分かりません。"}, {"t": 280.5, "x": "男性全体のうち、黙り込んだ\n人はどれくらいの割合なのか。"}, {"t": 285.0833333333333, "x": "それもこの1文からは出てきません。"}, {"t": 287.4166666666667, "x": "似た例を一つ挙げます。"}, {"t": 289.06666666666666, "x": "あるクラスで、忘れ物をした子の\n85%が男子だったとします。"}, {"t": 294.05, "x": "それでも男子の85%が忘れ物を\nしたわけではありません。"}, {"t": 298.56666666666666, "x": "男子の大半は忘れ物をしていないかも\nしれないのです。"}, {"t": 302.15, "x": "女性より男性に多い、という\n向きは記事も書いています。"}, {"t": 306.1666666666667, "x": "でも男性の多くが黙り込むとは、\nこの数字だけでは言えないのです。"}, {"t": 310.71666666666664, "x": "もう一つ、記事に書かれていないことがあります。"}, {"t": 313.85, "x": "85%がどれだけの夫婦を調べた結果なのかです。"}, {"t": 317.95, "x": "どんな場面の黙り込みを数えたのかも出てきません。"}, {"t": 321.25, "x": "どこからを黙り込みと数えたのか。"}, {"t": 323.6, "x": "その決め方も載っていません。"}, {"t": 325.46666666666664, "x": "2014年の記事には手がかりが一つ添えられています。"}, {"t": 329.1333333333333, "x": "これらの結果の多くは、1985年の\n論文から来ているという1文です。"}, {"t": 334.9166666666667, "x": "レベンソンとゴットマンの2人が書いた論文です。"}, {"t": 337.96666666666664, "x": "題名は、関係の満足の変化を予測する体と\n気持ちの手がかり、という意味です。"}, {"t": 343.98333333333335, "x": "その論文を開いてみます。"}, {"t": 345.81666666666666, "x": "調べた夫婦は30組でした。"}, {"t": 348.03333333333336, "x": "1980年に夫婦の会話を録画して、\n体の反応も測ったのです。"}, {"t": 353.68333333333334, "x": "3年後の1983年に、もう一度連絡を取りました。"}, {"t": 358.58333333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
