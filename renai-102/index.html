<script>
const D={"name": "けんか中に頭が真っ白になるなら_研究所は20分の中断を勧めていた", "file": "102_けんか中に頭が真っ白になるなら_研究所は20分の中断を勧めていた", "dur": 817.7833125, "segs": [], "subs": [{"t": 0.0, "x": "言い合いが熱くなった時はすぐに結論を出すべきだ。"}, {"t": 3.3833333333333333, "x": "そう思っていませんか。"}, {"t": 4.95, "x": "今夜のうちに決着をつけよう。"}, {"t": 7.083333333333333, "x": "寝る前に仲直りしておこう。"}, {"t": 9.116666666666667, "x": "そう考えて話を続ける人は多いはずです。"}, {"t": 12.366666666666667, "x": "でも途中で、\n頭が真っ白になったことはないでしょうか。"}, {"t": 16.183333333333334, "x": "相手の言葉が入ってこない。"}, {"t": 18.133333333333333, "x": "言うつもりのなかったことが口から出てしまう。"}, {"t": 20.85, "x": "ゴットマン研究所のサイトを見てみます。"}, {"t": 23.433333333333334, "x": "この状態を扱った記事がいくつもあります。"}, {"t": 26.316666666666666, "x": "記事はこれをあふれた状態と呼んでいます。"}, {"t": 29.033333333333335, "x": "体が追いついていない時は止める。"}, {"t": 31.383333333333333, "x": "記事はそう書いています。"}, {"t": 32.983333333333334, "x": "目安は、20分ほどの休憩です。"}, {"t": 35.733333333333334, "x": "けんかの途中で席を外すのは、\n逃げに見えるかもしれません。"}, {"t": 39.8, "x": "でも記事が見ているのは気持ちの\n強さではありません。"}, {"t": 43.03333333333333, "x": "体の状態です。"}, {"t": 44.45, "x": "今日の話は、けんかを中断することの1点です。"}, {"t": 48.05, "x": "あふれた時に体の中で起きていること。"}, {"t": 50.8, "x": "休憩の長さの目安と、その時間の過ごし方。"}, {"t": 54.4, "x": "そして戻り方までを、記事に沿って見ていきます。"}, {"t": 57.733333333333334, "x": "ただし必ず解決する話ではありません。"}, {"t": 60.63333333333333, "x": "話し合いを続けるための準備として聞いてください。"}, {"t": 63.916666666666664, "x": "研究所のサイトの記事は、あふれた\n状態をこう説明しています。"}, {"t": 68.5, "x": "危ないものから逃げるための、\n体の警報だというのです。"}, {"t": 72.51666666666667, "x": "本来は身を守るための仕組みです。"}, {"t": 74.85, "x": "夜道で物音がして体がとっさに固まる。"}, {"t": 77.73333333333333, "x": "車が近づいてきて思わず飛びのく。"}, {"t": 80.3, "x": "そういう時に働くのと同じ警報です。"}, {"t": 83.11666666666666, "x": "困るのは、けんかの最中にもこの警報が\n鳴ることです。"}, {"t": 87.03333333333333, "x": "目の前にいるのは、命をおびやかす\n相手ではありません。"}, {"t": 90.85, "x": "長く一緒に暮らしてきた大事な人です。"}, {"t": 93.46666666666667, "x": "それでも強い言葉は、体には危険の合図に見えます。"}, {"t": 97.38333333333334, "x": "険しい顔も同じです。"}, {"t": 99.1, "x": "すると体は戦うか逃げるかの準備を始めます。"}, {"t": 102.41666666666667, "x": "気合いが足りないからではありません。"}, {"t": 104.61666666666666, "x": "体が別の仕事を先にしているからなのです。"}, {"t": 107.7, "x": "ここを知っておくと、見え方が少し変わります。"}, {"t": 111.0, "x": "相手が急に黙ったり、声を荒げたりした時。"}, {"t": 114.5, "x": "それはわざとではなく、警報が\n鳴っている合図かもしれません。"}, {"t": 118.7, "x": "自分の頭が回らなくなった時も同じです。"}, {"t": 121.75, "x": "弱いからではありません。"}, {"t": 123.38333333333334, "x": "体が守りに入っているのです。"}, {"t": 125.58333333333333, "x": "警報が鳴ると、体の中ではなにが\n起きるのでしょうか。"}, {"t": 129.6, "x": "記事によると、まずアドレナリンが出ます。"}, {"t": 132.45, "x": "全身をかけめぐるのです。"}, {"t": 134.26666666666668, "x": "すぐ動けるようにするためです。"}, {"t": 136.23333333333332, "x": "心臓の鼓動が速くなります。"}, {"t": 138.36666666666667, "x": "呼吸も速くなります。"}, {"t": 139.96666666666667, "x": "血圧が上がります。"}, {"t": 141.45, "x": "食べ物を消化する働きはゆっくりになります。"}, {"t": 144.5, "x": "走って逃げるには、どれも役に立つ変化です。"}, {"t": 147.7, "x": "でも話し合いには向いていません。"}, {"t": 149.85, "x": "この状態では、集中して聞けなくなります。"}, {"t": 152.96666666666667, "x": "はっきり話すこともできない、と記事はいいます。"}, {"t": 156.18333333333334, "x": "危険が去れば、アドレナリンは\n引いて体はゆるみます。"}, {"t": 159.8, "x": "ところがけんかでは目の前の相手が去りません。"}, {"t": 162.73333333333332, "x": "言葉の応酬が続くかぎり、警報も鳴り続けます。"}, {"t": 166.61666666666667, "x": "この高ぶりは、出口のないままたまっていきます。"}, {"t": 169.95, "x": "すると不安やストレスが続く、と記事は書いています。"}, {"t": 173.58333333333334, "x": "体から見れば、けんかは終わらない非常事態です。"}, {"t": 177.13333333333333, "x": "冷静な言葉を選べというほうが難しいのです。"}, {"t": 180.45, "x": "研究所の別の記事は、具体的な目安を\n紹介しています。"}, {"t": 184.81666666666666, "x": "ゴットマン博士が本に書いた言葉としてです。"}, {"t": 187.71666666666667, "x": "心拍が1分間に100回を超えると、\n相手の話を聞き取れなくなる。"}, {"t": 192.66666666666666, "x": "どんなに聞こうとしても、聞こえないというのです。"}, {"t": 195.75, "x": "この数字は博士の研究を紹介する中で出てきます。"}, {"t": 199.45, "x": "ただし、人によって差はあるでしょう。"}, {"t": 202.0, "x": "だれにでも同じ線が引けるわけではありません。"}, {"t": 204.9, "x": "目安の一つとして受け取っておくのがよさそうです。"}, {"t": 208.05, "x": "大事なのは数字よりもその中身です。"}, {"t": 210.61666666666667, "x": "聞かないのではなく、聞けない。"}, {"t": 212.78333333333333, "x": "ここに、けんかがこじれる理由の一つがあります。"}, {"t": 216.15, "x": "あふれた人の耳には、歩み寄りの\n一言も届きにくくなります。"}, {"t": 220.51666666666668, "x": "この点は以前の回でも少し触れました。"}, {"t": 223.2, "x": "それなら言葉を重ねても届きません。"}, {"t": 225.63333333333333, "x": "もっと分かりやすく言おうとする。"}, {"t": 227.61666666666667, "x": "声を大きくして伝えようとする。"}, {"t": 229.81666666666666, "x": "どちらも警報をさらに強く鳴らしてしまいます。"}, {"t": 232.9, "x": "うまい言葉より先に、体を落ち着かせることが\n必要なのです。"}, {"t": 237.3, "x": "では、あふれていることにどうやって\n気づけばいいのでしょうか。"}, {"t": 241.0, "x": "記事は、あふれた時に出やすいサインを\n挙げています。"}, {"t": 244.5, "x": "一つは、心臓がどきどきすることです。"}, {"t": 247.28333333333333, "x": "押しつぶされそうに感じることもあります。"}, {"t": 249.85, "x": "2つ目は、相手の\n話をさえぎったりかぶせたりすることです。"}, {"t": 253.93333333333334, "x": "3つ目は黙り込んで心を閉ざしてしまうことです。"}, {"t": 257.1666666666667, "x": "4つ目は相手を見下すような態度をとることです。"}, {"t": 260.4, "x": "最後の2つは、以前の回で紹介した\n石垣や軽蔑と同じ形です。"}, {"t": 265.6166666666667, "x": "壊れた話し方の裏に、体の高ぶりが\n隠れていることもあるのです。"}, {"t": 270.3833333333333, "x": "自分で気づくのは思ったより難しいものです。"}, {"t": 273.4166666666667, "x": "あふれている最中は、自分は\n正しいと感じやすいからです。"}, {"t": 277.6333333333333, "x": "だから体の小さな変化を目印にしておくと\n役に立ちます。"}, {"t": 281.6666666666667, "x": "顔が熱くなる。"}, {"t": 282.8833333333333, "x": "肩に力が入る。"}, {"t": 284.35, "x": "相手の話を最後まで聞かずに、\n言い返す言葉を探している。"}, {"t": 288.8333333333333, "x": "こうした変化に気づいたら、それが合図です。"}, {"t": 291.8833333333333, "x": "記事は、同じけんかを何度も\n繰り返す2人にも触れています。"}, {"t": 296.1, "x": "中身を話す前に、あふれが邪魔を\nしていないか確かめるとよいそうです。"}, {"t": 300.8666666666667, "x": "毎回同じところでこじれるなら、\n体の問題が隠れているかもしれません。"}, {"t": 305.8333333333333, "x": "研究所の記事には、ある実験の話が出てきます。"}, {"t": 309.51666666666665, "x": "夫婦に、2人の問題について\n話し合ってもらう実験です。"}, {"t": 313.85, "x": "話し合いが始まって15分ほどたちました。"}, {"t": 316.85, "x": "そこで研究者が割って入りました。"}, {"t": 319.21666666666664, "x": "機械の調整が必要になったと伝えたのです。"}, {"t": 322.4, "x": "そして問題については話さないでほしいと\n頼みました。"}, {"t": 325.96666666666664, "x": "2人は30分ほど、雑誌を読んで過ごしました。"}, {"t": 329.65, "x": "そのあとで、話し合いが再開されます。"}, {"t": 332.51666666666665, "x": "すると、2人の心拍は大きく下がっていました。"}, {"t": 336.1166666666667, "x": "話し合いも前より前向きで、\n実りのあるものになっていたといいます。"}, {"t": 340.7, "x": "問題の中身はなにも変わっていません。"}, {"t": 343.26666666666665, "x": "変わったのは2人の体の状態だけです。"}, {"t": 346.06666666666666, "x": "記事は、この実験の人数までは書いていません。"}, {"t": 349.45, "x": "細かい数字もありません。"}, {"t": 351.21666666666664, "x": "だから、どれほどの差だったかはここでは言えません。"}, {"t": 354.4166666666667, "x": "それでも、示していることは分かりやすいものです。"}, {"t": 357.75, "x": "話し合う力は体が落ち着くと戻ってくる。"}, {"t": 360.71666666666664, "x": "続けるべき話し合いも、止めたほうが進むことがある。"}, {"t": 364.4, "x": "止めることは、話し合いをやめることではないのです。"}, {"t": 367.78333333333336, "x": "では休憩は、どのくらい取ればいいのでしょうか。"}, {"t": 370.98333333333335, "x": "記事ごとに少しずつ書き方が違います。"}, {"t": 373.7, "x": "けんかの上手なしかたの記事は、\n20分から30分です。"}, {"t": 377.85, "x": "あふれた状態の記事は、少なくとも20分です。"}, {"t": 381.43333333333334, "x": "そして長くても24時間まで、と書いています。"}, {"t": 384.93333333333334, "x": "落ち着かせ方の記事は、20分ほどを\n目安にしています。"}, {"t": 388.85, "x": "3つの記事に共通するのは、20分という数字です。"}, {"t": 392.75, "x": "5分や10分ではないのです。"}, {"t": 394.73333333333335, "x": "落ち着かせ方の記事は、その理由に\n体の仕組みを挙げています。"}, {"t": 399.05, "x": "興奮した時に出る物質の一つは、\nすぐには分解されないそうです。"}, {"t": 403.8333333333333, "x": "血の巡りから抜けるまでに、\n20分以上かかるというのです。"}, {"t": 407.95, "x": "気持ちを切り替えたつもりでも、\n体はまだ興奮の中にいます。"}, {"t": 412.28333333333336, "x": "5分で戻ると、警報が鳴ったままの\n体で話すことになります。"}, {"t": 416.8, "x": "だからこそ短く切り上げないことが大切です。"}, {"t": 419.85, "x": "一方で、長く離れすぎるのもよくありません。"}, {"t": 423.28333333333336, "x": "24時間という上限は、そのための\n線だと受け取れます。"}, {"t": 427.4166666666667, "x": "休憩は、戻ることを前提にした時間なのです。"}, {"t": 431.0, "x": "休憩を始める時にもこつがあります。"}, {"t": 433.71666666666664, "x": "あふれた状態を扱った記事は、\n合言葉を決めておくことを勧めています。"}, {"t": 438.78333333333336, "x": "これが出たら休憩、という短い言葉です。"}, {"t": 442.0, "x": "けんかの最中に、上手な言い方を\n考えるのは難しいものです。"}, {"t": 446.75, "x": "頭が真っ白な時に、気の利いた\n説明はまず出てきません。"}, {"t": 450.9166666666667, "x": "だから言う言葉を先に決めておくのです。"}, {"t": 453.5, "x": "たとえば、タイム。"}, {"t": 455.0, "x": "ちょっと散歩、でもいいでしょう。"}, {"t": 457.35, "x": "大事なのは2人が同じ意味で受け取れることです。"}, {"t": 460.5, "x": "決めていない言葉で急に席を立つとどうでしょう。"}, {"t": 463.53333333333336, "x": "相手には逃げたように見えます。"}, {"t": 465.5833333333333, "x": "置いていかれた、と感じる人もいるでしょう。"}, {"t": 468.43333333333334, "x": "決めてある合言葉なら、休憩だとすぐに伝わります。"}, {"t": 472.25, "x": "けんかの上手なしかたの記事も、\n合図を話し合っておくよう勧めています。"}, {"t": 477.18333333333334, "x": "どんな合図を送り合えば休めるか。"}, {"t": 479.51666666666665, "x": "これを、けんかのない穏やかな日に\n決めておくのです。"}, {"t": 483.01666666666665, "x": "落ち着いている時の約束は、\n熱くなった時の自分を助けてくれます。"}, {"t": 487.71666666666664, "x": "合言葉は、相手を黙らせるための\n言葉ではありません。"}, {"t": 491.51666666666665, "x": "自分の体が限界に来たことを知らせる言葉なのです。"}, {"t": 495.1166666666667, "x": "休憩の時間には、やらないほうがいいことがあります。"}, {"t": 498.85, "x": "あふれた状態の記事は、くよくよ煮詰めないことと\n書いています。"}, {"t": 503.03333333333336, "x": "言い合いを頭の中で再生しない。"}, {"t": 505.45, "x": "休憩のあとで、なんと言い返すかを考えない。"}, {"t": 508.95, "x": "休憩はそのための時間ではないというのです。"}, {"t": 511.96666666666664, "x": "落ち着かせ方の記事も、同じようなことを\n書いています。"}, {"t": 515.6333333333333, "x": "言い争いのことを考え込まない。"}, {"t": 517.9333333333333, "x": "仕返しのことを考えない。"}, {"t": 519.8333333333334, "x": "そして2つの考え方に気をつけるよう書いています。"}, {"t": 523.2666666666667, "x": "一つは、もう耐えられないという正義の怒りです。"}, {"t": 526.5833333333334, "x": "もう一つは、責められているという被害者の\n気持ちです。"}, {"t": 530.2666666666667, "x": "どちらも考えているうちは、\n自分が正しいと感じられます。"}, {"t": 534.4333333333333, "x": "でもその考えが、高ぶりを長引かせてしまいます。"}, {"t": 537.9666666666667, "x": "一人になっても、頭の中でけんかが\n続いていれば同じです。"}, {"t": 542.1166666666667, "x": "体はまだ戦いの最中だと受け取ります。"}, {"t": 545.0166666666667, "x": "20分たっても、心拍は下がらないかもしれません。"}, {"t": 548.5833333333334, "x": "大事なのは体を離すことより、\n考えをけんかから離すことなのです。"}, {"t": 553.5, "x": "では、休憩の時間にはなにを\nすればいいのでしょうか。"}, {"t": 557.2166666666667, "x": "記事は、気持ちが落ち着くことや\n気がまぎれることを勧めています。"}, {"t": 561.4666666666667, "x": "散歩をする。"}, {"t": 562.4833333333333, "x": "音楽を聴く。"}, {"t": 563.5666666666667, "x": "本を読む。"}, {"t": 564.4666666666667, "x": "塗り絵をする。"}, {"t": 565.4166666666666, "x": "ゆっくり深く息をする。"}, {"t": 567.1, "x": "落ち着かせ方の記事は、まず息を\nすることから始めています。"}, {"t": 571.1833333333333, "x": "慌てている時ほど、息をすることは\n忘れがちだというのです。"}, {"t": 575.25, "x": "その記事は、お気に入りの場所を\n思い浮かべることも勧めています。"}, {"t": 579.5333333333333, "x": "心配ごとを忘れてゆったりできる場所です。"}, {"t": 582.3, "x": "その場所にいる自分を静かに思い描きます。"}, {"t": 585.35, "x": "けんかの上手なしかたの記事は、\nまた別のことを書いています。"}, {"t": 589.45, "x": "一人で、2人の関係のよいところに\n目を向けることです。"}, {"t": 593.3833333333333, "x": "たとえば楽しかった旅行や、\n助けてもらった日のことです。"}, {"t": 597.25, "x": "責める材料を探すのとは、逆の\n向きに頭を使うわけです。"}, {"t": 601.5333333333333, "x": "どれを選ぶかは人それぞれです。"}, {"t": 603.6166666666667, "x": "自分に合う落ち着き方を一つ持っておくと安心です。"}, {"t": 607.05, "x": "休憩の最後に大切なのは、話し合いに戻ることです。"}, {"t": 611.15, "x": "落ち着かせ方の記事は、20分ほどで\n落ち着いて話に戻れると書いています。"}, {"t": 616.2833333333333, "x": "ただ、いつも時間どおりに体が静まるとは限りません。"}, {"t": 620.25, "x": "20分たっても、\nまだ胸がどきどきすることもあるでしょう。"}, {"t": 624.0333333333333, "x": "あふれた状態を扱った記事は、\nその場合のことも書いています。"}, {"t": 628.35, "x": "まだあふれていると感じたら、もう一度休憩を\n取るのです。"}, {"t": 632.25, "x": "落ち着いて話せると感じるまで、それを繰り返します。"}, {"t": 636.0166666666667, "x": "ここで忘れたくないのが、24時間という上限です。"}, {"t": 639.7833333333333, "x": "繰り返すのは、先送りするためではありません。"}, {"t": 643.1166666666667, "x": "戻れる体を取り戻すためです。"}, {"t": 645.25, "x": "戻った時に話すのは、さっきと同じ問題です。"}, {"t": 648.75, "x": "中身はなにも変わっていません。"}, {"t": 650.8166666666667, "x": "でも2人の体の状態は変わっています。"}, {"t": 653.65, "x": "さっきは聞こえなかった一言が、\n今度は耳に入るかもしれません。"}, {"t": 658.0333333333333, "x": "相手の言い分に、うなずける\n所が見つかるかもしれません。"}, {"t": 662.0666666666667, "x": "実験の夫婦が、前向きな話し合いに\n戻れたのと同じ流れです。"}, {"t": 666.6833333333333, "x": "休憩の行き先は、休むことではなく戻ることなのです。"}, {"t": 670.6333333333333, "x": "ここまで、けんかを中断する話をしてきました。"}, {"t": 674.15, "x": "最後に言い過ぎないための確認をしておきます。"}, {"t": 677.2333333333333, "x": "休憩を取れば、\n必ず問題が解決するわけではありません。"}, {"t": 681.6, "x": "記事も、休憩をけんかの答えとしては\n書いていません。"}, {"t": 685.35, "x": "あふれた状態を扱った記事は、\n順番の話として書いています。"}, {"t": 689.9333333333333, "x": "まず、あふれのサインに気づいて休憩を\n取れるようになる。"}, {"t": 693.75, "x": "それができてから、繰り返すけんかの中身に向き合う。"}, {"t": 697.35, "x": "休憩は、話し合いのスタートラインに\n立つための手順なのです。"}, {"t": 701.5833333333334, "x": "けんかの上手なしかたの記事は、\n2人で話しておく問いも挙げています。"}, {"t": 706.2333333333333, "x": "自分たちはどんな時にあふれやすいのか。"}, {"t": 708.9166666666666, "x": "相手があふれた時に、できることはあるか。"}, {"t": 711.95, "x": "自分があふれた時に、どうしてほしいか。"}, {"t": 714.85, "x": "こうした問いは、けんかの最中には答えられません。"}, {"t": 718.4, "x": "穏やかな日に、お茶でも飲みながら\n話すのが向いています。"}, {"t": 722.25, "x": "休憩の取り方を2人の決まりごとにしておくのです。"}, {"t": 725.7333333333333, "x": "そうすれば席を立つことが、\n相手を突き放す動きではなくなります。"}, {"t": 730.15, "x": "あなたが言い合いで頭が真っ白になるのは、\nどんな時でしょうか。"}, {"t": 734.35, "x": "けんかの途中で頭が真っ白になるのは、\n体の警報でした。"}, {"t": 738.7166666666667, "x": "心拍が上がると、聞きたくても聞けなくなる。"}, {"t": 741.8166666666667, "x": "研究所の記事は、そんな時は\n少なくとも20分の中断を勧めていました。"}, {"t": 747.1833333333333, "x": "その時間は、けんかを頭の中で続けない。"}, {"t": 750.4333333333333, "x": "そして時間が来たら話し合いに戻る。"}, {"t": 752.9666666666667, "x": "ここからは架空の夫婦の一場面です。"}, {"t": 755.6333333333333, "x": "結婚して5年目の、土曜の夜のことです。"}, {"t": 758.8, "x": "だいきとちひろは、実家に帰る日取りで\n言い合いになっていました。"}, {"t": 762.9666666666667, "x": "ちひろの声が高くなりました。"}, {"t": 764.9333333333333, "x": "だいきは言い返す言葉を探していました。"}, {"t": 767.6333333333333, "x": "顔が熱くなっているのに、だいきは気づきました。"}, {"t": 770.9833333333333, "x": "そこで、前に2人で決めた合言葉を口にしました。"}, {"t": 774.7166666666667, "x": "ちょっと散歩。"}, {"t": 775.7166666666667, "x": "ちひろはうなずいて、台所で\nお湯をわかし始めました。"}, {"t": 779.6333333333333, "x": "だいきは夜の住宅街をゆっくり歩きました。"}, {"t": 782.6833333333333, "x": "言い返す言葉が浮かぶたびに、\n街灯の数を数えました。"}, {"t": 786.7333333333333, "x": "20分ほどして、だいきは家に戻りました。"}, {"t": 789.8833333333333, "x": "食卓には、お茶の入ったマグカップが\n2つ並んでいました。"}, {"t": 794.05, "x": "話の中身は、さっきと同じ実家の日取りです。"}, {"t": 797.4833333333333, "x": "でも今度は、相手の言葉が最後まで耳に入りました。"}, {"t": 801.4, "x": "2人は帰る日を1日ずらすことで落ち着きました。"}, {"t": 804.7, "x": "けんかを止めた20分が、話し合いを\n前に進めたのです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
