<script>
const D={"name": "仲が続く夫婦の5対1は_ほめ言葉の回数ではなかった", "file": "096_仲が続く夫婦の5対1は_ほめ言葉の回数ではなかった", "dur": 803.8333125, "segs": [], "subs": [{"t": 0.0, "x": "仲がいい夫婦は、嫌なことを\n一回したら五回ほめればいい。"}, {"t": 4.233333333333333, "x": "そんな話を聞いたことがあるかもしれません。"}, {"t": 7.033333333333333, "x": "五対一の法則と呼ばれることもあります。"}, {"t": 9.85, "x": "もとになったのはアメリカの心理学者の研究です。"}, {"t": 13.233333333333333, "x": "名前はジョン・ゴットマンといいます。"}, {"t": 15.833333333333334, "x": "夫婦の会話を長く調べてきた人です。"}, {"t": 18.5, "x": "ところが、研究所の文章を読むと、\n少し様子が違います。"}, {"t": 23.166666666666668, "x": "数えているのはほめ言葉の回数ではありません。"}, {"t": 26.366666666666667, "x": "言い争いの最中の空気の時間です。"}, {"t": 29.083333333333332, "x": "しかも、穏やかに聞いているだけの\n時間も数に入ります。"}, {"t": 32.9, "x": "今日は、夫婦や長く付き合っている二人の話です。"}, {"t": 36.55, "x": "よく喧嘩はするけれど仲は悪くないと思っている。"}, {"t": 39.7, "x": "そんな二人を思い浮かべてください。"}, {"t": 42.03333333333333, "x": "先に今日の結論を言っておきます。"}, {"t": 44.36666666666667, "x": "仲が続く夫婦も喧嘩をしないわけではありません。"}, {"t": 47.71666666666667, "x": "喧嘩の最中でも穏やかな時間を保っています。"}, {"t": 50.983333333333334, "x": "その時間の比がおよそ五対一だと書かれています。"}, {"t": 54.233333333333334, "x": "では世間で広まった話とどこが違うのか。"}, {"t": 57.233333333333334, "x": "順番に見ていきます。"}, {"t": 58.766666666666666, "x": "まずは世間で広まっている話から見ていきます。"}, {"t": 61.9, "x": "嫌なことを一回したら五回いいことをすればいい。"}, {"t": 65.08333333333333, "x": "そうすれば夫婦の仲は保てる。"}, {"t": 67.25, "x": "こんな言い方で紹介されることが多いようです。"}, {"t": 70.3, "x": "覚えやすくてすぐに試せそうな話です。"}, {"t": 73.01666666666667, "x": "実は研究所の文章にも、この言い換えのことが\n出てきます。"}, {"t": 77.11666666666666, "x": "多くの人が、データをそう言い換えた、という\n書き方です。"}, {"t": 81.16666666666667, "x": "研究そのものの言葉とは少し違うということです。"}, {"t": 84.6, "x": "ではもとのデータはどんなものを数えていたのか。"}, {"t": 87.6, "x": "研究所によると見ていたのは対立の会話です。"}, {"t": 90.85, "x": "夫婦が、意見の合わない話題に\nついて話し合う場面です。"}, {"t": 94.88333333333334, "x": "その最中に、二人がどんな気持ちでいたかを\n見ていました。"}, {"t": 98.93333333333334, "x": "ここで数えていたのは回数ではなく時間です。"}, {"t": 102.08333333333333, "x": "険しい気持ちでいた時間が一秒あったとします。"}, {"t": 105.3, "x": "うまくいく夫婦では、穏やかな\n時間が五秒ほどありました。"}, {"t": 109.31666666666666, "x": "これが五対一という数字の中身です。"}, {"t": 111.9, "x": "ほめ言葉を五回、という話とは\nずいぶん違って見えます。"}, {"t": 115.9, "x": "ここが、いちばんの違いです。"}, {"t": 118.0, "x": "次に時間で数えるとどうなるかを考えます。"}, {"t": 121.08333333333333, "x": "喧嘩が三十分続いたとします。"}, {"t": 123.43333333333334, "x": "その中できつい言葉が出たのは数分だけでした。"}, {"t": 126.6, "x": "残りは、相手の話を聞いたり、\nうなずいたりしていた。"}, {"t": 130.75, "x": "この場合、穏やかな時間のほうがずっと長くなります。"}, {"t": 134.46666666666667, "x": "逆に、きつい言葉が少ない喧嘩もあります。"}, {"t": 137.68333333333334, "x": "それでも空気がずっと張りつめていたら。"}, {"t": 140.16666666666666, "x": "穏やかな時間はほとんど残っていません。"}, {"t": 142.86666666666667, "x": "時間で見ると、差ははっきりします。"}, {"t": 145.58333333333334, "x": "回数で数えるとこの違いは見えにくくなります。"}, {"t": 148.78333333333333, "x": "きつい一言のあとに、長い沈黙が続くこともあります。"}, {"t": 152.86666666666667, "x": "沈黙が冷たければ、\n険しい時間はもっと長くなります。"}, {"t": 156.91666666666666, "x": "研究所が見ていたのは言葉の数ではありません。"}, {"t": 160.16666666666666, "x": "二人がどんな気持ちでその場にいたかです。"}, {"t": 162.71666666666667, "x": "だからこそ言い争いの最中が大切になります。"}, {"t": 166.08333333333334, "x": "落ち着いた時に仲がいいのは、\nある意味で当たり前です。"}, {"t": 169.78333333333333, "x": "意見がぶつかった時こそ、二人の\n素の姿が出やすいのです。"}, {"t": 174.0, "x": "そのぶつかり合いの中で、穏やかさが\nどれだけ残っているか。"}, {"t": 177.98333333333332, "x": "そこに、仲が続くかどうかの手がかりがあるようです。"}, {"t": 181.58333333333334, "x": "ここで見落とされやすい点があります。"}, {"t": 183.95, "x": "研究所の文章では、肯定的な時間だけを\n数えていません。"}, {"t": 188.43333333333334, "x": "肯定的または中立的な時間と書かれています。"}, {"t": 191.83333333333334, "x": "中立的というのは、良くも悪くもない、\nふつうの状態です。"}, {"t": 196.35, "x": "相手の話を黙って聞いている。"}, {"t": 198.53333333333333, "x": "落ち着いた声で事実を確かめている。"}, {"t": 201.06666666666666, "x": "こうした時間も、穏やかなほうに数えられます。"}, {"t": 204.38333333333333, "x": "ほめ言葉がなくても、比は保てるのかもしれません。"}, {"t": 207.83333333333334, "x": "喧嘩の最中に無理にほめるとかえって不自然です。"}, {"t": 211.18333333333334, "x": "怒っている相手に、ほめ言葉は届きにくいでしょう。"}, {"t": 214.65, "x": "それよりも声を荒げずに話を聞くほうが自然です。"}, {"t": 218.13333333333333, "x": "相手の言いぶんを最後まで遮らずに聞く。"}, {"t": 221.01666666666668, "x": "ここは自分が悪かったと認める。"}, {"t": 223.3, "x": "そんな落ち着いたやり取りが、\n穏やかな時間を積み上げます。"}, {"t": 227.23333333333332, "x": "ほめる回数を増やそうと身構えなくてもいいのかも\nしれません。"}, {"t": 231.13333333333333, "x": "まずは、険しくならない時間を長くすることです。"}, {"t": 234.55, "x": "次は喧嘩をしていない時の話です。"}, {"t": 237.15, "x": "研究所の文章にはもう一つの数字が出てきます。"}, {"t": 240.65, "x": "対立の会話の外では、比はさらに高かったそうです。"}, {"t": 244.4, "x": "その数字は二十対一です。"}, {"t": 246.48333333333332, "x": "五対一の、四倍です。"}, {"t": 248.58333333333334, "x": "うまくいく夫婦は、ふだんが\nそれだけ穏やかなのでしょう。"}, {"t": 252.3, "x": "朝の挨拶や夕食の時のちょっとした会話。"}, {"t": 255.41666666666666, "x": "帰りが遅い日の気づかいの連絡。"}, {"t": 257.8666666666667, "x": "こうした小さなやり取りが、\n毎日の中にたくさんあります。"}, {"t": 261.8, "x": "その一つ一つが穏やかな時間を作っています。"}, {"t": 264.98333333333335, "x": "喧嘩の最中の五対一は、この土台の\n上にあるのでしょう。"}, {"t": 269.1166666666667, "x": "ふだんが穏やかなら、言い争っても\n戻る場所があります。"}, {"t": 272.93333333333334, "x": "逆に、ふだんから冷たい空気が\n続いていたら、どうでしょう。"}, {"t": 277.23333333333335, "x": "少しの言い争いでも一気に険しくなりやすいです。"}, {"t": 280.53333333333336, "x": "二十対一は目標ではありません。"}, {"t": 283.01666666666665, "x": "うまくいっている夫婦の姿です。"}, {"t": 285.15, "x": "毎日を数えて、二十回ためようという\n話ではありません。"}, {"t": 289.3833333333333, "x": "ふだんの空気そのものが、比を\n作っていると言えそうです。"}, {"t": 292.93333333333334, "x": "では、回数で数えるとどんなずれが\n出るのでしょうか。"}, {"t": 296.5, "x": "一つ目は、まとめて\n埋め合わせようとしてしまうことです。"}, {"t": 300.2, "x": "きつい言い方をした日の夜に急に優しくする。"}, {"t": 303.3, "x": "次の日にプレゼントを用意する。"}, {"t": 305.45, "x": "本人は五回分を取り返したつもりかもしれません。"}, {"t": 308.81666666666666, "x": "けれど相手には、あの一言が\nまだ残っていることがあります。"}, {"t": 312.81666666666666, "x": "二つ目は、いい行いを貯金のように\n扱ってしまうことです。"}, {"t": 317.0, "x": "これだけほめたのだから少しくらい言ってもいい。"}, {"t": 319.8666666666667, "x": "そんな考えが混ざると、ほめ言葉が\n言い訳の材料に変わります。"}, {"t": 324.4, "x": "相手もその空気を感じ取りやすいものです。"}, {"t": 327.26666666666665, "x": "三つ目は、気持ちのこもらない言葉が増えることです。"}, {"t": 330.85, "x": "回数を稼ごうとすると言葉が軽くなりがちです。"}, {"t": 334.15, "x": "研究所が見ていたのは、気持ちの\n状態が続いた時間でした。"}, {"t": 338.46666666666664, "x": "言葉を並べた数ではありません。"}, {"t": 340.68333333333334, "x": "ですから、帳尻合わせのように\n数えなくていいのでしょう。"}, {"t": 344.43333333333334, "x": "大切なのは、険しい時間を短くすることです。"}, {"t": 348.05, "x": "そして穏やかな時間を自然に増やすことです。"}, {"t": 351.03333333333336, "x": "数字は、二人の\n空気を見直す目安にするのがよさそうです。"}, {"t": 355.31666666666666, "x": "ここからは険しい時間の中身を見ていきます。"}, {"t": 358.3666666666667, "x": "研究所は、関係を傷つけやすい\n四つの習慣を挙げています。"}, {"t": 362.98333333333335, "x": "四人の騎士にたとえて呼ばれる、よく知られた\n四つです。"}, {"t": 366.6666666666667, "x": "一つ目は批判です。"}, {"t": 368.15, "x": "起きた出来事ではなく、相手の\n人柄を責める言い方です。"}, {"t": 372.06666666666666, "x": "いつもそうだという言葉が出やすいのが特徴です。"}, {"t": 375.23333333333335, "x": "二つ目は自己弁護です。"}, {"t": 376.9166666666667, "x": "責められた時に、自分は悪くないと\n言い返し続けることです。"}, {"t": 381.21666666666664, "x": "三つ目は軽蔑です。"}, {"t": 382.8333333333333, "x": "相手を見下すような言い方や、\n冷たい笑いのことです。"}, {"t": 386.76666666666665, "x": "四つ目は心を閉ざして黙り込むことです。"}, {"t": 389.5833333333333, "x": "話の途中で返事をやめ、\n壁のようになってしまいます。"}, {"t": 393.48333333333335, "x": "どれも喧嘩の最中に出やすいものです。"}, {"t": 396.0833333333333, "x": "一度出るとその場の空気が一気に険しくなります。"}, {"t": 399.31666666666666, "x": "研究所は、これらを険しいやり取りの\n例に挙げています。"}, {"t": 403.28333333333336, "x": "どれかが出れば、そのぶん穏やかな時間が要ります。"}, {"t": 406.6666666666667, "x": "そう考えると比の話とつながってきます。"}, {"t": 409.5, "x": "研究所は、四つの習慣のほかにも例を挙げています。"}, {"t": 413.53333333333336, "x": "どれも日常でつい起こりやすいものです。"}, {"t": 416.15, "x": "たとえば言い争いの最中に声を荒げること。"}, {"t": 419.43333333333334, "x": "最初の一言からきつい調子で切り出すこと。"}, {"t": 422.3833333333333, "x": "相手が話している時に聞いていないこと。"}, {"t": 425.0833333333333, "x": "やると言ったことをやらずにおくこと。"}, {"t": 427.3, "x": "大切な記念日や出来事を忘れてしまうこと。"}, {"t": 430.4, "x": "相手の気持ちをそれは違うと打ち消すこと。"}, {"t": 433.21666666666664, "x": "こうして並べると、特別なことではないと分かります。"}, {"t": 436.8833333333333, "x": "忙しい日なら、誰にでも起こりそうなことばかりです。"}, {"t": 440.48333333333335, "x": "気持ちがあふれた時の行動も例に挙がっています。"}, {"t": 443.76666666666665, "x": "休憩を取らずに、相手に気持ちを\nぶつけてしまうことです。"}, {"t": 447.76666666666665, "x": "研究所はそんな時は少し休むことを勧めています。"}, {"t": 451.46666666666664, "x": "頭に血がのぼったままだと、\n険しい時間が延びやすいからです。"}, {"t": 455.9, "x": "一度離れて落ち着いてから戻る。"}, {"t": 458.1166666666667, "x": "それだけで、言い争いの空気が\n変わることがあります。"}, {"t": 461.8333333333333, "x": "小さな険しさは、気づかないうちに積み重なります。"}, {"t": 465.4166666666667, "x": "険しいやり取りの例の中で、\n見逃されやすいものがあります。"}, {"t": 469.6333333333333, "x": "それは相手からの合図を断ることです。"}, {"t": 472.31666666666666, "x": "研究所が挙げる例の一つが、\n仲直りの試みを拒むことです。"}, {"t": 476.8666666666667, "x": "喧嘩の最中に、相手が少しだけ\n歩み寄る時があります。"}, {"t": 481.06666666666666, "x": "ごめん言い過ぎたと口にする。"}, {"t": 482.96666666666664, "x": "ちょっと笑って空気を変えようとする。"}, {"t": 485.3, "x": "お茶でも飲もうかと話を区切る。"}, {"t": 487.46666666666664, "x": "こうした一言は仲直りへの小さな合図です。"}, {"t": 490.5833333333333, "x": "受け取るかどうかは、こちら次第です。"}, {"t": 493.03333333333336, "x": "ところが腹が立っていると、\n合図を突き返してしまいます。"}, {"t": 496.98333333333335, "x": "今さら遅いと冷たく返す。"}, {"t": 499.01666666666665, "x": "笑いかけた相手を見ないふりをする。"}, {"t": 501.3, "x": "そうすると、穏やかな時間に\n戻る入口が閉じてしまいます。"}, {"t": 505.5, "x": "もう一つは、つながりを求める合図に\n応えないことです。"}, {"t": 509.3666666666667, "x": "ねえ見てと話しかけられた時に顔も上げない。"}, {"t": 512.3333333333334, "x": "画面を見たまま、返事だけする。"}, {"t": 514.6833333333333, "x": "小さなことですが、これも険しいほうに\n数えられています。"}, {"t": 518.55, "x": "反対に、合図に応えるだけで\n穏やかな時間は増えていきます。"}, {"t": 523.0, "x": "うまく仲直りできなくても、合図は受け取れます。"}, {"t": 526.3333333333334, "x": "ここでもう一つの資料を見てみます。"}, {"t": 528.6166666666667, "x": "2004年に、アメリカのワシントン大学が\n出した記事です。"}, {"t": 532.7333333333333, "x": "ゴットマンは、数学者たちと\n夫婦の会話を分析しました。"}, {"t": 536.85, "x": "研究室で録画した、何百組もの\n会話がもとになっています。"}, {"t": 541.3833333333333, "x": "脈拍なども、記録されていました。"}, {"t": 543.9833333333333, "x": "記事でも、五対一は魔法の比として\n紹介されています。"}, {"t": 547.9166666666666, "x": "この比を下回ると、結婚が危うくなることが\nあるそうです。"}, {"t": 552.1166666666667, "x": "記事の中には印象に残る一文があります。"}, {"t": 555.2, "x": "一緒に居続ける夫婦は、言い争いの\n最中でも笑っている。"}, {"t": 559.55, "x": "からかい合うこともある。"}, {"t": 561.0333333333333, "x": "愛情のしぐさも見せているそうです。"}, {"t": 563.35, "x": "喧嘩の中にも、遊びの空気が残っているのでしょう。"}, {"t": 566.9666666666667, "x": "これは研究所の言う穏やかな時間と重なります。"}, {"t": 570.2833333333333, "x": "意見はぶつかっていても、相手を\n敵だとは思っていない。"}, {"t": 574.05, "x": "その気持ちが、笑いや軽い冗談になって\n表れるのでしょう。"}, {"t": 578.1333333333333, "x": "記事には、こんな見方も出てきます。"}, {"t": 580.6833333333333, "x": "喧嘩の多くは、気持ちのつながりを\n作り損ねたものだそうです。"}, {"t": 584.9833333333333, "x": "大事なのは喧嘩の中身より、\nその最中の二人の様子です。"}, {"t": 589.3666666666667, "x": "声を荒げず相手を見下して笑わない。"}, {"t": 592.1166666666667, "x": "そのうえで冗談が出せる関係は、\n強いのかもしれません。"}, {"t": 596.1333333333333, "x": "では、穏やかな\n時間はどう増やせばいいのでしょうか。"}, {"t": 599.7, "x": "研究所はいくつかのやり方を勧めています。"}, {"t": 602.75, "x": "一つ目は、相手への感謝を毎日三つ伝えることです。"}, {"t": 606.75, "x": "大きなことでなくてかまいません。"}, {"t": 608.8, "x": "ごみを出してくれた、話を聞いてくれた、\nそれで足ります。"}, {"t": 612.7833333333333, "x": "二つ目は、愛情を、ふだんからこまめに\n見せることです。"}, {"t": 616.9166666666666, "x": "三つ目は相手の気持ちに寄り添うことです。"}, {"t": 619.6833333333333, "x": "そう感じるのは分かると受け止める。"}, {"t": 621.95, "x": "四つ目は一緒に楽しむ時間を持つことです。"}, {"t": 624.9, "x": "笑い合う時間も、その一つです。"}, {"t": 627.3666666666667, "x": "五つ目は話を聞く時の姿勢です。"}, {"t": 629.9166666666666, "x": "言い返すために聞くのではなく分かるために聞く。"}, {"t": 632.9166666666666, "x": "研究所の文章にはそう書かれています。"}, {"t": 635.7166666666667, "x": "相手を思っていると伝えることも挙がっています。"}, {"t": 638.7166666666667, "x": "相手のために、何かをしてあげることもその一つです。"}, {"t": 642.4, "x": "どれもほめ言葉を数えることとは違います。"}, {"t": 645.2333333333333, "x": "二人の空気をふだんから温めておく工夫です。"}, {"t": 648.3833333333333, "x": "ふだんが温かいと、喧嘩でも\n穏やかな時間が残りやすいです。"}, {"t": 652.7833333333333, "x": "二十対一と五対一は、こうして\nつながっているのでしょう。"}, {"t": 656.65, "x": "最後に気になる点を考えます。"}, {"t": 658.9, "x": "うちは五対一もない、と不安になった\n人もいるでしょう。"}, {"t": 662.6833333333333, "x": "研究所の文章ではこう書かれています。"}, {"t": 665.4333333333333, "x": "対立の中で五対一を下回ることは、\n離婚の可能性を示す指標の一つになった。"}, {"t": 671.4166666666666, "x": "ここで大事なのは、多くの指標の\n一つ、という書き方です。"}, {"t": 675.7, "x": "五対一でなければ必ず別れる、とは\n書かれていません。"}, {"t": 679.6166666666667, "x": "ここは、大事なところです。"}, {"t": 681.6333333333333, "x": "喧嘩の比だけで、二人の先が\n決まるわけではないのです。"}, {"t": 685.55, "x": "それに比は固定されたものではありません。"}, {"t": 688.1833333333333, "x": "声を荒げるのを一回やめれば、\n険しい時間は短くなります。"}, {"t": 692.7666666666667, "x": "仲直りの合図を一回受け取れば、\n穏やかな時間に戻れます。"}, {"t": 697.1333333333333, "x": "数字は二人を採点するためのものではありません。"}, {"t": 700.4333333333333, "x": "今の空気に気づくための手がかりの一つです。"}, {"t": 703.3666666666667, "x": "ストップウォッチで測る必要もありません。"}, {"t": 705.9666666666667, "x": "家計簿のように、つける必要もありません。"}, {"t": 709.1166666666667, "x": "喧嘩のあとで、今日はどれくらい\n穏やかでいられたか。"}, {"t": 712.6, "x": "そう振り返るだけでも、見えてくるものが\nあるはずです。"}, {"t": 716.1666666666666, "x": "五対一は、\n仲のいい夫婦の合格ラインではありません。"}, {"t": 720.1166666666667, "x": "険しい時間を、穏やかな時間で\n包んでいる二人の姿です。"}, {"t": 724.4833333333333, "x": "仲が続く夫婦の五対一は、ほめ言葉の\n回数ではありませんでした。"}, {"t": 729.3666666666667, "x": "研究所が見ていたのは、言い争いの\n最中の時間の比です。"}, {"t": 733.6833333333333, "x": "険しい時間が一秒なら、穏やかな\n時間がおよそ五秒あった。"}, {"t": 738.1166666666667, "x": "しかも穏やかな時間には、黙って聞く時間も\n含まれます。"}, {"t": 742.1, "x": "喧嘩の外では、その比は二十対一と\nさらに高くなります。"}, {"t": 746.2666666666667, "x": "五回ほめるという言い換えは覚えやすい言葉です。"}, {"t": 749.4666666666667, "x": "けれどもとの数字は二人の空気の話だったのです。"}, {"t": 752.8833333333333, "x": "ここからは架空の二人の一場面です。"}, {"t": 755.4833333333333, "x": "結婚して五年ほどのたくやとさきの話です。"}, {"t": 758.55, "x": "週末の夜、旅行の予定のことで\n言い争いになりました。"}, {"t": 762.75, "x": "たくやはつい強い口調になりかけました。"}, {"t": 765.4166666666666, "x": "そこで一度深く息をつきました。"}, {"t": 767.7166666666667, "x": "少し休憩しようと言って台所に立ちました。"}, {"t": 770.8, "x": "戻ってきた時二人分のお茶を用意していました。"}, {"t": 774.0, "x": "さきはちょっとだけ笑いました。"}, {"t": 775.9666666666667, "x": "ありがとう、と小さく言いました。"}, {"t": 778.4, "x": "話の続きはさっきよりずっと穏やかでした。"}, {"t": 781.3666666666667, "x": "旅行の予定はまだ決まっていません。"}, {"t": 783.7, "x": "それでもその夜、険しい時間は\nほとんど残りませんでした。"}, {"t": 787.9, "x": "あなたの家では、喧嘩の最中の\nどんな一言で空気がゆるみますか。"}, {"t": 792.5833333333334, "x": "よければコメントで教えてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
