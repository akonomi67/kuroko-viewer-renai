6666666667, "i": 248}, {"t": 716.6833333333333, "i": 249}, {"t": 719.2, "i": 250}, {"t": 722.25, "i": 251}, {"t": 724.0166666666667, "i": 252}, {"t": 726.6333333333333, "i": 253}, {"t": 731.4, "i": 254}, {"t": 734.4333333333333, "i": 255}, {"t": 737.3, "i": 256}, {"t": 741.0333333333333, "i": 257}, {"t": 744.1833333333333, "i": 258}, {"t": 746.7833333333333, "i": 259}, {"t": 750.0333333333333, "i": 260}, {"t": 752.7, "i": 261}, {"t": 755.5666666666667, "i": 262}, {"t": 758.8666666666667, "i": 263}, {"t": 762.35, "i": 264}, {"t": 764.8, "i": 265}, {"t": 768.2, "i": 266}, {"t": 771.9166666666666, "i": 267}, {"t": 774.7166666666667, "i": 268}, {"t": 777.9333333333333, "i": 269}, {"t": 781.65, "i": 270}, {"t": 784.15, "i": 271}, {"t": 787.2166666666667, "i": 272}, {"t": 790.6333333333333, "i": 273}, {"t": 793.2833333333333, "i": 274}, {"t": 801.2666666666667, "i": 274}], "subs": [{"t": 0.0, "x": "付き合っている相手が、\n友達の話に口を出し始める時があります。"}, {"t": 4.733333333333333, "x": "あの人とは、会わない方がいい。"}, {"t": 7.066666666666666, "x": "その集まりは、行かなくていいんじゃない。"}, {"t": 9.8, "x": "最初の一言は、たいてい優しい形で来ます。"}, {"t": 13.216666666666667, "x": "心配している、という顔で来ます。"}, {"t": 15.833333333333334, "x": "だから、断りにくいです。"}, {"t": 17.8, "x": "断ると、心配を拒んだように見えます。"}, {"t": 21.083333333333332, "x": "見えるので、こちらが折れます。"}, {"t": 23.25, "x": "折れた回数は、記録に残りません。"}, {"t": 25.883333333333333, "x": "残らないまま、会う人が少しずつ減ります。"}, {"t": 28.916666666666668, "x": "減ったことに気づくのは、ずいぶん後です。"}, {"t": 31.65, "x": "気づいた時には、相談できる人がいません。"}, {"t": 34.666666666666664, "x": "相談できないと、これが普通だと思い込みます。"}, {"t": 38.05, "x": "思い込むと、抜け出すのに時間がかかります。"}, {"t": 41.21666666666667, "x": "だから、早い段階で見ておく価値があります。"}, {"t": 44.333333333333336, "x": "男は行き先や相手を、確認したがりやすいです。"}, {"t": 47.93333333333333, "x": "女は連絡の頻度や、関係の近さを気にしやすいです。"}, {"t": 52.166666666666664, "x": "出方は違いますが、根は同じ場合があります。"}, {"t": 55.5, "x": "今日は、その根の部分を見ていきます。"}, {"t": 58.11666666666667, "x": "先に言うと、見るのは言葉ではありません。"}, {"t": 61.28333333333333, "x": "決める人が、誰になっているかです。"}, {"t": 63.733333333333334, "x": "まず、始まり方から見ます。"}, {"t": 65.95, "x": "最初から、命令の形で来ることは少ないです。"}, {"t": 69.45, "x": "たいていは、心配の言葉です。"}, {"t": 71.8, "x": "あの人、あなたを大事にしてないと思う。"}, {"t": 74.65, "x": "その集まり、疲れてるように見える。"}, {"t": 77.36666666666666, "x": "どれも、こちらを気づかう形になっています。"}, {"t": 80.4, "x": "気づかいの形なので、反論しにくいです。"}, {"t": 83.43333333333334, "x": "反論すると、こちらが冷たい人になります。"}, {"t": 86.58333333333333, "x": "だから、多くの人が一度は受け入れます。"}, {"t": 89.41666666666667, "x": "受け入れると、次も同じ形で来ます。"}, {"t": 92.41666666666667, "x": "男は理由をつけて、説明しようとしやすいです。"}, {"t": 96.1, "x": "女は感情の言葉で、伝えようとしやすいです。"}, {"t": 99.75, "x": "どちらも、心配として届きます。"}, {"t": 102.23333333333333, "x": "届くので、最初は問題になりません。"}, {"t": 105.15, "x": "問題になるのは、回数が増えた時です。"}, {"t": 108.2, "x": "増えても、形は変わりません。"}, {"t": 110.53333333333333, "x": "形が同じなので、変化に気づきにくいです。"}, {"t": 113.81666666666666, "x": "気づきにくいから、後で効いてきます。"}, {"t": 116.31666666666666, "x": "だから、内容ではなく回数を見ます。"}, {"t": 119.15, "x": "回数は、数えれば分かります。"}, {"t": 121.6, "x": "広がり方にも、順番があります。"}, {"t": 124.23333333333333, "x": "最初に名前が出るのは、たいてい一人です。"}, {"t": 127.23333333333333, "x": "一人だけなら、こちらも納得できます。"}, {"t": 129.91666666666666, "x": "確かに、少し合わないところはあった。"}, {"t": 132.73333333333332, "x": "そう思って、距離を置きます。"}, {"t": 134.9, "x": "置いた後、しばらくは何も起きません。"}, {"t": 137.68333333333334, "x": "けれども、また別の名前が出ます。"}, {"t": 140.2, "x": "今度は、もっともらしい理由が付きます。"}, {"t": 143.01666666666668, "x": "理由が付くので、また納得します。"}, {"t": 145.56666666666666, "x": "納得を重ねているうちに、範囲が広がります。"}, {"t": 149.01666666666668, "x": "広がった範囲は、後から見ないと分かりません。"}, {"t": 152.16666666666666, "x": "一人ずつ見ていると、いつも妥当に見えます。"}, {"t": 155.31666666666666, "x": "だから、数で見ます。"}, {"t": 157.0, "x": "半年前と比べて、会う人が減っていないか。"}, {"t": 160.25, "x": "減っているなら、理由を確かめます。"}, {"t": 162.86666666666667, "x": "自分で選んで減らしたのか。"}, {"t": 164.73333333333332, "x": "言われて減らしたのか。"}, {"t": 166.16666666666666, "x": "この違いは、大きいです。"}, {"t": 168.16666666666666, "x": "自分で選んだ分には、問題ありません。"}, {"t": 171.08333333333334, "x": "言われて減った分だけを、数えます。"}, {"t": 173.7, "x": "相手の側の事情も、見ておきます。"}, {"t": 176.38333333333333, "x": "口を出す人が、悪意で動いているとは限りません。"}, {"t": 179.85, "x": "多くの場合、不安が強いだけです。"}, {"t": 182.65, "x": "自分の見えない場所で、何かが起きる。"}, {"t": 185.51666666666668, "x": "その想像に、耐えられません。"}, {"t": 187.85, "x": "耐えられないので、見える範囲を広げます。"}, {"t": 190.85, "x": "広げると、一時的に安心します。"}, {"t": 193.68333333333334, "x": "安心するので、また広げたくなります。"}, {"t": 196.48333333333332, "x": "男は行動の範囲を、把握したがりやすいです。"}, {"t": 200.01666666666668, "x": "女は気持ちの向き先を、確かめたがりやすいです。"}, {"t": 203.65, "x": "どちらも、不安からの動きです。"}, {"t": 206.08333333333334, "x": "不安からの動きなので、責めても止まりません。"}, {"t": 209.38333333333333, "x": "責めると、不安が増えます。"}, {"t": 211.68333333333334, "x": "増えた不安は、さらに強い確認になります。"}, {"t": 214.96666666666667, "x": "そこで、悪い方に回ります。"}, {"t": 217.31666666666666, "x": "止めるには、安心の材料を別で渡します。"}, {"t": 220.61666666666667, "x": "帰る時間を先に言う。"}, {"t": 222.31666666666666, "x": "誰と行くかを普通に話す。"}, {"t": 224.25, "x": "隠さないだけで、確認は減ることがあります。"}, {"t": 227.48333333333332, "x": "減るなら、不安が原因だったと分かります。"}, {"t": 230.58333333333334, "x": "減らないなら、別の理由があります。"}, {"t": 233.2, "x": "ここが、いちばん大事な線です。"}, {"t": 235.53333333333333, "x": "心配と管理は、言葉では区別できません。"}, {"t": 238.71666666666667, "x": "どちらも、あなたのため、と言います。"}, {"t": 241.4, "x": "区別できるのは、決める人が誰かだけです。"}, {"t": 244.43333333333334, "x": "心配は、材料を渡して終わります。"}, {"t": 247.33333333333334, "x": "心配だ、とだけ言って、判断は任せます。"}, {"t": 250.83333333333334, "x": "管理は、結論まで持ってきます。"}, {"t": 253.28333333333333, "x": "行かないでほしい、で終わります。"}, {"t": 255.58333333333334, "x": "どちらの形が多いかを、見ます。"}, {"t": 258.0833333333333, "x": "男は結論の形で、言いやすいです。"}, {"t": 261.1166666666667, "x": "女は気持ちの形で、伝えやすいです。"}, {"t": 264.25, "x": "形は違っても、決めさせない点は同じです。"}, {"t": 267.6, "x": "決めるのが毎回相手なら、それは管理です。"}, {"t": 270.75, "x": "管理が続くと、こちらの判断力が鈍ります。"}, {"t": 274.1666666666667, "x": "鈍ると、自分で決めるのが怖くなります。"}, {"t": 277.28333333333336, "x": "怖くなった人は、さらに聞くようになります。"}, {"t": 280.3, "x": "聞くほど、相手が決めます。"}, {"t": 282.35, "x": "そこまで来ると、戻すのに時間がかかります。"}, {"t": 285.5, "x": "だから、早い時期に線を引きます。"}, {"t": 288.0, "x": "線は、こちらが決める、と決めることです。"}, {"t": 291.1666666666667, "x": "出方の違いも、知っておきます。"}, {"t": 293.6166666666667, "x": "男は物理的な場所に、反応しやすいです。"}, {"t": 296.98333333333335, "x": "どこに行くのか、誰と行くのか。"}, {"t": 299.4, "x": "帰りは何時か、泊まりはあるのか。"}, {"t": 302.0833333333333, "x": "女は関係の近さに、反応しやすいです。"}, {"t": 305.48333333333335, "x": "どのくらい仲がいいのか、二人で会うのか。"}, {"t": 308.51666666666665, "x": "昔、何かあったのか。"}, {"t": 310.5833333333333, "x": "どちらも、確かめたい気持ちからの質問です。"}, {"t": 313.76666666666665, "x": "質問なので、答えれば済むように見えます。"}, {"t": 316.8333333333333, "x": "けれども、答えるほど増える場合があります。"}, {"t": 319.85, "x": "増える場合は、確認が目的ではありません。"}, {"t": 323.06666666666666, "x": "不安そのものが、目的になっています。"}, {"t": 325.81666666666666, "x": "その時は、答えても終わりません。"}, {"t": 328.28333333333336, "x": "終わらないなら、答え方を変えます。"}, {"t": 330.85, "x": "毎回全部を、説明しなくて構いません。"}, {"t": 334.06666666666666, "x": "話せる範囲を、こちらで決めます。"}, {"t": 336.5833333333333, "x": "決めた範囲を、静かに守ります。"}, {"t": 339.2, "x": "守っていると、相手も慣れていきます。"}, {"t": 341.95, "x": "慣れれば、確認は落ち着くことがあります。"}, {"t": 344.85, "x": "落ち着かない時は、別の話になります。"}, {"t": 347.8333333333333, "x": "見ておくべき合図も、置いておきます。"}, {"t": 350.45, "x": "断った時に、どうなるかです。"}, {"t": 352.8, "x": "残念がるだけなら、問題ありません。"}, {"t": 355.5, "x": "機嫌が悪くなる形が続くなら、注意します。"}, {"t": 359.03333333333336, "x": "黙り込む、返事をしない、冷たくする。"}, {"t": 362.28333333333336, "x": "どれも、罰の形になっています。"}, {"t": 364.76666666666665, "x": "罰があると、次から断りにくくなります。"}, {"t": 368.05, "x": "断りにくくなると、自分で選べません。"}, {"t": 371.18333333333334, "x": "選べないのに、強制はされていません。"}, {"t": 374.03333333333336, "x": "形の上では、こちらが自分でやめています。"}, {"t": 377.21666666666664, "x": "だから、外からは見えません。"}, {"t": 379.3666666666667, "x": "本人にも、説明しにくいです。"}, {"t": 381.9, "x": "説明しにくいものが、いちばん長く続きます。"}, {"t": 385.28333333333336, "x": "続く前に、一度だけ言葉にします。"}, {"t": 388.1333333333333, "x": "断ったら不機嫌になるのが、つらい。"}, {"t": 390.85, "x": "そう伝えて、反応を見ます。"}, {"t": 393.0833333333333, "x": "悪かった、と返るなら、話せる相手です。"}, {"t": 396.3333333333333, "x": "そんなつもりはない、で終わるなら、繰り返します。"}, {"t": 399.98333333333335, "x": "繰り返す相手とは、同じ場面が何度も来ます。"}, {"t": 403.43333333333334, "x": "何度も来ることを、前提に考えます。"}, {"t": 406.55, "x": "減った後に、何が起きるかも見ます。"}, {"t": 409.26666666666665, "x": "友達が減ると、話す相手が一人になります。"}, {"t": 412.6666666666667, "x": "一人になると、比 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
