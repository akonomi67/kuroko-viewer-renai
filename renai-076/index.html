<script>
const D={"name": "デートの覚え方が逆_男は行き先を女は過ごし方を覚えている", "file": "076_デートの覚え方が逆_男は行き先を女は過ごし方を覚えている", "dur": 864.3333125, "segs": [], "subs": [{"t": 0.0, "x": "同じデートの話をしているのに、男と女で覚\nえている所が違うことがあります。"}, {"t": 5.65, "x": "男は、どこへ行ったかでデートを\n覚えていることが多いです。"}, {"t": 9.533333333333333, "x": "女は、どう過ごしたかでデートを\n覚えていることが多いと言われます。"}, {"t": 13.866666666666667, "x": "男は店の名前を覚えていたりします。"}, {"t": 16.516666666666666, "x": "乗った電車の順番まで出てくることもあります。"}, {"t": 19.483333333333334, "x": "女はその日の空気を覚えていたりします。"}, {"t": 22.3, "x": "交わした会話の中身まで出てくることもあります。"}, {"t": 25.333333333333332, "x": "男は行き先が良ければ、良い日だったと\n感じやすいです。"}, {"t": 29.233333333333334, "x": "女は過ごし方が良ければ良い日になりやすいです。"}, {"t": 32.483333333333334, "x": "行き先はどこでも構わないことがあります。"}, {"t": 35.25, "x": "この違いを知らないと、思い出話がか\nみ合わなくなります。"}, {"t": 39.21666666666667, "x": "あの店を覚えていないのかと、\n男は少しがっかりします。"}, {"t": 43.15, "x": "あの時の話を覚えていないのかと、\n女は寂しくなります。"}, {"t": 47.38333333333333, "x": "どちらも、相手との日を大事に\nしていないわけではありません。"}, {"t": 51.3, "x": "同じ日の思い出が、別々の棚に\nしまわれているだけです。"}, {"t": 55.28333333333333, "x": "付き合い始めの頃は、デートの\n回数が一番多い時期です。"}, {"t": 59.55, "x": "だからこそ、この違いが積もりやすいとも言えます。"}, {"t": 62.95, "x": "今日は、デートの覚え方を男女に分\nけて並べていきます。"}, {"t": 66.85, "x": "最後に、二人の記憶に同じように\n残る日の作り方も出します。"}, {"t": 71.41666666666667, "x": "付き合って少したった頃のことです。"}, {"t": 73.65, "x": "初めてのデートの話になることがあります。"}, {"t": 76.48333333333333, "x": "話し始めはどちらも楽しそうです。"}, {"t": 78.88333333333334, "x": "ところが、途中から話が少しずつずれていきます。"}, {"t": 82.35, "x": "男は、最初に入った店の名前から話し始めます。"}, {"t": 86.26666666666667, "x": "次にどこへ行ったか。"}, {"t": 87.7, "x": "何時ごろ帰ったか。"}, {"t": 89.15, "x": "順番に並べていきます。"}, {"t": 90.9, "x": "一方で女は、待ち合わせの時の相手の顔から\n話し始めます。"}, {"t": 95.55, "x": "緊張していた様子。"}, {"t": 97.1, "x": "最初に笑った場面。"}, {"t": 98.65, "x": "そういう所を思い出します。"}, {"t": 100.58333333333333, "x": "男は、その場面をあまり覚えていないことがあります。"}, {"t": 104.31666666666666, "x": "女は、店の名前や道順をあま\nり覚えていないことがあります。"}, {"t": 108.78333333333333, "x": "同じ一日なのに、取り出している所がまるで\n違います。"}, {"t": 112.7, "x": "ここで、相手が覚えていない\nことに引っかかりやすいです。"}, {"t": 116.38333333333334, "x": "大事な日なのに、なぜ覚えて\nいないのかと感じてしまいます。"}, {"t": 120.4, "x": "けれども、相手は別の所をしっかり覚えています。"}, {"t": 123.98333333333333, "x": "ずれているのは気持ちの大きさではありません。"}, {"t": 126.8, "x": "思い出のしまい方です。"}, {"t": 128.4, "x": "まずは、男の側のしまい方から見ていきます。"}, {"t": 131.66666666666666, "x": "男は、デートを場所の並びと\nして覚えやすいと言われます。"}, {"t": 135.7, "x": "駅の出口。"}, {"t": 136.75, "x": "曲がった角。"}, {"t": 137.7, "x": "入った店の看板。"}, {"t": 139.2, "x": "道順が頭に残っていると、その\n日を思い出しやすいようです。"}, {"t": 143.65, "x": "付き合い始めの男は行き先選びに\n時間をかけがちです。"}, {"t": 147.45, "x": "評判の店を調べる。"}, {"t": 149.08333333333334, "x": "混む時間を避ける。"}, {"t": 150.38333333333333, "x": "帰りの電車を確かめる。"}, {"t": 152.2, "x": "手間をかけた分だけ、場所が記憶に強く残ります。"}, {"t": 155.86666666666667, "x": "だから、男の思い出話には店や場所の名前が多\nく出てきます。"}, {"t": 160.4, "x": "あの店の窓際の席。"}, {"t": 162.23333333333332, "x": "あの公園の噴水の前。"}, {"t": 164.13333333333333, "x": "あの映画館の三列目。"}, {"t": 165.96666666666667, "x": "名前を覚えているのは、その\n日を大事にしていた印です。"}, {"t": 169.88333333333333, "x": "一方で、その場で何を話したかは\n薄れやすいことがあります。"}, {"t": 174.2, "x": "話の中身より、場所の方に目が向いていたからです。"}, {"t": 177.93333333333334, "x": "これは冷たいからではありません。"}, {"t": 180.06666666666666, "x": "上の空だったからでもありません。"}, {"t": 182.2, "x": "相手を楽しませる場所の用意に気持ちを\n使っていたのです。"}, {"t": 186.03333333333333, "x": "男にとっての良いデートは、\n行き先が当たった日になりやすいです。"}, {"t": 190.23333333333332, "x": "では、女の側は何を手がかりに\n覚えているのでしょうか。"}, {"t": 194.26666666666668, "x": "女は、デートを過ごし方の流\nれとして覚えやすいと言われます。"}, {"t": 198.65, "x": "相手が笑った場面。"}, {"t": 200.13333333333333, "x": "少し黙った間。"}, {"t": 201.46666666666667, "x": "帰り道に話したこと。"}, {"t": 203.23333333333332, "x": "場所よりも、その時の気持ちの\n動きが記憶に残りやすいようです。"}, {"t": 207.71666666666667, "x": "店の名前は忘れることがあります。"}, {"t": 210.1, "x": "そこで言われた一言は覚えています。"}, {"t": 212.6, "x": "料理の味も忘れることがあります。"}, {"t": 214.91666666666666, "x": "取り分けてくれた様子は覚えています。"}, {"t": 217.38333333333333, "x": "女にとっての良いデートは、\n一緒にいて楽だった日になりやすいです。"}, {"t": 221.8, "x": "だから、行き先が普通でも良\nい思い出として残ることがあります。"}, {"t": 226.06666666666666, "x": "近所の公園を歩いただけの日を、\n何年も覚えている人もいます。"}, {"t": 230.58333333333334, "x": "一方で、豪華な店でも気まずか\nった日は良い思い出になりにくいです。"}, {"t": 235.33 function mark(pane,i){

  const t=el.children[i]; if(!t) return; t.classList.add('on');

  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
