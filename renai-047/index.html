<style>

<script>
const D={"name": "断り方がうまい人は嫌われずに距離も縮める", "file": "047_断り方がうまい人は嫌われずに距離も縮める", "dur": 833.16665625, "segs": [], "subs": [{"t": 0.0, "x": "断って関係が終わる人と、\n断ったのに近づく人がいます。"}, {"t": 4.466666666666667, "x": "違いは、断り文句の上手さではないことが\n多いようです。"}, {"t": 8.45, "x": "断る場面は、相手から予定を渡された場面です。"}, {"t": 12.25, "x": "渡されたものを、どう返すかを見られています。"}, {"t": 15.383333333333333, "x": "返し方が雑だと、内容より先に扱いの方が残ります。"}, {"t": 19.9, "x": "逆に返し方が整っていれば、\n断られたこと自体は残りません。"}, {"t": 24.483333333333334, "x": "残るのは、また誘ってもよさそうだという感触です。"}, {"t": 28.166666666666668, "x": "この感触があるかどうかで、次の一回が決まります。"}, {"t": 32.0, "x": "そして、誘う側は次の一回をかなり慎重に\n決めています。"}, {"t": 36.333333333333336, "x": "一度目で扱いが軽かった相手に、\n二度目は出しにくいです。"}, {"t": 40.43333333333333, "x": "つまり断り方は、関係を切るための\n技術ではありません。"}, {"t": 44.56666666666667, "x": "次を残すための技術に近いところがあります。"}, {"t": 47.666666666666664, "x": "ここを知らないと、正直に断っているのに\n人が減っていきます。"}, {"t": 51.75, "x": "本人は嘘をついていないので、理由が分かりません。"}, {"t": 55.483333333333334, "x": "分からないまま、誘われる回数だけが静かに\n減ります。"}, {"t": 59.266666666666666, "x": "今日は、断った後に何を足せばいいのかを\n見ていきます。"}, {"t": 63.1, "x": "使う言葉は少なく、形もほとんど決まっています。"}, {"t": 66.78333333333333, "x": "覚えるのは、五つだけで足ります。"}, {"t": 69.16666666666667, "x": "まず、断ること自体を怖がりすぎている人が\n多いようです。"}, {"t": 73.33333333333333, "x": "断ったら嫌われる。"}, {"t": 74.8, "x": "脈が無いと思われる。"}, {"t": 76.31666666666666, "x": "次が来なくなる。"}, {"t": 77.55, "x": "そう考えて、行けない日に無理をして予定を\n入れます。"}, {"t": 81.2, "x": "無理をして出た日は、たいてい楽しくなりません。"}, {"t": 84.3, "x": "体調が悪いまま座っている時間は、\n相手にも伝わります。"}, {"t": 88.51666666666667, "x": "伝わった時間は、そのまま次の\n判断材料になることがあります。"}, {"t": 93.1, "x": "だから、断らずに出ることが得とは限りません。"}, {"t": 96.43333333333334, "x": "誘う側も、毎回通ると\n思って出しているわけではありません。"}, {"t": 100.63333333333334, "x": "予定が合わないことは、\n最初から想定の中にあります。"}, {"t": 104.51666666666667, "x": "想定の中にある出来事は、減点になりにくいです。"}, {"t": 108.23333333333333, "x": "減点になるのは、想定の外にある返し方の方です。"}, {"t": 112.23333333333333, "x": "返事が来ない。"}, {"t": 113.3, "x": "理由が分からない。"}, {"t": 114.61666666666666, "x": "次の話が出てこない。"}, {"t": 116.26666666666667, "x": "そういう時に、断られた以上のものを\n受け取ってしまいます。"}, {"t": 120.3, "x": "受け取ったものが、次を出すかどうかを\n決めてしまいます。"}, {"t": 123.86666666666666, "x": "つまり回数ではなく、\n形の方が効いているということです。"}, {"t": 128.01666666666668, "x": "形が整っていれば、三回続けて断っても\n関係は残ります。"}, {"t": 132.81666666666666, "x": "形が崩れていれば、一回で止まることもあります。"}, {"t": 136.48333333333332, "x": "怖がる場所を、少しだけ移してみてください。"}, {"t": 139.71666666666667, "x": "断る時、多くの人は理由を長くしがちです。"}, {"t": 143.23333333333332, "x": "その日は仕事が立て込んでいて、\n家の用事も入っていて。"}, {"t": 147.3, "x": "丁寧にしているつもりが、\n逆に重く届いてしまうかもしれません。"}, {"t": 151.7, "x": "理由が長いほど、断るための材料集めに\n見えるからです。"}, {"t": 155.9, "x": "かといって、理由が無さすぎるのも届きません。"}, {"t": 159.2, "x": "用事があるので、とだけ返すと、\n距離だけが伝わります。"}, {"t": 163.2, "x": "ちょうどいいのは、一つだけ具体的に出す形です。"}, {"t": 166.6, "x": "その日は実家に行く予定があります。"}, {"t": 169.03333333333333, "x": "これで足ります。"}, {"t": 170.08333333333334, "x": "具体的な予定が一つあると、\n作り話の心配が消えます。"}, {"t": 174.63333333333333, "x": "消えた分だけ、断られた側は次を\n考えやすくなるようです。"}, {"t": 179.11666666666667, "x": "理由は、相手を納得させるために\n出すものではありません。"}, {"t": 183.06666666666666, "x": "次の話をしやすくするための材料に近いです。"}, {"t": 186.4, "x": "材料なので、\n多いほど良いというわけでもありません。"}, {"t": 189.91666666666666, "x": "一つ出して、すぐ次の話に進む方が軽く収まります。"}, {"t": 194.13333333333333, "x": "もう一つ気をつけたいのが、理由の重さです。"}, {"t": 197.26666666666668, "x": "体調や家族の事情を毎回持ち出すと、\n相手は心配します。"}, {"t": 201.81666666666666, "x": "心配させた相手には、誘いにくくなるものです。"}, {"t": 205.26666666666668, "x": "軽い予定を一つ、が使いやすい形になります。"}, {"t": 208.78333333333333, "x": "断りの後に代案を出すかどうかは、迷うところです。"}, {"t": 212.56666666666666, "x": "気の無い相手に日付を出すと、\n期待させてしまいます。"}, {"t": 216.23333333333332, "x": "出さなければ、\nそのまま終わってしまうこともあります。"}, {"t": 219.63333333333333, "x": "分け方は、そこまで難しくありません。"}, {"t": 222.46666666666667, "x": "また会ってもいいと思うなら、日付を出します。"}, {"t": 225.53333333333333, "x": "会う気が無いなら、日付は\n出さずにお礼だけ返します。"}, {"t": 229.23333333333332, "x": "誘ってくれてありがとうございます、\nで終わりにします。"}, {"t": 232.81666666666666, "x": "この形は、はっきり伝わるのに角が立ちにくいです。"}, {"t": 236.51666666666668, "x": "中途半端に濁すと、相手は何度も\n出すことになりやすいです。"}, {"t": 240.8, "x": "何度も出させてから断る方が、負担は大きくなります。"}, {"t": 244.75, "x": "気が無い相手にこそ、\n形を揃えて返した方が親切です。"}, {"t": 249.11666666666667, "x": "逆に、会いたい相手に日付を出さないのは損です。"}, {"t": 252.66666666666666, "x": "断られたと受け取られて、そこで止まってしまいます。"}, {"t": 256.1333333333333, "x": "出す出さないを決めてから、文面を作ってください。"}, {"t": 259.6333333333333, "x": "順番が逆になると、文面が曖昧になります。"}, {"t": 263.35, "x": "曖昧な文面は、相手に読み取りを任せる形です。"}, {"t": 267.23333333333335, "x": "任された側は、たいてい悪い方に読んでしまいます。"}, {"t": 270.8333333333333, "x": "決めるのは自分の側、と思っておくと迷いません。"}, {"t": 274.25, "x": "会いたい相手を断る時の形は、ほぼ一つです。"}, {"t": 277.85, "x": "断りと同時に、次の日付を自分から出します。"}, {"t": 281.53333333333336, "x": "その日は行けませんが、\n来週の土曜なら空いています。"}, {"t": 285.21666666666664, "x": "この一行があるだけで、断りの意味が変わります。"}, {"t": 288.78333333333336, "x": "断られたのではなく、日付がずれただけになります。"}, {"t": 292.31666666666666, "x": "ここで気をつけたいのは、\n相手に決めさせないことです。"}, {"t": 295.85, "x": "いつなら空いていますか、と返すと、\nまた相手の手間になります。"}, {"t": 300.21666666666664, "x": "誘った側は、すでに一度、決める作業をしています。"}, {"t": 304.26666666666665, "x": "二度目も任せると、負担が片側に寄ります。"}, {"t": 307.6666666666667, "x": "寄った負担は、好意とは別のところで\n効いてくることがあります。"}, {"t": 311.8, "x": "だから、断った側が候補を出すのが軽い形です。"}, {"t": 315.48333333333335, "x": "候補は、二つくらいがちょうどいいようです。"}, {"t": 318.3833333333333, "x": "一つだと、通らなかった時にまた止まります。"}, {"t": 321.48333333333335, "x": "三つ以上だと、選ぶ作業に戻ってしまいます。"}, {"t": 324.9, "x": "二つ出して、どちらでも合わせます、\nと添えれば終わりです。"}, {"t": 328.8833333333333, "x": "日付が分からない時期でも、月だけは出せます。"}, {"t": 332.1666666666667, "x": "来月の後半なら動きやすいです、で十分に通ります。"}, {"t": 336.3, "x": "出せる粒度で出す、と決めておくと楽になります。"}, {"t": 339.56666666666666, "x": "予定がすぐ分からないことも、当然あります。"}, {"t": 342.7, "x": "その時にやりがちなのが、\n分かるまで返さないことです。"}, {"t": 346.3666666666667, "x": "既読のまま一日空くと、断りの返事より重く届きます。"}, {"t": 350.6166666666667, "x": "相手は、断る理由を考えているのだろうと想像します。"}, {"t": 354.71666666666664, "x": "想像の時間が長いほど、\n次を出す気持ちは下がりやすいです。"}, {"t": 359.18333333333334, "x": "だから、返す内容が無くても、\n時間だけは先に返します。"}, {"t": 363.7, "x": "水曜までに予定が分かるので、そこで連絡します。"}, {"t": 367.4, "x": "この一行は、返事ではありませんが、\n扱いの返事になります。"}, {"t": 372.06666666666666, "x": "そして、言った日付は必ず守ってください。"}, {"t": 375.3, "x": "守れなかった場合、断ること自体より強く残ります。"}, {"t": 379.23333333333335, "x": "返事の速さより、言った通りかどうかを\n見られています。"}, {"t": 383.03333333333336, "x": "考える時間を取ること自体は、悪く受け取られません。"}, {"t": 386.8333333333333, "x": "黙って取ると、悪く受け取られやすいというだけです。"}, {"t": 390.35, "x": "一行返すのに、十秒もかかりません。"}, {"t": 393.46666666666664, "x": "十秒を惜しんだことが、\n次の誘いを消すのはもったいないです。"}, {"t": 397.71666666666664, "x": "もし一日空けてしまった時は、\n遅れたことに一言触れます。"}, {"t": 401.95, "x": "返事が遅くなってすみません、と先に置けば戻せます。"}, {"t": 405.8333333333333, "x": "触れずに本題から入ると、\nなかったことにした形になります。"}, {"t": 410.1166666666667, "x": "また今度、という言葉は便利ですが、\n寿命があります。"}, {"t": 414.21666666666664, "x": "一度目は、社交の言葉として普通に通ります。"}, {"t": 417.6666666666667, "x": "二度目に同じ言葉が出ると、意味が変わり始めます。"}, {"t": 421.3666666666667, "x": "三度目になると、断りの\n定型句として受け取られます。"}, {"t": 425.26666666666665, "x": "そこから先は、何度使っても届きません。"}, {"t": 428.3333333333333, "x": "届かなくなる理由は、\n日付が一度も出ていないからです。"}, {"t": 432.2, "x": "日付が出ないまま繰り返されると、\n予定の話ではなくなります。"}, {"t": 436.71666666666664, "x": "だから、二度目からは必ず日付を混ぜてください。"}, {"t": 440.15, "x": "また今度の後ろに、来月なら\n動きやすいです、と足すだけです。"}, {"t": 444.81666666666666, "x": "一言足すだけで、言葉の寿命が延びます。"}, {"t": 447.8666666666667, "x": "延ばせないなら、はっきり断った方が相手は楽です。"}, {"t": 451.56666666666666, "x": "曖昧なまま残された側は、判断ができません。"}, {"t": 455.05, "x": "判断できない状態が続くと、\n関係の方が先に疲れてしまいます。"}, {"t": 460.0, "x": "疲れた相手は、静かに\n誘うのをやめてしまうことがあります。"}, {"t": 464.06666666666666, "x": "やめた理由は、こちらには伝わりません。"}, {"t": 466.95, "x": "使うなら日付とセットに、と決めておくと迷いません。"}, {"t": 470.51666666666665, "x": "逆に、はっきり断る時は、\nまた今度を付けない方が親切です。"}, {"t": 475.4, "x": "付けると、無い可能性を残すことになります。"}, {"t": 478.7, "x": "同じ断り方でも、受け取られ方には\n少し傾きがあります。"}, {"t": 483.03333333333336, "x": "男の側は、\n断りを結果として処理しやすいところがあります。"}, {"t": 487.3666666666667, "x": "断られた。"}, {"t": 488.3333333333333, "x": "つまり通らなかった。"}, {"t": 489.73333333333335, "x": "次は別の手を考える。"}, {"t": 491.5833333333333, "x": "そう進めるので、理由の細かさはあまり効きません。"}, {"t": 495.28333333333336, "x": "効いているのは、次があるかどうかの一点です。"}, {"t": 498.5, "x": "だから、男に断る時は、\n次の可否を先に出す方が伝わります。"}, {"t": 503.51666666666665, "x": "今回は行けませんが、また誘ってください。"}, {"t": 506.6, "x": "これで足ります。"}, {"t": 507.65, "x": "この一行が無いと、終了の\n合図として読まれやすいです。"}, 666666667, "x": "断った後の態度を、いつもと変えない。"}, {"t": 781.0, "x": "この五つだけで、断りはほとんど問題になりません。"}, {"t": 784.75, "x": "逆に、この五つが抜けると、\n内容が良くても止まります。"}, {"t": 789.0666666666667, "x": "止まった理由は、たいてい本人には伝わりません。"}, {"t": 792.4833333333333, "x": "伝わらないまま、誘いが来なくなるだけです。"}, {"t": 795.5333333333333, "x": "もちろん、ここまでの形が合わない相手もいます。"}, {"t": 798.9833333333333, "x": "その時は、相手の返し方に合わせて量を\n減らしてください。"}, {"t": 803.15, "x": "合わせられること自体が、\nいちばん強い技術になります。"}, {"t": 806.9333333333333, "x": "もし最近、誘われる回数が減ったと\n感じているなら、思い出してみてください。"}, {"t": 812.5666666666667, "x": "最後に断った時、次の日付を\n出したのはどちらでしょうか。"}, {"t": 816.9333333333333, "x": "出したのが相手ばかりだったなら、\nそこから変えられます。"}, {"t": 820.5, "x": "変えるのは気持ちではなく、一行の順番だけです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
