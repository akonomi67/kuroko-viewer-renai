<script>
const D={"name": "還暦を過ぎてから恋愛観がもう一度変わる", "file": "070_還暦を過ぎてから恋愛観がもう一度変わる", "dur": 1104.31665625, "segs": [], "subs": [{"t": 0.0, "x": "恋愛観は、若い頃に一度できあがると\n思われがちです。"}, {"t": 4.166666666666667, "x": "けれども、還暦を過ぎたあた\nりでもう一度変わることがあります。"}, {"t": 8.35, "x": "好きの中身が、先の約束から\n今日の居心地へ移っていくからです。"}, {"t": 12.866666666666667, "x": "男は、守る役目を降りた時に好\nきの形を探し直しやすいです。"}, {"t": 17.583333333333332, "x": "女は、世話の役目を降りた時に好きを\n自分にも向け始めやすいです。"}, {"t": 22.383333333333333, "x": "男は、今の相手に昔の姿を重ねて見やすいです。"}, {"t": 26.366666666666667, "x": "女は、今隣にいる相手の居心地で見やすいと\n言われます。"}, {"t": 30.5, "x": "同じ食卓にいても、見ている\n時間が少しずれていることがあります。"}, {"t": 35.0, "x": "このずれは、衰えでも冷めた印でもありません。"}, {"t": 38.333333333333336, "x": "長く生きてきた人だけが持てる、\n二度目の恋愛観の入口です。"}, {"t": 42.71666666666667, "x": "ただ、入口の場所が男女で違うので、\n気づかないまま過ぎやすいです。"}, {"t": 47.71666666666667, "x": "気づかないままだと、優しさが\n的を外れて届くことがあります。"}, {"t": 52.13333333333333, "x": "気づいていれば、若い頃よりずっと\n楽な形で近くにいられます。"}, {"t": 56.5, "x": "今日は、還暦の後に変わる恋愛観を男女に分\nけて並べます。"}, {"t": 60.85, "x": "連れ合いと暮らしている人の話だけではありません。"}, {"t": 63.95, "x": "一人になってから、新しい誰かと\n出会った人の話も入れます。"}, {"t": 68.11666666666666, "x": "年を重ねた恋を、若い頃の続\nきではなく別の季節として見ていきます。"}, {"t": 73.28333333333333, "x": "若い頃の恋愛観は、先の約束でで\nきていることが多いです。"}, {"t": 77.71666666666667, "x": "いつか一緒に住む。"}, {"t": 79.03333333333333, "x": "いつか家を持つ。"}, {"t": 80.28333333333333, "x": "いつか子どもを育てる。"}, {"t": 81.75, "x": "好きかどうかは、先の予定に乗\nれる相手かどうかで測られやすいです。"}, {"t": 86.28333333333333, "x": "子育ての時期には、恋愛観は\nいったん脇に置かれがちです。"}, {"t": 90.45, "x": "好きより先に、回すべき毎日が来るからです。"}, {"t": 93.85, "x": "そして還暦を過ぎた頃、脇に置\nいていたものがもう一度戻ってきます。"}, {"t": 98.65, "x": "戻ってきた時には、中身が少し変わっています。"}, {"t": 102.03333333333333, "x": "先の約束より、今日の過ごしやすさの\n方が大事になっていきます。"}, {"t": 106.61666666666666, "x": "男は、この変化を言葉にしな\nいまま受け入れやすいです。"}, {"t": 110.5, "x": "気づいたら、相手の隣が落ち着\nく場所になっている形です。"}, {"t": 114.46666666666667, "x": "一方で女は、変化をはっきり\n自覚することが多いようです。"}, {"t": 118.71666666666667, "x": "好きの意味が変わったと、ある日ふっと分かる形です。"}, {"t": 122.26666666666667, "x": "自覚の早さが違うので、片方だけが\n変わったように見えることがあります。"}, {"t": 127.2, "x": "けれども、変わっていないのでは\nなく言葉にしていないだけです。"}, {"t": 131.11666666666667, "x": "二度目の恋愛観は、二人とも\n同じ頃に始まっていることが多いです。"}, {"t": 135.93333333333334, "x": "始まり方の違いを、次から一つずつ見ていきます。"}, {"t": 139.71666666666667, "x": "男は長い間、好きを守る形で表\nしてきた人が多いです。"}, {"t": 144.43333333333334, "x": "働いて支えること。"}, {"t": 146.0, "x": "家を直すこと。"}, {"t": 147.21666666666667, "x": "重い荷物を持つこと。"}, {"t": 148.81666666666666, "x": "言葉にしなくても、役目を果\nたせば伝わると考えやすいです。"}, {"t": 153.18333333333334, "x": "還暦を過ぎると、その役目が少\nしずつ軽くなっていきます。"}, {"t": 157.5, "x": "役目が軽くなるのは、悪いことではありません。"}, {"t": 160.78333333333333, "x": "ただ、好きをどう表せばいいのかが\n急に分からなくなることがあります。"}, {"t": 165.51666666666668, "x": "手持ちの表し方が、役目とひと続きだったからです。"}, {"t": 169.23333333333332, "x": "だから、家の中の用事を急に増や\nそうとする人もいます。"}, {"t": 173.35, "x": "庭の手入れ。"}, {"t": 174.33333333333334, "x": "棚の取り付け。"}, {"t": 175.51666666666668, "x": "車での送り迎え。"}, {"t": 177.08333333333334, "x": "どれも、好きの表し方を探している途中の動きです。"}, {"t": 180.93333333333334, "x": "一方で女は、その動きを落ち着か\nないものとして見ることがあります。"}, {"t": 185.55, "x": "何かしていないと居られない人に見えるからです。"}, {"t": 188.48333333333332, "x": "けれども、中身は役目ではな\nく気持ちの置き場所を探しています。"}, {"t": 192.83333333333334, "x": "置き場所さえ見つかれば、動きは\n自然にゆっくりになっていきます。"}, {"t": 197.1, "x": "見つける手がかりは、たいて\nい一緒に過ごす時間の中にあります。"}, {"t": 201.25, "x": "その話の前に、女の側の変わり方を見ておきます。"}, {"t": 205.26666666666668, "x": "女は長い間、好きを世話の形で表\nしてきた人が多いです。"}, {"t": 210.06666666666666, "x": "食事の用意。"}, {"t": 211.25, "x": "家族の予定の管理。"}, {"t": 212.88333333333333, "x": "着る物の手入れ。"}, {"t": 214.08333333333334, "x": "自分のことは、いつも後回しの\n列に並べてきた人もいます。"}, {"t": 218.31666666666666, "x": "還暦を過ぎると、その列の先頭に自分が来\nることがあります。"}, {"t": 222.81666666666666, "x": "習い事を始める。"}, {"t": 224.21666666666667, "x": "友人と旅に出る。"}, {"t": 225.63333333333333, "x": "一人で映画を観に行く。"}, {"t": 227.28333333333333, "x": "これは、連れ合いから離れよ\nうとしているのではありません。"}, {"t": 231.0, "x": "長く人に向けてきた好きを、よ\nうやく自分にも分けているだけです。"}, {"t": 235.33333333333334, "x": "一方で男は、その動きを寂し\nさとして受け取りやすいです。"}, {"t": 239.6, "x": "自分が置いていかれたように\n感じることがあるようです。"}, {"t": 242.91666666666666, "x": "けれども、外で満たされた人\nほど家に戻る足取りが軽くなります。"}, {"t": 247.38333333333333, "x": "軽い足取りで帰ってくる相手は、\n前より話が多いことがあります。"}, {"t": 252.03333333333333, "x": "見てきたもの。"}, {"t": 253.01666666666668, "x": "会った人。"}, {"t": 253.93333333333334, "x": "食べた物。"}, {"t": 254.85, "x": "話が増えるのは、外の楽しさを\n分けたいという気持ちの表れです。"}, {"t": 259.46666666666664, "x": "聞き役に回れる人は、その楽\nしさの半分を受け取れます。"}, {"t": 263.55, "x": "男の探し直しと、女の向け直しは、\n同じ時期に起きやすいです。"}, {"t": 268.55, "x": "同じ時期に起きるので、互いの\n変化を読み違えやすいようです。"}, {"t": 272.93333333333334, "x": "還暦を過ぎると、時間の数え方が少\nし変わることがあります。"}, {"t": 277.51666666666665, "x": "あと何年ではなく、あと何回という数え方です。"}, {"t": 281.05, "x": "桜を見る回数。"}, {"t": 282.45, "x": "遠くへ旅に出る回数。"}, {"t": 284.23333333333335, "x": "季節の果物を食べる回数。"}, {"t": 286.3666666666667, "x": "数え方が変わると、先延ばしに\nしていたことが気になり始めます。"}, {"t": 290.8833333333333, "x": "男は、その気持ちを予定の形で表しやすいです。"}, {"t": 294.73333333333335, "x": "行きたかった場所に、今年の\nうちに連れて行こうとします。"}, {"t": 298.35, "x": "一方で女は、言葉の形で表しやすいと言われます。"}, {"t": 302.46666666666664, "x": "言いそびれていたお礼や、昔の\nことへの一言を伝えたくなります。"}, {"t": 307.06666666666666, "x": "予定で表す側と言葉で表す側では、\n急ぎ方が違って見えます。"}, {"t": 312.01666666666665, "x": "旅の話ばかりする人と、昔の話ばか\nりする人に分かれることがあります。"}, {"t": 317.28333333333336, "x": "けれども、どちらも同じ気持ちから出てきた動きです。"}, {"t": 320.8333333333333, "x": "これは焦りではありません。"}, {"t": 322.6166666666667, "x": "一回ずつを大事に使いたいと\nいう、落ち着いた気持ちです。"}, {"t": 326.51666666666665, "x": "旅の途中の宿で、言いそびれ\nていた言葉を言えることもあります。"}, {"t": 330.9166666666667, "x": "予定と言葉は、組み合わせると一番よく届くようです。"}, {"t": 334.76666666666665, "x": "次は、長く見てきた相手の姿の見え方です。"}, {"t": 338.23333333333335, "x": "長く一緒にいる相手の姿は、\n少しずつ変わっていきます。"}, {"t": 342.31666666666666, "x": "白髪が増える。"}, {"t": 343.55, "x": "眼鏡の度が上がる。"}, {"t": 344.8333333333333, "x": "歩く速さがゆっくりになる。"}, {"t": 346.73333333333335, "x": "男は、その姿に若い頃の相手を重ねて見やすいです。"}, {"t": 350.8833333333333, "x": "出会った頃の笑い方や、初め\nて出かけた日の服を思い出します。"}, {"t": 355.25, "x": "今の姿の奥に、昔の姿が透けて見えている形です。"}, {"t": 359.5, "x": "一方で女は、今の相手と過ご\nす居心地の方を見やすいようです。"}, {"t": 364.18333333333334, "x": "昔より話を聞いてくれるか。"}, {"t": 366.3666666666667, "x": "隣にいて疲れないか。"}, {"t": 368.0, "x": "見た目より、一緒にいる時の空気の方で相手を測\nります。"}, {"t": 372.1333333333333, "x": "ここで起きやすいのが、褒め言葉の行き違いです。"}, {"t": 375.3833333333333, "x": "男が昔はきれいだったと言うと、\n今を否定されたように聞こえます。"}, {"t": 380.1666666666667, "x": "男の側は、ずっと覚えていると\nいう意味で言っていることが多いです。"}, {"t": 384.6666666666667, "x": "女が最近優しくなったと言うと、\n昔を責められたように聞こえます。"}, {"t": 389.65, "x": "女の側は、今が好きだという\n意味で言っていることが多いです。"}, {"t": 393.76666666666665, "x": "どちらも褒めているのに、時間の向きが違うだけです。"}, {"t": 397.4, "x": "昔の話をするなら、今につな\nげて終えると伝わりやすいです。"}, {"t": 401.75, "x": "あの頃も今も、という一言を足\nすだけで届き方が変わります。"}, {"t": 405.93333333333334, "x": "体の変化は、若い頃には寂し\nいものとして語られがちです。"}, {"t": 410.35, "x": "けれども、還暦の後の恋では\n少し違う意味を持つことがあります。"}, {"t": 414.85, "x": "歩く速さ。"}, {"t": 415.8833333333333, "x": "階段の上り方。"}, {"t": 417.3333333333333, "x": "一度に食べる量。"}, {"t": 418.6, "x": "変化が出てくると、二人で速\nさを合わせる場面が増えます。"}, {"t": 422.76666666666665, "x": "男は、速さを合わせることを我慢だと思いやすいです。"}, {"t": 426.6166666666667, "x": "先に行って待つ方が、相手の\nためになると考えることがあります。"}, {"t": 430.95, "x": "一方で女は、同じ速さで隣を歩\nいてもらうことを喜びやすいです。"}, {"t": 436.05, "x": "先で待たれるより、横に並んでも\nらう方が嬉しいようです。"}, {"t": 440.18333333333334, "x": "先で待つのも横に並ぶのも、どちらも優しさです。"}, {"t": 443.81666666666666, "x": "ただ、並んで歩く時間には会話が生まれます。"}, {"t": 447.23333333333335, "x": "道端の花。"}, {"t": 448.3833333333333, "x": "新しくできた店。"}, {"t": 449.8333333333333, "x": "夕方の空の色。"}, {"t": 451.25, "x": "ゆっくり歩くほど、目に入るものが増えていきます。"}, {"t": 454.76666666666665, "x": "速さを落とすことは、失うことでは\nなく拾えるものが増えることです。"}, {"t": 459.25, "x": "若い頃に素通りしていた景色を、\n二人で見直す時間になります。"}, {"t": 463.78333333333336, "x": "速さを合わせられる相手がいること\n自体が、この年代の贅沢です。"}, {"t": 468.28333333333336, "x": "その贅沢は、手のつなぎ方にもよく出てきます。"}, {"t": 471.68333333333334, "x": "手をつなぐ理由は、年齢によって変わっていきます。"}, {"t": 475.3, "x": "若い頃は、好きだという印と\nしてつないでいた人が多いです。"}, {"t": 479.45, "x": "還暦を過ぎると、段差や人混\nみで支える意味が加わります。"}, {"t": 483.9166666666667, "x": "男は、支える理由がある方が手をつなぎやすいです。"}, {"t": 487.75, "x": "理由の無いまま手を出すのは、\n照れくさく感じることがあります。"}, {"t": 491.78333333333336, "x": "だから、階段や坂道の時だけ\n手を出すことが多いようです。"}, {"t": 495.8666666666667, "x": "一方で女は、支えの理由があ\nってもなくても嬉しい場合があります。"}, {"t": 500.75, "x": "理由があって差し出された手だと\n分かっていても、温かさは同じです。"}, {"t": 505.2, "x": "ところが、段差を過ぎたらす\nぐ手を離すことがあります。"}, {"t": 508.81666666666666, "x": "男の側は、もう支えは要らないと思って離しています。"}, {"t": 512.7, "x": "女の側は、少しだけ名残惜し\nく感じていることがあります。"}, {"t": 516.9, "x": "離すのも離さないのも、どち\nらも悪いことではありません。"}, {"t": 520.7166666666667, "x": "ただ、平らな道でも少しつな\nいだままにすると意味が変わります。"}, {"t": 524.9833333333333, "x": "支えから、ただ隣にいる印に戻るからです。"}, {"t": 528.3333333333334, "x": "若い頃のつなぎ方が、形を変\nえて戻ってくる瞬間です。"}, {"t": 532.5333333333333, "x": "理由がなくても差し出せる手は、\n二度目の恋愛観の分かりやすい印です。"}, {"t": 537.4, "x": "この年代になると、相手の体を気にか\nける場面が増えます。"}, {"t": 541.65, "x": "薬を飲んだか。"}, {"t": 542.85, "x": "よく眠れたか。"}, {"t": 543.9666666666667, "x": "寒くないか。"}, {"t": 544.95, "x": "若い頃なら、世話を焼かれて\nいるように聞こえた言葉です。"}, {"t": 548.9, "x": "それが還暦の後では、愛情の言葉と\nして届くことがあります。"}, {"t": 553.25, "x": "男は、気にかける気持ちを行動で表しやすいです。"}, {"t": 557.0166666666667, "x": "病院への送り迎え。"}, {"t": 558.7333333333333, "x": "重い買い物の持ち帰り。"}, {"t": 560.5, "x": "部屋の暖房の調整。"}, {"t": 562.2166666666667, "x": "言葉は少なくても、動くことで気にかけている形です。"}, {"t": 566.0166666666667, "x": "一方で女は、気にかける気持ちを\n言葉で表しやすいと言われます。"}, {"t": 570.7333333333333, "x": "顔色を見て声をかける。"}, {"t": 572.4833333333333, "x": "食欲を聞く。"}, {"t": 573.65, "x": "帰りが遅いと連絡を入れる。"}, {"t": 575.7333333333333, "x": "ここで起きやすいのが、口う\nるさいという受け取り方です。"}, {"t": 579.4166666666666, "x": "何度も聞かれると、弱ったと\n思われているように感じる人もいます。"}, {"t": 584.1, "x": "けれども、聞いている側は弱ったとは思っていません。"}, {"t": 587.6833333333333, "x": "元気でいてほしいという気持ちが、\n言葉になっているだけです。"}, {"t": 591.55, "x": "言われる側がありがとうで受けると、\n聞く側の言い方も柔らかくなります。"}, {"t": 596.4333333333333, "x": "気にかけ合う言葉は、この年代の恋文のよ\nうなものかもしれません。"}, {"t": 600.9833333333333, "x": "次は、同じ話が何度も出てくる理由です。"}, {"t": 604.2666666666667, "x": "長く一緒にいると、同じ思い出話が何度も出\nてくることがあります。"}, {"t": 609.0666666666667, "x": "新婚の頃の旅行。"}, {"t": 610.65, "x": "子どもが小さかった頃の騒ぎ。"}, {"t": 612.8666666666667, "x": "初めて買った車。"}, {"t": 614.2666666666667, "x": "聞く側は、またその話かと感じることもあるでしょう。"}, {"t": 617.9833333333333, "x": "けれども、同じ話をするのには\n理由があることが多いです。"}, {"t": 622.0833333333334, "x": "男は、思い出話を二人の歩みの\n確認として語りやすいです。"}, {"t": 626.7166666666667, "x": "一緒に乗り越えたことを、並\nべ直して確かめている形です。"}, {"t": 630.9666666666667, "x": "一方で女は、思い出の細かいところまで\n覚えている場合があります。"}, {"t": 635.8, "x": "その日の天気。"}, {"t": 636.9666666666667, "x": "着ていた服。"}, {"t": 637.9666666666667, "x": "誰が何を言ったか。"}, {"t": 639.4166666666666, "x": "男の話に女が細部を足すと、\n話が急に色づいてきます。"}, {"t": 643.9833333333333, "x": "逆に、細部の食い違いで言い合\nいになることもあります。"}, {"t": 647.9166666666666, "x": "雨だったか晴れていたかで、\n話が止まってしまう形です。"}, {"t": 651.8333333333334, "x": "ここで正しさを決める必要はありません。"}, {"t": 654.55, "x": "思い出話は、正確さより一緒に思\nい出す時間の方に意味があります。"}, {"t": 659.6333333333333, "x": "同じ話を繰り返せるのは、同\nじ記憶を持つ相手がいるからです。"}, {"t": 664.2166666666667, "x": "それは、長く連れ添った二人にしか\n作れない財産のようなものです。"}, {"t": 668.7833333333333, "x": "話の最後に、また行こうかと\n足せると次の思い出につながります。"}, {"t": 673.2333333333333, "x": "この年代になると、いつか一人に\nなる日のことが頭をよぎります。"}, {"t": 677.7333333333333, "x": "口に出すと縁起が悪い気がして、\n黙っている人も多いようです。"}, {"t": 682.0333333333333, "x": "男は、その日のことを考えないようにしやすいです。"}, {"t": 685.6833333333333, "x": "考えても仕方がないことだと、\n胸の奥にしまっておく形です。"}, {"t": 690.2166666666667, "x": "一方で女は、その日のことを\n少しずつ準備しやすいと言われます。"}, {"t": 694.9, "x": "通帳の置き場所。"}, {"t": 696.3166666666667, "x": "親戚の連絡先。"}, {"t": 697.9166666666666, "x": "困った時に頼る先。"}, {"t": 699.6333333333333, "x": "準備の話を持ち出すと、男には\n縁起でもない話に聞こえることがあります。"}, {"t": 704.9, "x": "女の側は、怖いから話してい\nるのではない場合が多いです。"}, {"t": 709.15, "x": "残された方が困らないように、と\nいう優しさから出ています。"}, {"t": 713.3166666666667, "x": "逆に、男が黙っているのも冷\nたいからではありません。"}, {"t": 717.1166666666667, "x": "考えるだけで寂しくなるので、\n言葉にできないことが多いようです。"}, {"t": 721.6, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 724.8166666666667, "x": "話す時は、一度に全部決めよ\nうとしない方が続きやすいです。"}, {"t": 729.1666666666666, "x": "今日は通帳の置き場所だけ。"}, {"t": 731.2, "x": "次は連絡先だけ。"}, {"t": 732.8166666666667, "x": "小さく分けると、重い話が生活の話に変わります。"}, {"t": 736.9666666666667, "x": "心配ごとを一つ下ろすと、目の前の時間に気持\nちが向きやすくなります。"}, {"t": 741.95, "x": "還暦の後の恋愛は、連れ合いとの\n話だけではありません。"}, {"t": 746.0833333333334, "x": "死別や離別を経て、一人の時間が長\nくなった人もいます。"}, {"t": 750.2, "x": "そういう人が、新しい誰かと\n出会うことも珍しくないようです。"}, {"t": 754.4666666666667, "x": "趣味の教室。"}, {"t": 755.65, "x": "地域の集まり。"}, {"t": 756.9, "x": "昔の同級生との再会。"}, {"t": 759.0333333333333, "x": "男は、新しい相手と一緒に暮\nらすことを望みやすいです。"}, {"t": 763.1166666666667, "x": "毎日同じ家にいることが、関係の形と\nして分かりやすいからです。"}, {"t": 767.9, "x": "一方で女は、別々に暮らして\n行き来する形を望みやすいと言われます。"}, {"t": 773.1166666666667, "x": "自分の家と暮らしのリズムを、\n手放したくない人が多いようです。"}, {"t": 777.4666666666667, "x": "ここで、一緒に住みたい側は本気では\nないのかと感じることがあります。"}, {"t": 782.3833333333333, "x": "行き来したい側は、自由を取\nり上げられるように感じることがあります。"}, {"t": 786.9166666666666, "x": "けれども、どちらも相手を大事に思\nう気持ちは同じです。"}, {"t": 790.8166666666667, "x": "一緒に住むことも通うことも、どちらも恋の形です。"}, {"t": 794.6, "x": "若い頃のように、一つの決ま\nった形に揃える必要はありません。"}, {"t": 799.2166666666667, "x": "週に何日会うか。"}, {"t": 800.7166666666667, "x": "どこで過ごすか。"}, {"t": 801.8333333333334, "x": "二人で決めていい自由があります。"}, {"t": 804.05, "x": "決まった形が無いことこそ、\nこの年代の恋の良さかもしれません。"}, {"t": 808.4833333333333, "x": "その自由の前に立ちはだかりやすいのが、\n家族の目です。"}, {"t": 812.3166666666667, "x": "新しい恋をする時、多くの人が気にするのが\n家族の目です。"}, {"t": 816.6, "x": "子どもにどう思われるか。"}, {"t": 818.2333333333333, "x": "孫にどう話すか。"}, {"t": 819.5666666666667, "x": "親戚に何と言われるか。"}, {"t": 821.4, "x": "男は、家族の反対を正面から\n説得しようとしやすいです。"}, {"t": 825.8333333333334, "x": "筋道を立てて話せば、分かっ\nてもらえると考える形です。"}, {"t": 830.1166666666667, "x": "一方で女は、家族の気持ちを\n先に考えて身を引きやすいと言われます。"}, {"t": 835.25, "x": "波風を立てるくらいなら、自分が我慢\nすればいいと考えることがあります。"}, {"t": 840.2, "x": "どちらのやり方も、家族を大事にしている表れです。"}, {"t": 843.9666666666667, "x": "ただ、説得を急ぐと家族が構\nえてしまうことがあります。"}, {"t": 848.0666666666667, "x": "身を引きすぎると、後から自分の気持ちに\n気づいて苦しくなることがあります。"}, {"t": 853.0166666666667, "x": "家族が気にしているのは、恋\nそのものより暮らしの変化の方が多いです。"}, {"t": 857.8, "x": "住む場所。"}, {"t": 858.6166666666667, "x": "お金のこと。"}, {"t": 859.6666666666666, "x": "これまでの家族の思い出。"}, {"t": 861.4666666666667, "x": "心配の中身を一つずつ聞くと、反対では\nなく不安だったと分かることがあります。"}, {"t": 867.0, "x": "恋をすることに、年齢の締め切りはありません。"}, {"t": 870.35, "x": "照れくさくても、大切な人がで\nきたと伝える価値はあります。"}, {"t": 874.5, "x": "伝え方を急がないことが、家族にと\nっても一番の安心になります。"}, {"t": 879.1666666666666, "x": "まずは食事に一度招いて、顔を合\nわせるところから始め ものになっていきます。"}, {"t": 1017.7, "x": "若い頃の燃えるような恋とは違い、毎朝とも\nし直す小さな明かりのようなものです。"}, {"t": 1023.4833333333333, "x": "還暦を過ぎてからの恋愛観は、\n若い頃の続きではありません。"}, {"t": 1028.0333333333333, "x": "先の約束でできていた恋が、\n今日の居心地でできた恋に変わっていきます。"}, {"t": 1032.9666666666667, "x": "男は、守る役目を降りて好きの\n形を探し直しやすいです。"}, {"t": 1037.3166666666666, "x": "女は、世話の役目を降りて好きを\n自分にも向け直しやすいです。"}, {"t": 1041.75, "x": "変わる場所が違うだけで、どちらも\n二度目の恋を始めています。"}, {"t": 1046.0, "x": "この変化に気づかないままだと、\n少しずつすれ違いが増えていきます。"}, {"t": 1050.7666666666667, "x": "まず、相手の新しい動きを寂しさや\n落ち着きのなさと読み違えます。"}, {"t": 1055.7, "x": "次に、褒め言葉や気づかいが\n的を外れて届くようになります。"}, {"t": 1059.9666666666667, "x": "やがて、同じ家にいても別々の時間を過\nごすのが当たり前になります。"}, {"t": 1064.8166666666666, "x": "気づいていれば、同じ変化が二人を近\nづける材料になります。"}, {"t": 1069.1333333333334, "x": "並んで歩く速さ。"}, {"t": 1070.5666666666666, "x": "平らな道でもつないだままの手。"}, {"t": 1072.75, "x": "何でもない朝のありがとう。"}, {"t": 1074.65, "x": "どれも、若い頃には無かった形の恋の印です。"}, {"t": 1078.3, "x": "衰えではなく、重ねてきた時間が形を変\nえただけなのかもしれません。"}, {"t": 1083.1166666666666, "x": "最後に一つだけ思い出してみてください。"}, {"t": 1085.7666666666667, "x": "最近、隣にいる人の手を理由\nなく握ったのはいつだったでしょうか。"}, {"t": 1090.45, "x": "今日の帰り道に、少しだけ速さを\n合わせてみるのもいいかもしれません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
