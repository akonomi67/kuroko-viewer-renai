<script>
const D={"name": "沈黙の感じ方が逆_二人きりで話が途切れた時男は安心し女は不安になる", "file": "119_沈黙の感じ方が逆_二人きりで話が途切れた時男は安心し女は不安になる", "dur": 758.5833125, "segs": [], "subs": [{"t": 0.0, "x": "2人きりでいて、ふっと話が途切れる。"}, {"t": 2.9166666666666665, "x": "けんかをしたわけではありません。"}, {"t": 4.933333333333334, "x": "機嫌が悪いわけでもありません。"}, {"t": 7.016666666666667, "x": "話題がひと区切りして2人とも黙っているだけです。"}, {"t": 10.183333333333334, "x": "このありふれた時間の感じ方が、\n男女で逆になりやすいです。"}, {"t": 14.5, "x": "男は話が途切れると、ほっとしやすいです。"}, {"t": 17.75, "x": "話さなくても平気な相手になれたと感じるからです。"}, {"t": 21.15, "x": "女は話が途切れると、少し不安になりやすいです。"}, {"t": 25.15, "x": "つまらないと思われていないかが気になるからです。"}, {"t": 28.1, "x": "車の中でも食卓でも、これは起きています。"}, {"t": 31.383333333333333, "x": "片方は休んでいます。"}, {"t": 33.083333333333336, "x": "もう片方は気をもんでいます。"}, {"t": 35.1, "x": "しかもその差はほとんど表に出ません。"}, {"t": 37.61666666666667, "x": "静かなまま、気持ちだけが別々の向きに進みます。"}, {"t": 41.25, "x": "今回はけんかの時の沈黙の話ではありません。"}, {"t": 44.7, "x": "仲がいい時に訪れる静けさの話です。"}, {"t": 47.68333333333333, "x": "同じ静けさがなぜ逆に感じられるのか。"}, {"t": 50.516666666666666, "x": "場面ごとに見ていきます。"}, {"t": 52.2, "x": "男は気をつかう相手ほどよく話そうとしやすいです。"}, {"t": 55.65, "x": "付き合い始めのころを思い出すと分かりやすいです。"}, {"t": 58.78333333333333, "x": "話題を前もって考えておく。"}, {"t": 60.916666666666664, "x": "黙る時間が出ないように質問を重ねる。"}, {"t": 63.71666666666667, "x": "会話を途切れさせないことに力を使っています。"}, {"t": 66.93333333333334, "x": "楽しませなければと思っているのです。"}, {"t": 69.35, "x": "ところが関係に慣れると、その力をゆるめ始めます。"}, {"t": 73.3, "x": "黙っていても相手は離れないと分かるからです。"}, {"t": 76.23333333333333, "x": "男にとってこれは大きな変化です。"}, {"t": 78.63333333333334, "x": "仕事でも友人の前でも、話す役を\n引き受ける人がいます。"}, {"t": 82.95, "x": "そういう人ほど、黙っていられる相手を\n特別に感じます。"}, {"t": 87.08333333333333, "x": "だから男の静けさは、手を抜いた合図とは\n限りません。"}, {"t": 90.93333333333334, "x": "ここでは構えなくていいという安心の表れです。"}, {"t": 94.18333333333334, "x": "本人の中では関係が1段深くなった感覚さえあります。"}, {"t": 98.31666666666666, "x": "ただ、その感覚を言葉にすることはまれです。"}, {"t": 101.53333333333333, "x": "安心している時ほど、口に出す必要を\n感じないからです。"}, {"t": 105.66666666666667, "x": "男の中では静けさはもう答えになっています。"}, {"t": 108.85, "x": "答えになっているので、説明しようと\n思わないのです。"}, {"t": 112.7, "x": "一方で女は、会話の量を2人の目安にしやすいです。"}, {"t": 116.83333333333333, "x": "前はもっと話していた。"}, {"t": 118.51666666666667, "x": "前は質問をしてくれた。"}, {"t": 120.28333333333333, "x": "そんな比べ方を知らないうちにしています。"}, {"t": 122.98333333333333, "x": "女にとって会話は気持ちを行き来させる道です。"}, {"t": 126.25, "x": "その道が静かになると、行き来が\n止まったように感じます。"}, {"t": 130.21666666666667, "x": "だから話が途切れると、まず理由を探し始めます。"}, {"t": 134.1, "x": "疲れているのか。"}, {"t": 135.31666666666666, "x": "退屈なのか。"}, {"t": 136.43333333333334, "x": "自分に飽きてきたのか。"}, {"t": 138.01666666666668, "x": "考えるほど答えは遠のきます。"}, {"t": 140.26666666666668, "x": "答えがないまま、気持ちだけが落ち着かなくなります。"}, {"t": 143.65, "x": "ここで大事なのは、会話好きだから\n不安なのではない点です。"}, {"t": 147.75, "x": "静けさの意味が、まだ決まっていないから\n不安なのです。"}, {"t": 151.36666666666667, "x": "男にとっては安心の印でも、\nそれは男の中だけの意味です。"}, {"t": 155.81666666666666, "x": "女から見ると同じ静けさに印は付いていません。"}, {"t": 159.28333333333333, "x": "印のない静けさは自分で読むしかありません。"}, {"t": 162.35, "x": "そして不安な時ほど読み方は厳しくなりがちです。"}, {"t": 165.71666666666667, "x": "ただ、いつも男が安心というわけではありません。"}, {"t": 169.3, "x": "付き合う前のデートでは、立場が\n入れ替わりやすいです。"}, {"t": 172.9, "x": "距離をはかっている時期は、\n男のほうが静けさを怖がります。"}, {"t": 177.03333333333333, "x": "話が止まると、失敗したのかと焦ってしまう。"}, {"t": 180.58333333333334, "x": "次の話題を探して頭の中が忙しくなります。"}, {"t": 184.03333333333333, "x": "目の前の相手を見る余裕もありません。"}, {"t": 186.6, "x": "一方で女は、この時期は相手を静かに見ています。"}, {"t": 190.43333333333334, "x": "黙った時の様子から、どんな人かを\n確かめているのです。"}, {"t": 194.36666666666667, "x": "つまり静けさの感じ方は、性別だけでは\n決まりません。"}, {"t": 198.31666666666666, "x": "関係の段階によって落ち着く人が変わります。"}, {"t": 201.5, "x": "男は、関係が決まったころから\n静けさに慣れやすいです。"}, {"t": 205.48333333333332, "x": "女は関係が決まったあとも、\n会話で確かめたくなります。"}, {"t": 209.6, "x": "このずれは付き合って数か月で表に出てきます。"}, {"t": 212.8, "x": "最初はよく話してくれたのに。"}, {"t": 214.86666666666667, "x": "そんな気持ちはここから生まれます。"}, {"t": 217.03333333333333, "x": "男が冷めたのではありません。"}, {"t": 219.05, "x": "安心できる場所が変わっただけのことが多いのです。"}, {"t": 222.25, "x": "2人きりの静けさは車の中でよく起きます。"}, {"t": 225.4, "x": "運転している男は前を見て体を動かしています。"}, {"t": 228.91666666666666, "x": "やることがあるので、黙っていても\n気まずくありません。"}, {"t": 232.5, "x": "横に並んで同じ景色 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
