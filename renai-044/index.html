<script>
const D={"name": "傷つく場所が違う_男女で一番こたえる一言", "file": "044_傷つく場所が違う_男女で一番こたえる一言", "dur": 801.0, "segs": [], "subs": [{"t": 0.0, "x": "悪気なく言ったその一言で、\n相手の中の何かが折れることがあります。"}, {"t": 4.666666666666667, "x": "そして折れる場所が、男女で違う場合があります。"}, {"t": 8.033333333333333, "x": "男は、役に立てないと感じた\n時に深く刺さりやすいです。"}, {"t": 12.166666666666666, "x": "女は、どうでもいい相手とし\nて扱われた時に深く刺さりやすいです。"}, {"t": 16.9, "x": "男は能力を下げられると、自分ごと\n下げられたように受け取ります。"}, {"t": 21.6, "x": "女は関心を向けられないと、\n存在ごと外されたように受け取ります。"}, {"t": 26.416666666666668, "x": "だから同じ言葉でも、当たる\n深さがまったく違ってきます。"}, {"t": 30.266666666666666, "x": "片方には冗談で流せることが、もう片方には\n長く残ります。"}, {"t": 34.733333333333334, "x": "言った側は、そんなつもりで言っていません。"}, {"t": 37.61666666666667, "x": "言われた側は、その一言だけを何年も覚えています。"}, {"t": 41.43333333333333, "x": "この差を知らないと、悪気が\nないまま関係が削れていきます。"}, {"t": 45.68333333333333, "x": "しかも削れていることに、言\nった側は最後まで気づきません。"}, {"t": 49.766666666666666, "x": "今日は、何を言われた時に折れるのかを\n男女で並べて見ていきます。"}, {"t": 54.233333333333334, "x": "逆の刺さり方をする人もいるので、\nあくまで傾向として聞いてください。"}, {"t": 58.95, "x": "自分の弱い場所が分かると、\n伝え方も守り方も変わります。"}, {"t": 63.46666666666667, "x": "まず、強い言葉ほど刺さるとは限りません。"}, {"t": 66.73333333333333, "x": "怒鳴られた記憶より、静かに\n言われた一言が残ることがあります。"}, {"t": 71.25, "x": "怒鳴り声は、感情として処理されやすいからです。"}, {"t": 74.66666666666667, "x": "その時は怖くても、後から状況として思い出せます。"}, {"t": 78.58333333333333, "x": "けれども静かに言われた評価は、\n事実として保存されます。"}, {"t": 82.68333333333334, "x": "感情ではなく、判断として受け取ってしまうからです。"}, {"t": 86.4, "x": "だから落ち着いた場面で出た一言ほど、\n深く入ります。"}, {"t": 90.31666666666666, "x": "喧嘩の最中の言葉より、普通の日の一言が残ります。"}, {"t": 94.55, "x": "そして深く入るのは、自分でも\n気にしていた場所です。"}, {"t": 98.23333333333333, "x": "まったく気にしていない場所は、\n何を言われても響きません。"}, {"t": 102.08333333333333, "x": "つまり刺さるかどうかは、言葉では\nなく相手側の地形で決まります。"}, {"t": 106.55, "x": "同じ一言でも、当たる人と当たらない人がいます。"}, {"t": 110.01666666666667, "x": "だから言った側には、手応えがまったくありません。"}, {"t": 113.38333333333334, "x": "手応えが無いので、何度も同\nじ言い方をしてしまいます。"}, {"t": 117.33333333333333, "x": "繰り返された時に、傷は形を変えて残ります。"}, {"t": 121.01666666666667, "x": "男の側で深く入りやすいのは、\n役に立てないという方向です。"}, {"t": 125.55, "x": "稼ぎが少ない。"}, {"t": 126.78333333333333, "x": "誰でもできる。"}, {"t": 127.83333333333333, "x": "頼りにならない。"}, {"t": 129.03333333333333, "x": "そういう言葉が、能力ではな\nく存在の評価として届きます。"}, {"t": 133.26666666666668, "x": "理由は、男が自分の価値を働\nきの側で測りやすいからです。"}, {"t": 137.73333333333332, "x": "何かをして返せている間は、\nいる意味があると感じています。"}, {"t": 141.88333333333333, "x": "だから返せていないと言われ\nると、いる意味ごと揺れます。"}, {"t": 145.65, "x": "ここで厄介なのが、反応の出方です。"}, {"t": 148.48333333333332, "x": "折れた時に、悲しむのではな\nく怒る形で出ることがあります。"}, {"t": 152.71666666666667, "x": "怒っているように見えるので、\n傷だと気づいてもらえません。"}, {"t": 156.53333333333333, "x": "または、黙って別の場所へ行く形で出ます。"}, {"t": 159.7, "x": "仕事に逃げる。"}, {"t": 160.78333333333333, "x": "外に出る。"}, {"t": 161.63333333333333, "x": "趣味の時間を増やす。"}, {"t": 163.18333333333334, "x": "どれも、返せる場所を探しに行く動きです。"}, {"t": 166.28333333333333, "x": "つまり家から離れるのは、嫌\nいになったからとは限りません。"}, {"t": 170.18333333333334, "x": "役に立てる場所に移っただけ、という場合があります。"}, {"t": 173.76666666666668, "x": "そこを責めると、戻ってくる理由がさらに減ります。"}, {"t": 177.23333333333332, "x": "女の側で深く入りやすいのは、\n関心が無いという方向です。"}, {"t": 181.78333333333333, "x": "どうでもいい。"}, {"t": 182.76666666666668, "x": "勝手にすれば。"}, {"t": 183.88333333333333, "x": "好きにして。"}, {"t": 184.75, "x": "そういう言葉が、関係そのものを\n外されたように届きます。"}, {"t": 188.85, "x": "理由は、女が自分の位置を扱\nわれ方で測りやすいからです。"}, {"t": 193.36666666666667, "x": "気にかけられている間は、関係の中にいると\n感じています。"}, {"t": 197.5, "x": "だから関心を引き上げられると、\n位置ごと消えたように感じます。"}, {"t": 201.9, "x": "ここで厄介なのが、言った側の意図です。"}, {"t": 204.81666666666666, "x": "多くの場合、突き放すつもりで言っていません。"}, {"t": 208.08333333333334, "x": "任せる。"}, {"t": 209.18333333333334, "x": "尊重する。"}, {"t": 210.15, "x": "自由にしてほしい。"}, {"t": 211.51666666666668, "x": "そういう気持ちで言っていることが、かなりあります。"}, {"t": 214.63333333333333, "x": "けれども言葉の形が、関心の引\nき上げと同じになってしまいます。"}, {"t": 219.18333333333334, "x": "特に疲れている日の短い返事は、\nそのまま扱いとして残ります。"}, {"t": 223.91666666666666, "x": "体調が悪かったという説明は、後からでは効きません。"}, {"t": 227.85, "x": "残っているのは理由ではなく、\nその時の温度だからです。"}, {"t": 231.71666666666667, "x": "だから短く返す日ほど、一言\nだけ理由を添える方が安全です。"}, {"t": 236.46666666666667, "x": "冗談として流せる範囲にも、差があります。"}, {"t": 239.66666666666666, "x": "男は、能力や見た目をいじら\nれるとこたえやすいです。"}, {"t": 243.38333333333333, "x": "特に仕事や収入の話は、冗談に\nなりにくいところがあります。"}, {"t": 247.96666666666667, "x": "女は、扱いの軽さをいじられるとこたえやすいです。"}, {"t": 251.65, "x": "どうせ分からないよね、とい\nう形の冗談がそれに当たります。"}, {"t": 255.78333333333333, "x": "つまり男は中身を、女は位置をいじられると痛みます。"}, {"t": 259.78333333333336, "x": "そして冗談かどうかを決めるのは、\n言った側ではありません。"}, {"t": 263.78333333333336, "x": "受け取った側が決めるので、\n意図はあまり関係がありません。"}, {"t": 267.8333333333333, "x": "ここで、冗談だと言い直すのが\nいちばん危ない手です。"}, {"t": 271.5, "x": "言い直した瞬間に、笑えなか\nった側が悪いことになります。"}, {"t": 275.9, "x": "だから相手の顔が動いたら、\nそのまま謝る方が安全です。"}, {"t": 280.18333333333334, "x": "どこが嫌だったのかは、後から聞けば足ります。"}, {"t": 283.31666666666666, "x": "そして、人によって線の位置はまったく違います。"}, {"t": 286.71666666666664, "x": "前の相手に通じた冗談が、次の相手に通\nじるとは限りません。"}, {"t": 291.43333333333334, "x": "線の位置は、一度ずつ確かめるしかありません。"}, {"t": 294.75, "x": "同じ一言でも、人前かどうかで重さが変わります。"}, {"t": 298.46666666666664, "x": "二人の時に言われれば、意見として処理できます。"}, {"t": 301.81666666666666, "x": "人前で言われると、評価として周りにも配られます。"}, {"t": 305.6166666666667, "x": "そして配られた評価は、こちらでは回収できません。"}, {"t": 309.25, "x": "男は、能力を人前で下げられると強く残ります。"}, {"t": 313.0, "x": "友人や同僚の前での一言は、\n何年も覚えていることがあります。"}, {"t": 317.75, "x": "女は、関心の無さを人前で見せられると強く残ります。"}, {"t": 321.8833333333333, "x": "話しかけたのに返事をしなか\nった場面などがそれです。"}, {"t": 325.28333333333336, "x": "どちらも、内容そのものより人数の方が効いています。"}, {"t": 329.2, "x": "だから直したいことは、二人の時に言う方が届きます。"}, {"t": 333.06666666666666, "x": "人前で言うと、内容ではなく恥として受け取られます。"}, {"t": 337.0, "x": "恥として受け取られた話は、直す方向に進みません。"}, {"t": 340.95, "x": "むしろ、次から人前に出たがらなくなります。"}, {"t": 344.2, "x": "そして家の中でも、口数が減っていきます。"}, {"t": 347.3666666666667, "x": "言う場所を変えるだけで、結果はかなり変わります。"}, {"t": 350.78333333333336, "x": "比べられた時に残るものにも、違いがあります。"}, {"t": 354.2, "x": "男が比べられて残りやすいのは、\n他の人の働きの話です。"}, {"t": 358.75, "x": "あの人はもっと稼いでいる、という形が代表的です。"}, {"t": 362.71666666666664, "x": "女が比べられて残りやすいのは、\n他の人の扱いの話です。"}, {"t": 367.26666666666665, "x": "あの人はもっと大事にされて\nいる、という形になります。"}, {"t": 371.1333333333333, "x": "どちらも、比べた相手が身近なほど深く残ります。"}, {"t": 374.76666666666665, "x": "遠い人との比較は、話として処理できます。"}, {"t": 378.01666666666665, "x": "友人や家族との比較は、順位として保存されます。"}, {"t": 381.81666666666666, "x": "そして一度保存された順位は、なかなか消えません。"}, {"t": 385.3833333333333, "x": "言った本人は、たとえ話のつもりで出しています。"}, {"t": 388.9, "x": "けれども受け取る側には、評価の結果と\nして届きます。"}, {"t": 392.65, "x": "だから褒める時も、比べる形にしないでください。"}, {"t": 396.1333333333333, "x": "前より良くなった、という比べ方なら安全です。"}, {"t": 399.5833333333333, "x": "誰かより良い、という比べ方は必ず残ります。"}, {"t": 403.23333333333335, "x": "比べる相手を自分の過去にす\nると、ほとんど刺さりません。"}, {"t": 407.0833333333333, "x": "反応の大きさと、傷の深さは一致しません。"}, {"t": 410.48333333333335, "x": "言い返してくる時は、まだ関係の中で処理\nしています。"}, {"t": 414.3, "x": "やり取りが続く限り、直す余地が残っています。"}, {"t": 417.8333333333333, "x": "けれども言い返してこない時は、\n処理をやめています。"}, {"t": 421.4, "x": "話しても意味がないと判断した後の状態です。"}, {"t": 424.56666666666666, "x": "だから静かに受け流された時\nほど、丁寧に見てください。"}, {"t": 428.6666666666667, "x": "男の場合は、返事が短くなって外の時間が増えます。"}, {"t": 432.8, "x": "女の場合は、こちらの話に質問をしなくなります。"}, {"t": 436.65, "x": "どちらも、揉めなくなったように見えるのが特徴です。"}, {"t": 440.1333333333333, "x": "揉めなくなった時期を、うま\nくいっていると読まないでください。"}, {"t": 443.9, "x": "そして、後から聞き直すのも効きます。"}, {"t": 446.56666666666666, "x": "あの時のあれ、まだ引っかかっているかと聞く形です。"}, {"t": 450.1, "x": "時間が経ってから聞かれると、\n覚えていたことが伝わります。"}, {"t": 454.0833333333333, "x": "覚えていたという事実だけで、\n少し戻ることがあります。"}, {"t": 458.01666666666665, "x": "戻らなくても、次から言っても\nらえる可能性は上がります。"}, {"t": 461.98333333333335, "x": "傷には、謝れば戻るものと戻らないものがあります。"}, {"t": 465.7, "x": "戻りやすいのは、その場の勢いで出た言葉です。"}, {"t": 469.1333333333333, "x": "言い過ぎたと分かっていれば、謝罪が届きます。"}, {"t": 472.35, "x": "戻りにくいのは、本音として受け取られた言葉です。"}, {"t": 475.76666666666665, "x": "特に、前から思っていたように\n聞こえる一言がそれです。"}, {"t": 479.71666666666664, "x": "こういう時、酔っていたという説明は逆に効きません。"}, {"t": 483.6333333333333, "x": "むしろ本音だったという証拠として扱われます。"}, {"t": 486.71666666666664, "x": "そして、繰り返された言葉も戻りにくいです。"}, {"t": 489.93333333333334, "x": "一度目は事故として処理され\nますが、二度目は性質になります。"}, {"t": 494.1333333333333, "x": "三度目には、そういう人だという結論が出ます。"}, {"t": 497.5, "x": "結論が出た後は、謝罪より行動の回数しか\n効きません。"}, {"t": 501.65, "x": "だから謝る時は、一度で済ませる形にしてください const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
