<script>
const D={"name": "名もなき家事に気づく力はあとから育てられる", "file": "066_名もなき家事に気づく力はあとから育てられる", "dur": 805.3, "segs": [], "subs": [{"t": 0.0, "x": "家事には、名前の付いていな\nい仕事がたくさんあります。"}, {"t": 3.7, "x": "ティッシュの箱を替える。"}, {"t": 5.116666666666666, "x": "ゴミ袋を次に備えて広げておく。"}, {"t": 7.65, "x": "玄関に出しっぱなしの靴を、靴箱に戻す。"}, {"t": 10.983333333333333, "x": "どれも数分で済みますが、誰かがやらないと\n家は回りません。"}, {"t": 15.15, "x": "この名もなき家事に、すぐ気\nづく人と気づかない人がいます。"}, {"t": 19.2, "x": "その差は、気配りの量や愛情の量だと\n思われがちです。"}, {"t": 23.1, "x": "けれども実際は、目に入る範囲の違\nいであることが多いです。"}, {"t": 27.416666666666668, "x": "男は家事を、一つずつの作業と\nして見やすいと言われます。"}, {"t": 31.55, "x": "一方で女は、家事を一日の流\nれとして見やすい場合があります。"}, {"t": 36.3, "x": "ただしこれは、家によってまるごと\n入れ替わることもあります。"}, {"t": 40.233333333333334, "x": "気づく側と気づかない側を決\nめているのは、性別だけではありません。"}, {"t": 44.95, "x": "この違いを知らないまま暮らすと、\n気づく側が黙って疲れていきます。"}, {"t": 49.53333333333333, "x": "気づかない側は、何を求められているのか\n分からないまま責められます。"}, {"t": 54.15, "x": "そうやって、どちらも悪くないのに\n家の空気が重くなっていきます。"}, {"t": 58.666666666666664, "x": "今日は、気づく力の正体を順番に見ていきます。"}, {"t": 62.333333333333336, "x": "先に結論を言うと、気づく力は後か\nらでも育てられるようです。"}, {"t": 66.93333333333334, "x": "まず、気づかない人の目に何も映\nっていないわけではありません。"}, {"t": 71.15, "x": "玄関の靴も、洗面台の髪の毛も、\nちゃんと目には入っています。"}, {"t": 76.05, "x": "ただ、それが自分のやることと\nして引っかからないのです。"}, {"t": 79.66666666666667, "x": "景色の一部として、そのまま通り過ぎてしまいます。"}, {"t": 83.18333333333334, "x": "男は、自分の担当と決まったものに\nだけ札が付きやすいです。"}, {"t": 87.5, "x": "ゴミ出しの日。"}, {"t": 88.5, "x": "車の点検。"}, {"t": 89.65, "x": "頼まれた買い物。"}, {"t": 91.05, "x": "札が付いたものは、忘れずに\nきちんとこなすことが多いです。"}, {"t": 95.01666666666667, "x": "一方で女は、札が付いていないものにも\n目が止まりやすい場合があります。"}, {"t": 100.15, "x": "減っていく洗剤。"}, {"t": 101.41666666666667, "x": "湿ったままのタオル。"}, {"t": 102.85, "x": "溜まりかけた郵便物。"}, {"t": 104.53333333333333, "x": "ただ、この向きも家によって\n逆になることがよくあります。"}, {"t": 108.33333333333333, "x": "一人暮らしが長かった人は、\n性別に関係なく札が多い傾向があります。"}, {"t": 113.73333333333333, "x": "つまり差は、目の良さではな\nく札の付き方にあると言えます。"}, {"t": 117.7, "x": "札の付いていないものは、見\nえていても素通りしてしまいます。"}, {"t": 121.68333333333334, "x": "これは怠けているのではありません。"}, {"t": 123.86666666666666, "x": "そこが自分の場所だと、まだ\n感じたことがないだけなのです。"}, {"t": 127.86666666666666, "x": "では、札の多い人は何を手がか\nりにしているのでしょうか。"}, {"t": 131.8, "x": "気づく人は、目の前ではなく\n少し先の場面を見ていることが多いです。"}, {"t": 136.58333333333334, "x": "明日の朝に牛乳が足りるか。"}, {"t": 138.78333333333333, "x": "週末に卵が残っているか。"}, {"t": 140.98333333333332, "x": "来週の雨の日に、乾いたタオルが足りているか。"}, {"t": 144.5, "x": "先の場面を思い浮かべると、\n今足りないものが自然に浮かびます。"}, {"t": 149.03333333333333, "x": "男は、目の前の作業を終わら\nせることに集中しやすいです。"}, {"t": 153.31666666666666, "x": "洗い物を片付ける。"}, {"t": 154.78333333333333, "x": "掃除機をかけ終える。"}, {"t": 156.25, "x": "頼まれた物を買って帰る。"}, {"t": 158.13333333333333, "x": "終わらせる力は強く、一度始めると\n最後まで仕上げることが多いです。"}, {"t": 163.16666666666666, "x": "一方で女は、次に使う人の場面か\nら考えやすいと言われます。"}, {"t": 168.03333333333333, "x": "次に手を洗う人。"}, {"t": 169.46666666666667, "x": "明日お弁当を作る人。"}, {"t": 171.35, "x": "夜に帰ってくる家族。"}, {"t": 172.98333333333332, "x": "その人が困らないように、先回\nりして整えておく形です。"}, {"t": 177.41666666666666, "x": "どちらが正しいという話ではありません。"}, {"t": 180.06666666666666, "x": "今を片付ける目と、先を整える目が、\n別々に働いているだけです。"}, {"t": 185.43333333333334, "x": "先を整える目は、その場面を何度も体験\nした人ほど育っています。"}, {"t": 190.38333333333333, "x": "朝に牛乳が無くて困った経験が、\n次の気づきの材料になるからです。"}, {"t": 195.46666666666667, "x": "だから気づく力は、才能とい\nうより経験の積み重ねに近いものです。"}, {"t": 200.41666666666666, "x": "その経験がどこで積まれるのかを、次で見ていきます。"}, {"t": 204.13333333333333, "x": "気づく力の差は、担当してき\nた時間の差であることが多いです。"}, {"t": 208.46666666666667, "x": "子どもの頃に台所を手伝っていた。"}, {"t": 210.91666666666666, "x": "一人で暮らした時期が長い。"}, {"t": 212.78333333333333, "x": "家族の中で、頼られる役を長くやってきた。"}, {"t": 216.11666666666667, "x": "そういう時間が長い人ほど、\n名もなき家事が目に入りやすいようです。"}, {"t": 220.86666666666667, "x": "男女の差に見えるものも、中身は\nここにある場合があります。"}, {"t": 224.93333333333334, "x": "昔から家の中の仕事を、どちらが\n多く任されてきたかの差です。"}, {"t": 229.43333333333334, "x": "その証拠に、飲食店で働いて\nいた男は台所でよく気づきます。"}, {"t": 234.43333333333334, "x": "冷蔵庫の中身を見ただけで、\n足りない物がすぐ分かります。"}, {"t": 238.5, "x": "逆に、実家暮らしが長かった\n女は気づきにくいこともあります。"}, {"t": 242.96666666666667, "x": "やってくれる人がいた場所では、\n札が付く機会が無いからです。"}, {"t": 247.01666666666668, "x": "つまり気づく力は、生まれつ\nき決まっているものではありません。"}, {"t": 251.06666666666666, "x": "担当した時間が短ければ、今は\nまだ育っていないだけです。"}, {"t": 255.3, "x": "育っていないなら、これから育てることができます。"}, {"t": 258.56666666666666, "x": "ここが、この話でいちばん大事なところです。"}, {"t": 261.6333333333333, "x": "責める材料ではなく、伸びし\nろとして見られるからです。"}, {"t": 265.2, "x": "ただ、育てる前に知っておき\nたい違いがもう一つあります。"}, {"t": 269.23333333333335, "x": "同じ家事でも、どこで終わりと\nするかが人によって違います。"}, {"t": 273.18333333333334, "x": "皿洗いを例にすると、この違いがよく分かります。"}, {"t": 276.76666666666665, "x": "洗って水切りかごに置いたら\n終わり、という人がいます。"}, {"t": 280.46666666666664, "x": "かごを空にして、排水口のネットまで\n替えて終わり、という人もいます。"}, {"t": 285.4166666666667, "x": "男は、作業そのものが済んだと\nころに線を引きやすいです。"}, {"t": 289.4166666666667, "x": "皿が洗えた。"}, {"t": 290.51666666666665, "x": "洗濯機を回した。"}, {"t": 291.98333333333335, "x": "ゴミを出した。"}, {"t": 292.95, "x": "一方で女は、場所が元の状態に戻\nったところに線を引く場合があります。"}, {"t": 298.23333333333335, "x": "棚に皿が戻った。"}, {"t": 299.68333333333334, "x": "洗濯物が畳まれた。"}, {"t": 301.35, "x": "新しい袋が広げてあった。"}, {"t": 303.45, "x": "この線の差は、手を抜いてい\nるかどうかの差ではありません。"}, {"t": 307.1166666666667, "x": "どこまでが一つの家事かという、\n区切りの感覚が違うだけです。"}, {"t": 311.3333333333333, "x": "ところが線が違うと、片方には\n残りの仕事が見えてしまいます。"}, {"t": 315.95, "x": "やったのにやっていないと言\nわれる側は、納得がいきません。"}, {"t": 319.8833333333333, "x": "やってくれたのに半分残って\nいる側は、言いにくさを抱えます。"}, {"t": 324.21666666666664, "x": "どちらも間違ってはいないのに、\nすれ違いが生まれます。"}, {"t": 327.96666666666664, "x": "線がそろうと、名もなき家事の多\nくは自然に消えていきます。"}, {"t": 332.21666666666664, "x": "そろえる前に、気づく側が抱\nえているものを見ておきます。"}, {"t": 336.26666666666665, "x": "気づく側の頭の中には、いつも\n小さな一覧が開いています。"}, {"t": 340.76666666666665, "x": "シャンプーの替え。"}, {"t": 341.93333333333334, "x": "子どもの上履き。"}, {"t": 343.2, "x": "明日のゴミの種類。"}, {"t": 344.5833333333333, "x": "その一覧は、家にいる間ずっと\n閉じることがありません。"}, {"t": 348.53333333333336, "x": "気づく人は、目に見える形に\nなる前に片付けてしまいます。"}, {"t": 352.7, "x": "片付けてしまうので、相手か\nらはその仕事が見えなくなります。"}, {"t": 356.81666666666666, "x": "やっている量と、相手に見え\nている量に差が出てしまうのです。"}, {"t": 360.8666666666667, "x": "男が気づく側に回っている家でも、\n同じことが起きます。"}, {"t": 364.93333333333334, "x": "女が気づく側に回っている家でも、\n同じことが起きます。"}, {"t": 369.0, "x": "疲れの正体は、作業の重さよ\nり一覧を持ち続ける重さです。"}, {"t": 373.6166666666667, "x": "一つずつは軽いのに、全部を覚\nえていることが疲れにつながります。"}, {"t": 378.3333333333333, "x": "しかもその疲れは、誰にも数えてもらえません。"}, {"t": 381.65, "x": "お礼を言われるのは、たいて\nい名前の付いた家事の方です。"}, {"t": 385.45, "x": "名前の無い方は、やって当た\nり前として流れていきます。"}, {"t": 389.35, "x": "気づく側が苛立って見える時は、\n多くの場合ここが溜まっています。"}, {"t": 393.8833333333333, "x": "気が短いのではなく、一人で一覧を抱\nえてきた時間が長いのです。"}, {"t": 398.6666666666667, "x": "けれども、気づかない側にも\nまた別の事情があります。"}, {"t": 402.3833333333333, "x": "気づかない側も、何もしたくないと\n思っているとは限りません。"}, {"t": 406.51666666666665, "x": "やろうとしたら、もう片付いていた。"}, {"t": 408.9, "x": "先に手を出したら、やり方が違うと言われた。"}, {"t": 412.2, "x": "どこから手を付ければいいのか、そもそも分からない。"}, {"t": 415.6166666666667, "x": "こういう経験が重なると、手を出すこと\n自体をためらうようになります。"}, {"t": 420.31666666666666, "x": "男は、やり方を直されると任\nされていないと受け取りやすいです。"}, {"t": 424.73333333333335, "x": "任されていないなら、待って\nいた方が迷惑をかけないと考えます。"}, {"t": 429.3, "x": "一方で女が気づかない側の場合も、\n同じ遠慮が起きることがあります。"}, {"t": 434.3, "x": "相手の方が上手だから、触ら\nない方がいいと思ってしまう形です。"}, {"t": 439.1166666666667, "x": "気づかない側に足りないのは、やる気よりも\n入り口です。"}, {"t": 442.78333333333336, "x": "入り口が無いまま待っている\nうちに、気づく側が先に動きます。"}, {"t": 447.0833333333333, "x": "先に動かれると、また気づく機会が一つ減ります。"}, {"t": 450.75, "x": "これが続くと、気づく側と気\nづかない側が固定されていきます。"}, {"t": 455.1166666666667, "x": "固定されたのは、性格のせいではありません。"}, {"t": 458.3333333333333, "x": "二人の間で、役割が少しずつ\n出来上がってしまっただけです。"}, {"t": 462.73333333333335, "x": "では、この固定をほどくには\n何から始めればいいのでしょうか。"}, {"t": 466.78333333333336, "x": "最初に避けたいのは、気づか\nなかったことを責める形です。"}, {"t": 470.71666666666664, "x": "なんで気づかないの。"}, {"t": 472.03333333333336, "x": "前にも言ったよね。"}, {"t": 473.35, "x": "見れば分かるでしょう。"}, {"t": 474.65, "x": "どれも気持ちとしてはよく分かる言葉です。"}, {"t": 477.25, "x": "ただ、この言い方では気づく力はほとんど育ちません。"}, {"t": 481.0, "x": "責められた側は、言われた場所\nだけを見るようになるからです。"}, {"t": 484.8666666666667, "x": "言われた棚だけ拭く。"}, {"t": 486.3, "x": "言われた日だけゴミを出す。"}, {"t": 487.96666666666664, "x": "それ以外の場所には、かえって手を出さなくなります。"}, {"t": 491.4, "x": "男は、責められると正しさの説明で返しやすいです。"}, {"t": 495.3333333333333, " const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
