<script>
const D={"name": "返事が戻る人の2通目_既読のまま止まった時に追うほど遠のく理由", "file": "086_返事が戻る人の2通目_既読のまま止まった時に追うほど遠のく理由", "dur": 799.11665625, "segs": [], "subs": [{"t": 0.0, "x": "既読のまま相手からの返事が止まることがあります。"}, {"t": 3.25, "x": "今日はそこから送る二通目の話をします。"}, {"t": 6.183333333333334, "x": "止まった後に、また返事が戻ってくる人がいます。"}, {"t": 9.633333333333333, "x": "一方で送るほど遠のいてしまう人もいます。"}, {"t": 12.65, "x": "この二人の差は、送った回数ではありません。"}, {"t": 15.9, "x": "二通目の中身と、送り方の違いです。"}, {"t": 18.85, "x": "先に答えを言っておきます。"}, {"t": 20.766666666666666, "x": "男は返す理由が見えると戻りやすいです。"}, {"t": 23.783333333333335, "x": "女は返す気まずさが消えると戻りやすいです。"}, {"t": 26.916666666666668, "x": "男は何を返せばいいか分から\nなくて止まることがあります。"}, {"t": 30.683333333333334, "x": "女はちゃんと返したくて止まることがあります。"}, {"t": 33.583333333333336, "x": "止まり方が違えば、効く二通目も違ってきます。"}, {"t": 37.03333333333333, "x": "この違いを知らないと、善意の一通が重荷に\nなります。"}, {"t": 41.06666666666667, "x": "心配して送った言葉が、急か\nす言葉に見えてしまいます。"}, {"t": 45.0, "x": "そして返したかったはずの相手が、\nさらに遠くなります。"}, {"t": 48.75, "x": "既読の後の沈黙は、終わりの合図とは限りません。"}, {"t": 52.56666666666667, "x": "扉が少しだけ閉まりかけてい\nる状態に近いのかもしれません。"}, {"t": 56.583333333333336, "x": "その扉をもう一度開ける一通を、順番に見ていきます。"}, {"t": 60.766666666666666, "x": "既読がついたのに返事が来ない。"}, {"t": 62.9, "x": "多くの人は、ここで不安になります。"}, {"t": 65.55, "x": "嫌われたのかもしれない。"}, {"t": 67.2, "x": "何か気に障ったのかもしれない。"}, {"t": 69.35, "x": "けれども止まる理由は、男女で違うことが多いです。"}, {"t": 72.96666666666667, "x": "男は読んだ時点で用が済んだと\n感じる場合があります。"}, {"t": 76.63333333333334, "x": "話が一区切りついたので、返\nす必要がないと考えるのです。"}, {"t": 81.2, "x": "仕事の合間に読んで、後で返そうと思います。"}, {"t": 84.61666666666666, "x": "そのまま忘れてしまうこともあります。"}, {"t": 87.01666666666667, "x": "一方で女は返事を後回しにす\nる理由が少し違うようです。"}, {"t": 91.4, "x": "今は短くしか返せないから、\n落ち着いてから返したい。"}, {"t": 95.21666666666667, "x": "気持ちが乗る時に、丁寧に書きたい。"}, {"t": 98.11666666666666, "x": "そうやって大事な相手ほど寝か\nせてしまうことがあります。"}, {"t": 101.53333333333333, "x": "男の沈黙は終わったと思っている沈黙です。"}, {"t": 104.73333333333333, "x": "女の沈黙はまだ途中の沈黙であることが多いです。"}, {"t": 108.46666666666667, "x": "どちらも相手を拒んでいるとは限りません。"}, {"t": 111.21666666666667, "x": "もちろん気持ちが離れて返さない場合もあります。"}, {"t": 114.45, "x": "ただ止まった直後に、それを\n決めつけるのは早いです。"}, {"t": 118.05, "x": "まずは相手がどちらの沈黙にいるのかを考えてみます。"}, {"t": 121.75, "x": "それだけで二通目に書くことが変わってきます。"}, {"t": 124.55, "x": "返事が止まった後、時間は返\nす側にも重くのしかかります。"}, {"t": 128.88333333333333, "x": "男は日がたつほど今さらと感じやすいです。"}, {"t": 131.86666666666667, "x": "今さら返しても変に思われる。"}, {"t": 134.08333333333334, "x": "話題も古くなった。"}, {"t": 135.48333333333332, "x": "そう考えてそのまま閉じてしまうことがあります。"}, {"t": 138.56666666666666, "x": "一方で女は遅れた分だけ丁寧に返\nさなければと感じやすいです。"}, {"t": 143.25, "x": "まず謝って理由を書いて、それから本題に入る。"}, {"t": 146.88333333333333, "x": "そう考えるほど、文が長くな\nって書き出せなくなります。"}, {"t": 150.8, "x": "男は軽く戻る入口を失い、女は戻\nる文の重さに止まります。"}, {"t": 155.68333333333334, "x": "どちらも返したくないわけではありません。"}, {"t": 158.23333333333332, "x": "戻るための一歩が、だんだん高くなっていくのです。"}, {"t": 161.56666666666666, "x": "階段の一段目が、日ごとに少\nしずつ高くなるようなものです。"}, {"t": 165.83333333333334, "x": "最初の日なら、軽くまたいで上がれた高さです。"}, {"t": 169.11666666666667, "x": "数日後には見上げるほどの高さに感じられます。"}, {"t": 172.4, "x": "二通目の役目は、この一段を下げてあげることです。"}, {"t": 176.03333333333333, "x": "返す側が何も気にせず上がれる高さに戻すのです。"}, {"t": 179.6, "x": "二通目の中身は、そのために考えます。"}, {"t": 182.63333333333333, "x": "返事が来ないと、続けて送りたくなるものです。"}, {"t": 186.0, "x": "具合を気づかう一言。"}, {"t": 187.68333333333334, "x": "様子をうかがう一言。"}, {"t": 189.35, "x": "待っているという一言。"}, {"t": 190.96666666666667, "x": "けれども続けて送るほど、相手は遠のきやすいです。"}, {"t": 194.73333333333332, "x": "送るたびに、相手の画面に宿題が増えるからです。"}, {"t": 198.28333333333333, "x": "まだ返していない宿題です。"}, {"t": 200.21666666666667, "x": "一通なら短く返せば済みます。"}, {"t": 202.61666666666667, "x": "三通たまると、全部に答えな\nいといけない気がしてきます。"}, {"t": 206.9, "x": "宿題が増えるほど、取りかかるのが面倒になります。"}, {"t": 210.5, "x": "男は通知が並ぶと急かされていると感じやすいです。"}, {"t": 214.06666666666666, "x": "女は心配の言葉が続くと申し訳なさが\n積もりやすいです。"}, {"t": 218.26666666666668, "x": "申し訳なさが大きくなると、\n余計に返しにくくなります。"}, {"t": 222.46666666666667, "x": "送った側は気にかけているつもりです。"}, {"t": 224.93333333333334, "x": "返す側には返さなければいけ\nない借りとして届きます。"}, {"t": 228.56666666666666, "x": "これが追うほど遠のく仕組みです。"}, {"t": 230.63333333333333, "x": "近づこうとした一通が、相手の扉を重\nくしてしまいます。"}, {"t": 234.633333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
