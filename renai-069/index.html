<script>
const D={"name": "寝る前の30分の使い方が男女で正反対", "file": "069_寝る前の30分の使い方が男女で正反対", "dur": 837.4833125, "segs": [], "subs": [{"t": 0.0, "x": "一日の中で、いちばんすれ違いやすいのは\n寝る前の三十分かもしれません。"}, {"t": 5.35, "x": "朝は時間に追われ、昼はそれぞれの場所にいます。"}, {"t": 8.833333333333334, "x": "二人が同じ部屋でゆっくりできるのは、\n夜の最後だけという家も多いです。"}, {"t": 13.866666666666667, "x": "ところが、その三十分の使い方が男女で逆に\nなりやすいと言われます。"}, {"t": 18.783333333333335, "x": "男は明かりを落として、黙って一日を終わらせたい。"}, {"t": 22.516666666666666, "x": "女は少し話をして、一日を片づけてから眠りたい。"}, {"t": 26.7, "x": "男は体が温まると、すぐに眠くなりやすい。"}, {"t": 30.45, "x": "女は手足が冷えたままだと、\nなかなか寝付けない場合があります。"}, {"t": 34.93333333333333, "x": "同じ部屋にいて、同じ時計を見\nていても、欲しいものが違います。"}, {"t": 39.53333333333333, "x": "違いを知らないまま毎晩を重ね\nると、小さなとげが残ります。"}, {"t": 44.083333333333336, "x": "話しかけたのに返事が眠そうだった。"}, {"t": 46.55, "x": "静かにしたかったのに話が始まった。"}, {"t": 49.166666666666664, "x": "けれども、寝る前は毎日必ずやってきます。"}, {"t": 52.5, "x": "毎日くり返すので、少しのず\nれが一年分たまっていきます。"}, {"t": 56.9, "x": "今日は、寝る前の三十分を男女に分\nけて並べていきます。"}, {"t": 60.96666666666667, "x": "最後に、二人で分け合える使\nい方を一つだけ出します。"}, {"t": 64.86666666666666, "x": "寝る前の過ごし方には、その\n人の一日の閉じ方が出ます。"}, {"t": 69.05, "x": "風呂を先に済ませるか。"}, {"t": 70.63333333333334, "x": "片づけを先にするか。"}, {"t": 72.28333333333333, "x": "何もせず座るか。"}, {"t": 73.7, "x": "男は一日を、電源を切るように\n終わらせたい人が多いようです。"}, {"t": 78.33333333333333, "x": "考えるのをやめる。"}, {"t": 79.73333333333333, "x": "明かりを落とす。"}, {"t": 80.83333333333333, "x": "体を横にする。"}, {"t": 82.15, "x": "切り替えがうまくいくほど、\n早く眠れると感じやすいです。"}, {"t": 86.11666666666666, "x": "一方で女は、一日を棚に戻すように\n終わらせたい場合があります。"}, {"t": 90.98333333333333, "x": "今日あったことを並べる。"}, {"t": 92.53333333333333, "x": "気になったことを口に出す。"}, {"t": 94.33333333333333, "x": "明日の分を分けておく。"}, {"t": 96.05, "x": "片づけ終わってから横になると、\n落ち着いて眠れるようです。"}, {"t": 100.1, "x": "切る人と、たたむ人です。"}, {"t": 102.13333333333334, "x": "どちらも一日を終わらせるための、真っ当な方法です。"}, {"t": 106.03333333333333, "x": "ただ、切る人は短い時間で終わり、\nたたむ人は少し時間がかかります。"}, {"t": 111.41666666666667, "x": "この時間の差が、そのまま寝\nる前の三十分の中でぶつかります。"}, {"t": 115.83333333333333, "x": "早く終わった側は、相手がま\nだ動いている理由が分かりません。"}, {"t": 120.11666666666666, "x": "まだ途中の側は、先に終わっ\nた相手に置いていかれた気がします。"}, {"t": 124.45, "x": "ここから、二人の三十分を一つずつほどいていきます。"}, {"t": 128.26666666666668, "x": "男の側は、寝る前に頭を静かに\nしたい人が多いと言われます。"}, {"t": 132.96666666666667, "x": "仕事の段取り。"}, {"t": 134.18333333333334, "x": "帰り道の渋滞。"}, {"t": 135.68333333333334, "x": "昼間に言われた一言。"}, {"t": 137.38333333333333, "x": "それを一つずつ考え直すより、\n一度に全部止めたいようです。"}, {"t": 141.73333333333332, "x": "だから、寝る前の話が長くなると\n少し身構えることがあります。"}, {"t": 146.21666666666667, "x": "話が嫌なのではなく、考える\n作業がもう一度始まるからです。"}, {"t": 150.9, "x": "男は話を聞くと、答えを出そ\nうとして頭が動きやすいです。"}, {"t": 155.41666666666666, "x": "動き出した頭は、布団に入っ\nてもなかなか止まりません。"}, {"t": 159.3, "x": "一方で女は、話すこと自体を止\nめる作業として使う場合があります。"}, {"t": 164.3, "x": "同じ会話が、片方には起こす作業で、\n片方には寝かせる作業です。"}, {"t": 169.5, "x": "男が相づちだけで済ませるのは、\n冷たくしたいからではありません。"}, {"t": 173.93333333333334, "x": "頭をこれ以上動かさないための、\n守り方に近いようです。"}, {"t": 178.13333333333333, "x": "ただ、その守り方は相手からは\n話を閉じられたように見えます。"}, {"t": 182.63333333333333, "x": "閉じられた側が抱えているものが、\n次の女の側の話です。"}, {"t": 187.0, "x": "女の側は、寝る前に少しだけ\n話をしたい人が多いと言われます。"}, {"t": 191.8, "x": "昼にあった小さな出来事。"}, {"t": 193.76666666666668, "x": "気になっている予定。"}, {"t": 195.2, "x": "職場で引っかかったこと。"}, {"t": 196.9, "x": "答えがほしいのではなく、口に出\nして並べたいだけのことが多いです。"}, {"t": 201.5, "x": "並べ終わると、頭の中の引き出しが\n閉まる感覚があるようです。"}, {"t": 205.9, "x": "閉まらないまま横になると、\n同じことが何度も浮かんできます。"}, {"t": 210.1, "x": "女は話すことで、気持ちの置\nき場所を決めやすいです。"}, {"t": 213.86666666666667, "x": "聞いてくれる人がいると、置き場所が早く決まります。"}, {"t": 217.43333333333334, "x": "一方で男は、その話に答えを\n返さなければと考えやすいです。"}, {"t": 222.36666666666667, "x": "女が欲しいのは答えよりも、\n聞いていたという反応の方です。"}, {"t": 226.61666666666667, "x": "うなずく。"}, {"t": 227.7, "x": "そうだったんだと返す。"}, {"t": 229.28333333333333, "x": "それで大丈夫だったのと聞く。"}, {"t": 231.26666666666668, "x": "その程度で、たたむ作業はかなり進みます。"}, {"t": 234.46666666666667, "x": "話したがるのは、わがままでも甘えでもありません。"}, {"t": 237.88333333333333, "x": "眠るための支度を、言葉でしているだけなのです。"}, {"t": 241.21666666666667, "x": "支度の途中で相手が眠ってしまうと、\n置いていかれた気がします。"}, {"t": 245.5, "x": "眠ってしまう理由は、体の側にもあります。"}, {"t": 248.83333333333334, "x": "話の途中で相手が眠ってしま\nう夜は、多くの家で起きています。"}, {"t": 253.5, "x": "返事がだんだん短くなる。"}, {"t": 255.38333333333333, "x": "間が長くなる。"}, {"t": 256.65, "x": "やがて寝息に変わる。"}, {"t": 258.0833333333333, "x": "男は横になった途端、眠気が一気に来や\nすいと言われます。"}, {"t": 262.4, "x": "部屋が暗い。"}, {"t": 263.3666666666667, "x": "体が温かい。"}, {"t": 264.68333333333334, "x": "静かな声が聞こえる。"}, {"t": 266.3, "x": "この三つがそろうと、話を聞\nいていても意識が遠のくようです。"}, {"t": 270.68333333333334, "x": "女の話し声は、男にとって眠りを\n誘う音になることもあります。"}, {"t": 275.45, "x": "安心できる相手の声ほど、体が\nゆるみやすいからです。"}, {"t": 279.46666666666664, "x": "一方で女は、横になってから\n頭が冴えてくる場合があります。"}, {"t": 283.95, "x": "静かになって初めて、今日のことを\n話す余裕が出てくる形です。"}, {"t": 288.46666666666664, "x": "話し始める時間と、眠くなる\n時間がちょうど重なってしまいます。"}, {"t": 293.15, "x": "これは相手の話がつまらないのではありません。"}, {"t": 296.18333333333334, "x": "話を始める時間と、体が眠る時間が\nずれているだけなのです。"}, {"t": 300.9, "x": "ずれは、話す場所を少し変えるだけで\n小さくなります。"}, {"t": 304.6, "x": "横になる前の、座っているうちに話す形です。"}, {"t": 308.3, "x": "座っていれば、聞く側も最後\nまで起きていやすくなります。"}, {"t": 312.2, "x": "寝る前の明かりは、思ってい\nる以上に二人の気分を分けます。"}, {"t": 316.3666666666667, "x": "天井の明かりを全部消す。"}, {"t": 318.3, "x": "小さな明かりを一つ残す。"}, {"t": 320.23333333333335, "x": "廊下だけつけておく。"}, {"t": 321.71666666666664, "x": "家庭によって、当たり前の暗さがまるで違います。"}, {"t": 325.25, "x": "男は真っ暗にした方が、早く眠\nれると感じる人が多いようです。"}, {"t": 329.85, "x": "光が残っていると、まだ一日が終\nわっていない気がするからです。"}, {"t": 334.3333333333333, "x": "一方で女は、少しだけ明かりが\n残っている方が安心する場合があります。"}, {"t": 339.6333333333333, "x": "夜中に目が覚めた時。"}, {"t": 341.28333333333336, "x": "水を飲みに立つ時。"}, {"t": 342.78333333333336, "x": "物音が気になった時。"}, {"t": 344.48333333333335, "x": "足元が見えることが、そのま\nま落ち着きにつながりやすいです。"}, {"t": 348.48333333333335, "x": "問題になるのは、明かりを消す人がいつも\n同じ時です。"}, {"t": 352.3, "x": "消す側は、先に寝たい自分の都合だと\n気づいていないことがあります。"}, {"t": 356.9, "x": "消された側は、まだ起きてい\nる自分を無視されたように感じます。"}, {"t": 361.15, "x": "明かりの話は、たいてい口に出\nさないまま続いていきます。"}, {"t": 365.1666666666667, "x": "口に出さないので、小さな不満だけが毎晩残ります。"}, {"t": 369.0833333333333, "x": "足元に小さな明かりを一つ置くだけで、\n両方が落ち着く家もあります。"}, {"t": 374.0833333333333, "x": "暗さの次は、布団の中の温度の話です。"}, {"t": 377.4166666666667, "x": "同じ布団に入っても、感じて\nいる温度が違うことがあります。"}, {"t": 381.6666666666667, "x": "男は体が温まりやすく、布団をはいで\n寝る人が多いと言われます。"}, {"t": 386.6166666666667, "x": "暑くて足を出す。"}, {"t": 387.96666666666664, "x": "毛布を半分どける。"}, {"t": 389.5, "x": "窓を少し開けたくなる。"}, {"t": 391.1166666666667, "x": "一方で女は、手足が冷えやすい人が多いと\n言われます。"}, {"t": 395.18333333333334, "x": "足先が冷たいまま眠れない。"}, {"t": 397.3333333333333, "x": "肩が寒い。"}, {"t": 398.31666666666666, "x": "首元が気になる。"}, {"t": 399.6666666666667, "x": "これは我慢の問題ではなく、\n体の作りの傾向に近いようです。"}, {"t": 404.3666666666667, "x": "寒い側は、温かくなるまで眠\nれずに時間が過ぎていきます。"}, {"t": 408.6166666666667, "x": "暑い側は、温かくなりすぎて\n途中で目が覚めることがあります。"}, {"t": 412.98333333333335, "x": "一枚の布団を取り合う形になると、\nどちらも眠りが浅くなります。"}, {"t": 417.7, "x": "ここで大事なのは、どちらが\n正しい温度かを決めないことです。"}, {"t": 421.78333333333336, "x": "正しい温度は、二人の間に一\nつだけあるとは限りません。"}, {"t": 426.01666666666665, "x": "毛布を二枚に分ける。"}, {"t": 427.56666666666666, "x": "足元だけ一枚足す。"}, {"t": 429.25, "x": "靴下をはいて寝る。"}, {"t": 430.6333333333333, "x": "一つの温度に合わせるより、\nそれぞれの温度を作る方が早いです。"}, {"t": 435.21666666666664, "x": "体の違いを受け入れると、寝\nる前の小さな取り合いが消えます。"}, {"t": 439.78333333333336, "x": "取り合いが消えると、残った\n時間の過ごし方に目が向きます。"}, {"t": 443.9, "x": "寝る前に、一人で何かを見ている時間があります。"}, {"t": 447.46666666666664, "x": "手元の画面。"}, {"t": 448.53333333333336, "x": "読みかけの本。"}, {"t": 449.6, "x": "ラジオの小さな音。"}, {"t": 451.1, "x": "その時間を、相手を避けていると受け取る人もいます。"}, {"t": 454.6333333333333, "x": "男は、一人でぼんやりする時間で頭を空に\nしやすいです。"}, {"t": 458.8333333333333, "x": "何も考えずに眺めるだけの時間が、\n切り替えの一部になっています。"}, {"t": 463.6333333333333, "x": "中身に意味は無く、手を動か\nしていることに意味があるようです。"}, {"t": 467.76666666666665, "x": "一方で女も、一人で緩める時間を持\nっている人は多いです。"}, {"t": 472.18333333333334, "x": "ただ、その時間に入る前に一言交\nわしたい場合があります。"}, {"t": 476.4, "x": "何も言わずに画面に向かわれると、\n話の続きが切られた気がします。"}, {"t": 481.1166666666667, "x": "一人の時間そのものは、二人の\nどちらにも必要なものです。"}, {"t": 485.25, "x": "すれ違うのは、そこに入る時の合図が無い時です。"}, {"t": 488.8666666666667, "x": "先に少しだけ見てから寝るね、と\n一言あるだけで違います。"}, {"t": 492.98333333333335, "x": "言われた側は、自分が後回しに\nされたとは感じにくくなります。"}, {"t": 497.4166666666 ": 752.0833333333334, "x": "切る時間と、たたむ時間の両方を三十分の中に置\nきます。"}, {"t": 756.5666666666667, "x": "置き方が決まると、寝る前の\nすれ違いはかなり減ります。"}, {"t": 760.55, "x": "寝る前の三十分は、ただの眠\nるまでの時間ではありません。"}, {"t": 764.75, "x": "二人が一日をどう終わらせるかが、\n毎晩ぶつかる時間です。"}, {"t": 768.9166666666666, "x": "男は明かりを落として、頭を静かに\nしたい人が多いです。"}, {"t": 773.0166666666667, "x": "女は話をして、一日をたたんでから\n眠りたい人が多いです。"}, {"t": 777.6166666666667, "x": "終わらせ方が違うだけで、ゆ\nっくり眠りたい気持ちは同じです。"}, {"t": 782.0666666666667, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 785.2833333333333, "x": "ずれたまま毎晩が過ぎると、\nまず話しかけることが減ります。"}, {"t": 789.3833333333333, "x": "次に、先に寝る人と、あとから\n寝る人に分かれていきます。"}, {"t": 793.6833333333333, "x": "やがて、寝る前に顔を合わせ\nること自体が少なくなります。"}, {"t": 797.7166666666667, "x": "そこまで行くと、朝の会話まで\n少しずつ短くなりやすいです。"}, {"t": 802.05, "x": "戻すのに要るものは、そう多くないと言われます。"}, {"t": 805.3, "x": "明かりと布団を、それぞれに合わせて整えること。"}, {"t": 808.7333333333333, "x": "三十分を、話す時間と静かな時間に分けること。"}, {"t": 812.6666666666666, "x": "そして、最後の一言で今日の\nことに一つだけ触れること。"}, {"t": 816.65, "x": "最後に一つだけ思い出してみてください。"}, {"t": 819.3, "x": "昨日の夜、相手と交わした最後の一言は何\nだったでしょうか。"}, {"t": 823.5833333333334, "x": "その一言を少し変えるだけで、\n明日の朝は違って見えるかもしれません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
