<script>
const D={"name": "片づかないけんかで気持ちが下がりにくかったのは_関係は育つと思う人だった", "file": "109_片づかないけんかで気持ちが下がりにくかったのは_関係は育つと思う人だった", "dur": 814.05, "segs": [], "subs": [{"t": 0.0, "x": "この人とは最初から決まっていた。"}, {"t": 2.25, "x": "そう感じる恋があります。"}, {"t": 4.05, "x": "いっぽうで2人でこれから育てていく、と\n考える人もいます。"}, {"t": 8.216666666666667, "x": "どちらも恋人を大事に思う気持ちです。"}, {"t": 10.95, "x": "でもけんかをしたときに、違いが\n出るかもしれません。"}, {"t": 14.383333333333333, "x": "話し合っても片づかない。"}, {"t": 16.2, "x": "そんなときに気持ちがどう動くか。"}, {"t": 18.366666666666667, "x": "それを調べた研究があります。"}, {"t": 20.516666666666666, "x": "アメリカのヒューストン大学の心理学者、\nレイモンド・ニーたちの論文です。"}, {"t": 25.533333333333335, "x": "2004年に、専門の学術誌に載りました。"}, {"t": 29.0, "x": "今日は、この論文を一緒に読んでいきます。"}, {"t": 31.983333333333334, "x": "報告によると、言い合いのあとは\n気持ちが下がりやすい。"}, {"t": 35.833333333333336, "x": "とくに話が片づかないときです。"}, {"t": 38.083333333333336, "x": "でも関係は育つと考える人は、\n下がり方が小さかった。"}, {"t": 42.38333333333333, "x": "片づかないままでも、あまり揺れなかったのです。"}, {"t": 45.53333333333333, "x": "今日の話は、どちらの考えが\n正しいかではありません。"}, {"t": 49.45, "x": "片づかないけんかを、どう受け止めているか。"}, {"t": 52.35, "x": "その違いの話です。"}, {"t": 53.916666666666664, "x": "まずは2つの考えを見ておきます。"}, {"t": 56.35, "x": "1つ目は運命の考えです。"}, {"t": 58.483333333333334, "x": "相手とは結ばれる運命か、そうでないかのどちらか。"}, {"t": 62.166666666666664, "x": "だから、合う相手かどうかを見きわめることが大事。"}, {"t": 65.63333333333334, "x": "そういう考えです。"}, {"t": 67.06666666666666, "x": "2つ目は育つの考えです。"}, {"t": 69.1, "x": "関係は時間をかけて少しずつ育っていく。"}, {"t": 72.06666666666666, "x": "問題を乗り越えることが、2人が近づく鍵になる。"}, {"t": 75.65, "x": "そういう考えです。"}, {"t": 77.08333333333333, "x": "研究では、22の質問でこれを測りました。"}, {"t": 80.65, "x": "運命と育つが11ずつです。"}, {"t": 82.9, "x": "たとえば運命の質問はこうです。"}, {"t": 85.28333333333333, "x": "付き合う相手は、合うか合わないかのどちらかだ。"}, {"t": 88.46666666666667, "x": "育つの質問はこうです。"}, {"t": 90.25, "x": "うまくいく関係は努力と、合わないところの\n解決を通して育つ。"}, {"t": 94.81666666666666, "x": "ここで大事な点があります。"}, {"t": 96.7, "x": "この2つは、1本の線の両はしではありません。"}, {"t": 100.25, "x": "別々の物差しなのです。"}, {"t": 102.11666666666666, "x": "1つ目の調査でも、2つの考えの\n点数には、はっきりした関係がありませんでした。"}, {"t": 108.26666666666667, "x": "男性か女性かとも、はっきりした\n関係はなかったのです。"}, {"t": 112.25, "x": "両方が強い人もいれば、両方が弱い人もいます。"}, {"t": 116.13333333333334, "x": "論文はこれを暗黙の考えと呼びます。"}, {"t": 118.9, "x": "強く持っているのに、ふだん言葉にすることは\nめったにない。"}, {"t": 122.83333333333333, "x": "そういう考えだからです。"}, {"t": 124.58333333333333, "x": "この考え方を最初に示したのは、\nニーの1998年の論文でした。"}, {"t": 130.36666666666667, "x": "2004年の論文は、その結果をこうまとめています。"}, {"t": 134.15, "x": "まずは育つの考えが強い人の話です。"}, {"t": 137.13333333333333, "x": "大学に入って最初の1か月に、\n一夜限りの関係が少なかった。"}, {"t": 142.13333333333333, "x": "同じ相手と長く付き合っていた。"}, {"t": 144.35, "x": "問題が起きたときに関係を保ち直そうとすることが\n多かった。"}, {"t": 148.53333333333333, "x": "次は運命の考えです。"}, {"t": 150.46666666666667, "x": "運命だと思えた関係は、とくに長く続いていました。"}, {"t": 154.4, "x": "ただし早い時期に問題が起きたときや、\n最初の満足が低いとき。"}, {"t": 159.23333333333332, "x": "運命の考えが強い人は、関係から\n身を引きやすかったのです。"}, {"t": 163.75, "x": "合わないなら運命の相手ではない。"}, {"t": 166.05, "x": "そう受け取りやすいのかもしれません。"}, {"t": 168.3, "x": "ここで新しい問いが出てきます。"}, {"t": 170.41666666666666, "x": "付き合っていれば、意見の違いは必ず出てきます。"}, {"t": 173.85, "x": "その言い合いのあと、気持ちはどうなるのか。"}, {"t": 176.85, "x": "2004年の論文はそこを調べました。"}, {"t": 179.53333333333333, "x": "けんかは関係に悪い。"}, {"t": 181.3, "x": "ふつうはそう考えますよね。"}, {"t": 183.25, "x": "でも論文は、そこに一つの問いを立てました。"}, {"t": 186.45, "x": "同じ言い合いでも、受け止め方は\n人によって違うはずだ。"}, {"t": 190.33333333333334, "x": "育つの考えなら、言い合いは\n近づくための道のりです。"}, {"t": 194.3, "x": "乗り越えれば関係はもっと強くなる。"}, {"t": 196.81666666666666, "x": "いっぽう運命の考えでは、少し事情が変わります。"}, {"t": 200.66666666666666, "x": "言い合いが、運命の相手ではない印に\n見えるかもしれない。"}, {"t": 204.7, "x": "でも論文は逆の見方も書いています。"}, {"t": 207.31666666666666, "x": "満たされた関係なら、運命の\n考えは特別な意味を与える。"}, {"t": 211.8, "x": "この関係は特別で大事だと思える。"}, {"t": 214.5, "x": "それで言い合いを軽く見られるかもしれない。"}, {"t": 217.06666666666666, "x": "つまり運命の考えは、どちらにも転びうるのです。"}, {"t": 220.68333333333334, "x": "論文が見たのは、関係を続けたいという\n気持ちでした。"}, {"t": 224.5, "x": "どれくらい長く続いてほしいか、保ちたいと思うか。"}, {"t": 228.23333333333332, "x": "そうした思いが、言い合いのあとでどう動くかです。"}, {"t": 231.51666666666668, "x": "これを2つの調査で確かめました。"}, {"t": 233.93333333333334, "x": "1つ目の調査は、日記のような記録でした。"}, {"t const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
