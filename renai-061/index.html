<script>
const D={"name": "親の介護が始まった日から夫婦の間で何が変わるのか", "file": "061_親の介護が始まった日から夫婦の間で何が変わるのか", "dur": 831.4333125, "segs": [], "subs": [{"t": 0.0, "x": "親の介護が始まった日から、\n夫婦の間で変わるものがあります。"}, {"t": 4.466666666666667, "x": "増えるのは、用事と移動と電話の回数\nだけではありません。"}, {"t": 8.516666666666667, "x": "二人が同じ方向を向いている\n時間が、少しずつ減っていきます。"}, {"t": 13.0, "x": "男は、その日を片づけるべき\n問題として受け取りやすいです。"}, {"t": 17.183333333333334, "x": "女は、その日を長く続く暮らしの\n変わり目として受け取りやすいです。"}, {"t": 21.733333333333334, "x": "どちらの受け取り方も、同じ\nくらい重い荷物を背負っています。"}, {"t": 25.9, "x": "ただ、持ち方が違うので、相手の重さが\n見えにくくなります。"}, {"t": 30.3, "x": "見えないまま日が過ぎると、\n話はいつのまにか比べ合いに変わります。"}, {"t": 34.95, "x": "どちらが大変か。"}, {"t": 36.31666666666667, "x": "どちらが我慢しているか。"}, {"t": 37.983333333333334, "x": "どちらの親の話か。"}, {"t": 39.583333333333336, "x": "比べ合いになった時点で、た\nいてい二人とも損をします。"}, {"t": 43.56666666666667, "x": "親のことは待ってくれないのに、\n夫婦の話は後回しにされるからです。"}, {"t": 48.483333333333334, "x": "今日は、介護が始まった家で夫婦の間に起\nきやすいことを並べます。"}, {"t": 53.31666666666667, "x": "先に言っておくと、介護のや\nり方や制度の話はここでは扱いません。"}, {"t": 58.31666666666667, "x": "それは家ごとに事情が違い、\n専門の人に聞いた方が確かだからです。"}, {"t": 63.333333333333336, "x": "扱うのは、二人の間の話し方と、\n疲れの置き場所だけです。"}, {"t": 68.15, "x": "介護の始まりは、ある日の一本の電話で\nあることが多いようです。"}, {"t": 72.56666666666666, "x": "転んだ。"}, {"t": 73.65, "x": "入院した。"}, {"t": 74.65, "x": "最近ようすが少しおかしい。"}, {"t": 76.76666666666667, "x": "知らせの形はいろいろでも、\nその夜から家の空気が変わります。"}, {"t": 81.05, "x": "男は、電話を切った直後から\n段取りを考え始めやすいです。"}, {"t": 85.56666666666666, "x": "いつ行くか。"}, {"t": 86.43333333333334, "x": "誰に連絡するか。"}, {"t": 87.83333333333333, "x": "仕事をどう空けるか。"}, {"t": 89.28333333333333, "x": "決めることを並べると、少し\nだけ気持ちが落ち着くようです。"}, {"t": 93.3, "x": "一方で女は、電話の後にまず\n先の暮らしを思い浮かべやすいです。"}, {"t": 98.15, "x": "この先どうなるのか。"}, {"t": 100.06666666666666, "x": "実家はどうなるのか。"}, {"t": 101.56666666666666, "x": "毎日がどう変わるのか。"}, {"t": 103.3, "x": "並べているのが、決めることでは\nなく続いていくことなのです。"}, {"t": 107.2, "x": "同じ夜に同じ知らせを受けても、\n見ている先が違います。"}, {"t": 111.18333333333334, "x": "段取りの話をされた側は、気持ちを\n置き去りにされたと感じます。"}, {"t": 115.75, "x": "先の不安を話された側は、今それを\n言われても困ると感じます。"}, {"t": 120.38333333333334, "x": "どちらも冷たいのではありません。"}, {"t": 122.53333333333333, "x": "怖さを小さくする方法が、それぞれ違うだけなのです。"}, {"t": 126.43333333333334, "x": "この最初の夜のずれが、後の何か月にも\n少しずつ響いていきます。"}, {"t": 131.13333333333333, "x": "自分の親の介護が始まると、\n気持ちが二つに割れやすくなります。"}, {"t": 135.8, "x": "親を守りたい気持ちと、配偶者に申\nし訳ない気持ちです。"}, {"t": 139.98333333333332, "x": "これは男でも女でも、同じくらいの\n重さで起きることがあります。"}, {"t": 144.43333333333334, "x": "男は、弱っていく親の姿を配偶者に見\nせたくないことがあります。"}, {"t": 149.25, "x": "親の威厳を守りたい。"}, {"t": 150.88333333333333, "x": "頼りない家だと思われたくない。"}, {"t": 153.11666666666667, "x": "自分で何とかしたい。"}, {"t": 154.61666666666667, "x": "だから、実家の様子を細かく話さずに\n一人で通いやすいようです。"}, {"t": 159.25, "x": "一方で女は、頼ることそのものに\n引け目を感じやすい場合があります。"}, {"t": 164.2, "x": "仕事を休ませる。"}, {"t": 165.55, "x": "週末をつぶす。"}, {"t": 166.9, "x": "相手の予定を何度も変えさせる。"}, {"t": 169.16666666666666, "x": "頼むたびに、借りを作ってい\nるような気分になると言われます。"}, {"t": 173.26666666666668, "x": "話さない側は、配偶者を巻き込\nまない優しさのつもりでいます。"}, {"t": 177.75, "x": "頼めない側は、相手の暮らしを\n守っているつもりでいます。"}, {"t": 181.7, "x": "ところが相手から見ると、どちらも\n締め出されたように映ります。"}, {"t": 185.83333333333334, "x": "何も知らされない家族ほど、\n手の出し方が分からなくなります。"}, {"t": 189.96666666666667, "x": "遠慮で閉じた扉は、外からは\n拒まれた扉と区別がつきません。"}, {"t": 194.55, "x": "反対に、相手の親の介護が始\nまった側にも別の重さがあります。"}, {"t": 199.41666666666666, "x": "手伝いたい気持ちはあっても、\nどこまで入っていいか分からないのです。"}, {"t": 203.83333333333334, "x": "男は、役に立てる場所を探して動こうとしやすいです。"}, {"t": 207.73333333333332, "x": "車を出す。"}, {"t": 208.73333333333332, "x": "重い物を運ぶ。"}, {"t": 210.03333333333333, "x": "手続きの書類を読む。"}, {"t": 211.63333333333333, "x": "形の見える手伝いなら、迷わ\nずに引き受けられるようです。"}, {"t": 215.65, "x": "一方で女は、口を出していいのかどうかで\n迷いやすい場合があります。"}, {"t": 220.5, "x": "実家のやり方がある。"}, {"t": 222.06666666666666, "x": "兄弟姉妹の考えもある。"}, {"t": 224.03333333333333, "x": "自分は外の人間かもしれない。"}, {"t": 226.26666666666668, "x": "気をつかうほど、黙って待つ時間が長\nくなっていきます。"}, {"t": 230.11666666666667, "x": "どちらも、相手の家族を大事に\nしようとしているのは同じです。"}, {"t": 234.31666666666666, "x": "ただ、手伝う側の疲れは、誰からも\n数えられにくい性質があります。"}, {"t": 239.46666666666667, "x": "自分の親ではないので、つらいと\n言うと冷たく聞こえそうだからです。"}, {"t": 243.93333333333334, "x": "言えない疲れは、ある日まと\nめて態度に出てしまいます。"}, {"t": 247.5, "x": "手伝う側に要るのは、お礼よりも\n先に居場所なのかもしれません。"}, {"t": 251.9, "x": "どこまで任せてもらえるかが分かると、\n遠慮の疲れはかなり減ります。"}, {"t": 256.53333333333336, "x": "介護が長くなると、疲れの出方に違いが\n見えてきます。"}, {"t": 260.6333333333333, "x": "男は、疲れるほど口数が減っていきやすいです。"}, {"t": 264.15, "x": "帰ってきて黙る。"}, {"t": 265.46666666666664, "x": "食事の間も考え込む。"}, {"t": 267.43333333333334, "x": "休みの日に一人で出かける。"}, {"t": 269.25, "x": "黙るのは、頭の中で段取りを\n回し続けているからのようです。"}, {"t": 273.5833333333333, "x": "一方で女は、疲れるほど話し\nて外に出したくなりやすいです。"}, {"t": 278.0, "x": "今日あったこと。"}, {"t": 279.1, "x": "気になったこと。"}, {"t": 280.2, "x": "これから心配なこと。"}, {"t": 281.78333333333336, "x": "話すことで、頭の中の荷物を少\nしずつ下ろしている形です。"}, {"t": 286.21666666666664, "x": "黙る側から見ると、話し続け\nる相手はまだ余裕があるように見えます。"}, {"t": 291.18333333333334, "x": "話す側から見ると、黙ってい\nる相手は無関心に見えてしまいます。"}, {"t": 295.8833333333333, "x": "実際には、どちらも同じくら\nい消耗していることが多いのです。"}, {"t": 300.2, "x": "疲れていないから話すのではなく、\n疲れているから話すのです。"}, {"t": 304.45, "x": "疲れていないから黙るのではなく、\n疲れているから黙るのです。"}, {"t": 308.6166666666667, "x": "出口が逆向きなだけで、たま\nっている量は変わりません。"}, {"t": 312.4166666666667, "x": "この逆向きを知らないと、次の比\nべ合いが始まってしまいます。"}, {"t": 316.81666666666666, "x": "どちらが大変かの比べ合いは、\n介護のある家でとても起きやすいです。"}, {"t": 321.55, "x": "通った回数。"}, {"t": 322.7, "x": "休んだ日数。"}, {"t": 323.85, "x": "夜に呼び出された回数。"}, {"t": 325.6333333333333, "x": "数えやすいものから、順番に並\nべて比べてしまいます。"}, {"t": 329.5833333333333, "x": "男は、目に見える働きの量で比べやすいと\n言われます。"}, {"t": 333.6166666666667, "x": "何回行った。"}, {"t": 334.68333333333334, "x": "いくら使った。"}, {"t": 335.76666666666665, "x": "何を片づけた。"}, {"t": 337.0, "x": "一方で女は、気が休まらない時間の長さで\n比べやすい場合があります。"}, {"t": 342.18333333333334, "x": "電話を待つ。"}, {"t": 343.23333333333335, "x": "夜中に目が覚める。"}, {"t": 344.55, "x": "ずっと頭のどこかにある。"}, {"t": 346.31666666666666, "x": "量で比べる側と、時間で比べ\nる側では、答えが一致しません。"}, {"t": 351.1, "x": "一致しないので、いつまでた\nっても決着がつかないのです。"}, {"t": 355.0, "x": "そして、決着がつかない比べ合\nいには勝った人がいません。"}, {"t": 359.01666666666665, "x": "本当は、大変なのはお互いさ\nまだと二人とも分かっています。"}, {"t": 363.3, "x": "分かっているのに比べてしま\nうのは、分かってほしいからです。"}, {"t": 367.18333333333334, "x": "比べたいのではありません。"}, {"t": 368.93333333333334, "x": "見ていてほしいだけなのです。"}, {"t": 370.73333333333335, "x": "その一言が言えれば、数の並\nべ合いはたいてい要らなくなります。"}, {"t": 375.01666666666665, "x": "介護が始まると、お金の話が急に重\nたいものになりやすいです。"}, {"t": 379.75, "x": "交通費。"}, {"t": 380.68333333333334, "x": "付き添いで休んだ分。"}, {"t": 382.18333333333334, "x": "細かな買い物の積み重ね。"}, {"t": 384.1666666666667, "x": "一つ一つは小さくても、先が見\nえないことが重さの正体です。"}, {"t": 388.8, "x": "男は、先に総額を見積もって\n決めてしまいたくなりやすいです。"}, {"t": 393.0833333333333, "x": "いくらまで出せるか。"}, {"t": 394.3833333333333, "x": "どこから出すか。"}, {"t": 395.5, "x": "いつまで続けられるか。"}, {"t": 397.03333333333336, "x": "数字が決まると、それだけで少し安心できるようです。"}, {"t": 400.8833333333333, "x": "一方で女は、誰がどれだけ出すかの\n釣り合いを気にしやすい場合があります。"}, {"t": 406.05, "x": "自分の親だから多めに出すべきか。"}, {"t": 408.4, "x": "相手の家計に食い込んでいないか。"}, {"t": 410.6333333333333, "x": "数字よりも、後で気まずくな\nらないかの方が気になるのです。"}, {"t": 414.6166666666667, "x": "見積もりの話をされた側は、\n親を値段で見られたように感じます。"}, {"t": 419.21666666666664, "x": "釣り合いの話をされた側は、\n細かく疑われたように感じます。"}, {"t": 423.65, "x": "どちらも、家の暮らしを守ろ\nうとしている点では同じです。"}, {"t": 427.6, "x": "お金の話がこじれるのは、額よ\nりも話す順番がずれた時です。"}, {"t": 432.23333333333335, "x": "先に気持ちを聞いてから数字に移\nると、角が立ちにくくなります。"}, {"t": 436.76666666666665, "x": "介護は、夫婦だけでなく兄弟姉妹との\n話にもなっていきます。"}, {"t": 441.26666666666665, "x": "近くに住んでいる人。"}, {"t": 442.8, "x": "遠くに住んでいる人。"}, {"t": 444.3333333333333, "x": "口だけ出す人。"}, {"t": 445.56666666666666, "x": "その間で、夫婦のどちらかが\n板挟みになりやすいのです。"}, {"t": 450.1166666666667, "x": "男は、兄弟姉妹の中での立場から\n役目を引き受けやすいです。"}, {"t": 454.6666666666667, "x": "上だから。"}, {"t": 455.48333333333335, "x": "近いから。"}, {"t": 456.31666666666666, "x": "前から頼られてきたから。"}, {"t": 458.05, "x": "断る理由を探すより先に、引\nき受けてしまうことがあるようです。"}, {"t": 462.55, "x": "一方で女は、動いた量と言わ\nれることのずれに引っかかりやすいです。"}, {"t": 467.28333333333336, "x": "通っているのに感謝されない。"}, {"t": 469.2, "x": "来ない人ほど意見が強い。"}, {"t": 471.01666666666665, "x": "決め事だけ回ってくる。"}, {"t": 472.6666666666667, "x": "そのずれを、配偶者にだけは\n分かってほしいと思いやすいのです。"}, {"t": 477.01666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
