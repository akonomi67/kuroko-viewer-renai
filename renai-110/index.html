<script>
const D={"name": "相手に合わせた日の気持ちは_合わせた理由で分かれた", "file": "110_相手に合わせた日の気持ちは_合わせた理由で分かれた", "dur": 831.7333125, "segs": [], "subs": [{"t": 0.0, "x": "好きな人に合わせる。"}, {"t": 1.4166666666666667, "x": "見たかった映画をあきらめて、\n相手の見たいほうにする。"}, {"t": 4.983333333333333, "x": "友だちとの約束を断って、恋人と過ごす。"}, {"t": 8.5, "x": "こうしたことは良いことだと思われやすいですよね。"}, {"t": 11.633333333333333, "x": "でも合わせたあとに、もやもやが残る日もあります。"}, {"t": 15.033333333333333, "x": "同じように合わせたのに、なにが違うのでしょうか。"}, {"t": 18.5, "x": "それを調べた研究があります。"}, {"t": 20.633333333333333, "x": "アメリカの心理学者、エミリー・インペットたちの\n論文です。"}, {"t": 24.666666666666668, "x": "2005年に、専門の学術誌に載りました。"}, {"t": 28.133333333333333, "x": "今日はこの論文を一緒に読んでいきます。"}, {"t": 30.8, "x": "報告によると、分かれ目は合わせた理由でした。"}, {"t": 34.3, "x": "相手を喜ばせたい、仲を深めたいという\n理由で合わせた日。"}, {"t": 38.53333333333333, "x": "その日は、気持ちも関係の感じ方も良い向きでした。"}, {"t": 42.333333333333336, "x": "いっぽう言い合いを避けたいという理由で\n合わせた日。"}, {"t": 45.516666666666666, "x": "その日は逆の向きになっていたのです。"}, {"t": 47.93333333333333, "x": "今日の話は、合わせるのが良いか\n悪いかではありません。"}, {"t": 51.68333333333333, "x": "なぜ合わせたのか。"}, {"t": 52.96666666666667, "x": "その理由の話です。"}, {"t": 54.53333333333333, "x": "論文の書き出しは、2つの考えのぶつかり合いです。"}, {"t": 58.28333333333333, "x": "人に尽くすことを大事にする考えと、\n自分の自由を大事にする考え。"}, {"t": 63.45, "x": "恋人との暮らしでは、この分かれ道によく立つと\n論文は書いています。"}, {"t": 68.1, "x": "そのうえで論文は、研究の2つの見方を\n紹介しています。"}, {"t": 72.41666666666667, "x": "1つ目は、合わせることには良い面が\nあるという見方です。"}, {"t": 76.28333333333333, "x": "相手のために合わせられる人ほど、\n関係に満足しやすい。"}, {"t": 80.43333333333334, "x": "関係が長く続きやすいという報告もありました。"}, {"t": 83.9, "x": "2つ目は、合わせすぎは危ないという見方です。"}, {"t": 87.25, "x": "自分の本当の望みを押さえこむと、\n心が苦しくなりやすい。"}, {"t": 91.6, "x": "関係への満足も下がりやすいという報告です。"}, {"t": 94.86666666666666, "x": "どちらにも研究の裏づけがありました。"}, {"t": 97.46666666666667, "x": "では、どちらが正しいのでしょうか。"}, {"t": 99.91666666666667, "x": "論文はどちらかを選ぶのではありません。"}, {"t": 102.53333333333333, "x": "両方をつなぐ見方を出しました。"}, {"t": 104.76666666666667, "x": "同じように合わせても、理由によって結果が\n違うのではないか。"}, {"t": 109.06666666666666, "x": "これが、この論文の中心にある考えです。"}, {"t": 112.28333333333333, "x": "まずは言葉をそろえておきます。"}, {"t": 114.33333333333333, "x": "論文が調べたのは、目先の自分の\n望みを手放すことです。"}, {"t": 118.48333333333333, "x": "相手のため、2人の関係のためにそうすることです。"}, {"t": 122.11666666666666, "x": "これには2つの形があります。"}, {"t": 124.25, "x": "したくないことをする形。"}, {"t": 126.01666666666667, "x": "したいことをあきらめる形です。"}, {"t": 128.08333333333334, "x": "大きなものでは、相手の仕事のために\n新しい街へ移ること。"}, {"t": 132.5, "x": "小さなものでは、どのテレビ番組を見るか。"}, {"t": 135.58333333333334, "x": "誰の友だちと出かけるか。"}, {"t": 137.35, "x": "論文はこうした例を挙げています。"}, {"t": 139.65, "x": "そして理由を大きく2つに分けました。"}, {"t": 142.26666666666668, "x": "一つは近づく理由です。"}, {"t": 144.06666666666666, "x": "相手を幸せにしたい、2人の\n仲を深めたいという理由です。"}, {"t": 148.48333333333332, "x": "もう一つは避ける理由です。"}, {"t": 150.36666666666667, "x": "言い合いを避けたい、\n相手にがっかりされたくないという理由です。"}, {"t": 154.45, "x": "論文はこんな例えで説明しています。"}, {"t": 157.08333333333334, "x": "妻を喜ばせたくて合わせた夫がいます。"}, {"t": 159.83333333333334, "x": "愛情を示せたと満足できるかもしれない。"}, {"t": 162.68333333333334, "x": "妻をがっかりさせたくなくて合わせた夫もいます。"}, {"t": 165.73333333333332, "x": "こちらには恨みが残るかもしれない。"}, {"t": 168.1, "x": "ただし、これはまだ予想です。"}, {"t": 170.3, "x": "それを確かめるために、2つの\n調査がおこなわれました。"}, {"t": 174.23333333333332, "x": "1つ目の調査は、カリフォルニア大学\nロサンゼルス校の学生が対象です。"}, {"t": 179.43333333333334, "x": "男性45人と女性77人でした。"}, {"t": 182.75, "x": "年齢は18歳から37歳で、平均は19.8歳です。"}, {"t": 188.0, "x": "みんな今、誰かと付き合っている人たちです。"}, {"t": 191.06666666666666, "x": "付き合った長さは、平均で1年7か月でした。"}, {"t": 194.75, "x": "参加すると、心理学の授業の\n加点がもらえる仕組みでした。"}, {"t": 198.98333333333332, "x": "まずは、相手に合わせたことを書き出してもらいます。"}, {"t": 202.35, "x": "したくなかったのにしたことを10個まで。"}, {"t": 204.76666666666668, "x": "したかったのにあきらめたことも10個まで。"}, {"t": 207.36666666666667, "x": "1人あたり平均で10個が挙がりました。"}, {"t": 210.03333333333333, "x": "集まったのは全部で1221個です。"}, {"t": 213.11666666666667, "x": "これを中身ごとに分けました。"}, {"t": 215.06666666666666, "x": "一度でも書いた人の割合を見ていきます。"}, {"t": 217.85, "x": "いちばん多かったのは友だちのことで87%でした。"}, {"t": 221.91666666666666, "x": "彼の友だちのパーティーに行った。"}, {"t": 224.1, "x": "自分の友だちとの約束を取り消した。"}, {"t": 226.7, "x": "そんな例です。"}, {"t": 227.75, "x": "次が遊びや趣味で、86%でした。"}, {"t": 231.31666666666666, "x": "ロサンゼルスの車の見本市に行った、という\n例もあります。"}, {"t": 235.4, "x": "用事や家事や頼まれごとが65%です。"}, {"t": 238.81666666666666, "x": "彼の服にアイロンをかけた、という例もありました。"}, {"t": 242.25, "x": "家族のことが56%でした。"}, {"t": 244.88333333333333, "x": "話すことや一緒に過ごすことが49%です。"}, {"t": 248.5, "x": "贈り物やお金のことは33%でした。"}, {"t": 251.98333333333332, "x": "引っ越しのような大きな合わせごとは9%だけです。"}, {"t": 255.68333333333334, "x": "多くは、毎日の暮らしの中の\n小さなものだったのです。"}, {"t": 259.56666666666666, "x": "この調査では、理由をたずねる質問も作りました。"}, {"t": 263.25, "x": "近づく理由の例は、相手に幸せでいてほしいから。"}, {"t": 267.05, "x": "避ける理由の例は、相手の怒りのような\n悪い結果を避けたいから。"}, {"t": 271.56666666666666, "x": "合わせないと\n罪悪感があるから、というものもあります。"}, {"t": 275.23333333333335, "x": "それぞれの理由で、どれくらい\n合わせるかを5段階で答えます。"}, {"t": 279.5, "x": "平均を見ると、近づく理由のほうが\n強く選ばれていました。"}, {"t": 284.01666666666665, "x": "5段階で4.07と2.55です。"}, {"t": 286.98333333333335, "x": "そしてここが大事な点です。"}, {"t": 288.8666666666667, "x": "近づく理由の点と避ける理由の点には、\n関係がありませんでした。"}, {"t": 293.56666666666666, "x": "片ほうが強い人でも、もう片ほうが\n弱いとは限らないのです。"}, {"t": 297.93333333333334, "x": "さらに関係への満足との結びつきも見ました。"}, {"t": 301.15, "x": "近づく理由は、満足と同じ向きに\n結びついていました。"}, {"t": 305.23333333333335, "x": "避ける理由は満足と逆の向きでした。"}, {"t": 307.9, "x": "ただ、これは一度きりの答えです。"}, {"t": 310.43333333333334, "x": "そこで2つ目の調査では、毎日の記録で確かめました。"}, {"t": 314.55, "x": "2つ目の調査が、この論文の中心です。"}, {"t": 317.6666666666667, "x": "同じ大学の学生が14日間、毎晩記録をつけました。"}, {"t": 322.1333333333333, "x": "始めたのは161人です。"}, {"t": 324.5833333333333, "x": "期限どおりに3日以上を出せた\n153人が、分析に残りました。"}, {"t": 329.6, "x": "男性69人と女性84人です。"}, {"t": 332.8833333333333, "x": "年齢は18歳から38歳で、平均は20.1歳でした。"}, {"t": 338.03333333333336, "x": "条件は週に5日以上、相手と会っていることです。"}, {"t": 341.71666666666664, "x": "遠距離の2人は入っていません。"}, {"t": 343.9166666666667, "x": "記録は14冊の小さな冊子でした。"}, {"t": 346.68333333333334, "x": "毎晩、寝る前に1冊ずつ書きます。"}, {"t": 349.6, "x": "書いた冊子は2日か3日ごとに出します。"}, {"t": 352.26666666666665, "x": "出す先は、研究室の外にある\n鍵のかかった郵便受けです。"}, {"t": 356.6166666666667, "x": "期限どおりに出すと、くじが1枚もらえました。"}, {"t": 359.9166666666667, "x": "賞金は100ドル、50ドル、2 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
