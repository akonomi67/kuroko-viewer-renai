<script>
const D={"name": "相談の順番が逆_恋の悩みを話す相手とタイミングは男女で逆", "file": "093_相談の順番が逆_恋の悩みを話す相手とタイミングは男女で逆", "dur": 821.0833125, "segs": [], "subs": [{"t": 0.0, "x": "片思いの相手や恋人のことで悩んだ時、\n友達に話す場面があります。"}, {"t": 5.35, "x": "今日はその恋の悩みを誰にいつ\n話すかの違いを見ていきます。"}, {"t": 9.433333333333334, "x": "先に答えを言っておきます。"}, {"t": 11.35, "x": "男女で話す順番が逆になっていることが多いです。"}, {"t": 14.783333333333333, "x": "男は心が決まってから、ようやく誰かに\n話しやすいです。"}, {"t": 18.916666666666668, "x": "女は心が決まる前に、まず誰かに話しやすいです。"}, {"t": 22.933333333333334, "x": "男は話す相手をひとりか二人にしぼります。"}, {"t": 25.966666666666665, "x": "女は数人に少しずつ聞いてもらいます。"}, {"t": 28.816666666666666, "x": "男は話したあとすぐに動き出します。"}, {"t": 31.366666666666667, "x": "女は話したあと、しばらく気持ちを温めます。"}, {"t": 34.916666666666664, "x": "この違いを知らないと、相手の動きが\n急に見えたり遅く見えたりします。"}, {"t": 39.78333333333333, "x": "友達に先に話されたことで、\n信用されていないと感じることもあります。"}, {"t": 44.9, "x": "でも順番が違うのは、気持ちの\n深さの差ではありません。"}, {"t": 48.81666666666667, "x": "悩みの抱えかたが、男女で少し違うだけなのです。"}, {"t": 52.516666666666666, "x": "ここからは話す時期と相手と話したあとの\n順に見ていきます。"}, {"t": 56.483333333333334, "x": "恋の悩みを人に話す時期は、男女でずれやすいです。"}, {"t": 60.36666666666667, "x": "男は悩みが形になるまで、ひとりで\n抱えることが多いと言われます。"}, {"t": 65.15, "x": "告白するかどうか。"}, {"t": 66.61666666666666, "x": "付き合い続けるかどうか。"}, {"t": 68.3, "x": "連絡を待つかどうか。"}, {"t": 69.85, "x": "そういう迷いをまず頭の中で片付けようとします。"}, {"t": 73.31666666666666, "x": "答えがほぼ出たところで、ようやく友達に話します。"}, {"t": 77.05, "x": "一方で女は迷っている途中で話し始めやすいです。"}, {"t": 80.8, "x": "まだ決まっていない段階で、気になる\n人がいるという話から切り出します。"}, {"t": 85.65, "x": "話しながら、自分の気持ちを\n少しずつ整えていきます。"}, {"t": 89.63333333333334, "x": "男にとって打ち明けることは、\n決めたことの報告に近いです。"}, {"t": 93.78333333333333, "x": "女にとって打ち明けることは、\n決めるための作業に近いです。"}, {"t": 97.85, "x": "同じ打ち明け話でも置かれている場所が違います。"}, {"t": 101.11666666666666, "x": "ゴールの手前で話すか、スタートの手前で話すか。"}, {"t": 104.7, "x": "この違いがこのあとの全部の場面に響いてきます。"}, {"t": 108.0, "x": "どちらが正しいという話ではありません。"}, {"t": 110.65, "x": "悩みを外に出す時期が、前と後ろに\n分かれているだけなのです。"}, {"t": 114.88333333333334, "x": "まずは話す相手の数から見ていきます。"}, {"t": 117.55, "x": "話す時期が違うと、話す相手の数も変わってきます。"}, {"t": 121.46666666666667, "x": "男が恋の悩みを\n話す相手は、かなり少なくなりやすいです。"}, {"t": 125.83333333333333, "x": "古くからの親友がひとり。"}, {"t": 127.71666666666667, "x": "同じ職場の先輩がひとり。"}, {"t": 129.76666666666668, "x": "多くてもそのくらいで止まることがあります。"}, {"t": 132.4, "x": "相手を増やすほど、話が広まる\n心配が大きくなるからです。"}, {"t": 136.73333333333332, "x": "決まってから話すので、たくさんの\n声はもう要らないという面もあります。"}, {"t": 141.38333333333333, "x": "一方で女は打ち明ける相手が広がりやすいです。"}, {"t": 144.78333333333333, "x": "学生時代からの友達。"}, {"t": 146.75, "x": "職場で仲のいい同僚。"}, {"t": 148.51666666666668, "x": "姉や妹、ときには母親。"}, {"t": 151.01666666666668, "x": "そういう数人に、それぞれ少しずつ話します。"}, {"t": 154.45, "x": "相手ごとに違う角度の返事がもらえるからです。"}, {"t": 157.53333333333333, "x": "ひとつの悩みを、いろいろな\n光に当てて見たいのです。"}, {"t": 161.11666666666667, "x": "男から見ると、そんなに話して大丈夫かと\n心配になることがあります。"}, {"t": 166.06666666666666, "x": "女から見ると、ひとりにしか話さないのは\n寂しくないのかと不思議になります。"}, {"t": 171.15, "x": "でも数の違いは、口の軽さや\n重さの違いではありません。"}, {"t": 175.3, "x": "男は少ない声で確かめたいのです。"}, {"t": 177.86666666666667, "x": "女は多くの声で形を見たいのです。"}, {"t": 180.56666666666666, "x": "次はその相手の選びかたです。"}, {"t": 182.73333333333332, "x": "相手の選びかたにも、男女で別の物差しがあります。"}, {"t": 186.53333333333333, "x": "男はその分野に詳しそうな人を選びやすいです。"}, {"t": 189.95, "x": "恋愛の経験が多い友達。"}, {"t": 192.23333333333332, "x": "結婚している先輩。"}, {"t": 193.88333333333333, "x": "同じような状況を乗り越えた知り合い。"}, {"t": 196.46666666666667, "x": "そういう答えを持っていそうな人に話します。"}, {"t": 199.33333333333334, "x": "男にとって大事なのは相手の経験の量です。"}, {"t": 202.53333333333333, "x": "一方で女は自分のことをよく知っている\n人を選びやすいです。"}, {"t": 206.65, "x": "昔の恋も知っている友達。"}, {"t": 208.78333333333333, "x": "性格のくせを分かっている姉。"}, {"t": 210.95, "x": "落ち込んだ時の顔を見てきた同僚。"}, {"t": 213.31666666666666, "x": "恋愛に詳しいかどうかは、あまり問題になりません。"}, {"t": 217.01666666666668, "x": "自分という人間を分かったうえで\n聞いてくれるかが大事なのです。"}, {"t": 221.05, "x": "男は悩みの中身に強い人を探しています。"}, {"t": 224.23333333333332, "x": "女は悩んでいる自分に強い人を探しています。"}, {"t": 227.58333333333334, "x": "だから男の相手は先輩になりやすいです。"}, {"t": 230.56666666666666, "x": "女の相手は古い友達になりやすいです。"}, {"t": 233.5, "x": "選びかたが違うと、同じ友達でも\n頼る場面が変わります。"}, {"t": 237.81666666666666, "x": "誰に話すかは受け取りたいものの裏返しなのです。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
