46}, {"t": 716.7666666666667, "i": 247}, {"t": 718.7666666666667, "i": 248}, {"t": 721.8833333333333, "i": 249}, {"t": 724.8333333333334, "i": 250}, {"t": 727.4833333333333, "i": 251}, {"t": 730.65, "i": 252}, {"t": 732.75, "i": 253}, {"t": 735.6666666666666, "i": 254}, {"t": 738.55, "i": 255}, {"t": 741.7666666666667, "i": 256}, {"t": 745.1333333333333, "i": 257}, {"t": 748.2666666666667, "i": 258}, {"t": 750.7833333333333, "i": 259}, {"t": 753.9333333333333, "i": 260}, {"t": 757.3833333333333, "i": 261}, {"t": 758.7333333333333, "i": 262}, {"t": 762.0, "i": 263}, {"t": 764.9833333333333, "i": 264}, {"t": 768.05, "i": 265}, {"t": 769.8666666666667, "i": 266}, {"t": 772.6666666666666, "i": 267}, {"t": 775.7, "i": 268}, {"t": 777.9666666666667, "i": 269}, {"t": 781.15, "i": 270}, {"t": 784.4666666666667, "i": 271}, {"t": 788.0333333333333, "i": 272}, {"t": 790.7166666666667, "i": 273}, {"t": 793.8666666666667, "i": 274}, {"t": 795.8666666666667, "i": 275}, {"t": 799.4, "i": 276}, {"t": 802.1666666666666, "i": 277}, {"t": 806.1833333333333, "i": 278}, {"t": 809.1666666666666, "i": 279}, {"t": 811.7, "i": 280}, {"t": 815.6166666666667, "i": 281}, {"t": 819.3, "i": 282}, {"t": 822.2166666666667, "i": 283}, {"t": 825.5, "i": 284}, {"t": 829.15, "i": 285}, {"t": 830.65, "i": 286}, {"t": 833.6333333333333, "i": 287}, {"t": 836.45, "i": 288}, {"t": 839.3666666666667, "i": 289}, {"t": 842.25, "i": 290}, {"t": 844.4, "i": 291}, {"t": 847.6666666666666, "i": 292}, {"t": 851.5166666666667, "i": 293}, {"t": 854.9333333333333, "i": 294}, {"t": 857.85, "i": 295}, {"t": 861.35, "i": 296}, {"t": 863.85, "i": 297}, {"t": 871.8333333333334, "i": 297}], "subs": [{"t": 0.0, "x": "好き同士なのに、うまくいかない関係があります。"}, {"t": 3.4166666666666665, "x": "気持ちは、どちらも十分にあります。"}, {"t": 6.083333333333333, "x": "それでも、一緒にいると苦しくなります。"}, {"t": 8.883333333333333, "x": "苦しくなる理由は、たいてい安心の\n作り方にあります。"}, {"t": 12.816666666666666, "x": "男は距離が保たれている時に、安心しやすいです。"}, {"t": 16.6, "x": "女は距離が近い時に、安心しやすいです。"}, {"t": 19.95, "x": "方向が逆なので、片方が安心すると片方が\n不安になります。"}, {"t": 24.7, "x": "不安になった側は、近づこうとします。"}, {"t": 27.55, "x": "近づかれた側は、また距離を取ろうとします。"}, {"t": 30.616666666666667, "x": "そこで、追う人と離れる人ができます。"}, {"t": 33.43333333333333, "x": "どちらも、相手を嫌っているわけではありません。"}, {"t": 36.61666666666667, "x": "自分が落ち着ける形に、戻ろうとしているだけです。"}, {"t": 40.13333333333333, "x": "戻ろうとする動きが、相手を不安にします。"}, {"t": 43.21666666666667, "x": "不安が不安を呼ぶ形になると、止まりません。"}, {"t": 46.583333333333336, "x": "止まらないまま、両方が疲れていきます。"}, {"t": 49.483333333333334, "x": "疲れた末に、合わないという結論が出ます。"}, {"t": 52.63333333333333, "x": "本当は、合わないのではありません。"}, {"t": 55.166666666666664, "x": "安心の形が、逆なだけです。"}, {"t": 57.666666666666664, "x": "今日は、この逆向きの仕組みを分けていきます。"}, {"t": 60.8, "x": "先に言うと、直すのは気持ちではありません。"}, {"t": 64.06666666666666, "x": "渡す情報の量と、間隔だけです。"}, {"t": 66.86666666666666, "x": "まず、言葉の中身をはっきりさせます。"}, {"t": 69.66666666666667, "x": "安心は、好かれている実感とは少し違います。"}, {"t": 73.2, "x": "安心の正体は、予測できることです。"}, {"t": 76.15, "x": "次にいつ会えるか。"}, {"t": 77.53333333333333, "x": "いつ返事が来るか。"}, {"t": 78.88333333333334, "x": "どんな時に、機嫌が悪くなるか。"}, {"t": 81.45, "x": "どれも、読めていれば落ち着きます。"}, {"t": 83.83333333333333, "x": "読めないと、頭のどこかが\n働き続けることがあります。"}, {"t": 87.71666666666667, "x": "働き続けると、他のことに集中できません。"}, {"t": 91.15, "x": "集中できない時間が、そのまま消耗になります。"}, {"t": 94.7, "x": "だから、愛情の量だけでは\n安心できないことがあります。"}, {"t": 98.55, "x": "どれだけ好きでも、読めなければ不安です。"}, {"t": 101.41666666666667, "x": "逆に、そこまで熱がなくても読めれば落ち着きます。"}, {"t": 104.98333333333333, "x": "男は生活の型が決まっていると、\n落ち着きやすいです。"}, {"t": 108.91666666666667, "x": "女は気持ちの向きが読めると、落ち着きやすいです。"}, {"t": 112.51666666666667, "x": "見ている対象は違いますが、原理は同じです。"}, {"t": 115.88333333333334, "x": "どちらも、読めることを求めています。"}, {"t": 118.53333333333333, "x": "求めているものが同じなら、渡し方も作れます。"}, {"t": 122.1, "x": "読めない相手を、責める必要はありません。"}, {"t": 125.2, "x": "読めるようにしてもらえば、それで足ります。"}, {"t": 127.98333333333333, "x": "頼み方も、短くて構いません。"}, {"t": 130.55, "x": "予定だけ先に教えてほしい、で伝わります。"}, {"t": 133.96666666666667, "x": "伝われば、たいていの人は応じてくれます。"}, {"t": 136.95, "x": "次に、片方の側を詳しく見ます。"}, {"t": 139.8, "x": "男は距離が近すぎると、\n落ち着かなくなりやすいです。"}, {"t": 143.6, "x": "理由は、逃げ場がなくなるからです。"}, {"t": 146.08333333333334, "x": "一人で考える時間が、確保できない。"}, {"t": 148.98333333333332, "x": "何をしていたか、常に説明が要る。"}, {"t": 151.75, "x": "そういう状態では、力が抜けません。"}, {"t": 154.6, "x": "力が抜けないので、家にいても休めません。"}, {"t": 157.9, "x": "休めない場所からは、離れたくなります。"}, {"t": 160.7, "x": "離れる形は、たいてい小さいです。"}, {"t": 163.41666666666666, "x": "返事が遅くなる。"}, {"t": 164.75, "x": "外出が増える。"}, {"t": 165.95, "x": "口数が減る。"}, {"t": 167.03333333333333, "x": "どれも、意図的ではありません。"}, {"t": 169.18333333333334, "x": "本人にも、理由が説明できないことがあります。"}, {"t": 172.66666666666666, "x": "説明されないので、相手には冷めたと\n映る場合があります。"}, {"t": 176.83333333333334, "x": "映った時点で、追いかけられます。"}, {"t": 179.28333333333333, "x": "追いかけられると、さらに離れたくなります。"}, {"t": 182.35, "x": "だから、離れる前に言葉にします。"}, {"t": 184.91666666666666, "x": "一人の時間が要る、とだけ伝えます。"}, {"t": 187.66666666666666, "x": "伝えてあれば、離れても誤解になりません。"}, {"t": 190.7, "x": "一人の時間を取ることは、拒否ではありません。"}, {"t": 193.85, "x": "拒否に見えるのは、説明がないからです。"}, {"t": 196.78333333333333, "x": "説明があれば、同じ行動でも意味が変わります。"}, {"t": 200.26666666666668, "x": "変わるものに、費用はかかりません。"}, {"t": 202.8, "x": "かからないものから、先に使います。"}, {"t": 205.45, "x": "反対側も、同じだけ見ておきます。"}, {"t": 208.18333333333334, "x": "女は距離が空くと、落ち着かなくなりやすいです。"}, {"t": 211.51666666666668, "x": "理由は、状況が読めなくなるからです。"}, {"t": 214.36666666666667, "x": "何を考えているのか分からない。"}, {"t": 216.6, "x": "理由の分からない沈黙が、いちばんつらいです。"}, {"t": 219.85, "x": "つらいので、確かめたくなります。"}, {"t": 222.21666666666667, "x": "確かめる形も、たいてい小さいです。"}, {"t": 225.05, "x": "連絡の回数が増える。"}, {"t": 226.78333333333333, "x": "話し合いを求める。"}, {"t": 228.21666666666667, "x": "どれも、関係を守るための動きです。"}, {"t": 231.01666666666668, "x": "守るための動きなのに、\n相手には要求として届くことがあります。"}, {"t": 235.56666666666666, "x": "届いた側は、応えられないと感じます。"}, {"t": 238.48333333333332, "x": "感じた側は、距離を取ります。"}, {"t": 240.8, "x": "取られると、さらに不安になります。"}, {"t": 243.45, "x": "そこで、同じ場所を回り始めます。"}, {"t": 246.16666666666666, "x": "回るのを止めるのは、量ではありません。"}, {"t": 249.26666666666668, "x": "先に情報を渡すことです。"}, {"t": 251.26666666666668, "x": "今日は疲れているから静かにする、と言う。"}, {"t": 254.33333333333334, "x": "理由が分かれば、沈黙は怖くありません。"}, {"t": 257.46666666666664, "x": "確かめたくなる気持ちも、責められません。"}, {"t": 260.3666666666667, "x": "不安なまま待つのは、想像よりつらいです。"}, {"t": 263.43333333333334, "x": "つらさを我慢し続けると、\n後で一度に出ることがあります。"}, {"t": 267.3833333333333, "x": "出る前に、必要な情報を求めて構いません。"}, {"t": 270.93333333333334, "x": "求め方だけ、責める形にしなければ大丈夫です。"}, {"t": 274.71666666666664, "x": "ここが、いちばん大事な部分です。"}, {"t": 277.1333333333333, "x": "不安になった時、人は自分が落ち着く方に動きます。"}, {"t": 281.06666666666666, "x": "男は距離を取る方向に動きます。"}, {"t": 283.5833333333333, "x": "女は距離を詰める方向に動きます。"}, {"t": 286.25, "x": "どちらも、自分を助ける動きです。"}, {"t": 288.85, "x": "けれども、相手にとっては逆です。"}, {"t": 291.3333333333333, "x": "助けようとした動きが、相手を不安にします。"}, {"t": 294.5833333333333, "x": "不安になった相手が、また逆に動きます。"}, {"t": 297.6166666666667, "x": "そこで、二人とも正しいのに\n悪化することがあります。"}, {"t": 301.35, "x": "悪化しているのに、原因が見えません。"}, {"t": 304.3, "x": "見えないので、相性の問題にされます。"}, {"t": 307.23333333333335, "x": "相性ではなく、順番の問題です。"}, {"t": 310.1, "x": "だから、動く前に一言はさみます。"}, {"t": 312.78333333333336, "x": "少し一人にしてほしい。"}, {"t": 314.45, "x": "少し話を聞いてほしい。"}, {"t": 316.31666666666666, "x": "どちらも、言えば伝わります。"}, {"t": 318.53333333333336, "x": "言わずに動くと、伝わりません。"}, {"t": 320.98333333333335, "x": "たった一言の差で、結果が変わります。"}, {"t": 323.9, "x": "自分がどちらに動く人かも、知っておきます。"}, {"t": 327.06666666666666, "x": "不安な時に、距離を取る人か。"}, {"t": 329.5, "x": "不安な時に、詰める人か。"}, {"t": 331.81666666666666, "x": "知っていれば、動く前に止まれます。"}, {"t": 334.4, "x": "止まれた回数だけ、悪化が減ります。"}, {"t": 337.23333333333335, "x": "役割についても、触れておきます。"}, {"t": 339.8666666666667, "x": "追う人と引く人は、性別で決まりません。"}, {"t": 342.85, "x": "男が追う側になることも、よくあります。"}, {"t": 345.76666666666665, "x": "女が距離を取る側になることも、\n同じくらいあります。"}, {"t": 349.45, "x": "決まるのは、その時の状況です。"}, {"t": 351.96666666666664, "x": "仕事が忙しい側が、引く側になります。"}, {"t": 355.06666666666666, "x": "不安が強い側が、追う側になります。"}, {"t": 357.93333333333334, "x": "だから、役割は入れ替わります。"}, {"t": 360.4, "x": "入れ替わることを、知っておくと楽です。"}, {"t": 363.1166666666667, "x": "今の形が、ずっと続くわけではありません。"}, {"t": 366.35, "x": "続かないので、今の苦しさも一時的です。"}, {"t": 369.6333333333333, "x const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
