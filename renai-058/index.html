<script>
const D={"name": "離れている時間の使い方が男女で逆になる", "file": "058_離れている時間の使い方が男女で逆になる", "dur": 817.06665625, "segs": [], "subs": [{"t": 0.0, "x": "離れて暮らす二人が続くかどうかは、\n距離では決まらないようです。"}, {"t": 4.216666666666667, "x": "会えない時間に、二人が別々の\nことをしているからです。"}, {"t": 8.216666666666667, "x": "男は、次に会う日までの日数を埋\nめようとしやすいと言われます。"}, {"t": 12.716666666666667, "x": "一方で女は、会わない日そのものを\n作り替えていきやすいようです。"}, {"t": 17.266666666666666, "x": "埋める側にとって、離れてい\nる時間は待つ時間になります。"}, {"t": 21.283333333333335, "x": "作り替える側にとって、離れ\nている時間は暮らす時間になります。"}, {"t": 25.75, "x": "どちらも相手のことを考えているのに、\n向いている先が逆になります。"}, {"t": 30.45, "x": "向きが逆のまま半年ほど過ぎると、\n会った日に温度がずれます。"}, {"t": 34.88333333333333, "x": "ずれた温度は、会った当日には言葉になりません。"}, {"t": 38.45, "x": "帰りの電車の中で、どこか噛\nみ合わなかったと気づく形が多いようです。"}, {"t": 43.35, "x": "これは気持ちが減ったから起きることではありません。"}, {"t": 46.38333333333333, "x": "時間の向きが逆なだけの場合があります。"}, {"t": 49.083333333333336, "x": "ここから先は、会えない間に何が起\nきているのかを順番に見ていきます。"}, {"t": 54.05, "x": "男に起きやすいことと、女に起\nきやすいことを同じ分だけ扱います。"}, {"t": 59.56666666666667, "x": "どちらかが冷たいという単純な話ではないようです。"}, {"t": 62.983333333333334, "x": "最後に、離れていても続いた\n人がしていたことを置いて終わります。"}, {"t": 67.36666666666666, "x": "離れて終わった二人を見ると、\n距離のせいにされがちです。"}, {"t": 71.18333333333334, "x": "実際に挙げられる理由は、だ\nいたい似たものになります。"}, {"t": 74.9, "x": "会えないから、話せないから、時間が合わないから。"}, {"t": 78.48333333333333, "x": "どれも本当のことですが、同\nじ条件で続いている人もいます。"}, {"t": 82.78333333333333, "x": "一方で、近くに住んでいても終わる二人はいます。"}, {"t": 86.4, "x": "毎日会える、すぐ行ける、いつでも話せる。"}, {"t": 89.91666666666667, "x": "条件だけを並べると、こちらのほうが有利に見えます。"}, {"t": 93.75, "x": "それでも終わるのは、距離が原因の本体では\nないからかもしれません。"}, {"t": 98.3, "x": "距離は、もともとあったずれを\n見えやすくするだけのようです。"}, {"t": 102.06666666666666, "x": "近くにいる間は、会えば済んで\nいたことがたくさんあります。"}, {"t": 105.96666666666667, "x": "機嫌の悪さも、言い足りなか\nったことも、顔を見れば流せました。"}, {"t": 110.46666666666667, "x": "会えなくなると、その流す作業ができなくなります。"}, {"t": 114.06666666666666, "x": "流せなかったものが、そのまま残っていきます。"}, {"t": 117.21666666666667, "x": "残ったものが積もると、距離のせいに\n見えてしまいます。"}, {"t": 120.81666666666666, "x": "まず見るべきは、離れている\n間の時間の使い方のほうです。"}, {"t": 125.05, "x": "男は、離れている時間を日数で捉えやすいと\n言われます。"}, {"t": 129.18333333333334, "x": "次に会う日を決めて、そこまでの\n空白を埋めようとします。"}, {"t": 133.13333333333333, "x": "仕事を前に詰める、休みを寄せる、\n切符を早めに取る。"}, {"t": 137.63333333333333, "x": "やっていることは、どれも会う日のための準備です。"}, {"t": 140.81666666666666, "x": "準備が進むと、離れていること\n自体は気になりにくくなります。"}, {"t": 145.11666666666667, "x": "一方で女は、日数よりも今日一日の中身を見や\nすいようです。"}, {"t": 149.86666666666667, "x": "今日は誰と話したか、何を食べたか、\nどこで笑ったか。"}, {"t": 154.0, "x": "その積み重ねが、離れている実感を作っていきます。"}, {"t": 157.71666666666667, "x": "この違いを知らないと、片方の頑張りが\n見えなくなります。"}, {"t": 161.73333333333332, "x": "埋めている側は、会う日を作ることが\n気持ちの表し方のつもりです。"}, {"t": 166.36666666666667, "x": "けれど相手には、当日までの\n毎日が抜けて見えることがあります。"}, {"t": 170.86666666666667, "x": "準備は形に残りますが、日々のやり取りは\n形に残りません。"}, {"t": 175.25, "x": "残らないほうを大事にしている人には、\n伝わりにくいのかもしれません。"}, {"t": 179.86666666666667, "x": "どちらも相手を思っているのに、\n置いている場所が違います。"}, {"t": 183.7, "x": "次は、会わない日の側で何が起きているかを見ます。"}, {"t": 187.3, "x": "女は、会わない日をそのまま\n空けておかない場合があります。"}, {"t": 191.28333333333333, "x": "空いた時間に、別の予定を置\nいていくことが多いようです。"}, {"t": 195.3, "x": "友人と会う、習い事に通う、部屋の配置を変える。"}, {"t": 199.51666666666668, "x": "どれも相手がいない前提で、\n生活を組み直す作業です。"}, {"t": 203.85, "x": "組み直しが進むと、一人の時間が居心地よ\nくなっていきます。"}, {"t": 208.21666666666667, "x": "一方で男は、その時間を元の\nまま置いておきやすいと言われます。"}, {"t": 212.9, "x": "帰ってきたら戻す、また前のよ\nうにやる、それまでは保留。"}, {"t": 217.31666666666666, "x": "保留にしている側から見ると、\n相手は変わったように見えます。"}, {"t": 221.45, "x": "変わったのではなく、止めなか\nっただけの場合があります。"}, {"t": 225.05, "x": "止めずに進めた人は、離れて\nいる間も減っていません。"}, {"t": 228.83333333333334, "x": "むしろ、会えない寂しさを別の予定で薄\nめてきただけです。"}, {"t": 232.91666666666666, "x": "薄めた人と、ためた人が会うと、温度が合いません。"}, {"t": 236.85, "x": "ためた側は、会った瞬間に一気に出したくなります。"}, {"t": 240.48333333333332, "x": "薄めた側は、いつもの続きのように接してしまいます。"}, {"t": 244.25, "x": "その最初の数分のずれが、次の話につながります。"}, {"t": 248.16666666666666, "x": "久しぶりに会った日は、いちば\nん楽しいはずの日です。"}, {"t": 251.71666666666667, "x": "それなのに、なぜか途中から\n静かになる組があります。"}, {"t": 255.5, "x": "待っていた側は、会えた瞬間か\nら距離を詰めたくなります。"}, {"t": 259.43333333333334, "x": "手をつなぐ、予定を詰める、\nいつまで一緒にいられるかを聞く。"}, {"t": 263.81666666666666, "x": "一方で、生活を組み直してきた側は速度が違います。"}, {"t": 268.21666666666664, "x": "まずは一息つく、荷物を置く、それから話し始める。"}, {"t": 272.3666666666667, "x": "どちらも自然な動きですが、\n最初の三十分が噛み合いません。"}, {"t": 276.6333333333333, "x": "詰めたい側は、拒まれたように\n受け取ることがあります。"}, {"t": 280.23333333333335, "x": "受け取った側は、その戸惑いを\n態度に出してしまいます。"}, {"t": 283.95, "x": "出された態度を見て、もう一方も身構えてしまいます。"}, {"t": 287.6166666666667, "x": "せっかくの一日が、様子を見\nる時間で終わる場合があります。"}, {"t": 291.8666666666667, "x": "久しぶりに会った日の最初だけ、妙に噛\nみ合わないと感じたことはないでしょうか。"}, {"t": 297.26666666666665, "x": "ここで起きているのは、気持ちの\n差ではなく助走の差のようです。"}, {"t": 301.3, "x": "待っていた側は、当日までに助走を終えています。"}, {"t": 304.8, "x": "迎えた側は、会ってから助走を始めるところです。"}, {"t": 308.4, "x": "必要なのは、最初の数時間を空\nけておくことかもしれません。"}, {"t": 312.6, "x": "離れると、連絡の回数を決めたくなる人がいます。"}, {"t": 316.48333333333335, "x": "毎日必ず電話する、朝と夜に送る、週末は必ず話す。"}, {"t": 321.6166666666667, "x": "決めた最初の一か月は、たいていうまくいきます。"}, {"t": 325.0, "x": "続けるうちに、中身よりも達成のほうが\n目的になります。"}, {"t": 329.26666666666665, "x": "今日はまだ送っていない、昨日より短い、\n返事が遅い。"}, {"t": 333.53333333333336, "x": "数えるものができると、人は数\nえたものを気にし始めます。"}, {"t": 337.75, "x": "守れなかった日に、相手の気持\nちを疑う材料が生まれます。"}, {"t": 341.96666666666664, "x": "疑う材料が増えると、連絡そのものが\n役目に近づきます。"}, {"t": 346.53333333333336, "x": "役目になった連絡は、受け取\nる側にも伝わってしまいます。"}, {"t": 350.6, "x": "伝わると、返す側も義務として返すようになります。"}, {"t": 354.46666666666664, "x": "決めごとは、もともと安心の\nために作ったはずのものです。"}, {"t": 358.35, "x": "その安心が、いつのまにか点検の道具に変\nわることがあります。"}, {"t": 362.6666666666667, "x": "回数を決めるなら、下限だけに\nしておくほうが軽いようです。"}, {"t": 366.75, "x": "週に一度は必ず話す、それ以外は自由、\nこれで足ります。"}, {"t": 371.3666666666667, "x": "次は、話す中身のほうが痩せていく時期の話です。"}, {"t": 375.1, "x": "離れてしばらく経つと、話す材料が減っていきます。"}, {"t": 378.71666666666664, "x": "最初のうちは、その日の出来事が\nそのまま材料になります。"}, {"t": 382.81666666666666, "x": "昼に何を食べたか、誰と会ったか、\n何が面白かったか。"}, {"t": 387.21666666666664, "x": "同じ場所にいないので、聞けば全部が新しい話です。"}, {"t": 391.1666666666667, "x": "ところが三か月ほどで、報告に形が出\nてきてしまいます。"}, {"t": 395.21666666666664, "x": "いつもの人と、いつもの店で、いつもの話をした。"}, {"t": 399.2, "x": "聞く側は、前にも聞いた話として流してしまいます。"}, {"t": 402.96666666666664, "x": "流された側は、話しても意味がないと感じ始めます。"}, {"t": 406.75, "x": "ここで多いのが、報告をやめ\nて質問だけにする形です。"}, {"t": 410.76666666666665, "x": "そっちはどう、変わりない、元気にしてる。"}, {"t": 414.01666666666665, "x": "質問だけの往復は、数分で終わってしまいます。"}, {"t": 417.6166666666667, "x": "終わる時間が短くなると、電話の回数も自然に減\nります。"}, {"t": 422.05, "x": "減った理由は、興味ではなく\n材料の枯れ方かもしれません。"}, {"t": 426.18333333333334, "x": "材料が枯れない人は、離れて\nいる間に新しいことを始めています。"}, {"t": 431.03333333333336, "x": "それが次の、暮らしがそれぞ\nれ形になっていく話につながります。"}, {"t": 435.56666666666666, "x": "離れて一年ほど経つと、二人の生活は\nそれぞれ形になります。"}, {"t": 440.23333333333335, "x": "朝起きる時間も、買う食材の量も、\n休みの過ごし方も決まります。"}, {"t": 445.3, "x": "一人分の鍋を買う、一人分の洗濯を\nする、一人分の予定を立てる。"}, {"t": 450.4166666666667, "x": "完成した生活は便利で静かで、\n揉めることがありません。"}, {"t": 454.56666666666666, "x": "一方で、相手が入る隙間はその\n分だけ小さくなります。"}, {"t": 458.73333333333335, "x": "戻ってきた人が、真ん中に置\nいてあった物をよけて座る。"}, {"t": 462.56666666666666, "x": "自分の使っていた棚が、別のもので埋まっている。"}, {"t": 465.98333333333335, "x": "どちらも、悪いことをしたわけではありません。"}, {"t": 469.01666666666665, "x": "空いた場所をそのままにして\nおくほうが、じつは難しいからです。"}, {"t": 473.2, "x": "問題になるのは、完成したことでは\nなく気づかないことのようです。"}, {"t": 477.5833333333333, "x": "気づかないまま何年か続くと、\n戻る理由が薄くなります。"}, {"t": 481.6333333333333, "x": "薄くなった理由は、話し合いの席では出てきません。"}, {"t": 485.23333333333335, "x": "出てくるのは、なんとなく、という言葉だけです。"}, {"t": 488.6, "x": "完成しかけた生活は、隙間を残\nしておけば戻せるようです。"}, {"t": 493.03333333333336, "x": "隙間の作り方は、後ろのほうでもう一度出します。"}, {"t": 496.6333333333333, "x": "離れていて終わった二人には、\n先に出る変化があるようです。"}, {"t": 500.73333333333335, "x": "最初に消えるのは、予定を教\nえ合う習慣だと言われます。"}, {"t": 504.8333333333333, "x": "来週の休み、次の出張、実家に帰る日。"}, {"t": 508.73333333333335, "x": "以前なら自然に伝えていたものが、\n聞かれるまで出てきません。"}, {"t": 512.6833333333333, "x": "聞けば答えるので、隠しているわけではありません。"}, {"t": 516.0666666666667, "x": "報告する相手として、思い浮かば\nなくなっているだけです。"}, {"t": 519.8666666666667, "x": "一方で、聞く側にも同じことが起きていきます。"}, {"t": 523.35, "x": "どうせ会えない、言っても仕方\nない、心配をかけたくない。"}, {"t": 527.6166666666667, "x": "省いた側にも悪気はなく、気を使\nったつもりの場合があります。"}, {"t": 531.9833333333333, "x": "予定を伝え合うのは、会うための\n連絡だけではないようです。"}, {"t": 535.9833333333333, "x": "先の時間の中に、相手を置い\nておく作業でもあります。"}, {"t": 539.85, "x": "置かなくなると、これから先が静かに別々になります。"}, {"t": 543.7333333333333, "x": "距離が理由に見えても、消えているのは\n予定の共有かもしれません。"}, {"t": 548.3, "x": "ここは、戻そうと思えばいちばん戻しやすい部分です。"}, {"t": 552.05, "x": "次は、続いた人が会わない日に\nしていたことを見ます。"}, {"t": 555.7166666666667, "x": "長く離れていても続いた人には、\n似た使い方がありました。"}, {"t": 559.9333333333333, "x": "一つ目は、会わない日を待つ日に\nしていないことです。"}, {"t": 563.3333333333334, "x": "仕事を進める、体を動かす、誰かと予定を入れる。"}, {"t": 567.6166666666667, "x": "二つ目は、相手に見せる用の時間を少\nし残していることです。"}, {"t": 571.8833333333333, "x": "写真を撮る、面白かったことを\n覚えておく、短く書いておく。"}, {"t": 576.4666666666667, "x": "覚えておく作業があると、話\nす材料が枯れにくくなります。"}, {"t": 580.6333333333333, "x": "三つ目は、同じものを別々の場所で見\nていることです。"}, {"t": 584.4166666666666, "x": "同じ番組、同じ本、同じ店の似たお品書き。"}, {"t": 588.4666666666667, "x": "一緒にいなくても、共通の話題は後から\n作れるようです。"}, {"t": 592.55, "x": "一方で、続かなかった人は待\nつことに集中しがちでした。"}, {"t": 596.8333333333334, "x": "待っている間は、時間が減るだけで何も増えません。"}, {"t": 600.4, "x": "増えないまま会うと、渡せるものが\n気持ちだけになります。"}, {"t": 604.2166666666667, "x": "気持ちだけを渡された側は、\n重さを感じることがあります。"}, {"t": 608.2333333333333, "x": "重さは、愛情の量ではなく余白の少なさから\n出るようです。"}, {"t": 612.4166666666666, "x": "余白の作り方が、そのまま続くかどうかに出ています。"}, {"t": 616.1166666666667, "x": "帰ってきた日は、気持ちが半年分たまっている日です。"}, {"t": 619.9, "x": "だからこそ、この日にやらな\nいほうがいいことがあります。"}, {"t": 623.4833333333333, "x": "たまっていた不満を出す、答\nえを迫る、予定を全部埋める。"}, {"t": 627.85, "x": "どれも、離れている間に考えてきたことばかりです。"}, {"t": 631.4833333333333, "x": "考えてきた側には、今日しか\n言う機会がないように見えます。"}, {"t": 635.5833333333334, "x": "一方で迎えた側は、移動と気の張りで\n疲れていることが多いです。"}, {"t": 640.1833333333333, "x": "疲れている人に長い話をすると、中身が届きません。"}, {"t": 644.2833333333333, "x": "届かないまま終わると、言った側にも何も残りません。"}, {"t": 648.2166666666667, "x": "残らないどころか、会った日の記憶が話\nし合いになります。"}, {"t": 652.1833333333333, "x": "何度か続くと、会うこと自体が構\nえるものになってしまいます。"}, {"t": 656.4166666666666, "x": "重い話は、帰ってきた次の日以降に置\nくほうが通りやすいようです。"}, {"t": 661.2333333333333, "x": "その日は、一緒にご飯を食べて眠るだけでも足ります。"}, {"t": 664.9333333333333, "x": "言いたいことは、消えずに次の日まで残っています。"}, {"t": 668.3666666666667, "x": "残っていた話は、落ち着いてからのほうが\n短く済みます。"}, {"t": 672.3666666666667, "x": "最後に、離れる期間そのものの話をします。"}, {"t": 675.7666666666667, "x": "離れる話が出た時に、決めて\nおくと軽くなるものがあります。"}, {"t": 679.9833333333333, "x": "いつまで離れるのか、という終わりの目安です。"}, {"t": 683.2, "x": "三年で戻る、任期が終わったら\n考える、来年の春に決め直す。"}, {"t": 688.4, "x": "期限があると、会わない日の意味が変わってきます。"}, {"t": 691.7666666666667, "x": "男は、終わりが見えると目の前の生活に集中\nしやすいようです。"}, {"t": 696.4666666666667, "x": "戻る日を決めて、そこまでの段取りを組み始めます。"}, {"t": 700.1, "x": "一方で女は、終わりが見えると\n先の予定を置きやすくなります。"}, {"t": 704.5833333333334, "x": "戻った後の住まい、仕事、会う回数まで\n考え始めます。"}, {"t": 709.15, "x": "どちらも、期限がないと組めないものばかりです。"}, {"t": 712.3, "x": "終わりのない距離は、いつまで\n我慢するのかという話になりがちです。"}, {"t": 716.7833333333333, "x": "期限は、正確でなくても構わないようです。"}, {"t": 720.05, "x": "仮でも置いておくと、二人が同じ方向を向けます。"}, {"t": 723.75, "x": "決められない事情がある場合も、もちろんあります。"}, {"t": 727.05, "x": "その時は、いつ決め直すかだ\nけ決めておくと形になります。"}, {"t": 731.0833333333334, "x": "次に話すのは秋、それまでは\n今のまま、これで足ります。"}, {"t": 735.3, "x": "離れている時間の使い方は、\n男女で逆になりやすいようです。"}, {"t": 739.6333333333333, "x": "男は会う日までを埋めて、女は会\nわない日を作り替えていきます。"}, {"t": 744.1166666666667, "x": "どちらも相手のことを考えた\n結果なので、優劣はありません。"}, {"t": 748.5833333333334, "x": "やっかいなのは、逆であることを\n知らないまま過ごすことです。"}, {"t": 752.45, "x": "知らないと、埋めている側の準備が見えなくなります。"}, {"t": 756.0833333333334, "x": "知らないと、作り替えた側が冷\nたくなったように見えます。"}, {"t": 760.1, "x": "これは相手が変わったということではありません。"}, {"t": 762.9666666666667, "x": "使っていた時間の向きが違っただけです。"}, {"t": 765.6166666666667, "x": "このまま何年か過ぎると、順番に静か\nなことが起きていきます。"}, {"t": 770.1666666666666, "x": "まず予定を教え合わなくなり、\n次に話す材料が減っていきます。"}, {"t": 774.8, "x": "最後には、会う日を決める相談そのものが\n無くなります。"}, {"t": 778.6333333333333, "x": "そこまで来てから気づいても、\n戻すのに時間がかかります。"}, {"t": 782.3666666666667, "x": "戻す手は、じつはどれも小さいものばかりです。"}, {"t": 785.6166666666667, "x": "待つ日を、少しだけ渡す日に変\nえるところから始められます。"}, {"t": 789.65, "x": "写真を一枚残す、来週の休みを\n先に伝える、戻る日の目安を置く。"}, {"t": 795.4333333333333, "x": "距離がある二人ほど、この三\nつが効きやすいと言われます。"}, {"t": 799.2166666666667, "x": "遠いことだけが理由で終わる二人は、\n思っているより多くありません。"}, {"t": 803.7833333333333, "x": "今日の夜、次に会う日の話を一行\nだけしてみてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
