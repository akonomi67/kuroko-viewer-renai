<script>
const D={"name": "男の忙しいと女の忙しいはここまで違う", "file": "090_男の忙しいと女の忙しいはここまで違う", "dur": 828.66665625, "segs": [], "subs": [{"t": 0.0, "x": "付き合っている二人の間で、\n忙しいという一言はよく使われます。"}, {"t": 4.783333333333333, "x": "今日はその忙しいの意味が男女で\nどう違うかを見ていきます。"}, {"t": 8.716666666666667, "x": "先に答えを言っておきます。"}, {"t": 10.616666666666667, "x": "同じ言葉なのに、向きが逆になっていることが\n多いです。"}, {"t": 14.45, "x": "男の忙しいは少し一人にしてほしい\n合図になりやすいです。"}, {"t": 18.583333333333332, "x": "女の忙しいは少し気にかけてほしい\n合図になりやすいです。"}, {"t": 22.65, "x": "男は離れて片付けようとします。"}, {"t": 25.016666666666666, "x": "女は寄り添ってもらって乗り切ろうとします。"}, {"t": 27.733333333333334, "x": "この違いを知らないと、気遣いが裏目に出ます。"}, {"t": 31.083333333333332, "x": "男が忙しいと言うと、女は心配して\n連絡を増やすことがあります。"}, {"t": 36.13333333333333, "x": "女が忙しいと言うと、男は遠慮して\n連絡を減らすことがあります。"}, {"t": 40.983333333333334, "x": "どちらも相手を思っての行動です。"}, {"t": 43.31666666666667, "x": "それなのに相手がほしいものとは\n反対になってしまいます。"}, {"t": 46.96666666666667, "x": "忙しいは断りの言葉に聞こえやすいです。"}, {"t": 50.0, "x": "でも多くの場合、\n言った本人に断るつもりはありません。"}, {"t": 54.1, "x": "一つの\n言葉に男女で別の中身が入っているだけなのです。"}, {"t": 57.86666666666667, "x": "その中身を場面ごとに開けていきます。"}, {"t": 60.4, "x": "忙しいという言葉には大きく二つの使い方があります。"}, {"t": 64.28333333333333, "x": "一つは、今は手が回らないので\n待っていてという使い方です。"}, {"t": 68.41666666666667, "x": "もう一つは、今は大変なので\n分かっていてという使い方です。"}, {"t": 72.66666666666667, "x": "男は前の使い方をしやすいと言われます。"}, {"t": 75.65, "x": "忙しいと言って、\n少し距離を置く許しをもらおうとします。"}, {"t": 79.71666666666667, "x": "片付いたら戻るので、それまで\n待っていてほしいのです。"}, {"t": 83.41666666666667, "x": "一方で女は後の使い方をしやすいようです。"}, {"t": 86.73333333333333, "x": "忙しいと言って、今の大変さを\n知ってもらおうとします。"}, {"t": 90.68333333333334, "x": "離れたいのではありません。"}, {"t": 92.43333333333334, "x": "むしろ近くにいてほしいのです。"}, {"t": 94.48333333333333, "x": "男の忙しいは、ドアに貼る準備中の札に近いです。"}, {"t": 98.56666666666666, "x": "女の忙しいは、少し開けた窓に近いです。"}, {"t": 102.06666666666666, "x": "札を見たらそっとしておくのが正解です。"}, {"t": 104.73333333333333, "x": "窓から声がしたら返事をするのが正解です。"}, {"t": 107.8, "x": "ところが二人とも、\n自分の使い方で相手の言葉を読みます。"}, {"t": 112.05, "x": "札の前で何度もノックしてしまう。"}, {"t": 114.33333333333333, "x": "開いた窓の前を黙って通り過ぎてしまう。"}, {"t": 117.13333333333334, "x": "そういうすれ違いが同じ一言から始まります。"}, {"t": 120.33333333333333, "x": "まずは忙しい時の男の頭の中から見ていきます。"}, {"t": 124.0, "x": "男の忙しいは予定の数より\n頭の中の席の問題になりやすいです。"}, {"t": 129.01666666666668, "x": "大きな仕事を一つ抱えると、\nそのことで頭が埋まります。"}, {"t": 133.2, "x": "締め切りが近い。"}, {"t": 134.41666666666666, "x": "大事な案件を任された。"}, {"t": 136.3, "x": "資格の試験が迫っている。"}, {"t": 138.11666666666667, "x": "そういう時はほかのことに使う席が一時的に\nなくなります。"}, {"t": 142.03333333333333, "x": "男は物事を一つずつ片付けたい\n人が多いと言われます。"}, {"t": 145.93333333333334, "x": "目の前のことが終わるまで、\n次に気持ちを移しにくいです。"}, {"t": 150.0, "x": "そのため返事が短くなったり、遅くなったりします。"}, {"t": 153.56666666666666, "x": "スタンプ一つで終わる。"}, {"t": 155.05, "x": "既読のまま半日たつ。"}, {"t": 156.78333333333333, "x": "電話に出られない。"}, {"t": 158.06666666666666, "x": "本人の中ではそれがまじめな\n向き合い方だったりします。"}, {"t": 161.63333333333333, "x": "中途半端には返したくないのです。"}, {"t": 164.03333333333333, "x": "片付けてから、きちんと返したいのです。"}, {"t": 166.8, "x": "恋人を後回しにする気持ちは薄いです。"}, {"t": 169.68333333333334, "x": "むしろ恋人の席を空けるために\n急いでいる場合があります。"}, {"t": 173.46666666666667, "x": "外から見ると冷たくなったように見えます。"}, {"t": 176.15, "x": "でも本人は頭の中を片付けている\n最中なのかもしれません。"}, {"t": 180.4, "x": "その部屋の中に恋人の席はちゃんと残っています。"}, {"t": 183.86666666666667, "x": "女の忙しいはいくつものことを\n同時に抱えている時が多いです。"}, {"t": 188.3, "x": "仕事の締め切りだけではありません。"}, {"t": 190.53333333333333, "x": "職場の人間関係。"}, {"t": 192.31666666666666, "x": "家族からの連絡。"}, {"t": 193.78333333333333, "x": "友達の相談。"}, {"t": 195.06666666666666, "x": "そういう細かいことが同じ時期に重なっています。"}, {"t": 198.26666666666668, "x": "女は複数のことを並べて気にかける\n人が多いと言われます。"}, {"t": 202.28333333333333, "x": "一つ終わっても、ほかの気がかりが残り続けます。"}, {"t": 205.7, "x": "そのため忙しいの中身は予定表より\n重いことがあります。"}, {"t": 209.68333333333334, "x": "予定表に書けない段取りが頭の中に\nずっと置かれています。"}, {"t": 213.63333333333333, "x": "冷蔵庫の中身を考えながら、\n明日の会議の資料を考える。"}, {"t": 218.2, "x": "同僚の機嫌に気を配りながら、\n母親の通院日を覚えておく。"}, {"t": 222.8, "x": "この重なりを一言にまとめたものが、\n女の忙しいです。"}, {"t": 226.91666666666666, "x": "予定が詰まっているという報告だけではありません。"}, {"t": 230.06666666666666, "x": "今これだけ抱えていると、知ってほしい\n気持ちが入っています。"}, {"t": 234.3, "x": "解決策がほしいわけではないことが多いです。"}, {"t": 237.36666666666667, "x": "会う回数を減らしたいわけでもないことが多いです。"}, {"t": 240.51666666666668, "x": "重さを少し分かってもらえるだけで、\n肩が軽くなるのです。"}, {"t": 244.53333333333333, "x": "では忙しい時の二人は恋人を\nどこに置いているのでしょうか。"}, {"t": 248.56666666666666, "x": "男は忙しい時に、やることを一列に並べがちです。"}, {"t": 252.76666666666668, "x": "そして前から順に片付けようとします。"}, {"t": 255.38333333333333, "x": "仕事が前に来ると、恋人との時間は後ろへ回ります。"}, {"t": 259.5, "x": "これは恋人の順位が下がったのとは少し違います。"}, {"t": 262.95, "x": "前の用事に手を付けているだけで、\n列から外してはいないのです。"}, {"t": 267.35, "x": "男にとって恋人は後ろで待っていてくれる\n安心の場所です。"}, {"t": 271.26666666666665, "x": "待ってくれると信じているから、\n後ろに回せるとも言えます。"}, {"t": 275.2, "x": "逆に、どうでもいい相手には\n忙しいとすら言わないことがあります。"}, {"t": 279.68333333333334, "x": "連絡を返さずに、静かに離れていくだけです。"}, {"t": 283.18333333333334, "x": "わざわざ忙しいと伝えるのは続けたい\n気持ちの表れでもあります。"}, {"t": 287.6333333333333, "x": "しばらく相手ができないと、\n先に断っておきたいのです。"}, {"t": 291.6333333333333, "x": "ただ後ろで待つ側からは列の様子が見えません。"}, {"t": 294.85, "x": "いつ順番が来るのか分からないまま\n待つことになります。"}, {"t": 298.23333333333335, "x": "男がそこに気づかないと、待たせていることが\n伝わりません。"}, {"t": 302.28333333333336, "x": "本人は戻るつもりでも、相手は戻らないと\n感じてしまいます。"}, {"t": 306.5, "x": "並べ直したつもりが外されたように\n見えてしまうのです。"}, {"t": 310.03333333333336, "x": "一方で女は、忙しい\n時ほど恋人の存在が大きくなりやすいです。"}, {"t": 315.15, "x": "抱えている重さを分け合える相手だからです。"}, {"t": 318.03333333333336, "x": "夜に疲れた声で電話をしてくる。"}, {"t": 320.3666666666667, "x": "会う時間は取れないのに、連絡は増える。"}, {"t": 323.4166666666667, "x": "忙しいと言いながら、仕事の話を長く話す。"}, {"t": 327.03333333333336, "x": "こうした行動は矛盾して見えるかもしれません。"}, {"t": 330.0, "x": "でも女の中では矛盾していないことが多いです。"}, {"t": 333.15, "x": "会う時間はない。"}, {"t": 334.3833333333333, "x": "それでも気持ちはつながっていてほしい。"}, {"t": 336.85, "x": "忙しい時期こそそのつながりが支えになるのです。"}, {"t": 340.1166666666667, "x": "ここで男は、気を使って身を引きがちです。"}, {"t": 343.15, "x": "そこで、すれ違いが起きます。"}, {"t": 345.5, "x": "忙しそうだから連絡を控えよう。"}, {"t": 347.93333333333334, "x": "会いたいと言うのはやめておこう。"}, {"t": 349.9166666666667, "x": "男としては相手の時間を守る優しさです。"}, {"t": 353.0, "x": "ところが女には大変な時に放っておかれた\n記憶が残ります。"}, {"t": 357.2, "x": "この記憶は意外と長く残るものです。"}, {"t": 359.8, "x": "女の忙しいは来ないでという\n意味ではないことが多いです。"}, {"t": 363.6, "x": "いつもより少しだけ近くにいて、という\n意味かもしれません。"}, {"t": 367.45, "x": "ここまでを合わせると、すれ違いの形が見えてきます。"}, {"t": 371.3833333333333, "x": "二人とも自分が忙しい時にしてほしいことを\n相手にするのです。"}, {"t": 375.68333333333334, "x": "女は男が忙しいと言うと、心配して声をかけます。"}, {"t": 379.98333333333335, "x": "ちゃんと食べてる。"}, {"t": 381.03333333333336, "x": "無理しないでね。"}, {"t": 382.06666666666666, "x": "何か手伝えることある。"}, {"t": 383.71666666666664, "x": "これは自分が忙しい時にかけてほしい言葉です。"}, {"t": 387.1, "x": "でも男には返事をする用事が一つ増えることが\nあります。"}, {"t": 390.93333333333334, "x": "すぐ返せない自分を責めてしまう人もいます。"}, {"t": 393.93333333333334, "x": "一方で男は女が忙しいと言うと、\nそっと距離を置きます。"}, {"t": 398.5, "x": "連絡を控える。"}, {"t": 399.73333333333335, "x": "誘うのを待つ。"}, {"t": 400.8833333333333, "x": "落ち着いたら声をかける。"}, {"t": 402.53333333333336, "x": "これも自分が忙しい時にしてほしいことです。"}, {"t": 405.68333333333334, "x": "でも女には支えがほしい時に一人にされたように\n感じます。"}, {"t": 409.73333333333335, "x": "こうして二人とも優しくしているのに、\n二人とも寂しくなります。"}, {"t": 414.1333333333333, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 417.35, "x": "自分の意味で相手の忙しいを読んでいるだけです。"}, {"t": 420.5833333333333, "x": "気遣いが足りないのではなく、向きが逆なのです。"}, {"t": 424.03333333333336, "x": "向きさえ合えば、同じ気遣いがそのまま届きます。"}, {"t": 427.48333333333335, "x": "忙しい時期の連絡にもこの逆の向きが表れます。"}, {"t": 431.01666666666665, "x": "男は連絡を減らすことで、\n集中を守ろうとしやすいです。"}, {"t": 435.26666666666665, "x": "通知を切る。"}, {"t": 436.25, "x": "返事は夜にまとめる。"}, {"t": 437.85, "x": "用件だけを短く送る。"}, {"t": 439.75, "x": "相手を軽く見ているのではありません。"}, {"t": 442.15, "x": "頭の席を空けておくための工夫です。"}, {"t": 444.76666666666665, "x": "一方で女は、細くても連絡が続いてほしいと\n感じやすいです。"}, {"t": 449.5, "x": "おはようの一言。"}, {"t": 450.8333333333333, "x": "今日も遅くなるという報告。"}, {"t": 452.85, "x": "お疲れさまの返事。"}, {"t": 454.35, "x": "中身は少なくても、つながっている\n感覚が支えになります。"}, {"t": 458.51666666666665, "x": "男からすると、短い連絡には\nあまり意味がないように見えます。"}, {"t": 463.1166666666667, "x": "用件がないなら送らなくていいと考えやすいのです。"}, {"t": 466.6166666666667, "x": "女からすると、短い連絡こそ意味があります。"}, {"t": 470.21666666666664, "x": "用件がないのに送ってくれる。"}, {"t": 472.25, "x": "それが、気にかけている証になるからです。"}, {"t": 475.066666666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
