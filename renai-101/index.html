<script>
const D={"name": "うまくいく夫婦の修復は_特別な言葉ではなかった_届くかどうかだった", "file": "101_うまくいく夫婦の修復は_特別な言葉ではなかった_届くかどうかだった", "dur": 789.0, "segs": [], "subs": [{"t": 0.0, "x": "仲がいい夫婦は、謝るのが上手いと\n思っていないでしょうか。"}, {"t": 4.15, "x": "けんかの途中でうまい一言を言える2人です。"}, {"t": 7.166666666666667, "x": "空気を変える冗談もすっと出てくる2人です。"}, {"t": 10.183333333333334, "x": "でも研究所の文章は、少し違うことを書いています。"}, {"t": 14.066666666666666, "x": "アメリカのゴットマン研究所の記事です。"}, {"t": 16.683333333333334, "x": "けんかを止めようとする一言を、\n修復の試みと呼んでいます。"}, {"t": 21.05, "x": "うまくいく夫婦との差は、この試みにあるといいます。"}, {"t": 24.65, "x": "ただし差は試みの上手さではありません。"}, {"t": 27.366666666666667, "x": "その試みが、相手に届くかどうかだというのです。"}, {"t": 30.766666666666666, "x": "同じ一言でも、届く夫婦と届かない夫婦がいます。"}, {"t": 34.583333333333336, "x": "届かなければ、いい言葉でもけんかは止まりません。"}, {"t": 38.0, "x": "だから今日は、上手な言葉を\n集める回ではありません。"}, {"t": 41.71666666666667, "x": "これを言えば必ず直る、という言葉も出てきません。"}, {"t": 45.31666666666667, "x": "見ていくのは試みがどうすれば届くのかです。"}, {"t": 48.21666666666667, "x": "出す側だけでなく受け取る側の話もします。"}, {"t": 51.15, "x": "自分の家のけんかを、思い浮かべながら\n聞いてみてください。"}, {"t": 55.1, "x": "まずは修復の試みという言葉からです。"}, {"t": 57.9, "x": "研究所の記事は、けんかの緊張を\nゆるめる行為と書いています。"}, {"t": 62.4, "x": "別の記事はもう少し広く説明しています。"}, {"t": 65.4, "x": "ばかげたものも含めた、言葉や行動のすべてです。"}, {"t": 68.9, "x": "否定的な流れが手に負えなくなるのを、\n防ぐものです。"}, {"t": 72.7, "x": "つまり謝罪だけを指すのではありません。"}, {"t": 75.2, "x": "ごめんねと言うのももちろん試みです。"}, {"t": 77.61666666666666, "x": "でもそれだけではありません。"}, {"t": 79.36666666666666, "x": "ちょっと待ってと話を止めるのも入ります。"}, {"t": 82.1, "x": "変な顔をして笑わせるのも入ります。"}, {"t": 84.63333333333334, "x": "確かにそうだねとうなずくのも入ります。"}, {"t": 87.2, "x": "言葉のない行動でも試みになりえます。"}, {"t": 89.96666666666667, "x": "同じ記事は、修復を元の道に\n戻ることだと言い換えています。"}, {"t": 94.41666666666667, "x": "壊れたものを直すのとは少し違います。"}, {"t": 97.13333333333334, "x": "外れかけた道に戻る感じです。"}, {"t": 99.36666666666666, "x": "だから大げさな仲直りの儀式は要りません。"}, {"t": 102.26666666666667, "x": "大事なのは形より止めようとする向きです。"}, {"t": 105.16666666666667, "x": "けんかの最中に、もう一度同じ向きを向こうとする。"}, {"t": 108.93333333333334, "x": "それが修復の試みの中身です。"}, {"t": 111.31666666666666, "x": "記事は修復の試みをたとえで説明しています。"}, {"t": 114.66666666666667, "x": "赤信号を見て、ブレーキを\n強く踏むようなものだというのです。"}, {"t": 119.01666666666667, "x": "なぜブレーキを踏むのでしょうか。"}, {"t": 121.03333333333333, "x": "ぶつかってけがをしないためです。"}, {"t": 122.96666666666667, "x": "記事は、結婚を傷つける衝突を\n避けるためと書いています。"}, {"t": 127.16666666666667, "x": "このたとえには大事な点が2つあります。"}, {"t": 129.9, "x": "一つは、ぶつかる前に踏むものだということです。"}, {"t": 133.25, "x": "事故のあとで直すのではありません。"}, {"t": 135.46666666666667, "x": "言い合いが熱くなりかけた、その途中で踏むのです。"}, {"t": 138.91666666666666, "x": "もう一つは、信号に気づかないと踏めないことです。"}, {"t": 142.41666666666666, "x": "危ない流れに入ったと、自分で\n気づく必要があります。"}, {"t": 146.53333333333333, "x": "声が大きくなってきた。"}, {"t": 148.18333333333334, "x": "いつもと同じ言い合いの形になってきた。"}, {"t": 150.9, "x": "そう気づいた瞬間が赤信号です。"}, {"t": 153.41666666666666, "x": "気づくのが早いほど、軽く踏むだけですむはずです。"}, {"t": 156.96666666666667, "x": "ブレーキはけんかを消す道具ではありません。"}, {"t": 159.7, "x": "話し合いそのものはそのあとも続きます。"}, {"t": 162.38333333333333, "x": "止めるのは衝突で話の中身ではないのです。"}, {"t": 165.48333333333332, "x": "ここを取り違えると、修復は話をそらす手に見えます。"}, {"t": 169.58333333333334, "x": "記事にはある夫婦の会話が出てきます。"}, {"t": 172.15, "x": "仕事から帰った一人が相手にこう言います。"}, {"t": 175.06666666666666, "x": "また帰ってきたら、あなたの\n片づけをしなきゃいけない。"}, {"t": 178.53333333333333, "x": "言われた側は身構えてこう返します。"}, {"t": 181.06666666666666, "x": "どうせだらしないって言いたいんだろう。"}, {"t": 183.23333333333332, "x": "台所の調理台ならいつも拭いている。"}, {"t": 185.85, "x": "ここで言い合いは、いつ大きくなっても\nおかしくありません。"}, {"t": 189.51666666666668, "x": "記事は、最初に言った側が返せた一言を\n挙げています。"}, {"t": 193.51666666666668, "x": "確かにそうだね、いつも拭いてくれている。"}, {"t": 196.4, "x": "これだけです。"}, {"t": 197.33333333333334, "x": "記事は、これが修復の試みになったはずだと\n書いています。"}, {"t": 201.31666666666666, "x": "張り詰めた空気がゆるんだはずだ、というのです。"}, {"t": 204.51666666666668, "x": "相手も、解決の話に耳を向けやすくなったはずだと。"}, {"t": 208.46666666666667, "x": "特別な言葉ではありません。"}, {"t": 210.5, "x": "相手の言葉のうち、本当の部分を認めただけです。"}, {"t": 214.26666666666668, "x": "片づけてほしい不満が、消えたわけでもありません。"}, {"t": 217.76666666666668, "x": "不満は残したまま勢いだけを弱めています。"}, {"t": 220.86666666666667, "x": "これがブレーキの一例です。"}, {"t": 222.71666666666667, "x": "ただ、効くかどうかは言われる側しだいでもあ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
