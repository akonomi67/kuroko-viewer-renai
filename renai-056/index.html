<script>
const D={"name": "二十代三十代四十代で好きの中身が入れ替わる", "file": "056_二十代三十代四十代で好きの中身が入れ替わる", "dur": 1150.26665625, "segs": [], "subs": [{"t": 0.0, "x": "好きという言葉は、年齢で中身が入\nれ替わることがあります。"}, {"t": 4.05, "x": "同じ言葉を使っていても、指\nしているものが違う場合があります。"}, {"t": 8.466666666666667, "x": "二十代の好きは、会いたいと\nいう気持ちに近いかもしれません。"}, {"t": 12.483333333333333, "x": "三十代の好きは、続けられるか\nどうかの方へ寄っていきます。"}, {"t": 16.633333333333333, "x": "四十代の好きは、居心地の良\nさに近づくことがあります。"}, {"t": 20.6, "x": "しかも、入れ替わる時期が男と女で少\nしずれるようです。"}, {"t": 24.533333333333335, "x": "男は三十代の半ばで、急に暮らしの\n話を始めることがあります。"}, {"t": 29.566666666666666, "x": "女は三十代の初めに、先の見通\nしがあるかどうかを見ています。"}, {"t": 34.416666666666664, "x": "このずれを知らないと、同じ言葉で話が通\nじなくなります。"}, {"t": 38.56666666666667, "x": "好きと言われても、返ってくる中身が違うからです。"}, {"t": 42.06666666666667, "x": "相手が冷めたのではなく、段が変\nわっただけの場合があります。"}, {"t": 46.233333333333334, "x": "段が変わった相手に、前と同\nじものを渡しても届きにくいです。"}, {"t": 50.71666666666667, "x": "届かないものを何度も渡すと、\n渡す側の方が先に疲れてきます。"}, {"t": 55.53333333333333, "x": "疲れた二人は、相性の話にし\nて終わらせてしまいがちです。"}, {"t": 59.733333333333334, "x": "ここから、年代ごとに中身が\nどう入れ替わるのかを並べます。"}, {"t": 63.86666666666667, "x": "二十代から四十代まで、そし\nてその先まで見ていきます。"}, {"t": 67.95, "x": "どの段が上ということは、たぶんありません。"}, {"t": 70.85, "x": "順番に入れ替わるだけで、増\nえも減りもしないようです。"}, {"t": 74.6, "x": "自分の段と相手の段を、探し\nながら聞いてみてください。"}, {"t": 78.55, "x": "好きという言葉は、一つの意味しか\n持たないわけではありません。"}, {"t": 82.6, "x": "年齢が上がると、その中身が静かに\n入れ替わることがあります。"}, {"t": 86.93333333333334, "x": "二十代で好きと言う時、その\n中身は会いたいに近いようです。"}, {"t": 91.16666666666667, "x": "顔が見たい、声が聞きたい、隣を歩きたい。"}, {"t": 94.68333333333334, "x": "そういう、体の向きに近いものが先に立ちやすいです。"}, {"t": 98.66666666666667, "x": "三十代になると、中身に暮らしが混ざってきます。"}, {"t": 102.33333333333333, "x": "同じ時間に起きられるか、お\n金の使い方が近いか、休みが合うか。"}, {"t": 107.53333333333333, "x": "そういう、並べて置ける条件が顔を出してきます。"}, {"t": 111.16666666666667, "x": "四十代になると、今度は静けさが混ざってきます。"}, {"t": 114.83333333333333, "x": "黙っていても気まずくないか、\n体調を聞いてくれるか、気楽か。"}, {"t": 119.41666666666667, "x": "そういう、減点されない時間の方が大事に\nなってくるようです。"}, {"t": 123.81666666666666, "x": "中身が変わっても、好きとい\nう言葉は同じまま使われます。"}, {"t": 127.88333333333334, "x": "だから、言葉だけを聞いてい\nると変化に気づきにくいです。"}, {"t": 131.56666666666666, "x": "気づかないまま、前と同じものを\n渡し続けてしまいます。"}, {"t": 135.41666666666666, "x": "渡す側は前と同じつもりでも、\n受け取る側には足りなくなります。"}, {"t": 139.91666666666666, "x": "逆に、相手が急に重い話を始\nめたと感じることもあります。"}, {"t": 144.5, "x": "どちらも、相手が変わったわ\nけではないかもしれません。"}, {"t": 147.9, "x": "段が入れ替わっただけ、ということがよくあります。"}, {"t": 151.16666666666666, "x": "まずは、いちばん分かりやす\nい二十代から開けていきます。"}, {"t": 154.93333333333334, "x": "二十代の男が好きになる時、\n見ている場所は狭いようです。"}, {"t": 159.13333333333333, "x": "反応が返ってくるか、隣にい\nて楽しいか、自分に向いているか。"}, {"t": 164.0, "x": "この三つで、かなりの部分が決\nまってしまう場合があります。"}, {"t": 167.98333333333332, "x": "将来の話が出てこないのは、\n興味が無いからとは限りません。"}, {"t": 172.23333333333332, "x": "今日と明日の距離しか、まだ\n見えていないことがあります。"}, {"t": 175.91666666666666, "x": "一方で二十代の女も、将来を細か\nく見ているとは限りません。"}, {"t": 180.58333333333334, "x": "ただ、見る範囲が男より少し先まで\n伸びていることがあります。"}, {"t": 184.91666666666666, "x": "連絡の続き方、親しい友人への\n紹介、休みの日の使われ方。"}, {"t": 190.23333333333332, "x": "そういう、続くかどうかの気配の方を先に拾\nいやすいです。"}, {"t": 194.45, "x": "この差を知らないと、女の側は考\nえが浅いと感じてしまいます。"}, {"t": 199.1, "x": "男の側は、まだ何も決めてい\nないのに急かされたと感じます。"}, {"t": 203.4, "x": "どちらも、相手を軽く見ているわけではないようです。"}, {"t": 206.83333333333334, "x": "見えている距離が違うので、\n同じ景色の話ができないだけです。"}, {"t": 211.23333333333332, "x": "二十代の男の好きは、今この\n時間の濃さで測られやすいです。"}, {"t": 215.66666666666666, "x": "濃い時間が続けば続くほど、\n好きが強くなっていきます。"}, {"t": 219.68333333333334, "x": "逆に、会えない時間が続くと\n薄れたように見えることがあります。"}, {"t": 224.11666666666667, "x": "薄れて見えても、無くなったとは限りません。"}, {"t": 227.16666666666666, "x": "ここが、後で入れ替わる時の\nいちばん大きな伸びしろになります。"}, {"t": 231.23333333333332, "x": "次は、同じ二十代を女の側から見てみます。"}, {"t": 234.76666666666668, "x": "二十代の女が好きになる時、\n見ているのは積み重ねのようです。"}, {"t": 239.25, "x": "覚えていてくれたか、返事が返\nってきたか、態度が揃っているか。"}, {"t": 243.91666666666666, "x": "この三つが揃うと、好きが少\nしずつ上がっていく場合があります。"}, {"t": 248.38333333333333, "x": "一度に落ちるのではなく、線で足\nしていく感じに近いです。"}, {"t": 252.48333333333332, "x": "一方で二十代の男は、点で落\nちることが多いと言われます。"}, {"t": 256.8333333333333, "x": "ふと笑った時、助けてくれた時、\n意外な一面を見た時。"}, {"t": 261.4, "x": "そういう一つの場面で、いき\nなり気持ちが動くことがあります。"}, {"t": 265.6166666666667, "x": "この差があるので、告白の早\nさがずれることがあります。"}, {"t": 269.3833333333333, "x": "男の側は早く決めたがり、女の側は\nまだ材料を集めています。"}, {"t": 274.3666666666667, "x": "早い方を軽いと決めつけると、\n実際の気持ちを見落とします。"}, {"t": 278.81666666666666, "x": "遅い方を冷たいと決めつけても、同じことが起きます。"}, {"t": 282.5833333333333, "x": "どちらかが悪いという単純な話ではないようです。"}, {"t": 285.8833333333333, "x": "二十代の女の好きは、途中で止まると\n戻りにくい性質があります。"}, {"t": 290.6166666666667, "x": "足してきた線が切れると、また一から\n積み直す形になるからです。"}, {"t": 295.0833333333333, "x": "だから、連絡が減った時期の意味が男女で大\nきく違います。"}, {"t": 299.18333333333334, "x": "男にとっては小休止でも、女にと\nっては線の断絶に見えます。"}, {"t": 303.8333333333333, "x": "断絶に見えたものは、後から\n説明しても消えにくいです。"}, {"t": 307.81666666666666, "x": "ここまでが二十代の話で、ここから\n先が入れ替わりの本番です。"}, {"t": 312.4, "x": "三十代に入ると、男の側から先に大きく動き始めます。"}, {"t": 317.06666666666666, "x": "三十代の男には、ある時期か\nら別の物差しが出てきます。"}, {"t": 321.26666666666665, "x": "一緒に暮らせるかどうかを、\n急に測り始めることがあります。"}, {"t": 325.43333333333334, "x": "部屋の使い方、お金の話への\n反応、疲れている日の態度。"}, {"t": 330.23333333333335, "x": "そういう、生活の手触りの方に目が移\nっていくようです。"}, {"t": 334.4, "x": "楽しいだけでは足りなくなっ\nてくる、という言い方もできます。"}, {"t": 338.3833333333333, "x": "一方で女の側から見ると、この\n変化は分かりにくいです。"}, {"t": 342.6333333333333, "x": "急に現実的な話が増えて、熱が下が\nったように見える場合があります。"}, {"t": 347.8333333333333, "x": "誘いの回数が減り、記念日の扱\nいも軽くなることがあります。"}, {"t": 352.4, "x": "それを冷めた合図として受け取\nると、話がかみ合いません。"}, {"t": 356.3, "x": "男の側では、むしろ本気度が上が\nっている最中かもしれません。"}, {"t": 360.7, "x": "ただ、その本気が態度に出る形と\nして分かりにくいだけです。"}, {"t": 364.8666666666667, "x": "浮ついた部分が落ちて、残っ\nた部分が地味に見えているのです。"}, {"t": 369.1166666666667, "x": "この時期の男は、確認より計算の方に時間を使\nいがちです。"}, {"t": 373.71666666666664, "x": "家賃、通勤の時間、休みの合\nわせ方を一人で並べています。"}, {"t": 378.8, "x": "並べている間は、口数が減ることもよくあります。"}, {"t": 382.3666666666667, "x": "黙って考えている姿は、興味を失\nった姿とよく似ています。"}, {"t": 386.9166666666667, "x": "似ているせいで、いちばん誤解\nされやすい時期になります。"}, {"t": 390.7, "x": "ここで女の側にも、別の入れ替わりが起き始めます。"}, {"t": 394.5, "x": "次は、三十代の女に何が起きるのかを見ていきます。"}, {"t": 398.55, "x": "三十代の女には、見通しを求\nめる気持ちが出てくることがあります。"}, {"t": 403.3666666666667, "x": "どこに住むのか、どういう暮\nらしにするのか、いつ決めるのか。"}, {"t": 407.55, "x": "そういう、先の形を一緒に描\nけるかどうかが大きくなります。"}, {"t": 411.96666666666664, "x": "これは、急いでいるという意味とは限りません。"}, {"t": 415.03333333333336, "x": "自分の生活を自分で組み立て\nるために、材料が要るだけです。"}, {"t": 419.51666666666665, "x": "一方で男の側には、決めるという言葉が重く響きます。"}, {"t": 423.78333333333336, "x": "まだ整っていないのに、答えだけを\n求められたと感じる場合があります。"}, {"t": 428.56666666666666, "x": "収入、仕事の見通し、住む場所の目処が揃\nっていない。"}, {"t": 432.98333333333335, "x": "その状態で答えを出すのは、\n無責任だと考える人もいます。"}, {"t": 437.4166666666667, "x": "だから、そのうちという言葉で先に延ば\nしてしまいます。"}, {"t": 440.98333333333335, "x": "延ばされた側は、後回しにさ\nれたと受け取りやすいです。"}, {"t": 444.76666666666665, "x": "延ばした側は、準備をしているつもりでいます。"}, {"t": 447.95, "x": "同じ時間を、待たされる時間と整\nえる時間に分けて使っています。"}, {"t": 452.7, "x": "ここでよく起きるのが、期限の話を感情の話に\nすることです。"}, {"t": 457.1, "x": "いつまでという質問が、愛情が\nあるかの質問に化けてしまいます。"}, {"t": 461.5833333333333, "x": "化けてしまうと、日付の相談ができなくなります。"}, {"t": 465.03333333333336, "x": "できなくなった相談は、その\nまま何年も残ることがあります。"}, {"t": 469.25, "x": "三十代の入れ替わりは、男女ともに\n起きているようです。"}, {"t": 473.0833333333333, "x": "起きているのに、方向が少し\nずれているというだけです。"}, {"t": 476.7, "x": "三十代の半ばで、二人の物差しが\n一度だけ交差します。"}, {"t": 481.05, "x": "男は暮らしを見始め、女は見通しを\n求め始めるからです。"}, {"t": 485.53333333333336, "x": "向いている先は、実はかなり近づいている時期です。"}, {"t": 489.1333333333333, "x": "ところが、出てくる言葉はい\nちばん食い違いやすくなります。"}, {"t": 492.93333333333334, "x": "男は、まだ整っていないという言い方をします。"}, {"t": 496.31666666666666, "x": "女は、いつなら整うのかという聞き方をします。"}, {"t": 499.73333333333335, "x": "男は、追い詰められたと感じることがあります。"}, {"t": 503.0, "x": "女は、はぐらかされたと感じることがあります。"}, {"t": 506.25, "x": "どちらも、離れたくて言って\nいるわけではないようです。"}, {"t": 509.6, "x": "同じ場所に向かいながら、別の速さで\n歩いているだけです。"}, {"t": 513.6166666666667, "x": "交差している時期は、実はい\nちばん話が通りやすい時期です。"}, {"t": 517.9833333333333, "x": "どちらも同じものを見始めて\nいるので、材料が共通しています。"}, {"t": 522.65, "x": "ここで話せた二人は、後の十年がか\nなり軽くなるようです。"}, {"t": 526.85, "x": "逆に、ここを言い合いで終わらせると溝が残ります。"}, {"t": 530.3833333333333, "x": "残った溝は、四十代でまった\nく別の形になって出てきます。"}, {"t": 534.7666666666667, "x": "交差点は、長く続くものではありません。"}, {"t": 537.8666666666667, "x": "数年経つと、また別の方向に分か\nれていくことがあります。"}, {"t": 542.0, "x": "分かれた先で、男の側に大きな変化が起きます。"}, {"t": 545.6833333333333, "x": "次は、四十代の男が何を求め始めるのかを\n見ていきます。"}, {"t": 550.25, "x": "四十代の男が求め始めるのは、\n居場所に近いもののようです。"}, {"t": 554.8166666666667, "x": "気を張らずに座れる場所、話\nさなくていい時間、帰る先。"}, {"t": 559.3166666666667, "x": "そういう、緩められる場所の価値が急に上が\nってきます。"}, {"t": 563.2166666666667, "x": "若い頃に求めていた刺激は、\n少しずつ後ろに下がります。"}, {"t": 567.3666666666667, "x": "出かける回数より、家にいる\n時間の質が気になってきます。"}, {"t": 571.5833333333334, "x": "一方で女の側には、この変化が退屈に見\nえることがあります。"}, {"t": 576.2166666666667, "x": "誘われなくなり、二人で出か\nける日が減っていくからです。"}, {"t": 580.0166666666667, "x": "おしゃれをする機会も、自然と少なくなっていきます。"}, {"t": 583.5, "x": "それを、大事にされなくなっ\nた合図と受け取る場合があります。"}, {"t": 587.5333333333333, "x": "男の側では、むしろ大事にしているつもりでいます。"}, {"t": 591.1333333333333, "x": "気を使わなくていい相手として、\nいちばん近くに置いています。"}, {"t": 595.2833333333333, "x": "ただ、その扱いは外から見ると\n雑に映ることがあります。"}, {"t": 599.3833333333333, "x": "近さと雑さは、見た目がよく似ているからです。"}, {"t": 602.5666666666667, "x": "この時期の男は、褒め言葉を渡\nす回数が減りがちです。"}, {"t": 606.6166666666667, "x": "言わなくても分かるという前提が、\nいつのまにか増えます。"}, {"t": 610.4, "x": "増えた前提は、相手の側では確認できません。"}, {"t": 613.95, "x": "確認できないものは、無くな\nったものとして数えられます。"}, {"t": 617.75, "x": "ここで女の側にも、まったく\n別の入れ替わりが始まります。"}, {"t": 621.8166666666667, "x": "次は、四十代の女が何を手放\nしていくのかを見ていきます。"}, {"t": 626.2666666666667, "x": "四十代の女が手放し始めるのは、\n我慢の方のようです。"}, {"t": 630.5166666666667, "x": "合わせる笑顔、飲み込んだ一言、後回しにした予定。"}, {"t": 634.65, "x": "そういうものを、少しずつ置いていくことがあります。"}, {"t": 638.1, "x": "これは、冷たくなったという意味とは限りません。"}, {"t": 641.3666666666667, "x": "使える時間が有限だと、実感と\nして分かってきただけです。"}, {"t": 645.6666666666666, "x": "一方で男の側には、この変化が突然に見\nえることがあります。"}, {"t": 650.3, "x": "昨日まで普通だった人が、急には\nっきり言い始めます。"}, {"t": 654.1666666666666, "x": "断られる回数が増え、予定が別々になっていきます。"}, {"t": 658.4166666666666, "x": "それを、嫌われたと受け取ってしまう場合があります。"}, {"t": 661.8666666666667, "x": "実際には、嫌う手前で我慢をや\nめただけかもしれません。"}, {"t": 665.8166666666667, "x": "我慢をやめた人は、その分だ\nけ関係を続けやすくなります。"}, {"t": 670.0666666666667, "x": "飲み込み続けた人の方が、あ\nる日そっといなくなるからです。"}, {"t": 673.8666666666667, "x": "だから、はっきり言われるのは\n悪い合図ではないようです。"}, {"t": 677.5333333333333, "x": "この時期の女は、相手を選び直\nしているわけでもありません。"}, {"t": 681.6, "x": "一緒にいる形の方を、組み替\nえようとしていることが多いです。"}, {"t": 685.8333333333334, "x": "別々の予定は、離れる準備では\nなく続ける工夫の場合があります。"}, {"t": 690.7333333333333, "x": "工夫を拒否と読み違えると、\n本当に離れてしまいます。"}, {"t": 694.6833333333333, "x": "四十代は、二人がいちばん逆を向\nいて見える時期です。"}, {"t": 698.6, "x": "その先で、もう一度だけ基準が変わります。"}, {"t": 701.7, "x": "五十代を過ぎると、好きの中身がも\nう一度入れ替わるようです。"}, {"t": 706.1333333333333, "x": "今度は男女の差が、少しずつ小さくなっていきます。"}, {"t": 709.8333333333334, "x": "無事でいるか、機嫌が悪くな\nいか、今日も普通に過ごせたか。"}, {"t": 714.2, "x": "そういう、静かな確認の方が中心になってきます。"}, {"t": 718.0333333333333, "x": "男の側は、褒められることよ\nり気にかけられることを求めます。"}, {"t": 722.2, "x": "体の調子、寝られたかどうか、\n飲み物の好みを覚えているか。"}, {"t": 726.9, "x": "小さな確認の積み重ねが、その\nまま安心になっていきます。"}, {"t": 731.1166666666667, "x": "一方で女の側は、手を借りら\nれるかどうかを見ています。"}, {"t": 735.1, "x": "重い物を持ってくれるか、先に気づくか、\n黙って動くか。"}, {"t": 739.4833333333333, "x": "言われる前に動いた回数が、\nそのまま評価になるようです。"}, {"t": 743.6, "x": "この段では、言葉の量があま\nり意味を持たなくなります。"}, {"t": 747.3, "x": "好きという言葉が、そもそも\n使われなくなることもあります。"}, {"t": 751.1333333333333, "x": "使われないから無いのだと考えると、\n話が合いません。"}, {"t": 754.9666666666667, "x": "言葉の代わりに、行動の回数が使\nわれているだけです。"}, {"t": 758.95, "x": "数え方が変わったのに、前の数\nえ方で採点してしまう。"}, {"t": 763.0833333333334, "x": "それが、この年代でいちばん\n多い読み違いのようです。"}, {"t": 766.75, "x": "ここまでで、四つの段を並べたことになります。"}, {"t": 770.15, "x": "段が違う相手同士だと、何が起きるのでしょうか。"}, {"t": 773.8666666666667, "x": "次は、年上と年下の組み合わせの話です。"}, {"t": 777.3666666666667, "x": "年の差がある二人は、段が最初か\nらずれていることがあります。"}, {"t": 781.5333333333333, "x": "ずれていること自体は、悪いことではないようです。"}, {"t": 784.9, "x": "むしろ、うまくいっている組\nみ合わせも多く見られます。"}, {"t": 788.35, "x": "合うのは、片方が相手の段を先に知\nっている場合です。"}, {"t": 792.2333333333333, "x": "年上の側が、若い段の急ぎ方を覚\nえていることがあります。"}, {"t": 796.6, "x": "覚えていれば、焦りを未熟さとして扱わずに\n済みます。"}, {"t": 800.4666666666667, "x": "年下の側が、静かな段の価値を先に受\nけ取ることもあります。"}, {"t": 804.8333333333334, "x": "受け取れれば、反応が薄いことを\n冷たさと読まずに済みます。"}, {"t": 808.9666666666667, "x": "合わなくなるのは、自分の段を正\nしい段にした時です。"}, {"t": 812.8166666666667, "x": "そんなことで悩む時期はもう\n終わった、という言い方が出ます。"}, {"t": 816.8833333333333, "x": "あるいは、もっと楽しんでも\nいいのに、という言い方も出ます。"}, {"t": 821.0833333333334, "x": "どちらも、相手の段を遅れや古さとして扱っています。"}, {"t": 824.9833333333333, "x": "扱われた側は、話す気を少しずつ失っていきます。"}, {"t": 828.9333333333333, "x": "段には順番はあっても、上下は無いかもしれません。"}, {"t": 832.5666666666667, "x": "先に通った道でも、同じ速さで通るとは限りません。"}, {"t": 836.5166666666667, "x": "同じ年齢でも、段が違う二人はいくらでもいます。"}, {"t": 840.2, "x": "だから、年齢そのもので相手を測るのは\n当てになりません。"}, {"t": 844.1833333333333, "x": "測るなら、年齢ではなく今の中身を見\nる方が早いです。"}, {"t": 848.3333333333334, "x": "次は、段を間違えた時に何が起きるかを\n見ていきます。"}, {"t": 852.35, "x": "段を読み違えると、良かれと\n思った行動が全部外れます。"}, {"t": 856.6833333333333, "x": "暮らしを見始めた相手に、遊\nびの予定ばかり出してしまう。"}, {"t": 860.7166666666667, "x": "静けさを求めている相手に、\n毎日長い連絡を送ってしまう。"}, {"t": 865.25, "x": "会いたいだけの相手に、将来の条件を並べてしまう。"}, {"t": 869.05, "x": "どれも、手を抜いたわけではありません。"}, {"t": 871.5833333333334, "x": "むしろ、いちばん力を入れた\n渡し方であることが多いです。"}, {"t": 875.6, "x": "これは思いやりが足りないのではありません。"}, {"t": 878.3166666666667, "x": "渡す先の段が、ずれているだけかもしれません。"}, {"t": 881.5666666666667, "x": "外れた側は、そのうち渡すこと\n自体をやめてしまいます。"}, {"t": 885.5333333333333, "x": "やめられた側は、急に何も言わなくなったと\n感じます。"}, {"t": 889.3333333333334, "x": "感じた時には、もう理由が分からなくなっています。"}, {"t": 892.85, "x": "男の側がよく外すのは、静け\nさを渡す段を間違えた時です。"}, {"t": 897.4833333333333, "x": "まだ濃い時間が欲しい相手に、\n落ち着きだけを渡してしまう。"}, {"t": 901.45, "x": "女の側がよく外すのは、確認を渡\nす段を間違えた時です。"}, {"t": 906.0666666666667, "x": "考えを整えている相手に、気持ちの\n確認を重ねてしまう。"}, {"t": 910.5, "x": "どちらも、自分の段のやり方を\nそのまま使っただけです。"}, {"t": 914.3833333333333, "x": "相手の段が分かれば、同じ労力で届\nき方が変わります。"}, {"t": 918.3833333333333, "x": "中身を変える必要は、たぶんありません。"}, {"t": 921.3, "x": "渡す順番と種類を、少し入れ替えるだけで足ります。"}, {"t": 925.15, "x": "相手の段を見る前に、自分の段を知\nっておくと早いです。"}, {"t": 929.2833333333333, "x": "質問は三つで、どれも短いもので足ります。"}, {"t": 932.6333333333333, "x": "一つ目は、会えない日に何を考えているかです。"}, {"t": 936.05, "x": "会いたいが先に来るなら、ま\nだ濃い時間の段にいます。"}, {"t": 939.65, "x": "続くかどうかが先に来るなら、\n暮らしの段に入っています。"}, {"t": 943.55, "x": "二つ目は、相手のどこに安心するかです。"}, {"t": 946.55, "x": "反応の速さに安心するなら、確認の段にいます。"}, {"t": 950.3333333333334, "x": "黙っていられることに安心するなら、静けさの段です。"}, {"t": 954.1166666666667, "x": "三つ目は、嫌だと感じる場面がどこかです。"}, {"t": 957.3166666666667, "x": "放っておかれるのが嫌なら、\nまだ線を積んでいる途中です。"}, {"t": 961.25, "x": "急かされるのが嫌なら、整え\nている最中かもしれません。"}, {"t": 965.1166666666667, "x": "この三つを、相手にも同じ言葉で聞いてみてください。"}, {"t": 968.8, "x": "聞き方は、今どっちに近いという軽さで十分です。"}, {"t": 972.4666666666667, "x": "答えが違っても、悪い知らせではありません。"}, {"t": 975.65, "x": "違いが見えた時点で、渡し方を選\nべるようになります。"}, {"t": 979.6333333333333, "x": "選べるようになると、無駄な渡し直しが減ります。"}, {"t": 983.15, "x": "減った分が、そのまま一緒にいる時間に戻ってきます。"}, {"t": 986.8666666666667, "x": "段は、一年で変わることもあれば\n十年動かないこともあります。"}, {"t": 991.2666666666667, "x": "だから、半年に一度くらい聞\nき直すのがちょうどよさそうです。"}, {"t": 995.2833333333333, "x": "四つの段を並べてきましたが、\n変わらないものが一つあります。"}, {"t": 999.4333333333333, "x": "どの年代でも、見ていてもら\nえることだけは残るようです。"}, {"t": 1003.25, "x": "気づいてもらえた、覚えてい\nてくれた、名前を呼ばれた。"}, {"t": 1007.1666666666666, "x": "形は変わっても、この手触りだけは最後まで残ります。"}, {"t": 1011.1166666666667, "x": "二十代では、連絡の速さとして現れます。"}, {"t": 1014.45, "x": "三十代では、生活の細かい変化への\n気づきになります。"}, {"t": 1018.6833333333333, "x": "四十代では、体調や機嫌への一言に変わります。"}, {"t": 1022.4333333333333, "x": "五十代以降では、黙って置かれた飲み物になります。"}, {"t": 1026.1833333333334, "x": "どれも、やっていることは同じかもしれません。"}, {"t": 1029.2666666666667, "x": "相手の存在を、一日のどこかで\n一度数えているだけです。"}, {"t": 1033.4833333333333, "x": "数えられている人は、段が変\nわっても不安になりにくいです。"}, {"t": 1037.5166666666667, "x": "数えられていない人は、どの\n段でも同じ不足を抱えます。"}, {"t": 1041.6166666666666, "x": "だから、渡すものを増やす必要は無\nいのかもしれません。"}, {"t": 1045.4, "x": "段に合った形で、同じ一つを渡し続ければ足ります。"}, {"t": 1049.3666666666666, "x": "形を合わせるのが、この動画で言\nいたかったことのすべてです。"}, {"t": 1053.35, "x": "中身が入れ替わっても、芯は入\nれ替わっていないようです。"}, {"t": 1057.0666666666666, "x": "入れ替わったのは、受け取り口の方だけです。"}, {"t": 1060.1, "x": "受け取り口に合わない鍵は、\nどれだけ立派でも回りません。"}, {"t": 1063.9666666666667, "x": "合う鍵は、驚くほど小さいことが多いです。"}, {"t": 1067.1833333333334, "x": "好きの中身は、年齢で入れ替わっていくようです。"}, {"t": 1070.5, "x": "二十代は会いたい、三十代は続\nけられるか、四十代は居心地。"}, {"t": 1075.7666666666667, "x": "五十代から先は、無事でいるかどうかに\n寄っていきます。"}, {"t": 1079.5166666666667, "x": "そして、入れ替わる時期が男女で少しずれています。"}, {"t": 1083.0166666666667, "x": "男は三十代で暮らしを見始め、\n四十代で居場所を求めます。"}, {"t": 1087.7833333333333, "x": "女は三十代で見通しを求め、\n四十代で我慢を手放します。"}, {"t": 1092.5833333333333, "x": "ずれているだけで、どちらかが\n先を行っているのではありません。"}, {"t": 1096.4833333333333, "x": "段に上下は無く、通る順番が少\nし違うだけのようです。"}, {"t": 1100.55, "x": "変わったのは気持ちの量ではありません。"}, {"t": 1103.3333333333333, "x": "置き場所が、静かに移っただけかもしれません。"}, {"t": 1106.4666666666667, "x": "それを知らないまま何年も過\nごすと、静かに削れていきます。"}, {"t": 1110.6, "x": "最初は、話が少しかみ合わない程度の違和感です。"}, {"t": 1114.3833333333334, "x": "次に、渡しても反応が薄いことが増えていきます。"}, {"t": 1118.1833333333334, "x": "やがて、渡すのをやめて別々の予定が並び始めます。"}, {"t": 1122.1666666666667, "x": "別々のまま何年も経つと、戻\nし方が分からなくなります。"}, {"t": 1126.2833333333333, "x": "そうなる前に、聞いてみてほしいことがあります。"}, {"t": 1129.6166666666666, "x": "今いちばん安心するのはどん\nな時か、という一つだけです。"}, {"t": 1133.6333333333334, "x": "答えが前と違っていたら、それは\n冷めた合図ではありません。"}, {"t": 1137.7333333333333, "x": "段が入れ替わった合図として、\n受け取ってみてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
