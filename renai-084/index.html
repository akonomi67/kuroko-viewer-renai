<script>
const D={"name": "好き避けの正体_好きな人ほど避けてしまうのは男女でここまで違う", "file": "084_好き避けの正体_好きな人ほど避けてしまうのは男女でここまで違う", "dur": 785.2333125, "segs": [], "subs": [{"t": 0.0, "x": "好きな人ほど避けてしまう、\n好き避けという反応があります。"}, {"t": 3.9833333333333334, "x": "片思いの相手の前で、なぜか\n逆の態度を取ってしまうことです。"}, {"t": 8.533333333333333, "x": "職場でも学校でも、気になる\n人がいる場所で起きやすいです。"}, {"t": 12.666666666666666, "x": "本当は話したいのに、近くに来ると\n目をそらしてしまいます。"}, {"t": 16.733333333333334, "x": "今日は、その好き避けが男女で\nどう違うかを見ていきます。"}, {"t": 20.516666666666666, "x": "先に答えを言っておきます。"}, {"t": 22.433333333333334, "x": "男の好き避けは体が固まる形で出やすいです。"}, {"t": 25.816666666666666, "x": "女の好き避けは、距離が離れる形で出やすいです。"}, {"t": 29.466666666666665, "x": "男は相手の前で動けなくなります。"}, {"t": 32.05, "x": "女は相手の前から動いていなくなります。"}, {"t": 34.916666666666664, "x": "男は黙ってその場に残ることが多いです。"}, {"t": 37.766666666666666, "x": "女は用事を作ってその場を去ることが多いです。"}, {"t": 41.016666666666666, "x": "どちらも好きだからこそ起きる反応です。"}, {"t": 43.583333333333336, "x": "けれども相手からは、嫌われたように\n見えてしまいます。"}, {"t": 47.18333333333333, "x": "避けた側は後から自分を責めます。"}, {"t": 49.7, "x": "避けられた側は、そっと身を引きます。"}, {"t": 52.36666666666667, "x": "こうして両方好きなのに離れていく二人もいます。"}, {"t": 55.61666666666667, "x": "好き避けの正体を知ると、見え方は少し変わります。"}, {"t": 59.45, "x": "男女の形の違いから、順番に見ていきます。"}, {"t": 62.95, "x": "好き避けの形は、大きく二つに分かれます。"}, {"t": 66.18333333333334, "x": "一つはその場で止まってしまう形です。"}, {"t": 68.75, "x": "もう一つは、その場から離れてしまう形です。"}, {"t": 72.06666666666666, "x": "男は前の形になりやすいと言われます。"}, {"t": 74.95, "x": "相手が近づくと言葉も動きも止まります。"}, {"t": 77.75, "x": "目をそらし、返事が短くなり、顔がこわばります。"}, {"t": 81.73333333333333, "x": "本人は普通にしているつもりのことが多いです。"}, {"t": 84.81666666666666, "x": "周りに言われて初めて気づく人もいます。"}, {"t": 87.51666666666667, "x": "一方で女は後の形になりやすいようです。"}, {"t": 90.68333333333334, "x": "相手が近づくと、すっと別の場所へ移ります。"}, {"t": 94.13333333333334, "x": "席を替える。"}, {"t": 95.15, "x": "話の輪から抜ける。"}, {"t": 96.6, "x": "先に帰る。"}, {"t": 97.6, "x": "本人は逃げたとは思っていないこともあります。"}, {"t": 100.55, "x": "なんとなく落ち着かなくて動いただけです。"}, {"t": 103.06666666666666, "x": "あとで思い返して、また離れてしまったと気づきます。"}, {"t": 106.68333333333334, "x": "男の好き避けは、止まった石のようです。"}, {"t": 109.56666666666666, "x": "女の好き避けは離れていく小舟のようです。"}, {"t": 112.51666666666667, "x": "石は近くにあるのに動きません。"}, {"t": 114.76666666666667, "x": "小舟は動けるのに遠くへ行きます。"}, {"t": 117.13333333333334, "x": "この二つの形が、\n後の見分け方の手がかりになります。"}, {"t": 120.93333333333334, "x": "まずは男の固まり方から細かく見ていきます。"}, {"t": 124.13333333333334, "x": "男の好き避けは、まず目に出やすいです。"}, {"t": 126.98333333333333, "x": "好きな人と目が合いそうになると先にそらします。"}, {"t": 129.98333333333332, "x": "天井を見る。"}, {"t": 131.06666666666666, "x": "書類を見る。"}, {"t": 132.03333333333333, "x": "窓の外を見る。"}, {"t": 133.2, "x": "見ていないふりをして、実は場所だけは\n分かっています。"}, {"t": 136.85, "x": "どこに立っているかは目の端で\nずっと追っているのです。"}, {"t": 140.01666666666668, "x": "次に、口が止まりやすいです。"}, {"t": 142.38333333333333, "x": "他の人とは笑って話せるのに\nその人の前でだけ黙ります。"}, {"t": 146.33333333333334, "x": "話しかけられても、そうですね、くらいしか\n返せません。"}, {"t": 150.23333333333332, "x": "声が小さくなる人もいれば、\n急に硬い言い方になる人もいます。"}, {"t": 154.9, "x": "体も動きにくくなります。"}, {"t": 156.75, "x": "座っていても立っていても、どこか落ち着きません。"}, {"t": 159.96666666666667, "x": "いつもの冗談が出ない。"}, {"t": 161.58333333333334, "x": "立つ位置が決まらない。"}, {"t": 163.03333333333333, "x": "表情が変わらない。"}, {"t": 164.46666666666667, "x": "周りから見ると、不機嫌そうに見えることがあります。"}, {"t": 168.15, "x": "けれども本人の中では頭が真っ白になっています。"}, {"t": 171.63333333333333, "x": "何か言わなければと思うほど、\n言葉が出なくなるのです。"}, {"t": 175.35, "x": "帰り道になってから言いたかった言葉が浮かびます。"}, {"t": 178.58333333333334, "x": "あれを言えばよかったと一人で思い返します。"}, {"t": 181.48333333333332, "x": "好きな人の前の男は、動かないのではありません。"}, {"t": 185.05, "x": "動けなくなっていることが多いのです。"}, {"t": 187.36666666666667, "x": "女の好き避けは、距離に出やすいです。"}, {"t": 190.1, "x": "好きな人が近くに来ると少しずつ離れていきます。"}, {"t": 193.4, "x": "飲み物を取りに行く。"}, {"t": 194.85, "x": "別の友達に話しかける。"}, {"t": 196.76666666666668, "x": "席を立つ。"}, {"t": 197.71666666666667, "x": "一つずつは自然な動きなので、目立ちません。"}, {"t": 200.93333333333334, "x": "周りの人も気にしないことが多いです。"}, {"t": 203.45, "x": "けれども続けて見ると、その人からだけ\n遠ざかっています。"}, {"t": 207.4, "x": "話しかけられると、短く答えて\n話を終わらせることもあります。"}, {"t": 211.95, "x": "感じよく返したのに、すぐに背中を向けるのです。"}, {"t": 215.53333333333333, "x": "男から見ると話を切られたように感じやすいです。" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
