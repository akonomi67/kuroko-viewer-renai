<script>
const D={"name": "友達から恋人に変わる瞬間が男女でまったく違う", "file": "080_友達から恋人に変わる瞬間が男女でまったく違う", "dur": 821.2333125, "segs": [], "subs": [{"t": 0.0, "x": "友達だった相手が、ある日から\n恋人の候補に変わることがあります。"}, {"t": 4.533333333333333, "x": "今日は、その切り替わりの瞬間が男女で\nどう違うかを見ていきます。"}, {"t": 9.05, "x": "先に答えを言っておきます。"}, {"t": 10.95, "x": "切り替わり方が、まったく違うことが多いです。"}, {"t": 14.116666666666667, "x": "男は意識した日に切り替わりやすいです。"}, {"t": 16.833333333333332, "x": "女は気持ちが積もった日に気づきやすいです。"}, {"t": 19.716666666666665, "x": "男の好きは、ある一日を境に始まることが多いです。"}, {"t": 23.833333333333332, "x": "女の好きは、気づいた時にはも\nう始まっていることが多いです。"}, {"t": 28.066666666666666, "x": "男は切り替わった日を覚えている場合があります。"}, {"t": 31.266666666666666, "x": "女はいつからだったかを後から探すことがあります。"}, {"t": 34.56666666666667, "x": "この違いを知らないと、片方だけが急いで見えます。"}, {"t": 38.266666666666666, "x": "男は急に態度を変えて相手を戸惑\nわせることがあります。"}, {"t": 42.15, "x": "女は合図を出しているのに友達の\nまま扱われることがあります。"}, {"t": 46.416666666666664, "x": "両方とも好きなのに、友達のまま終わる二人もいます。"}, {"t": 50.3, "x": "それは、とてももったいないことです。"}, {"t": 52.7, "x": "友達から恋人になる道は、男女で入口が違\nうだけなのかもしれません。"}, {"t": 57.9, "x": "その入口を、場面ごとに並べていきます。"}, {"t": 61.11666666666667, "x": "友達から恋人への変わり方は、\n大きく二つに分かれます。"}, {"t": 65.35, "x": "一つは、ある日を境にがらりと変わる変わり方です。"}, {"t": 69.03333333333333, "x": "もう一つは、少しずつ色が濃くなる変わり方です。"}, {"t": 72.58333333333333, "x": "男は前の変わり方をしやすいと言われます。"}, {"t": 75.58333333333333, "x": "昨日まで友達だった相手が、\n今日から急に気になり始めます。"}, {"t": 79.88333333333334, "x": "きっかけの場面がはっきりしていて、\n本人もそれを覚えています。"}, {"t": 84.08333333333333, "x": "一方で女は後の変わり方をしやすいようです。"}, {"t": 87.41666666666667, "x": "話すたびに、会うたびに、少\nしずつ気持ちが重なっていきます。"}, {"t": 91.96666666666667, "x": "ある日、積もった量にふと気\nづいて好きだと分かります。"}, {"t": 95.56666666666666, "x": "男にとっての恋は、スイッチが入るものに近いです。"}, {"t": 99.33333333333333, "x": "女にとっての恋は、水がたまっていくものに近いです。"}, {"t": 103.13333333333334, "x": "一滴ずつでは、量は見えません。"}, {"t": 105.65, "x": "スイッチは押した瞬間が分かります。"}, {"t": 108.08333333333333, "x": "水は、あふれそうになった時にしか気づけません。"}, {"t": 111.36666666666666, "x": "この差が、後の場面のずれの元になっていきます。"}, {"t": 114.68333333333334, "x": "まずは、男のスイッチが入る場面から見ていきます。"}, {"t": 118.26666666666667, "x": "男のスイッチは、いつもと違う場面で入りやすいです。"}, {"t": 122.11666666666666, "x": "普段と違う服装を見た時。"}, {"t": 124.28333333333333, "x": "髪型が変わった時。"}, {"t": 125.9, "x": "二人きりになった時。"}, {"t": 127.46666666666667, "x": "見慣れた友達に、知らない顔が一瞬だけ見えます。"}, {"t": 131.1, "x": "いつもより大人に見える。"}, {"t": 132.81666666666666, "x": "いつもより小さく見える。"}, {"t": 134.51666666666668, "x": "その一瞬で、友達の枠から少\nしはみ出して見えるのです。"}, {"t": 138.68333333333334, "x": "頼られた時に、スイッチが入ることもあります。"}, {"t": 142.08333333333334, "x": "重い荷物を頼まれた。"}, {"t": 143.75, "x": "パソコンの設定を聞かれた。"}, {"t": 145.68333333333334, "x": "夜道を送ってほしいと言われた。"}, {"t": 147.86666666666667, "x": "頼られると、自分が特別な位置に\nいるように感じやすいです。"}, {"t": 152.28333333333333, "x": "自分だけが選ばれた、という感覚です。"}, {"t": 155.13333333333333, "x": "笑った顔を近くで見た時に入る人もいます。"}, {"t": 158.18333333333334, "x": "大勢に向けた笑顔ではなく、\n自分に向いた笑顔だと感じた瞬間です。"}, {"t": 163.18333333333334, "x": "どれも、相手にとってはただの\n一日のことかもしれません。"}, {"t": 166.98333333333332, "x": "けれども男の中では、その日が境目と\nして残りやすいです。"}, {"t": 171.26666666666668, "x": "だから好きになった日を後か\nら言える男は多いようです。"}, {"t": 174.81666666666666, "x": "女の側には、その日が分からないことがあります。"}, {"t": 178.3, "x": "なぜその日だったのか、見当がつかないのです。"}, {"t": 181.58333333333334, "x": "特別なことをしたつもりがないからです。"}, {"t": 184.13333333333333, "x": "いつも通りに笑っただけです。"}, {"t": 186.1, "x": "女の好きは、大きな出来事よ\nり小さな日々で育ちやすいです。"}, {"t": 190.51666666666668, "x": "話したことを覚えていてくれた。"}, {"t": 192.55, "x": "疲れている日に気づいてくれた。"}, {"t": 194.48333333333332, "x": "帰りの電車を同じにしてくれた。"}, {"t": 196.73333333333332, "x": "一つずつは、友達なら誰でもしそうなことです。"}, {"t": 200.13333333333333, "x": "けれども同じ人から何度も届\nくと意味が変わっていきます。"}, {"t": 203.86666666666667, "x": "この人といると落ち着く、と\nいう感覚が少しずつ増えます。"}, {"t": 207.91666666666666, "x": "話していて疲れない。"}, {"t": 209.38333333333333, "x": "黙っていても気まずくない。"}, {"t": 211.15, "x": "増えている間は、本人も恋だとは\n思っていないことが多いです。"}, {"t": 215.51666666666668, "x": "仲のいい友達だと、自分でも思っているからです。"}, {"t": 219.18333333333334, "x": "ある日、相手の予定が気になる自分に気づきます。"}, {"t": 222.65, "x": "週末は誰と過ごすのか。"}, {"t": 224.51666666666668, "x": "最近連絡が少ないのはなぜか。"}, {"t": 226.88333333333333, "x": "誰と笑っているのか。"}, {"t": 228.43333333333334, "x": "気になり始めた時には、もうか\nなりの量が積もっています。"}, {"t": 232.33333333333334, "x": "女の好きは、気づいた日に始まるのではありません。"}, {"t": 235.86666666666667, "x": "満ちた日に見つかるのかもしれません。"}, {"t": 238.11666666666667, "x": "だから一つの出来事だけで急に好\nきになることは少ないようです。"}, {"t": 242.15, "x": "男の側からは、何がきっかけ\nだったのか見えにくいです。"}, {"t": 245.98333333333332, "x": "きっかけは一つではなく、全部だったからです。"}, {"t": 249.26666666666668, "x": "友達への好きは、他の誰かの\n影で表に出ることがあります。"}, {"t": 253.58333333333334, "x": "男は相手が他の男と親しくし\nている場面で気づきやすいです。"}, {"t": 257.85, "x": "飲み会で隣に座っていた。"}, {"t": 259.8333333333333, "x": "誰かと二人で出かけたと聞いた。"}, {"t": 261.95, "x": "楽しそうに笑っていた。"}, {"t": 263.6166666666667, "x": "その時の落ち着かなさで、初\nめて自分の気持ちを知ります。"}, {"t": 267.6666666666667, "x": "友達だと思っていたのに、取\nられたくないと感じるのです。"}, {"t": 271.51666666666665, "x": "一方で女は相手に好きな人がいると\n聞いた時に気づきやすいです。"}, {"t": 275.98333333333335, "x": "応援しようとしたのに、胸の奥が少し重くなります。"}, {"t": 279.93333333333334, "x": "うまく笑えない自分がいます。"}, {"t": 281.9166666666667, "x": "その重さで、積もっていたものの大きさを知ります。"}, {"t": 285.45, "x": "男は焦りで気づき、女は寂しさで\n気づくことが多いようです。"}, {"t": 289.8833333333333, "x": "どちらも、失いそうになって初めて見える気持ちです。"}, {"t": 293.53333333333336, "x": "ただ焦りから急に動くと相手を驚か\nせることがあります。"}, {"t": 297.31666666666666, "x": "寂しさを隠して笑うと、相手には何も伝わりません。"}, {"t": 301.23333333333335, "x": "影が見えた日は、まず自分の気持ちを\n確かめる日です。"}, {"t": 305.05, "x": "すぐに動かない方が、落ち着きやすいです。"}, {"t": 307.98333333333335, "x": "動くのは、その後でも遅くないことが多いです。"}, {"t": 311.25, "x": "いつから好きだったのかを聞かれると、\n男女で答え方が違うことがあります。"}, {"t": 316.28333333333336, "x": "男はあの日からと場面で答えやすいです。"}, {"t": 319.1333333333333, "x": "学園祭の片付けの日。"}, {"t": 320.96666666666664, "x": "みんなで行った花火の帰り。"}, {"t": 322.85, "x": "雨の日に傘を貸した時。"}, {"t": 324.75, "x": "一方で女はよく分からないと\n答えることが多いと言われます。"}, {"t": 328.81666666666666, "x": "気づいたら好きだった、という答え方です。"}, {"t": 331.68333333333334, "x": "始まりを指させない好きです。"}, {"t": 333.73333333333335, "x": "これは、ごまかしているのではありません。"}, {"t": 336.3833333333333, "x": "本当に、始まりの一日が無いことが多いのです。"}, {"t": 340.01666666666665, "x": "後から振り返って、あの頃にはも\nう好きだったと気づく人もいます。"}, {"t": 344.43333333333334, "x": "写真を見返して、自分の笑い方が違うと\n分かる人もいます。"}, {"t": 348.9, "x": "隣に写っているのは、いつも同じ人です。"}, {"t": 352.0, "x": "男はこの答えを物足りなく感じることがあります。"}, {"t": 355.3833333333333, "x": "特別な一日が無いと、気持ちが\n軽いように思えるからです。"}, {"t": 359.68333333333334, "x": "けれども一日で始まらない好\nきは一日では消えにくいです。"}, {"t": 363.6666666666667, "x": "長く積もった分だけ、根が深いことが多いのです。"}, {"t": 367.25, "x": "始まりの日が言えないのは、\n気持ちが弱いからではありません。"}, {"t": 371.3, "x": "友達から恋人に進む時、多くの\n人が迷う理由があります。"}, {"t": 375.85, "x": "今の関係を失いたくない、という気持ちです。"}, {"t": 379.18333333333334, "x": "男は断られた後の気まずさを怖がりやすいです。"}, {"t": 382.68333333333334, "x": "同じ仲間の中で、顔を合わせに\nくくなることを考えます。"}, {"t": 386.8666666666667, "x": "飲み会に呼ばれなくなる。"}, {"t": 388.55, "x": "仲間の空気が変わる。"}, {"t": 390.1333333333333, "x": "一方で女は今の居心地が変わ\nることを怖がりやすいようです。"}, {"t": 394.3833333333333, "x": "何でも話せる相手を、一人失\nうことになるかもしれません。"}, {"t": 398.5, "x": "愚痴を言える場所。"}, {"t": 399.78333333333336, "x": "笑い合う時間。"}, {"t": 400.9166666666667, "x": "何気ない連絡。"}, {"t": 402.21666666666664, "x": "友達としての時間が長いほど、\nこの怖さは大きくなります。"}, {"t": 406.5, "x": "男はスイッチが入っても、怖\nさでしばらく黙ることがあります。"}, {"t": 410.78333333333336, "x": "女は積もっていても、気づか\nないふりをすることがあります。"}, {"t": 414.6166666666667, "x": "こうして、両方好きなのに何年も友達の\nままの二人もいます。"}, {"t": 419.1, "x": "けれども何も変えなくても関係は少\nしずつ変わっていきます。"}, {"t": 423.03333333333336, "x": "どちらかに恋人ができれば、\n今の距離には戻れなくなるからです。"}, {"t": 427.4, "x": "怖さは、それだけ相手が大事だという印でもあります。"}, {"t": 431.25, "x": "大事だからこそ、壊さない進\nみ方を選ぶ人が多いのです。"}, {"t": 435.46666666666664, "x": "スイッチが入った後、男の態度はは\nっきり変わりやすいです。"}, {"t": 439.68333333333334, "x": "連絡が増える。"}, {"t": 440.8333333333333, "x": "二人だけで会おうと誘う。"}, {"t": 442.5, "x": "急に褒めるようになる。"}, {"t": 444.1, "x": "男にとっては、自然な次の一歩です。"}, {"t": 446.95, "x": "気持ちが決まったので、態度も決まります。"}, {"t": 449.85, "x": "けれども女から見ると、昨日までと\n違いすぎることがあります。"}, {"t": 454.1166666666667, "x": "まだ積もりきっていない時期\nだと、戸惑いが先に来ます。"}, {"t": 457.8, "x": "嬉しさより、驚きが大きいのです。"}, {"t": 460.48333333333335, "x": "どうしたんだろうと、少し距離を置\nきたくなる人もいるようです。"}, {"t": 464.53333333333336, "x": "これは、相手が嫌いだから引\nいているのではありません。"}, {"t": 468.01666666666665, "x": "変化の速さに、気持ちが追い\nついていないだけのことが多いで const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
