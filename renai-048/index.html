<script>
const D={"name": "男女が逆のタイプは何が起きているのか", "file": "048_男女が逆のタイプは何が起きているのか", "dur": 860.76665625, "segs": [], "subs": [{"t": 0.0, "x": "この手の話を見て、自分は逆だと\n感じた人がいるはずです。"}, {"t": 4.366666666666666, "x": "男の話のはずなのに、自分の方が当てはまる。"}, {"t": 7.966666666666667, "x": "女の話として出てきたのに、まったく身に覚えがない。"}, {"t": 11.8, "x": "そういう感想は、例外として片づけられがちです。"}, {"t": 15.4, "x": "けれども、実際にはかなりの数で出てきます。"}, {"t": 18.616666666666667, "x": "男女で分ける説明は、\n平均をならした形でしかありません。"}, {"t": 23.016666666666666, "x": "そして平均は、全員の\n真ん中にある値ではありません。"}, {"t": 27.616666666666667, "x": "背の高さを思い浮かべると、\n分かりやすいかもしれません。"}, {"t": 31.466666666666665, "x": "平均は男の方が高いですが、\n背の高い女性はいくらでもいます。"}, {"t": 36.25, "x": "恋愛での反応も、\nこれとよく似た形をしているようです。"}, {"t": 40.21666666666667, "x": "二つの山が少しずれて並んでいて、\n重なっている幅の方が広いです。"}, {"t": 45.06666666666667, "x": "だから男は、女は、と言い切った時点で\n外れる人が出ます。"}, {"t": 49.55, "x": "外れた人がおかしいのではなく、\n言い方の方が粗いだけです。"}, {"t": 53.8, "x": "今日は、その粗さを補う見方を\n一つだけ持ち帰ってもらいます。"}, {"t": 58.166666666666664, "x": "男女ではなく、AタイプとBタイプで\n並べ直す見方です。"}, {"t": 62.3, "x": "自分は逆だと感じてきた人ほど、\n使い道があると思います。"}, {"t": 66.76666666666667, "x": "先に言っておくと、当てはまらなかった側が\n少数派とは限りません。"}, {"t": 71.36666666666666, "x": "少数派どころか、半分近くいる場合もあります。"}, {"t": 74.93333333333334, "x": "まず、数の話から始めます。"}, {"t": 77.5, "x": "この種の説明に、自分は逆だと感じる人は\n珍しくありません。"}, {"t": 82.28333333333333, "x": "こういう動画に寄せられる感想の中でも、\nかなりの数を占めます。"}, {"t": 86.75, "x": "女性だけれど、男性側の説明の方が当てはまる。"}, {"t": 90.71666666666667, "x": "男性だけれど、女性側の説明の方が近い。"}, {"t": 94.41666666666667, "x": "両方が混ざっている気がする。"}, {"t": 96.35, "x": "そういう声が、毎回のように並びます。"}, {"t": 99.26666666666667, "x": "数が多いなら、もう例外の扱いにはなりません。"}, {"t": 102.8, "x": "説明の側が拾えていないと考える方が、\n自然な気がします。"}, {"t": 107.26666666666667, "x": "では、なぜ男女で分ける言い方が\n使われ続けるのでしょうか。"}, {"t": 111.33333333333333, "x": "理由は単純で、伝わる速さが違うからです。"}, {"t": 114.96666666666667, "x": "男はこうだと言うと、三秒で場面が浮かびます。"}, {"t": 118.66666666666667, "x": "Aタイプはこうだと言うと、まず説明が要ります。"}, {"t": 122.2, "x": "速さを取ると粗くなり、\n正確さを取ると届きにくくなります。"}, {"t": 126.56666666666666, "x": "どちらにも弱点があるので、\n使い分けるしかありません。"}, {"t": 130.4, "x": "この回は、粗い方を一度置いて、\n正確な方に寄せます。"}, {"t": 134.86666666666667, "x": "寄せた分だけ、当てはまらなかった人の\n居場所ができます。"}, {"t": 138.65, "x": "居場所ができると、話の続きが聞けるようになります。"}, {"t": 142.33333333333334, "x": "ここで一つ、はっきりさせておきたいことがあります。"}, {"t": 145.7, "x": "男女の差そのものが無い、\nと言いたいわけではありません。"}, {"t": 149.38333333333333, "x": "平均には、確かに少しの偏りがあるようです。"}, {"t": 152.95, "x": "問題は、その偏りの大きさをどう受け取るかです。"}, {"t": 156.55, "x": "たとえば、ある反応が男の六割、\n女の四割に出るとします。"}, {"t": 161.46666666666667, "x": "この時、男の方が多いという説明は\n間違いではありません。"}, {"t": 165.9, "x": "けれども、男の四割には当てはまりません。"}, {"t": 169.05, "x": "そして、女の四割には当てはまります。"}, {"t": 172.03333333333333, "x": "つまり、説明から外れる人が、\n当てはまる人と同じくらいいることになります。"}, {"t": 177.5, "x": "六割と四割は、体感としてはほとんど半々です。"}, {"t": 181.4, "x": "それでも、説明の言葉は男はこうだ、\nという形になります。"}, {"t": 186.06666666666666, "x": "言葉の強さと、数の偏りの大きさが合っていません。"}, {"t": 190.05, "x": "男女で分ける説明は、道案内としては便利です。"}, {"t": 193.86666666666667, "x": "地図として使うと、迷子が必ず出ます。"}, {"t": 196.93333333333334, "x": "迷子になった人が、自分はおかしいと\n感じてしまいます。"}, {"t": 200.81666666666666, "x": "そこが、いちばん困るところだと思います。"}, {"t": 203.7, "x": "偏りは目安として使い、当てはめには使わない。"}, {"t": 207.35, "x": "この距離感が、ちょうどいいように思います。"}, {"t": 210.3, "x": "主語が大きいと感じるのは、\n当てはめに使われた時です。"}, {"t": 214.2, "x": "目安として出されている限り、\nそこまで気になりません。"}, {"t": 217.86666666666667, "x": "そこで、男女という名前を一度外してみます。"}, {"t": 221.26666666666668, "x": "外した後に残るのは、二つの反応の型です。"}, {"t": 224.78333333333333, "x": "仮に、AタイプとBタイプと呼んでみます。"}, {"t": 227.88333333333333, "x": "Aタイプは、困った時にまず一人で\n整理したくなります。"}, {"t": 231.78333333333333, "x": "話すのは、整理がついた後の方が楽です。"}, {"t": 235.08333333333334, "x": "気持ちより、事実と段取りの方が扱いやすいです。"}, {"t": 238.88333333333333, "x": "Bタイプは、困った時にまず話したくなります。"}, {"t": 242.21666666666667, "x": "話しながら整理がついていく感覚があります。"}, {"t": 245.25, "x": "事実より、どう感じたかの方が先に出ます。"}, {"t": 248.5, "x": "この二つは、どちらが\n優れているという話ではありません。"}, {"t": 252.43333333333334, "x": "処理の順番が、逆になっているだけです。"}, {"t": 255.41666666666666, "x": "そして、Aタイプは男性に多く、\nBタイプは女性に多いようです。"}, {"t": 260.46666666666664, "x": "多いというだけで、全員ではありません。"}, {"t": 263.56666666666666, "x": "AとBが混ざった人も、同じくらいいるように見えます。"}, {"t": 267.3666666666667, "x": "場面によって切り替わる人も、珍しくありません。"}, {"t": 270.81666666666666, "x": "名前を変えるだけで、外れる人がかなり減ります。"}, {"t": 274.26666666666665, "x": "これから先も、この二つの名前で進めていきます。"}, {"t": 277.8, "x": "男女の言葉は、どうしても必要な場面だけに\n残します。"}, {"t": 281.73333333333335, "x": "ここからは、組み合わせの話です。"}, {"t": 284.28333333333336, "x": "男女が逆のタイプ同士で付き合う場合があります。"}, {"t": 287.55, "x": "男性がBタイプで、女性が\nAタイプという組み合わせです。"}, {"t": 291.8, "x": "この形は、実はかみ合いやすいことがあります。"}, {"t": 295.21666666666664, "x": "片方が話したがり、片方が整理したがるからです。"}, {"t": 298.98333333333335, "x": "役割の向きは合っているので、\n順番のずれが起きにくいです。"}, {"t": 303.25, "x": "問題が起きやすいのは、\nむしろ同じタイプ同士の時です。"}, {"t": 307.23333333333335, "x": "Aタイプ同士だと、どちらも黙って整理を始めます。"}, {"t": 311.05, "x": "整理が終わるまで、家の中に会話がありません。"}, {"t": 314.68333333333334, "x": "どちらも悪気が無いので、原因も見つかりません。"}, {"t": 318.23333333333335, "x": "Bタイプ同士だと、どちらも先に話し始めます。"}, {"t": 321.85, "x": "聞く側が空くので、話が二本のまま進みます。"}, {"t": 325.3833333333333, "x": "どちらも話したのに、\nどちらも聞いてもらえていません。"}, {"t": 328.93333333333334, "x": "つまり、合う合わないは性別では\n決まっていないようです。"}, {"t": 332.71666666666664, "x": "決まっているのは、タイプの組み合わせの方です。"}, {"t": 335.85, "x": "ここを間違えると、相性の判断まで外れてしまいます。"}, {"t": 339.8833333333333, "x": "逆のタイプだから駄目だった、\nとは限らないということです。"}, {"t": 343.68333333333334, "x": "実際、長く続いている二人ほど\n型がずれていることがあります。"}, {"t": 348.15, "x": "ずれている分、役割が自然に\n分かれているからかもしれません。"}, {"t": 352.5, "x": "自分は逆だと感じている人に、\nよくある感覚があります。"}, {"t": 356.6666666666667, "x": "同性の友人より、異性の友人と話が\n合うという感覚です。"}, {"t": 361.4166666666667, "x": "これも、タイプで見ると説明がつきそうです。"}, {"t": 364.46666666666664, "x": "Aタイプの女性は、Bタイプの女性と会話の\n速度が違います。"}, {"t": 369.01666666666665, "x": "気持ちの話が長く続くと、早く先に進みたくなります。"}, {"t": 373.23333333333335, "x": "そこで急かしてしまい、\n冷たいと言われることがあります。"}, {"t": 376.98333333333335, "x": "逆に、Bタイプの男性は、\n男同士の会話で浮きやすいです。"}, {"t": 381.8333333333333, "x": "感想を言いたいのに、\n解決の話に戻されてしまいます。"}, {"t": 385.98333333333335, "x": "どちらも、同性の側では居場所が作りにくくなります。"}, {"t": 389.75, "x": "その結果、異性の友人の方が楽だと感じます。"}, {"t": 393.6, "x": "この感覚を、自分の性格の問題だと\n考える人がいます。"}, {"t": 398.0833333333333, "x": "実際には、分け方の方が\n合っていないだけかもしれません。"}, {"t": 402.05, "x": "タイプで分ければ、同じ側の人はちゃんといます。"}, {"t": 405.3833333333333, "x": "同性にも異性にも、同じ型の人は\n必ず混ざっています。"}, {"t": 409.6333333333333, "x": "いると分かるだけで、\nずいぶん楽になることがあります。"}, {"t": 413.26666666666665, "x": "ここは、\n逆タイプの人がいちばん損をしてきた場所です。"}, {"t": 417.03333333333336, "x": "損の中身は、恋愛ではなく居場所の方でした。"}, {"t": 420.46666666666664, "x": "居場所が無いと、自分の反応の方を疑い始めます。"}, {"t": 424.45, "x": "自分がどちら寄りかは、\n三つの場面で見分けやすいです。"}, {"t": 428.23333333333335, "x": "一つ目は、嫌なことがあった直後です。"}, {"t": 431.1, "x": "一人になりたいなら、Aタイプ寄りです。"}, {"t": 433.9, "x": "誰かに話したいなら、Bタイプ寄りです。"}, {"t": 436.85, "x": "二つ目は、予定が急に空いた日です。"}, {"t": 439.6333333333333, "x": "家で何もしない日が回復になるなら、A寄りです。"}, {"t": 443.35, "x": "誰かと会う日の方が回復になるなら、B寄りです。"}, {"t": 447.01666666666665, "x": "三つ目は、褒められた時の反応です。"}, {"t": 449.8, "x": "どこが良かったのかを確かめたくなるなら、\nA寄りです。"}, {"t": 453.56666666666666, "x": "内容より、言ってもらえたことが\n嬉しいなら、B寄りです。"}, {"t": 457.85, "x": "三つとも同じ側なら、はっきりした型です。"}, {"t": 460.98333333333335, "x": "二対一で割れるなら、\n混ざった型ということになります。"}, {"t": 464.6333333333333, "x": "混ざった型は珍しくなく、むしろ多いように見えます。"}, {"t": 468.43333333333334, "x": "どちらかに決める必要は、まったくありません。"}, {"t": 471.56666666666666, "x": "決めることが目的ではなく、傾きを知るのが目的です。"}, {"t": 475.55, "x": "ここまでで、自分の側がだいたい出たはずです。"}, {"t": 478.8666666666667, "x": "出た側の名前を、覚えておいてください。"}, {"t": 481.8333333333333, "x": "三つとも当てはまらない、という人もいると思います。"}, {"t": 485.4, "x": "その場合は、場面ごとに切り替わる型だと\n考えてください。"}, {"t": 489.55, "x": "一度決まったタイプが、ずっと続くとも限りません。"}, {"t": 493.06666666666666, "x": "仕事で立場が変わると、反応の型は動きます。"}, {"t": 496.7, "x": "人に指示を出す立場になると、\n整理を先にする癖がつきます。"}, {"t": 501.25, "x": "逆に、一人の作業が続くと、\n話したい量が増えていきます。"}, {"t": 505.8333333333333, "x": "年齢でも変わることがあるようです。"}, {"t": 508.1333333333333, "x": "若い頃は話したかった人が、\n後から一人を選ぶようになる。"}, {"t": 512.2666666666667, "x": "その逆も、同じくらい起きています。"}, {"t": 514.9, "x": "体調や忙しさだけで、\n一時的に入れ替わることもあります。"}, {"t": 519.2333333333333, "x": "だから、昔の自分に当てはまった説明が、\n今は外れることがあります。"}, {"t": 524.4, "x": "外れた時に、相手が変わったと感じやすいです。"}, {"t": 527.8, "x": "実際には、自分の型が動いた場合もあります。"}, {"t": 531.3166666666667, "x": "ここを確かめない const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
