<script>
const D={"name": "SNSで気持ちが冷えるのは既読ではなくその外側", "file": "060_SNSで気持ちが冷えるのは既読ではなくその外側", "dur": 838.66665625, "segs": [], "subs": [{"t": 0.0, "x": "気持ちが冷める時、原因は連絡だと思われがちです。"}, {"t": 4.016666666666667, "x": "返信が遅い。"}, {"t": 5.216666666666667, "x": "既読のまま止まる。"}, {"t": 6.55, "x": "短い返事しか来ない。"}, {"t": 8.216666666666667, "x": "けれども実際に冷える瞬間は、もっと\n外側にあることが多いです。"}, {"t": 12.916666666666666, "x": "相手が誰と繋がっているか。"}, {"t": 14.883333333333333, "x": "何を載せて、何を載せないか。"}, {"t": 17.233333333333334, "x": "こちらに見せない顔が、そこに出ていないか。"}, {"t": 20.166666666666668, "x": "返信の速さは、その日の忙し\nさでいくらでも変わります。"}, {"t": 24.183333333333334, "x": "外側に並んでいるものは、忙しさでは変わりません。"}, {"t": 27.916666666666668, "x": "だから、そちらの方が答え合\nわせに使われやすいようです。"}, {"t": 31.866666666666667, "x": "男はその外側で、見えている\n繋がりに引っかかりやすいです。"}, {"t": 36.18333333333333, "x": "女はその外側で、扱いの差に引っかかりやすいです。"}, {"t": 40.083333333333336, "x": "同じ一つの投稿を見ても、止まる場所が違います。"}, {"t": 43.65, "x": "止まる場所が違うので、説明しても伝わりません。"}, {"t": 47.31666666666667, "x": "伝わらないまま問い詰めると、\n話は嘘の有無に移ります。"}, {"t": 51.43333333333333, "x": "嘘の有無の話になった時点で、\nたいてい両方が損をします。"}, {"t": 55.86666666666667, "x": "今日は、冷える場所を男女に分けて並べていきます。"}, {"t": 59.35, "x": "先に言っておくと、相手を調\nべる方法は一つも出てきません。"}, {"t": 63.63333333333333, "x": "調べて出てくるのは、事実では\nなく疑いの材料だけだからです。"}, {"t": 68.0, "x": "使うのは、聞き方と、見ない\n時間の作り方の二つです。"}, {"t": 72.25, "x": "まず、返信の速さの話を外しておきます。"}, {"t": 75.73333333333333, "x": "速い返事が来るから安心できるとは限りません。"}, {"t": 78.96666666666667, "x": "速さは、その週の予定でいくらでも動くからです。"}, {"t": 82.45, "x": "男は返信の速さを、余裕のあ\nるなしとして見やすいです。"}, {"t": 86.6, "x": "忙しい時期。"}, {"t": 87.78333333333333, "x": "仕事が重なった週。"}, {"t": 89.33333333333333, "x": "単に寝ていた夜。"}, {"t": 90.63333333333334, "x": "どれも、気持ちとは別の事情と\nして扱いやすいようです。"}, {"t": 94.5, "x": "女も、事情そのものは同じように分かっています。"}, {"t": 98.11666666666666, "x": "ただ、遅れた理由が出てこないと\n落ち着かないことがあります。"}, {"t": 101.95, "x": "遅れた事実より、間があいた\n説明が無いことが効きます。"}, {"t": 106.08333333333333, "x": "冷えるのは、その外側に別のものが見えた時です。"}, {"t": 109.76666666666667, "x": "返事が来ない日に、投稿だけ上がっている。"}, {"t": 112.76666666666667, "x": "相談には答えないのに、他の人には長く返している。"}, {"t": 116.75, "x": "こちらには見せない表情が、写真の中にある。"}, {"t": 120.1, "x": "並べて見えた時に、遅さの意味が変\nわってしまいます。"}, {"t": 123.76666666666667, "x": "遅さは、それ単体では何の材料にもなりません。"}, {"t": 127.33333333333333, "x": "だからここから先は、周りに並ぶものの話をします。"}, {"t": 131.2, "x": "男の側が止まりやすいのは、\n繋がりが見える場所です。"}, {"t": 135.08333333333334, "x": "やり取りの相手。"}, {"t": 136.25, "x": "写真に並んでいる人。"}, {"t": 137.93333333333334, "x": "反応を返している名前。"}, {"t": 139.76666666666668, "x": "どれも、こちらが知らない関係として目に入ります。"}, {"t": 143.26666666666668, "x": "自分の位置が何番目なのか分か\nらなくなるのが、きついようです。"}, {"t": 147.43333333333334, "x": "男は関係を、並び順で把握しやすいと言われます。"}, {"t": 151.43333333333334, "x": "一番に相談される。"}, {"t": 153.01666666666668, "x": "先に予定を聞かれる。"}, {"t": 154.56666666666666, "x": "写真に一緒に写る。"}, {"t": 156.13333333333333, "x": "その並びが崩れて見えると、\n外されたように感じることがあります。"}, {"t": 160.71666666666667, "x": "一方で女は、繋がりの数そのものには\n動じにくい場合があります。"}, {"t": 165.58333333333334, "x": "誰と話していたかより、こちらへの\n態度が変わったかを見ます。"}, {"t": 169.65, "x": "心が狭いとか、縛りたいだけと\nいう話に見えてしまいます。"}, {"t": 173.86666666666667, "x": "けれども中身は、順番を確か\nめたいだけのことも多いようです。"}, {"t": 178.18333333333334, "x": "順番さえ見えていれば、相手の交友は気に\nならなくなります。"}, {"t": 182.35, "x": "逆に、順番が見えない限り、\n何人減らしても落ち着きません。"}, {"t": 187.18333333333334, "x": "減らす交渉が続く関係は、たいてい途中で疲れます。"}, {"t": 191.13333333333333, "x": "疲れる理由は、減らしても欲\nしいものが出てこないからです。"}, {"t": 195.0, "x": "ここが、次の扱いの差の話と繋がっています。"}, {"t": 198.55, "x": "女の側が止まりやすいのは、\n扱いの差が見える場所です。"}, {"t": 202.63333333333333, "x": "返す相手と、返さない相手。"}, {"t": 205.2, "x": "丁寧な言葉と、雑な言葉。"}, {"t": 207.86666666666667, "x": "名前を出す相手と、出さない相手。"}, {"t": 210.56666666666666, "x": "誰と繋がっているかではなく、\n誰にどう向けているかを見ます。"}, {"t": 214.61666666666667, "x": "同じ人が、別の相手には長い文を書いている。"}, {"t": 218.08333333333334, "x": "こちらには一行なのに、そち\nらには写真まで添えている。"}, {"t": 222.03333333333333, "x": "並んで見えた時に、優先の順が数字では\nなく態度で出ます。"}, {"t": 226.55, "x": "男の側は、その差を差だと思\nっていないことがあります。"}, {"t": 230.38333333333333, "x": "話題が違うから長くなっただ\nけ、という感覚に近いようです。"}, {"t": 234.61666666666667, "x": "けれども、見ている側には理由が付いてきません。"}, {"t": 237.91666666666666, "x": "付いてこないので、態度の差だけが\n残ってしまいます。"}, {"t": 241.45, "x": "これは愛情の量を比べているのではありません。"}, {"t": 244.58333333333334, "x": "自分が雑に扱われていないかを、\n確かめているだけです。"}, {"t": 248.55, "x": "確かめが取れれば、相手が誰と話\nしていても気になりません。"}, {"t": 252.55, "x": "取れないまま続くと、丁寧さの\n差だけを集めるようになります。"}, {"t": 256.85, "x": "集め終わった頃には、気持ちがかなり削れています。"}, {"t": 260.45, "x": "削れ方の入口が、次の見せない顔の話です。"}, {"t": 264.1333333333333, "x": "いちばん静かに効くのは、知\nらない顔を見つけた時です。"}, {"t": 267.85, "x": "使ったことのない言葉づかい。"}, {"t": 269.76666666666665, "x": "見たことのない表情。"}, {"t": 271.31666666666666, "x": "行ったことのない店。"}, {"t": 272.8, "x": "聞いていない集まり。"}, {"t": 274.23333333333335, "x": "どれも、悪いことをしている証拠ではありません。"}, {"t": 277.48333333333335, "x": "それでも、見た側は自分の知\nっている相手と見比べてしまいます。"}, {"t": 281.8, "x": "男は、その顔を誰に向けているかで\n止まりやすいです。"}, {"t": 285.48333333333335, "x": "女は、その顔を自分に向けても\nらえないことで止まりやすいです。"}, {"t": 289.73333333333335, "x": "向ける先が気になる側と、向\nけられない自分が気になる側です。"}, {"t": 294.1, "x": "同じ一枚を見ても、痛む場所が違います。"}, {"t": 297.25, "x": "痛む場所が違うので、出てく\nる言葉もかみ合いません。"}, {"t": 300.8833333333333, "x": "誰と行ったのと聞かれた側は、\n疑われたと受け取ります。"}, {"t": 304.68333333333334, "x": "楽しそうでよかったねと言わ\nれた側は、嫌みに聞こえます。"}, {"t": 308.6333333333333, "x": "その顔を、こちらにも見せてほしいという話です。"}, {"t": 312.1, "x": "ところが、その一行はとても言いにくいものです。"}, {"t": 315.3666666666667, "x": "言いにくいので、遠回りの質問に化けてしまいます。"}, {"t": 318.93333333333334, "x": "遠回りの質問は、ほぼ確実に言い争いに変わります。"}, {"t": 323.1, "x": "言い方の直し方は、後半でもう一度出します。"}, {"t": 326.51666666666665, "x": "次は、二人のことをどこまで外に出すかのズレです。"}, {"t": 330.0833333333333, "x": "名前を出すのか。"}, {"t": 331.35, "x": "写真に入れるのか。"}, {"t": 332.75, "x": "ほのめかすだけにするのか。"}, {"t": 334.48333333333335, "x": "ここに正解はありませんが、\n二人で違うと必ず摩擦になります。"}, {"t": 339.15, "x": "男は、出す範囲を仕事や付き合\nいの都合で決めやすいです。"}, {"t": 343.3, "x": "取引先に見られる。"}, {"t": 344.78333333333336, "x": "同僚が見ている。"}, {"t": 346.05, "x": "家族が見ている。"}, {"t": 347.25, "x": "だから、出さない理由が関係の重さと\n結びつきません。"}, {"t": 351.15, "x": "女も同じ事情を持っていますが、\n線の引き方が違う場合があります。"}, {"t": 356.0, "x": "全部を出したいのではなく、\n消されていないかを確かめたいようです。"}, {"t": 360.3333333333333, "x": "まるごと隠すのと、そこに居\nると分かるのは別の話です。"}, {"t": 364.26666666666665, "x": "隠す側にその区別が無いと、\n丸ごと伏せる形になります。"}, {"t": 368.56666666666666, "x": "丸ごと伏せられた側は、存在\nごと外されたように感じます。"}, {"t": 372.81666666666666, "x": "逆に、出しすぎる側にも事情があることが多いです。"}, {"t": 376.56666666666666, "x": "出しておかないと、近づいて\nくる人が減らないという不安です。"}, {"t": 380.6333333333333, "x": "どちらの線も、本人の中では理由が通っています。"}, {"t": 384.3666666666667, "x": "通っている理由どうしなので、\n話し合わない限り合いません。"}, {"t": 388.4166666666667, "x": "合わせ方は、次の載せる載せ\nないの話で具体的に出します。"}, {"t": 392.6666666666667, "x": "載せてほしい側と、載せたくない側は、必ず出ます。"}, {"t": 396.73333333333335, "x": "載せてほしい側が欲しいのは、証拠ではありません。"}, {"t": 400.26666666666665, "x": "隠さなくていい相手として扱われている感覚です。"}, {"t": 403.6666666666667, "x": "記念日の写真。"}, {"t": 404.8666666666667, "x": "並んだ靴。"}, {"t": 405.85, "x": "予定を先に空けたこと。"}, {"t": 407.56666666666666, "x": "だから、載せない代わりに別の形で足\nすことができます。"}, {"t": 411.25, "x": "載せたくない側の理由も、たいていは真っ当です。"}, {"t": 414.65, "x": "職場に知られたくない。"}, {"t": 416.2, "x": "前の関係を掘り返されたくない。"}, {"t": 418.55, "x": "別れた時に、消す作業をした\nくないという人もいます。"}, {"t": 422.26666666666665, "x": "最後の理由は、口に出すと冷たく聞こえてしまいます。"}, {"t": 426.01666666666665, "x": "聞こえてしまうので、黙って線を引くことになります。"}, {"t": 429.55, "x": "黙って引かれた線は、相手からは\n軽く見られた印に映ります。"}, {"t": 433.8833333333333, "x": "男の側は、この理由を言葉に\nしないまま通しやすいようです。"}, {"t": 438.21666666666664, "x": "女の側は、理由さえ分かれば\n線に合わせられることが多いです。"}, {"t": 442.68333333333334, "x": "つまり、揉めているのは範囲では\nなく説明の有無です。"}, {"t": 446.35, "x": "範囲を広げなくても、理由を一行足\nせば収まることがあります。"}, {"t": 450.8666666666667, "x": "二人の間だけで足せるので、\n今日の夜にでもできます。"}, {"t": 454.55, "x": "反応の数を数えてしまう時期は、誰にでもあります。"}, {"t": 458.3333333333333, "x": "自分の投稿に付いたか。"}, {"t": 460.15, "x": "相手の投稿に誰が付けたか。"}, {"t": 462.26666666666665, "x": "数えている人が気にしているのは、\n数の大小ではない場合があります。"}, {"t": 466.95, "x": "前と比べてどうかという、変化の方を見ています。"}, {"t": 470.4166666666667, "x": "男は、自分の位置が下がったかを数えやすいです。"}, {"t": 474.01666666666665, "x": "反応が消えた。"}, {"t": 475.25, "x": "順番が後になった。"}, {"t": 476.75, "x": "名前が出なくなった。"}, {"t": 478.15, "x": "女は、扱いが変わったかを数えやすいと言われます。"}, {"t": 481.9, "x": "こちらにだけ反応が無い。"}, {"t": 483.6333333333333, "x": "同じ日に他の人には付いている。"}, {"t": 485.9 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
