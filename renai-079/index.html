<script>
const D={"name": "付き合う決め手が逆_男は楽さで女は安心で決めている", "file": "079_付き合う決め手が逆_男は楽さで女は安心で決めている", "dur": 824.76665625, "segs": [], "subs": [{"t": 0.0, "x": "付き合うかどうかを決める理由は、\n男女で逆になりやすいと言われます。"}, {"t": 4.683333333333334, "x": "男は一緒にいて楽かどうかで\n決めることが多いようです。"}, {"t": 8.233333333333333, "x": "女はこの人なら安心できるかどうかで\n決めることが多いようです。"}, {"t": 12.366666666666667, "x": "楽と安心は、似ている言葉に見えます。"}, {"t": 15.333333333333334, "x": "けれども見ている場所がまるで違います。"}, {"t": 17.8, "x": "男の楽は、今この時間の居心地のことです。"}, {"t": 21.2, "x": "女の安心は、この先を預けられるかどうかのことです。"}, {"t": 25.15, "x": "男は今日の二人を見て決めやすいです。"}, {"t": 27.783333333333335, "x": "女はこれからの二人を思い浮かべて決めやすいです。"}, {"t": 31.15, "x": "この違いを知らないと、頑張\nる場所を間違えてしまいます。"}, {"t": 35.1, "x": "好かれようと気を張るほど、\n男には楽じゃない人に見えます。"}, {"t": 39.13333333333333, "x": "気持ちを急いで伝えるほど、女には\n安心できない人に見えることがあります。"}, {"t": 44.416666666666664, "x": "どちらも相手を大事に思ったからこその動きです。"}, {"t": 47.666666666666664, "x": "それが逆に届いてしまうのは、もったいないことです。"}, {"t": 51.15, "x": "ここからは、付き合う決め手を男女の順に見\nていきます。"}, {"t": 54.81666666666667, "x": "告白の前に、相手の中で何が決\nまっているのかを追っていきます。"}, {"t": 59.333333333333336, "x": "終わりの方では、決め手を作\nる小さな習慣も紹介します。"}, {"t": 63.61666666666667, "x": "告白は、二人の始まりの場面だと思われがちです。"}, {"t": 67.45, "x": "けれども気持ちが決まるのはもっと\n前のことが多いです。"}, {"t": 70.85, "x": "告白の日は、決めたことを確かめ合う日に近いです。"}, {"t": 74.55, "x": "では気持ちが決まるのはいつなのでしょうか。"}, {"t": 77.2, "x": "何度か会ううちに、ふとした瞬間に心が傾きます。"}, {"t": 81.2, "x": "帰り道。"}, {"t": 82.2, "x": "食事の途中。"}, {"t": 83.31666666666666, "x": "何でもない待ち合わせの数分。"}, {"t": 85.43333333333334, "x": "その瞬間に、この人ならいいかもしれないと\n感じます。"}, {"t": 89.21666666666667, "x": "男はその瞬間が一度来ると気持ちが\n固まりやすいです。"}, {"t": 93.01666666666667, "x": "女はその瞬間が何度か重なってから\n固まりやすいです。"}, {"t": 96.86666666666666, "x": "どちらにも決め手になる一瞬があります。"}, {"t": 99.43333333333334, "x": "ただ何を見てそう感じたのかが男女で違います。"}, {"t": 102.65, "x": "告白の言葉を工夫しても結果が変\nわりにくいのは、このためです。"}, {"t": 107.0, "x": "決める瞬間は、たいてい本人も気\nづかないうちに過ぎています。"}, {"t": 111.2, "x": "告白の結果は、その時間の積み重ねで\n決まっています。"}, {"t": 115.11666666666666, "x": "決め手は、言葉よりも前の時間の中にあります。"}, {"t": 118.55, "x": "その時間の中で、男が見てい\nるものから話していきます。"}, {"t": 122.53333333333333, "x": "男が付き合うと決める時、い\nちばん大きいのは楽さだと言われます。"}, {"t": 127.31666666666666, "x": "話していて疲れない。"}, {"t": 128.78333333333333, "x": "黙っていても気まずくない。"}, {"t": 130.55, "x": "予定を合わせやすい。"}, {"t": 132.0, "x": "そういう相手と過ごすと、男は肩の力が抜\nけていきます。"}, {"t": 136.06666666666666, "x": "肩の力が抜けた時に、この人と続けたいと\n感じやすいです。"}, {"t": 140.43333333333334, "x": "男は外で気を張っている時間が長\nい人が多いようです。"}, {"t": 144.15, "x": "仕事の場。"}, {"t": 145.05, "x": "友達の前。"}, {"t": 146.15, "x": "初めて行く店。"}, {"t": 147.45, "x": "どこにいても、少しだけ格好をつけています。"}, {"t": 150.6, "x": "その格好を下ろせる相手は、そう多くはありません。"}, {"t": 154.16666666666666, "x": "だから下ろせた相手のことを特別に感じます。"}, {"t": 157.2, "x": "見た目や話の面白さは、入口では大事です。"}, {"t": 160.68333333333334, "x": "けれども決め手になるのは別のものです。"}, {"t": 163.23333333333332, "x": "会った後の帰り道の気分です。"}, {"t": 165.56666666666666, "x": "疲れていないか。"}, {"t": 166.73333333333332, "x": "また会うのが面倒ではないか。"}, {"t": 168.71666666666667, "x": "男はそこを言葉にしないまま感じ取っています。"}, {"t": 171.86666666666667, "x": "本人も、楽だから決めたとは\n気づいていないことがあります。"}, {"t": 175.83333333333334, "x": "それでも帰り道の気分は、正直に気持ちを\n動かしていきます。"}, {"t": 180.31666666666666, "x": "女が付き合うと決める時、大\nきいのは安心だと言われます。"}, {"t": 184.48333333333332, "x": "ここでいう安心は守ってもら\nえるという意味だけではありません。"}, {"t": 188.33333333333334, "x": "この人となら、先のことを一緒に考えられそうか。"}, {"t": 191.98333333333332, "x": "困った時に、黙っていなくなったりしないか。"}, {"t": 195.15, "x": "機嫌の悪い日でも、言葉が乱暴にならないか。"}, {"t": 198.46666666666667, "x": "女は会うたびに、こうした先の姿を少\nしずつ思い浮かべています。"}, {"t": 203.18333333333334, "x": "思い浮かべた姿が穏やかなら、\n気持ちが前に進みます。"}, {"t": 207.18333333333334, "x": "少しでも不安な姿が浮かぶと、\nそこで足が止まりやすいです。"}, {"t": 211.5, "x": "これは疑い深いからではありません。"}, {"t": 213.91666666666666, "x": "付き合うことを、自分の時間を預\nけることだと感じているからです。"}, {"t": 218.28333333333333, "x": "預ける以上は、相手のそばが\n落ち着く場所かを見たくなります。"}, {"t": 222.35, "x": "楽しい時間だけでは、まだ決\nめ手にはなりにくいです。"}, {"t": 225.88333333333333, "x": "楽しい時間のあとに、安心が残るかどうかを\n見ています。"}, {"t": 229.85, "x": "女はそこで一度立ち止まってから\n決めることが多いです。"}, {"t": 233.36666666666667, "x": "女自身も、決め手が何だったかは\n後から気づくことが多いです。"}, {"t": 237.78333333333333, "x": "男の楽さと聞くと、少しだら const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
