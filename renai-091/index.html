<script>
const D={"name": "気になる所が別_恋人の昔の恋が気になる理由は男女で別のところにある", "file": "091_気になる所が別_恋人の昔の恋が気になる理由は男女で別のところにある", "dur": 837.45, "segs": [], "subs": [{"t": 0.0, "x": "付き合っている恋人から、昔の恋の話を聞いた\n時の話です。"}, {"t": 4.65, "x": "前に付き合っていた人のことを、\nふとした会話で聞いてしまう。"}, {"t": 8.816666666666666, "x": "もう終わった話だと分かっている。"}, {"t": 10.983333333333333, "x": "それなのに、なぜか心がざわつく。"}, {"t": 13.65, "x": "そんな経験がある人は多いのではないでしょうか。"}, {"t": 16.866666666666667, "x": "聞かなければよかったと思う。"}, {"t": 18.733333333333334, "x": "でも、聞かずにはいられない。"}, {"t": 20.766666666666666, "x": "今日は、その気になる所が男女で\nどう違うかを見ていきます。"}, {"t": 24.85, "x": "先に答えを言っておきます。"}, {"t": 26.766666666666666, "x": "同じ話を聞いても、引っかかる\n場所は男女で別になりやすいです。"}, {"t": 31.266666666666666, "x": "男は、自分が前の人と比べられることが\n気になりやすいです。"}, {"t": 35.516666666666666, "x": "女は、恋人の中にまだ気持ちが\n残っているかが気になりやすいです。"}, {"t": 40.2, "x": "男が見ているのは、前の人と自分の差です。"}, {"t": 43.45, "x": "女が見ているのは、恋人と前の人のつながりです。"}, {"t": 47.13333333333333, "x": "この違いを知らないと、聞く時も答える\n時もずれていきます。"}, {"t": 51.266666666666666, "x": "安心させようとした一言が、\n相手を不安にさせることもあります。"}, {"t": 55.733333333333334, "x": "どちらの心が狭いという話ではありません。"}, {"t": 58.71666666666667, "x": "気になる場所が違うだけなのです。"}, {"t": 60.88333333333333, "x": "その場所を、場面ごとに一つずつ見ていきます。"}, {"t": 64.23333333333333, "x": "たとえば、\n恋人が昔の恋の話を少しだけしたとします。"}, {"t": 68.48333333333333, "x": "前の人とは三年くらい付き合っていた。"}, {"t": 71.13333333333334, "x": "よく旅行に行っていた。"}, {"t": 72.66666666666667, "x": "最後は自然に離れていった。"}, {"t": 74.7, "x": "話した内容はこれだけです。"}, {"t": 76.66666666666667, "x": "どれもよくある話です。"}, {"t": 78.35, "x": "それでも聞いた側の頭の中では、\n別々のことが起きます。"}, {"t": 82.61666666666666, "x": "男は、三年や旅行という\n言葉に引っかかりやすいです。"}, {"t": 86.55, "x": "自分はまだ、そこまでの時間を一緒に過ごしていない。"}, {"t": 90.18333333333334, "x": "旅行にも連れていったことがない。"}, {"t": 92.2, "x": "こうして前の人と自分を並べ始めます。"}, {"t": 95.0, "x": "一方で女は、自然に離れたという\n言葉に引っかかりやすいです。"}, {"t": 99.51666666666667, "x": "嫌いになって別れたわけではないのかもしれない。"}, {"t": 102.51666666666667, "x": "それなら、まだ少し気持ちが\n残っているのではないか。"}, {"t": 106.03333333333333, "x": "こうして恋人の心の奥をのぞこうとします。"}, {"t": 109.01666666666667, "x": "男は、前の人との差を測る物差しを持っています。"}, {"t": 112.76666666666667, "x": "女は、恋人の気持ちを測る温度計を持っています。"}, {"t": 116.58333333333333, "x": "同じ話を聞いても、取り出す道具が違うのです。"}, {"t": 120.08333333333333, "x": "測っているものが、そもそも別なのです。"}, {"t": 122.88333333333334, "x": "まずは男の物差しから見ていきます。"}, {"t": 125.41666666666667, "x": "男は恋人の昔の恋を聞くと、\n自分と並べてしまいやすいです。"}, {"t": 130.3, "x": "前の人はどんな仕事をしていたのか。"}, {"t": 132.76666666666668, "x": "どんな所に連れていっていたのか。"}, {"t": 134.95, "x": "どれくらい大事にしていたのか。"}, {"t": 136.93333333333334, "x": "こうしたことが点数表のように頭に浮かびます。"}, {"t": 140.21666666666667, "x": "頭の中で、勝手に採点が始まるのです。"}, {"t": 143.58333333333334, "x": "男は、自分の力で相手を喜ばせたい\n気持ちが強いと言われます。"}, {"t": 148.36666666666667, "x": "前の人のほうが喜ばせていたかもしれない。"}, {"t": 151.28333333333333, "x": "そう思うと落ち着かなくなるのです。"}, {"t": 153.46666666666667, "x": "自分は前の人より劣っていないだろうか。"}, {"t": 156.23333333333332, "x": "恋人は心の中で比べていないだろうか。"}, {"t": 159.16666666666666, "x": "こうした心配が、話を聞いたあとも残ります。"}, {"t": 162.6, "x": "ただし、男が気にしているのは、\n前の人そのものではありません。"}, {"t": 167.1, "x": "気にしているのは、恋人の目に映る自分の姿です。"}, {"t": 170.81666666666666, "x": "前の人に勝ちたいわけではないことが多いです。"}, {"t": 173.8, "x": "今の自分で足りているかを確かめたいのです。"}, {"t": 176.65, "x": "だから男は、前の人の話を詳しく\n聞きたがらないことがあります。"}, {"t": 181.3, "x": "聞けば聞くほど、比べる材料が増えるからです。"}, {"t": 184.63333333333333, "x": "平気なふりをして話を早く終わらせようとする\n人もいます。"}, {"t": 188.58333333333334, "x": "その裏で、ひそかに自分の点数を数えていることが\nあるのです。"}, {"t": 192.95, "x": "一方で女は、恋人の昔の恋を聞くと\n別のことを気にします。"}, {"t": 197.61666666666667, "x": "気持ちの行き先です。"}, {"t": 199.08333333333334, "x": "今でもその人を思い出すことがあるのか。"}, {"t": 201.73333333333332, "x": "連絡を取ることはあるのか。"}, {"t": 203.63333333333333, "x": "写真や贈り物はまだ手元にあるのか。"}, {"t": 206.36666666666667, "x": "こうしたことが、静かに気になり始めます。"}, {"t": 209.3, "x": "女は、関係の中の気持ちの動きに\n敏感な人が多いと言われます。"}, {"t": 214.2, "x": "比べられること自体は、男ほど\n気にしないこともあります。"}, {"t": 218.08333333333334, "x": "それより気になることがあります。"}, {"t": 220.11666666666667, "x": "恋人の心の一部が、まだ向こうにあるかどうかです。"}, {"t": 223.85, "x": "昔どれだけ楽しかったかは、\n終わったことなら受け止められます。"}, {"t": 227.88333333333333, "x": "でも気持ちが今も続いているなら、話は変わります。"}, {"t": 231.6, "x": "自分の座っている席は、 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
