<script>
const D={"name": "けんかを壊す話し方は4つ_いちばん危ないのは軽蔑だった", "file": "097_けんかを壊す話し方は4つ_いちばん危ないのは軽蔑だった", "dur": 816.5, "segs": [], "subs": [{"t": 0.0, "x": "別れに向かう夫婦のけんかには、\nある特徴があると言われます。"}, {"t": 4.25, "x": "けんかの中身より先に、話し方の型が\n出てくるのです。"}, {"t": 8.216666666666667, "x": "アメリカのゴットマン研究所は、\nその型に名前を付けました。"}, {"t": 12.366666666666667, "x": "名前が付いた型は4つだけです。"}, {"t": 14.6, "x": "批判と軽蔑、防御と石垣の4つです。"}, {"t": 17.816666666666666, "x": "研究所はこの4つを4人の騎士と呼んでいます。"}, {"t": 21.116666666666667, "x": "関係の終わりを予測しうる話し方として、\n並べているのです。"}, {"t": 25.55, "x": "なかでも、いちばん危ないとされるのが軽蔑です。"}, {"t": 28.966666666666665, "x": "研究所は、軽蔑が離婚のもっとも強い予測因子だと\n書いています。"}, {"t": 33.85, "x": "ただし、一度出たら必ず別れるという\n意味ではありません。"}, {"t": 37.88333333333333, "x": "4つの型は、仲のいい2人のけんかにも顔を出します。"}, {"t": 41.7, "x": "大事なのは、出たことに気づけるかどうかです。"}, {"t": 44.8, "x": "研究所は、それぞれの型に対処のしかたも\n示しています。"}, {"t": 48.86666666666667, "x": "今日は4つの型を、一つずつ見ていきます。"}, {"t": 51.96666666666667, "x": "普通の不満との違いも一緒に見ていきます。"}, {"t": 54.88333333333333, "x": "自分の口ぐせに近いものがないか、\n確かめながら聞いてみてください。"}, {"t": 59.53333333333333, "x": "けんかそのものは悪いことではありません。"}, {"t": 62.15, "x": "一緒に暮らせば、ぶつかる場面は必ず出てきます。"}, {"t": 65.73333333333333, "x": "研究所が見ているのは、けんかの\n回数より話し方です。"}, {"t": 69.8, "x": "同じ不満でも、言い方しだいで行き先が変わります。"}, {"t": 73.45, "x": "1つ目は批判です。"}, {"t": 74.93333333333334, "x": "相手のしたことではなく、人柄\nそのものを責める言い方です。"}, {"t": 79.03333333333333, "x": "2つ目は軽蔑です。"}, {"t": 80.61666666666666, "x": "見下したり、皮肉を言ったりする態度です。"}, {"t": 83.6, "x": "あきれた顔をして見せるのも、軽蔑に入ります。"}, {"t": 87.03333333333333, "x": "3つ目は防御です。"}, {"t": 88.5, "x": "責められた時に言い訳をして、\n責任を相手に返す言い方です。"}, {"t": 93.03333333333333, "x": "4つ目は石垣です。"}, {"t": 94.61666666666666, "x": "話の途中で心を閉じて、会話から\n抜けてしまうことです。"}, {"t": 98.7, "x": "相手の前に石の壁を積むような態度だと\n思うと、分かりやすいです。"}, {"t": 103.45, "x": "4つとも、言っている本人は気づきにくいものです。"}, {"t": 106.93333333333334, "x": "腹が立っている時ほど、自然に\n口から出てしまうからです。"}, {"t": 110.85, "x": "だからこそ、名前を知っておくことに意味があります。"}, {"t": 114.38333333333334, "x": "名前があれば、今のは批判だったかも\nしれないと振り返れます。"}, {"t": 118.6, "x": "ここからは一つずつ中身を見ていきます。"}, {"t": 121.25, "x": "最初は批判です。"}, {"t": 122.65, "x": "研究所は、批判と不満をはっきり分けています。"}, {"t": 126.16666666666667, "x": "不満は相手のしたことについての話です。"}, {"t": 128.98333333333332, "x": "批判は相手の人柄への攻撃です。"}, {"t": 131.6, "x": "例を一つ挙げてみます。"}, {"t": 133.25, "x": "相手の帰りが遅く、連絡もなかった夜のことです。"}, {"t": 137.03333333333333, "x": "遅くなるのに連絡がなくて怖かった。"}, {"t": 139.56666666666666, "x": "これは不満の言い方です。"}, {"t": 141.36666666666667, "x": "起きたことと、自分の気持ちだけを伝えています。"}, {"t": 144.78333333333333, "x": "あなたはいつも周りのことを考えない人だ。"}, {"t": 147.76666666666668, "x": "これは批判の言い方です。"}, {"t": 149.55, "x": "一度の遅れが、人柄の話にすり替わっています。"}, {"t": 153.15, "x": "いつもとか絶対にという言葉が\n入ると、批判に近づきます。"}, {"t": 157.46666666666667, "x": "言われた人は、自分という人間を\n否定された気がします。"}, {"t": 161.4, "x": "すると謝るより先に、身を守りたくなります。"}, {"t": 164.73333333333332, "x": "ここで次の型である防御が呼び出されやすくなります。"}, {"t": 168.15, "x": "不満を持つこと自体は、自然なことです。"}, {"t": 171.06666666666666, "x": "問題になるのは、不満が人柄への\n攻撃に変わった時です。"}, {"t": 175.43333333333334, "x": "同じ夜の同じ出来事でも、言い方で\n行き先が分かれるのです。"}, {"t": 179.75, "x": "では批判の代わりにどう言えばいいのでしょうか。"}, {"t": 182.63333333333333, "x": "研究所は穏やかな切り出しを勧めています。"}, {"t": 185.7, "x": "相手を責めずに、不満を伝える言い方です。"}, {"t": 189.08333333333334, "x": "中心にあるのは、相手ではなく自分の気持ちです。"}, {"t": 192.65, "x": "あなたはで始めると批判になりやすいです。"}, {"t": 195.41666666666666, "x": "自分の気持ちから始めると、\n不満のまま伝わりやすいです。"}, {"t": 199.7, "x": "研究所の例はこういう形です。"}, {"t": 202.11666666666667, "x": "今夜は話の輪から外れた気が\nして、少しもやもやしている。"}, {"t": 206.33333333333334, "x": "今日あったことを、聞いてもらってもいいかな。"}, {"t": 209.23333333333332, "x": "相手を責める言葉は一つもありません。"}, {"t": 211.78333333333333, "x": "あるのは自分の気持ちと、してほしいことだけです。"}, {"t": 215.2, "x": "これなら言われた人も身構えずにすみます。"}, {"t": 217.91666666666666, "x": "遅くなった夜の例でも、同じ形が使えます。"}, {"t": 221.41666666666666, "x": "連絡がなくて心配だった。"}, {"t": 223.36666666666667, "x": "次は一言だけ送ってもらえると安心する。"}, {"t": 226.31666666666666, "x": "こう言えば相手は謝りやすくなります。"}, {"t": 228.93333333333334, "x": "切り出しの一言で、けんかの\n行き先はかなり変わります。"}, {"t": 232.71666666666667, "x": "最初の一言は、思っている以上に大事なのです。"}, {"t": 236.23333333333332, "x": "2つ目は軽蔑です。"}, {"t": 237.81666666666666, "x": "軽蔑は、 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
