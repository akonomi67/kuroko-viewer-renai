<script>
const D={"name": "嬉しい一言が逆_男が言われて嬉しい一言と女が言われて嬉しい一言", "file": "074_嬉しい一言が逆_男が言われて嬉しい一言と女が言われて嬉しい一言", "dur": 783.76665625, "segs": [], "subs": [{"t": 0.0, "x": "男が言われて嬉しい一言と、女が言われ\nて嬉しい一言は中身が逆になりやすいです。"}, {"t": 6.166666666666667, "x": "同じ嬉しいでも、心が動く場所が違うからです。"}, {"t": 9.766666666666667, "x": "男は自分のしたことを認めら\nれた時に嬉しくなりやすいです。"}, {"t": 13.833333333333334, "x": "女は自分のことを覚えていても\nらえた時に嬉しくなりやすいです。"}, {"t": 18.083333333333332, "x": "男は結果に触れる一言で顔がゆるみます。"}, {"t": 21.1, "x": "女は途中の気持ちに触れる一言で心が\nほどけやすいと言われます。"}, {"t": 25.566666666666666, "x": "男は人前で立ててもらった一言を長く覚えています。"}, {"t": 29.316666666666666, "x": "女は二人きりの時の言い方まで覚えています。"}, {"t": 32.583333333333336, "x": "この違いを知らないと困ることがあります。"}, {"t": 35.25, "x": "喜ばせたくて言った言葉が素通りするのです。"}, {"t": 38.13333333333333, "x": "褒めたのに反応が薄い。"}, {"t": 39.9, "x": "お礼を言ったのに伝わった気がしない。"}, {"t": 42.266666666666666, "x": "好きと言ったのに物足りなさそうな顔をされる。"}, {"t": 45.083333333333336, "x": "原因は言葉の量ではありません。"}, {"t": 47.733333333333334, "x": "中身のずれから起きることが多いです。"}, {"t": 50.18333333333333, "x": "逆に届く一言を一つ知ってい\nれば好かれ方が変わります。"}, {"t": 53.916666666666664, "x": "付き合う前の距離が変わります。"}, {"t": 55.95, "x": "付き合い始めの空気も変わっていきます。"}, {"t": 58.583333333333336, "x": "今日は男女それぞれが言われ\nて嬉しい一言を並べていきます。"}, {"t": 62.55, "x": "相手の顔を思い浮かべながら見てみてください。"}, {"t": 65.53333333333333, "x": "嬉しい一言と聞くと、甘い言葉を思\nい浮かべる人が多いです。"}, {"t": 69.95, "x": "好き。"}, {"t": 71.03333333333333, "x": "かわいい。"}, {"t": 71.83333333333333, "x": "かっこいい。"}, {"t": 72.75, "x": "もちろん嬉しい場面はたくさんあります。"}, {"t": 75.3, "x": "けれども心に長く残る一言は意外と地味です。"}, {"t": 78.65, "x": "男が後から何度も思い出す一言があります。"}, {"t": 81.85, "x": "自分のしたことが届いた一言です。"}, {"t": 84.23333333333333, "x": "運転がうまいね。"}, {"t": 85.51666666666667, "x": "この店を選んでくれてよかった。"}, {"t": 87.6, "x": "女が後から思い出すのは別の一言です。"}, {"t": 90.56666666666666, "x": "自分を見てくれていた一言です。"}, {"t": 92.76666666666667, "x": "髪を少し切ったね。"}, {"t": 94.25, "x": "昨日は遅くまで大変だったね。"}, {"t": 96.48333333333333, "x": "どちらも甘い言葉ではありません。"}, {"t": 98.71666666666667, "x": "それでも甘い言葉より深く入ることがあります。"}, {"t": 101.85, "x": "理由は、その人だけに向けた言葉だからです。"}, {"t": 105.01666666666667, "x": "好きやかわいいは誰にでも言える言葉です。"}, {"t": 107.7, "x": "そう受け取られることもあります。"}, {"t": 109.65, "x": "一方で変化に触れた言葉は、\n相手を見ていないと言えません。"}, {"t": 113.83333333333333, "x": "見てもらえていると分かると、言葉は特別になります。"}, {"t": 117.48333333333333, "x": "ただ、どこを見てほしいかは男女で違いやすいです。"}, {"t": 120.96666666666667, "x": "その違いを一つずつ見ていきます。"}, {"t": 123.23333333333333, "x": "男は自分の腕前を認められると\n嬉しくなりやすいです。"}, {"t": 127.03333333333333, "x": "腕前といっても大げさなものではありません。"}, {"t": 129.86666666666667, "x": "道に詳しい。"}, {"t": 131.03333333333333, "x": "料理の段取りがいい。"}, {"t": 132.53333333333333, "x": "機械の扱いに慣れている。"}, {"t": 134.4, "x": "小さな得意に触れられると顔がゆるみます。"}, {"t": 137.23333333333332, "x": "さすがだね。"}, {"t": 138.15, "x": "詳しいんだね。"}, {"t": 139.33333333333334, "x": "それ上手だね。"}, {"t": 140.46666666666667, "x": "短い言葉ですが、男にはかなり嬉しい一言です。"}, {"t": 144.26666666666668, "x": "男は好かれることと認められ\nることを近く感じやすいからです。"}, {"t": 148.3, "x": "認めてくれた相手をもっと知\nりたくなることもあります。"}, {"t": 151.6, "x": "付き合う前なら、ここから距離が縮\nまることも珍しくありません。"}, {"t": 155.86666666666667, "x": "一方で女は、腕前を認められても\n少し引いて受け取ることがあります。"}, {"t": 160.86666666666667, "x": "上手だねと言われることもあります。"}, {"t": 163.06666666666666, "x": "それでも、たまたまですと返す人が多いようです。"}, {"t": 166.41666666666666, "x": "女には腕前より、取り組んだ気持ちの\n方が大事な場合があります。"}, {"t": 171.15, "x": "同じさすがでも、受け取る深さが違うのです。"}, {"t": 174.33333333333334, "x": "男にはできたことへの一言がまっすぐ届きやすいです。"}, {"t": 177.93333333333334, "x": "では女には、どんな一言が届きやすいのでしょうか。"}, {"t": 181.63333333333333, "x": "女は自分の話を覚えていても\nらえると嬉しくなりやすいです。"}, {"t": 185.81666666666666, "x": "前に好きだと言っていた食べ物。"}, {"t": 187.91666666666666, "x": "行きたいと話していた場所。"}, {"t": 189.7, "x": "苦手だと言っていたこと。"}, {"t": 191.31666666666666, "x": "相手がそれを覚えていたとします。"}, {"t": 193.45, "x": "さりげなく口にされた時に心が動きます。"}, {"t": 196.43333333333334, "x": "この前言ってた店、予約してみたよ。"}, {"t": 199.4, "x": "甘いものは控えてるって言ってたよね。"}, {"t": 201.81666666666666, "x": "この一言には、話をちゃんと\n聞いていたという意味が入っています。"}, {"t": 206.23333333333332, "x": "覚えていてもらえることは、\n大事にされている証拠のようなものです。"}, {"t": 210.61666666666667, "x": "だから高い贈り物より、小さ\nな記憶の方が嬉しいことがあります。"}, {"t": 215.45, "x": "一方で男は、話を覚 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
