<script>
const D={"name": "呼び方が変わる日_名前の呼び方を変える意味は男女でまるで違う", "file": "095_呼び方が変わる日_名前の呼び方を変える意味は男女でまるで違う", "dur": 814.0, "segs": [], "subs": [{"t": 0.0, "x": "知り合ったばかりの男女は、\nたいてい名字にさんをつけて呼び合います。"}, {"t": 4.4, "x": "それがある日、下の名前や呼び捨てに変わります。"}, {"t": 7.833333333333333, "x": "今日は付き合う前後に起きる、\nこの呼び方の変化の話です。"}, {"t": 12.1, "x": "先に答えを言っておきます。"}, {"t": 14.0, "x": "呼び方を変える意味は、男女で\nまるで違うことが多いです。"}, {"t": 18.0, "x": "男にとっては、近づけたかを\n確かめる手段になりやすいです。"}, {"t": 22.2, "x": "女にとっては、特別になったことの\n証になりやすいです。"}, {"t": 26.233333333333334, "x": "男は呼び方を変えて、距離が縮んだかを試します。"}, {"t": 30.033333333333335, "x": "女は呼び方が変わると、自分の立場も変わったと\n受け取ります。"}, {"t": 34.53333333333333, "x": "男は軽い一歩のつもりで変えることがあります。"}, {"t": 37.63333333333333, "x": "女はその一歩を、大きな節目として\n覚えていることがあります。"}, {"t": 41.96666666666667, "x": "男はその日の気分で、元の呼び方に戻すことが\nあります。"}, {"t": 46.15, "x": "女は戻されると立場まで戻された気がします。"}, {"t": 49.266666666666666, "x": "同じ名前の呼び方なのに、重さがまるで違うのです。"}, {"t": 53.03333333333333, "x": "この違いを知らないと、好き同士でも行き違いが\n積もります。"}, {"t": 57.11666666666667, "x": "呼んだほうは何も変えていないつもりです。"}, {"t": 59.733333333333334, "x": "呼ばれたほうは、何かが変わったと感じています。"}, {"t": 63.016666666666666, "x": "どちらかが軽いとか重いとかいう話ではありません。"}, {"t": 66.35, "x": "呼び方に乗せているものが男女で別なだけです。"}, {"t": 69.41666666666667, "x": "その中身を場面ごとに見ていきます。"}, {"t": 71.85, "x": "名前の呼び方には大きく二つの働きがあります。"}, {"t": 75.33333333333333, "x": "一つは二人の距離を測るものさしの働きです。"}, {"t": 78.56666666666666, "x": "もう一つは自分の立場を示す名札の働きです。"}, {"t": 81.98333333333333, "x": "男はものさしとして使いやすいと言われます。"}, {"t": 84.93333333333334, "x": "呼び方を変えて、相手がどう返すかを見ます。"}, {"t": 88.13333333333334, "x": "嫌がられなければ、もう少し近づいてもいいと\n考えます。"}, {"t": 92.01666666666667, "x": "嫌がられたら、少し戻して測り直します。"}, {"t": 95.18333333333334, "x": "一方で女は名札として受け取りやすいようです。"}, {"t": 98.41666666666667, "x": "呼び方が変わると、自分の札が書き換わったと\n感じます。"}, {"t": 102.46666666666667, "x": "ただの知り合いから気になる人へ。"}, {"t": 104.7, "x": "気になる人から特別な一人へ。"}, {"t": 106.91666666666667, "x": "そういう書き換えとして受け取るのです。"}, {"t": 109.23333333333333, "x": "ものさしは何度当て直しても構わない道具です。"}, {"t": 112.43333333333334, "x": "名札は一度書き換えたら簡単には戻せません。"}, {"t": 115.66666666666667, "x": "ここに男女のずれの元があります。"}, {"t": 117.91666666666667, "x": "男は測り直すつもりで、気軽に呼び方を変えます。"}, {"t": 121.8, "x": "女は札が書き換わったと思って、大事に受け取ります。"}, {"t": 125.68333333333334, "x": "どちらも間違ってはいません。"}, {"t": 127.56666666666666, "x": "同じ呼び方を、別の道具として\n使っているだけなのです。"}, {"t": 131.6, "x": "では、呼び方はいつ変わりやすいのでしょうか。"}, {"t": 134.73333333333332, "x": "ここでも男女で目安が違います。"}, {"t": 137.01666666666668, "x": "男は会った回数ややり取りの\n多さで、時期を決めやすいです。"}, {"t": 141.35, "x": "三回ほど二人で出かけた。"}, {"t": 143.26666666666668, "x": "夜のやり取りが毎日続いている。"}, {"t": 145.58333333333334, "x": "冗談を言っても笑ってくれるようになった。"}, {"t": 148.18333333333334, "x": "そういう手応えが重なると、\nそろそろいいかなと考えます。"}, {"t": 152.33333333333334, "x": "男にとっては、ここまで来たという確認の一歩です。"}, {"t": 155.91666666666666, "x": "一方で女は、関係に名前がついた\n時を区切りにしやすいようです。"}, {"t": 160.75, "x": "付き合おうと言われた日。"}, {"t": 162.33333333333334, "x": "相手の友達に紹介された日。"}, {"t": 164.63333333333333, "x": "次の予定が当たり前に決まるようになった日。"}, {"t": 167.66666666666666, "x": "そういう節目のあとで、\n呼び方を変えたくなりやすいのです。"}, {"t": 171.71666666666667, "x": "この差があると、男が先に呼び方を変えることが\nあります。"}, {"t": 175.83333333333334, "x": "女はまだ節目が来ていないので少し戸惑います。"}, {"t": 179.05, "x": "うれしい気持ちと、まだ早いという気持ちが\n同時に来ます。"}, {"t": 182.91666666666666, "x": "男はその戸惑いを、嫌がられたと\n読み違えることがあります。"}, {"t": 187.16666666666666, "x": "そこで呼び方を引っ込めてしまう人もいます。"}, {"t": 190.01666666666668, "x": "気持ちがないのではありません。"}, {"t": 191.93333333333334, "x": "変える時期の目印が、\n男女で違っているだけなのです。"}, {"t": 195.68333333333334, "x": "もう少し男の頭の中をのぞいてみます。"}, {"t": 198.63333333333333, "x": "男が初めて呼び捨てにする時があります。"}, {"t": 201.5, "x": "それは小さな試しのつもりのことが多いです。"}, {"t": 204.5, "x": "さんを外したら、相手は嫌がるだろうか。"}, {"t": 207.45, "x": "返事の声がいつもより明るくなるだろうか。"}, {"t": 210.26666666666668, "x": "次に会った時、相手も呼び方を変えてくれるだろうか。"}, {"t": 214.06666666666666, "x": "そういう反応をこっそり見ています。"}, {"t": 216.38333333333333, "x": "知らない店の扉を少しだけ開けて、\n中をのぞく感覚に近いです。"}, {"t": 221.08333333333334, "x": "入っていい雰囲気なら、そのまま入ります。"}, {"t": 224.13333333333333, "x": "まだ早そうなら扉をそっと閉めます。"}, {"t": 226.6, "x": "そして元の呼び方に戻します。"}, {"t": 228.78333333333333, "x": "だから男の呼び方は const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
