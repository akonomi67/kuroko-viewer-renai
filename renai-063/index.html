<script>
const D={"name": "更年期に入ってから二人の間で変わること", "file": "063_更年期に入ってから二人の間で変わること", "dur": 809.81665625, "segs": [], "subs": [{"t": 0.0, "x": "長く一緒にいる二人に、ある時期から\n小さな変化が出ることがあります。"}, {"t": 4.766666666666667, "x": "前より疲れやすく見える。"}, {"t": 6.6, "x": "些細な一言で空気が変わる。"}, {"t": 8.7, "x": "同じ部屋にいても、距離が少し遠く感じる。"}, {"t": 11.866666666666667, "x": "こうした変化を、気持ちが冷めた印だと\n受け取ってしまう人は多いです。"}, {"t": 16.633333333333333, "x": "けれども、その多くは気持ちでは\nなく体の波から来ている場合があります。"}, {"t": 21.533333333333335, "x": "四十代から五十代にかけては、体の変\nわり目を感じやすい時期と言われます。"}, {"t": 26.883333333333333, "x": "その感じ方は人によって大き\nく違い、決まった形はありません。"}, {"t": 31.5, "x": "男はこの時期、相手の変化を解決\nすべき問題として見やすいです。"}, {"t": 36.4, "x": "一方で女は、この時期の自分を\nうまく説明できないことに疲れやすいです。"}, {"t": 41.65, "x": "男は理由が分かれば動けると考えやすい。"}, {"t": 44.733333333333334, "x": "女は理由が分からなくても分かってほしいと\n感じやすい。"}, {"t": 48.43333333333333, "x": "そして同じ年代の男にも、気力の揺れを\n感じる人がいます。"}, {"t": 52.86666666666667, "x": "こういう違いを知らないままでいると、支\nえたい側と支えられたい側がすれ違います。"}, {"t": 58.7, "x": "心配のつもりの言葉が責めているように\n聞こえ、黙っていると無関心に見える。"}, {"t": 64.1, "x": "そうやって、どちらも悪くないのに\n二人の間が固くなっていきます。"}, {"t": 68.66666666666667, "x": "今日は、この時期に二人の間で変\nわりやすいことを順に並べていきます。"}, {"t": 73.46666666666667, "x": "先に言っておくと、体の仕組みや\n治し方の話は出てきません。"}, {"t": 77.96666666666667, "x": "扱うのは、受け取り方と声のかけ方だけです。"}, {"t": 81.35, "x": "まず、相手が変わったと感じ\nた時の見方から外していきます。"}, {"t": 85.55, "x": "前より口数が減った。"}, {"t": 87.26666666666667, "x": "すぐ横になる。"}, {"t": 88.38333333333334, "x": "予定を断ることが増えた。"}, {"t": 90.31666666666666, "x": "こうした変化を見ると、性格が変\nわったように見えることがあります。"}, {"t": 94.98333333333333, "x": "けれども多くの場合、変わったのは\n性格ではなく、その日の波です。"}, {"t": 99.95, "x": "波は、本人にも読めないことがあると言われます。"}, {"t": 103.3, "x": "朝は元気だったのに、昼には動けない。"}, {"t": 106.26666666666667, "x": "昨日平気だったことが、今日はつらい。"}, {"t": 108.9, "x": "男は、この波を一日の予定の問題と\nして受け取りやすいです。"}, {"t": 113.46666666666667, "x": "今日は無理なら明日にしよう、と\n日付で調整しようとします。"}, {"t": 117.65, "x": "一方で女は、波そのものより\n波が読めないことに消耗しやすいです。"}, {"t": 122.65, "x": "予定を立てても守れないかも\nしれない不安が、ずっと残ります。"}, {"t": 126.93333333333334, "x": "ここで予定の話だけを進めると、\n本人は責められた気持ちになります。"}, {"t": 131.85, "x": "これは相手がわがままになったのではありません。"}, {"t": 134.81666666666666, "x": "自分の体の天気が、自分でも読\nめなくなっているだけなのかもしれません。"}, {"t": 139.68333333333334, "x": "天気が読めない人には、予定よ\nり先に余白の方が必要になります。"}, {"t": 144.6, "x": "その余白が見えにくい理由が、\n次の説明しにくさの話です。"}, {"t": 149.18333333333334, "x": "女の側がつらいと感じやすいのは、\n重さを言葉にできない日です。"}, {"t": 153.73333333333332, "x": "どこが痛いとも言えない。"}, {"t": 155.38333333333333, "x": "熱があるわけでもない。"}, {"t": 156.96666666666667, "x": "それでも、いつも通りに動けない感じだけがある。"}, {"t": 160.33333333333334, "x": "こういう日を、うまく説明できずに\n困る人は少なくないようです。"}, {"t": 164.81666666666666, "x": "説明できないので、周りからは\n元気そうに見えてしまいます。"}, {"t": 169.08333333333334, "x": "元気そうに見えるので、いつも\n通りの頼まれごとが来ます。"}, {"t": 173.06666666666666, "x": "断ると理由を聞かれ、答えられずにまた疲れる。"}, {"t": 176.55, "x": "女はこの繰り返しの中で、分か\nってもらうこと自体を諦めやすいです。"}, {"t": 181.55, "x": "諦めると、口数が減って一人で横に\nなる時間が増えます。"}, {"t": 185.91666666666666, "x": "一方で男は、その静けさを怒\nっている印だと受け取りやすいです。"}, {"t": 190.63333333333333, "x": "何か悪いことをしたかと考え、理由を探し始めます。"}, {"t": 194.78333333333333, "x": "けれども、そこに理由が見つか\nることはあまりありません。"}, {"t": 198.43333333333334, "x": "探しても出てこない理由を、\n相手に聞き出そうとしてしまいます。"}, {"t": 202.68333333333334, "x": "聞かれた側は、説明できない\nことをまた説明させられる形になります。"}, {"t": 207.63333333333333, "x": "必要なのは原因の特定ではなく、\n説明しなくていい時間なのかもしれません。"}, {"t": 213.28333333333333, "x": "そしてこの説明しにくさは、\n女だけのものでもありません。"}, {"t": 217.26666666666668, "x": "男の側にも、同じ年代で揺れを\n感じる人がいると言われます。"}, {"t": 221.73333333333332, "x": "前ほど気力が続かない。"}, {"t": 223.53333333333333, "x": "休んでも疲れが抜けにくい。"}, {"t": 225.46666666666667, "x": "好きだったことに、なぜか気持ちが向かない。"}, {"t": 228.4, "x": "こういう変化を、男はなかなか\n口に出さないことがあります。"}, {"t": 232.41666666666666, "x": "口に出すと、弱っていると思\nわれそうで言いにくいようです。"}, {"t": 236.35, "x": "言いにくいので、仕事が忙し\nいという形にまとめてしまいます。"}, {"t": 240.75, "x": "まとめてしまうと、本人も自分の揺\nれに気づきにくくなります。"}, {"t": 244.91666666666666, "x": "男はこの揺れを、気合いが足\nりないせいだと考えやすいです。"}, {"t": 249.03333333333333, "x": "一方で女は、相手の元気のなさを\n自分への関心の低さと重ねやすいです。"}, {"t": 254.51666666666668, "x": "話しかけても返事が短い。"}, {"t": 256.55, "x": "休みの日も出かけたがらない。"}, {"t": 258.4166666666667, "x": "そこから、自分と過ごすのが\nつまらないのかと感じてしまいます。"}, {"t": 262.56666666666666, "x": "けれども実際は、自分のことで\n手一杯なだけの場合があります。"}, {"t": 266.9166666666667, "x": "これは相手への気持ちが減ったのではありません。"}, {"t": 269.8666666666667, "x": "気持ちを外に出す力が、一時的に細\nくなっているだけなのです。"}, {"t": 274.3666666666667, "x": "二人とも揺れの時期に入ると、\n支える側がいない状態になります。"}, {"t": 279.1666666666667, "x": "その時にまず変わりやすいのが、触れ方と距離です。"}, {"t": 282.68333333333334, "x": "この時期、二人の間の距離が変\nわったと感じる人は多いです。"}, {"t": 287.1666666666667, "x": "隣に座る回数が減る。"}, {"t": 289.0833333333333, "x": "手が触れると少し身を引く。"}, {"t": 290.9166666666667, "x": "寝る前の会話が短くなる。"}, {"t": 292.96666666666664, "x": "こうした変化は、気持ちよりも\n体の感じ方から来ることがあります。"}, {"t": 297.53333333333336, "x": "触れられると暑く感じる日。"}, {"t": 299.43333333333334, "x": "人の気配が重く感じる日。"}, {"t": 301.48333333333335, "x": "一人で静かにしていたい日。"}, {"t": 303.3833333333333, "x": "男は、距離が空くことを拒ま\nれたと受け取りやすいです。"}, {"t": 307.1166666666667, "x": "一度そう受け取ると、自分からは\n近づかなくなることがあります。"}, {"t": 311.5, "x": "一方で女は、距離を取りたい日と近\nくにいてほしい日が混ざりやすいです。"}, {"t": 316.48333333333335, "x": "その日によって違うので、本人も先に言\nえないことがあります。"}, {"t": 320.6666666666667, "x": "ここで男が引いたままになると、\n近くにいてほしい日にも誰もいません。"}, {"t": 325.53333333333336, "x": "女が理由を言えないままだと、\n男はずっと拒まれた記憶を抱えます。"}, {"t": 330.48333333333335, "x": "どちらかが冷たいという単純な話ではありません。"}, {"t": 333.81666666666666, "x": "今日はどっちの日かを、軽く確か\nめる言葉が足りないだけです。"}, {"t": 337.8833333333333, "x": "近くにいていい日か、一人がいい日か。"}, {"t": 340.6166666666667, "x": "それを聞くのは、失礼なことではありません。"}, {"t": 343.6666666666667, "x": "余裕のない日には、言葉が少\nし強くなることがあります。"}, {"t": 347.55, "x": "いつもなら流せる一言に引っかかる。"}, {"t": 349.9, "x": "言い方がきつくなる。"}, {"t": 351.25, "x": "言った後で自分でも驚く。"}, {"t": 353.26666666666665, "x": "こういう経験をする人は、この\n年代で珍しくないようです。"}, {"t": 357.45, "x": "男は、きつい言葉をそのまま\n内容として受け取りやすいです。"}, {"t": 361.5833333333333, "x": "そんな言い方しなくても、と\n言い返して空気が固まります。"}, {"t": 365.5, "x": "一方で女は、言った直後に自分を責\nめやすい場合があります。"}, {"t": 370.0, "x": "責めているのに謝るきっかけが\nつかめず、黙ってしまいます。"}, {"t": 374.1333333333333, "x": "黙った後の沈黙を、男は怒りが\n続いていると読みます。"}, {"t": 378.3333333333333, "x": "女は沈黙を、許してもらえていない印と読みます。"}, {"t": 382.31666666666666, "x": "どちらも相手のことを考えて\nいるのに、沈黙だけが長引きます。"}, {"t": 386.85, "x": "とげは相手を傷つけたくて出\nたものではないことが多いです。"}, {"t": 390.53333333333336, "x": "その日の余裕が底をついた時に、\n表に出てしまっただけです。"}, {"t": 394.8, "x": "だから、言葉の中身より、言\nわれた日の様子を見る方が役に立ちます。"}, {"t": 399.78333333333336, "x": "今日は余裕がない日だったのかも\nしれない、と一度だけ置いてみる。"}, {"t": 404.0, "x": "それだけで、言い返す前に一呼吸入\nることがあります。"}, {"t": 407.98333333333335, "x": "体の波がある時期は、家の中の分担も少\nしずつずれていきます。"}, {"t": 412.78333333333336, "x": "前はやれていた家事が重く感じる。"}, {"t": 415.15, "x": "外出の予定を減らしたくなる。"}, {"t": 417.21666666666664, "x": "人を招くのがおっくうになる。"}, {"t": 419.15, "x": "男は、分担を決まりごととして守ろうとしやすいです。"}, {"t": 423.05, "x": "前からこうだったのだから、と\n今のやり方を続けようとします。"}, {"t": 427.2, "x": "一方で女は、決まりより今日の自分に合\nわせたいと感じやすいです。"}, {"t": 431.95, "x": "今日はできるが、明日はできないかもしれない。"}, {"t": 434.95, "x": "その揺れを、決まった分担表では\n受け止めきれません。"}, {"t": 438.53333333333336, "x": "逆に、男の方が動けなくなることもあります。"}, {"t": 441.95, "x": "休みの日に起きられない。"}, {"t": 443.6, "x": "頼まれた用事を後回しにする。"}, {"t": 445.9166666666667, "x": "その時、女はさぼっているように\n見えて苛立つことがあります。"}, {"t": 450.06666666666666, "x": "けれども、どちらの場合も怠けているとは限りません。"}, {"t": 453.6333333333333, "x": "分担を守れないのは、やる気では\nなく体力の問題の場合があります。"}, {"t": 458.4, "x": "そういう時期は、分担を週ごとでは\nなく日ごとに見直す方が楽です。"}, {"t": 463.21666666666664, "x": "今日はどっちが何をやれるか、\n朝に一言だけ確かめる。"}, {"t": 467.1333333333333, "x": "家事の量より、その一言があ\nる方が関係は軽く済みます。"}, {"t": 471.45, "x": "相手がつらそうな時、どう声をか\nけるかで迷う人は多いです。"}, {"t": 475.81666666666666, "x": "男は、声をかけるなら何かを\n提案しなければと考えやすいです。"}, {"t": 480.51666666666665, "x": "休んだ方がいい。"}, {"t": 481.8333333333333, "x": "早く寝たら。"}, {"t": 482.8, "x": "一度相談してみたら。"}, {"t": 484.43333333333334, "x": "どれも心配から出た言葉です。"}, {"t": 486.55, "x": "けれども受け取る側には、指示のよ\nうに聞こえることがあります。"}, {"t": 490.56666666666666, "x": "一方で女は、提案より先に今の状態を分か\nってほしいと感じやすいです。"}, {"t": 496.23333333333335, "x": "しんどそうだね。"}, {"t": 497.3833333333333, "x": "今日は大変だったね。"}, {"t": 498.95, "x": "無理しなくていいよ。"}, {"t": 500.3, "x": "こういう受け止めの言葉が先にあると、\n提案も入りやすくなります。"}, {"t": 505.06666666666666, "x": "逆の場面も同じです。"}, {"t": 506.76666666666665, "x": "男が弱っている時、女が気 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
