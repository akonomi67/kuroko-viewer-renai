<style>

<script>
const D={"name": "男が惚れ直す瞬間と女が惚れ直す瞬間は逆", "file": "075_男が惚れ直す瞬間と女が惚れ直す瞬間は逆", "dur": 1131.06665625, "segs": [], "subs": [{"t": 0.0, "x": "付き合ってから惚れ直す瞬間は、\n男と女で逆になりやすいです。"}, {"t": 4.666666666666667, "x": "男は相手の初めて見る顔に出会\nった時に惚れ直しやすいです。"}, {"t": 8.916666666666666, "x": "女は逆です。"}, {"t": 10.15, "x": "相手の変わらない姿に気づい\nた時に惚れ直しやすいと言われます。"}, {"t": 14.416666666666666, "x": "男は意外な一面を見つけた日に好きが深まります。"}, {"t": 17.966666666666665, "x": "女は同じ優しさが続いていると\n分かった日に好きが深まります。"}, {"t": 22.25, "x": "男は新しさで、女は続いてい\nることで好きを育てている形です。"}, {"t": 27.1, "x": "この違いを知らないと、頑張\nる向きがずれてしまいます。"}, {"t": 30.766666666666666, "x": "男は驚かせようとして、変わ\nらない安心を置き忘れがちです。"}, {"t": 35.21666666666667, "x": "女はいつも通りでいようとして、\n新しい顔を見せそびれがちです。"}, {"t": 39.68333333333333, "x": "どちらも相手を思っての動きです。"}, {"t": 41.95, "x": "それなのに、惚れ直すきっかけを外してしまうのです。"}, {"t": 45.38333333333333, "x": "付き合う前の好きは、出会った時の勢いで育ちます。"}, {"t": 49.11666666666667, "x": "付き合ってからの好きは、毎日の小\nさな場面で育ちます。"}, {"t": 53.083333333333336, "x": "今日は、好きが深まる場面を男女に分けて並べます。"}, {"t": 56.78333333333333, "x": "見終わる頃には、相手のどこを\n見ればいいかが分かるはずです。"}, {"t": 60.75, "x": "付き合う前は、相手のことをまだよく知りません。"}, {"t": 63.983333333333334, "x": "知らない部分を想像で埋めて、\n好きが大きくなっていきます。"}, {"t": 68.11666666666666, "x": "付き合った後は、知っている部分が増えていきます。"}, {"t": 71.48333333333333, "x": "寝起きの顔。"}, {"t": 72.48333333333333, "x": "疲れた日の口調。"}, {"t": 73.8, "x": "部屋の散らかり方。"}, {"t": 75.2, "x": "知るほど想像の余白は減っていきます。"}, {"t": 77.83333333333333, "x": "けれども、そこで好きが終わるわけではありません。"}, {"t": 81.01666666666667, "x": "知った上でもう一度好きになる。"}, {"t": 83.11666666666666, "x": "それが惚れ直すという気持ちです。"}, {"t": 85.23333333333333, "x": "男は知らない面が見つかった\n時に気持ちが動きやすいです。"}, {"t": 89.13333333333334, "x": "まだ知らない所があったのかと驚きます。"}, {"t": 91.83333333333333, "x": "その驚きが好きを押し上げます。"}, {"t": 93.98333333333333, "x": "一方で女は、知った上でも変\nわらない所に動きやすいようです。"}, {"t": 98.6, "x": "こんな日もこの人は同じなのだと確かめられます。"}, {"t": 101.76666666666667, "x": "その確かさが好きを押し上げます。"}, {"t": 103.98333333333333, "x": "驚きと確かさは、正反対の気持\nちに見えるかもしれません。"}, {"t": 108.21666666666667, "x": "けれども相手を見直したという点では同じです。"}, {"t": 111.3, "x": "きっかけが新しい所か変わらない所かが\n違うだけです。"}, {"t": 115.13333333333334, "x": "まずは、男が外で見る相手の顔からです。"}, {"t": 118.23333333333333, "x": "男は二人きりの時と違う顔を見ると\n惚れ直しやすいです。"}, {"t": 122.21666666666667, "x": "友人との席で、相手が場を明るくしている時。"}, {"t": 125.76666666666667, "x": "仕事の電話で、きびきびと話す声を聞いた時。"}, {"t": 129.38333333333333, "x": "得意なことを楽しそうに人に教えている時。"}, {"t": 132.51666666666668, "x": "どれも、二人の時には見えなかった顔です。"}, {"t": 135.61666666666667, "x": "男は相手を自分だけが知る人だと思いがちです。"}, {"t": 138.95, "x": "そこへ外での顔が見えると、\n知らなかった奥行きに気づきます。"}, {"t": 143.3, "x": "こんなに人に好かれているのかという発見です。"}, {"t": 146.26666666666668, "x": "発見は少しの誇らしさを連れてきます。"}, {"t": 149.01666666666668, "x": "こんな人が隣にいてくれる。"}, {"t": 150.91666666666666, "x": "その気持ちが好きを強くします。"}, {"t": 153.01666666666668, "x": "一方で女は、外の顔を見られ\nると照れる場合があります。"}, {"t": 157.15, "x": "いつもと違う自分は、見られると恥ずかしいものです。"}, {"t": 160.76666666666668, "x": "けれども男の側は、その違いに\n惹かれていることが多いです。"}, {"t": 164.96666666666667, "x": "友人の集まりに一度誘ってみ\nるのも一つの手かもしれません。"}, {"t": 168.98333333333332, "x": "二人の時には出ない顔が、自然に出てくるからです。"}, {"t": 172.48333333333332, "x": "次は女の側の場面です。"}, {"t": 174.56666666666666, "x": "女は自分の話を覚えていても\nらえた時に惚れ直しやすいです。"}, {"t": 178.91666666666666, "x": "前に好きだと言った飲み物を、\n黙って買ってきてくれた時。"}, {"t": 182.88333333333333, "x": "ひと月前に話した店の名前を、\n相手から出してくれた時。"}, {"t": 187.1, "x": "苦手な食べ物を注文の時に避けてくれた時。"}, {"t": 190.3, "x": "どれも小さなことです。"}, {"t": 191.9, "x": "けれども女には大きな意味を持ちやすいです。"}, {"t": 194.88333333333333, "x": "聞くだけでなく、心に残して\nくれていたと分かるからです。"}, {"t": 198.61666666666667, "x": "付き合いが長くなると、聞き流される場面も増えます。"}, {"t": 202.35, "x": "その中で覚えていてくれたことは、\n変わらない関心の印です。"}, {"t": 206.56666666666666, "x": "一方で男は、そこまで考えていない場合が多いです。"}, {"t": 210.65, "x": "たまたま頭に残っていただけという感覚です。"}, {"t": 213.73333333333332, "x": "だから自分がしたことの大きさに気づきにくいです。"}, {"t": 216.86666666666667, "x": "女が喜んでも、理由が分からないこともあるでしょう。"}, {"t": 220.7, "x": "けれども覚えていたことは、ずっと見ていた印です。"}, {"t": 224.16666666666666, "x": "女にはそう届きます。"}, {"t": 225.85, "x": "新しい贈り物より、前の話の続\nきの方が残ることもあります。"}, {"t": 230.8, "x": "大きな驚きが無くても、きっかけは足元にあるのです。"}, {"t": 234.68333333333334, "x": "男は好きなものに相手が乗っ\nてくれた時に惚れ直しやすいです。"}, {"t": 238.75, "x": "応援しているチームの試合を一緒に見てくれた時。"}, {"t": 242.11666666666667, "x": "好きな映画を最後まで楽しそうに見てくれた時。"}, {"t": 245.35, "x": "趣味の道具の話を面白がって聞いてくれた時。"}, {"t": 248.63333333333333, "x": "男にとって好きなものは自分の一部のようなものです。"}, {"t": 252.16666666666666, "x": "そこを楽しんでもらえると、\n丸ごと受け入れられた気がします。"}, {"t": 256.25, "x": "特に響くのは、前は興味の無かったものの場合です。"}, {"t": 260.06666666666666, "x": "試合のルールを覚えてきてくれた。"}, {"t": 262.26666666666665, "x": "好きな選手の名前を呼んでくれた。"}, {"t": 264.48333333333335, "x": "そういう変化は、男には新しい相手の顔に映ります。"}, {"t": 268.56666666666666, "x": "自分のために世界を広げてくれた。"}, {"t": 270.93333333333334, "x": "その驚きがあるからです。"}, {"t": 272.6666666666667, "x": "大事なのは詳しくなることではありません。"}, {"t": 275.3833333333333, "x": "一緒の時間を楽しもうとする姿の方が強く届きます。"}, {"t": 279.21666666666664, "x": "無理に好きになる必要はありません。"}, {"t": 281.53333333333336, "x": "楽しんでいる顔が見えれば十分です。"}, {"t": 284.1333333333333, "x": "反対に女は、好きなものを覚\nえていてもらう方に動きやすいです。"}, {"t": 288.78333333333336, "x": "男は一緒に楽しむ新しさを見ています。"}, {"t": 291.71666666666664, "x": "女は覚えている続きを見ています。"}, {"t": 294.18333333333334, "x": "女は相手が他の人に優しくす\nる姿に惚れ直しやすいです。"}, {"t": 298.48333333333335, "x": "お店で、店員さんにありがとうと言っている時。"}, {"t": 301.98333333333335, "x": "混んだ電車で、お年寄りに黙って席を譲っている時。"}, {"t": 305.8666666666667, "x": "道を聞かれて、足を止めて丁寧に教えている時。"}, {"t": 309.65, "x": "女はこういう場面で相手の素の人柄を見\nていることが多いです。"}, {"t": 313.8333333333333, "x": "自分に優しいのは、好きだからかもしれません。"}, {"t": 317.03333333333336, "x": "けれども他人への優しさは違います。"}, {"t": 319.6, "x": "好きとは関係なく、続いている性格です。"}, {"t": 322.8666666666667, "x": "だから誰にでも変わらない態度に安心を覚\nえやすいのです。"}, {"t": 326.6333333333333, "x": "この人はずっとこういう人なのだと思えます。"}, {"t": 329.51666666666665, "x": "その確かさが好きを深めます。"}, {"t": 331.6166666666667, "x": "一方で男は、見られているとは\n思っていないことが多いです。"}, {"t": 335.8, "x": "いつも通りに振る舞っただけという感覚です。"}, {"t": 338.6666666666667, "x": "けれども、いつも通りだから\nこそ女の心に届いています。"}, {"t": 342.6666666666667, "x": "見せるために作った優しさは、\n案外すぐに見抜かれます。"}, {"t": 346.6, "x": "反対もあります。"}, {"t": 347.8833333333333, "x": "店員さんへの強い口調で、気持\nちが引くこともあるようです。"}, {"t": 352.05, "x": "惚れ直すきっかけと冷めるき\nっかけは、すぐ隣にあるのです。"}, {"t": 355.93333333333334, "x": "体調を崩した時は、惚れ直す場面が生\nまれやすい時間です。"}, {"t": 360.28333333333336, "x": "ただ、同じ看病でも心に残る所が男女で違\nうことがあります。"}, {"t": 365.01666666666665, "x": "男は弱った時に世話をされた\n記憶に惚れ直しやすいです。"}, {"t": 368.96666666666664, "x": "おかゆを作ってくれた。"}, {"t": 370.46666666666664, "x": "薬を買ってきてくれた。"}, {"t": 372.05, "x": "夜中に様子を見に来てくれた。"}, {"t": 374.1, "x": "普段強がっている人ほど、その温かさが残ります。"}, {"t": 377.85, "x": "こんなに大事にしてくれる人だったのか。"}, {"t": 380.3833333333333, "x": "そう発見するからです。"}, {"t": 381.96666666666664, "x": "一方で女は、無理を止めても\nらえた記憶に惚れ直しやすいです。"}, {"t": 386.5, "x": "熱があるのに出かけようとし\nたら、休もうと言ってくれた。"}, {"t": 390.23333333333335, "x": "家のことは気にしなくていいと引き受けてくれた。"}, {"t": 393.1333333333333, "x": "女は体が辛くても用事を続けよ\nうとすることがあります。"}, {"t": 397.1333333333333, "x": "その時に代わってくれた人を、深く信じやすいです。"}, {"t": 400.85, "x": "男は世話をしてもらうことで、\n相手の新しい顔を見ています。"}, {"t": 405.1333333333333, "x": "女は止めてもらうことで、変\nわらない気遣いを確かめています。"}, {"t": 409.43333333333334, "x": "同じ夜でも、覚えている場面が違\nうのはそのためです。"}, {"t": 413.25, "x": "看病する側はどうすればいいか。"}, {"t": 415.5833333333333, "x": "世話と声かけを、両方しておくと外しにくいです。"}, {"t": 419.15, "x": "男は相手のいつもと違う装いに惚れ直しやすいです。"}, {"t": 422.96666666666664, "x": "髪を短く切ってきた日。"}, {"t": 424.75, "x": "普段は着ない色の服で来た日。"}, {"t": 426.85, "x": "旅先で浴衣を着て出てきた時。"}, {"t": 429.1333333333333, "x": "男は目で見た変化に気持ちが\n動きやすいと言われます。"}, {"t": 432.76666666666665, "x": "付き合いが長くなると、相手の姿は見慣\nれたものになります。"}, {"t": 436.95, "x": "そこに変化が入ると、出会っ\nた頃の気持ちがよみがえります。"}, {"t": 441.2, "x": "同じ人なのに、もう一度出会\nい直したような感覚です。"}, {"t": 445.1166666666667, "x": "大きく変わる必要はありません。"}, {"t": 447.3, "x": "少し違うだけで、男の目には新しい顔に映ります。"}, {"t": 451.25, "x": "一方で女は、変化に気づかれ\nないと寂しく感じやすいです。"}, {"t": 455.68333333333334, "x": "せっかく変えたのに何も言われない。"}, {"t": 457.9, "x": "見ていないのかと思うこともあるでしょう。"}, {"t": 460.3333333333333, "x": "けれども男は、気づいていても言葉が遅れがちです。"}, {"t": 463.95, "x": "見とれていて、言葉が出てこない場合もあるようです。"}, {"t": 467.3666666666667, "x": "言葉が無くても、目が合う回数が増\nえていれば届いています。"}, {"t": 471.51666666666665, "x": "男の側は、気づいた時に短く一言添\nえるだけで伝わります。"}, {"t": 476.1166666666667, "x": "女は喧嘩の後に歩み寄られた\n時に惚れ直しやすいです。"}, {"t": 480.1, "x": "言い合いの後で、先にごめんと言いに来てくれた時。"}, {"t": 483.73333333333335, "x": "気まずい中で、温かい飲み物を差し出してくれた時。"}, {"t": 487.46666666666664, "x": "次の日に、昨日の話をちゃんと\n聞かせてと言われた時。"}, {"t": 491.3833333333333, "x": "喧嘩の後は、壊れるのではと\nいう不安が残りやすいです。"}, {"t": 495.4166666666667, "x": "そこで相手が戻ってきてくれる。"}, {"t": 497.4166666666667, "x": "するとこの人は離れないと確かめられます。"}, {"t": 500.18333333333334, "x": "揉めても変わらずそばにいる人だと分かるのです。"}, {"t": 503.1, "x": "女にとって、その確かさは何よ\nりの安心になりやすいです。"}, {"t": 507.3833333333333, "x": "一方で男は、謝ることを負けのよ\nうに感じる場合があります。"}, {"t": 511.96666666666664, "x": "時間が経てば戻ると考えて、\n黙って待つこともあるでしょう。"}, {"t": 516.1333333333333, "x": "けれども黙って待つ時間は、\n女には不安が育つ時間です。"}, {"t": 520.5, "x": "どちらが正しかったかは、後から話せば済むことです。"}, {"t": 524.0166666666667, "x": "先に戻るという行動そのものが、\n女には大きな意味を持ちます。"}, {"t": 528.5333333333333, "x": "喧嘩の終わり方で好きが深まることもあります。"}, {"t": 531.65, "x": "逆に削れてしまうこともあります。"}, {"t": 533.8666666666667, "x": "謝る言葉が出にくい時もあるでしょう。"}, {"t": 536.45, "x": "そんな時は隣に座るだけでも伝わるかもしれません。"}, {"t": 539.9333333333333, "x": "惚れ直す瞬間は、気づかないうちに\n起きていることもあります。"}, {"t": 544.0333333333333, "x": "男の場合、惚れ直した気持ちは\n言葉になりにくいです。"}, {"t": 547.8166666666667, "x": "やっぱりこの人だなと心の中で思\nって終わりやすいです。"}, {"t": 551.45, "x": "その代わり、行動に出てくることがあります。"}, {"t": 554.4666666666667, "x": "連絡が早くなる。"}, {"t": 555.8666666666667, "x": "次の予定を自分から決める。"}, {"t": 557.9166666666666, "x": "帰りを少し遅らせる。"}, {"t": 559.6333333333333, "x": "本人は理由を言えなくても、\n気持ちは確かに動いています。"}, {"t": 563.7833333333333, "x": "一方で女は、惚れ直した場面を何度も思\nい出しやすいです。"}, {"t": 568.15, "x": "友人に話す。"}, {"t": 569.3666666666667, "x": "手帳に書く。"}, {"t": 570.4166666666666, "x": "ふと思い出して一人で笑う。"}, {"t": 572.2666666666667, "x": "思い出すたびに、その時の気持\nちがもう一度温まります。"}, {"t": 576.2833333333333, "x": "思い出す回数が多いほど、好きが深まる形です。"}, {"t": 580.1166666666667, "x": "男は行動で、女は思い出で惚\nれ直しを抱えているとも言えます。"}, {"t": 584.8666666666667, "x": "だから相手が惚れ直しているかは、\n言葉だけでは分かりません。"}, {"t": 588.8333333333334, "x": "急に優しくなった。"}, {"t": 590.3, "x": "前の話を楽しそうにする。"}, {"t": 592.4, "x": "そういう小さな変化が、惚れ直\nした後のサインかもしれません。"}, {"t": 596.5166666666667, "x": "男は大事な人たちに相手が const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
