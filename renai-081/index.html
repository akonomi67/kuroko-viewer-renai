<script>
const D={"name": "紹介の意味が違う_恋人を友達に紹介する時の男女の違い", "file": "081_紹介の意味が違う_恋人を友達に紹介する時の男女の違い", "dur": 814.31665625, "segs": [], "subs": [{"t": 0.0, "x": "付き合っている恋人を、自分の友達に紹介する\n日があります。"}, {"t": 4.5, "x": "今日は、その紹介の場面で男女が考えていることの\n違いを見ていきます。"}, {"t": 9.516666666666667, "x": "同じ紹介でも、男と女では意味が\nずいぶん違うことがあります。"}, {"t": 14.083333333333334, "x": "男にとって紹介は、\n自分の中の区切りになりやすいです。"}, {"t": 18.233333333333334, "x": "女にとって紹介は、関係を確かめる\n場になりやすいです。"}, {"t": 22.483333333333334, "x": "男は決めたから紹介すると考えやすいです。"}, {"t": 25.666666666666668, "x": "女は紹介して確かめたいと考えやすいです。"}, {"t": 28.95, "x": "男は紹介した日を、節目として\n覚えていることがあります。"}, {"t": 33.11666666666667, "x": "女は紹介された日の細かい言葉まで\n覚えていることがあります。"}, {"t": 37.4, "x": "この違いを知らないと、同じ席で別々の心配を\nすることになります。"}, {"t": 42.28333333333333, "x": "男はなぜそんなに紹介を急ぐのかと戸惑います。"}, {"t": 45.7, "x": "女はなぜ紹介してくれないのかと不安になります。"}, {"t": 49.05, "x": "紹介した当日の帰り道にも、\n小さなすれ違いが起きます。"}, {"t": 53.55, "x": "楽しい席だったはずです。"}, {"t": 55.36666666666667, "x": "それなのに、帰りの電車で口数が減ってしまいます。"}, {"t": 59.166666666666664, "x": "どちらかの気持ちが冷めたわけではありません。"}, {"t": 61.9, "x": "紹介の受け取り方が違うだけなのかもしれません。"}, {"t": 65.21666666666667, "x": "紹介する前から帰り道まで、\n場面ごとに並べていきます。"}, {"t": 69.66666666666667, "x": "恋人を友達に紹介する理由は、\n大きく二つに分かれます。"}, {"t": 74.2, "x": "一つは、もう決めたと自分の中で区切るための\n紹介です。"}, {"t": 78.15, "x": "もう一つは、これでいいのかを\n確かめるための紹介です。"}, {"t": 81.96666666666667, "x": "男は前の紹介をしやすいと言われます。"}, {"t": 84.86666666666666, "x": "この人と続けていくと決めます。"}, {"t": 86.95, "x": "それから友達の前に連れていきます。"}, {"t": 89.5, "x": "紹介は、自分の決心を周りに見せる手段に近いです。"}, {"t": 93.66666666666667, "x": "一方で女は後の紹介をしやすいようです。"}, {"t": 96.9, "x": "仲のいい友達に会ってもらいます。"}, {"t": 99.21666666666667, "x": "その反応を見て、自分の気持ちを確かめます。"}, {"t": 102.68333333333334, "x": "選んだ人を、信頼する人の目でも見てほしいのです。"}, {"t": 106.38333333333334, "x": "どちらも恋人を大事に思うからこその行動です。"}, {"t": 109.73333333333333, "x": "男は区切ってから見せます。"}, {"t": 111.61666666666666, "x": "女は見せながら確かめます。"}, {"t": 113.68333333333334, "x": "同じ紹介でも、通る順番が反対になっています。"}, {"t": 117.43333333333334, "x": "男は答えを出してから会わせます。"}, {"t": 119.76666666666667, "x": "女は会わせてから答えを出します。"}, {"t": 122.08333333333333, "x": "男にとっては結論の発表に近いです。"}, {"t": 124.93333333333334, "x": "女にとっては相談に近いのかもしれません。"}, {"t": 127.9, "x": "この順番の違いが、紹介する\n時期のずれにつながります。"}, {"t": 131.86666666666667, "x": "付き合ってから紹介するまでの\n時期にも差が出やすいです。"}, {"t": 135.4, "x": "男は紹介を少し先に延ばすことがあります。"}, {"t": 138.58333333333334, "x": "三か月、半年と、区切りがつくまで\n待つ場合があります。"}, {"t": 142.96666666666667, "x": "もし別れたら気まずいと考えるからです。"}, {"t": 145.66666666666666, "x": "仲間に冷やかされるのが照れくさい事情もあります。"}, {"t": 148.91666666666666, "x": "本気だからこそ慎重になっているとも言えます。"}, {"t": 151.88333333333333, "x": "紹介した以上は、軽い気持ちだったとは\n言えなくなります。"}, {"t": 155.86666666666667, "x": "その重さを、男は前もって感じているのです。"}, {"t": 159.18333333333334, "x": "一方で女は早めに紹介したいと\n感じることがあります。"}, {"t": 163.18333333333334, "x": "付き合って一か月ほどでも、\n親しい友達には会わせたくなります。"}, {"t": 167.63333333333333, "x": "早く会わせて友達の反応を見たいのです。"}, {"t": 170.53333333333333, "x": "友達と恋人が仲良くなると、\n関係が安定して感じられます。"}, {"t": 175.3, "x": "女が早く紹介したがるのは、\n急かしたいからではありません。"}, {"t": 179.5, "x": "二人の関係を、\n自分の生活の中に置いてみたいのです。"}, {"t": 183.65, "x": "友達に話せる恋は、それだけで心強く感じられます。"}, {"t": 187.75, "x": "男が紹介を延ばすのも、隠したいからではないことが\n多いです。"}, {"t": 192.03333333333333, "x": "大事な一歩なので、軽く扱いたくないのです。"}, {"t": 195.43333333333334, "x": "時期のずれは、紹介の重さの感じ方から来ています。"}, {"t": 199.18333333333334, "x": "紹介の前の晩にも、考えることが変わります。"}, {"t": 202.7, "x": "男は段取りを気にしやすいです。"}, {"t": 204.98333333333332, "x": "どの店にするか。"}, {"t": 206.23333333333332, "x": "いつ集まるか。"}, {"t": 207.38333333333333, "x": "誰が来るのか。"}, {"t": 208.51666666666668, "x": "店までの道順を確かめておくこともあります。"}, {"t": 211.61666666666667, "x": "当日がうまく流れれば十分だと考えやすいです。"}, {"t": 215.15, "x": "会話の中身は、その場でなんとかなると\n思っています。"}, {"t": 218.8, "x": "一方で女は伝え方を気にしやすいです。"}, {"t": 221.81666666666666, "x": "恋人のことを、友達にどう伝えておくか。"}, {"t": 225.05, "x": "友達のことを、恋人にどう説明しておくか。"}, {"t": 228.5, "x": "話題になりそうなことを、前もって\n伝えておく場合があります。"}, {"t": 232.7, "x": "着ていく服や話し方まで気にかけることもあります。"}, {"t": 235.96666666666667, "x": "男は場が回るように準備をしています。"}, {"t": 238.73333333333332, "x": "女は二人がつながるように準備をしています。"}, {"t": 241.8, "x": "当日をいい日にしたい気持ちは同じです。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
