<script>
const D={"name": "付き合ってるの中身が男女でここまで違う", "file": "085_付き合ってるの中身が男女でここまで違う", "dur": 842.66665625, "segs": [], "subs": [{"t": 0.0, "x": "付き合い始めた二人は、同じ言葉で別のものを\n思い浮かべることがあります。"}, {"t": 5.166666666666667, "x": "今日は、付き合っている状態の中身が男女で\nどう違うかを見ていきます。"}, {"t": 9.95, "x": "告白をして付き合うことが決まった。"}, {"t": 12.316666666666666, "x": "その日から、二人の中には見\nえない約束が生まれます。"}, {"t": 16.166666666666668, "x": "けれども約束の中身は男女でか\nなり違うことが多いです。"}, {"t": 20.05, "x": "男にとって付き合うことは、\n決まったという安心に近いです。"}, {"t": 24.133333333333333, "x": "女にとって付き合うことは、\n続いていく確認の始まりに近いです。"}, {"t": 28.766666666666666, "x": "男は答えが出たので、ほっと\nして肩の力を抜きやすいです。"}, {"t": 33.0, "x": "女は始まったので、ここからの\n毎日を大事に見ていきます。"}, {"t": 37.28333333333333, "x": "休みの日の過ごし方。"}, {"t": 38.916666666666664, "x": "毎日の連絡。"}, {"t": 40.233333333333334, "x": "予定が重なった日の選び方。"}, {"t": 42.416666666666664, "x": "どれも付き合っていれば当然\nだと思われている部分です。"}, {"t": 45.916666666666664, "x": "ただその当然の中身が、二人で違うことがあります。"}, {"t": 49.65, "x": "知らないと、相手が約束を破ったように見えます。"}, {"t": 53.21666666666667, "x": "破った側は、約束をした覚えが\nないのに責められたと感じます。"}, {"t": 57.7, "x": "好き同士なのに、少しずつ疲れていく二人もいます。"}, {"t": 61.38333333333333, "x": "付き合っているという一言の中身を場面\nごとに開いていきます。"}, {"t": 65.38333333333334, "x": "付き合おうという言葉は、とても短い言葉です。"}, {"t": 68.7, "x": "短いからこそ、中身は人によって変わります。"}, {"t": 72.13333333333334, "x": "男はこの一言を、問いへの答\nえとして受け取りやすいです。"}, {"t": 76.2, "x": "好きかどうか。"}, {"t": 77.2, "x": "選ばれるかどうか。"}, {"t": 78.5, "x": "この人でいいのか。"}, {"t": 79.8, "x": "その問いに答えが出ました。"}, {"t": 81.61666666666666, "x": "一つの区切りがついた感覚です。"}, {"t": 83.81666666666666, "x": "一方で女はこの一言を、始まりの\n合図として受け取りやすいです。"}, {"t": 88.56666666666666, "x": "ここから二人で何を重ねるのか。"}, {"t": 90.88333333333334, "x": "どう大事にされるのか。"}, {"t": 92.48333333333333, "x": "答えが出たというより、新し\nい問いが増えた感覚に近いです。"}, {"t": 96.78333333333333, "x": "たとえるなら、男は部屋の鍵を受け取った人です。"}, {"t": 100.3, "x": "鍵が手に入ったので、もう帰る場所は決まりました。"}, {"t": 103.86666666666666, "x": "女はその部屋で暮らし始めた人です。"}, {"t": 106.48333333333333, "x": "暮らしは毎日の掃除や換気で心地よさが保たれます。"}, {"t": 110.3, "x": "ただ、この差は付き合ってすぐには表に出ません。"}, {"t": 113.68333333333334, "x": "最初の数週間は二人とも気持\nちが高まっているからです。"}, {"t": 117.58333333333333, "x": "表に出るのは、毎日の当たり前が始まってからです。"}, {"t": 121.4, "x": "まずは休みの日の過ごし方から見ていきます。"}, {"t": 124.28333333333333, "x": "付き合うと、休みの日の使い方が変\nわることがあります。"}, {"t": 128.26666666666668, "x": "女は休みの日を、基本は二人で過\nごす日と考えやすいです。"}, {"t": 132.66666666666666, "x": "土曜の午後。"}, {"t": 133.68333333333334, "x": "日曜の朝。"}, {"t": 134.8, "x": "連休の真ん中。"}, {"t": 136.16666666666666, "x": "会う予定が無い週末が続くと、\n少し落ち着かなくなります。"}, {"t": 140.46666666666667, "x": "会っている時間が付き合って\nいる手ざわりになるからです。"}, {"t": 143.78333333333333, "x": "一方で男は、会いたい時に会\nえればいいと考えやすいようです。"}, {"t": 148.28333333333333, "x": "趣味の時間。"}, {"t": 149.28333333333333, "x": "一人で寝ていたい朝。"}, {"t": 150.81666666666666, "x": "友達との約束。"}, {"t": 152.31666666666666, "x": "休みの全部が二人の物になるとは思っていません。"}, {"t": 155.71666666666667, "x": "会わない週末があっても関係は変わらないのです。"}, {"t": 159.03333333333333, "x": "もう決まっています。"}, {"t": 160.31666666666666, "x": "毎週会って確かめる必要は感じにくいです。"}, {"t": 163.41666666666666, "x": "女から見ると、会わない週末は少\nしずつ間が空く時間です。"}, {"t": 167.83333333333334, "x": "暮らしている部屋に、誰も帰\nらない日のように感じます。"}, {"t": 171.7, "x": "男から見ると、会わない週末はただの\n別々の休日です。"}, {"t": 176.08333333333334, "x": "鍵は持っているので、いつでも帰れると思っています。"}, {"t": 179.78333333333333, "x": "この差は、来週の予定を聞く時に出やすいです。"}, {"t": 183.18333333333334, "x": "女は予定を聞いただけで、男は急か\nされたと感じることがあります。"}, {"t": 187.86666666666667, "x": "どちらも相手を大事にしているのに、\n受け取り方がすれ違います。"}, {"t": 192.2, "x": "連絡についても、約束の中身が違うことがあります。"}, {"t": 196.1, "x": "女は付き合ったら、一日に一度は言葉を交\nわすものと考えやすいです。"}, {"t": 201.23333333333332, "x": "今日あったこと。"}, {"t": 202.33333333333334, "x": "帰り道に見たもの。"}, {"t": 203.86666666666667, "x": "寝る前の一言。"}, {"t": 205.2, "x": "中身は小さくても、交わして\nいること自体に意味があります。"}, {"t": 209.31666666666666, "x": "一方で男は、用事がある時に連絡\nするものと考えやすいです。"}, {"t": 214.1, "x": "付き合っても、連絡を増やす\n理由が見えにくいのです。"}, {"t": 217.76666666666668, "x": "関係はもう決まっています。"}, {"t": 219.71666666666667, "x": "毎日つなぐ必要は感じにくいです。"}, {"t": 222.3, "x": "女にとっての連絡は、二人の部屋の明か\nりのようなものです。"}, {"t": 226.48333333333332, "x": "毎晩ついているから、そこに\n暮らしがあると分かります。"}, {"t": 230.0, "x": "男  "多くの二人は、話さないまま\n自分の線が当然だと思っています。"}, {"t": 361.53333333333336, "x": "片方は何も変えていないのに、\n相手には不誠実に見えます。"}, {"t": 365.9166666666667, "x": "もう片方は気をつかっているのに、\n相手には窮屈に見えます。"}, {"t": 370.21666666666664, "x": "線はどちらかが決めるものでは\nなく、二人で引くものです。"}, {"t": 374.0833333333333, "x": "引く前に、自分の線の位置を言葉に\nしておくと話しやすいです。"}, {"t": 378.56666666666666, "x": "付き合って少したつと先の話が出ることがあります。"}, {"t": 381.9166666666667, "x": "来年の夏はどこへ行こう。"}, {"t": 383.85, "x": "年末はどう過ごそう。"}, {"t": 385.43333333333334, "x": "次の誕生日は何をしよう。"}, {"t": 387.53333333333336, "x": "女はこうした話で、関係が続\nくことを確かめやすいです。"}, {"t": 392.01666666666665, "x": "先の予定を一緒に口にできることが、\n安心の手がかりになります。"}, {"t": 396.45, "x": "一方で男は、先の話を今の楽\nしい会話として受け取りやすいです。"}, {"t": 401.56666666666666, "x": "来年の話は、まだ遠い話に聞こえることもあります。"}, {"t": 405.51666666666665, "x": "男にとっては、付き合ってい\nる今が続いていることが大切です。"}, {"t": 409.85, "x": "女にとっては、この先も続くと\n二人で言えることが大切です。"}, {"t": 414.26666666666665, "x": "男が曖昧に返すと、女はこの\n先を考えていないのかと感じます。"}, {"t": 419.31666666666666, "x": "けれども男の中では、今が続\nく前提があまりに当たり前です。"}, {"t": 423.8666666666667, "x": "当たり前すぎて、言葉にする\n必要を感じていないのです。"}, {"t": 427.81666666666666, "x": "先の話が重なると、男は何かを\n決めさせられる気がすることがあります。"}, {"t": 432.96666666666664, "x": "本当は大きな約束を求めているわけではありません。"}, {"t": 436.5833333333333, "x": "来年も一緒にいる前提で話せ\nるかを、そっと見ているだけです。"}, {"t": 440.85, "x": "小さな先の予定を一つ決める\nだけで、伝わるものがあります。"}, {"t": 445.21666666666664, "x": "付き合ってるのに、という言葉が出る時があります。"}, {"t": 448.55, "x": "付き合ってるのに週末に会えない。"}, {"t": 450.75, "x": "付き合ってるのに連絡が少ない。"}, {"t": 452.85, "x": "この言葉の後ろには、言わずに\n交わしたつもりの約束があります。"}, {"t": 457.23333333333335, "x": "女の中では、付き合うという\n一言に約束がいくつも入っています。"}, {"t": 461.98333333333335, "x": "会うこと。"}, {"t": 463.1, "x": "つながること。"}, {"t": 464.1166666666667, "x": "選ぶこと。"}, {"t": 465.0, "x": "先を話すこと。"}, {"t": 466.28333333333336, "x": "一方で男の中では、付き合うと\nいう一言は約束そのものです。"}, {"t": 471.01666666666665, "x": "決まったことが約束で、後ろに\n細かい項目は付いていません。"}, {"t": 475.43333333333334, "x": "だから付き合ってるのにと言\nわれると、男は戸惑いやすいです。"}, {"t": 479.53333333333336, "x": "何の約束を破ったのか、思い当たらないからです。"}, {"t": 483.1, "x": "女から見ると、男は分かって\nい const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);

  else if(k==='s'||k==='S')sp.onclick()});
