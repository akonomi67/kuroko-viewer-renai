<script>
const D={"name": "悪いことを避けたい思いは_その日の満足には出ず_3か月後の相手に出た", "file": "114_悪いことを避けたい思いは_その日の満足には出ず_3か月後の相手に出た", "dur": 814.71665625, "segs": [], "subs": [{"t": 0.0, "x": "休みの前の夜に、2人で次の\n日の予定を話しているとします。"}, {"t": 4.583333333333333, "x": "片ほうは、どこかで思いきり\n楽しみたいと考えています。"}, {"t": 8.516666666666667, "x": "もう片ほうは、とにかく言い合いを\n避けたいと考えています。"}, {"t": 12.416666666666666, "x": "どちらも2人の仲を大事に思っているのは同じです。"}, {"t": 15.9, "x": "でも目指している向きは少し違います。"}, {"t": 18.416666666666668, "x": "良いことに近づきたいのか。"}, {"t": 20.233333333333334, "x": "悪いことを避けたいのか。"}, {"t": 21.916666666666668, "x": "この向きの違いを恋人どうしで調べた研究があります。"}, {"t": 25.65, "x": "カナダのトロント大学の心理学者、\nエミリー・インペットたちの論文です。"}, {"t": 30.566666666666666, "x": "2010年に、アメリカ心理学会の専門誌に載りました。"}, {"t": 34.8, "x": "調べたのは毎日の満足と、数か月\nたってからの関係です。"}, {"t": 39.4, "x": "結果には少し意外なところがありました。"}, {"t": 42.15, "x": "悪いことを避けたい思いは、その日の\n満足とは結びついていませんでした。"}, {"t": 47.06666666666667, "x": "違いが出てきたのは時間がたってからです。"}, {"t": 49.733333333333334, "x": "しかも本人より\n相手のほうに、はっきり表れていました。"}, {"t": 53.68333333333333, "x": "ただし避けたい思いが悪いと\n決めつける話ではありません。"}, {"t": 57.38333333333333, "x": "近づく目標を持てば必ず続くという話でもありません。"}, {"t": 61.28333333333333, "x": "まずはこの研究の土台にある考え方です。"}, {"t": 64.36666666666666, "x": "人を動かす仕組みには、2つの\n向きがあるとされてきました。"}, {"t": 68.36666666666666, "x": "良いものに向かう向きと、悪いものから\n離れる向きです。"}, {"t": 72.1, "x": "論文はこれを恋人との関係の目標に当てはめました。"}, {"t": 75.96666666666667, "x": "一つめは近づく目標です。"}, {"t": 78.03333333333333, "x": "楽しいことや成長、2人で深まっていくこと。"}, {"t": 81.56666666666666, "x": "そうした良い経験を求める目標です。"}, {"t": 84.26666666666667, "x": "2つめは避ける目標です。"}, {"t": 86.2, "x": "言い合いやもめごと、裏切りや拒まれること。"}, {"t": 89.38333333333334, "x": "そうした悪い経験を遠ざけようとする目標です。"}, {"t": 92.78333333333333, "x": "論文には、子育てをめぐる夫婦の\n話し合いのたとえがあります。"}, {"t": 97.1, "x": "近づく目標が強い夫は、話し合いが\nうまく進むことを望みます。"}, {"t": 101.93333333333334, "x": "避ける目標が強い夫は、もめないことに\n気を配ります。"}, {"t": 106.0, "x": "似ているようで見ているところが違うのです。"}, {"t": 108.56666666666666, "x": "もう一つ大事な点があります。"}, {"t": 110.68333333333334, "x": "近づく目標が弱いことは、避ける目標が\n強いことと同じではありません。"}, {"t": 115.86666666666666, "x": "近づく目標が弱い人は、\n楽しいことをとくに求めていないだけです。"}, {"t": 120.7, "x": "避ける目標が強い人は、悪いことが\n起きないかに気を向けています。"}, {"t": 125.36666666666666, "x": "2つは1本の物差しの両はしではないのです。"}, {"t": 128.46666666666667, "x": "ではこの目標をどうやって測ったのでしょうか。"}, {"t": 131.41666666666666, "x": "使ったのは8つの問いからなる物差しです。"}, {"t": 134.26666666666668, "x": "身近な人向けの物差しを、恋人向けに\n直したものです。"}, {"t": 138.26666666666668, "x": "近づく目標の問いはたとえばこうです。"}, {"t": 140.85, "x": "恋人との関係を深めようとするつもりだ。"}, {"t": 143.86666666666667, "x": "関係の成長に向かって進もうとするつもりだ。"}, {"t": 147.06666666666666, "x": "避ける目標の問いはたとえばこうです。"}, {"t": 149.58333333333334, "x": "恋人との言い合いやもめごとを避けるつもりだ。"}, {"t": 152.55, "x": "関係に悪いことが起きないようにするつもりだ。"}, {"t": 155.6, "x": "これからの学期に、どのくらい\n当てはまるかを答えます。"}, {"t": 159.21666666666667, "x": "気をつけたい点があります。"}, {"t": 161.01666666666668, "x": "目標を答えたのは、最初の一度だけです。"}, {"t": 164.2, "x": "その日ごとの目標を聞いたわけではありません。"}, {"t": 167.15, "x": "ふだん2人の関係でどちらの向きを強く持っているか。"}, {"t": 170.68333333333334, "x": "その人の傾向として測ったものです。"}, {"t": 173.23333333333332, "x": "ただ2つは、別々に動くわけでもありません。"}, {"t": 176.6, "x": "どちらの調査でも、両方の点数は\nそろって高くなりがちでした。"}, {"t": 180.96666666666667, "x": "関係を大事に思う気持ちが、\n両方に出ているのかもしれません。"}, {"t": 185.4, "x": "論文はそう考えています。"}, {"t": 187.36666666666667, "x": "それでも2つは、満足と違う結びつき方をしました。"}, {"t": 191.28333333333333, "x": "最初の調査の舞台は、カリフォルニア大学\nロサンゼルス校です。"}, {"t": 195.66666666666666, "x": "参加したのは恋人のいる大学生153人。"}, {"t": 199.36666666666667, "x": "男性が69人で女性が84人でした。"}, {"t": 203.03333333333333, "x": "条件は恋人と週に5日以上会っていることです。"}, {"t": 206.48333333333332, "x": "遠くはなれて暮らすカップルは含まれていません。"}, {"t": 209.48333333333332, "x": "カップルのうち一人だけが参加する形です。"}, {"t": 212.36666666666667, "x": "付き合っている長さは、1か月から8年までです。"}, {"t": 215.95, "x": "はじめに研究室で、目標の問いと\n関係の満足に答えます。"}, {"t": 220.61666666666667, "x": "そのあと14日分の記録用紙を受け取りました。"}, {"t": 223.9, "x": "毎晩寝る前に1枚書きます。"}, {"t": 226.11666666666667, "x": "答えは恋人と話し合わないように言われていました。"}, {"t": 229.6, "x": "書いた用紙は、2、3日ごとに\n研究室の外の鍵つきポストへ届けます。"}, {"t": 234.86666666666667, "x": "期限どおりに届けると、賞金の\n当たるくじが1枚もらえました。"}, {"t": 239.36666666666667, "x": "こうして集まった記録 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
