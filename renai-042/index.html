<script>
const D={"name": "別れた後が正反対_男は上書き女は保存", "file": "042_別れた後が正反対_男は上書き女は保存", "dur": 804.26665625, "segs": [], "subs": [{"t": 0.0, "x": "別れた相手を思い出す回数は、\n男女でそれほど変わらないと言われます。"}, {"t": 4.816666666666666, "x": "違うのは、思い出す順番と置き場所の方です。"}, {"t": 8.2, "x": "男は新しい関係が始まると、\n前の記憶を後ろへ押しやすいです。"}, {"t": 13.333333333333334, "x": "女は新しい関係が始まっても、\n前の記憶を別の場所に残しやすいです。"}, {"t": 18.883333333333333, "x": "男は終わった時点で、\n一度まとめて片づけようとします。"}, {"t": 23.05, "x": "女は終わった後も、しばらく整理を\n続けることがあります。"}, {"t": 27.15, "x": "だから同じ別れでも、\nその後の形がまったく違って見えます。"}, {"t": 31.4, "x": "片方は前を向いたように見えて、\nもう片方は止まって見えます。"}, {"t": 35.75, "x": "けれども、\nどちらも同じくらい引きずっている場合があります。"}, {"t": 39.6, "x": "見えている形が違うだけで、\n深さの話ではありません。"}, {"t": 43.7, "x": "この違いを知らないと、\n相手の態度を冷たさとして受け取ります。"}, {"t": 47.983333333333334, "x": "逆に、未練が強いと決めつけてしまうこともあります。"}, {"t": 51.666666666666664, "x": "今日は、終わった関係がどう残るのかを\n男女で並べて見ていきます。"}, {"t": 56.2, "x": "逆に出る人もいるので、\nあくまで傾向として聞いてください。"}, {"t": 60.18333333333333, "x": "自分の残り方が分かると、\n次に進む速さも変えられます。"}, {"t": 64.58333333333333, "x": "まず、忘れたという言葉の中身が違うことがあります。"}, {"t": 68.4, "x": "男の忘れたは、思い出さない状態を\n指すことが多いです。"}, {"t": 72.46666666666667, "x": "女の忘れたは、思い出しても平気な状態を\n指すことがあります。"}, {"t": 76.93333333333334, "x": "前者は、\n記憶を取り出さないようにしている状態です。"}, {"t": 80.63333333333334, "x": "後者は、記憶を取り出しても痛まない状態です。"}, {"t": 84.1, "x": "だから同じ言葉でも、\n指している場所がまったく違います。"}, {"t": 87.93333333333334, "x": "男は上書きが済むと、\n細かい部分から消えていきます。"}, {"t": 91.98333333333333, "x": "店の名前や日付が、先に出てこなくなります。"}, {"t": 95.33333333333333, "x": "女は細かい部分の方が、長く残ることがあります。"}, {"t": 99.18333333333334, "x": "言われた一言や、その日の天気まで\n残っている場合があります。"}, {"t": 103.45, "x": "どちらが深いという話ではなく、\n保存の形が違うだけです。"}, {"t": 107.76666666666667, "x": "写真をまとめて箱に入れる人と、\n一枚ずつ壁に貼る人の差に近いです。"}, {"t": 112.93333333333334, "x": "箱に入れた人は、開けなければ何も見えません。"}, {"t": 116.15, "x": "貼った人は、そこを通るたびに目に入ります。"}, {"t": 119.3, "x": "この差が、別れた後の行動をほとんど決めています。"}, {"t": 122.9, "x": "男の側には、上書きで処理する傾向があります。"}, {"t": 126.68333333333334, "x": "次の相手ができると、\n前の記憶の優先順位が下がります。"}, {"t": 131.08333333333334, "x": "思い出さないので、片づいたように感じられます。"}, {"t": 134.45, "x": "これは薄情さではなく、処理の方法の一つです。"}, {"t": 138.08333333333334, "x": "一つの場所に、一人ぶんだけを置く作りに近いです。"}, {"t": 141.68333333333334, "x": "だから別れた直後に、新しい相手を探す人がいます。"}, {"t": 145.65, "x": "空いたままの状態に、\n耐えにくいところがあるからです。"}, {"t": 149.35, "x": "周りから見ると、切り替えが早く見えてしまいます。"}, {"t": 152.88333333333333, "x": "けれども上書きは、消したこととは違います。"}, {"t": 155.98333333333332, "x": "上に置いただけなので、下はそのまま残っています。"}, {"t": 159.56666666666666, "x": "何かのきっかけで、下の記憶が急に\n出てくることがあります。"}, {"t": 163.73333333333332, "x": "その時に、本人がいちばん驚きます。"}, {"t": 166.66666666666666, "x": "片づけたはずのものが、当時のまま出てくるからです。"}, {"t": 170.05, "x": "だから上書き型の人は、\n何年か経ってから揺れることがあります。"}, {"t": 174.41666666666666, "x": "揺れた時に、自分でも理由をうまく説明できません。"}, {"t": 178.25, "x": "女の側には、保存で処理する傾向があります。"}, {"t": 181.83333333333334, "x": "新しい関係が始まっても、\n前の記憶は別の棚に残ります。"}, {"t": 186.48333333333332, "x": "消すのではなく、触らない場所へ置く形です。"}, {"t": 189.9, "x": "だから新しい相手ができても、前の話ができます。"}, {"t": 193.68333333333334, "x": "できるからといって、未練が強いとは限りません。"}, {"t": 197.11666666666667, "x": "むしろ整理が済んでいるから、\n口に出せる場合があります。"}, {"t": 200.88333333333333, "x": "逆に、整理が済んでいない時期は話題にしません。"}, {"t": 204.55, "x": "触ると痛むので、近づかないようにしています。"}, {"t": 207.91666666666666, "x": "ここを読み違える人は、とても多いです。"}, {"t": 210.83333333333334, "x": "平気そうに話す方が、\n実はもう終わっていることがあります。"}, {"t": 214.93333333333334, "x": "まったく話さない方が、\nまだ動いていることがあります。"}, {"t": 218.53333333333333, "x": "保存型の人は、時間をかけて意味づけを\n変えていきます。"}, {"t": 222.43333333333334, "x": "あの経験があったから今がある、\nという形に直していきます。"}, {"t": 226.71666666666667, "x": "その作業が終わると、記憶は静かに棚へ収まります。"}, {"t": 230.65, "x": "収まるまでの期間は、人によってかなり違います。"}, {"t": 234.21666666666667, "x": "戻りたいと思った時の動き方も、逆に出ます。"}, {"t": 237.68333333333334, "x": "男は上書きが剥がれた時に、\n一気に連絡してきやすいです。"}, {"t": 242.15, "x": "言葉も、\n会いたいという直接的な形になりやすいです。"}, {"t": 246.08333333333334, "x": "女は棚から取り出す前に、\nまず様子を確かめようとします。"}, {"t": 250.4, "x": "だから最初の連絡は、\n用件の形をとることが多いです。"}, {"t": 254.58333333333334, "x": "借りていた物の話や、共通の知人の話から入ります。"}, {"t": 258.95, "x": "つまり男は結論から入り、女は入り口から入ります。"}, {"t": 263.15, "x": "この差を知らないと、相手の連絡の意味を外します。"}, {"t": 266.76 と、今の関係の方が壊れます。"}, {"t": 403.76666666666665, "x": "残っている物の量は、\n今の気持ちの量ではありません。"}, {"t": 407.8666666666667, "x": "やっかいなのが、画面の中に残る記録です。"}, {"t": 411.0, "x": "写真や投稿は、消しても人の記憶からは消えません。"}, {"t": 414.8333333333333, "x": "そして消したという事実自体が、伝わってしまいます。"}, {"t": 418.5, "x": "男は一気に消して、片づいたことにしやすいです。"}, {"t": 422.03333333333336, "x": "女は少しずつ隠して、\n後から見返せる形にしやすいです。"}, {"t": 426.4, "x": "どちらのやり方も、相手には別の意味で伝わります。"}, {"t": 430.06666666666666, "x": "一気に消すと、無かったことにされたように見えます。"}, {"t": 433.6, "x": "残していると、まだ終わっていないように見えます。"}, {"t": 436.96666666666664, "x": "つまり、どう扱っても誤解される作りになっています。"}, {"t": 440.73333333333335, "x": "だからここは、次の相手のために決める方が\n現実的です。"}, {"t": 444.93333333333334, "x": "見える場所に残さない。"}, {"t": 446.51666666666665, "x": "聞かれたら答える。"}, {"t": 447.8, "x": "自分からは出さない。"}, {"t": 449.18333333333334, "x": "この三つだけ決めておけば、たいてい揉めません。"}, {"t": 452.31666666666666, "x": "過去を隠すことと、過去を持ち出さないことは別です。"}, {"t": 455.85, "x": "隠すと、後から出てきた時に嘘として扱われます。"}, {"t": 459.51666666666665, "x": "出さないだけなら、聞かれた時に普通に\n答えられます。"}, {"t": 463.15, "x": "上書き型の人が、急に戻ってくる時期があります。"}, {"t": 466.75, "x": "多くは、次の関係がうまくいかなかった時です。"}, {"t": 470.35, "x": "比べる材料ができて、前の良さが見えてきます。"}, {"t": 473.85, "x": "生活が大きく変わった時にも、同じことが起きます。"}, {"t": 477.65, "x": "引っ越した時。"}, {"t": 478.78333333333336, "x": "仕事が変わった時。"}, {"t": 480.28333333333336, "x": "体調を崩した時。"}, {"t": 481.8666666666667, "x": "そういう時に、安心できた記憶が上に出てきます。"}, {"t": 485.5, "x": "本人としては、思い出したから連絡しています。"}, {"t": 488.78333333333336, "x": "けれども受け取る側には、\n都合よく見えることがあります。"}, {"t": 492.5833333333333, "x": "苦しい時期を一人で越えた側からすれば、\n当然の感覚です。"}, {"t": 496.9, "x": "だから上書き型の人は、\n戻る時に順番を守ってください。"}, {"t": 501.18333333333334, "x": "連絡した理由より先に、遅れたことに触れる形です。"}, {"t": 505.06666666666666, "x": "そこに触れずに気持ちだけ伝えると、軽く見られます。"}, {"t": 508.75, "x": "この順番を間違えて、失敗する人がとても多いです。"}, {"t": 512.7333333333333, "x": "思い出した強さは、あくまでこちら側の\n事情でしかありません。"}, {"t": 516.8833333333333, "x": "相手の時間の話を先に置くと、話は聞いてもらえます。"}, {"t": 521.1333333333333, "x": "保存型の人にも、急に見える瞬間があります。"}, {"t": 524.75, "x": "長く連絡を取っていたのに、\nある日から切れる形です。"}, {"t": 528.5, "x": "外 05, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
