<script>
const D={"name": "同じ収入でも男女でお金の消え方が違う", "file": "059_同じ収入でも男女でお金の消え方が違う", "dur": 838.9, "segs": [], "subs": [{"t": 0.0, "x": "同じ収入の二人でも、お金の残\nり方は同じにならないことがあります。"}, {"t": 5.016666666666667, "x": "揉めている家を見ていくと、金額で\nぶつかっている場合は多くありません。"}, {"t": 9.833333333333334, "x": "ぶつかっているのは、使う順番の方かもしれません。"}, {"t": 13.4, "x": "男は、大きいものを先に一度で決めやすいです。"}, {"t": 16.916666666666668, "x": "一方で女は、小さいものを積\nみ上げて先に見やすいです。"}, {"t": 21.1, "x": "男は、決めた後で伝えるのが筋だと考えやすいです。"}, {"t": 25.116666666666667, "x": "一方で女は、決める前に共有\nしておきたいと考えやすいです。"}, {"t": 29.8, "x": "男は、総額でつり合っていれば\n問題ないと受け取りやすいです。"}, {"t": 34.016666666666666, "x": "一方で女は、毎月の流れが読\nめるかどうかを気にしやすいです。"}, {"t": 38.61666666666667, "x": "どちらも、家のためを思って\n動いていることが多いです。"}, {"t": 42.35, "x": "それでも順番が逆だと、相手の使\nい方だけが無駄に見えてしまいます。"}, {"t": 47.233333333333334, "x": "無駄に見えた側は、金額の話として切り出します。"}, {"t": 50.9, "x": "切り出された側は、暮らし方そのものを\n否定されたように受け取ります。"}, {"t": 55.38333333333333, "x": "それが何年か続くと、財布だ\nけが静かに分かれていきます。"}, {"t": 59.63333333333333, "x": "この回で見ていくのは、どちらが\n正しいかではなく順番の違いです。"}, {"t": 64.18333333333334, "x": "順番の地図さえあれば、同じ会話でも\n角が立ちにくくなります。"}, {"t": 68.55, "x": "揉めている家の話を聞くと、出\nてくる数字は意外と小さいことがあります。"}, {"t": 73.71666666666667, "x": "三千円の外食。"}, {"t": 75.31666666666666, "x": "月々のアプリの支払い。"}, {"t": 77.06666666666666, "x": "帰り道の缶コーヒー。"}, {"t": 78.83333333333333, "x": "それでも、その三つが何年も\nぶつかり続けることがあります。"}, {"t": 82.91666666666667, "x": "一方で、何十万円の買い物が\nすんなり通る家もあります。"}, {"t": 87.43333333333334, "x": "車の買い替え。"}, {"t": 88.66666666666667, "x": "洗濯機の入れ替え。"}, {"t": 90.1, "x": "子どもの進学の費用。"}, {"t": 91.8, "x": "額は桁違いなのに、もめずに決まっていきます。"}, {"t": 95.16666666666667, "x": "違いは、金額ではなく決まり方の方にあるようです。"}, {"t": 98.91666666666667, "x": "小さくても、知らないところで\n決まったものは大きく感じます。"}, {"t": 103.03333333333333, "x": "大きくても、二人で決めたものは小さく収まります。"}, {"t": 106.71666666666667, "x": "つまり、揉めているのは支出\nそのものではないのかもしれません。"}, {"t": 110.76666666666667, "x": "支出が生まれるまでの手順が、\n二人でずれているだけの場合があります。"}, {"t": 115.35, "x": "節約の話をいくら重ねても、\nだいたい同じ場所で止まります。"}, {"t": 119.75, "x": "その場所をつくっているのが、\n男女で逆になりやすい順番です。"}, {"t": 123.96666666666667, "x": "まず、男の側の順番から見ていきます。"}, {"t": 127.06666666666666, "x": "男は、お金を一度の決断とし\nてまとめやすいと言われます。"}, {"t": 131.28333333333333, "x": "値段を調べる。"}, {"t": 132.41666666666666, "x": "型番を比べる。"}, {"t": 133.7, "x": "買う日を決める。"}, {"t": 134.83333333333334, "x": "この三つが済むと、その買い物は終\nわったものとして扱われます。"}, {"t": 139.31666666666666, "x": "決めた後は振り返りにくいので、\n伝え方も一度で終わりがちです。"}, {"t": 143.95, "x": "買っておいたよ、の一言で完了\nしたつもりになる場合があります。"}, {"t": 148.31666666666666, "x": "一方で女は、決断を一度で終\nわらせない見方をしやすいです。"}, {"t": 152.81666666666666, "x": "買った後の維持費。"}, {"t": 154.21666666666667, "x": "置く場所。"}, {"t": 155.05, "x": "あとから必要になるもの。"}, {"t": 156.85, "x": "そこまで含めて、はじめて決\nまったと感じることがあります。"}, {"t": 160.71666666666667, "x": "だから男の完了と、女の完了は時間がずれます。"}, {"t": 164.71666666666667, "x": "ずれている間は、終わった話と\nまだ途中の話が同じ食卓に並びます。"}, {"t": 170.0, "x": "これは、どちらかが雑だとい\nう単純な話ではないようです。"}, {"t": 174.03333333333333, "x": "一度で決める力は、迷いが長\nくなる場面ではとても役に立ちます。"}, {"t": 178.78333333333333, "x": "合いにくいのは、毎月くり返\nす種類の支出だけかもしれません。"}, {"t": 183.13333333333333, "x": "その毎月の側を、女の側は先に見\nていることが多いです。"}, {"t": 187.51666666666668, "x": "女は、支出を一本の線として\nつなげて見やすいと言われます。"}, {"t": 191.83333333333334, "x": "今週の食費。"}, {"t": 193.13333333333333, "x": "来月の引き落とし。"}, {"t": 194.63333333333333, "x": "半年後の車検。"}, {"t": 195.9, "x": "ばらばらの出来事を、同じ一本の流れの\n上に並べます。"}, {"t": 199.95, "x": "並べているので、小さい増減でも\n先の見え方が変わります。"}, {"t": 204.26666666666668, "x": "一方で男は、支出を一件ずつの\n点として見やすいです。"}, {"t": 208.45, "x": "この買い物は妥当か。"}, {"t": 210.08333333333334, "x": "今月は足りているか。"}, {"t": 211.7, "x": "貯金は減っていないか。"}, {"t": 213.3, "x": "点ごとに判定して、問題がなければそこで終わります。"}, {"t": 217.11666666666667, "x": "点で見ている側から見ると、\n線の話は心配のしすぎに映ります。"}, {"t": 222.06666666666666, "x": "線で見ている側から見ると、\n点の話は場当たりに映ります。"}, {"t": 226.41666666666666, "x": "どちらも同じ家計を見ているのに、\n目盛りが違うだけです。"}, {"t": 230.35, "x": "だから足りているという言葉も、\n意味が二つに割れてしまいます。"}, {"t": 234.4, "x": "男にとっては今月の話で、女にとっては\n来年までの話です。"}, {"t": 239.25, "x": "同じ言葉が別の期間を指して\nいると、安心も共有されません。"}, {"t": 243.93333333333334, "x": "共有されないまま暮らすと、\n相手の使い方だけが目につき始めます。"}, {"t": 248.68333333333334, "x": "順番が逆になると、相手の支出\nだけが目につくようになります。"}, {"t": 253.15, "x": "点で見る側には、毎週の小さ\nな買い物が積もって見えます。"}, {"t": 257.48333333333335, "x": "少し高い調味料。"}, {"t": 258.98333333333335, "x": "子どもの細かい用品。"}, {"t": 260.6333333333333, "x": "友人との昼の食事。"}, {"t": 262.4, "x": "一つずつは小さいのに、合計だけが記憶に残ります。"}, {"t": 266.3666666666667, "x": "一方で線で見る側には、急に入\nる大きな買い物が目につきます。"}, {"t": 271.2, "x": "趣味の道具。"}, {"t": 272.2, "x": "買い替えの前倒し。"}, {"t": 273.73333333333335, "x": "付き合いの出費。"}, {"t": 274.95, "x": "金額より、流れに載っていなか\nったことが引っかかります。"}, {"t": 278.78333333333336, "x": "どちらも、相手を責めたいわ\nけではないことが多いです。"}, {"t": 282.3333333333333, "x": "自分の見方で並べ直した時に、\nそこだけ形が合わないだけです。"}, {"t": 286.8833333333333, "x": "形が合わないものを、人は無駄と呼\nんでしまいやすいです。"}, {"t": 290.81666666666666, "x": "無駄という言葉は、数字では\nなく人柄への評価として届きます。"}, {"t": 295.26666666666665, "x": "届いた側は、金額の説明では\nなく自分の事情を話し始めます。"}, {"t": 300.1333333333333, "x": "だから、無駄という言葉だけは\n使わない方が安全なようです。"}, {"t": 304.3333333333333, "x": "代わりにどの順番で決めたのかを\n聞くと、話がお金に戻ります。"}, {"t": 308.85, "x": "すれ違った後で、両方から同\nじ言葉が出ることがあります。"}, {"t": 313.06666666666666, "x": "先に言ってくれればよかった、という一言です。"}, {"t": 316.25, "x": "言われた側も、心の中で同じ言葉を返しています。"}, {"t": 320.0833333333333, "x": "聞いてくれればよかった、とも思っているからです。"}, {"t": 323.21666666666664, "x": "男の側は、決まってから伝え\nるのが親切だと考えやすいです。"}, {"t": 327.78333333333336, "x": "迷いを見せない。"}, {"t": 328.98333333333335, "x": "心配をかけない。"}, {"t": 330.31666666666666, "x": "整ってから話す。"}, {"t": 331.71666666666664, "x": "そういう順番を、長く守ってきた人もいます。"}, {"t": 335.1333333333333, "x": "一方で女の側は、迷っている段階から\n共有したいと考えやすいです。"}, {"t": 340.45, "x": "迷いは相談の材料になりますが、\n決定の報告は材料になりません。"}, {"t": 345.5, "x": "材料が来ないと、自分だけ外に置か\nれた感じが残ります。"}, {"t": 349.75, "x": "だから小さい支出でも、黙っ\nて決めた形になると大きく響きます。"}, {"t": 354.48333333333335, "x": "逆に大きい支出でも、迷いを\n見せていればあまり響きません。"}, {"t": 358.81666666666666, "x": "響き方を決めているのは、額では\nなく共有された時点のようです。"}, {"t": 363.3833333333333, "x": "ここから先は、家として何を決\nめておくかの話になります。"}, {"t": 367.6333333333333, "x": "多くの家で、決まっていないものが一つあります。"}, {"t": 371.0833333333333, "x": "いくらから相談するのか、という線です。"}, {"t": 373.95, "x": "三千円なのか。"}, {"t": 375.31666666666666, "x": "一万円なのか。"}, {"t": 376.6666666666667, "x": "三万円なのか。"}, {"t": 378.0, "x": "この線が無いまま、それぞれが\n自分の線で動いています。"}, {"t": 381.8333333333333, "x": "男の側は、自分の小遣いの範囲\nなら自由だと考えやすいです。"}, {"t": 386.56666666666666, "x": "一方で女の側は、家のお金との\n境目を細かく見やすいです。"}, {"t": 391.3833333333333, "x": "境目の位置が違うと、同じ買\nい物の扱いまで変わります。"}, {"t": 395.75, "x": "片方は伝えなくていいと思い、\n片方は相談する話だと思います。"}, {"t": 400.85, "x": "どちらも間違っていないので、どちらも譲れません。"}, {"t": 404.26666666666665, "x": "この線は、話し合えばだいたい十分ほどで\n決まります。"}, {"t": 408.0, "x": "それでも決まっていない家が多\nいのは、聞く機会が無いからです。"}, {"t": 412.1, "x": "揉めている時に線を引こうとすると、\n責める形になってしまいます。"}, {"t": 416.7, "x": "だから、何も起きていない日に決\nめておく方が楽なようです。"}, {"t": 420.71666666666664, "x": "線が無い家では、次のような\n逃げ方が生まれやすいです。"}, {"t": 424.73333333333335, "x": "自由に使えるお金が、まった\nく無い状態が続くことがあります。"}, {"t": 429.1333333333333, "x": "全部を共通の財布に入れて、\n使うたびに申告する形です。"}, {"t": 433.75, "x": "形としてはきれいですが、続\nけると別のことが起きます。"}, {"t": 437.5833333333333, "x": "どちらの側にも、申告しない\n支出が生まれやすくなります。"}, {"t": 441.6, "x": "コンビニの小さな買い物。"}, {"t": 443.51666666666665, "x": "職場の付き合い。"}, {"t": 444.78333333333336, "x": "趣味の細かい物。"}, {"t": 446.2, "x": "額は小さくても、言わなかっ\nたという事実だけが積もります。"}, {"t": 450.3, "x": "一方で管理している側は、数字が合\nわない感覚を持ち続けます。"}, {"t": 455.01666666666665, "x": "合わない理由が分からないので、\n確認が細かくなっていきます。"}, {"t": 459.26666666666665, "x": "細かくなるほど、隠す側はさらに言いにくくなります。"}, {"t": 462.95, "x": "ここは、どちらかが不誠実だから\n起きているのではありません。"}, {"t": 466.93333333333334, "x": "逃げ場のない仕組みが、隠すという動きを\n作っている場合があります。"}, {"t": 471.4, "x": "この形は、収入の多い少ないとは関係なく起きます。"}, {"t": 475.5833333333333, "x": "外で働いていない側にも、同\nじだけの逃げ場が要ります。"}, {"t": 479.53333333333336, "x": "額は小さくていいので、説明の\nいらないお金を両方に置きます。"}, {"t": 484.3, "x": "黙って使うという行動は、悪\nい方に読まれやすいです。"}, {"t": 488.23333333333335, "x": "裏切り。"}, {"t": 489.3333333333333, "x": "ごまかし。"}, {"t": 490.45, "x": "信用できない相手。"}, {"t": 491.98333333333335, "x": "そう受け取ると、話は一気に人格の話になります。"}, {"t": 495.8833333333333, "x": "ただ、隠している人の中で起\nきていることは少し違うようです。"}, {"t": 500.1166666666667, "x": "責められたくない。"}, {"t": 501.3, "x": "説明が面倒。"}, { "t": 766.65, "x": "お金の話は、家計の技術の話\nだけでは終わらないようです。"}, {"t": 771.0333333333333, "x": "どこまで相手に見せるかという、\n距離の話に近いところがあります。"}, {"t": 775.4666666666667, "x": "だから金額を合わせても、順番が\nずれたままだと落ち着きません。"}, {"t": 779.8666666666667, "x": "ずれたまま置いておくと、進\nみ方はだいたい決まっています。"}, {"t": 783.8166666666667, "x": "最初は、小さな買い物への一言から始まります。"}, {"t": 787.5, "x": "次に、聞かれる前に説明しておく癖がつきます。"}, {"t": 791.1333333333333, "x": "そのうち、説明するのが面倒で黙るようになります。"}, {"t": 795.05, "x": "黙った回数だけ、財布が静かに分かれていきます。"}, {"t": 798.8666666666667, "x": "分かれた財布は、数年は何事もなく回ります。"}, {"t": 802.5, "x": "回っている間に、共有してい\nた情報の方が先に切れます。"}, {"t": 806.8666666666667, "x": "切れたことに気づくのは、大きな出費が来た日です。"}, {"t": 810.2833333333333, "x": "その日に、相手の残高も予定も分か\nらないことに気づきます。"}, {"t": 814.5, "x": "あなたの家では、いくらから\n相談するかが決まっているでしょうか。"}, {"t": 818.5833333333334, "x": "決まっていないなら、今日の夜にでも\n決められる話です。"}, {"t": 822.2166666666667, "x": "それと、説明のいらないお金を両方に置\nいてみてください。"}, {"t": 826.4666666666667, "x": "守るのは金額ではありません。"}, {"t": 828.5833333333334, "x": "相手の逃げ場です。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
