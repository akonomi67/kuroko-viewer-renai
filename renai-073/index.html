<style>

<script>
const D={"name": "次も会いたいと思われる人は別れ際に必ずこれをしている", "file": "073_次も会いたいと思われる人は別れ際に必ずこれをしている", "dur": 849.7833125, "segs": [], "subs": [{"t": 0.0, "x": "次も会いたいと思われる人は、\n別れ際の数分を大事にしています。"}, {"t": 4.783333333333333, "x": "会っている間の会話より、終\nわり方の方が記憶に残りやすいからです。"}, {"t": 9.733333333333333, "x": "今日は帰り際と別れ際のふるまいを、\n男女に分けて見ていきます。"}, {"t": 14.45, "x": "男は別れ際を、一日の締めく\nくりとして扱いやすいです。"}, {"t": 18.966666666666665, "x": "女は別れ際を、次につながる\n入口として受け取りやすいです。"}, {"t": 23.6, "x": "男は楽しかったかどうかを一日の中身で確かめます。"}, {"t": 27.333333333333332, "x": "女はまた会いたいと思えたかを、\n最後の余韻で確かめます。"}, {"t": 31.6, "x": "同じ改札の前に立っていても、\n見ているものが違います。"}, {"t": 35.583333333333336, "x": "この違いを知らないと、楽し\nい一日がもったいない形で終わります。"}, {"t": 40.36666666666667, "x": "話は盛り上がったのに、次の誘いが来ない。"}, {"t": 43.75, "x": "連絡は続くのに、なぜか距離が縮まらない。"}, {"t": 47.06666666666667, "x": "そういう時は終わり方に、小\nさな取りこぼしがあることが多いです。"}, {"t": 51.56666666666667, "x": "逆に言えば別れ際は、誰でも\nすぐに変えられる場面です。"}, {"t": 55.68333333333333, "x": "話術は要りません。"}, {"t": 56.96666666666667, "x": "特別なお店も要りません。"}, {"t": 58.85, "x": "変えるのは三つです。"}, {"t": 60.28333333333333, "x": "切り上げる時間。"}, {"t": 61.483333333333334, "x": "最後の一言。"}, {"t": 62.733333333333334, "x": "帰り道の連絡。"}, {"t": 64.25, "x": "付き合う前の二人にも、付き合\nい始めた二人にも使えます。"}, {"t": 68.43333333333334, "x": "順番に見ていきます。"}, {"t": 69.96666666666667, "x": "人は会った一日を、帰り道で採点\nし直すことがあります。"}, {"t": 74.33333333333333, "x": "点数を大きく動かすのは最後の一分です。"}, {"t": 77.41666666666667, "x": "強く残りやすいのは二つの場面だと言われます。"}, {"t": 80.63333333333334, "x": "一番盛り上がった場面と、最後の場面です。"}, {"t": 84.13333333333334, "x": "途中が少し退屈でも、終わりが\n温かければ良い一日として残ります。"}, {"t": 89.1, "x": "途中が楽しくても終わりが雑だと印象が下がります。"}, {"t": 92.55, "x": "デートも同じ形をしています。"}, {"t": 94.71666666666667, "x": "最後の一分がそのまま一日の点数に\nなりやすいのです。"}, {"t": 98.58333333333333, "x": "三時間話した中身より、改札前の一分の方が思\nい出されやすいです。"}, {"t": 103.95, "x": "男は一日の中身で評価が決まると考えやすいです。"}, {"t": 107.76666666666667, "x": "いいお店を選べたか。"}, {"t": 109.33333333333333, "x": "会話が途切れなかったか。"}, {"t": 111.05, "x": "そこに力を注ぎます。"}, {"t": 112.78333333333333, "x": "だから店を出た後は、気が抜\nけてしまうことがあります。"}, {"t": 116.4, "x": "一方で女は帰り際の空気まで含めて、\n一日を振り返りやすいです。"}, {"t": 121.81666666666666, "x": "最後にどんな顔で別れたか。"}, {"t": 123.88333333333334, "x": "どんな言葉で終わったか。"}, {"t": 125.53333333333333, "x": "男の側は本番が終わった後のつもりでいます。"}, {"t": 128.83333333333334, "x": "女の側は、まだ本番の途中だと\n感じていることがあります。"}, {"t": 133.13333333333333, "x": "このずれがせっかくの一日を目減りさせやすいです。"}, {"t": 136.35, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 139.56666666666666, "x": "力を入れる場所が少しずれているだけです。"}, {"t": 142.26666666666668, "x": "最後の数分に気持ちを残すと、\n一日全体の色が変わります。"}, {"t": 146.98333333333332, "x": "そこで最初に見たいのが切り上げる時間です。"}, {"t": 149.88333333333333, "x": "楽しい時間ほど終わらせるのが惜しくなります。"}, {"t": 152.81666666666666, "x": "もう一軒行くか。"}, {"t": 154.11666666666667, "x": "もう少し歩くか。"}, {"t": 155.45, "x": "引き延ばしたくなるのは自然な気持ちです。"}, {"t": 158.03333333333333, "x": "相手を大事に思うほど強くなります。"}, {"t": 160.6, "x": "けれども話が出尽くしてから\n別れると、余韻が残りにくいです。"}, {"t": 165.1, "x": "話題が尽きた後の沈黙が、最後の記憶に\nなってしまうからです。"}, {"t": 169.56666666666666, "x": "男は長く一緒にいるほど、好意が伝わると\n考えやすいです。"}, {"t": 174.05, "x": "帰ると言い出すのが怖い人もいます。"}, {"t": 176.53333333333333, "x": "楽しくなかったと思われそうな気がするからです。"}, {"t": 179.51666666666668, "x": "一方で女は、疲れる前に別れ\nる方を心地よく感じやすいようです。"}, {"t": 184.58333333333334, "x": "終電の時間が気になると、話が頭に入\nってこなくなります。"}, {"t": 189.05, "x": "だから盛り上がっている途中で切\nり上げる人は、印象に残ります。"}, {"t": 193.36666666666667, "x": "続きはまた今度聞かせてほし\nい、という形で終われるからです。"}, {"t": 197.63333333333333, "x": "話の続きが残ると次に会う理由が自然に生まれます。"}, {"t": 201.41666666666666, "x": "もちろん急に席を立つと、冷\nたく見えることがあります。"}, {"t": 205.3, "x": "十分ほど前に、そろそろだねと言っておく形です。"}, {"t": 208.96666666666667, "x": "それだけで終わり方が柔らかくなります。"}, {"t": 211.5, "x": "相手も帰る準備ができます。"}, {"t": 213.55, "x": "初めて会う日なら、短めに終\nえるくらいがちょうどいいです。"}, {"t": 217.35, "x": "長く会うのは、二回目と三回目の楽しみに\n取っておけます。"}, {"t": 221.55, "x": "少しの物足りなさが次の約束を軽くしてくれます。"}, {"t": 225.03333333333333, "x": "別れ際に次の約束をするかど\nうかで、迷う人は多いです。"}, {"t": 229.45, "x": "男は次の予定を具体的に決めたがりやすいです。"}, {"t": 232.91666666666666, "x": "来週の土曜はどうか。"}, {"t": 234.63333333333333, "x": "あの映画を観に行こう。"}, {"t": 236.16666666666666, "x": "日付が決まると、関係が前に進\nんだと感じられるからで : 357.85, "x": "短い一言の方がかえって心に残ります。"}, {"t": 360.93333333333334, "x": "改札や駐車場で別れた後に、振り返るかどうか。"}, {"t": 365.0, "x": "小さなことですが、ここで印象が分か\nれることがあります。"}, {"t": 368.81666666666666, "x": "男は別れたらまっすぐ帰る人が多いです。"}, {"t": 371.81666666666666, "x": "振り返るのは照れくさいからです。"}, {"t": 373.93333333333334, "x": "しつこく見える気がする人もいます。"}, {"t": 376.1333333333333, "x": "一方で女は、見えなくなる前に一度振\nり返ることが多いようです。"}, {"t": 380.9, "x": "そして相手も振り返っていると、\n嬉しくなりやすいです。"}, {"t": 384.75, "x": "振り返った時に背中しか見え\nないと、少し寂しく感じます。"}, {"t": 389.18333333333334, "x": "男の側に冷たくしたつもりはまったくありません。"}, {"t": 392.46666666666664, "x": "けれども受け取る側には、名残惜しさの\n差として映ることがあります。"}, {"t": 396.93333333333334, "x": "何度も振り返る必要はありません。"}, {"t": 399.4, "x": "数歩進んだところで一度だけ振り返る。"}, {"t": 402.0833333333333, "x": "そして軽く会釈する。"}, {"t": 403.6666666666667, "x": "笑顔が添えられれば十分です。"}, {"t": 405.76666666666665, "x": "それだけで最後の場面に相手の顔が残ります。"}, {"t": 408.95, "x": "車で送る時は、家に入るのを\n見届けてから走り出す形です。"}, {"t": 413.6166666666667, "x": "すぐに走り去ると、送り届け\nた優しさが少し薄れて見えます。"}, {"t": 418.0833333333333, "x": "見送りは言葉を使わない別れの挨拶です。"}, {"t": 421.18333333333334, "x": "最後の数秒を丁寧にする人は、\n全体も丁寧に見えやすいです。"}, {"t": 426.0833333333333, "x": "別れた後の連絡も別れ際の続きです。"}, {"t": 429.06666666666666, "x": "男は帰り道の連絡を、確認の用事と\nして送りやすいです。"}, {"t": 433.7, "x": "無事に着いたかの確認。"}, {"t": 435.3666666666667, "x": "今日のお礼。"}, {"t": 436.3666666666667, "x": "用件だけの短い文になりがちです。"}, {"t": 438.95, "x": "短くても気にかけていることは伝わります。"}, {"t": 441.73333333333335, "x": "一方で女は、帰り道の連絡に余韻を乗\nせたいことが多いです。"}, {"t": 446.46666666666664, "x": "今日のどこが楽しかったか。"}, {"t": 448.25, "x": "次に行きたい場所はどこか。"}, {"t": 450.15, "x": "長めの連絡に短い返事が来ると、\n温度差を感じてしまいます。"}, {"t": 454.8333333333333, "x": "男の側は、別れ際に伝えたか\nらもう十分だと思っています。"}, {"t": 459.4166666666667, "x": "女の側は、帰ってからも続く会話を楽\nしみにしていることがあります。"}, {"t": 464.3333333333333, "x": "ここで大事なのは、早さより\n文の量をそろえることです。"}, {"t": 468.18333333333334, "x": "すぐに返せなくても、相手の長さに少し寄せて返す。"}, {"t": 472.1166666666667, "x": "相手が楽しかった場面を書い\nてきたら、同じ場面に一言足す。"}, {"t": 476.48333333333335, "x": "それだけで別れた後も同じ時間の中にいられます。"}, {"t": 479.8833333333333, "x": "どちらが先に送 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
