<script>
const D={"name": "義実家でのすれ違いは嫁姑の間ではなく夫婦の間で起きている", "file": "057_義実家でのすれ違いは嫁姑の間ではなく夫婦の間で起きている", "dur": 837.41665625, "segs": [], "subs": [{"t": 0.0, "x": "義実家で気まずくなった日のことを、\n覚えている人は多いようです。"}, {"t": 4.283333333333333, "x": "その日にぶつかっていたのは、\n相手の親と自分だけとは限りません。"}, {"t": 8.75, "x": "たいていは、その隣に立って\nいた人との間でも起きています。"}, {"t": 12.866666666666667, "x": "言われた一言、そのときの沈黙、\nそして黙って笑っていた横顔。"}, {"t": 17.8, "x": "後から思い出して苦しくなるのは、\n三つ目だという人が多いです。"}, {"t": 22.216666666666665, "x": "男は、その場を丸く収めることを先に考えやすいです。"}, {"t": 26.4, "x": "一方で女は、どちら側に立ったのかを\n先に見ていることがあります。"}, {"t": 31.033333333333335, "x": "収めた側は、何も起きなかっ\nた日として覚えています。"}, {"t": 34.81666666666667, "x": "見ていた側は、味方がいなか\nった日として覚えています。"}, {"t": 38.53333333333333, "x": "同じ数時間が、別の出来事と\nして二人の中に残ります。"}, {"t": 42.78333333333333, "x": "どちらかの家が悪いという単純な話ではないようです。"}, {"t": 46.45, "x": "育ってきた家の常識が、二つ並\nんだだけかもしれません。"}, {"t": 50.46666666666667, "x": "立場が逆になる家も、同じくらいあります。"}, {"t": 53.65, "x": "相手の親の家で小さくなっているのが、\n男の側という家も多いです。"}, {"t": 58.5, "x": "その場合でも、起きていることの\n形は変わらないようです。"}, {"t": 62.266666666666666, "x": "知らないままだと、訪問のたびに\n少しずつ距離が開いていきます。"}, {"t": 66.58333333333333, "x": "ここからは、その仕組みを十二に分けて見ていきます。"}, {"t": 70.03333333333333, "x": "義実家での揉め事は、当人同士で起\nきているように見えます。"}, {"t": 74.2, "x": "言葉を出したのは親で、受けたのは訪ねた側です。"}, {"t": 77.9, "x": "ところが、後を引くのは別の組み合わせのようです。"}, {"t": 81.21666666666667, "x": "帰ってから話し合う相手は、\n親ではなく隣にいた人です。"}, {"t": 85.4, "x": "謝ってほしいと感じるのも、この相手に対してです。"}, {"t": 89.11666666666666, "x": "男は、出来事そのものを問題として見やすいです。"}, {"t": 92.75, "x": "何を言われたか、誰が言ったか、\nそしてどれくらい本気だったか。"}, {"t": 97.21666666666667, "x": "一方で女は、その場の立ち位置を問題と\nして見やすいです。"}, {"t": 101.48333333333333, "x": "誰の隣にいたか、どちらを向いていたか、\nそして何を言わなかったか。"}, {"t": 106.31666666666666, "x": "この違いを知らないと、話が最後\nまでかみ合いません。"}, {"t": 110.11666666666666, "x": "出来事の話をする人と、立ち位置の話を\nする人が並びます。"}, {"t": 114.73333333333333, "x": "相手が求めているのは、親への\n抗議ではないかもしれません。"}, {"t": 118.8, "x": "自分の隣にいたという確認だけを、\n求めている場合があります。"}, {"t": 123.25, "x": "立ち位置の話だと分かると、\n次の章の見え方が変わります。"}, {"t": 127.61666666666666, "x": "自分の親の家に相手を連れて\n行った側は、真ん中に立っています。"}, {"t": 132.13333333333333, "x": "片側には育ててもらった親が\nいて、もう片側には選んだ相手がいます。"}, {"t": 137.15, "x": "どちらにも借りがあり、どち\nらとも長く付き合っていきます。"}, {"t": 141.0, "x": "だからその場では、動きにくくなることがあります。"}, {"t": 144.26666666666668, "x": "男は、この真ん中で黙るという形を取りやすいです。"}, {"t": 148.13333333333333, "x": "口を挟まない、話題を変える、そして席を立つ。"}, {"t": 152.08333333333334, "x": "一方で女は、真ん中に立つと\n先に謝る形を取りやすいです。"}, {"t": 156.78333333333333, "x": "うちの親が悪かった、後で言\nっておく、そして今日は我慢して。"}, {"t": 161.25, "x": "どちらも、場を守ろうとしている点では同じです。"}, {"t": 164.53333333333333, "x": "ところが、隣で見ている側には\nそう見えないことがあります。"}, {"t": 168.43333333333334, "x": "黙った人は、親に同意したように見えてしまいます。"}, {"t": 171.98333333333332, "x": "先に謝った人は、話を早く終\nわらせたように見えてしまいます。"}, {"t": 176.63333333333333, "x": "守ろうとした動きが、見捨て\nられた合図として届く場合があります。"}, {"t": 181.03333333333333, "x": "立つ場所が悪いのではなく、\n向きが見えないだけかもしれません。"}, {"t": 185.13333333333333, "x": "帰り道でよく出るのが、悪気は\nないから、という説明です。"}, {"t": 189.5, "x": "言った側の事情を、代わりに\n説明してあげる言葉です。"}, {"t": 193.5, "x": "これ自体は、嘘でも冷たさでもありません。"}, {"t": 196.5, "x": "ただ、受け取った側の話には一度もなっていません。"}, {"t": 200.16666666666666, "x": "男は、意図を説明すれば片づくと考えやすいです。"}, {"t": 204.0, "x": "本人の性格、昔からの口ぐせ、そして時代の違い。"}, {"t": 208.56666666666666, "x": "一方で女は、意図よりも起き\nた結果を見ていることがあります。"}, {"t": 212.75, "x": "その場で固まった、返事がで\nきなかった、そして帰りに涙が出た。"}, {"t": 217.53333333333333, "x": "意図の話と結果の話は、別の線路を走っています。"}, {"t": 221.56666666666666, "x": "だから、いくら丁寧に説明しても交わりません。"}, {"t": 225.05, "x": "説明された側は、我慢を延長\nされたように感じる場合があります。"}, {"t": 229.91666666666666, "x": "悪気がないなら、これからも\n同じことが続くと読めるからです。"}, {"t": 233.9, "x": "必要なのは、意図の説明より\n先の一行かもしれません。"}, {"t": 237.98333333333332, "x": "こちらも聞いていてきつかっ\nた、という事実の共有です。"}, {"t": 241.81666666666666, "x": "言われた側の頭に残るのは、\n言葉そのものとは限りません。"}, {"t": 246.03333333333333, "x": "残るのは、同じ種類のことが\n何回あったかという数です。"}, {"t": 250.03333333333333, "x": "子どもはまだか、料理はどこで習ったのか、\nそして仕事はいつ辞めるのか。"}, {"t": 255.16666666666666, "x": "一つ一つは、世間話の範囲に見えるものばかりです。"}, {"t": 259.05, "x": "男は、一回ごとの重さで判断しやすいです。"}, {"t": 262.53333333333336, "x": "冗談だった、軽い口調だった、\nそして三分で終わった。"}, {"t": 266.71666666666664, "x": "一方で女は、積み上がった回数で判断\nしていることがあります。"}, {"t": 271.3, "x": "去年も言われた、今年も出た、\nそして次も来ると分かる。"}, {"t": 275.3, "x": "この数え方の違いが、温度差の正体に\nなっている場合があります。"}, {"t": 279.85, "x": "一回を軽く見る側と、七回目を受\nけている側が並んで話しています。"}, {"t": 284.98333333333335, "x": "軽く見た側に悪意はなく、本当に一回だと\n思っています。"}, {"t": 289.2, "x": "相手が重く見ているのは人ではなく、\n繰り返しの方かもしれません。"}, {"t": 293.8333333333333, "x": "だから、回数を一緒に数えるだけで\n話が変わることがあります。"}, {"t": 298.2, "x": "今日で何回目だったね、と言\nえるだけで足りる場合もあります。"}, {"t": 302.26666666666665, "x": "その場で止めに入れない側には、は\nっきりした理由があります。"}, {"t": 306.78333333333336, "x": "自分の親には、強く出られな\nい仕組みがあるからです。"}, {"t": 310.3833333333333, "x": "育ててもらった、折々で世話になった、\nそして今も頼ることがある。"}, {"t": 315.23333333333335, "x": "この三つがあると、その場で声を上げるのは\n難しくなります。"}, {"t": 319.5, "x": "男は、自分の親に対して黙る形を選\nびやすいと言われます。"}, {"t": 324.01666666666665, "x": "反論しない、聞き流す、そして後で個別に伝える。"}, {"t": 328.01666666666665, "x": "一方で女も、自分の親の前では\n同じ形になることがあります。"}, {"t": 332.8666666666667, "x": "母親の言い方に慣れていて、\n止める発想が出てこない場合です。"}, {"t": 337.26666666666665, "x": "慣れは、その場では優しさとして働きません。"}, {"t": 340.51666666666665, "x": "気にならない側が、気になる\n側の隣で普通にしています。"}, {"t": 344.53333333333336, "x": "その普通の顔が、いちばんこ\nたえるという話をよく聞きます。"}, {"t": 348.6666666666667, "x": "止められないなら、止めない\n理由を先に言う手があります。"}, {"t": 352.3333333333333, "x": "その場では言えないけれど帰\nったら必ず聞く、で足ります。"}, {"t": 356.1666666666667, "x": "先に言っておけば、沈黙の意味が変わって届きます。"}, {"t": 359.8, "x": "その場で言い返さない側にも、\n同じだけ理由があります。"}, {"t": 363.7, "x": "いちばん大きいのは、次に会\nう日が決まっていることです。"}, {"t": 367.4166666666667, "x": "盆と正月、法事、そして子どもの行事。"}, {"t": 370.78333333333336, "x": "先の予定まで見えているので、\nその場で言い負かす意味がありません。"}, {"t": 375.23333333333335, "x": "女は、長い付き合いの方を守\nって黙る形を選びやすいです。"}, {"t": 379.7, "x": "角を立てない、笑って受ける、そして話題を変える。"}, {"t": 383.5833333333333, "x": "一方で男も、相手の親の前では\n同じ選び方をすることがあります。"}, {"t": 388.65, "x": "出された料理を残さない、仕事の話を短\nく切る、そして早めに席を立つ。"}, {"t": 394.4, "x": "どちらの側でも、我慢の中身はほとんど同じようです。"}, {"t": 398.26666666666665, "x": "違うのは、その我慢が隣の人に見\nえているかどうかです。"}, {"t": 402.25, "x": "見えていない我慢は、無かっ\nたことになってしまいます。"}, {"t": 405.76666666666665, "x": "無かったことにされた分だけ、\n帰り道の言葉が重くなります。"}, {"t": 410.05, "x": "我慢は、隣の人に見つけても\nらえると半分になるようです。"}, {"t": 414.15, "x": "ただ、見つけてもらう前に危ない時間が来ます。"}, {"t": 417.46666666666664, "x": "義実家の話がこじれる場所は、\nたいてい家の中ではないようです。"}, {"t": 421.8833333333333, "x": "帰りの車の中や、駅までの道の途中です。"}, {"t": 425.45, "x": "気を張っていた時間が終わって、\n力が抜ける瞬間があります。"}, {"t": 429.78333333333336, "x": "その瞬間に、しまっていたものが先に顔を出します。"}, {"t": 433.56666666666666, "x": "男は、終わった安心の方が先に出やすいです。"}, {"t": 437.1333333333333, "x": "無事に済んだ、思ったより短か\nった、そして来年も同じでいい。"}, {"t": 441.8833333333333, "x": "一方で女は、押さえていた疲\nれの方が先に出やすいです。"}, {"t": 446.1333333333333, "x": "まだ体がこわばる、言葉が何度も戻\nってくる、そして涙が近い。"}, {"t": 451.06666666666666, "x": "出てくる順番が違うだけで、二人とも疲れています。"}, {"t": 454.93333333333334, "x": "ところが、安心が先に出た側の方が口が軽くなります。"}, {"t": 459.01666666666665, "x": "軽くなった口から出る一言が、\nその日を決めてしまうことがあります。"}, {"t": 463.48333333333335, "x": "車の中は逃げ場がなく、顔も見\nえず、時間だけが長いです。"}, {"t": 468.2, "x": "同じ言葉でも、この場所で言\nうと何倍にもなって残ります。"}, {"t": 472.18333333333334, "x": "危ないのは中身ではなく、出\nす場所と順番かもしれません。"}, {"t": 476.28333333333336, "x": "帰り道で出やすい言葉を、先に並べておきます。"}, {"t": 479.95, "x": "一つ目は、悪気はないから気にしないで、です。"}, {"t": 483.6, "x": "二つ目は、いつものことだから流せばいい、です。"}, {"t": 487.2, "x": "三つ目は、そんなに怒ることかな、です。"}, {"t": 490.31666666666666, "x": "どれも、場を落ち着かせようとして出てくる言葉です。"}, {"t": 493.65, "x": "男は、感情を小さくして終わらせようとしやすいです。"}, {"t": 497.53333333333336, "x": "大げさにしない、蒸し返さな\nい、そして明日には忘れる。"}, {"t": 501.7, "x": "一方で女は、感情を小さくされると\n話を閉じてしまうことがあります。"}, {"t": 506.9, "x": "もういい、大丈夫、そして次からは何も言わない。"}, {"t": 510.76666666666665, "x": "このもういいが出た日から、\n回数の数え方が変わります。"}, {"t": 514.6333333333333, "x": "言っても無駄だという項目が、一つ増えてしまいます。"}, {"t": 518.2666666666667, "x": "増えた項目は、親ではなく隣の人の欄に書かれます。"}, {"t": 522.25, "x": "これは、気にしないでという\n言葉が冷たいという話ではありません。"}, {"t": 526.5833333333334, "x": "順番が先すぎるだけで、置く場所を変えれば\n効く言葉です。"}, {"t": 530.5166666666667, "x": "効く言葉は、思っているより短いようです。"}, {"t": 533.55, "x": "一つ目は、今日はきつかったね、です。"}, {"t": 536.5166666666667, "x": "二つ目は、あの話が出たとき困ったよね、です。"}, {"t": 540.2333333333333, "x": "三つ目は、次は先に切り上げよう、です。"}, {"t": 543.6833333333333, "x": "共通しているのは、起きた出来 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
