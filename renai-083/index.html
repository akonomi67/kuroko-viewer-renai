<script>
const D={"name": "寂しさの出し方が逆_男は一人で埋め女は二人で埋めようとする", "file": "083_寂しさの出し方が逆_男は一人で埋め女は二人で埋めようとする", "dur": 804.55, "segs": [], "subs": [{"t": 0.0, "x": "付き合っている二人が、一緒にいるのに\n寂しくなることがあります。"}, {"t": 4.233333333333333, "x": "今日はその寂しさの出し方が男女で\nどう違うかを見ていきます。"}, {"t": 8.283333333333333, "x": "日曜の夜、同じソファに二人で座っている\n場面を思い浮かべてください。"}, {"t": 13.25, "x": "男は画面のゲームに夢中です。"}, {"t": 15.533333333333333, "x": "女はテレビを見ながら、少しずつ\n口数が減っていきます。"}, {"t": 19.633333333333333, "x": "会えない日の話ではありません。"}, {"t": 21.733333333333334, "x": "隣にいるのになぜか寂しい日の話です。"}, {"t": 24.616666666666667, "x": "先に答えを言っておきます。"}, {"t": 26.533333333333335, "x": "寂しさの出し方が男女で逆になっていることが\n多いです。"}, {"t": 30.216666666666665, "x": "男は寂しくなると、一人で埋めようとしやすいです。"}, {"t": 33.96666666666667, "x": "女は寂しくなると、二人で埋めようとしやすいです。"}, {"t": 37.78333333333333, "x": "男は自分の時間にこもって、\n気持ちが戻るのを待つことがあります。"}, {"t": 42.43333333333333, "x": "女は話しかけたり誘ったりして、\nつながりを確かめようとします。"}, {"t": 46.916666666666664, "x": "この違いを知らないと、埋めようとする\n動きが相手には逆に見えます。"}, {"t": 51.666666666666664, "x": "男が一人になるほど、女はもっと寂しくなります。"}, {"t": 55.38333333333333, "x": "女が近づくほど、男は一人で整える場所を失います。"}, {"t": 59.63333333333333, "x": "どちらも寂しさを何とかしようとしているだけです。"}, {"t": 62.766666666666666, "x": "それなのにすれ違っていきます。"}, {"t": 64.78333333333333, "x": "その出し方の違いを場面ごとに並べていきます。"}, {"t": 68.0, "x": "寂しいという言葉は同じでも\n中に入っているものが違うことがあります。"}, {"t": 72.61666666666666, "x": "男の寂しさは、自分の居場所が見えなくなった\n時に出やすいです。"}, {"t": 77.13333333333334, "x": "頼られなくなった。"}, {"t": 78.41666666666667, "x": "必要とされている感じが薄れた。"}, {"t": 80.73333333333333, "x": "話を聞いてもらえない。"}, {"t": 82.4, "x": "役に立てていない気がすると、\n心に穴があいたように感じやすいです。"}, {"t": 87.1, "x": "一方で女の寂しさは、気持ちが\n届いていないと感じた時に出やすいです。"}, {"t": 92.3, "x": "話しても上の空。"}, {"t": 93.73333333333333, "x": "目が合わない。"}, {"t": 94.7, "x": "今日のことを聞かれない。"}, {"t": 96.21666666666667, "x": "相手の心が少し遠くにある気がするのです。"}, {"t": 99.2, "x": "男は自分の立ち位置で寂しくなりやすいです。"}, {"t": 102.28333333333333, "x": "女は心の距離で寂しくなりやすいと言われます。"}, {"t": 105.61666666666666, "x": "もちろんどちらの寂しさも両方が持っています。"}, {"t": 108.7, "x": "ただ先に感じやすい方が違うことが多いのです。"}, {"t": 112.03333333333333, "x": "穴の場所が違えば、埋める道具も違ってきます。"}, {"t": 115.5, "x": "男は自分を立て直す道具を探します。"}, {"t": 118.28333333333333, "x": "女は相手とつながり直す道具を探します。"}, {"t": 121.26666666666667, "x": "同じ寂しいでも向かう先が違うのです。"}, {"t": 124.01666666666667, "x": "この中身の違いが、後の動き方の違いに\nつながっていきます。"}, {"t": 128.25, "x": "女の寂しさは、一緒にいる時にこそ\n出ることがあります。"}, {"t": 132.25, "x": "休日に二人で家にいるのに、\n相手はずっと画面を見ている。"}, {"t": 136.4, "x": "話しかけても短い返事しか返ってこない。"}, {"t": 139.3, "x": "晩ごはんの話をしても、目はテレビのままです。"}, {"t": 142.68333333333334, "x": "同じ部屋にいるのに、一人でいる\n時より寂しく感じることがあります。"}, {"t": 147.36666666666667, "x": "会えない日の寂しさは、会えば消えます。"}, {"t": 150.21666666666667, "x": "けれども隣にいる時の寂しさは、\n会っても消えません。"}, {"t": 154.01666666666668, "x": "だからこちらの寂しさの方が、深く残りやすいです。"}, {"t": 157.73333333333332, "x": "女にとって大事なのは、時間の長さではありません。"}, {"t": 161.43333333333334, "x": "心が向いているかどうかです。"}, {"t": 163.36666666666667, "x": "一日一緒にいても、心が向いていなければ\n寂しいままです。"}, {"t": 167.58333333333334, "x": "五分だけでも、目を見て話せた\n日は満たされることがあります。"}, {"t": 171.58333333333334, "x": "男からすると、一緒にいるのだから\n十分だと思いやすいです。"}, {"t": 176.03333333333333, "x": "一緒にいること自体が愛情の表し方だと\n考えているからです。"}, {"t": 180.28333333333333, "x": "その感覚の差が、休日の小さな寂しさを\n生んでいきます。"}, {"t": 184.51666666666668, "x": "本人もなぜ寂しいのかうまく言えないことが多いです。"}, {"t": 187.95, "x": "隣にいる相手に寂しいとは言いにくいからです。"}, {"t": 191.1, "x": "男の寂しさは、気づかれにくい\n形で出ることがあります。"}, {"t": 195.03333333333333, "x": "相談されることが減った。"}, {"t": 196.78333333333333, "x": "自分の話をすると話題を変えられた。"}, {"t": 199.43333333333334, "x": "彼女が友達と出かける日が増えた。"}, {"t": 201.85, "x": "どれも小さなことです。"}, {"t": 203.43333333333334, "x": "けれども男の中では少しずつ積もります。"}, {"t": 206.28333333333333, "x": "自分がいなくても、この人は大丈夫なのかも\nしれない。"}, {"t": 209.95, "x": "そう感じた時に男は寂しさを覚えやすいです。"}, {"t": 213.3, "x": "寂しいというより、置いていかれた\n感じに近いかもしれません。"}, {"t": 217.38333333333333, "x": "男は自分の寂しさを、寂しさだと\n気づかないこともあります。"}, {"t": 221.66666666666666, "x": "なんとなく面白くない。"}, {"t": 223.28333333333333, "x": "理由は分からないけれど元気が出ない。"}, {"t": 225.71666666666667, "x": "そういう形で本人の中にたまっていきます。"}, {"t": 228.68333333333334, "x": "女から見ると、急にそっけなくなったように見えます。"}, {"t": 232.4 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
