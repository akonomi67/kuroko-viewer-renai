<script>
const D={"name": "定年後に二人の行き先が分かれる", "file": "051_定年後に二人の行き先が分かれる", "dur": 1171.3333125, "segs": [], "subs": [{"t": 0.0, "x": "定年の日は、二人にとって同\nじ一日ではないようです。"}, {"t": 4.05, "x": "同じ家に住み、同じ紙に判を押しても、\n向いている先が違うことがあります。"}, {"t": 9.45, "x": "男は、ここから始まると受け取りやすいです。"}, {"t": 12.6, "x": "旅行、道の駅、そして二人で過ごす時間。"}, {"t": 16.2, "x": "そういうものが、これから増\nえると考える場合があります。"}, {"t": 19.966666666666665, "x": "定年までの数年を、その見通\nしで持たせてきた人もいます。"}, {"t": 24.266666666666666, "x": "一方で女は、やっと終わったと受け取りやすいです。"}, {"t": 27.883333333333333, "x": "気を張る朝、時間で回る家事、\nそして人に合わせる暮らし。"}, {"t": 32.4, "x": "そういうものから、やっと降\nりられると考える場合があります。"}, {"t": 36.5, "x": "どちらも、相手を嫌いになったわけではありません。"}, {"t": 39.833333333333336, "x": "長い年月のあいだに、置いて\nきた場所が違っただけかもしれません。"}, {"t": 44.166666666666664, "x": "男は、居場所の多くを会社に預けてきました。"}, {"t": 47.6, "x": "女は、居場所を少しずつ家の外に作ってきました。"}, {"t": 51.36666666666667, "x": "預けた側は、退職の日にそれを返してもらえません。"}, {"t": 55.2, "x": "作ってきた側は、退職の日にもそれを失いません。"}, {"t": 58.85, "x": "この差が、退職の翌週あたりから\n形になって出てきます。"}, {"t": 62.916666666666664, "x": "出てきたときに理由が分からないと、\n相手のせいに見えてしまいます。"}, {"t": 67.26666666666667, "x": "そばにいる人が邪魔に見えたり、\n冷たく見えたりすることがあります。"}, {"t": 71.73333333333333, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 74.95, "x": "ここからは、行き先が分かれ\nていく順番を十二に分けて見ていきます。"}, {"t": 79.46666666666667, "x": "まず男にとって、定年の日はは\nっきりした区切りになりやすいです。"}, {"t": 84.05, "x": "最後の出勤、花束、そして送別の挨拶。"}, {"t": 87.95, "x": "その三つが、その日を境目として刻みます。"}, {"t": 91.18333333333334, "x": "肩書きも行き先も呼ばれ方も、\n翌日から変わってしまいます。"}, {"t": 95.51666666666667, "x": "だから男は、その一日を長く覚\nえていることが多いようです。"}, {"t": 99.85, "x": "一方で女にとって、定年の日は境目に\nなりにくいです。"}, {"t": 104.21666666666667, "x": "家の仕事には、最後の出勤という日がありません。"}, {"t": 107.85, "x": "洗濯、食事の支度、そして親の通院の付き添い。"}, {"t": 111.91666666666667, "x": "その三つは、翌日も同じように並んでいます。"}, {"t": 115.36666666666666, "x": "変わるのは、家の中に一日じ\nゅう人がいるかどうかだけです。"}, {"t": 119.55, "x": "この違いを知らないと、最初の会話か\nらかみ合わなくなります。"}, {"t": 123.83333333333333, "x": "男は、二人で節目を迎えたつもりで話し始めます。"}, {"t": 127.75, "x": "女は、自分の側の暮らしは何も終\nわっていないと感じます。"}, {"t": 131.96666666666667, "x": "祝いの言葉が薄く返ってくると、\n男は寂しく思うかもしれません。"}, {"t": 136.68333333333334, "x": "薄いのは気持ちではなく、その\n日の意味が違うからかもしれません。"}, {"t": 141.0, "x": "片方には終わりの日で、片方にはただの水曜日です。"}, {"t": 144.98333333333332, "x": "同じ日を同じ顔で迎えられないのは、\nそこに理由がありそうです。"}, {"t": 149.38333333333333, "x": "そして終わった側には、翌朝か\nら大きな空白が生まれます。"}, {"t": 153.66666666666666, "x": "終わっていない側には、その空白が生まれません。"}, {"t": 157.05, "x": "空白のできた側だけが、翌朝か\nら時間の使い方を考えます。"}, {"t": 161.76666666666668, "x": "この空白のあるなしが、ここから\n先すべての入口になります。"}, {"t": 165.9, "x": "男は、定年を開始の合図として受け取りやすいです。"}, {"t": 169.7, "x": "やりたかったことを、これから取りに行ける。"}, {"t": 172.36666666666667, "x": "行きたかった場所に、平日でも行ける。"}, {"t": 175.13333333333333, "x": "話したかった相手と、いくらでも話せる。"}, {"t": 178.01666666666668, "x": "そういう見通しが、退職の前から\n膨らんでいることがあります。"}, {"t": 182.2, "x": "一方で女は、定年を終了の合図と\nして受け取りやすいです。"}, {"t": 186.73333333333332, "x": "毎朝の見送りが、終わる。"}, {"t": 188.85, "x": "帰宅の時間に合わせた支度が、終わる。"}, {"t": 191.63333333333333, "x": "人の予定で動く日々が、やっと終わる。"}, {"t": 194.5, "x": "そういう見通しも、静かに積\nみ上がっていることがあります。"}, {"t": 198.36666666666667, "x": "この二つは、方向がちょうど逆を向いています。"}, {"t": 201.7, "x": "男は増やす方向に、女は減ら\nす方向に動こうとしやすいです。"}, {"t": 206.45, "x": "知らないままだと、片方の期待が\nそのまま重さになります。"}, {"t": 210.53333333333333, "x": "これから毎日一緒だね、とい\nう言葉が弾まないことがあります。"}, {"t": 214.86666666666667, "x": "弾まないのは、うれしくないからとは限りません。"}, {"t": 218.16666666666666, "x": "同じ言葉が一方には解放に、\n一方には延長に聞こえるからです。"}, {"t": 223.11666666666667, "x": "向きが逆だと分かっていれば、\n返事の薄さも読み違えずに済みます。"}, {"t": 227.71666666666667, "x": "逆だと知らないと、最初の一週間で傷を作\nってしまいます。"}, {"t": 232.1, "x": "その傷は小さいのに、あとか\nら長く残ることがあります。"}, {"t": 236.01666666666668, "x": "気持ちを疑う前に、向きを確かめるほうが\n早いようです。"}, {"t": 240.2, "x": "そして向きの違いは、まず予定表の形に\nなって現れます。"}, {"t": 244.53333333333333, "x": "男の側に最初に起きるのは、\n予定表が白紙になることです。"}, {"t": 248.96666666666667, "x": "会議の時間、出張の日程、そして締め切りの日。"}, {"t": 253.06666666666666, "x": "その三つが、ある日いっせいに消えます。"}, {"t": 255.75, "x": "消えたあとに残るのは、何も書か\nれていないひと月ぶんの枠です。"}, {"t": 260.1166666666667, "x": "自由な時間が増えたはずなのに、\n落ち着かないことがあります。"}, {"t": 264.1, "x": "一方で女の側の予定表は、白紙になりません。"}, {"t": 267.8833333333333, "x": "病院の予約、当番の日、そして友人との約束。"}, {"t": 272.1333333333333, "x": "その三つは、退職の前から自分で入\nれてきたものです。"}, {"t": 275.93333333333334, "x": "自分で入れた予定は、会社を辞めても消えません。"}, {"t": 279.3666666666667, "x": "この差が、家の中で温度差として出てしまいます。"}, {"t": 282.71666666666664, "x": "男は、埋めるものを探して家の中を見回します。"}, {"t": 286.3666666666667, "x": "女は、すでに埋まっている予定の中に立っています。"}, {"t": 289.95, "x": "探している側は、暇そうに見\nられていると感じやすいです。"}, {"t": 293.93333333333334, "x": "埋まっている側は、急に手伝いを\n頼まれたように感じやすいです。"}, {"t": 298.3833333333333, "x": "白紙は、休みと同じものではないのかもしれません。"}, {"t": 301.96666666666664, "x": "四十年ぶんの役割が、行き先を失\nった状態に近いようです。"}, {"t": 306.6, "x": "だから男の側は、まず埋める先を必要とします。"}, {"t": 310.28333333333336, "x": "必要としている本人も、それを寂しさとは呼びません。"}, {"t": 314.18333333333334, "x": "やることがないだけだ、とい\nう言い方になりやすいです。"}, {"t": 317.6666666666667, "x": "外に一つでも用があれば、白紙はそこまで\n重くなりません。"}, {"t": 321.76666666666665, "x": "埋める先を家の中だけに求め\nると、次の摩擦が起きます。"}, {"t": 326.15, "x": "女の側の一日は、退職の日を\nまたいでも形が変わりません。"}, {"t": 330.8, "x": "朝の洗濯、昼の買い物、そして夕方の支度。"}, {"t": 334.75, "x": "その三つは、誰かの退職に合\nわせて減ったりしません。"}, {"t": 338.5, "x": "むしろ家に人が増えるぶん、\n量は増えることがあります。"}, {"t": 342.35, "x": "昼ごはんが一食から二食にな\nるのは、小さいようで毎日です。"}, {"t": 346.78333333333336, "x": "一方で男の側は、その増えた分に気づきにくいです。"}, {"t": 350.75, "x": "家にいるのだから、負担は減\nっているはずだと考えやすいです。"}, {"t": 354.95, "x": "自分が食器を下げれば、手間は増\nえていないと感じやすいです。"}, {"t": 359.1666666666667, "x": "実際には、献立を考える回数が\nそのぶん増えています。"}, {"t": 363.43333333333334, "x": "考える手間は外から見えないので、\n数に入りにくいようです。"}, {"t": 367.75, "x": "ここで休んでいるだけに見えると、\n女は言葉にしづらくなります。"}, {"t": 372.1333333333333, "x": "言いづらいまま続くと、小さ\nな不満が溜まっていきます。"}, {"t": 375.93333333333334, "x": "溜まった側は、疲れているとだけ言うようになります。"}, {"t": 379.4, "x": "言われた側は、体の疲れの話\nだと受け取ってしまいます。"}, {"t": 383.5, "x": "疲れの正体が、増えた作業では\nなく増えた判断のこともあります。"}, {"t": 388.1666666666667, "x": "判断の数は、手伝いますという一言では減りません。"}, {"t": 391.93333333333334, "x": "減らすには、何を誰が決めるのかを\n分ける必要があります。"}, {"t": 395.95, "x": "分けないまま手だけ足すと、\n指示を出す手間が増えてしまいます。"}, {"t": 399.8833333333333, "x": "指示を出すくらいなら自分でや\nる、という形に戻りやすいです。"}, {"t": 404.1333333333333, "x": "手を足すより先に、決める人を決めるほうが\n効くようです。"}, {"t": 407.95, "x": "そこから、家の中の役割の話に入ります。"}, {"t": 411.5, "x": "家にいる時間が増えると、役割の線が急に見\nえてきます。"}, {"t": 415.9166666666667, "x": "男は、手伝う側として入ろうとしやすいです。"}, {"t": 419.3, "x": "ごみを出す、風呂を洗う、そして買い物について行く。"}, {"t": 423.2, "x": "その三つは、頼まれれば動くという形で始まります。"}, {"t": 427.06666666666666, "x": "一方で女は、四十年ぶん自分の手順を作\nってきています。"}, {"t": 431.53333333333336, "x": "洗剤を置く場所、洗濯物を干す順番、\nそして鍋の位置。"}, {"t": 436.2, "x": "その三つには、理由のある並びがあることが\n多いです。"}, {"t": 439.9166666666667, "x": "手伝いが入ると、その並びが\n少しずつずれていきます。"}, {"t": 443.8833333333333, "x": "ずれると、あとで直す手間が増えてしまいます。"}, {"t": 446.95, "x": "ありがたいのに疲れる、とい\nう状態になりやすいです。"}, {"t": 450.6333333333333, "x": "男の側から見ると、その反応は理不尽に映\nるかもしれません。"}, {"t": 455.2, "x": "やったのに文句を言われた、と\nいう受け取り方になります。"}, {"t": 458.8833333333333, "x": "どちらも、相手を困らせようとはしていません。"}, {"t": 461.98333333333335, "x": "台所は、誰かが長く勤めてき\nた職場なのかもしれません。"}, {"t": 466.18333333333334, "x": "四十年勤めた場所に新しい人が来\nたと考えると、近いようです。"}, {"t": 471.2, "x": "だから要るのは、手伝いでは\nなく引き継ぎのほうです。"}, {"t": 474.56666666666666, "x": "ごみは全部こちら、風呂は全部\nそちら、という分け方にします。"}, {"t": 479.1, "x": "分けてしまえば、直す手間も指示の手間も減\nっていきます。"}, {"t": 482.81666666666666, "x": "分けないうちは、どちらも善意の\nまま消耗してしまいます。"}, {"t": 486.6666666666667, "x": "分けた担当は、一度決めたら\n途中で口を出さないのが条件です。"}, {"t": 491.2, "x": "そして役割がぶつかると、誘\nいの言葉まで重くなります。"}, {"t": 495.4166666666667, "x": "男の側は、空いた時間を二人で埋\nめようとしやすいです。"}, {"t": 499.43333333333334, "x": "どこか行こう、という言葉が増えることがあります。"}, {"t": 502.73333333333335, "x": "温泉、道の駅、そして紅葉の見ごろ。"}, {"t": 506.21666666666664, "x": "その三つを調べて、楽しみに\n待っていることもあります。"}, {"t": 509.95, "x": "一方で女の側は、その誘いを\n予定として受け取ることがあります。"}, {"t": 514.6833333333333, "x": "支度、運転の段取り、そして帰ってからの片づけ。"}, {"t": 518.7333333333333, "x": "その三つが、頭の中で先に並んでしまいます。"}, {"t": 522.15, "x": "行きたくないのではなく、作業に見\nえているのかもしれません。"}, {"t": 526.1166666666667, "x": "断られた側は、自分が拒まれ\nたと受け取ってしまいます。"}, {"t": 530.1, "x": "受け取り違いが続くと、誘う\nこと自体をやめてしまいます。"}, {"t": 534.2166666666667, "x": "やめた側は、その寂しさを言葉に\nしないことが多いようです。"}, {"t": 538.3166666666667, "x": "ここで効くのは、誘いを二つに分けることです。"}, {"t": 541.5166666666667, "x": "行きたいという気持ちと、行く日の相談を分けます。"}, {"t": 544.85, "x": "行きたいところがあるとだけ\n先に言えば、相手は身構えません。"}, {"t": 548.9, "x": "段取りの話は、別の日に出しても遅くありません。"}, {"t": 552.55, "x": "一緒に行かない日を作るのも、\n同じくらい大事なようです。"}, {"t": 556.4166666666666, "x": "毎回二人ぶんで動こうとすると、\n断る回数が増えてしまいます。"}, {"t": 561.1166666666667, "x": "断る回数が増えると、断る側にも疲れが溜まります。"}, {"t": 565.3666666666667, "x": "片方だけで行ってきた話を聞\nくほうが、楽しい日もあります。"}, {"t": 569.4666666666667, "x": "土産の話を聞くほうが、無理に連\nれ出すより近づくこともあります。"}, {"t": 573.9666666666667, "x": "そして断りにくさの背景には、\n外の居場所の差があります。"}, {"t": 578.1833333333333, "x": "女の側には、家の外に作って\nきた居場所があることが多いです。"}, {"t": 582.7666666666667, "x": "近所の友人、習い事、そして地域の当番。"}, {"t": 586.7833333333333, "x": "その三つは、会社を通さずに\n自分で作ったつながりです。"}, {"t": 590.7666666666667, "x": "自分で作ったものなので、誰かの\n退職では消えません。"}, {"t": 594.7, "x": "名前で呼ばれる関係が、家の外に残っています。"}, {"t": 598.4, "x": "一方で男の側は、その関係の作\nり方を見ていないことがあります。"}, {"t": 603.4, "x": "どこで知り合ったのかも、把握\nしていない場合があります。"}, {"t": 607.0833333333334, "x": "だから急に増えた外出が、避\nけられているように見えてしまいます。"}, {"t": 611.4666666666667, "x": "実際には、前からずっと続い\nていたものかもしれません。"}, {"t": 615.35, "x": "家に人がいるようになって、\n初めて見えただけの場合もあります。"}, {"t": 619.6833333333333, "x": "ここを勘違いすると、行き先を聞\nく回数が増えてしまいます。"}, {"t": 624.0166666666667, "x": "聞かれた側は、報告を求めら\nれていると感じやすいです。"}, {"t": 628.0166666666667, "x": "感じた側は、出かける前の説明を短くしていきます。"}, {"t": 632.1, "x": "短くなるほど、聞く側はかえ\nって不安になってしまいます。"}, {"t": 636.0666666666667, "x": "外の居場所は、二人の間から\n逃げた先とは限りません。"}, {"t": 640.0833333333334, "x": "四十年かけて別に育ててきた、も\nう一つの根かもしれません。"}, {"t": 644.25, "x": "根を切らせようとすると、そ\nこから静かに離れていきます。"}, {"t": 648.2333333333333, "x": "行き先を聞くより、帰ってか\nらの話を聞くほうが届きます。"}, {"t": 652.4333333333333, "x": "どこへ行ったかより、誰と何を話\nしたかのほうが続きます。"}, {"t": 656.5333333333333, "x": "知っている名前が増えると、\n外出を疑う気持ちも減っていきます。"}, {"t": 661.0833333333334, "x": "では、男の側に同じ根が残りに\nくい理由を見ていきます。"}, {"t": 665.25, "x": "男の側の関係は、会社を通し\nて作られたものが多いようです。"}, {"t": 669.8833333333333, "x": "同じ部署、同じ取引先、そして同じ帰り道。"}, {"t": 674.0833333333334, "x": "その三つが、会い続けるための\n仕組みになっていました。"}, {"t": 677.6333333333333, "x": "仕組みが外れると、連絡をす\nる理由がなくなってしまいます。"}, {"t": 681.8833333333333, "x": "理由がないと、誘う口実も作りにくくなります。"}, {"t": 685.5166666666667, "x": "一方で女の側の関係は、用が\nなくても続く形が多いです。"}, {"t": 690.3833333333333, "x": "用のない立ち話が、関係を薄く長く保ってくれます。"}, {"t": 694.3333333333334, "x": "この違いは、性格の差というよ\nり置き場所の差のようです。"}, {"t": 698.3333333333334, "x": "会社に預けていたので、退職と一緒に引\nき上げられただけです。"}, {"t": 702.7, "x": "だから男の側は、退職後にまと\nめて居場所を失いやすいです。"}, {"t": 707.1833333333333, "x": "失った本人も、それを喪失だとは呼びません。"}, {"t": 710.7166666666667, "x": "呼べないまま、家の中にいる\n相手のほうへ向かうことがあります。"}, {"t": 714.9333333333333, "x": "向かわれた側は、急に距離が近づいたと感じます。"}, {"t": 718.6166666666667, "x": "近づかれた側が下がると、近\nづいた側はさらに寄ってしまいます。"}, {"t": 723.2333333333333, "x": "この追いかけ合いが、定年後の数か月でよ\nく起きるようです。"}, {"t": 727.3666666666667, "x": "必要なのは、外に一つでも自分の用を作\nることかもしれません。"}, {"t": 731.9166666666666, "x": "用は、立派なものでなくて構いません。"}, {"t": 734.7, "x": "決まった曜日に行く場所が一\nつあれば、それで形になります。"}, {"t": 738.8166666666667, "x": "図書館でも、散歩の道でも、同じように働くようです。"}, {"t": 743.1166666666667, "x": "週に一度の用が、家の中の距離まで\n整えてくれることがあります。"}, {"t": 747.8166666666667, "x": "ここまでが、行き先が分かれていく仕組みの話です。"}, {"t": 751.3166666666667, "x": "退職を境に関係が変わる話は、よく聞きます。"}, {"t": 755.2333333333333, "x": "ただ、定年の日に何かが決ま\nるわけではないようです。"}, {"t": 758.9833333333333, "x": "決まっているのは、その前の長\nい期間かもしれません。"}, {"t": 762.5833333333334, "x": "子どもの受験、親の介護、そして単身赴任。"}, {"t": 766.25, "x": "その三つの時期に、どちらがどれだけ抱えたか。"}, {"t": 769.5166666666667, "x": "そこで残った差が、時間がで\nきた日にまとめて出てきます。"}, {"t": 773.3, "x": "男の側は、その期間の記憶が仕事で埋\nまっていることがあります。"}, {"t": 777.85, "x": "働いて支えていた、という記憶が中心に\nなりやすいです。"}, {"t": 781.9333333333333, "x": "一方で女の側は、その期間を一人で回\nした記憶で覚えています。"}, {"t": 786.9, "x": "どちらも嘘ではなく、見ていた場所が違うだけです。"}, {"t": 790.3666666666667, "x": "これは、愛情がなくなったという話ではありません。"}, {"t": 793.95, "x": "同じ二十年を、別の帳簿で付けていたという話です。"}, {"t": 798.1166666666667, "x": "帳簿が合わないまま時間だけが空くと、\nその差が見えてしまいます。"}, {"t": 802.4833333333333, "x": "見えた側は、今さら返しても\nらえないと感じてしまいます。"}, {"t": 806.5166666666667, "x": "感じたまま黙ると、静かな距離だけが残ります。"}, {"t": 810.15, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 813.3666666666667, "x": "だから、定年の日に慌てても\n間に合わないことがあります。"}, {"t": 817.3, "x": "逆に言えば、定年より前なら\n手が打てるということです。"}, {"t": 821.2166666666667, "x": "打てる手は、大きな決断ではありません。"}, {"t": 824.1, "x": "あの時期は一人で回してもら\nった、と言えるかどうかです。"}, {"t": 827.8666666666667, "x": "残っている差に名前を付ける\nことから、始まるようです。"}, {"t": 831.55, "x": "関係が離れていくとき、大き\nな喧嘩は起きないことが多いようです。"}, {"t": 836.1833333333333, "x": "先に出るのは、小さくて静かなサインのほうです。"}, {"t": 839.65, "x": "一つ目は、会話が業務連絡だけになることです。"}, {"t": 843.1333333333333, "x": "ごみの日、支払い、そして病院の予定。"}, {"t": 846.4166666666666, "x": "その三つだけで一日が終わる日が、増えていきます。"}, {"t": 850.05, "x": "感想も、雑談も、笑い話も入らなくなります。"}, {"t": 854.1833333333333, "x": "二つ目は、予定を別々に入れ始めることです。"}, {"t": 857.6333333333333, "x": "相談せずに決めた予定が、カレンダーに\n並んでいきます。"}, {"t": 861.5333333333333, "x": "並んだ予定が一つも重ならな\nい状態が、何か月も続きます。"}, {"t": 866.1333333333333, "x": "三つ目は、報告が事後だけになることです。"}, {"t": 869.1666666666666, "x": "出かける前に言わず、帰ってから言う形に変わります。"}, {"t": 873.1166666666667, "x": "男の側は、静かになったことを\n落ち着いたと受け取りやすいです。"}, {"t": 877.4166666666666, "x": "一方で女の側は、静かなのは\n言うのをやめたからと感じやすいです。"}, {"t": 882.3, "x": "やめた理由は、言っても変わ\nらなかった回数かもしれません。"}, {"t": 886.3, "x": "サインは、怒っている状態よりも手前にあります。"}, {"t": 889.8166666666667, "x": "怒っているうちは、まだ期待が残\nっている場合があります。"}, {"t": 893.7, "x": "静かになってからのほうが、\n戻すのに時間がかかるようです。"}, {"t": 897.6, "x": "ここでも、どちらかが冷たいという話にはなりません。"}, {"t": 901.1833333333333, "x": "言う側も、言われる側も、や\nり方を教わっていないだけです。"}, {"t": 905.5833333333334, "x": "三つのうち二つが出ていたら、\n早めに手を入れるほうが安全です。"}, {"t": 909.8666666666667, "x": "だから、静かさの中身を見に行く必要がありそうです。"}, {"t": 913.65, "x": "離れていると感じると、時間の\nほうを増やそうとしやすいです。"}, {"t": 917.9333333333333, "x": "一緒に出かける、一緒に食べる、そして一緒に寝る。"}, {"t": 921.7666666666667, "x": "その三つを増やせば戻ると、考えることがあります。"}, {"t": 925.5, "x": "ただ、時間の量は先に効かない場合があります。"}, {"t": 928.9666666666667, "x": "量を増やすと、かえって息苦しくなることもあります。"}, {"t": 932.65, "x": "先に要るのは、別々でいられ\nる形を作ることのようです。"}, {"t": 936.75, "x": "一人で出かける日、別々の部屋、\nそして口を出さない趣味。"}, {"t": 941.2166666666667, "x": "その三つが確保できていると、\n一緒の時間が軽くなります。"}, {"t": 945.45, "x": "帰る場所があるから、安心し\nて離れていられるのと同じです。"}, {"t": 949.5666666666667, "x": "男の側は、この順番を逆に考えやすいです。"}, {"t": 953.25, "x": "仲良くするために、まず , {"t": 1091.3, "x": "預けた側は空白を持ち、作っ\nた側は続きを持っています。"}, {"t": 1095.7666666666667, "x": "持っているものが違えば、同\nじ日に同じ顔はできません。"}, {"t": 1099.6666666666667, "x": "これは、愛情が減ったという話ではありません。"}, {"t": 1103.0333333333333, "x": "四十年かけて置いてきた場所が違\nっていた、という話です。"}, {"t": 1107.1, "x": "知らないままだと、だいたい\n同じ順番で進んでいきます。"}, {"t": 1111.05, "x": "最初は、返事が薄いと感じる程度です。"}, {"t": 1114.15, "x": "次に、誘う回数が減っていきます。"}, {"t": 1117.0166666666667, "x": "そのうち、予定を別々に入れるようになります。"}, {"t": 1120.45, "x": "最後に、会話が業務連絡だけになってしまいます。"}, {"t": 1124.1333333333334, "x": "ここまで来ても、嫌いになっ\nたわけではないことが多いようです。"}, {"t": 1128.1, "x": "ただ、話しかける理由がなく\nなっているだけかもしれません。"}, {"t": 1131.8833333333334, "x": "あなたも、静かになったのを落ち着いたと受\nけ取ったことがあるのではないでしょうか。"}, {"t": 1136.9, "x": "静かさは、落ち着きとは限りません。"}, {"t": 1139.5, "x": "だから、今日できることを一つだけ置いておきます。"}, {"t": 1142.7333333333333, "x": "相手が今週どこへ行くのかを、\n聞くのではなく覚えてみてください。"}, {"t": 1147.1666666666667, "x": "覚えている相手には、人はま\nた予定を話すようになります。"}, {"t": 1151.25, "x": "話す相手が家にいれば、二人の行\nき先はゆっくり近づいていきます。"}, {"t": 1155.9833333333333, "x": "同じ方向を向く必要は、たぶんありません。"}, {"t": 1159.1833333333334, "x": "近づける距離だけ、近づけておけば足ります。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
