<script>
const D={"name": "ほめてほしい所が逆_頑張りを話した時男は結果を女は過程をほめてほしい", "file": "120_ほめてほしい所が逆_頑張りを話した時男は結果を女は過程をほめてほしい", "dur": 747.41665625, "segs": [], "subs": [{"t": 0.0, "x": "恋人が頑張ったことを話してくれた\n時、どこをほめていますか。"}, {"t": 4.333333333333333, "x": "そのほめてほしい所が、男女で逆になりやすいです。"}, {"t": 8.116666666666667, "x": "男は、結果をほめてほしいと感じやすいです。"}, {"t": 11.516666666666667, "x": "勝ったことや受かったこと、\nうまくできた出来ばえです。"}, {"t": 14.916666666666666, "x": "女は、過程をほめてほしいと感じやすいです。"}, {"t": 18.3, "x": "そこまでにかけた時間や工夫や迷いです。"}, {"t": 21.05, "x": "同じひとつの報告でも、聞いてほしい場所が\n違うのです。"}, {"t": 25.0, "x": "だから、よかれと思った言葉が\nすれ違うことがあります。"}, {"t": 28.7, "x": "男は、大変だったねと言われて少し物足りなくなる。"}, {"t": 32.46666666666667, "x": "女は、受かってよかったねと言われて\n少しさびしくなる。"}, {"t": 36.2, "x": "どちらもちゃんとほめてもらっているのにです。"}, {"t": 38.766666666666666, "x": "しかもこのずれは、ほとんど口に出されません。"}, {"t": 41.85, "x": "言われた側も、笑ってうなずくからです。"}, {"t": 44.65, "x": "ほめてくれた相手に、そこじゃないとは\n言いにくいからです。"}, {"t": 48.3, "x": "今回は試験や仕事や趣味の報告を\n受けた場面を扱います。"}, {"t": 52.55, "x": "ほめ言葉がどこに届くのか、順番に見ていきましょう。"}, {"t": 56.31666666666667, "x": "頑張った話には、たいてい2つの部分があります。"}, {"t": 59.9, "x": "ひとつはゴールです。"}, {"t": 61.2, "x": "試験に受かった。"}, {"t": 62.38333333333333, "x": "契約がとれた。"}, {"t": 63.666666666666664, "x": "大会で勝った。"}, {"t": 64.85, "x": "もうひとつは、そこまでの道のりです。"}, {"t": 67.46666666666667, "x": "毎朝早く起きた。"}, {"t": 68.95, "x": "資料を3回作り直した。"}, {"t": 70.91666666666667, "x": "雨の日も練習を続けた。"}, {"t": 72.86666666666666, "x": "男は、ゴールのほうを見てほしいと思いやすいです。"}, {"t": 76.36666666666666, "x": "女は、道のりのほうを見てほしいと思いやすいです。"}, {"t": 80.03333333333333, "x": "どちらが正しいという話ではありません。"}, {"t": 82.68333333333334, "x": "どちらも大切な頑張りです。"}, {"t": 84.7, "x": "同じ頑張りを違うところで区切っているだけです。"}, {"t": 87.78333333333333, "x": "男にとっては、ゴールに着いた時が話の山場です。"}, {"t": 91.51666666666667, "x": "女にとっては、道のりの中に山場がいくつもあります。"}, {"t": 95.41666666666667, "x": "だから、同じ報告でも話の長さが変わってきます。"}, {"t": 99.18333333333334, "x": "男の報告は短く、終わりの一言に力がこもります。"}, {"t": 103.36666666666666, "x": "女の報告は長めで、途中の出来事に力がこもります。"}, {"t": 107.66666666666667, "x": "聞く側が自分の区切り方で返すと、\nずれが生まれます。"}, {"t": 111.65, "x": "まずは、2人の区切り方が違うと知っておくことです。"}, {"t": 115.36666666666666, "x": "男が結果をほめられたがるのにはわけがあります。"}, {"t": 118.55, "x": "結果は、自分の\n力をはかる目印になりやすいからです。"}, {"t": 122.61666666666666, "x": "できたかできなかったか。"}, {"t": 124.15, "x": "勝ったか負けたか。"}, {"t": 125.4, "x": "はっきりした形があると、自分の\n値打ちを確かめられます。"}, {"t": 129.55, "x": "男は、その目印をだれかに認めてもらいたいのです。"}, {"t": 133.31666666666666, "x": "それも、できれば身近な人にです。"}, {"t": 135.85, "x": "特に、好きな相手からの一言は強く残ります。"}, {"t": 139.5, "x": "仕事で大きな発表を終えた日を\n思い浮かべてください。"}, {"t": 143.1, "x": "男が話したいのは、うまくいったという事実です。"}, {"t": 146.53333333333333, "x": "準備の大変さは、あまり話しません。"}, {"t": 149.35, "x": "大変さを語ると、言いわけのように\n感じることがあるからです。"}, {"t": 153.7, "x": "苦労は自分の中にしまっておきたい人もいます。"}, {"t": 156.8, "x": "だから、途中の苦労にふれられると\n少し照れくさくなります。"}, {"t": 160.65, "x": "それより結果を見て、やったねと言ってほしいのです。"}, {"t": 164.21666666666667, "x": "その一言で、苦労がまとめて\n報われた気持ちになります。"}, {"t": 168.15, "x": "男にとって、結果へのほめ言葉は\n苦労への答えでもあります。"}, {"t": 172.55, "x": "一方で女は、過程を見てもらえると\nほっとしやすいです。"}, {"t": 176.48333333333332, "x": "結果は、手間の積み重ねの先にあると\n感じているからです。"}, {"t": 180.48333333333332, "x": "半年かけて資格の勉強をした女性がいたとします。"}, {"t": 183.95, "x": "受かったことはもちろんうれしい出来事です。"}, {"t": 186.6, "x": "けれど、心に残っているのはそこまでの日々です。"}, {"t": 190.03333333333333, "x": "眠い朝に机に向かったこと。"}, {"t": 192.21666666666667, "x": "くじけそうになってもやめなかったこと。"}, {"t": 194.61666666666667, "x": "そこを分かってもらえると、\n頑張りがまるごと受け止められます。"}, {"t": 198.65, "x": "受かってよかったねだけだと、\nどこか足りなく感じます。"}, {"t": 202.18333333333334, "x": "結果だけを見られると、途中の\n自分が消えてしまうからです。"}, {"t": 206.25, "x": "女にとって、過程は自分そのものに近いものです。"}, {"t": 209.95, "x": "迷った日も含めての自分です。"}, {"t": 212.11666666666667, "x": "だから、過程をほめられると\n自分をほめられた気持ちになります。"}, {"t": 216.23333333333332, "x": "毎朝早く起きていたよねという一言です。"}, {"t": 219.13333333333333, "x": "そこには、ずっと見ていたよという\n意味がふくまれます。"}, {"t": 222.66666666666666, "x": "女が欲しいのは点数よりもこのまなざしなのです。"}, {"t": 226.03333333333333, "x": "結果へのお祝いは、そのあとでも十分に届きます。"}, {"t": 229.75, "x": "この違いがはっきり出るのは、\nうまくいかなかった日です。"}, {"t": 233.33333333333334, "x": "試験に落ちた。"}, {"t": 234.48333333333332, "x": "大事な試合で負けた。"}, {"t": 236.08333333333334, "x": "長 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
