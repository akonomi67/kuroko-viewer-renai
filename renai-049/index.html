<script>
const D={"name": "相手が黙って離れていく行動_男女5つずつ", "file": "049_相手が黙って離れていく行動_男女5つずつ", "dur": 834.36665625, "segs": [], "subs": [{"t": 0.0, "x": "今日は、片方だけの話ではありません。"}, {"t": 2.9, "x": "男の側から五つ、女の側から五つ、\n同じ数だけ出します。"}, {"t": 7.633333333333334, "x": "扱うのは、悪気がないのに相手が\n黙ってしまう行動です。"}, {"t": 11.8, "x": "怒らせる行動なら、その場で分かります。"}, {"t": 14.683333333333334, "x": "言い返してもらえるので、直す機会があります。"}, {"t": 17.983333333333334, "x": "やっかいなのは、何も言われないまま距離が\n空く方です。"}, {"t": 21.633333333333333, "x": "言われないので、本人は最後まで気づきません。"}, {"t": 24.85, "x": "気づかないまま同じことを続けて、\nある日終わることがあります。"}, {"t": 28.983333333333334, "x": "どれも、意地悪でやっている人はほとんどいません。"}, {"t": 32.25, "x": "良かれと思って、あるいは何も思わずにやっています。"}, {"t": 35.916666666666664, "x": "だからこそ、指摘されにくい形で残り続けます。"}, {"t": 39.55, "x": "共通しているのは、相手の言葉を途中で\n止めてしまう点です。"}, {"t": 43.78333333333333, "x": "止められた回数が増えると、人は言うのをやめます。"}, {"t": 47.416666666666664, "x": "先に言っておくと、全部が当てはまる人はいません。"}, {"t": 51.05, "x": "一つか二つ心当たりがあれば、それで十分です。"}, {"t": 54.61666666666667, "x": "男の側を先に、女の側を後に、\n同じ数だけ見ていきます。"}, {"t": 59.45, "x": "数を揃えたのは、どちらかを直す側に\n固定しないためです。"}, {"t": 63.583333333333336, "x": "片側だけの話にすると、\n聞いている半分の人が他人事になってしまいます。"}, {"t": 68.96666666666667, "x": "一つ目は、話の途中で引き取ってしまうことです。"}, {"t": 72.45, "x": "それは要するにこういうことだよね、\nとまとめてしまいます。"}, {"t": 76.3, "x": "本人としては、理解を示しているつもりです。"}, {"t": 79.48333333333333, "x": "早く分かってあげたいという気持ちも入っています。"}, {"t": 82.68333333333334, "x": "けれども、話している側にはまだ続きがあります。"}, {"t": 86.06666666666666, "x": "続きの部分に、いちばん言いたいことが\n入っていることが多いです。"}, {"t": 90.46666666666667, "x": "先にまとめられると、\nその部分は出せなくなることがあります。"}, {"t": 94.6, "x": "出せなかった話は、消えるわけではありません。"}, {"t": 97.8, "x": "次に話す時の、面倒くささとして残ります。"}, {"t": 101.28333333333333, "x": "何度か重なると、話し始める前に\n諦めてしまいやすいです。"}, {"t": 105.75, "x": "諦めた人は、要点だけを短く伝えるようになります。"}, {"t": 109.8, "x": "報告だけの会話になった家は、静かで穏やかです。"}, {"t": 113.51666666666667, "x": "穏やかなので、うまくいっていると感じてしまいます。"}, {"t": 117.01666666666667, "x": "防ぎ方は、簡単で、最後まで待つことだけです。"}, {"t": 120.96666666666667, "x": "相づちだけを打って、終わるまで口を開かない。"}, {"t": 124.23333333333333, "x": "三十秒待てば、たいていの話は最後まで出ます。"}, {"t": 127.91666666666667, "x": "出しきってもらってから、まとめれば遅くありません。"}, {"t": 131.18333333333334, "x": "まとめるのが得意な人ほど、\nこの待ち時間が長く感じるようです。"}, {"t": 135.66666666666666, "x": "長く感じるだけで、実際には\n一分もかかっていないことがあります。"}, {"t": 140.28333333333333, "x": "二つ目は、答えを出すのが早すぎることです。"}, {"t": 143.43333333333334, "x": "解決を出すこと自体は、悪いことではありません。"}, {"t": 146.95, "x": "問題になりやすいのは、速さの方です。"}, {"t": 149.93333333333334, "x": "話し終わった直後に答えが出てくると、\n受け取り方が変わります。"}, {"t": 154.35, "x": "今さっき考えた答えには、聞こえないことがあります。"}, {"t": 158.01666666666668, "x": "前から思っていたことを、\n今出しただけに見えてしまいます。"}, {"t": 161.95, "x": "そう見えると、自分の話が\n材料にされていないと感じやすいです。"}, {"t": 166.73333333333332, "x": "本人は、役に立とうとして急いでいるだけです。"}, {"t": 170.05, "x": "急いだぶんだけ、考えた時間が\n短く見えるという話です。"}, {"t": 174.43333333333334, "x": "何度か続くと、相談する側は結論を先に想像します。"}, {"t": 178.75, "x": "どうせこう言われる、と分かった時点で話しません。"}, {"t": 182.16666666666666, "x": "話さなくなった相手には、相談が来なくなります。"}, {"t": 185.61666666666667, "x": "来なくなったことを、\nうまくいっている印と読み違えます。"}, {"t": 189.38333333333333, "x": "防ぎ方は、答えを一呼吸置いてから出すことです。"}, {"t": 192.9, "x": "それは大変だったね、と先に置くだけで変わります。"}, {"t": 196.45, "x": "置いてから、同じ答えを出しても構いません。"}, {"t": 199.48333333333332, "x": "順番を入れ替えるだけなので、\n内容は変えずに済みます。"}, {"t": 203.43333333333334, "x": "答えを出すなという話ではないので、\nそこは安心してください。"}, {"t": 207.76666666666668, "x": "求められていないのは速さの方で、\n中身の方ではありません。"}, {"t": 212.1, "x": "三つ目は、予定の伝え方です。"}, {"t": 214.63333333333333, "x": "来月の連休、実家に帰ることにしたから。"}, {"t": 217.93333333333334, "x": "決定だけが、後から届く形になります。"}, {"t": 221.03333333333333, "x": "本人には、相談するほどの話ではありません。"}, {"t": 224.43333333333334, "x": "報告で足りると判断しているだけです。"}, {"t": 227.0, "x": "けれども、受け取る側は別のことを読み取ります。"}, {"t": 230.3, "x": "自分の予定は、考える材料に入っていなかった。"}, {"t": 233.96666666666667, "x": "その一点だけが、はっきり残ってしまいます。"}, {"t": 236.96666666666667, "x": "内容に不満が無くても、\n順番の方に不満が残ることがあります。"}, {"t": 241.73333333333332, "x": "何度か重なると、こちらも先に決めるようになります。"}, {"t": 245.43333333333334, "x": "お互いが決めてから伝える形になると、\n生活は別々に回ります。"}, {"t": 250.58333333333334, "x": "別々でも回るので、揉めることもありません。"}, {"t": 253.76666666666668, "x": "揉めないまま、二人でいる理由が薄くなっていきます。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
