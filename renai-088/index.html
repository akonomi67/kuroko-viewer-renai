const D={"name": "二人きりで変わる_人前と二人きりで態度が変わる理由は男女で正反対", "file": "088_二人きりで変わる_人前と二人きりで態度が変わる理由は男女で正反対", "dur": 816.15, "segs": [], "subs": [{"t": 0.0, "x": "付き合っている相手が人前と二人きりで\nまるで違う顔を見せることがあります。"}, {"t": 4.866666666666666, "x": "今日はその差が男女でどう違うのかを見ていきます。"}, {"t": 8.1, "x": "友達との飲み会ではほとんど話しかけてこない。"}, {"t": 11.25, "x": "目も合わせない。"}, {"t": 12.333333333333334, "x": "隣にも座らない。"}, {"t": 13.733333333333333, "x": "それなのに帰り道で二人になると、急に優しくなる。"}, {"t": 17.75, "x": "別人かと思うほどです。"}, {"t": 19.5, "x": "戸惑う人は少なくありません。"}, {"t": 21.583333333333332, "x": "先に答えを言っておきます。"}, {"t": 23.5, "x": "人前の意味が男女で正反対のことが多いです。"}, {"t": 26.783333333333335, "x": "男にとって人前は、気持ちを\nしまっておく場になりやすいです。"}, {"t": 31.016666666666666, "x": "女にとって人前は、気持ちを\n確かめる場になりやすいです。"}, {"t": 35.18333333333333, "x": "男は二人きりになってからやっと気持ちを\n出すことがあります。"}, {"t": 38.95, "x": "女は人前での扱われ方に、大事にされているかを\n見ることがあります。"}, {"t": 44.05, "x": "この違いを知らないと、\n同じ一日が二人に別の記憶を残します。"}, {"t": 48.9, "x": "男は楽しい一日だったと思っています。"}, {"t": 51.8, "x": "女は少し寂しい一日だったと感じています。"}, {"t": 55.13333333333333, "x": "どちらも相手を好きなまま起きていることです。"}, {"t": 57.9, "x": "人前と二人きり。"}, {"t": 59.36666666666667, "x": "それぞれの場面で何が起きているのかを\n並べていきます。"}, {"t": 62.9, "x": "人前での態度は大きく二つの向きに分かれます。"}, {"t": 66.16666666666667, "x": "一つは、二人の仲を周りから隠す向きです。"}, {"t": 69.55, "x": "もう一つは二人の仲を周りにそっと見せる向きです。"}, {"t": 72.95, "x": "男は前の向きになりやすいと言われます。"}, {"t": 75.71666666666667, "x": "恋人への気持ちは二人の間だけのもの。"}, {"t": 78.61666666666666, "x": "そう考えやすいからです。"}, {"t": 80.43333333333334, "x": "外では普段どおりの自分でいます。"}, {"t": 82.8, "x": "気持ちは家まで持ち帰ります。"}, {"t": 84.91666666666667, "x": "一方で女は後の向きになりやすいようです。"}, {"t": 88.0, "x": "大事にされている様子が周りにも\n少しだけ見えてほしいのです。"}, {"t": 92.05, "x": "大げさな愛情表現を求めているわけではありません。"}, {"t": 95.66666666666667, "x": "隣に来てくれる。"}, {"t": 96.9, "x": "話を振ってくれる。"}, {"t": 98.26666666666667, "x": "帰る時に声をかけてくれる。"}, {"t": 100.25, "x": "その小さな印で二人の仲を確かめています。"}, {"t": 103.48333333333333, "x": "男にとっての人前は、箱のふたを\n閉める場所に近いです。"}, {"t": 107.53333333333333, "x": "女にとっての人前は、窓を少し開ける\n場所に近いです。"}, {"t": 111.61666666666666, "x": "ふたを閉めた\n男はちゃんと大事にしているつもりです。"}, {"t": 114.88333333333334, "x": "窓をのぞいた女は中が見えないことに\n不安になります。"}, {"t": 118.53333333333333, "x": "同じ場所にいるのに、見ているものが違うのです。"}, {"t": 121.86666666666666, "x": "まずは男がふたを閉める理由から見ていきます。"}, {"t": 124.93333333333334, "x": "男が人前で素っ気なくなる理由はいくつか\n重なっています。"}, {"t": 128.81666666666666, "x": "一つめは照れです。"}, {"t": 130.13333333333333, "x": "恋人と仲よくしている姿を見られる。"}, {"t": 132.75, "x": "それがどこか恥ずかしいのです。"}, {"t": 134.71666666666667, "x": "二つめは仲間にからかわれたくない気持ちです。"}, {"t": 137.68333333333334, "x": "飲み会でいじられる。"}, {"t": 139.03333333333333, "x": "後から冷やかされる。"}, {"t": 140.45, "x": "あだ名をつけられる。"}, {"t": 141.73333333333332, "x": "こういう場面を先回りして避けようとします。"}, {"t": 144.66666666666666, "x": "三つめはしっかりした自分でいたい気持ちです。"}, {"t": 147.51666666666668, "x": "職場の人や後輩の前では甘い顔を見せたくない。"}, {"t": 151.08333333333334, "x": "そう考えやすいです。"}, {"t": 152.66666666666666, "x": "どれも恋人への気持ちが薄いから\n起きることではありません。"}, {"t": 156.41666666666666, "x": "むしろ大事な相手だからこそ、\n軽く扱われたくないのかもしれません。"}, {"t": 161.08333333333334, "x": "冷やかしの話題にされると、\n二人の関係が安く見える気がするのです。"}, {"t": 166.01666666666668, "x": "ただその気持ちは外からは見えません。"}, {"t": 168.48333333333332, "x": "周りにはただ冷たい恋人に見えることもあります。"}, {"t": 171.8, "x": "本人は守っているつもりです。"}, {"t": 173.83333333333334, "x": "でも相手を一人にしている場合もあります。"}, {"t": 176.51666666666668, "x": "隠しているのは気持ちであって、\n相手ではないはずです。"}, {"t": 180.1, "x": "けれども隣にいる恋人には、\n自分ごと隠されたように映りやすいです。"}, {"t": 185.05, "x": "女は人前での小さな扱い方に愛情を見ることが\n多いようです。"}, {"t": 189.61666666666667, "x": "みんなの前で名前を呼んでくれる。"}, {"t": 191.8, "x": "料理を取り分ける時に先に聞いてくれる。"}, {"t": 194.38333333333333, "x": "輪の外にいる時にさりげなく話に入れてくれる。"}, {"t": 197.45, "x": "一つずつはほんの数秒の出来事です。"}, {"t": 200.1, "x": "けれども周りに人がいる場面だからこそ、\n意味が大きくなります。"}, {"t": 204.48333333333332, "x": "二人きりで優しいのは当たり前。"}, {"t": 206.78333333333333, "x": "そう感じる人もいます。"}, {"t": 208.43333333333334, "x": "人の目がある場所でも変わらない。"}, {"t": 210.55, "x": "それが本気の印に見えるのです。"}, {"t": 212.86666666666667, "x": "だから人前で素っ気なくされると、\n心が揺れやすいです。"}, {"t": 216.78333333333333, "x": "恥ずかしいと思われているのかもしれない。"}, {"t": 219.38333333333333, "x": "周りには知られたくないのかもしれな const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
