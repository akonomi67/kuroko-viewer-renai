<script>
const D={"name": "プロポーズのタイミングを男女はこう見ている", "file": "062_プロポーズのタイミングを男女はこう見ている", "dur": 1095.3333125, "segs": [], "subs": [{"t": 0.0, "x": "プロポーズのタイミングは、\n気持ちの強さで決まると思われがちです。"}, {"t": 4.433333333333334, "x": "好きなら早く言う。"}, {"t": 5.783333333333333, "x": "迷っているから遅れる。"}, {"t": 7.366666666666666, "x": "そう見えやすいです。"}, {"t": 8.733333333333333, "x": "けれども実際には、二人が見\nている時計そのものが違うことが多いです。"}, {"t": 13.666666666666666, "x": "男は準備がそろったかどうかで、\nその日を測りやすいです。"}, {"t": 17.733333333333334, "x": "一方で女は、二人で過ごした\n時間の手応えで測りやすいです。"}, {"t": 22.3, "x": "男は指輪と店を決めてから言おうとします。"}, {"t": 25.266666666666666, "x": "女は特別な日よりも、普段の会話の中に答\nえを探すことがあります。"}, {"t": 30.4, "x": "男は言い出す前に、断られない形を整えたがります。"}, {"t": 34.63333333333333, "x": "女は言われる前に、同じ方向を見\nているかを確かめたがります。"}, {"t": 39.18333333333333, "x": "この違いを知らないと、待っ\nている側は放っておかれたように感じます。"}, {"t": 43.93333333333333, "x": "準備している側は、急かされ\nているように感じてしまいます。"}, {"t": 47.916666666666664, "x": "どちらも相手を大事にしているのに、\n少しずつ気持ちが削られていきます。"}, {"t": 52.81666666666667, "x": "今日は、プロポーズの時期を男女が\nどう見ているかを並べていきます。"}, {"t": 57.21666666666667, "x": "先に言っておくと、相手に言わせるための\n方法は一つも出てきません。"}, {"t": 61.93333333333333, "x": "言わせた言葉は、二人の見通しを\n少しも増やさないからです。"}, {"t": 66.08333333333333, "x": "代わりに出てくるのは、同じ時計を見\nるための話し方です。"}, {"t": 70.08333333333333, "x": "まず男の側は、条件がそろうのを\n待ちやすいと言われます。"}, {"t": 74.26666666666667, "x": "仕事が落ち着く。"}, {"t": 75.5, "x": "貯金が目標に届く。"}, {"t": 77.26666666666667, "x": "住む場所の目途が立つ。"}, {"t": 78.88333333333334, "x": "そういう項目が埋まった日を、\n言ってよい日と考えやすいです。"}, {"t": 83.13333333333334, "x": "男にとってプロポーズは、生活を引\nき受ける宣言に近いのかもしれません。"}, {"t": 88.31666666666666, "x": "だから、準備が足りないまま言うのは\n無責任だと感じることがあります。"}, {"t": 93.1, "x": "一方で女は、条件の全部がそろうのを\n待っていない場合があります。"}, {"t": 97.88333333333334, "x": "収入が少し足りない。"}, {"t": 99.58333333333333, "x": "部屋がまだ狭い。"}, {"t": 100.8, "x": "転勤があるかもしれない。"}, {"t": 102.55, "x": "それでも二人でやっていけると思えれば、\nそれで十分なことがあります。"}, {"t": 107.13333333333334, "x": "男が思う十分と女が思う十分は、\n中身が少しずれています。"}, {"t": 112.05, "x": "男が待っているのは、完成した生活の図面です。"}, {"t": 115.71666666666667, "x": "女が待っているのは、一緒に図面を引\nこうという一言かもしれません。"}, {"t": 120.35, "x": "これは、どちらかの覚悟が足\nりないという話ではありません。"}, {"t": 124.25, "x": "同じ責任感を、別の順番で持っているだけなのです。"}, {"t": 128.25, "x": "図面が完成するまで待つと、\nそれだけで何年もかかることがあります。"}, {"t": 132.93333333333334, "x": "順番が違うので、待つ時間の長さも\n別々に感じられます。"}, {"t": 137.35, "x": "女の側は、付き合ってきた時間の積み重ねで\n考えやすいです。"}, {"t": 141.88333333333333, "x": "二度目の冬を越えた。"}, {"t": 143.45, "x": "お互いの家族の話をした。"}, {"t": 145.5, "x": "大きなケンカを一度乗り越えた。"}, {"t": 147.63333333333333, "x": "そういう節目を数えて、そろ\nそろという感覚が育ちます。"}, {"t": 151.71666666666667, "x": "節目を越えるたびに、次の段を思\nい浮かべやすいようです。"}, {"t": 155.76666666666668, "x": "その感覚は、カレンダーの数字よ\nりも手応えに近いようです。"}, {"t": 160.05, "x": "一方で男は、時間の長さをそこまで\n数えていないことがあります。"}, {"t": 164.78333333333333, "x": "先月も今月も同じように楽しい。"}, {"t": 167.4, "x": "だから今のままで困っていない。"}, {"t": 169.5, "x": "続いていること自体を、うま\nくいっている証拠と受け取りやすいです。"}, {"t": 173.81666666666666, "x": "女にとって、続いている時間は次へ進\nむ理由になります。"}, {"t": 178.15, "x": "男にとって、続いている時間は急が\nなくていい理由になります。"}, {"t": 182.63333333333333, "x": "同じ三年を過ごしても、そこから\n出てくる結論が逆になります。"}, {"t": 187.06666666666666, "x": "どちらかが鈍いのではありません。"}, {"t": 189.18333333333334, "x": "同じ時間を、別の物差しで測っているだけなのです。"}, {"t": 193.01666666666668, "x": "物差しが違うことは、周りの\n出来事でさらに目立ちます。"}, {"t": 196.95, "x": "友人の結婚式は、二人の気持ちに\n別々の形で届きます。"}, {"t": 201.55, "x": "招待状が届く。"}, {"t": 203.06666666666666, "x": "ご祝儀袋を買う。"}, {"t": 204.48333333333332, "x": "披露宴の席で指輪を見る。"}, {"t": 206.51666666666668, "x": "女は、その場面を自分たちの\n今と重ねやすいと言われます。"}, {"t": 210.78333333333333, "x": "焦りというより、次は二人の番かも\nしれないという想像です。"}, {"t": 215.18333333333334, "x": "ブーケを受け取った人を見て、\n胸の奥が少しざわつくこともあります。"}, {"t": 219.78333333333333, "x": "帰り道に口数が少し減るのは、\nそのせいのこともあります。"}, {"t": 224.01666666666668, "x": "一方で男は、友人の結婚を友人の出来事と\nして受け取りやすいです。"}, {"t": 229.3, "x": "いい式だった。"}, {"t": 230.31666666666666, "x": "料理がおいしかった。"}, {"t": 231.7, "x": "あいつも落ち着いた。"}, {"t": 233.03333333333333, "x": "自分たちの話に結びつけるまで、\n少し時間がかかる場合があります。"}, {"t": 237.95, "x": "女の側から見ると、同じ式に出ても\n何も感じていないように見えます。"}, {"t": 242.98333333333332, "x": "男の側から見ると、帰り道の沈黙の理由が分か\nりません。"}, {"t": 247.5, "x": "分からないまま聞き流すと、\n話は別の日に重く出てきます。"}, {"t": 251.7, "x": "式の帰り道は、責める場では\nなく感想を話す場にできます。"}, {"t": 256.06666666666666, "x": "それだけで、二人の時計の差が少し見えてきます。"}, {"t": 259.6333333333333, "x": "指輪の選び方にも、男女で見\nている場所の違いが出やすいです。"}, {"t": 264.01666666666665, "x": "男は、指輪をきちんとした物と\nして用意したいと考えやすいです。"}, {"t": 268.76666666666665, "x": "名の通った店で。"}, {"t": 270.0833333333333, "x": "恥ずかしくない値段で。"}, {"t": 271.6666666666667, "x": "一人で選んで。"}, {"t": 272.8, "x": "安い物では気持ちまで軽く見えると、\n心配になることがあるようです。"}, {"t": 277.71666666666664, "x": "その心配が強いほど、貯金が届くまで\n言えなくなります。"}, {"t": 281.85, "x": "一方で女は、値段より選び方の方を覚\nえている場合があります。"}, {"t": 286.68333333333334, "x": "好みを覚えていてくれた。"}, {"t": 288.43333333333334, "x": "一緒に店を回った。"}, {"t": 290.03333333333336, "x": "サイズをこっそり調べてくれた。"}, {"t": 292.05, "x": "そういう過程の方が、あとから\n何度も思い出されやすいです。"}, {"t": 296.03333333333336, "x": "男が値段で誠意を示そうとするほど、\n準備の期間は長くなります。"}, {"t": 301.0, "x": "女が過程を大事にしているほど、\nその長い期間が不思議に見えます。"}, {"t": 305.71666666666664, "x": "もちろん、立派な指輪を喜ぶ人も多いです。"}, {"t": 309.4166666666667, "x": "ただ、指輪の値段と気持ちの重さは、\n同じ物差しではありません。"}, {"t": 314.3833333333333, "x": "相手が何を大事にしたいかを知っていれば、\n準備にかける時間も変わります。"}, {"t": 319.45, "x": "男は言う前に、準備を完成さ\nせたがる傾向があります。"}, {"t": 323.95, "x": "指輪のサイズ。"}, {"t": 325.0833333333333, "x": "予約する店。"}, {"t": 326.23333333333335, "x": "言葉の順番。"}, {"t": 327.4, "x": "どれも決めてからでないと、\n言い出せないと感じやすいようです。"}, {"t": 331.3833333333333, "x": "失敗できない一回だと思うほど、\n準備の項目は増えていきます。"}, {"t": 336.23333333333335, "x": "店の下見に何度も行く。"}, {"t": 337.98333333333335, "x": "言葉を紙に書いて練習する。"}, {"t": 340.06666666666666, "x": "天気予報を何日も前から見る。"}, {"t": 342.43333333333334, "x": "増えた項目が片付くまで、本人の中では\nまだその時ではありません。"}, {"t": 347.21666666666664, "x": "一方で女は、その準備の時間を外から\n見ることができません。"}, {"t": 351.65, "x": "見えないので、何も考えてい\nない時間と区別がつきません。"}, {"t": 355.9166666666667, "x": "男が静かに準備を進めるほど、女は置\nいていかれた気持ちになりやすいです。"}, {"t": 361.26666666666665, "x": "内緒にしたい気持ちは、驚か\nせたいという優しさから来ています。"}, {"t": 365.56666666666666, "x": "ただ、内緒の期間が長いほど\n相手の不安も長くなります。"}, {"t": 369.75, "x": "中身を明かさなくても、考え\nていることだけは伝えられます。"}, {"t": 373.8333333333333, "x": "驚きは減らさずに、待つ時間の重\nさだけを軽くするやり方です。"}, {"t": 378.4, "x": "女が大事にしているのは、特別\nな演出だけではない場合があります。"}, {"t": 383.2, "x": "夜景のレストラン。"}, {"t": 384.46666666666664, "x": "花束。"}, {"t": 385.6, "x": "ひざまずく場面。"}, {"t": 386.81666666666666, "x": "そういう場面に憧れる人も、もちろん多いです。"}, {"t": 390.23333333333335, "x": "ただ、それ以上に見ているのは\n普段の手応えだと言われます。"}, {"t": 394.21666666666664, "x": "来年の夏の話を自然にする。"}, {"t": 396.55, "x": "家具を一緒に選ぶ。"}, {"t": 397.96666666666664, "x": "親の話を隠さない。"}, {"t": 399.65, "x": "そういう小さな場面で、同じ方向を向\nいているかを確かめています。"}, {"t": 404.4166666666667, "x": "花束より、来年の旅行の話の方が胸に残\nることもあります。"}, {"t": 409.21666666666664, "x": "一方で男は、特別な日を作ることで\n気持ちを示そうとしやすいです。"}, {"t": 414.28333333333336, "x": "一回の大きな場面に、全部の気持ちを\n込めようとします。"}, {"t": 418.65, "x": "その準備は、女にとっても確かにうれしいものです。"}, {"t": 422.3333333333333, "x": "けれども、普段の会話で先の話が出ないと、\n特別な日まで不安が続きます。"}, {"t": 428.0833333333333, "x": "女にとって、先の話は答えそのものに\n近いのかもしれません。"}, {"t": 432.68333333333334, "x": "男にとって、先の話は言う日\nまでとっておくものになりがちです。"}, {"t": 437.23333333333335, "x": "とっておいた言葉は、少しず\nつ前払いしてもかまいません。"}, {"t": 441.18333333333334, "x": "合鍵を渡すことや一緒に住む\nことも、見方が分かれやすいです。"}, {"t": 445.51666666666665, "x": "男は、同棲を結婚の前に試す期間と\nして考えやすいです。"}, {"t": 450.21666666666664, "x": "家事の分け方。"}, {"t": 451.3833333333333, "x": "お金の出し方。"}, {"t": 452.6333333333333, "x": "生活のリズム。"}, {"t": 453.9166666666667, "x": "暮らしてみてから決めた方が、\n失敗が少ないという考え方です。"}, {"t": 458.3666666666667, "x": "一方で女は、同棲を結婚への\n途中の駅として考える場合があります。"}, {"t": 463.73333333333335, "x": "一緒に住むなら、その先があ\nるという前提で荷物を運びます。"}, {"t": 468.15, "x": "男にとっては試しの期間でも、\n女にとっては約束の手前です。"}, {"t": 472.8, "x": "この差に気づかないまま暮らすと、\n同じ部屋で別の時計が進みます。"}, {"t": 477.4166666666667, "x": "一年が過ぎた頃、女はそろそろだと感じ始めます。"}, {"t": 481.3, "x": "男は、今のままで十分うまく\nいっていると感じています。"}, {"t": 485.3, "x": "どちらも間違ってはいません。"}, {"t": 487.1666666666667, "x": "ただ、住み始める前に一度だ\nけ確かめておくと、後の迷いが減ります。"}, {"t": 492.43333333333334, "x": "一緒に住む意味を、二人で同\nじ言葉にしておくことです。"}, {"t": 496.31666666666666, "x": "言葉にするのは、荷物を運び込\nむ前の一回で足ります。"}, {"t": 500.35, "x": "親に会わせる時期にも、男女で感覚のずれが\n出やすいです。"}, {"t": 504.4, "x": "女は、親に会ってもらうことを\n一つの段階として見やすいです。"}, {"t": 508.75, "x": "紹介したい。"}, {"t": 509.8333333333333, "x": "紹介されたい。"}, {"t": 511.05, "x": "家族の一員として扱われたい。"}, {"t": 513.4333333333333, "x": "そういう気持ちが、関係の確か\nさと結びつくことがあります。"}, {"t": 517.5666666666667, "x": "一方で男は、親に会うのはプロポーズの\n後だと考える場合があります。"}, {"t": 522.7333333333333, "x": "まだ決まっていないのに会わ\nせると、親に期待させてしまう。"}, {"t": 526.6833333333333, "x": "中途半端な形で会うのは、相手の親にも\n失礼だと感じるようです。"}, {"t": 531.55, "x": "女から見ると、親に会わせてくれないのは\n本気ではない印に見えます。"}, {"t": 536.4333333333333, "x": "男から見ると、順番を守っているだけの誠実さです。"}, {"t": 540.55, "x": "同じ誠実さが、順番の違いで\n反対の意味に映っています。"}, {"t": 545.0, "x": "親に会う話は、決断の話と切\nり分けて話すことができます。"}, {"t": 549.4666666666667, "x": "いつ会うかより先に、会うことを\nどう思うかを聞いておくことです。"}, {"t": 553.6333333333333, "x": "将来の話題が出た時の聞き方も、\n男女で違いやすいです。"}, {"t": 557.8333333333334, "x": "男は、将来の話を具体的な計画と\nして受け取りやすいです。"}, {"t": 562.4, "x": "いつまでに。"}, {"t": 563.2833333333333, "x": "いくら貯めて。"}, {"t": 564.2833333333333, "x": "どこに住んで。"}, {"t": 565.3, "x": "計画が立たないうちは、軽く答\nえられないと感じることがあります。"}, {"t": 569.8333333333334, "x": "一方で女は、将来の話を気持ちの\n温度として聞きやすいです。"}, {"t": 574.4666666666667, "x": "答えの中身より、話に乗って\nくれるかどうかを見ています。"}, {"t": 578.4666666666667, "x": "いつか犬を飼いたいねと言った時、\n欲しいのは計画ではありません。"}, {"t": 582.8666666666667, "x": "一緒に想像してくれる返事の方です。"}, {"t": 585.4833333333333, "x": "犬の名前を一緒に考えるだけで、\n十分な返事になることがあります。"}, {"t": 590.5166666666667, "x": "男がまだ分からないと返すと、\n誠実な答えのつもりでも拒否に聞こえます。"}, {"t": 595.8166666666667, "x": "女が話を広げると、男は答えを\n迫られているように感じます。"}, {"t": 600.65, "x": "本当は、どちらも同じ未来の話をしたいだけです。"}, {"t": 604.3333333333334, "x": "計画と温度は、片方ずつ順番に出せば\n両方そろいます。"}, {"t": 608.6833333333333, "x": "まず温度で乗って、計画は後から足せばいいのです。"}, {"t": 612.35, "x": "待っている側が黙る時、そこには\n怒りより迷いがあることが多いです。"}, {"t": 617.15, "x": "聞いたら重いと思われる。"}, {"t": 618.85, "x": "急かしたら嫌われる。"}, {"t": 620.2333333333333, "x": "でも待つのも苦しい。"}, {"t": 621.6833333333333, "x": "その三つの間で、言葉が出なくなります。"}, {"t": 624.7166666666667, "x": "女の側が待つ立場になることが\n多いと言われますが、逆もあります。"}, {"t": 629.4, "x": "男の側が待っている時も、同\nじように言葉を飲み込みがちです。"}, {"t": 633.8666666666667, "x": "一方で、待たせている側はその\n沈黙に気づきにくいです。"}, {"t": 638.0166666666667, "x": "機嫌が悪い。"}, {"t": 639.1166666666667, "x": "疲れている。"}, {"t": 640.0333333333333, "x": "最近そっけない。"}, {"t": 641.3333333333334, "x": "そう受け取って、プロポーズの\n話と結びつけないことがあります。"}, {"t": 645.7333333333333, "x": "沈黙の理由が分からないまま、\n別のことで小さく揉めてしまいます。"}, {"t": 650.3333333333334, "x": "洗い物の順番。"}, {"t": 651.7, "x": "休日の予定。"}, {"t": 653.0333333333333, "x": "帰りの時間。"}, {"t": 654.15, "x": "揉めている中身は、本当の話題とは\n関係がありません。"}, {"t": 658.1166666666667, "x": "関係が無いので、いくら話し合っても片付きません。"}, {"t": 661.8333333333334, "x": "これは相性が悪いのではありません。"}, {"t": 664.3, "x": "言いにくいことが、言いやす\nい別の話題に形を変えているだけなのです。"}, {"t": 668.9666666666667, "x": "プロポーズの時期をめぐって、\n二つの痛みが生まれやすいです。"}, {"t": 673.1166666666667, "x": "一つは、急かされていると感じる痛みです。"}, {"t": 676.1666666666666, "x": "もう一つは、置いていかれていると感じる痛みです。"}, {"t": 679.5666666666667, "x": "男は、話を振られるたびに期限を切\nられたように感じやすいです。"}, {"t": 684.1833333333333, "x": "自分のペースで決めたいのに、\n外から押されている感覚です。"}, {"t": 688.2833333333333, "x": "一方で女は、話を流されるたびに一人で待\nたされているように感じやすいです。"}, {"t": 693.8666666666667, "x": "自分だけが先を見ていて、相手は立\nち止まっている感覚です。"}, {"t": 698.0166666666667, "x": "片方が一歩引くと、もう片方はさらに不安になります。"}, {"t": 702.0166666666667, "x": "不安になって話を振ると、また片方が一歩引きます。"}, {"t": 706.0166666666667, "x": "引いた側も、相手を嫌いにな\nったわけではありません。"}, {"t": 709.6166666666667, "x": "こうして同じ場所で、押すと引くが繰り返されます。"}, {"t": 713.0666666666667, "x": "悪いのは、どちらかの性格ではありません。"}, {"t": 716.0666666666667, "x": "二人とも相手に合わせようと\nして、かえって距離が開いているだけです。"}, {"t": 720.6333333333333, "x": "押し引きを止めるには、日付よ\nり先に気持ちを出し合うことです。"}, {"t": 724.8833333333333, "x": "どちらが先に折れるかではなく、\n今どう感じているかを並べるだけです。"}, {"t": 729.55, "x": "言い出す立場の人は、断られる怖さを\n抱えていることがあります。"}, {"t": 734.0, "x": "男は特に、その怖さを口に出\nさずに抱え込みやすいです。"}, {"t": 738.3333333333334, "x": "今言って断られたら、関係まで\n終わってしまうかもしれない。"}, {"t": 742.35, "x": "そう考えるほど、確実に受け\nてもらえる日を探し始めます。"}, {"t": 746.7, "x": "確実な日を探すほど、準備も条件も増えていきます。"}, {"t": 750.9, "x": "怖さは、準備の量で消そうと\nするほど大きくなることがあります。"}, {"t": 755.2333333333333, "x": "一方で女は、断る気持ちなど\nまったく無い場合も多いです。"}, {"t": 759.5833333333334, "x": "むしろ、いつ言ってくれても\nいいと思って待っています。"}, {"t": 762.95, "x": "その気持ちが伝わっていないと、\n男の中の怖さは消えません。"}, {"t": 767.3166666666667, "x": "女は、待っていることを直接言うのは\n催促になると考えがちです。"}, {"t": 772.0833333333334, "x": "男は、確かめることを格好悪いと考えがちです。"}, {"t": 775.8833333333333, "x": "お互いが遠慮して、確かめる\n言葉が一つも行き来しません。"}, {"t": 779.9, "x": "怖さを消すのは、答えを先に教\nえることではありません。"}, {"t": 783.8166666666667, "x": "一緒にいる先を楽しみにしていると、\n普段から伝えておくことです。"}, {"t": 788.55, "x": "ここからは、見通しが持てるようになる話です。"}, {"t": 791.9, "x": "プロポーズには、二つのものが一度に詰まっています。"}, {"t": 795.5166666666667, "x": "一緒になるかどうかの答え。"}, {"t": 797.4166666666666, "x": "そして、それを言葉にする場面です。"}, {"t": 800.0, "x": "二つが一度に来ると思うと、\nどちらの側も苦しくなりやすいです。"}, {"t": 804.5, "x": "言う側は、答えと演出の両方を一回で成功\nさせようとします。"}, {"t": 809.2666666666667, "x": "待つ側は、答えが分からない\nまま演出の日を待つことになります。"}, {"t": 813.7166666666667, "x": "けれども実際には、答えは先に二人で分か\nっていることも多いです。"}, {"t": 818.3666666666667, "x": "いつか一緒になるつもりだと、\n普段の会話で確かめ合っている。"}, {"t": 822.6333333333333, "x": "そのうえで、改めて言葉にする日が後から\n来る形です。"}, {"t": 826.6666666666666, "x": "男にとっては、断られる怖さが\n消えたまま準備ができます。"}, {"t": 830.9333333333333, "x": "女にとっては、答えを知ったうえで\n待てるので時間が軽くなります。"}, {"t": 835.3333333333334, "x": "答えを先に知っても、言われ\nた日のうれしさは減りません。"}, {"t": 839.1333333333333, "x": "むしろ、驚きより安心の方で胸が\nいっぱいになることがあります。"}, {"t": 843.6, "x": "見通しは、プロポーズの言葉よ\nり先に二人で持つことができます。"}, {"t": 848.1, "x": "結婚したらどの辺りに住みたいか。"}, {"t": 850.4833333333333, "x": "仕事はどうしたいか。"}, {"t": 851.95, "x": "式を挙げたいか。"}, {"t": 853.2, "x": "家族にどう伝えたいか。"}, {"t": 854.9333333333333, "x": "こうした話は、プロポーズの\n答えを決めるものではありません。"}, {"t": 859.1333333333333, "x": "二人が同じ地図を持っているかを、\n確かめるための話です。"}, {"t": 863.2333333333333, "x": "男は、地図が見えると準備の順番を決\nめやすくなります。"}, {"t": 867.3, "x": "何から片付ければいいかが分か\nり、動きやすくなるようです。"}, {"t": 871.35, "x": "一方で女は、地図が見えると\n待つ時間の意味が変わりやすいです。"}, {"t": 875.8666666666667, "x": "何も起きない日々が、準備が進\nんでいる日々に見えてきます。"}, {"t": 879.9333333333333, "x": "話し方も、決める会議ではなく雑談の形で十分です。"}, {"t": 884.1, "x": "テレビに知らない街が映った時に、\n住むならどこか話す程度です。"}, {"t": 888.6666666666666, "x": "この話を先にしても、プロポーズの\n価値は下がりません。"}, {"t": 892.6, "x": "むしろ、 ングは\n気持ちの強さだけでは決まりません。"}, {"t": 1023.4, "x": "男は、条件と準備がそろった日を見やすいです。"}, {"t": 1026.9333333333334, "x": "女は、二人で過ごした時間の手応えを見やすいです。"}, {"t": 1030.6666666666667, "x": "見ている時計が違うだけで、\n相手を大事にしたい気持ちは同じです。"}, {"t": 1035.25, "x": "この違いを知らないままでいると、\nまず小さな沈黙が増えます。"}, {"t": 1039.7166666666667, "x": "次に、関係のない話題で揉めるようになります。"}, {"t": 1043.25, "x": "やがて、先の話をすること自体を避\nけるようになります。"}, {"t": 1047.1666666666667, "x": "そこまで行くと、プロポーズの\n日が来ても素直に喜びにくくなります。"}, {"t": 1051.8666666666666, "x": "逆に、違いを知っていれば待\nつ時間の意味が変わります。"}, {"t": 1055.7666666666667, "x": "答えと言葉にする日を分けて考える。"}, {"t": 1058.35, "x": "計画より先に温度で乗る。"}, {"t": 1060.4, "x": "横に並ぶ場所で、二人の先を軽く話す。"}, {"t": 1063.7833333333333, "x": "どれも、相手に言わせるための工夫ではありません。"}, {"t": 1067.1833333333334, "x": "同じ時計を見るための、ささやかな支度です。"}, {"t": 1070.45, "x": "支度が整っていれば、どんな\n日に言われても特別な日になります。"}, {"t": 1074.75, "x": "最後に一つだけ考えてみてください。"}, {"t": 1077.3, "x": "最近、二人で来年の話をしたのは\nいつだったでしょうか。"}, {"t": 1081.6, "x": "その話ができているなら、タイミングはも\nう近づいているのかもしれません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
