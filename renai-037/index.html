 "i": 244}, {"t": 731.5666666666667, "i": 245}, {"t": 734.6666666666666, "i": 246}, {"t": 737.5833333333334, "i": 247}, {"t": 741.0, "i": 248}, {"t": 744.3, "i": 249}, {"t": 747.8666666666667, "i": 250}, {"t": 751.3333333333334, "i": 251}, {"t": 754.8666666666667, "i": 252}, {"t": 758.85, "i": 253}, {"t": 762.1833333333333, "i": 254}, {"t": 764.1833333333333, "i": 255}, {"t": 766.7333333333333, "i": 256}, {"t": 769.7166666666667, "i": 257}, {"t": 773.4333333333333, "i": 258}, {"t": 776.1833333333333, "i": 259}, {"t": 779.1833333333333, "i": 260}, {"t": 782.1, "i": 261}, {"t": 785.3666666666667, "i": 262}, {"t": 793.35, "i": 262}], "subs": [{"t": 0.0, "x": "好きだけれど、尊敬はしていない。"}, {"t": 2.5166666666666666, "x": "そういう関係は、珍しくありません。"}, {"t": 5.366666666666666, "x": "付き合っているうちは、あまり問題になりません。"}, {"t": 8.566666666666666, "x": "会う時間が短く、決めることも少ないからです。"}, {"t": 11.983333333333333, "x": "けれども、生活が始まると景色が変わります。"}, {"t": 15.4, "x": "毎日、細かい判断が積み上がります。"}, {"t": 18.366666666666667, "x": "お金の使い方、人との付き合い方、\n困った時の動き方。"}, {"t": 22.916666666666668, "x": "その全部で、相手の考え方が見えます。"}, {"t": 26.1, "x": "見えた時に、こちらが納得できるかどうか。"}, {"t": 29.183333333333334, "x": "納得できない回数が増えると、きつくなります。"}, {"t": 32.6, "x": "きつさは、大きな事件では来ません。"}, {"t": 35.18333333333333, "x": "小さい違和感が、何百回も続く形で来ます。"}, {"t": 38.88333333333333, "x": "だから、原因が説明しにくいです。"}, {"t": 41.68333333333333, "x": "説明できないので、周りにも相談できません。"}, {"t": 45.13333333333333, "x": "相談できないまま、静かに疲れていきます。"}, {"t": 48.28333333333333, "x": "男は相手の努力する姿を、見ていることが多いです。"}, {"t": 52.166666666666664, "x": "女は相手の判断のしかたを、\n見ていることが多いです。"}, {"t": 56.016666666666666, "x": "どちらも、尊敬の材料になります。"}, {"t": 58.7, "x": "今日は、この材料が何でできているかを\n見ていきます。"}, {"t": 62.3, "x": "先に言うと、能力の高さの話ではありません。"}, {"t": 65.9, "x": "まず、言葉の中身を決めます。"}, {"t": 68.23333333333333, "x": "尊敬というと、収入や学歴を思い浮かべやすいです。"}, {"t": 72.43333333333334, "x": "けれども、生活で効くのはそこではありません。"}, {"t": 75.65, "x": "効くのは、困った時の動き方です。"}, {"t": 78.3, "x": "うまくいかない時に、どうするか。"}, {"t": 80.65, "x": "自分の失敗を、どう扱うか。"}, {"t": 83.13333333333334, "x": "人のせいにするか、次の手を出すか。"}, {"t": 85.93333333333334, "x": "ここが、いちばん見られています。"}, {"t": 88.13333333333334, "x": "男は結果の大きさを、\n評価されたいと思いやすいです。"}, {"t": 92.08333333333333, "x": "女は途中の姿勢を、見ていることが多いです。"}, {"t": 95.5, "x": "だから、収入が高くても\n尊敬されないことがあります。"}, {"t": 99.43333333333334, "x": "逆に、平均的でも尊敬される人がいます。"}, {"t": 102.96666666666667, "x": "差は、態度の一貫性です。"}, {"t": 105.11666666666666, "x": "一貫している人は、何年たっても同じです。"}, {"t": 108.36666666666666, "x": "同じだと分かる相手は、安心して任せられます。"}, {"t": 111.81666666666666, "x": "任せられる相手とは、暮らせます。"}, {"t": 114.25, "x": "暮らせるかどうかが、結局のところ全部です。"}, {"t": 117.36666666666666, "x": "次に、二つを分けます。"}, {"t": 119.45, "x": "好きは、一緒にいて楽しいかどうかです。"}, {"t": 122.25, "x": "尊敬は、任せられるかどうかです。"}, {"t": 124.85, "x": "場所が違うので、片方だけでも成立します。"}, {"t": 128.26666666666668, "x": "好きだけれど、任せられない相手はいます。"}, {"t": 131.21666666666667, "x": "その場合、こちらが全部を持つことになります。"}, {"t": 134.38333333333333, "x": "持てているうちは、問題になりません。"}, {"t": 137.03333333333333, "x": "持てなくなった時に、はじめて出ます。"}, {"t": 139.68333333333334, "x": "体調を崩した時、仕事が忙しい時。"}, {"t": 143.05, "x": "そういう時に、相手が動けるかどうか。"}, {"t": 145.93333333333334, "x": "男は動けることを、示す機会が少ないと\n感じやすいです。"}, {"t": 150.18333333333334, "x": "女は日常の場面で、すでに見ていることが多いです。"}, {"t": 154.18333333333334, "x": "だから、評価の時期がずれます。"}, {"t": 156.5, "x": "ずれても、結論は同じです。"}, {"t": 158.76666666666668, "x": "一度でも任せられた相手は、信用が残ります。"}, {"t": 162.28333333333333, "x": "一度も任せられない相手は、こちらが疲れます。"}, {"t": 165.63333333333333, "x": "疲れは、好きとは関係なく蓄積します。"}, {"t": 168.76666666666668, "x": "なぜ最初は平気なのか、も説明します。"}, {"t": 171.9, "x": "付き合っている間は、決める場面が少ないです。"}, {"t": 175.16666666666666, "x": "どこで食べるか、いつ会うか。"}, {"t": 177.31666666666666, "x": "どれも、失敗しても取り返せます。"}, {"t": 179.91666666666666, "x": "取り返せる決定では、能力の差が出ません。"}, {"t": 183.13333333333333, "x": "差が出ないので、気になりません。"}, {"t": 185.4, "x": "さらに、会っている時間は良い面が出ます。"}, {"t": 188.4, "x": "準備して会うので、雑な部分が見えません。"}, {"t": 191.61666666666667, "x": "見えないまま、判断してしまいます。"}, {"t": 194.16666666666666, "x": "男は相手の生活面を、見ないまま進みやすいです。"}, {"t": 198.18333333333334, "x": "女は生活の話題を、早い時期に出しやすいです。"}, {"t": 201.91666666666666, "x": "だから、出された話題は逃さない方が得です。"}, {"t": 205.26666666666668, "x": "お金の話、家族の話、仕事の話。"}, {"t": 209.01666666666668, "x": "どれも、後で効いてくる材料です。"}, {"t": 211.45, "x": "材料が集まる前に決めると、後で驚きます。"}, {"t": 214.98333333333332, "x": "驚いても、生活はもう始まっています。"}, {"t": 218.13333333333333, "x": "始まってからの修正は、時間がかかります。"}, {"t": 221.31666666666666, "x": "生活が始まった後の話をします。"}, {"t": 224.03333333333333, "x": "一緒に暮らすと、決めることが一気に増えます。"}, {"t": 227.18333333333334, "x": "家賃や保険、家電の買い替え。"}, {"t": 229.68333333333334, "x": "親戚付き合いもあります。"}, {"t": 231.48333333333332, "x": "どれも、失敗すると戻しにくいです。"}, {"t": 234.16666666666666, "x": "戻しにくい判断が、毎月来ます。"}, {"t": 236.88333333333333, "x": "その時に、相手の考え方が全部見えます。"}, {"t": 240.25, "x": "調べてから決める人か、勢いで決める人か。"}, {"t": 243.51666666666668, "x": "迷った時に、こちらに相談するかどうか。"}, {"t": 246.58333333333334, "x": "男は決めた後に、報告する形を選びやすいです。"}, {"t": 250.38333333333333, "x": "女は決める前に、共有する形を望みやすいです。"}, {"t": 254.4, "x": "どちらが正しい、という話ではありません。"}, {"t": 257.5, "x": "問題は、判断の質の方です。"}, {"t": 260.03333333333336, "x": "質が低い判断が続くと、こちらが確認役になります。"}, {"t": 264.18333333333334, "x": "確認役に回ると、対等ではなくなります。"}, {"t": 267.56666666666666, "x": "対等でない関係は、疲れます。"}, {"t": 270.1333333333333, "x": "疲れが、尊敬できないという言葉になって出ます。"}, {"t": 273.53333333333336, "x": "出た時には、もう長く続いています。"}, {"t": 276.28333333333336, "x": "いちばんきついのは、この形です。"}, {"t": 278.75, "x": "大事な話を、相談できない相手がいます。"}, {"t": 281.96666666666664, "x": "話しても、まともに考えてくれない。"}, {"t": 284.65, "x": "面倒がられて、話が終わる。"}, {"t": 286.95, "x": "そうなると、こちらが一人で決めます。"}, {"t": 289.5833333333333, "x": "一人で決めた分は、責任も一人で持ちます。"}, {"t": 292.8666666666667, "x": "持ち続けると、相手は同居人になります。"}, {"t": 296.01666666666665, "x": "同居人になった関係は、乾いていきます。"}, {"t": 299.23333333333335, "x": "男は相談を、頼られている合図として受け取ります。"}, {"t": 302.98333333333335, "x": "女は相談を、二人で決める作業として使います。"}, {"t": 306.78333333333336, "x": "どちらも、対等な形を求めています。"}, {"t": 309.7, "x": "求めているのに、片方が降りると崩れます。"}, {"t": 312.8833333333333, "x": "降りる理由は、能力ではないこともあります。"}, {"t": 315.95, "x": "自信がなくて、避けている場合もあります。"}, {"t": 318.9, "x": "避けているだけなら、変えられる余地があります。"}, {"t": 321.96666666666664, "x": "余地があるかどうかは、一度頼めば分かります。"}, {"t": 325.1166666666667, "x": "頼んで、動くかどうかだけ見ます。"}, {"t": 327.68333333333334, "x": "逆の方向も、見ておきます。"}, {"t": 330.01666666666665, "x": "尊敬できない気持ちは、隠していても出ます。"}, {"t": 333.1666666666667, "x": "出る場所は、言葉ではありません。"}, {"t": 335.5, "x": "返事の速さや、目線の動きです。"}, {"t": 338.21666666666664, "x": "説明を途中で切る。"}, {"t": 339.8, "x": "ため息が混じる。"}, {"t": 341.1166666666667, "x": "どれも、小さい動きです。"}, {"t": 343.15, "x": "小さいので、指摘もされません。"}, {"t": 345.6, "x": "けれども、受けた側は必ず覚えています。"}, {"t": 348.75, "x": "覚えた分だけ、話さなくなります。"}, {"t": 351.35, "x": "男は見下されたと感じると、話題を減らします。"}, {"t": 354.98333333333335, "x": "女は見下されたと感じると、期待を減らします。"}, {"t": 358.56666666666666, "x": "どちらも、静かな引き算です。"}, {"t": 360.8666666666667, "x": "引き算が続くと、会話が用件だけになります。"}, {"t": 364.28333333333336, "x": "用件だけの家は、静かで平和に見えます。"}, {"t": 367.53333333333336, "x": "見えるだけで、中身は空です。"}, {"t": 369.8666666666667, "x": "空になってから気づいても、戻せません。"}, {"t": 372.6333333333333, "x": "だから、態度の端を先に直します。"}, {"t": 375.3666666666667, "x": "外からの目も、材料になります。"}, {"t": 377.9, "x": "友人や家族に、紹介できるかどうか。"}, {"t": 380.9, "x": "紹介したくない気持ちがあるなら、理由を見ます。"}, {"t": 384.35, "x": "恥ずかしいと感じているなら、\nそれは尊敬の問題です。"}, {"t": 388.23333333333335, "x": "まだ早いと思っているだけなら、時期の問題です。"}, {"t": 391.65, "x": "二つは、似ていますが違います。"}, {"t": 394.03333333333336, "x": "時期の問題なら、時間で解決します。"}, {"t": 396.98333333333335, "x": "尊敬の問題は、時間では解決しません。"}, {"t": 400.3, "x": "男は相手を、身内に見せる時期を迷いやすいです。"}, {"t": 403.98333333333335, "x": "女は紹介されない事実を、\n扱いとして受け取りやすいです。"}, {"t": 408.31666666666666, "x": "だから、遅れると別の誤解が生まれます。"}, {"t": 411.2, "x": "誤解を避けるためにも、自分の理由を確かめます。"}, {"t": 414.8333333333333, "x": "確かめた結果が、恥ずかしさなら要注意です。"}, {"t": 418.1166666666667, "x": "その気持ちは、後から強くなります。"}, {"t": 420.71666666666664, "x": "強くなると、外出のたびに疲れます。"}, {"t": 423.6666666666667, "x": "疲れる相手とは、長く暮らせません。"}, {"t": 426.31666666666666, "x": "具体的な型も、一つ挙げます。"}, {"t": 428.78333333333336, "x": "失敗した時に、言い訳から入る人がいます。"}, {"t": 432.23333333333335, "x": "本人は、責められる前に守っているだけです。"}, {"t": 435.51666666666665, "x": "けれども、聞く側には別の意味で届きます。"}, {"t": 438.5833333333333, const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
