<script>
const D={"name": "譲るではない_相手の見方を検討のテーブルに乗せられるか", "file": "103_譲るではない_相手の見方を検討のテーブルに乗せられるか", "dur": 831.36665625, "segs": [], "subs": [{"t": 0.0, "x": "妥協とは、どちらかが折れることだと\n思っていないでしょうか。"}, {"t": 3.8333333333333335, "x": "言い合いの最後に、片方が黙って引き下がる。"}, {"t": 7.15, "x": "もう片方の言い分がそのまま通る。"}, {"t": 9.616666666666667, "x": "それが妥協の形だと感じている人も多いでしょう。"}, {"t": 12.933333333333334, "x": "でも研究所のサイトの記事は、\n違う書き方をしています。"}, {"t": 16.9, "x": "アメリカのゴットマン研究所の記事です。"}, {"t": 19.516666666666666, "x": "妥協は片方が変わることではない、というのです。"}, {"t": 22.983333333333334, "x": "では妥協とは、どういうことなのでしょう。"}, {"t": 25.683333333333334, "x": "記事の答えは、相手の影響を受け入れることでした。"}, {"t": 29.283333333333335, "x": "別の記事は、それを決めごとの\n場面で説明しています。"}, {"t": 33.13333333333333, "x": "物事を決める時に相手のことを考えに入れる。"}, {"t": 36.4, "x": "そういうことだというのです。"}, {"t": 38.15, "x": "言いかえると、相手の見方を\n検討のテーブルに乗せることです。"}, {"t": 42.4, "x": "相手に従うこととは少し違います。"}, {"t": 44.96666666666667, "x": "今日はこの1点だけを見ていきます。"}, {"t": 47.31666666666667, "x": "受け入れれば必ずうまくいく、という\n話ではありません。"}, {"t": 51.13333333333333, "x": "自分の家の決めごとを思い浮かべながら\n聞いてみてください。"}, {"t": 54.86666666666667, "x": "まずは記事の言葉を順に見ていきます。"}, {"t": 57.4, "x": "書いたのはカイル・ベンソンという筆者です。"}, {"t": 59.983333333333334, "x": "けんかを上手にするための、\n5つの段階を紹介する記事です。"}, {"t": 64.46666666666667, "x": "その4つ目が妥協でした。"}, {"t": 66.26666666666667, "x": "記事はまず、妥協は夫婦の問題を\n解く唯一の道だと書いています。"}, {"t": 71.21666666666667, "x": "かなり強い言い切りです。"}, {"t": 72.88333333333334, "x": "そのうえで、妥協は\n片方が変わることではないと続けます。"}, {"t": 77.01666666666667, "x": "妥協とは話し合いを重ねることだというのです。"}, {"t": 80.1, "x": "そして互いに合わせる道を、\n一緒に見つけていくことです。"}, {"t": 84.08333333333333, "x": "ここで大事なのは互いにという言葉です。"}, {"t": 86.76666666666667, "x": "片方だけが合わせ続けるなら、\nそれは妥協ではありません。"}, {"t": 90.75, "x": "ただ片方が我慢しているだけです。"}, {"t": 93.05, "x": "我慢は一度なら波風を立てずにすみます。"}, {"t": 95.9, "x": "でも続けば、我慢した人の中に不満がたまります。"}, {"t": 99.56666666666666, "x": "記事が言う妥協は、どちらかの\n負けで終わる話ではありません。"}, {"t": 103.66666666666667, "x": "2人で道を探す作業そのものなのです。"}, {"t": 106.48333333333333, "x": "ではその作業には、どんな準備が要るのでしょうか。"}, {"t": 109.85, "x": "記事はその前に一つの条件を置いています。"}, {"t": 112.83333333333333, "x": "記事が置いた条件は、相手の\n欠点を受け入れることです。"}, {"t": 116.76666666666667, "x": "欠点を受け入れなければ、妥協はできないと\n書いています。"}, {"t": 120.61666666666666, "x": "記事はある心の癖を例に挙げています。"}, {"t": 123.36666666666666, "x": "もしも相手がこうだったら、という思いです。"}, {"t": 126.26666666666667, "x": "もっとお金を稼いでくれたら。"}, {"t": 128.23333333333332, "x": "もっと魅力的だったら。"}, {"t": 129.78333333333333, "x": "もっと気持ちを口に出してくれたら。"}, {"t": 131.95, "x": "こうした思いが結婚を重くすることがあるといいます。"}, {"t": 135.33333333333334, "x": "記事は相手を大切に思う気持ちと比べています。"}, {"t": 138.7, "x": "大切に思う気持ちは、今あるものへの\n感謝を育てます。"}, {"t": 142.76666666666668, "x": "もしもの思いは相手への恨みを育てるというのです。"}, {"t": 146.11666666666667, "x": "恨みがあると、話し合いはどうなるでしょうか。"}, {"t": 149.28333333333333, "x": "相手の言うことをまっすぐ聞けなくなります。"}, {"t": 151.88333333333333, "x": "どんな提案も、欠点の証拠のように\n聞こえてしまいます。"}, {"t": 155.9, "x": "記事は、これでは衝突を解決できないと\n書いています。"}, {"t": 159.61666666666667, "x": "妥協の話なのに欠点の話から入るのはこのためです。"}, {"t": 163.48333333333332, "x": "相手を作りかえようとしたままでは、\nテーブルにつけません。"}, {"t": 167.4, "x": "今の相手を前提にして、初めて話し合いが\n始まるのです。"}, {"t": 171.61666666666667, "x": "ここからが今日の中心です。"}, {"t": 173.58333333333334, "x": "記事は妥協をこう言いかえます。"}, {"t": 175.7, "x": "相手の影響を受け入れることだというのです。"}, {"t": 178.51666666666668, "x": "研究所では影響の受け入れと呼ばれる考え方です。"}, {"t": 182.26666666666668, "x": "影響と聞くと流される感じがするかもしれません。"}, {"t": 185.5, "x": "でも研究所の別の記事は、もっと具体的に\n説明しています。"}, {"t": 189.86666666666667, "x": "決めごとをする時に、相手を\n考えに入れることだというのです。"}, {"t": 194.03333333333333, "x": "たとえば休日の過ごし方を決める時。"}, {"t": 196.81666666666666, "x": "家計の使い道を決める時。"}, {"t": 199.01666666666668, "x": "自分の考えだけで結論を出してしまわない。"}, {"t": 202.01666666666668, "x": "相手はどう思うかを、検討の材料に入れる。"}, {"t": 205.26666666666668, "x": "これが影響を受け入れるということです。"}, {"t": 207.78333333333333, "x": "テーブルにたとえると分かりやすいかもしれません。"}, {"t": 210.73333333333332, "x": "自分の案だけを広げて、さあ決めようと言う。"}, {"t": 214.01666666666668, "x": "これでは相手の案は、最初から\n床に置かれたままです。"}, {"t": 217.85, "x": "影響を受け入れるとは、相手の\n案もテーブルに乗せることです。"}, {"t": 222.0, "x": "乗せたうえで2人で見比べるのです。"}, {"t": 224.36666666666667, "x": "最後にどちらの案になるかは、まだ決まっていません。"}, {"t": 227.81666666666666, "x": "決まっているのは一つだけ。"}, {"t": 229.58333333333334, "x": "両方が検討されたということです。"}, {"t": 232.01666666666668, "x": "妥協の入り口はここにあるのです。"}, {"t": 234.33333333333334, "x": "ここで一つ注意があります。"}, {"t": 236.21666666666667, "x": "誤解されやすい点です。"}, {"t": 237.91666666666666, "x": "影響を受け入れるとは、相手に\n賛成することではありません。"}, {"t": 242.05, "x": "別の記事ははっきり書いています。"}, {"t": 244.21666666666667, "x": "相手の言うことすべてに、賛成する\n必要はないというのです。"}, {"t": 248.5, "x": "言いなりになることでもありません。"}, {"t": 250.51666666666668, "x": "記事は、影響の受け入れは互いにするものだと\n書いています。"}, {"t": 254.61666666666667, "x": "2人ともが大切にされ、聞いてもらえたと感じること。"}, {"t": 258.46666666666664, "x": "それが目指す形です。"}, {"t": 260.0833333333333, "x": "自分の必要を犠牲にすることでもないといいます。"}, {"t": 263.35, "x": "両方の見方のための場所を作ることだと言っています。"}, {"t": 266.8, "x": "ここがテーブルのたとえの大事な所です。"}, {"t": 269.46666666666664, "x": "相手の案を乗せても、自分の\n案を下ろすわけではありません。"}, {"t": 273.48333333333335, "x": "2つの案が同じテーブルに並ぶのです。"}, {"t": 276.15, "x": "並べてみると、別の道が見えることもあります。"}, {"t": 279.68333333333334, "x": "一方を選ぶだけではない道です。"}, {"t": 282.05, "x": "2つを少しずつ合わせる道です。"}, {"t": 284.4, "x": "順番に試してみる道です。"}, {"t": 286.3833333333333, "x": "最初の記事が書いた互いに合わせる\n道とは、こういうものでしょう。"}, {"t": 290.6666666666667, "x": "譲ることと乗せることは、似ているようで違うのです。"}, {"t": 294.06666666666666, "x": "では相手に合わせてうなずくのはどうでしょう。"}, {"t": 296.8, "x": "それで受け入れたことになるのでしょうか。"}, {"t": 299.1333333333333, "x": "別の記事は、そうではないと書いています。"}, {"t": 301.96666666666664, "x": "無理にうなずくのは受け入れではないというのです。"}, {"t": 304.8333333333333, "x": "記事はそれを、避けているだけだと書いています。"}, {"t": 307.93333333333334, "x": "話し合いを\n避けるために、とりあえず同意しているのです。"}, {"t": 311.6666666666667, "x": "こうした同意は受け身のものです。"}, {"t": 313.76666666666665, "x": "時間がたつと恨みを生むことがあるといいます。"}, {"t": 316.65, "x": "これは2章のもしもの思いとつながります。"}, {"t": 319.35, "x": "言えなかった本音は消えずに残りやすいものです。"}, {"t": 322.45, "x": "次の話し合いで別の形で出てくることもあります。"}, {"t": 325.8333333333333, "x": "だからしぶしぶの同意は、見た目ほど\n平和ではありません。"}, {"t": 329.6333333333333, "x": "本当に受け入れるとは、相手の\n案を一度きちんと検討することです。"}, {"t": 334.26666666666665, "x": "検討したうえで、自分の考えも伝えることです。"}, {"t": 338.0, "x": "そうすれば相手の案もこちらの\n案も、テーブルに残ります。"}, {"t": 341.98333333333335, "x": "黙って引けば、こちらの案は消えてしまいます。"}, {"t": 345.1666666666667, "x": "それでは2人で決めたことにはなりません。"}, {"t": 347.75, "x": "妥協は、どちらかが黙る話し合いではないのです。"}, {"t": 351.23333333333335, "x": "2人の考えが、最後まで並んでいる\n話し合いなのです。"}, {"t": 355.21666666666664, "x": "記事にはある2人の会話の例が出てきます。"}, {"t": 358.0833333333333, "x": "片方が家のローンを借り換えようと持ちかけます。"}, {"t": 361.23333333333335, "x": "借り換えれば、月に400ドルも浮くというのです。"}, {"t": 364.6333333333333, "x": "最初の例では、もう片方がすぐにこの話を退けます。"}, {"t": 368.8333333333333, "x": "話はそこで終わってしまいます。"}, {"t": 370.96666666666664, "x": "持ちかけた人の案は、テーブルに\n乗りもしませんでした。"}, {"t": 374.6333333333333, "x": "記事は同じ場面の別の例も挙げています。"}, {"t": 377.53333333333336, "x": "2つ目の例では、もう片方が\n相手の見方をまず認めます。"}, {"t": 381.73333333333335, "x": "そのうえで2人は、小さな次の一歩を決めます。"}, {"t": 385.15, "x": "借り換えをその場で決めたわけではありません。"}, {"t": 387.8833333333333, "x": "まず小さく動いてみる、という所までです。"}, {"t": 391.1, "x": "2つの例の違いは、結論の中身ではありません。"}, {"t": 394.7, "x": "相手の案が検討されたかどうかです。"}, {"t": 397.26666666666665, "x": "退けられた人は、自分まで退けられたと\n感じやすくなります。"}, {"t": 401.76666666666665, "x": "検討された人は、反対されても\n話を続けやすくなります。"}, {"t": 406.1166666666667, "x": "記事は信頼についても書いています。"}, {"t": 408.56666666666666, "x": "削るのは日々の小さな退けの\n積み重ねだというのです。"}, {"t": 412.3333333333333, "x": "テーブルに乗せるかどうか。"}, {"t": 414.05, "x": "それは毎日の小さな場面で決まっているのです。"}, {"t": 417.25, "x": "最初の記事には、気になる1文がもう一つあります。"}, {"t": 420.93333333333334, "x": "研究では、男性のほうがこの点で\n苦労しがちだというのです。"}, {"t": 425.28333333333336, "x": "この点とは、相手の影響を受け入れることです。"}, {"t": 428.6, "x": "研究所の別の記事にも研究の紹介があります。"}, {"t": 432.15, "x": "新婚の夫婦を追った研究です。"}, {"t": 434.53333333333336, "x": "結婚して最初の数か月でも、\n違いが見えたというのです。"}, {"t": 438.7, "x": "妻の影響を受け入れる夫の結婚は幸せだった。"}, {"t": 442.3, "x": "記事はそう書いています。"}, {"t": 443.9, "x": "ただしここは、言い方に気をつけたい所です。"}, {"t": 447.06666666666666, "x": "記事が書いているのは傾向です。"}, {"t": 449.23333333333335, "x": "男は譲れない生き物だ、という話ではありません。"}, {"t": 452.98333333333335, "x": "傾向を示す言い方にとどまっています。"}, {"t": 455.7, "x": "女性なら誰でも得意、という話でもありません。"}, {"t": 459.21666666666664, "x": "この回でも、記事の1文 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
