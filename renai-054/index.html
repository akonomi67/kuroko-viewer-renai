<script>
const D={"name": "戻れる別れと戻れない別れ", "file": "054_戻れる別れと戻れない別れ", "dur": 839.1333125, "segs": [], "subs": [{"t": 0.0, "x": "先に言っておきたいことがあります。"}, {"t": 2.2, "x": "やり直せるかどうかは、気持ちの\n強さでは決まらないようです。"}, {"t": 6.2, "x": "決まっているのは、たいてい\n連絡をする前の段階です。"}, {"t": 9.9, "x": "どんな別れ方をしたかで、戻\nれる幅がほぼ決まってしまいます。"}, {"t": 14.066666666666666, "x": "理由が一つだけの別れは、戻れることがあります。"}, {"t": 17.533333333333335, "x": "理由がいくつも重なった別れは、戻りにくくなります。"}, {"t": 21.216666666666665, "x": "そしてもう一つ、動いていい\n時期というものがあります。"}, {"t": 24.75, "x": "男は遅れて戻りたくなりやすく、\nその頃には時期が過ぎています。"}, {"t": 29.25, "x": "女は別れた直後から整理を始め、終わ\nる前の短い間だけ戻る気になりやすいです。"}, {"t": 35.43333333333333, "x": "この時期がずれているので、\n気持ちが同じでも届きません。"}, {"t": 39.25, "x": "知らないまま動くと、追えば\n追うほど遠ざかっていきます。"}, {"t": 42.96666666666667, "x": "今日の話は、相手をどうにか\nする方法ではありません。"}, {"t": 46.766666666666666, "x": "自分の側で整えられるところだけを、\n順番に並べます。"}, {"t": 50.85, "x": "戻すことだけが、正解とは限りません。"}, {"t": 53.833333333333336, "x": "まずは、決め手になっている一点から見ていきます。"}, {"t": 57.15, "x": "やり直しの相談で最初に出て\nくるのは、まだ好きだという話です。"}, {"t": 61.666666666666664, "x": "気持ちの強さは、たしかに本人にと\nって大きいものです。"}, {"t": 65.51666666666667, "x": "ただ、相手の側にはその強さが見えていません。"}, {"t": 68.93333333333334, "x": "見えているのは、別れるまでに起きたことだけです。"}, {"t": 72.25, "x": "男は、気持ちの強さを行動の量で示\nそうとしやすいです。"}, {"t": 76.53333333333333, "x": "長い文章を送る。"}, {"t": 78.03333333333333, "x": "毎日連絡する。"}, {"t": 79.41666666666667, "x": "会いに行く。"}, {"t": 80.26666666666667, "x": "女は、気持ちの強さを我慢の長\nさで示そうとしやすいです。"}, {"t": 84.6, "x": "返事を待つ。"}, {"t": 85.61666666666666, "x": "何も言わずに見守る。"}, {"t": 87.23333333333333, "x": "連絡先を消さずに残す。"}, {"t": 89.16666666666667, "x": "どちらも本気なのに、相手の判断材料には\nなりにくいです。"}, {"t": 93.36666666666666, "x": "判断されているのは、別れた\n理由が消えたかどうかです。"}, {"t": 97.25, "x": "量を増やしても、理由が残っ\nていれば結論は変わりません。"}, {"t": 101.35, "x": "逆に理由が一つで、それが消\nえていれば少ない言葉で足ります。"}, {"t": 105.71666666666667, "x": "つまり効くのは、強さではな\nく理由の数かもしれません。"}, {"t": 109.55, "x": "では、理由の数で別れはどう変わるのでしょうか。"}, {"t": 113.0, "x": "まずは戻りにくい方から、形を見ていきます。"}, {"t": 116.33333333333333, "x": "戻りにくい別れには、共通した形があります。"}, {"t": 119.85, "x": "なぜ別れたのかを、一つに言えない形です。"}, {"t": 123.1, "x": "連絡の少なさ。"}, {"t": 124.4, "x": "約束の軽さ。"}, {"t": 125.6, "x": "話の聞き方。"}, {"t": 126.83333333333333, "x": "言われた側は、どれを直せばいいのか分かりません。"}, {"t": 130.2, "x": "一方で言った側は、全部が同じ一つに見えています。"}, {"t": 134.15, "x": "大事にされていない。"}, {"t": 135.58333333333334, "x": "後回しにされている。"}, {"t": 137.13333333333333, "x": "数に入っていない。"}, {"t": 138.53333333333333, "x": "三つとも、同じ感じ方の言い換えになっています。"}, {"t": 142.05, "x": "だから一つ直しても、相手の中では何も減りません。"}, {"t": 145.76666666666668, "x": "ここで多いのが、順番に潰していこうとする形です。"}, {"t": 149.56666666666666, "x": "連絡を増やし、予定を空け、話を最後まで聞く。"}, {"t": 153.7, "x": "それでも相手には、遅れて出\nてきた対応として映ります。"}, {"t": 157.53333333333333, "x": "遅れて出た対応は、次も続くとは\n思われにくいようです。"}, {"t": 161.6, "x": "理由が積み重なった別れは、\n時間で作られたものです。"}, {"t": 165.48333333333332, "x": "時間で作られたものは、短い期間では消えません。"}, {"t": 169.16666666666666, "x": "消すのに要るのは、説明では\nなく同じ長さの実績かもしれません。"}, {"t": 173.8, "x": "反対に、短い時間で作られた別れもあります。"}, {"t": 177.48333333333332, "x": "それが次に出てくる、戻れる別れの形です。"}, {"t": 180.81666666666666, "x": "戻れる別れには、分かりやすい形があります。"}, {"t": 184.16666666666666, "x": "きっかけが一つの出来事で、日付まで言える形です。"}, {"t": 187.91666666666666, "x": "約束を破った日。"}, {"t": 189.38333333333333, "x": "言ってはいけない一言。"}, {"t": 191.08333333333334, "x": "連絡が途切れた週末。"}, {"t": 192.88333333333333, "x": "男の側は、この形なら直しやすいと感じやすいです。"}, {"t": 196.95, "x": "女の側は、一点に見えても中身を確か\nめようとしやすいです。"}, {"t": 201.48333333333332, "x": "なぜそれが起きたのか、また起きるのかを見ています。"}, {"t": 204.9, "x": "ここで多い誤解が、謝れば終\nわると思ってしまうことです。"}, {"t": 208.85, "x": "相手が気にしているのは、その\n日のことだけではありません。"}, {"t": 212.56666666666666, "x": "同じ場面になった時に、次はどうするかを\n見ています。"}, {"t": 216.46666666666667, "x": "だから必要なのは、謝罪よりも\n作り直した段取りです。"}, {"t": 220.43333333333334, "x": "出来事が一つなら、段取りも一つで足ります。"}, {"t": 223.71666666666667, "x": "一つで足りる別れは、戻れる見込みが\n残りやすいです。"}, {"t": 227.43333333333334, "x": "そしてもう一つ、見ておきたい印があります。"}, {"t": 230.56666666666666, "x": "相手がまだ怒っているかどうか、という印です。"}, {"t": 233.83333333333334, "x": "怒りは面倒なものに見えますが、\n意味が違うことがあります。"}, {"t": 237.86666666666667, "x": "別れた後の相手の反応には、二つの種類があります。"}, {"t": 241.85, "x": "一 。"}, {"t": 361.5833333333333, "x": "その時間の短さを、次の節で見ていきます。"}, {"t": 365.0833333333333, "x": "女の側に残っている時期は、短いことがあります。"}, {"t": 368.8333333333333, "x": "別れた直後から、気持ちの整理が始\nまりやすいからです。"}, {"t": 372.81666666666666, "x": "物を片づける。"}, {"t": 373.98333333333335, "x": "予定を入れ替える。"}, {"t": 375.25, "x": "人に話す。"}, {"t": 376.26666666666665, "x": "この三つが終わると、区切りがついてしまいます。"}, {"t": 379.53333333333336, "x": "終わる前であれば、話を聞く余地が残\nっていることがあります。"}, {"t": 383.7, "x": "一方で男の側は、片づけを一度で済ませやすいです。"}, {"t": 387.76666666666665, "x": "まとめて箱に入れる。"}, {"t": 389.15, "x": "連絡先はそのままにする。"}, {"t": 391.06666666666666, "x": "考えない。"}, {"t": 392.03333333333336, "x": "済ませたつもりでも、作業としては進んでいません。"}, {"t": 395.45, "x": "だから後になって、同じ場所で止\nまり直すことがあります。"}, {"t": 399.18333333333334, "x": "見分けたい時は、相手が周りに\n話したかどうかが目安になります。"}, {"t": 403.7, "x": "親や友人に別れを伝えた後は、\n戻しにくくなるようです。"}, {"t": 407.9166666666667, "x": "逆に、まだ誰にも言っていない時期は残っています。"}, {"t": 411.48333333333335, "x": "借りた物が返っていない時期も、\nまだ途中のことがあります。"}, {"t": 415.5, "x": "ただし、これを急かす材料にしてはいけません。"}, {"t": 418.7, "x": "急かすと、整理そのものを早める結果になります。"}, {"t": 422.3, "x": "時期が残っていても、動き方を間違えれば同じです。"}, {"t": 426.0833333333333, "x": "次は、その間違えやすい動き方の話になります。"}, {"t": 429.8833333333333, "x": "やり直しの失敗で多いのが、時期の取り違えです。"}, {"t": 433.45, "x": "別れた直後は、いちばん動きたくなる時期です。"}, {"t": 436.73333333333335, "x": "眠れない。"}, {"t": 437.55, "x": "何度も画面を見る。"}, {"t": 438.96666666666664, "x": "文章を書いては消す。"}, {"t": 440.53333333333336, "x": "この時期に送ったものは、ほとんど届かないようです。"}, {"t": 444.05, "x": "相手はまだ、決めたばかりの\n理由を守っている最中だからです。"}, {"t": 448.28333333333336, "x": "一方で、時間が空きすぎてか\nらの連絡も通りにくいです。"}, {"t": 452.43333333333334, "x": "相手の生活が、すでに作り直されているからです。"}, {"t": 456.03333333333336, "x": "新しい予定。"}, {"t": 457.31666666666666, "x": "新しい付き合い。"}, {"t": 458.65, "x": "変わった休みの使い方。"}, {"t": 460.45, "x": "そこへ戻る話を出すと、崩しに\n来た側になってしまいます。"}, {"t": 464.6, "x": "男の側は、待てば良いと聞い\nて止まりすぎることがあります。"}, {"t": 468.6166666666667, "x": "女の側は、確かめたくて早く動\nきすぎることがあります。"}, {"t": 472.7, "x": "ここで効いてくるのは、送る回数の少なさです。"}, {"t": 476.03333333333336, "x": "一度送って返事が無い時に、も\nう一度送る形がい const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
