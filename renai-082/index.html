<script>
const D={"name": "勘違いが逆_男が脈ありと思い込む瞬間と女が脈ありと思い込む瞬間はここまで違う", "file": "082_勘違いが逆_男が脈ありと思い込む瞬間と女が脈ありと思い込む瞬間はここまで違う", "dur": 952.36665625, "segs": [], "subs": [{"t": 0.0, "x": "相手のふるまいを見て、脈ありだと\n思い込むことがあります。"}, {"t": 4.216666666666667, "x": "今日はその思い込みが男女で\nどう違うかを並べていきます。"}, {"t": 7.983333333333333, "x": "先に結論を言っておきます。"}, {"t": 9.966666666666667, "x": "勘違いしやすい場面は、男女でほとんど逆です。"}, {"t": 13.666666666666666, "x": "男はその場の反応を見て、脈ありだと\n思いやすいです。"}, {"t": 17.916666666666668, "x": "笑ってくれた。"}, {"t": 18.916666666666668, "x": "近くに座ってくれた。"}, {"t": 20.466666666666665, "x": "誘いに乗ってくれた。"}, {"t": 21.883333333333333, "x": "女は続いている行動を見て、\n脈ありだと思いやすいです。"}, {"t": 26.283333333333335, "x": "連絡が毎日来る。"}, {"t": 27.766666666666666, "x": "話を覚えている。"}, {"t": 29.183333333333334, "x": "何度も助けてくれる。"}, {"t": 30.616666666666667, "x": "男は一瞬を拾います。"}, {"t": 32.45, "x": "女は積み重ねを数えます。"}, {"t": 34.55, "x": "そういう傾向があると言われます。"}, {"t": 36.8, "x": "困ったことに、相手にはどれも\n普通のふるまいの場合があります。"}, {"t": 41.083333333333336, "x": "感じよくしただけ。"}, {"t": 42.483333333333334, "x": "まめなだけ。"}, {"t": 43.38333333333333, "x": "気配りが癖なだけ。"}, {"t": 44.86666666666667, "x": "この違いを知らないと、片方だけが盛り上がります。"}, {"t": 48.43333333333333, "x": "気づいた時には、\n前より距離が開いていることもあります。"}, {"t": 52.25, "x": "どちらかが悪いという単純な話ではありません。"}, {"t": 55.46666666666667, "x": "見ている場所が違うので、読み違いが起きるのです。"}, {"t": 59.06666666666667, "x": "男の勘違いと女の勘違いを、\n場面ごとに交互に見ていきます。"}, {"t": 63.916666666666664, "x": "脈ありの勘違いには、大きく二つの形があります。"}, {"t": 67.83333333333333, "x": "一つは、一回の反応を大きく受け取る形です。"}, {"t": 71.45, "x": "もう一つは、続いている行動に意味を読む形です。"}, {"t": 75.18333333333334, "x": "男は前の形になりやすいと言われます。"}, {"t": 78.06666666666666, "x": "目が合った。"}, {"t": 78.88333333333334, "x": "笑ってくれた。"}, {"t": 79.9, "x": "名前で呼ばれた。"}, {"t": 81.11666666666666, "x": "その一回が、頭の中で何度もくり返されます。"}, {"t": 84.66666666666667, "x": "一方で女は後の形になりやすいようです。"}, {"t": 87.85, "x": "一回だけでは決めません。"}, {"t": 89.6, "x": "同じことが続くかどうかを見ています。"}, {"t": 92.03333333333333, "x": "三日続いた連絡。"}, {"t": 93.58333333333333, "x": "二回目の誘い。"}, {"t": 94.8, "x": "毎回の気づかい。"}, {"t": 96.08333333333333, "x": "数が増えるほど、これは特別だと感じていきます。"}, {"t": 99.7, "x": "男は早く決めすぎて外すことがあります。"}, {"t": 102.58333333333333, "x": "女は慎重に数えたぶん、外れた\n時の痛みが大きくなりがちです。"}, {"t": 107.53333333333333, "x": "どちらの勘違いも相手を好きだから起きます。"}, {"t": 110.5, "x": "好きな人の行動は、どうしても大きく見えるものです。"}, {"t": 114.11666666666666, "x": "小さな笑顔も短い連絡も特別に見えてきます。"}, {"t": 117.66666666666667, "x": "ここからは勘違いが起きやすい\n場面を一つずつ見ていきます。"}, {"t": 121.65, "x": "男がいちばん勘違いしやすいのは、\n笑顔かもしれません。"}, {"t": 125.65, "x": "話していると、よく笑ってくれる。"}, {"t": 128.16666666666666, "x": "つまらない冗談にも楽しそうに反応してくれる。"}, {"t": 131.35, "x": "相づちが多くて目を見て話を聞いてくれる。"}, {"t": 134.23333333333332, "x": "男はこれを、自分に興味がある\n証拠だと受け取りやすいです。"}, {"t": 138.53333333333333, "x": "ところが女にとって、笑顔は会話の礼儀であることが\n多いです。"}, {"t": 142.95, "x": "場の空気を悪くしないため。"}, {"t": 144.86666666666667, "x": "相手に恥をかかせないため。"}, {"t": 146.78333333333333, "x": "職場やサークルでは、誰にでも\n同じように笑う人もいます。"}, {"t": 150.91666666666666, "x": "笑顔の量は、好意の量と同じとは限りません。"}, {"t": 154.35, "x": "男は話の中身より、反応の大きさを\n見てしまいがちです。"}, {"t": 158.78333333333333, "x": "勘違いに気づくのは、ほかの\n男にも同じ笑顔を見た時です。"}, {"t": 163.11666666666667, "x": "裏切られたように感じる人もいます。"}, {"t": 165.5, "x": "でもそれは相手には少し酷な話です。"}, {"t": 168.28333333333333, "x": "相手は最初から感じよく接していただけなのです。"}, {"t": 171.53333333333333, "x": "笑顔をくれたこと自体はうそではありません。"}, {"t": 174.28333333333333, "x": "その笑顔が恋の返事ではなかったというだけです。"}, {"t": 177.45, "x": "女が勘違いしやすいのは、連絡の続き方です。"}, {"t": 181.21666666666667, "x": "返事がいつも早い。"}, {"t": 182.68333333333334, "x": "毎日のように何かしら連絡が来る。"}, {"t": 185.23333333333332, "x": "朝のあいさつや、寝る前のひとことまで届く。"}, {"t": 188.56666666666666, "x": "女はこれを、自分を考えてくれている\n証拠だと受け取りやすいです。"}, {"t": 193.25, "x": "連絡が続くこと自体に、気持ちが\nこもっていると感じるからです。"}, {"t": 197.66666666666666, "x": "ところが男にとって、連絡は手が空いた\n時の習慣の場合があります。"}, {"t": 202.66666666666666, "x": "通勤中に返す。"}, {"t": 204.21666666666667, "x": "寝る前に開く。"}, {"t": 205.45, "x": "そのついでに送る。"}, {"t": 206.76666666666668, "x": "相手が誰でも返事が早い人もいます。"}, {"t": 209.43333333333334, "x": "話しやすい相手に、\n気軽に送っているだけのこともあります。"}, {"t": 213.51666666666668, "x": "男にとって、連絡の回数はそれほど\n重くないことが多いの 3333336, "x": "女はほかの人も同じことをされていると\n知って気づきます。"}, {"t": 343.5, "x": "自分だけの特別だと思っていたものが、\nみんなに配られていたのです。"}, {"t": 348.03333333333336, "x": "その時の寂しさは小さくないものです。"}, {"t": 350.71666666666664, "x": "ただ相手は、何かを隠していたわけではありません。"}, {"t": 354.18333333333334, "x": "最初から誰にでも同じように親切だっただけです。"}, {"t": 357.53333333333336, "x": "男にとって大きいのは、誘いに乗ってくれたことです。"}, {"t": 361.1666666666667, "x": "食事に誘ったら、すぐに行きたいと返してくれた。"}, {"t": 364.65, "x": "二人きりでも嫌がらずに来てくれた。"}, {"t": 366.96666666666664, "x": "帰りぎわに楽しかったと言ってくれた。"}, {"t": 369.45, "x": "男はこれをほぼ脈ありだと受け取りやすいです。"}, {"t": 372.51666666666665, "x": "嫌いなら二人では来ないはずだと考えるからです。"}, {"t": 375.71666666666664, "x": "ところが女が誘いに乗る理由は、\n一つではありません。"}, {"t": 379.56666666666666, "x": "その店に前から行ってみたかった。"}, {"t": 381.76666666666665, "x": "お世話になった人なので断りにくかった。"}, {"t": 384.48333333333335, "x": "話して楽しい友達として、ただ会いたかった。"}, {"t": 387.76666666666665, "x": "楽しかったという言葉も、お礼の\nあいさつであることが多いです。"}, {"t": 391.9166666666667, "x": "女にとって、二人の食事は恋の入口とは\n限らないのです。"}, {"t": 396.4166666666667, "x": "男が次の誘いで告白まで急ぐと、女は戸惑います。"}, {"t": 400.71666666666664, "x": "友達として会っていたのに、と感じる人もいます。"}, {"t": 404.1166666666667, "x": "そのまま少しずつ離れていくこともあります。"}, {"t": 406.98333333333335, "x": "一回の食事に乗せる意味が、\n男女で違っていたのです。"}, {"t": 410.9, "x": "女が勘違いしやすいのは、優しさを受けた時です。"}, {"t": 414.78333333333336, "x": "重い荷物を何も言わずに運んでくれた。"}, {"t": 417.53333333333336, "x": "夜遅くなった日に駅まで送ってくれた。"}, {"t": 420.15, "x": "困っていた作業を、自分の時間を使って\n手伝ってくれた。"}, {"t": 424.26666666666665, "x": "女はこれを、特別に大事にされたと\n受け取りやすいです。"}, {"t": 428.21666666666664, "x": "そこまでしてくれるのは気持ちが\nあるからだと考えるのです。"}, {"t": 431.85, "x": "一方で男には、困っている人を見ると\n体が動く人が多いです。"}, {"t": 436.6166666666667, "x": "頼られると、相手が誰でも手を貸したくなる\n場合があります。"}, {"t": 440.7, "x": "送るのも、夜道は危ないという\n当たり前の感覚のことがあります。"}, {"t": 445.31666666666666, "x": "男にとって手伝うことは、好意よりも\n役目に近いのです。"}, {"t": 449.3333333333333, "x": "女は同じ優しさがほかの人にも\n向くのを見て気づきます。"}, {"t": 453.18333333333334, "x": "自分だけの優しさではなかったと知り、\n肩を落とします。"}, {"t": 457.0, "x": "ただ優しくされたこと自体はうそではありません。"}, {"t": 460.0833333333333, "x": "相手は本当に困っているあなたを\n助けたかったのです。"}, function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
