<script>
const D={"name": "男女の結婚観はここまで違う", "file": "071_男女の結婚観はここまで違う", "dur": 854.65, "segs": [], "subs": [{"t": 0.0, "x": "今日のテーマは、男女の結婚観の違いです。"}, {"t": 3.283333333333333, "x": "同じ結婚したいという言葉でも、\n男女で見ている未来が違うことがあります。"}, {"t": 8.333333333333334, "x": "付き合って一年ほどたつと、\n結婚の話が少しずつ出てきます。"}, {"t": 12.766666666666667, "x": "友達の結婚の知らせが届いた夜。"}, {"t": 15.3, "x": "住んでいる部屋の更新が近づいた時。"}, {"t": 18.05, "x": "二人とも結婚したいと思っている。"}, {"t": 20.316666666666666, "x": "そこまでは同じです。"}, {"t": 21.8, "x": "ところが話を進めるうちに、\nなぜかかみ合わない感覚が残ります。"}, {"t": 26.583333333333332, "x": "男は結婚を、今の二人が続い\nていく形として考えやすいと言われます。"}, {"t": 31.983333333333334, "x": "女は結婚を、暮らしが一度切\nり替わる節目として考えやすいようです。"}, {"t": 37.03333333333333, "x": "続くと思っている人と、変わると思っている人です。"}, {"t": 40.6, "x": "この差に気づかないと、同じ言葉で別の未来を語\nることになります。"}, {"t": 45.25, "x": "結婚の時期の話でも、お金の話でもありません。"}, {"t": 48.96666666666667, "x": "今日扱うのは、結婚したい気持ちの\n中身そのものです。"}, {"t": 52.9, "x": "付き合っているうちから、小さなずれは出てきます。"}, {"t": 56.166666666666664, "x": "それを場面ごとに並べていきます。"}, {"t": 58.45, "x": "最後に、二人の未来をそろえ\nる確かめ方を一つだけ出します。"}, {"t": 62.8, "x": "結婚と聞いて最初に何を思い浮か\nべるかで、もう差が出ます。"}, {"t": 67.06666666666666, "x": "男は今の二人の毎日がそのま\nま続く様子を思い浮かべやすいです。"}, {"t": 71.83333333333333, "x": "休みの日に一緒に出かける。"}, {"t": 73.66666666666667, "x": "夜に同じものを食べる。"}, {"t": 75.28333333333333, "x": "それがずっと続く。"}, {"t": 76.61666666666666, "x": "結婚はその毎日に名前をつけ\nるもの、という感覚に近いようです。"}, {"t": 81.48333333333333, "x": "一方で女は、暮らしが組み替\nわる様子を思い浮かべやすいようです。"}, {"t": 86.1, "x": "住む町。"}, {"t": 86.95, "x": "名字。"}, {"t": 88.05, "x": "仕事の続け方。"}, {"t": 89.41666666666667, "x": "毎月のお金の流れ。"}, {"t": 91.06666666666666, "x": "変わるものを一つずつ数えながら、\n結婚を考える人が多いようです。"}, {"t": 95.86666666666666, "x": "どちらも、相手と一緒にいたい気持ちから出ています。"}, {"t": 99.3, "x": "ただ、思い浮かべている絵の大きさが違います。"}, {"t": 102.6, "x": "男の絵は、今の写真を少し先へ延ばしたものです。"}, {"t": 106.38333333333334, "x": "女の絵は、家の間取りから描き直したものです。"}, {"t": 109.93333333333334, "x": "男は相手がそこまで考えてい\nることに気づきにくいです。"}, {"t": 113.63333333333334, "x": "女は相手が何も考えていないよ\nうに見えて不安になります。"}, {"t": 117.71666666666667, "x": "実際には、考えていないのではありません。"}, {"t": 120.86666666666666, "x": "変わらない前提で考えています。"}, {"t": 123.16666666666667, "x": "だから考えることが少ないだけなのです。"}, {"t": 125.81666666666666, "x": "この前提の違いが、このあと\n出てくるずれの元になります。"}, {"t": 129.7, "x": "付き合って間もないころ、ふと\n結婚の話題が出ることがあります。"}, {"t": 133.88333333333333, "x": "いつか結婚したいね。"}, {"t": 135.38333333333333, "x": "そんな一言が、何気なく口から出る場面です。"}, {"t": 138.73333333333332, "x": "この一言の重さが、男女で違って届くことがあります。"}, {"t": 142.58333333333334, "x": "男はこの一言を今の気持ちのよ\nさとして言う場合が多いようです。"}, {"t": 146.95, "x": "楽しい日だった。"}, {"t": 148.15, "x": "相手といて落ち着いた。"}, {"t": 149.7, "x": "だから自然に出た。"}, {"t": 151.01666666666668, "x": "先の予定を約束したつもりは、\n本人にはあまり無いことがあります。"}, {"t": 155.71666666666667, "x": "一方で女は、この一言を将来の話の入口と\nして受け取りやすいです。"}, {"t": 160.93333333333334, "x": "言われた日を覚えている。"}, {"t": 162.53333333333333, "x": "どんな場所で聞いたかも覚えている。"}, {"t": 164.71666666666667, "x": "そこから相手との先を、少し\nずつ考え始める人もいます。"}, {"t": 169.08333333333334, "x": "半年たってもその話が出てこないと、女は戸惑います。"}, {"t": 173.13333333333333, "x": "あの言葉は何だったのだろうと、\n一人で考えることになります。"}, {"t": 177.35, "x": "男は言ったことを責められているように感じます。"}, {"t": 180.46666666666667, "x": "嘘をついたつもりは無いのです。"}, {"t": 182.48333333333332, "x": "なので、なおさら話がこじれやすいです。"}, {"t": 185.41666666666666, "x": "どちらが悪いわけでもありません。"}, {"t": 187.51666666666668, "x": "気持ちとして言う人と、約束と\nして聞く人がいるだけです。"}, {"t": 191.46666666666667, "x": "今の気持ちなのか先の話なのかを\n一言添えると、ずれは小さくなります。"}, {"t": 196.93333333333334, "x": "結婚したいと思っていても、\n心のどこかに引っかかりはあるものです。"}, {"t": 201.4, "x": "その引っかかりの中身が、男女で違うことがあります。"}, {"t": 204.98333333333332, "x": "男は時間やお金を自由に使え\nなくなることを気にしやすいです。"}, {"t": 209.33333333333334, "x": "友達と急に飲みに行く。"}, {"t": 211.15, "x": "趣味に休みを丸ごと使う。"}, {"t": 213.13333333333333, "x": "欲しい物をその場で買う。"}, {"t": 214.83333333333334, "x": "こうした小さな自由が減ることを、\nなんとなく重く感じます。"}, {"t": 219.03333333333333, "x": "ただ本人も、それを不安とは言葉にしていません。"}, {"t": 222.55, "x": "結婚の話になると、なぜか返事が遅れる。"}, {"t": 226.06666666666666, "x": "その理由がここにある場合もあります。"}, {"t": 228.53333333333333, "x": "女が気にしやすいのは別のものです。"}, {"t": 231.06666666666666, "x": "自分の暮らしの形が変わることだと言われます。"}, {"t": 234.05, "x": "仕事をどう const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
