す。"}, {"t": 40.15, "x": "始まってからでは、直すのに時間がかかります。"}, {"t": 43.416666666666664, "x": "だから、見えた時に一度だけ止まる価値があります。"}, {"t": 46.86666666666667, "x": "男は相手の言葉を、そのまま受け取りやすいです。"}, {"t": 50.35, "x": "女は相手の態度を、細かく覚えていやすいです。"}, {"t": 53.96666666666667, "x": "どちらも材料になりますが、見る場所が違います。"}, {"t": 57.31666666666667, "x": "今日は、後から効いてくるサインを並べます。"}, {"t": 60.3, "x": "先に言うと、大きい欠点は問題になりません。"}, {"t": 63.833333333333336, "x": "問題になるのは、小さくて繰り返すものです。"}, {"t": 67.13333333333334, "x": "まず、前提を確認します。"}, {"t": 69.66666666666667, "x": "後から思い出せることは、その時も見えています。"}, {"t": 73.11666666666666, "x": "見えていたのに、記録に残していないだけです。"}, {"t": 76.3, "x": "残さなかったのは、意味が分からなかったからです。"}, {"t": 79.55, "x": "一度きりの出来事は、意味を持ちません。"}, {"t": 82.38333333333334, "x": "意味を持つのは、二度目からです。"}, {"t": 84.61666666666666, "x": "だから、一度目は覚えておくだけで足ります。"}, {"t": 87.68333333333334, "x": "判断は、二度目まで待ちます。"}, {"t": 89.96666666666667, "x": "待つ間に、こちらから何かをする必要もありません。"}, {"t": 93.66666666666667, "x": "ただ、忘れないことだけが大事です。"}, {"t": 96.26666666666667, "x": "男は出来事を、単発として処理しやすいです。"}, {"t": 99.76666666666667, "x": "女は出来事を、つなげて覚えていやすいです。"}, {"t": 103.18333333333334, "x": "だから、つなげて見る癖のある人は有利です。"}, {"t": 106.38333333333334, "x": "有利なのに、好意があると外します。"}, {"t": 109.13333333333334, "x": "外れる理由は、材料ではありません。"}, {"t": 112.0, "x": "結論を先に決めているからです。"}, {"t": 114.18333333333334, "x": "決めていなければ、材料は正しく読めます。"}, {"t": 117.33333333333333, "x": "覚え方も、簡単で構いません。"}, {"t": 119.83333333333333, "x": "その日の出来事を、一言で置いておくだけです。"}, {"t": 123.1, "x": "言葉にしておくと、二度目に気づけます。"}, {"t": 125.93333333333334, "x": "気づけない人は、毎回はじめての\n出来事として扱います。"}, {"t": 130.0, "x": "はじめて扱いが続くと、何年でも同じ場所にいます。"}, {"t": 133.95, "x": "一つ目のサインは、約束の扱いです。"}, {"t": 136.98333333333332, "x": "大きな約束は、たいてい守られます。"}, {"t": 139.78333333333333, "x": "守られないのは、小さい方です。"}, {"t": 142.23333333333332, "x": "連絡すると言って、しない。"}, {"t": 144.31666666666666, "x": "少し遅れる、が三十分になる。"}, {"t": 146.95, "x": "一度なら、誰にでもあります。"}, {"t": 149.16666666666666, "x": "問題は、その後の扱いです。"}, {"t": 151.55, "x": "軽く謝って、次も同じことをする人がいます。"}, {"t": 155.16666666666666, "x": "その人は、小さい約束を約束と考えていません。"}, {"t": 159.03333333333333, "x": "考えていない人は、生活でも同じです。"}, {"t": 162.21666666666667, "x": "男は用件のある約束を、優先しやすいです。"}, {"t": 166.01666666666668, "x": "女は約束の重さを、気持ちの量として見やすいです。"}, {"t": 169.93333333333334, "x": "だから、同じ遅刻でも受け取りが違います。"}, {"t": 172.95, "x": "違っても、繰り返す事実は変わりません。"}, {"t": 175.98333333333332, "x": "繰り返す人とは、毎回同じ場面が来ます。"}, {"t": 179.31666666666666, "x": "来ることを前提に、考えておきます。"}, {"t": 182.31666666666666, "x": "守られない約束が続く時、伝え方も決めておきます。"}, {"t": 186.48333333333332, "x": "責める形にすると、話が逸れます。"}, {"t": 189.41666666666666, "x": "連絡がないと不安になる、と事実だけ言います。"}, {"t": 192.83333333333334, "x": "言われて直る人なら、それで足ります。"}, {"t": 195.43333333333334, "x": "直らない人とは、その形が続きます。"}, {"t": 198.41666666666666, "x": "二つ目は、他人への態度です。"}, {"t": 200.76666666666668, "x": "こちらへの態度は、参考になりません。"}, {"t": 203.56666666666666, "x": "好かれたい相手には、誰でも良い顔をします。"}, {"t": 206.7, "x": "参考になるのは、利害のない相手への態度です。"}, {"t": 210.23333333333332, "x": "店員、駅員、電話の相手。"}, {"t": 213.21666666666667, "x": "そして、家族への言い方です。"}, {"t": 215.51666666666668, "x": "そこに、その人の普段が出ます。"}, {"t": 217.93333333333334, "x": "男は外での態度と、家での態度が分かれやすいです。"}, {"t": 221.88333333333333, "x": "女は身内への言い方に、素が出やすいです。"}, {"t": 225.21666666666667, "x": "どちらも、後でこちらに向く可能性があります。"}, {"t": 228.46666666666667, "x": "向いた時に、驚かないためです。"}, {"t": 230.85, "x": "だから、良い場面よりも雑な場面を見ます。"}, {"t": 233.98333333333332, "x": "雑な場面は、意識して作れません。"}, {"t": 236.7, "x": "作れないので、いちばん正確です。"}, {"t": 239.31666666666666, "x": "良い面だけを見て決めると、後で驚きます。"}, {"t": 242.43333333333334, "x": "驚いてから、こんな人だと思わなかったと言います。"}, {"t": 245.91666666666666, "x": "けれども、たいてい一度は見ています。"}, {"t": 248.5, "x": "見た場面を、なかったことにしただけです。"}, {"t": 251.38333333333333, "x": "だから、雑な場面ほど記録に残します。"}, {"t": 254.43333333333334, "x": "三つ目は、お金です。"}, {"t": 256.23333333333335, "x": "金額の大小は、問題ではありません。"}, {"t": 259.18333333333334, "x": "見るのは、使い方の型です。"}, {"t": 261.43333333333334, "x": "足りない時に、どうするか。"}, {"t": 263.46666666666664, "x": "借りる話が、軽く出るかどうか。"}, {"t": 265.93333333333334, "x": "支払いの場面で、どう振る舞うか。"}, {"t": 268.5, "x": "どれも、生活が始まると毎月出てきます。"}, {"t": 271.78333333333336, "x": "男はお金の話を、後回しにしやすいです。"}, {"t": 275.23333333333335, "x": "女はお金の態度を、早い時期に見やすいです。"}, {"t": 278.7, "x": "だから、話題にした時の反応を覚えておきます。"}, {"t": 282.15, "x": "はぐらかす人は、後でも話しません。"}, {"t": 284.8, "x": "話さない相手とは、生活の設計ができません。"}, {"t": 288.3833333333333, "x": "設計できないまま暮らすと、\n片方が管理役になります。"}, {"t": 292.45, "x": "管理役に回ると、対等ではなくなります。"}, {"t": 295.7, "x": "対等でない生活は、長く続くほど重くなります。"}, {"t": 299.3833333333333, "x": "お金の話ができる相手は、それだけで貴重です。"}, {"t": 302.8833333333333, "x": "話せる人とは、生活の設計が二人でできます。"}, {"t": 306.55, "x": "二人で作った設計は、途中で崩れにくいです。"}, {"t": 310.0, "x": "崩れにくい家は、他のことに力を使えます。"}, {"t": 313.48333333333335, "x": "使える力が残っている家が、長く続きます。"}, {"t": 317.05, "x": "四つ目は、過去の話です。"}, {"t": 319.21666666666664, "x": "前の相手をどう語るかは、大きな材料です。"}, {"t": 322.51666666666665, "x": "全部が相手のせいになっている場合、注意します。"}, {"t": 326.1, "x": "悪い人と何度も当たった、という語りです。"}, {"t": 329.1333333333333, "x": "本当にそういうこともあります。"}, {"t": 331.21666666666664, "x": "けれども、毎回同じ結末なら別の見方もできます。"}, {"t": 335.1166666666667, "x": "自分の側の話が、一つも出てこない。"}, {"t": 338.0833333333333, "x": "出てこないのは、振り返っていないからです。"}, {"t": 341.0, "x": "振り返らない人は、同じ形を繰り返します。"}, {"t": 344.43333333333334, "x": "繰り返すと、次はこちらが相手役になります。"}, {"t": 347.9166666666667, "x": "男は前の話を、聞かれない限り話しません。"}, {"t": 351.46666666666664, "x": "女は語り方の温度を、覚えていやすいです。"}, {"t": 354.8833333333333, "x": "だから、聞いてみる価値はあります。"}, {"t": 357.26666666666665, "x": "聞き方は、責める形にしません。"}, {"t": 359.73333333333335, "x": "どうして終わったの、で十分です。"}, {"t": 362.23333333333335, "x": "語り方が落ち着いている人は、\n材料として良い合図です。"}, {"t": 366.28333333333336, "x": "悪く言わず、良くも言わない形です。"}, {"t": 369.1166666666667, "x": "その形が出せる人は、振り返りが済んでいます。"}, {"t": 372.6333333333333, "x": "済んでいる人は、同じ失敗を繰り返しにくいです。"}, {"t": 376.2, "x": "繰り返さない相手とは、先が読みやすいです。"}, {"t": 379.46666666666664, "x": "五つ目は、謝る場面です。"}, {"t": 381.75, "x": "付き合う前に、一度は小さい行き違いがあります。"}, {"t": 385.4166666666667, "x": "その時の謝り方は、必ず見ておきます。"}, {"t": 388.6666666666667, "x": "謝れるかどうかではありません。"}, {"t": 390.73333333333335, "x": "謝った後に、何を言うかです。"}, {"t": 393.26666666666665, "x": "でも、が続く人は納得していません。"}, {"t": 396. const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
