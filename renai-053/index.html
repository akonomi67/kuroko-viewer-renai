<script>
const D={"name": "アプリで選ばれる基準が男女で正反対", "file": "053_アプリで選ばれる基準が男女で正反対", "dur": 852.75, "segs": [], "subs": [{"t": 0.0, "x": "マッチングアプリで相手を見るとき、男女で目が止\nまる場所がずれていることがあります。"}, {"t": 5.433333333333334, "x": "同じ画面を開いていても、先に見\nている所が違うようです。"}, {"t": 9.7, "x": "男は写真から見て、残った人の文章を後から\n読みやすいです。"}, {"t": 14.283333333333333, "x": "女は文章から見て、残った人の写真を後から\n見直しやすいです。"}, {"t": 19.133333333333333, "x": "順番が逆なので、直す場所も逆になります。"}, {"t": 22.583333333333332, "x": "写真を何度も撮り直しても、\n反応が変わらないことがあります。"}, {"t": 26.833333333333332, "x": "文章を長く書き直しても、読\nまれないまま流れることがあります。"}, {"t": 31.25, "x": "どちらも手を抜いたわけではなく、\n直す順番が違っただけかもしれません。"}, {"t": 36.06666666666667, "x": "この回で扱うのは、相手の側が動\nき出す形に変える話です。"}, {"t": 40.8, "x": "自分の駄目な所を数える作業は、ここではしません。"}, {"t": 44.516666666666666, "x": "扱うのは、写真より先に読ま\nれている所と、最初の一通の形です。"}, {"t": 50.05, "x": "そのあとに、会う約束の出し方と、\nいったん休む判断まで置きます。"}, {"t": 55.15, "x": "数を打つほど反応が減ることが\nあるという、逆の話も入ります。"}, {"t": 59.78333333333333, "x": "先に言っておくと、正解の顔や正解の年齢の話は出\nてきません。"}, {"t": 64.86666666666666, "x": "アプリを開いた時にまず起き\nているのは、絞り込みの作業です。"}, {"t": 69.15, "x": "並んだ人を上から順に、残すか\n外すかだけ決めていきます。"}, {"t": 73.4, "x": "外す理由は、だいたい三つに集まりやすいようです。"}, {"t": 77.05, "x": "写真が暗い。"}, {"t": 78.16666666666667, "x": "何をしている人か分からない。"}, {"t": 80.1, "x": "文章が長すぎる。"}, {"t": 81.51666666666667, "x": "この三つは、中身を読む前に処理\nされてしまうことがあります。"}, {"t": 85.66666666666667, "x": "一方で、残された人が次に受けるのは別の作業です。"}, {"t": 89.78333333333333, "x": "残った人同士が、そこから細かく比べられていきます。"}, {"t": 93.58333333333333, "x": "ここで見られやすいのは、話\nしかけやすいかどうかです。"}, {"t": 97.15, "x": "近所で行く店の名前。"}, {"t": 98.81666666666666, "x": "仕事の忙しい時期。"}, {"t": 100.48333333333333, "x": "休みの日に起きる時刻。"}, {"t": 102.25, "x": "この二段があることを知らないと、\n直す場所を間違えることがあります。"}, {"t": 106.88333333333334, "x": "外される段で止まっている人が、\n比べられる段の努力をしてしまう。"}, {"t": 111.31666666666666, "x": "逆に、比べられる段まで来て\nいる人が、写真ばかり替えてしまう。"}, {"t": 116.03333333333333, "x": "まず、自分がどちらの段で止\nまっているかを見る必要があります。"}, {"t": 120.4, "x": "その見分け方は、男女でだいぶ形が違うようです。"}, {"t": 124.01666666666667, "x": "男の側は、写真の一枚目で判断を始めやすいです。"}, {"t": 128.21666666666667, "x": "止まる理由は三つです。"}, {"t": 129.86666666666667, "x": "明るさ。"}, {"t": 130.96666666666667, "x": "表情の分かりやすさ。"}, {"t": 132.6, "x": "全身が見えるか。"}, {"t": 134.0, "x": "この三つで残すかどうかを決\nめてから、文章に降りていきます。"}, {"t": 138.2, "x": "一方で女の側は、文章の側に先に目が行\nきやすいようです。"}, {"t": 142.9, "x": "読む場所も三つあります。"}, {"t": 144.58333333333334, "x": "仕事の書き方。"}, {"t": 145.85, "x": "休みの日の過ごし方。"}, {"t": 147.48333333333332, "x": "文の量。"}, {"t": 148.3, "x": "この三つが揃って初めて、写真に戻\nってくることがあります。"}, {"t": 152.5, "x": "この違いを知らないと、相手の見方を軽\nく扱ってしまいます。"}, {"t": 156.83333333333334, "x": "顔しか見ていないとか、条件しか\n見ていないという話になりがちです。"}, {"t": 161.5, "x": "でも実際は、見ている順番が違うだけの\n場合があります。"}, {"t": 165.55, "x": "男の側が写真を先に見るのは、\n並ぶ数が多すぎるからかもしれません。"}, {"t": 170.68333333333334, "x": "女の側が文章を先に読むのは、\n安全を先に確かめたいからかもしれません。"}, {"t": 176.26666666666668, "x": "どちらの順番にも、そうなるだけの事情があります。"}, {"t": 179.76666666666668, "x": "まず、男の側が止まりやすい場所から見ていきます。"}, {"t": 183.4, "x": "男の側で多いのは、一枚目に手がかりの\n無い写真です。"}, {"t": 187.5, "x": "よくあるのは三つです。"}, {"t": 189.05, "x": "遠すぎる写真。"}, {"t": 190.25, "x": "暗い写真。"}, {"t": 191.18333333333334, "x": "顔が隠れた写真。"}, {"t": 192.61666666666667, "x": "どれも失敗した写真ではあり\nませんが、読む材料が足りません。"}, {"t": 197.01666666666668, "x": "読む材料が無いと、指はその\nまま次の人へ進んでしまいます。"}, {"t": 201.68333333333334, "x": "一方で、指が止まる写真には共通点があるようです。"}, {"t": 206.03333333333333, "x": "場所が分かる。"}, {"t": 207.03333333333333, "x": "何をしている最中か分かる。"}, {"t": 209.0, "x": "明るさが足りている。"}, {"t": 210.38333333333333, "x": "公園の芝生。"}, {"t": 211.63333333333333, "x": "台所の調理台。"}, {"t": 213.11666666666667, "x": "休日の川沿いの道。"}, {"t": 214.93333333333334, "x": "背景が分かるだけで、話しか\nける口実が一つ増えます。"}, {"t": 218.98333333333332, "x": "要るのは点数ではなく、話の入口に\nなる手がかりかもしれません。"}, {"t": 223.5, "x": "入口が一つあれば、相手は最初の一行を書\nけるようになります。"}, {"t": 228.06666666666666, "x": "逆に入口がゼロだと、相手は書く材料を持てません。"}, {"t": 232.0, "x": "写真を替えても反応が変わらない時は、\n枚数より中身を見てください。"}, {"t": 236.96666666666667, "x": "場所の違う写真を三枚にすると、\n材料は三つに増えます。"}, {"t": 241.5, "x": "文章の側で止まっている場合は、\nまた別の直し方になります。"}, {"t": 245.86666666666667, "x": "女の側で多いのは、文章が長\nくなって外されてしまう形です。"}, {"t": 250. const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
