<script>
const D={"name": "我慢している人ほどある日いなくなる", "file": "046_我慢している人ほどある日いなくなる", "dur": 840.8333125, "segs": [], "subs": [{"t": 0.0, "x": "文句を言わなくなった時が、\nいちばん危ない時かもしれません。"}, {"t": 4.133333333333334, "x": "喧嘩が減ったので、うまくいっていると感じます。"}, {"t": 7.466666666666667, "x": "けれども、言うのをやめただけの場合があります。"}, {"t": 10.633333333333333, "x": "人が関係から離れる時、その\n日に決めることは少ないです。"}, {"t": 14.966666666666667, "x": "たいていは、その前に何か月も我慢しています。"}, {"t": 18.383333333333333, "x": "我慢している間、相手の行動は静かに\n変わっていきます。"}, {"t": 22.516666666666666, "x": "変わり方が地味なので、良い変化に見\nえることもあります。"}, {"t": 26.433333333333334, "x": "穏やかになった。"}, {"t": 27.6, "x": "手がかからなくなった。"}, {"t": 29.0, "x": "怒らなくなった。"}, {"t": 30.133333333333333, "x": "そう見えている時期が、いちば\nん危ない時期であることがあります。"}, {"t": 34.18333333333333, "x": "そして限界が来た日、本人はもう迷っていません。"}, {"t": 37.8, "x": "迷いが終わった後なので、話し合いも\n長く続きません。"}, {"t": 41.68333333333333, "x": "残された側は、何も言わずに\n出ていかれたと感じます。"}, {"t": 45.516666666666666, "x": "実際には、何度も出ていた合図を見落と\nしていたことが多いです。"}, {"t": 49.86666666666667, "x": "今日は、限界が近づいた人に出や\nすい変化を並べていきます。"}, {"t": 54.233333333333334, "x": "もちろん、全部が当てはまる人ばかりではありません。"}, {"t": 58.03333333333333, "x": "いくつか重なった時にだけ、\n確かめる価値が出てきます。"}, {"t": 61.78333333333333, "x": "一つだけを取り出して、疑いの\n材料にはしないでください。"}, {"t": 65.76666666666667, "x": "疑いから入ると、相手はさらに口を閉じます。"}, {"t": 69.28333333333333, "x": "見るのは相手の落ち度ではなく、\nこちらに残された時間の方です。"}, {"t": 73.65, "x": "関係が終わる時、最後の一日だけが語られがちです。"}, {"t": 77.81666666666666, "x": "出ていった日。"}, {"t": 78.81666666666666, "x": "別れを切り出した日。"}, {"t": 80.28333333333333, "x": "連絡が止まった日。"}, {"t": 81.71666666666667, "x": "けれども、そこで決まったわ\nけではないことが多いです。"}, {"t": 85.15, "x": "決まったのは、もっと前の、何でもない日です。"}, {"t": 88.61666666666666, "x": "言おうとしてやめた日が、何度も重なっています。"}, {"t": 91.86666666666666, "x": "重なるたびに、相手の中で期待が一段\nずつ下がっていきます。"}, {"t": 96.16666666666667, "x": "下がりきった時点で、話す理由が消えてしまいます。"}, {"t": 99.81666666666666, "x": "話す理由が消えた人は、静かになります。"}, {"t": 102.91666666666667, "x": "静かになった状態を、落ち着\nいたと読み違えやすいです。"}, {"t": 106.83333333333333, "x": "読み違えたまま時間が過ぎると、\n次に来るのは結論です。"}, {"t": 111.05, "x": "結論だけが急に見えるので、\n急にいなくなったと感じます。"}, {"t": 115.3, "x": "見えていなかったのは、決断では\nなく途中経過の方です。"}, {"t": 119.33333333333333, "x": "途中経過は、行動の細かい変化と\nして外に出てきます。"}, {"t": 123.4, "x": "言葉より先に、予定や態度の方に出やすいです。"}, {"t": 127.08333333333333, "x": "だから、聞き出すより先に、\n見る場所を変える方が早いです。"}, {"t": 131.4, "x": "ここから先は、その見る場所の話になります。"}, {"t": 134.66666666666666, "x": "順番は、言葉から遠いものほど早く出ます。"}, {"t": 138.01666666666668, "x": "最初に動くのは、口ではなく生活の方です。"}, {"t": 141.43333333333334, "x": "最初に出やすいのが、文句の量です。"}, {"t": 144.05, "x": "細かい不満を言っていた人が、\n急に言わなくなります。"}, {"t": 147.75, "x": "靴を揃えない。"}, {"t": 148.91666666666666, "x": "返事が短い。"}, {"t": 150.15, "x": "連絡の間隔が空く。"}, {"t": 151.78333333333333, "x": "そういう小さな指摘が、まとめて消えます。"}, {"t": 154.78333333333333, "x": "言われなくなった側は、たいてい安心します。"}, {"t": 157.88333333333333, "x": "うるさくなくなった。"}, {"t": 159.15, "x": "丸くなった。"}, {"t": 160.08333333333334, "x": "そう受け取ります。"}, {"t": 161.26666666666668, "x": "けれども、文句は関心の形であることがあります。"}, {"t": 164.86666666666667, "x": "直してほしいと思える相手に\nしか、人は注文を出しません。"}, {"t": 169.08333333333334, "x": "注文が消えたのは、直る見込みを\n外したからかもしれません。"}, {"t": 173.18333333333334, "x": "言っても変わらないと分かると、\n言う手間の方が大きくなります。"}, {"t": 177.43333333333334, "x": "手間の方が大きくなった時、\n人は黙る方を選びやすいです。"}, {"t": 181.8, "x": "黙ったあとも、不満そのものは残り続けています。"}, {"t": 185.43333333333334, "x": "外に出さないだけなので、量は減っていません。"}, {"t": 188.65, "x": "残った分は、いつか別の形で出てきます。"}, {"t": 191.83333333333334, "x": "指摘が減った理由を、良い方\nだけで説明しないでください。"}, {"t": 196.03333333333333, "x": "静かになった時期は、確かめる時期でもあります。"}, {"t": 199.35, "x": "確かめ方は、直された側から出す方が早いです。"}, {"t": 202.98333333333332, "x": "前に言われていたあれは、ま\nだ気になるかと聞いてみます。"}, {"t": 206.65, "x": "もう気にしていないと返ってきたら、\nそこが分かれ目になります。"}, {"t": 210.6, "x": "次に出やすいのが、予定の埋まり方です。"}, {"t": 213.56666666666666, "x": "週末の空きが、いつのまにか少なくなります。"}, {"t": 216.78333333333333, "x": "友人との約束。"}, {"t": 218.3, "x": "実家の用事。"}, {"t": 219.43333333333334, "x": "資格の勉強。"}, {"t": 220.65, "x": "どれも自然な予定なので、疑う材料にはなりません。"}, {"t": 224.55, "x": "見たいのは中身ではなく、順番の方です。"}, {"t": 227.73333333333332, "x": "以前は、相手の予定を聞いてから\n他を入れていました。"}, {"t": 231.48333333333332, "x": "今は、他を入れてから相手に伝\nえる形になっています。"}, {"t": 235.35, "x": "この順番には、優先順位がそのまま出ます。"}, {"t": 238.71666666666667, "x": "一緒にいる時間が、余った時間になっていきます。"}, {"t": 242.13333333333333, "x": "本人に自覚が無いことも多いです。"}, {"t": 244.55, "x": "一人で回復できる時間を、無意識に確保\nしているだけです。"}, {"t": 248.68333333333334, "x": "回復が必要になっている時点で、\nどこかで消耗しています。"}, {"t": 252.96666666666667, "x": "消耗の理由は、喧嘩とは限りません。"}, {"t": 255.95, "x": "気を使い続けることでも、人は同じくらい疲れます。"}, {"t": 259.73333333333335, "x": "予定が埋まったこと自体は、悪いことではありません。"}, {"t": 263.31666666666666, "x": "数えるのは、どちらを先に入れたかの回数です。"}, {"t": 266.75, "x": "台所の壁に貼ったカレンダーを\n見れば、だいたい分かります。"}, {"t": 270.76666666666665, "x": "相手の予定が後から書き足さ\nれているなら、順番は変わっています。"}, {"t": 275.43333333333334, "x": "三つ目は、質問の量です。"}, {"t": 277.7, "x": "どこに行くのか。"}, {"t": 278.85, "x": "誰と会うのか。"}, {"t": 279.98333333333335, "x": "何時に帰るのか。"}, {"t": 281.3833333333333, "x": "そういう確認が、ある時期から出てこなくなります。"}, {"t": 284.71666666666664, "x": "聞かれなくなると、信用されたように感じます。"}, {"t": 288.1666666666667, "x": "信用と、関心が下がった状態は、\n外から見た形が同じです。"}, {"t": 293.18333333333334, "x": "見分ける材料は、聞かれなく\nなった後の反応の方です。"}, {"t": 297.05, "x": "帰りが遅くなった日に、何も言われない。"}, {"t": 300.0833333333333, "x": "予定が変わった日に、理由を求められない。"}, {"t": 303.23333333333335, "x": "そこで相手の機嫌が動かない\nなら、位置が変わっています。"}, {"t": 307.15, "x": "以前は、予定の変更が相手の一日に影響\nしていました。"}, {"t": 311.6, "x": "影響しなくなったのは、組み込\nまれていないからかもしれません。"}, {"t": 315.65, "x": "組み込まれていない相手の予定は、\n確認する必要がありません。"}, {"t": 320.03333333333336, "x": "冷たくなったと決めつける前に、\n期待の置き場所を見てください。"}, {"t": 324.31666666666666, "x": "置き場所は、仕事や友人や、\n一人の時間に移ることがあります。"}, {"t": 329.25, "x": "戻すには、また相手の一日に組\nみ込まれる理由が要ります。"}, {"t": 333.3833333333333, "x": "理由は、大きな出来事でなくても作れます。"}, {"t": 336.56666666666666, "x": "帰る時間を先に伝える。"}, {"t": 338.5, "x": "買い物を一つ頼む。"}, {"t": 340.0833333333333, "x": "そういう小さな共有が、予定を組み込み直します。"}, {"t": 343.8333333333333, "x": "組み込まれた相手の予定は、\nまた確認する対象に戻ります。"}, {"t": 348.18333333333334, "x": "五つ目は、言葉づかいです。"}, {"t": 350.3, "x": "近い相手ほど、お礼は短くなっていくものです。"}, {"t": 353.78333333333336, "x": "ありがとうが、うん、に変わるくらいが普通です。"}, {"t": 357.68333333333334, "x": "それが、ある時期から急に整い始めます。"}, {"t": 360.75, "x": "ありがとうございます。"}, {"t": 362.21666666666664, "x": "助かりました。"}, {"t": 363.26666666666665, "x": "わざわざすみません。"}, {"t": 364.6, "x": "丁寧になったこと自体は、感じのいい変化です。"}, {"t": 368.1333333333333, "x": "けれども、丁寧さは距離の長さでも変わります。"}, {"t": 371.53333333333336, "x": "外の人に使う形が出てきたなら、\n距離が伸びています。"}, {"t": 375.4166666666667, "x": "甘えが減ったと言い換えてもいいかもしれません。"}, {"t": 378.3333333333333, "x": "甘えは、負担をかけても大丈夫\nだという前提から出ます。"}, {"t": 382.4166666666667, "x": "その前提が薄くなると、言葉の方が先に整\nうことがあります。"}, {"t": 387.05, "x": "気持ちより先に、形が動くことがあるということです。"}, {"t": 390.9, "x": "急に扱いが良くなった時期は、\n注意して見てください。"}, {"t": 394.73333333333335, "x": "機嫌が良くなったのではなく、\n線を引き直している場合があります。"}, {"t": 399.25, "x": "ここでも、一つだけで決めないでください。"}, {"t": 402.01666666666665, "x": "他の変化と重なった時に、初めて意味が出ます。"}, {"t": 405.65, "x": "逆に、もともと丁寧な人もたくさんいます。"}, {"t": 408.8, "x": "その場合は、前と比べて変わ\nったかどうかだけを見てください。"}, {"t": 412.85, "x": "六つ目は、怒り方です。"}, {"t": 414.81666666666666, "x": "以前なら、言い返してきた場面があったはずです。"}, {"t": 418.21666666666664, "x": "約束の時間に遅れた。"}, {"t": 420.0, "x": "話を途中で切った。"}, {"t": 421.6166666666667, "x": "同じ失敗を繰り返した。"}, {"t": 423.53333333333336, "x": "そういう場面で、笑って流されるようになります。"}, {"t": 427.03333333333336, "x": "流された側は、許されたと受け取ります。"}, {"t": 430.01666666666665, "x": "けれども、怒るという行為には手間がかかります。"}, {"t": 433.23333333333335, "x": "説明して、伝えて、もう一度確か\nめる必要があります。"}, {"t": 437.7, "x": "その手間をかけるのは、続ける前提があるからです。"}, {"t": 441.21666666666664, "x": "続ける前提が薄くなると、手間の方が先に消\nえてしまいます。"}, {"t": 445.76666666666665, "x": "怒らなくなった人が、機嫌が\nいいとは限らないということです。"}, {"t": 449.8, "x": "言い返しが消えた時期を、安定と読\nまないでください。"}, {"t": 453.51666666666665, "x": "確かめ方は、こちらから話題を戻してみることです。"}, {"t": 457.1, "x": "この前のあれは悪かった、と自分から出してみます。"}, {"t": 460.6, "x": "そこで話が続くなら、まだ手間をかける気があります。"}, {"t": 464.28333333333336, "x": "もういい、と短く終わるなら、\n置かれている段階が違います。"}, {"t": 468.65, "x": "段階が違うと、同じ謝り方では届きません。"}, {"t": 472.3666666666667, "x": "届かせたいなら、謝る前に事実を数えてください。"}, {"t": 476.15, "x": "同じことが何回あったかを、こちらから言う形です。"}, {"t": 479.81666666666666, "x": "数が出てくると、軽く見てい\nないことだけは伝わります。"}, {"t": 48 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
