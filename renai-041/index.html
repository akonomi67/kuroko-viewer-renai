<script>
const D={"name": "冷める順番が逆_男は一度に落ち女は少しずつ削れる", "file": "041_冷める順番が逆_男は一度に落ち女は少しずつ削れる", "dur": 800.1333125, "segs": [], "subs": [{"t": 0.0, "x": "同じ日に別れても、二人が冷めた日は\n同じではないことがあります。"}, {"t": 4.516666666666667, "x": "片方はその日に決めていて、\nもう片方は何か月も前に終わっています。"}, {"t": 9.533333333333333, "x": "冷めるという現象は、\n進み方が男女で違う場合があります。"}, {"t": 13.883333333333333, "x": "男は出来事をきっかけに、一度に落ちやすいです。"}, {"t": 17.55, "x": "女は小さな回数が重なって、\n少しずつ削れていきやすいです。"}, {"t": 22.4, "x": "男は落ちるまでは平気に見えて、\n落ちた後は戻りにくいです。"}, {"t": 26.716666666666665, "x": "女は削れている間ずっと苦しくて、\n無くなった後は静かになります。"}, {"t": 31.516666666666666, "x": "だから別れ話の温度が、最初からかみ合いません。"}, {"t": 35.11666666666667, "x": "片方は今この瞬間の話をしていて、\nもう片方は終わった話をしています。"}, {"t": 40.63333333333333, "x": "この差を知らないと、\n理由がいつまでも分からないままになります。"}, {"t": 44.9, "x": "別れた後で何年も考え続ける人は、\nたいていここで止まっています。"}, {"t": 49.666666666666664, "x": "なぜ急になのかと思う側と、\n何度も言ったのにと思う側に分かれます。"}, {"t": 54.63333333333333, "x": "どちらも嘘をついていないのに、\n記憶している長さが違うだけです。"}, {"t": 59.06666666666667, "x": "今日は、冷めるまでの道のりを男女で\n並べて見ていきます。"}, {"t": 63.016666666666666, "x": "逆の出方をする人もいるので、\nあくまで傾向として聞いてください。"}, {"t": 67.48333333333333, "x": "自分の側の進み方が分かると、\n間に合う時期も見えてきます。"}, {"t": 71.85, "x": "まず、冷めるという言葉には二つの中身があります。"}, {"t": 75.56666666666666, "x": "一つは、好きという気持ちそのものが落ちることです。"}, {"t": 78.98333333333333, "x": "もう一つは、この人に期待するのをやめることです。"}, {"t": 82.41666666666667, "x": "前者は感情の話で、後者は判断の話になります。"}, {"t": 86.66666666666667, "x": "男は前者として使いやすく、\n女は後者として使いやすいです。"}, {"t": 91.25, "x": "だから同じ一言でも、指しているものが違ってきます。"}, {"t": 94.96666666666667, "x": "感情が落ちた人は、\n自分でもいつ落ちたのかが分かります。"}, {"t": 99.03333333333333, "x": "期待をやめた人は、やめた日を\n特定できないことが多いです。"}, {"t": 103.21666666666667, "x": "少しずつ減っていったので、\n境目が残っていないからです。"}, {"t": 107.18333333333334, "x": "ここを取り違えると、\n話し合いの入り口から外れてしまいます。"}, {"t": 111.5, "x": "いつからなのかと聞いても答えが\n出ないのは、そのためです。"}, {"t": 115.28333333333333, "x": "答えが出ないことを、\nはぐらかしていると受け取らないでください。"}, {"t": 119.26666666666667, "x": "本当に、区切りの日が\n存在していない場合があります。"}, {"t": 123.16666666666667, "x": "まずは、相手の冷めるがどちらの意味かを\n見てください。"}, {"t": 126.7, "x": "そこが分かると、まだ間に合うかどうかも\n見えてきます。"}, {"t": 130.3, "x": "男の冷め方には、落ちるという言葉が\n合うことがあります。"}, {"t": 134.23333333333332, "x": "ある日ある場面で、気持ちが急に下がる形です。"}, {"t": 137.88333333333333, "x": "人前で強く否定された。"}, {"t": 139.76666666666668, "x": "約束を軽く扱われた。"}, {"t": 141.68333333333334, "x": "頼った時に流された。"}, {"t": 143.35, "x": "そういう一つの場面が、引き金になることがあります。"}, {"t": 147.01666666666668, "x": "本人にとっては、その日までは普通に\n好きだったつもりです。"}, {"t": 150.96666666666667, "x": "だから外から見ると、\n急に態度が変わったように見えます。"}, {"t": 155.03333333333333, "x": "そして落ちた後は、なかなか\n戻りにくいところがあります。"}, {"t": 158.78333333333333, "x": "気持ちが下がったというより、\n相手の位置が変わってしまうからです。"}, {"t": 162.98333333333332, "x": "恋愛の相手から、身内や同居人の位置へ\n移ることがあります。"}, {"t": 167.4, "x": "その状態でも優しくはできるので、\n余計に分かりにくいです。"}, {"t": 171.68333333333334, "x": "優しさが残っているせいで、\n周りには問題なく見えます。"}, {"t": 175.83333333333334, "x": "本人も嫌いになったわけではないので、\n説明ができません。"}, {"t": 180.0, "x": "だから理由を聞かれても、\nうまく言葉にならないことがあります。"}, {"t": 184.05, "x": "言葉にならないまま時間が過ぎて、\nある日いなくなります。"}, {"t": 187.83333333333334, "x": "急に見えても、内側では一度きりの場面が\n効いています。"}, {"t": 192.0, "x": "女の冷め方には、削れるという言葉が\n近いことがあります。"}, {"t": 196.2, "x": "一つの出来事で終わるのではなく、\n同じことが何度も続く形です。"}, {"t": 200.86666666666667, "x": "言ったのに直らなかった。"}, {"t": 202.51666666666668, "x": "同じ場面でまた後回しにされた。"}, {"t": 204.91666666666666, "x": "三回目くらいまでは、伝え方を変えて言い続けます。"}, {"t": 208.76666666666668, "x": "五回目を過ぎたあたりから、\n言う回数の方が減っていきます。"}, {"t": 212.95, "x": "言っても変わらないという結論が、\n先に出てしまうからです。"}, {"t": 216.9, "x": "そして最後に残るのは、\n怒りではなく静けさになります。"}, {"t": 220.76666666666668, "x": "本人も、いつ最後の一回が来たのかを\n覚えていません。"}, {"t": 224.63333333333333, "x": "この静けさを、落ち着いたと読む人がとても多いです。"}, {"t": 228.28333333333333, "x": "実際には、期待の在庫が尽きた後の\n状態であることがあります。"}, {"t": 232.8, "x": "削れていく途中では、\n本人にも別れる気はありません。"}, {"t": 236.66666666666666, "x": "むしろ直ってほしいから、何度も言っています。"}, {"t": 239.81666666666666, "x": "言っている時期がいちばん、まだ好きな時期です。"}, {"t": 243.03333333333333, "x": "だから文句が多い時期を、\n悪い時期だと思わないでください。"}, {"t": 247.16666666666666, "x": "文句が消えた時期の方が、\nはるかに終わりに近いことがあります。"}, {"t": 251.36666666666667, "x": "減っていく途中には、\n何度も戻れる場所がありました。"}, {"t": 254.98333333333332, "x": "ここで一つ、注意しておきたいことがあります。"}, {"t": 258.1666666666667, "x": "冷めたと感じた時期が、\n実は疲れていただけの場合があります。"}, {"t": 262.4166666666667, "x": "仕事が重なった。"}, {"t": 263.75, "x": "眠れていない。"}, {"t": 264.85, "x": "家の事情が動いた。"}, {"t": 266.4, "x": "そういう時期は、誰でも人への反応が薄くなります。"}, {"t": 270.1, "x": "反応が薄くなると、自分でも気持ちが\n減ったように感じます。"}, {"t": 274.5, "x": "けれども生活が戻ると、\n感覚も戻ってくることがあります。"}, {"t": 278.76666666666665, "x": "だから判断は、状態が落ち着いてからの方が\n安全です。"}, {"t": 282.81666666666666, "x": "見分ける目安は、相手以外への反応が\n同じかどうかです。"}, {"t": 287.01666666666665, "x": "友人にも家族にも面倒を感じているなら、\n疲れの側かもしれません。"}, {"t": 292.4, "x": "相手にだけ反応が落ちているなら、\n気持ちの側の可能性があります。"}, {"t": 297.03333333333336, "x": "この確認をしないまま、\n大きな結論を出す人がとても多いです。"}, {"t": 301.5, "x": "そして落ち着いた後に、\nなぜ決めたのかが分からなくなります。"}, {"t": 305.55, "x": "逆に、疲れのせいだと言い聞かせすぎるのも\n危ないです。"}, {"t": 309.48333333333335, "x": "半年続いているなら、それはもう状態ではありません。"}, {"t": 313.28333333333336, "x": "二週間か、半年かで見ると、\nかなり判断しやすくなります。"}, {"t": 317.9, "x": "限界が近づいた時の合図も、出方が違います。"}, {"t": 321.6333333333333, "x": "男に出やすいのは、会話の短さと外出の増え方です。"}, {"t": 325.76666666666665, "x": "返事が単語になる。"}, {"t": 327.21666666666664, "x": "予定を先に埋める。"}, {"t": 328.6166666666667, "x": "家にいる時間が減る。"}, {"t": 330.15, "x": "一方で女に出やすいのは、\n確認をしなくなることです。"}, {"t": 334.1, "x": "どこに行くのかを聞かない。"}, {"t": 335.75, "x": "予定を聞かない。"}, {"t": 336.93333333333334, "x": "相手の話に質問をしない。"}, {"t": 339.03333333333336, "x": "以前は気にしていたことを、気にしなくなります。"}, {"t": 342.18333333333334, "x": "どちらにも共通しているのは、\n揉めなくなるという点です。"}, {"t": 346.01666666666665, "x": "揉めごとが減ると、関係が良くなったように見えます。"}, {"t": 349.71666666666664, "x": "けれども内側では、話し合う価値を\n下げているだけの場合があります。"}, {"t": 354.3333333333333, "x": "喧嘩は、まだ直したいと\n思っている人がするものです。"}, {"t": 357.8666666666667, "x": "直らないと決めた人は、そもそも持ち出しません。"}, {"t": 361.1166666666667, "x": "だから静かな時期ほど、丁寧に見た方が安全です。"}, {"t": 365.03333333333336, "x": "言い争いが無いことを、\nうまくいっている証拠にしないでください。"}, {"t": 369.23333333333335, "x": "合図は、いつも小さくて地味な形で出てきます。"}, {"t": 372.68333333333334, "x": "派手な形で出てきた時は、\nたいてい後半に入っています。"}, {"t": 376.65, "x": "時間差がいちばんきつく出るのが、この場面です。"}, {"t": 379.8333333333333, "x": "女の側は、何か月も前から\n少しずつ減らしてきています。"}, {"t": 384.0833333333333, "x": "男の側は、その期間を普通の\n日々として過ごしています。"}, {"t": 388.18333333333334, "x": "そして相手の態度が変わった時に、\n初めて異変に気づきます。"}, {"t": 392.45, "x": "気づいた時点が、相手にとっては\n終わりのあたりです。"}, {"t": 395.8666666666667, "x": "そこから急に話し合おうとしても、\n遅い場合があります。"}, {"t": 399.73333333333335, "x": "話し合いは、\n材料が残っている時期にしかできません。"}, {"t": 403.51666666666665, "x": "すでに結論が出ている相手には、\n説得として届いてしまいます。"}, {"t": 407.8833333333333, "x": "説得されるほど、決めた側は自分の時間を\n思い出します。"}, {"t": 412.05, "x": "今さら言われても、という気持ちが\n強くなっていきます。"}, {"t": 415.6333333333333, "x": "だから気づいた側は、\n量を増やすと逆に押し返されます。"}, {"t": 419.6333333333333, "x": "連絡を増やす。"}, {"t": 420.8333333333333, "x": "会いに行く。"}, {"t": 421.68333333333334, "x": "改善する点を並べる。"}, {"t": 423.3833333333333, "x": "どれも遅れて始めると、\n圧として受け取られやすいです。"}, {"t": 427.1, "x": "遅れたこと自体は、責めても戻りません。"}, {"t": 430.0833333333333, "x": "ここで見るべきなのは、\n相手がまだ言葉を返してくるかどうかです。"}, {"t": 434.3666666666667, "x": "黙るという行為の位置も、男女でずれています。"}, {"t": 437.65, "x": "男が黙るのは、考えている途中であることが\n多いです。"}, {"t": 441.6166666666667, "x": "まとまっていないので、\n言葉にできていないだけの場合があります。"}, {"t": 445.71666666666664, "x": "女が黙るのは、考え終わった後であることがあります。"}, {"t": 449.96666666666664, "x": "言っても変わらないと結論が出たので、\n話すのをやめています。"}, {"t": 454.05, "x": "つまり同じ沈黙でも、\n前半にあるのか後半にあるのかが違います。"}, {"t": 458.98333333333335, "x": "前半の沈黙は、待てば言葉が出てきます。"}, {"t": 462.23333333333335, "x": "後半の沈黙は、待っても何も出てきません。"}, {"t": 465.51666666666665, "x": "ここを間違えると、対応の方向がまるごと\n逆になります。"}, {"t": 469.81666666666666, "x": "考え中の相手を急かすと、\n余計に言葉が出なくなります。"}, {"t": 474.03333333333336, "x": "決め終わった相手を待つと、\nそのまま時間だけが過ぎます。"}, {"t": 477.9, "x": "見分けたい時は、生活の中の細かい提案を\n出してみてください。"}, {"t": 482.5, "x": "来週の予定や、小さな買い物の相談で反応が\n分かります。"}, {"t": 487.0833333333333, "x": "そこに意見が返ってくる間は、まだ前半にいます。"}, {"t": 490.78333333333336, "x": "どちらでもいい、が続き始めたら後半に入っています。"}, {"t": 494.6666666666667, "x": "冷めた関係には、段階のようなものがあります。"}, {"t": 498.1166666666667, "x": "最初は、不満がまだ言葉として出ている段階です。"}, {"t": 501.75, "x": "次に、言っても無駄だと感じて回数が\n減る段階が来ます。"}, {"t": 506.0, 666667, "x": "だから相手を性別で読むより、\n過去の反応で読む方が当たります。"}, {"t": 648.0, "x": "前の喧嘩の時、その人が何回言ってきたかを\n思い出してください。"}, {"t": 652.6, "x": "回数が多かった人は、削れる型の可能性があります。"}, {"t": 656.65, "x": "一度も言わずに態度で示した人は、\n落ちる型かもしれません。"}, {"t": 660.7666666666667, "x": "自分がどちらなのかも、同じ方法で分かります。"}, {"t": 664.1333333333333, "x": "そこが分かれば、相手に伝えるべき形も決められます。"}, {"t": 667.9333333333333, "x": "男女の話は、目安として使う分にはとても便利です。"}, {"t": 671.9833333333333, "x": "当てはまらない時は、\n迷わず目の前の人を優先してください。"}, {"t": 676.3, "x": "最後に、両方の型に共通して効くことがあります。"}, {"t": 680.0833333333334, "x": "それは、不満が出た回数を数えておくことです。"}, {"t": 683.5833333333334, "x": "内容ではなく、回数だけで構いません。"}, {"t": 686.6166666666667, "x": "同じ話が三回出たら、\nその一つを形にして変えてください。"}, {"t": 691.05, "x": "三回というのは、削れ始める手前の目安になります。"}, {"t": 694.9833333333333, "x": "逆に自分が言う側であれば、\n伝え方を一つ決めてください。"}, {"t": 699.2833333333333, "x": "その場の感情で言うと、\n回数として数えてもらえません。"}, {"t": 703.3833333333333, "x": "落ち着いた日に一つだけ具体的に言う方が、\nはるかに届きます。"}, {"t": 707.6333333333333, "x": "言う側も聞く側も、同じ場所を見る形になります。"}, {"t": 711.3, "x": "そして、何も起きていない期間を軽く見ないことです。"}, {"t": 714.9166666666666, "x": "冷める作業は、事件のない日に進んでいます。"}, {"t": 718.2166666666667, "x": "特別な日を整えても、\n普通の日が雑だと相殺されます。"}, {"t": 722.5833333333334, "x": "普通の日を整えると、削れる速さがはっきり落ちます。"}, {"t": 726.6333333333333, "x": "やることは地味ですが、\n効き目はいちばん大きいです。"}, {"t": 730.0333333333333, "x": "一度だけ頑張る形は、\n続かないので回数になりません。"}, {"t": 734.1333333333333, "x": "続けられる形にしておくことが、\nそのまま予防になります。"}, {"t": 738.05, "x": "このように、冷めるまでの進み方は男女で\n形が違うことがあります。"}, {"t": 742.8833333333333, "x": "男は一つの出来事で落ちて、\nその後は戻りにくくなります。"}, {"t": 747.0166666666667, "x": "女は同じことの繰り返しで削れて、\n最後に静かになります。"}, {"t": 751.5166666666667, "x": "どちらも、ある日突然に起きたわけではありません。"}, {"t": 754.8666666666667, "x": "ただ、気づける時期がずれてしまうことがあります。"}, {"t": 758.0666666666667, "x": "ずれたまま進むと、片方だけが手遅れの\n場所に立ちます。"}, {"t": 762.1166666666667, "x": "そして手遅れになってから、\n初めて理由を探し始めます。"}, {"t": 766.1333333333333, "x": "探しても出てこないのは、\n答えが一つではないからです。"}, {"t": 769.8166666666667, "x": "一つの出来事より、数えられなかった回数の\n方が効いています。"}, {"t": 774.3333333333334, "x": "もし今、相手が前より静かになったと\n感じているなら、量を増やさないでください。"}, {"t": 780.0666666666667, "x": "先にやるのは、最近言われたことを\n一つ思い出すことです。"}, {"t": 784.1666666666666, "x": "思い出せたなら、まだ戻せる場所に立っています。"}, {"t": 787.3833333333333, "x": "思い出せない時は、相手に\n一つだけ聞いてみてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
