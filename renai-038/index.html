<style>

button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:76px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}

.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}

t": 1098.2166666666667, "i": 368}, {"t": 1101.8, "i": 369}, {"t": 1105.3166666666666, "i": 370}, {"t": 1108.4166666666667, "i": 371}, {"t": 1111.1333333333334, "i": 372}, {"t": 1114.65, "i": 373}, {"t": 1117.45, "i": 374}, {"t": 1119.8666666666666, "i": 375}, {"t": 1123.0333333333333, "i": 376}, {"t": 1125.8666666666666, "i": 377}, {"t": 1127.35, "i": 378}, {"t": 1128.6, "i": 379}, {"t": 1129.7166666666667, "i": 380}, {"t": 1131.8666666666666, "i": 381}, {"t": 1135.2666666666667, "i": 382}, {"t": 1138.1, "i": 383}, {"t": 1141.4, "i": 384}, {"t": 1144.9166666666667, "i": 385}, {"t": 1148.05, "i": 386}, {"t": 1151.4166666666667, "i": 387}, {"t": 1154.05, "i": 388}, {"t": 1156.85, "i": 389}, {"t": 1160.0333333333333, "i": 390}, {"t": 1168.0166666666667, "i": 390}], "subs": [{"t": 0.0, "x": "同じ場面にいても、頭の中で\n起きていることは同じではありません。"}, {"t": 4.6, "x": "同じ食事、同じ会話、同じ沈黙。"}, {"t": 7.966666666666667, "x": "外から見れば、二人は同じ時間を過ごしています。"}, {"t": 11.616666666666667, "x": "けれども、考えていることは驚くほど違います。"}, {"t": 15.066666666666666, "x": "違うこと自体は、問題ではありません。"}, {"t": 17.933333333333334, "x": "問題になるのは、同じだと思い込む時です。"}, {"t": 21.15, "x": "思い込むと、相手の行動を自分の基準で読みます。"}, {"t": 24.883333333333333, "x": "自分の基準で読むと、たいてい悪い方に外れます。"}, {"t": 28.633333333333333, "x": "連絡が減ったのは、冷めたからだと読む。"}, {"t": 31.466666666666665, "x": "黙ったのは、怒っているからだと読む。"}, {"t": 34.083333333333336, "x": "どちらも、外れていることが多いです。"}, {"t": 36.68333333333333, "x": "外れた読み方で動くと、相手には理不尽に映ります。"}, {"t": 40.583333333333336, "x": "映った時点で、話が噛み合わなくなります。"}, {"t": 43.833333333333336, "x": "噛み合わないまま、両方が疲れていきます。"}, {"t": 46.95, "x": "疲れた末に、気持ちの量を疑い始めます。"}, {"t": 50.36666666666667, "x": "本当は、量ではありません。"}, {"t": 52.86666666666667, "x": "読み方が、ずれているだけです。"}, {"t": 55.1, "x": "今日は、よくある場面を十五個並べます。"}, {"t": 58.083333333333336, "x": "どの場面でも、見るのは同じ二つです。"}, {"t": 60.96666666666667, "x": "男が何を守ろうとしているか。"}, {"t": 63.15, "x": "女が何を確かめようとしているか。"}, {"t": 65.65, "x": "この二つが分かると、行動の意味が変わります。"}, {"t": 68.96666666666667, "x": "意味が変われば、返し方も変わります。"}, {"t": 71.73333333333333, "x": "返し方が変われば、返ってくるものも変わります。"}, {"t": 75.21666666666667, "x": "だから、覚える価値があります。"}, {"t": 77.45, "x": "覚えるといっても、難しくありません。"}, {"t": 80.21666666666667, "x": "場面ごとに、一つ思い出すだけです。"}, {"t": 82.9, "x": "まず、いちばん多い場面から見ます。"}, {"t": 85.61666666666666, "x": "連絡が減ると、受け取る側は理由を探します。"}, {"t": 89.1, "x": "男は連絡の量を、状況の反映として見やすいです。"}, {"t": 93.2, "x": "仕事が立て込んでいる。"}, {"t": 94.73333333333333, "x": "疲れている。"}, {"t": 95.65, "x": "単純に忙しい。"}, {"t": 97.11666666666666, "x": "だから、減っても関係の問題だとは考えにくいです。"}, {"t": 100.98333333333333, "x": "女は連絡の量を、関係の温度として見やすいです。"}, {"t": 104.98333333333333, "x": "減った量が、気持ちの減りに見えます。"}, {"t": 107.6, "x": "だから、不安が先に立ちます。"}, {"t": 109.95, "x": "ここで、動き方が逆になります。"}, {"t": 112.53333333333333, "x": "不安な側は、確認したくなります。"}, {"t": 115.21666666666667, "x": "確認されると、責められた気分になります。"}, {"t": 118.46666666666667, "x": "気分が悪くなると、さらに減ります。"}, {"t": 121.3, "x": "そこで、悪い方に回り始めます。"}, {"t": 124.03333333333333, "x": "止めるのは、一言で足ります。"}, {"t": 126.25, "x": "今週は忙しい、と先に言うだけです。"}, {"t": 129.28333333333333, "x": "先に言われていれば、量は問題になりません。"}, {"t": 132.58333333333334, "x": "問題になるのは、説明のない減り方だけです。"}, {"t": 136.0, "x": "説明は、短くて構いません。"}, {"t": 138.51666666666668, "x": "短い説明が、いちばん効きます。"}, {"t": 141.16666666666666, "x": "効くのに、多くの人が省きます。"}, {"t": 143.61666666666667, "x": "省く理由は、必要だと思っていないからです。"}, {"t": 146.95, "x": "省かれた側は、理由が分からないまま待ちます。"}, {"t": 150.31666666666666, "x": "待つ時間は、そのまま消耗になります。"}, {"t": 153.23333333333332, "x": "消耗した人は、次第に聞かなくなります。"}, {"t": 156.23333333333332, "x": "聞かなくなった関係は、静かに冷えます。"}, {"t": 159.23333333333332, "x": "冷える前に、状況だけ渡しておきます。"}, {"t": 162.35, "x": "渡す相手は、心配している人だけで足ります。"}, {"t": 165.65, "x": "次に、小さい決定の場面です。"}, {"t": 168.35, "x": "どこでもいい、と言われる場面があります。"}, {"t": 171.15, "x": "男はこの言葉を、そのまま受け取りやすいです。"}, {"t": 174.41666666666666, "x": "本当にどこでもいいのだ、と考えます。"}, {"t": 177.31666666666666, "x": "女はこの言葉を、\n選んでほしい合図として使うことがあります。"}, {"t": 181.73333333333332, "x": "だから、雑に決められると不満が残ります。"}, {"t": 184.91666666666666, "x": "残るのに、言葉にはしにくいです。"}, {"t": 187.45, "x": "どこでもいいと言ったのは、自分だからです。"}, {"t": 190.33333333333334, "x": "男の側は、何が悪かったのか分かりません。"}, {"t": 193.7, "x": "分からないので、同じことを繰り返します。"}, {"t": 196.68333333333334, "x": "繰り返された側は、少しずつ諦めます。"}, {"t": 199.88333333333333, "x": "諦めた後は、要望も出なくなります。"}, {"t": 202.8, "x": "出なくなると、うまくいっているように見えます。"}, {"t": 205.9, "x": "見えるだけなので、後で崩れます。"}, {"t": 208.35, "x": "崩さないためには、二択にします。"}, {"t": 210.85, "x": "和食か洋食か、と聞くだけです。"}, {"t": 213.33333333333334, "x": "二択なら、答える側も楽です。"}, {"t": 215.78333333333333, "x": "楽な形にすると、本音が出ます。"}, {"t": 218.4, "x": "本音が出れば、外しません。"}, {"t": 220.48333333333332, "x": "そして、決めた側を責めないことも大事です。"}, {"t": 223.6, "x": "選んでくれた事実に、まず礼を言います。"}, {"t": 226.58333333333334, "x": "言われた側は、次も選ぼうとします。"}, {"t": 229.35, "x": "選ぶ回数が増えると、精度も上がります。"}, {"t": 232.65, "x": "上がるまでは、多少の外れがあります。"}, {"t": 235.31666666666666, "x": "外れを責めると、また選ばなくなります。"}, {"t": 238.3, "x": "弱っている場面も、違いが出ます。"}, {"t": 240.91666666666666, "x": "男は体調が悪い時、一人にしてほしい人が多いです。"}, {"t": 245.16666666666666, "x": "弱っている姿を、見せたくない気持ちがあります。"}, {"t": 248.5, "x": "だから、そっとしておくのが優しさになります。"}, {"t": 251.6, "x": "女は体調が悪い時、気にかけてほしい人が多いです。"}, {"t": 255.75, "x": "何もしなくていいので、連絡だけは欲しい。"}, {"t": 258.93333333333334, "x": "ここで、対応が逆になります。"}, {"t": 261.3666666666667, "x": "そっとしておかれた側は、放置されたと感じます。"}, {"t": 264.8666666666667, "x": "かまわれた側は、疲れているのにと感じます。"}, {"t": 268.1333333333333, "x": "どちらも、相手のために動いています。"}, {"t": 270.8, "x": "動いた結果が、逆に届いています。"}, {"t": 273.45, "x": "だから、聞いてしまう方が早いです。"}, {"t": 276.05, "x": "一人がいいか、連絡した方がいいか。"}, {"t": 278.95, "x": "一度聞けば、次から迷いません。"}, {"t": 281.46666666666664, "x": "迷わない分、余計な誤解も消えます。"}, {"t": 284.6166666666667, "x": "消えた誤解は、二度と戻りません。"}, {"t": 287.1333333333333, "x": "一度の質問で、何年分も助かります。"}, {"t": 290.3833333333333, "x": "弱っている時の対応は、記憶に長く残ります。"}, {"t": 293.8666666666667, "x": "つらい日にどうされたかは、忘れません。"}, {"t": 296.51666666666665, "x": "忘れないので、後の判断にも効きます。"}, {"t": 299.3833333333333, "x": "効くと分かっていれば、動きやすいです。"}, {"t": 302.1, "x": "動く内容は、大きくなくて構いません。"}, {"t": 305.01666666666665, "x": "短い連絡が一通あれば、十分に伝わります。"}, {"t": 308.7, "x": "沈黙の場面も、意味が違います。"}, {"t": 311.31666666666666, "x": "男は言い過ぎないために、黙ることがあります。"}, {"t": 314.71666666666664, "x": "頭を冷やすまで、話さない方が安全だと考えます。"}, {"t": 318.73333333333335, "x": "女は黙られると、拒否されたと感じやすいです。"}, {"t": 322.21666666666664, "x": "話し合いから、降りられたように見えます。"}, {"t": 325.05, "x": "だから、追いかけて話そうとします。"}, {"t": 327.45, "x": "追いかけられた側は、逃げ場がなくなります。"}, {"t": 330.3666666666667, "x": "逃げ場がないと、強い言葉が出ます。"}, {"t": 333.1333333333333, "x": "出た言葉は、後まで残ります。"}, {"t": 335.43333333333334, "x": "残る言葉を避けるための沈黙が、逆に呼び込みます。"}, {"t": 339.3666666666667, "x": "だから、沈黙には長さを付けます。"}, {"t": 342.05, "x": "三十分だけ考えたい、と言う。"}, {"t": 344.65, "x": "言われていれば、待つ側も落ち着けます。"}, {"t": 347.3666666666667, "x": "落ち着いていれば、戻った時に話せます。"}, {"t": 350.26666666666665, "x": "戻ってくる約束を守る人は、信用されます。"}, {"t": 353.71666666666664, "x": "信用があると、次の沈黙も怖くありません。"}, {"t": 357.3833333333333, "x": "怖くない沈黙は、休憩になります。"}, {"t": 360.3333333333333, "x": "戻ってこない人も、実際にはいます。"}, {"t": 363.1, "x": "その場合は、沈黙が道具になっています。"}, {"t": 366.1666666666667, "x": "道具として使われると、こちらが折れ続けます。"}, {"t": 369.51666666666665, "x": "折れ続けた分は、後から出てきます。"}, {"t": 372.1333333333333, "x": "だから、戻る約束を守るかどうかを見ます。"}, {"t": 375.21666666666664, "x": "守る人とだけ、長い話ができます。"}, {"t": 378.1666666666667, "x": "外出の場面も、見ておきます。"}, {"t": 380.6166666666667, "x": "男は行き先と相手を、気にしやすいです。"}, {"t": 383.68333333333334, "x": "どこへ行くのか、誰と行くのか。"}, {"t": 386.1333333333333, "x": "把握できると、落ち着きます。"}, {"t": 388.3666666666667, "x": "女は出かけることを、共有したくて話します。"}, {"t": 391.6666666666667, "x": "許可を求めているわけではありません。"}, {"t": 394.03333333333336, "x": "だから、細かく聞かれると監視に感じます。"}, {"t": 397.06666666666666, "x": "感じた側は、次から言わなくなります。"}, {"t": 400.0, "x": "言わなくなると、把握はもっとできません。"}, {"t": 402.8666666666667, "x": "把握できないと、不安は増えます。"}, {"t": 405.5833333333333, "x": "悪い方に回るので、聞き方を変えます。"}, {"t": 408.5833333333333, "x": "楽しんできて、とだけ言う。"}, {"t": 410.6333333333333, "x": "気になる時は、帰る時間だけ聞きます。"}, {"t": 413.5, "x": "それ以上は、聞かないと決めておきます。"}, {"t": 416.18333333333334, "x": "決めておくと、こちらも楽になります。"}, {"t": 418.8, "x": "楽な形が、いちばん長く続きます。"}, {"t": 421.6333333333333, "x": "伝える側にも、できることがあります。"}, {"t": 424.35, "x": "誰と行くかを、先に軽く話しておきます。"}, {"t": 427.45, "x": "隠していないと分かれば、確認は減ります。"}, {"t": 430.51666666666665, "x": "減った確認は、そのまま信用になります。"}, {"t": 433.65, "x": "信用が積まれると、細かい説明が要らなくなります。"}, {"t": 437.48333333333335, "x": "要らなくなると、両方が楽になります。"}, {"t": 440.3833333333333, "x": "先の話をする場面も、ずれます。"}, {"t": 443.2, "x": "女は将来の話を、確認として出しやすいです。"}, {"t": 446.98333333333335, "x": "同じ方向を見ているかを、確かめたいだけです。"}, {"t": 450.31666666666666, "x": "男は将来の話を、決定の\n要求として受け取りやすいです。"}, {"t": 454.8833333333333, "x": "今すぐ答えを出せ、と言われた気がします。"}, {"t": 457.8833333333333, "x": "出せない時期だと、話を避けます。"}, {"t": 460.48333333333335, "x": "避けられた側は、その気がないと読みます。"}, {"t": 463.43333333333334, "x": "読み違いですが、外からは同じに見えます。"}, {"t": 466.53333333333336, "x": "だから、聞き方を変えます。"}, {"t": 468.55, "x": "いつまでに決めてほしい、ではありません。"}, {"t": 471.46666666666664, "x": "どう考えているか聞きたい、にします。"}, {"t": 474.1333333333333, "x": "考えを聞くだけなら、答えられます。"}, {"t": 476.78333333333336, "x": "答えられると、話が続きます。"}, {"t": 479.35, "x": "続けば、時期も見えてきます。"}, {"t": 481.5833333333333, "x": "見えれば、待てます。"}, {"t": 483.28333333333336, "x": "待てる形にするのが、目的です。"}, {"t": 485.75, "x": "答える側にも、決めておくと楽な形があります。"}, {"t": 489.31666666666666, "x": "今は分からない、で終わらせないことです。"}, {"t": 492.2, "x": "いつ頃に話せそうか、だけ付け足します。"}, {"t": 495.1666666666667, "x": "付け足すと、待つ側の時間が動きます。"}, {"t": 498.1166666666667, "x": "動く時間には、耐えられます。"}, {"t": 500.31666666666666, "x": "耐えられない時間は、止まった時間の方です。"}, {"t": 503.46666666666664, "x": "家族に関わる場面も、違います。"}, {"t": 506.1666666666667, "x": "男は親に会わせることを、\n区切りとして考えやすいです。"}, {"t": 510.26666666666665, "x": "だから、時期が来るまで動きません。"}, {"t": 512.7666666666667, "x": "女は会わせてもらえない期間を、\n扱いとして受け取りやすいです。"}, {"t": 517.1666666666666, "x": "本気ではないのかもしれない、と考えます。"}, {"t": 520.2333333333333, "x": "どちらも、自然な受け取り方です。"}, {"t": 522.6833333333333, "x": "自然なのに、伝わりません。"}, {"t": 524.8833333333333, "x": "伝えるには、理由を言葉にします。"}, {"t": 527.5333333333333, "x": "まだ時期ではないと考えている、と言う。"}, {"t": 530.45, "x": "言えば、扱いの問題ではなくなります。"}, {"t": 533.3333333333334, "x": "言わないと、想像で埋められます。"}, {"t": 535.7833333333333, "x": "埋められた内容は、こちらでは選べません。"}, {"t": 538.7833333333333, "x": "選べないものは、たいてい悪い方に振れます。"}, {"t const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
