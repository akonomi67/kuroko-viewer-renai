const D={"name": "付き合ってから言えなくなる本音_男女それぞれ5つずつ", "file": "087_付き合ってから言えなくなる本音_男女それぞれ5つずつ", "dur": 820.7333125, "segs": [], "subs": [{"t": 0.0, "x": "付き合う前は言えたのに、付き合ってから\n言えなくなる本音があります。"}, {"t": 4.483333333333333, "x": "今日はその本音を、男女それ\nぞれ五つずつ並べていきます。"}, {"t": 8.583333333333334, "x": "言えなくなる理由と、言えるよ\nうにする一言も添えます。"}, {"t": 12.5, "x": "付き合う前は、まだ失うものが少ない時期です。"}, {"t": 15.9, "x": "嫌われても元の距離に戻るだけで済みます。"}, {"t": 18.733333333333334, "x": "付き合った後は、守りたいものができます。"}, {"t": 21.65, "x": "二人の時間。"}, {"t": 22.716666666666665, "x": "相手からの信頼。"}, {"t": 24.133333333333333, "x": "今のいい空気。"}, {"t": 25.366666666666667, "x": "守るものが増えるほど、口に出\nせる言葉は減りやすいです。"}, {"t": 29.316666666666666, "x": "男は格好悪く見えることを恐\nれて黙りやすいと言われます。"}, {"t": 33.4, "x": "女は重いと思われることを恐\nれて黙りやすいと言われます。"}, {"t": 37.31666666666667, "x": "黙る理由は違っても、黙った\n本音は相手に届きません。"}, {"t": 41.43333333333333, "x": "相手は何も問題が無いと思って同じ毎日を続けます。"}, {"t": 45.4, "x": "悪気はどちらにもありません。"}, {"t": 47.25, "x": "言えなくなった本音は、冷め\nたしるしではありません。"}, {"t": 50.6, "x": "相手が大事になったしるしであることが多いです。"}, {"t": 53.6, "x": "ここからは男の本音と女の本音を交互に見ていきます。"}, {"t": 57.483333333333334, "x": "自分の本音と相手の本音を、\n両方探してみてください。"}, {"t": 61.56666666666667, "x": "男の一つ目は、今日は一人で休\nみたいという本音です。"}, {"t": 65.48333333333333, "x": "仕事で疲れ切った日。"}, {"t": 67.1, "x": "人と話すのがしんどい日。"}, {"t": 68.98333333333333, "x": "何もせず眠りたい日。"}, {"t": 70.63333333333334, "x": "付き合う前なら軽く断れた人も多いでしょう。"}, {"t": 73.71666666666667, "x": "付き合ってからは、断ること自体に重さが出てきます。"}, {"t": 77.38333333333334, "x": "冷めたと受け取られそうで怖いのです。"}, {"t": 79.71666666666667, "x": "だから疲れていても、約束ど\nおり会いに行こうとします。"}, {"t": 83.41666666666667, "x": "会ってはいても口数が少なく、\n目もどこか遠くを見ています。"}, {"t": 87.68333333333334, "x": "相手には、その様子が退屈し\nているように見えやすいです。"}, {"t": 91.65, "x": "無理をして会ったことが、か\nえって冷たく見えてしまうのです。"}, {"t": 95.46666666666667, "x": "男にとって一人の時間は、相手から\n離れる時間ではありません。"}, {"t": 99.96666666666667, "x": "使い切った電池をもう一度た\nめる時間であることが多いです。"}, {"t": 103.86666666666666, "x": "ためてから会う方が、二人の時間は明\nるくなりやすいです。"}, {"t": 107.83333333333333, "x": "言えるようにするには、理由と次の日を一緒に出\nすことです。"}, {"t": 111.81666666666666, "x": "今日は疲れているから明日ゆ\nっくり会いたいと伝えます。"}, {"t": 115.21666666666667, "x": "断られた感じより、大事にさ\nれた感じが残りやすい言い方です。"}, {"t": 119.93333333333334, "x": "次の日が決まっていれば相手も落ち着いて待てます。"}, {"t": 123.06666666666666, "x": "休む日を言えた男は、会う日にちゃんと笑えます。"}, {"t": 126.6, "x": "一方で女の一つ目は、本当はも\nっと会いたいという本音です。"}, {"t": 131.06666666666666, "x": "今週も会えなかった。"}, {"t": 132.63333333333333, "x": "電話が三日なかった。"}, {"t": 134.2, "x": "次の予定がまだ無い。"}, {"t": 135.76666666666668, "x": "付き合う前なら、会おうよと気軽に誘えた人もいます。"}, {"t": 139.41666666666666, "x": "付き合ってからは、同じ誘いが\n急に言いにくくなります。"}, {"t": 143.15, "x": "重いと思われたら相手が離れ\nていく気がするからです。"}, {"t": 146.51666666666668, "x": "相手の忙しさを知っているほど、\n口に出すのをためらいます。"}, {"t": 150.56666666666666, "x": "代わりに大丈夫だよと笑って見せることがあります。"}, {"t": 153.85, "x": "相手は言葉どおりに受け取ります。"}, {"t": 156.0, "x": "会う回数も、そのままです。"}, {"t": 158.18333333333334, "x": "男から見ると、何も困ってい\nないように見えやすいです。"}, {"t": 162.15, "x": "女にとって会いたいは、相手を責\nめる言葉ではありません。"}, {"t": 166.06666666666666, "x": "好きな気持ちがそのまま形に\nなっただけのことが多いです。"}, {"t": 169.7, "x": "相手の予定を責めない形にす\nると、言いやすくなります。"}, {"t": 173.73333333333332, "x": "忙しいのは分かっているけれ\nど少し顔が見たいと伝えます。"}, {"t": 177.53333333333333, "x": "短い電話だけでいいと、範囲を小\nさくするのも一つの手です。"}, {"t": 181.91666666666666, "x": "小さくお願いされると、男は応えやすいと\n言われます。"}, {"t": 185.86666666666667, "x": "会いたいと言える関係は、重い関係ではありません。"}, {"t": 189.55, "x": "素直に言い合える軽やかな関係に近\nいのかもしれません。"}, {"t": 193.28333333333333, "x": "男の二つ目は、実はお金がきついという本音です。"}, {"t": 197.11666666666667, "x": "最初のデートで選んだ背伸びしたお店。"}, {"t": 199.75, "x": "記念日の食事。"}, {"t": 201.05, "x": "誕生日の贈り物。"}, {"t": 202.68333333333334, "x": "付き合う前は、一度だけ格好をつければ済みました。"}, {"t": 206.25, "x": "付き合ってからは違います。"}, {"t": 208.01666666666668, "x": "その格好が毎月の当たり前になりやすいです。"}, {"t": 211.23333333333332, "x": "今さら安いお店にしようとは、\nなかなか言い出せません。"}, {"t": 215.0, "x": "お金の話をすると器が小さいと\n思われる気がするからです。"}, {"t": 219.15, "x": "相手には、その事情が見えていないことがあります。"}, {"t": 222.58333333333334, "x": "いつも同じようなお店なので、\nこれが好きなのだと思っています。"}, {"t": 226.73333333333332, "x": "本当は、二人とも家で食べる\n方が好きな場合もあります。"}, {"t": 230.78333333333333, "x": "お互いに相手のためだと思っ\nて無理を続 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}

  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
