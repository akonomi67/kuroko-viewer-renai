<script>
const D={"name": "笑いの意味が違う_面白い人が好きの中身は男女でここまで違う", "file": "092_笑いの意味が違う_面白い人が好きの中身は男女でここまで違う", "dur": 826.45, "segs": [], "subs": [{"t": 0.0, "x": "付き合う前の男女が、好きな\nタイプを聞かれる場面があります。"}, {"t": 4.066666666666666, "x": "そこでよく出てくる答えが面白い人です。"}, {"t": 6.816666666666666, "x": "今日はこの面白い人の中身が男女で\nどう違うかを見ていきます。"}, {"t": 11.016666666666667, "x": "先に答えを言っておきます。"}, {"t": 12.933333333333334, "x": "同じ面白いでも、指している\n人がかなり違うことが多いです。"}, {"t": 17.116666666666667, "x": "男の言う面白い人は、自分の話で笑ってくれる\n人になりやすいです。"}, {"t": 22.116666666666667, "x": "女の言う面白い人は、一緒に笑い合える\n人になりやすいです。"}, {"t": 26.566666666666666, "x": "男は笑ってほしいと思っています。"}, {"t": 29.016666666666666, "x": "女は一緒に笑いたいと思っています。"}, {"t": 31.616666666666667, "x": "男にとって笑いは届けるものです。"}, {"t": 34.016666666666666, "x": "女にとって笑いは分け合うものです。"}, {"t": 36.46666666666667, "x": "この違いを知らないと、頑張るほど空回りします。"}, {"t": 40.03333333333333, "x": "男は笑わせようとしてネタを次々に出します。"}, {"t": 43.28333333333333, "x": "女は笑わせてもらおうとして聞き役に回ります。"}, {"t": 46.56666666666667, "x": "どちらも相手に好かれたくてしていることです。"}, {"t": 49.28333333333333, "x": "それなのに相手の求める面白さとは\n少しずれてしまいます。"}, {"t": 53.166666666666664, "x": "一つの言葉に別の中身が入っているだけなのです。"}, {"t": 56.483333333333334, "x": "その中身を場面ごとに見ていきます。"}, {"t": 58.916666666666664, "x": "面白い人という言葉には二つの意味があります。"}, {"t": 62.11666666666667, "x": "一つは人を笑わせる力がある人です。"}, {"t": 64.93333333333334, "x": "もう一つは一緒にいると自然に笑ってしまう人です。"}, {"t": 68.35, "x": "男は一つ目の意味で面白いを\n使いやすいと言われます。"}, {"t": 72.1, "x": "話がうまい人や、場を沸かせる人を思い浮かべます。"}, {"t": 75.86666666666666, "x": "ただ恋人に求めるとなると話が変わります。"}, {"t": 78.93333333333334, "x": "男が好きになりやすいのは、\n自分の話で笑ってくれる人です。"}, {"t": 83.31666666666666, "x": "一方で女は二つ目の意味で面白いを\n使いやすいようです。"}, {"t": 87.41666666666667, "x": "笑わせる力より、一緒にいる時の空気を見ています。"}, {"t": 91.36666666666666, "x": "同じところで笑えるか。"}, {"t": 93.0, "x": "笑ったあとに気まずさが残らないか。"}, {"t": 95.36666666666666, "x": "くだらない話を最後まで楽しめるか。"}, {"t": 98.03333333333333, "x": "そういう、笑いが行き来するかどうかです。"}, {"t": 100.95, "x": "男の面白いは、笑いの出どころの話です。"}, {"t": 104.28333333333333, "x": "女の面白いは、笑いが二人の間で回るかの話です。"}, {"t": 108.56666666666666, "x": "だから思い浮かべる人が違ってきます。"}, {"t": 111.08333333333333, "x": "どちらかの好みが変だという話ではありません。"}, {"t": 114.21666666666667, "x": "面白いという一つの言葉に、\n別の役割を乗せているだけなのです。"}, {"t": 118.9, "x": "ここからは男の側の気持ちを見ていきます。"}, {"t": 121.85, "x": "男にとって相手を笑わせることは、\n小さな挑戦に近いです。"}, {"t": 126.26666666666667, "x": "話の組み立てを考えます。"}, {"t": 128.28333333333333, "x": "言うタイミングを計ります。"}, {"t": 130.0, "x": "相手の顔を見ながら最後のひと言を出します。"}, {"t": 133.0, "x": "そこで相手が笑ってくれる。"}, {"t": 134.78333333333333, "x": "それで挑戦は成功です。"}, {"t": 136.68333333333334, "x": "この時の気持ちはうれしさだけではありません。"}, {"t": 139.56666666666666, "x": "自分を分かってもらえた。"}, {"t": 141.23333333333332, "x": "自分のセンスが通じた。"}, {"t": 142.91666666666666, "x": "この人の前なら自分を出していい。"}, {"t": 145.23333333333332, "x": "そういう認められた感覚が生まれやすいです。"}, {"t": 148.15, "x": "逆に、話してもあまり笑ってもらえない\n相手はどうでしょう。"}, {"t": 152.18333333333334, "x": "嫌われたとまでは思いません。"}, {"t": 154.16666666666666, "x": "それでも距離を感じやすくなります。"}, {"t": 156.48333333333332, "x": "男が好きな人の前で冗談を増やすのはこのためです。"}, {"t": 160.11666666666667, "x": "目立ちたいからではありません。"}, {"t": 161.95, "x": "受け止めてもらえるかを確かめています。"}, {"t": 164.43333333333334, "x": "一方で女は、笑ってもらえたかをそこまで\n気にしないことが多いです。"}, {"t": 169.2, "x": "笑いが外れても、会話が続けば\n十分なことがあります。"}, {"t": 173.15, "x": "男の冗談はただのふざけではありません。"}, {"t": 175.91666666666666, "x": "受け止めてほしい気持ちを、\n笑いの形で出しているのです。"}, {"t": 179.85, "x": "では女の側では、\n笑いはどんな意味を持つのでしょう。"}, {"t": 183.56666666666666, "x": "女の言う面白い人には、安心という\n言葉が隠れていることがあります。"}, {"t": 188.53333333333333, "x": "初めて二人で出かけた\n日を思い浮かべてみてください。"}, {"t": 191.85, "x": "お店に入るまでの道で、少し緊張しています。"}, {"t": 195.51666666666668, "x": "メニューを選ぶ時も相手の顔色をうかがいます。"}, {"t": 198.65, "x": "そんな中で、ふと同じことで笑う瞬間があります。"}, {"t": 202.43333333333334, "x": "看板の妙な言葉のような、小さなことです。"}, {"t": 205.8, "x": "その一回で肩の力がすっと抜けることがあります。"}, {"t": 209.1, "x": "この人とは構えなくても大丈夫かもしれない。"}, {"t": 212.1, "x": "この人の前なら変な顔で笑ってもいいかもしれない。"}, {"t": 215.53333333333333, "x": "この人となら沈黙が来ても平気かもしれない。"}, {"t": 218.56666666666666, "x": "女が受け取っているのはそういう安心です。"}, {"t": 221.41666666666666, "x": "一方で男は、二人で笑えたことを\n手柄として覚えやすいです。"}, {"t": 226.0, "x": "あの話がうけ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
