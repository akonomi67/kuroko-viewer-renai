方が違うだけで、中身は同じです。"}, {"t": 168.75, "x": "だから、そっけなさで判断すると外します。"}, {"t": 171.81666666666666, "x": "外さないためには、他の人との差を見ます。"}, {"t": 174.88333333333333, "x": "自分にだけ短いのか、誰にでも短いのか。"}, {"t": 178.36666666666667, "x": "誰にでもなら、性格です。"}, {"t": 180.56666666666666, "x": "自分にだけなら、緊張の可能性があります。"}, {"t": 183.83333333333334, "x": "可能性がある間は、決めつけません。"}, {"t": 186.66666666666666, "x": "決めつけなければ、もう少し見られます。"}, {"t": 189.31666666666666, "x": "見ている間に、答えは出ます。"}, {"t": 191.66666666666666, "x": "読み違いの多い場面も、置いておきます。"}, {"t": 194.65, "x": "話しかけた時に、短く返される。"}, {"t": 197.38333333333333, "x": "目が合っても、すぐそらされる。"}, {"t": 199.51666666666668, "x": "どちらも、拒否の合図に見えます。"}, {"t": 201.96666666666667, "x": "けれども、緊張でも同じ形になります。"}, {"t": 205.01666666666668, "x": "形が同じなので、外からは区別できません。"}, {"t": 208.41666666666666, "x": "区別する材料は、一つだけです。"}, {"t": 210.98333333333332, "x": "その後に、相手から何か起きるかどうかです。"}, {"t": 214.01666666666668, "x": "少し経ってから、別の話題で戻ってくる。"}, {"t": 216.93333333333334, "x": "用のない連絡が、後から届く。"}, {"t": 219.38333333333333, "x": "これが起きるなら、拒否ではありません。"}, {"t": 221.95, "x": "男は気まずさを、時間で解こうとしやすいです。"}, {"t": 225.3, "x": "女は気まずさを、別の話題で\n埋めようとしやすいです。"}, {"t": 229.18333333333334, "x": "どちらも、戻ってくる形です。"}, {"t": 231.48333333333332, "x": "戻ってこない場合だけ、脈がありません。"}, {"t": 234.66666666666666, "x": "だから、その場では判断しません。"}, {"t": 237.13333333333333, "x": "判断は、次の一回まで待ちます。"}, {"t": 239.86666666666667, "x": "待つ間は、こちらの態度を変えません。"}, {"t": 242.65, "x": "変えると、相手も戻りにくくなります。"}, {"t": 245.45, "x": "戻りにくくすると、可能性が消えます。"}, {"t": 248.45, "x": "消さないためには、普通にしています。"}, {"t": 251.1, "x": "不器用な出方も、見ておきます。"}, {"t": 253.51666666666668, "x": "好きな相手を、からかう男がいます。"}, {"t": 256.2, "x": "子どもっぽい行動に見えます。"}, {"t": 258.15, "x": "実際、伝え方としては下手です。"}, {"t": 260.8333333333333, "x": "けれども、目的は接点を作ることです。"}, {"t": 263.8333333333333, "x": "話しかける理由が、他に思いつきません。"}, {"t": 266.8333333333333, "x": "女は逆に、距離を取ることがあります。"}, {"t": 269.71666666666664, "x": "必要以上に、近づかないようにします。"}, {"t": 272.7, "x": "理由は、意識していると気づかれたくないからです。"}, {"t": 276.0, "x": "どちらも、近づきたい気持ちから出ています。"}, {"t": 279.01666666666665, "x": "出ているのに、行動は逆向きです。"}, {"t": 281.6333333333333, "x": "逆向きなので、相手には伝わりません。"}, {"t": 284.5, "x": "伝わらないまま、時間だけが過ぎます。"}, {"t": 287.21666666666664, "x": "過ぎた時間は、戻ってきません。"}, {"t": 289.56666666666666, "x": "だから、下手な形も一度は疑います。"}, {"t": 292.48333333333335, "x": "この人は、なぜここだけ違うのか。"}, {"t": 295.01666666666665, "x": "違いがあるなら、理由があります。"}, {"t": 297.53333333333336, "x": "理由の多くは、緊張か好意です。"}, {"t": 300.2, "x": "どちらでも、悪いものではありません。"}, {"t": 302.8, "x": "悪くないと分かれば、対応が変わります。"}, {"t": 305.7, "x": "変わった対応が、次を作ります。"}, {"t": 308.26666666666665, "x": "緊張について、整理しておきます。"}, {"t": 311.05, "x": "緊張は、二つの方向に出ます。"}, {"t": 313.7, "x": "一つは、動きが増える方向です。"}, {"t": 316.3, "x": "よく喋る。"}, {"t": 317.1166666666667, "x": "声が大きくなる。"}, {"t": 318.4166666666667, "x": "冗談が増える。"}, {"t": 319.5833333333333, "x": "もう一つは、動きが減る方向です。"}, {"t": 322.3, "x": "黙る。"}, {"t": 323.3833333333333, "x": "目を合わせない。"}, {"t": 324.46666666666664, "x": "早く帰る。"}, {"t": 325.45, "x": "男は増える方向に出やすいです。"}, {"t": 327.8333333333333, "x": "女は減る方向に出やすいです。"}, {"t": 330.1, "x": "ただし、逆の人もいます。"}, {"t": 332.3, "x": "だから、性別だけでは決められません。"}, {"t": 335.1, "x": "決められないものを、決めようとすると外します。"}, {"t": 338.31666666666666, "x": "外さない方法は、比較です。"}, {"t": 340.65, "x": "他の人といる時の、その人を見ます。"}, {"t": 343.48333333333335, "x": "そこと違えば、何かが起きています。"}, {"t": 346.23333333333335, "x": "起きているものが、好意とは限りません。"}, {"t": 348.96666666666664, "x": "苦手意識でも、同じ形になります。"}, {"t": 351.78333333333336, "x": "けれども、苦手なら距離が開き続けます。"}, {"t": 354.78333333333336, "x": "好意なら、開いた後に近づいてきます。"}, {"t": 357.7, "x": "この往復の有無が、いちばん確かです。"}, {"t": 360.5, "x": "確かなものだけを、材料にします。"}, {"t": 363.2, "x": "材料が足りない時は、待ちます。"}, {"t": 365.6666666666667, "x": "人がいる場面についても、触れます。"}, {"t": 368.3333333333333, "x": "二人だと優しいのに、\n集団だと素っ気ない人がいます。"}, {"t": 372.21666666666664, "x": "逆に、集団だと明るいのに二人だと\n静かな人もいます。"}, {"t": 376.4166666666667, "x": "どちらも、よくある形です。"}, {"t": 378.6, "x": "男は周りの目を、意識しやすい場面があります。"}, {"t": 382.18333333333334, "x": "仲間の前で、好意を出すのを避けます。"}, {"t": 385.1, "x": "女は周りに知られることを、\n避けたい場合があります。"}, {"t": 388.8833333333333, "x": "噂になると、動きにくくな const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
