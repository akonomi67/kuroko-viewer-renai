<script>
const D={"name": "男は黙って甘え女は言葉で甘えている", "file": "077_男は黙って甘え女は言葉で甘えている", "dur": 750.05, "segs": [], "subs": [{"t": 0.0, "x": "今日のテーマは男女の甘え方の違いです。"}, {"t": 2.8666666666666667, "x": "好きな人に甘えたい気持ちは、\n男にも女にもあります。"}, {"t": 6.766666666666667, "x": "ところが、その出し方は正反対に\nなりやすいと言われます。"}, {"t": 10.75, "x": "男は黙って甘えます。"}, {"t": 12.516666666666667, "x": "用もないのに隣に来る。"}, {"t": 14.266666666666667, "x": "同じ部屋で同じテレビを見る。"}, {"t": 16.316666666666666, "x": "女は言葉で甘えます。"}, {"t": 18.083333333333332, "x": "今日あったことを話す。"}, {"t": 19.616666666666667, "x": "会いたいと伝える。"}, {"t": 20.85, "x": "好きかどうかを聞く。"}, {"t": 22.15, "x": "同じ気持ちなのに、外に出る形がまるで違います。"}, {"t": 25.85, "x": "そのため相手の甘えに気づか\nないまま過ぎることが多いようです。"}, {"t": 29.8, "x": "男の甘えはただの無口に見えてしまいます。"}, {"t": 32.75, "x": "女の甘えは、少し重い確認に見えることがあります。"}, {"t": 36.766666666666666, "x": "甘えに気づけないと、好きの\n気持ちも半分しか届きません。"}, {"t": 40.9, "x": "逆に甘えに気づけると、二人の距離は一気に縮\nまります。"}, {"t": 45.15, "x": "今日は甘え方の違いと、気づか\nれにくいサインを並べます。"}, {"t": 49.233333333333334, "x": "最後に、相手の甘えを上手に受\nけ取る返し方を出します。"}, {"t": 53.3, "x": "甘えというと、子どもっぽい\n姿を思い浮かべるかもしれません。"}, {"t": 57.416666666666664, "x": "けれども大人の甘えは、もう少し静かなものです。"}, {"t": 60.93333333333333, "x": "この人の前なら力を抜いても大丈夫だと信じること。"}, {"t": 64.66666666666667, "x": "それが甘えの中身に近いと言われます。"}, {"t": 67.28333333333333, "x": "頼みごととは少し違います。"}, {"t": 69.35, "x": "頼みごとは、してほしいことがはっきりしています。"}, {"t": 72.7, "x": "甘えは、してほしいことが本人にもはっきりしません。"}, {"t": 76.35, "x": "ただそばにいてほしい。"}, {"t": 77.86666666666666, "x": "気にかけてほしい。"}, {"t": 79.13333333333334, "x": "受け止めてほしい。"}, {"t": 80.38333333333334, "x": "形の無い気持ちなので、出し方に人\nそれぞれの癖が出ます。"}, {"t": 84.55, "x": "その癖が、男と女で反対向きになりやすいのです。"}, {"t": 88.35, "x": "男は形の無い気持ちを、体の動きで出しやすいです。"}, {"t": 92.36666666666666, "x": "女は形の無い気持ちを、言葉に置\nきかえて出しやすいです。"}, {"t": 96.51666666666667, "x": "どちらも相手を信じているから出てくるものです。"}, {"t": 99.46666666666667, "x": "信じていない相手に人はそもそも甘えません。"}, {"t": 102.56666666666666, "x": "甘えられているなら、それだ\nけ安心されているということです。"}, {"t": 106.5, "x": "甘えられる相手がいることは、\n大人にとって大きな支えになります。"}, {"t": 110.91666666666667, "x": "まずは男の側の甘え方から見ていきます。"}, {"t": 113.91666666666667, "x": "男の甘えは、言葉よりも距離に出やすいと\n言われます。"}, {"t": 117.66666666666667, "x": "用もないのに相手のいる部屋に来る。"}, {"t": 119.95, "x": "何も言わずにソファの隣に座る。"}, {"t": 122.31666666666666, "x": "相手が見ているテレビを、なんとなく一緒に見る。"}, {"t": 125.58333333333333, "x": "本人は甘えているつもりがないことも多いです。"}, {"t": 128.66666666666666, "x": "ただ近くにいたいだけのようです。"}, {"t": 130.75, "x": "話しかけるわけでも、何かを\n頼むわけでもありません。"}, {"t": 134.45, "x": "同じ空間にいるだけで、気持ちが\n落ち着いていきます。"}, {"t": 138.15, "x": "男にとっては、そばにいること\n自体が甘えの形なのです。"}, {"t": 142.23333333333332, "x": "隣で携帯を見ていても、気持\nちはこちらに向いています。"}, {"t": 146.18333333333334, "x": "画面を見ながら、相手の気配を感\nじて安心しています。"}, {"t": 150.15, "x": "一方で女から見ると、この甘\nえはかなり分かりにくいです。"}, {"t": 154.33333333333334, "x": "隣にいるのに話さない。"}, {"t": 156.1, "x": "こちらを見ない。"}, {"t": 157.18333333333334, "x": "それが構ってほしい合図だとは思いにくいからです。"}, {"t": 160.43333333333334, "x": "むしろ退屈そうにしているよ\nうに見えることもあります。"}, {"t": 163.7, "x": "黙ってそばに来る時、男はかなり心を開いています。"}, {"t": 167.6, "x": "女の甘えは言葉に出やすいと言われます。"}, {"t": 170.43333333333334, "x": "今日こんなことがあったと話す。"}, {"t": 172.48333333333332, "x": "会いたいと伝える。"}, {"t": 173.73333333333332, "x": "好きかどうかをときどき聞いてみる。"}, {"t": 175.75, "x": "女にとって話すことは近づくことです。"}, {"t": 178.4, "x": "言葉を交わすたびに、二人が\nつながっている感覚を得られます。"}, {"t": 182.65, "x": "だから話を聞いてもらえると、甘えが満たされます。"}, {"t": 186.25, "x": "返事の中身よりも、聞いてく\nれたことが大事なようです。"}, {"t": 189.96666666666667, "x": "好きかと聞くのも、疑っているからではありません。"}, {"t": 193.18333333333334, "x": "答えを聞いて、もう一度安心\nしたいだけの場合が多いです。"}, {"t": 197.35, "x": "何度も聞くのは、そのたびに\n安心を受け取るためです。"}, {"t": 200.93333333333334, "x": "一方で男から見ると、この甘\nえは質問に見えやすいです。"}, {"t": 205.23333333333332, "x": "質問には答えを返すものと考えるからです。"}, {"t": 208.41666666666666, "x": "答えたのにまた聞かれると、\n信じてもらえていないと感じます。"}, {"t": 212.66666666666666, "x": "けれども女は、答えの正しさを確かめてはいません。"}, {"t": 216.4, "x": "言葉のやりとりそのものを、\n甘えとして味わっています。"}, {"t": 220.18333333333334, "x": "男が甘えを口に出さないのには、\n理由があると言われます。"}, {"t": 224.33333333333334, "x": "ただし本人も、その理由に気\nづいていないことが多いです。"}, {"t": 228.28333333333333, "x": "男の子は小さいころから、弱音を吐くなと\n言われやすいです。"}, {"t": 232.48333333333332, "x": "泣かない。"} const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
