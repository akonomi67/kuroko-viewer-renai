<script>
const D={"name": "男女の友情は成立する_答えが男女で分かれる理由", "file": "094_男女の友情は成立する_答えが男女で分かれる理由", "dur": 835.7333125, "segs": [], "subs": [{"t": 0.0, "x": "男女の友情は成立するのか。"}, {"t": 2.4, "x": "この問いには、昔から答えが出ていません。"}, {"t": 5.5, "x": "今日は、二人きりで会える異性の\n友達がいる人の話です。"}, {"t": 9.666666666666666, "x": "学生時代からの友達と、今も二人で飲みに行く。"}, {"t": 13.466666666666667, "x": "そんな関係を思い浮かべてください。"}, {"t": 15.9, "x": "先に答えを言っておきます。"}, {"t": 17.816666666666666, "x": "この問いの答えは、\n男女で分かれやすいと言われます。"}, {"t": 21.35, "x": "男は成立しにくいと答える人が多いようです。"}, {"t": 24.633333333333333, "x": "女は成立すると答える人が多いようです。"}, {"t": 27.7, "x": "男は友達の中にも恋の入口を見つけやすいです。"}, {"t": 31.416666666666668, "x": "女は友達と恋人を、別の棚に分けて置きやすいです。"}, {"t": 35.7, "x": "男は相手も同じ気持ちかもしれないと\n考えやすいです。"}, {"t": 39.483333333333334, "x": "女は相手も友達だと思っているはずと\n考えやすいです。"}, {"t": 43.36666666666667, "x": "同じ時間を過ごしていても、\n見えている景色が違うのです。"}, {"t": 47.36666666666667, "x": "知らないままでいると、どうなるか。"}, {"t": 49.78333333333333, "x": "ある日ふいに、関係が崩れることがあります。"}, {"t": 53.05, "x": "どちらの答えが正しいという話ではありません。"}, {"t": 56.2, "x": "同じ問いに、別の物差しで答えているだけです。"}, {"t": 59.75, "x": "その物差しの違いを、場面ごとに見ていきます。"}, {"t": 63.2, "x": "まずは、この質問をされた瞬間のことから考えます。"}, {"t": 67.11666666666666, "x": "実はこの質問、男女で受け取り方が違いやすいです。"}, {"t": 71.15, "x": "男はこう聞かれたように感じがちです。"}, {"t": 73.76666666666667, "x": "相手を好きになる見込みは、まったくないのか。"}, {"t": 76.81666666666666, "x": "そう聞かれると、ないとは言い切れません。"}, {"t": 79.65, "x": "だから成立しにくい、という答えになります。"}, {"t": 82.93333333333334, "x": "一方で女はこう受け取りやすいと言われます。"}, {"t": 86.0, "x": "今その人と、友達として仲良くやれているか。"}, {"t": 89.43333333333334, "x": "そう聞かれれば、答えは素直にはいです。"}, {"t": 92.25, "x": "だから成立する、という答えになります。"}, {"t": 95.26666666666667, "x": "男は先のことまで含めて答えています。"}, {"t": 98.11666666666666, "x": "女は今の関係の中身で答えています。"}, {"t": 101.11666666666666, "x": "同じ言葉の質問でも見ている時間が違うのです。"}, {"t": 104.48333333333333, "x": "これを知らずに意見を比べると、話がかみ合いません。"}, {"t": 108.25, "x": "飲み会でこの話題が出たとします。"}, {"t": 110.43333333333334, "x": "答えは男女で分かれることがよくあります。"}, {"t": 113.16666666666667, "x": "男は甘いと言う。"}, {"t": 114.61666666666666, "x": "女は考えすぎと言う。"}, {"t": 116.45, "x": "お互いに相手の答えが不思議に見えます。"}, {"t": 119.18333333333334, "x": "でもどちらも、自分に聞こえた\n問いには正直に答えています。"}, {"t": 123.41666666666667, "x": "答えが食い違っているのではありません。"}, {"t": 125.96666666666667, "x": "聞こえている問いが、そもそも別のものなのです。"}, {"t": 129.15, "x": "では男はなぜ成立しにくいと\n答えやすいのでしょうか。"}, {"t": 132.8, "x": "男は仲の良い異性を少しだけ\n意識し続けやすいと言われます。"}, {"t": 137.05, "x": "普段は友達として普通に話しています。"}, {"t": 139.85, "x": "それでも心のどこかで、扉が少しだけ開いています。"}, {"t": 143.65, "x": "髪型を変えてきた日に、いつもより目が止まる。"}, {"t": 147.0, "x": "二人で歩いていると、周りから\nどう見えるかが気になる。"}, {"t": 150.78333333333333, "x": "相手に恋人ができたと聞いて、\n少しだけ胸がざわつく。"}, {"t": 154.8, "x": "そういう小さな揺れを、男は\n自分の中に見つけやすいのです。"}, {"t": 159.06666666666666, "x": "本人も、その揺れを恋だとは思っていません。"}, {"t": 162.3, "x": "ただゼロとも言い切れない。"}, {"t": 163.93333333333334, "x": "だから正直に答えると、成立しにくいになります。"}, {"t": 167.9, "x": "これは、友達を下に見ているわけではありません。"}, {"t": 171.26666666666668, "x": "むしろ相手を、異性として大事に\n思っている表れでもあります。"}, {"t": 175.6, "x": "女の人に失礼だから、と口に出さない男もいます。"}, {"t": 179.51666666666668, "x": "友達でいたいから、揺れは自分の中にしまっておく。"}, {"t": 183.25, "x": "扉は閉め切らないけれど、自分から\n開けにも行かない。"}, {"t": 187.0, "x": "男の答えの裏には、そういう\n静かな線引きがあることが多いです。"}, {"t": 191.61666666666667, "x": "成立しにくいは、壊したいという\n意味ではありません。"}, {"t": 195.18333333333334, "x": "揺れがあると認めたうえで、\n友達でいようとしている答えなのです。"}, {"t": 199.61666666666667, "x": "次に女はなぜ成立すると答えやすいのでしょうか。"}, {"t": 203.13333333333333, "x": "女は相手との関係にはっきり名前を\nつけやすいと言われます。"}, {"t": 207.23333333333332, "x": "この人は友達。"}, {"t": 208.6, "x": "この人は恋人。"}, {"t": 209.98333333333332, "x": "この人は職場の人。"}, {"t": 211.6, "x": "そうやって、心の中の棚に分けて置いていきます。"}, {"t": 215.13333333333333, "x": "一度友達の棚に置いた人は、\nそこで落ち着きやすいです。"}, {"t": 219.15, "x": "異性であることは分かっていても、\n意識の外に出ていきます。"}, {"t": 223.1, "x": "だから二人で食事をしても、\n特別な意味は薄くなります。"}, {"t": 227.11666666666667, "x": "気を張らずに話せる。"}, {"t": 228.6, "x": "恋愛の相談もできる。"}, {"t": 230.3, "x": "すっぴんで会っても平気でいられる。"}, {"t": 232.45, "x": "これが、女の言う友情の中身であることが多いです。"}, {"t": 236.16666666666666, "x": "棚を分けるのは、関係を安心して続けるための\n工夫でもあります。"}, {"t": 240.81666666666666, "x": "名前がはっきりしていれば、\n余計なことで迷わずにすみます。"}, {"t": 244.86666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
